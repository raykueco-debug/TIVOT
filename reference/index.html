/* ---------- 敵人大絕 ---------- */
// 清盤瞬間呼叫：立即重置敵大絕蓄力與延遲懲罰時間
function resetEnemyTimers(){
  clearThreat(); endCharge(); clearTimeout(ultCheckTimer);
  resetIntervalDeadline();
  // 大絕排程由新盤 loadBoard 以「開場 3 秒內」保證重排；此處僅清空
}
// ===== 多重攻擊點：畫面可同時存在多個攻擊點，但錯開生成（每 4~8 秒新增一個）=====
let threats=[];              // 每個攻擊點：{el, t0}
let threatTick=null;        // 共用倒數迴圈
const ULT_OPEN_MS=3000;                    // 開場保證：每盤 3 秒內敵方就發動大絕
function scheduleUlt(firstDelayMs){
  clearTimeout(ultCheckTimer);
  const delay = (firstDelayMs!=null) ? firstDelayMs
                                     : ULT_MIN+Math.random()*(ULT_MAX-ULT_MIN);   // v17：頻率讀該怪 ULT_MIN/MAX
  ultCheckTimer=setTimeout(()=>{
    // overkill/演出/轉場期間不生成（聖徒化期間照常出攻擊點）；不受既有攻擊點數量限制
    if(over||enemyHp<=0||cutinPlaying||transitioning){ scheduleUlt(200); return; }  // 條件未滿足 → 稍後重試
    // v16：聖徒化 cut-in 後（或雙槍／清盤後）緩衝期內敵不發動，等窗口過了再排
    if(Date.now() < enemyAtkSuppressUntil){ scheduleUlt(enemyAtkSuppressUntil - Date.now() + 50); return; }
    startCharge();
    scheduleUlt();          // 立即排下一個 → 錯開生成、可累積多個
  }, delay);
}
// 生成一次大絕。v17：Boss 可一次先後出多個點（ULT_SHOTS），每發間隔 ULT_GAP_MS。
function startCharge(){
  spawnThreat();                     // 第 1 發立即
  $('chargeWarn').classList.add('on');
  if(!threatTick){ threatTick=setInterval(updateThreats,50); }
  // 追加發（Boss=第 2 發，間隔 1 秒）：每發都各自起算蓄力窗口，形成錯位雙點
  for(let s=1; s<ULT_SHOTS; s++){
    setTimeout(()=>{
      if(over||enemyHp<=0||cutinPlaying||transitioning) return;
      spawnThreat();
      $('chargeWarn').classList.add('on');
      if(!threatTick){ threatTick=setInterval(updateThreats,50); }
    }, s*ULT_GAP_MS);
  }
}
// 更新所有攻擊點的視覺與倒數；到期則釋放
function updateThreats(){
  if(!threats.length){ stopThreatTick(); return; }
  let nearest=CHARGE_SECONDS;
  // 由後往前，方便釋放時移除
  for(let i=threats.length-1;i>=0;i--){
    const th=threats[i];
    const left=Math.max(0,CHARGE_SECONDS-(Date.now()-th.t0)/1000);
    if(left<nearest) nearest=left;
    const ratio=left/CHARGE_SECONDS;
    const size=20+90*ratio;
    th.el.style.width=size+'px'; th.el.style.height=size+'px';
    th.el.style.opacity=0.5+0.5*ratio;
    const wNP=WEAPONS[equippedWeapon] && WEAPONS[equippedWeapon].noPerfectBand;
    let col;
    if(ratio>=DEF_DEFENSE_MIN)      col='rgba(240,200,60';   // 黃圈：防一半
    else if(ratio>=DEF_PERFECT_MIN) col= wNP ? 'rgba(240,200,60'   // 狙擊：橘圈被黃圈取代（無 Perfect 帶）
                                              : 'rgba(240,140,40';  // 橘圈：Perfect 免傷
    else                            col='rgba(240,50,50';    // 紅圈：反擊窗
    th.el.style.background=`radial-gradient(circle,${col},.75),${col},.3) 60%,transparent 72%)`;
    th.el.style.borderColor=col+',.95)';
    th.el.style.boxShadow=`0 0 22px ${col},.85),inset 0 0 12px ${col},.6)`;
    if(left<=0){ releaseUlt(th); }
  }
  // 倒數數字已取消（item 1）：紅圈縮放本身即為時機提示，不再顯示秒數
}
function stopThreatTick(){
  clearInterval(threatTick); threatTick=null;
  $('chargeWarn').classList.remove('on');
}
// 某個攻擊點時間到 → 釋放攻擊，移除該點
function releaseUlt(th){
  removeThreat(th);
  if(over||cutinPlaying) return;
  enemyAttack(ULT_DAMAGE, 'ult');
  floatDmg('被擊中','45%','25%',true);   // 招式名已取消（item 1），僅保留受擊提示
}
// 兼容舊呼叫：結束/清除所有攻擊點
function endCharge(){ clearThreat(); }
function spawnThreat(){
  const layer=$('redDots');
  const dot=document.createElement('div');
  dot.className='reddot';
  const size=110;
  dot.style.width=size+'px'; dot.style.height=size+'px';
  // 位置挑選：黃圈可重疊，但橘圈／紅圈（ratio<DEF_DEFENSE_MIN 的核心）範圍不可與現有攻擊點重疊。
  const lw=layer.clientWidth||360, lh=layer.clientHeight||360;
  const coreDia=20+90*DEF_DEFENSE_MIN;      // 橘/紅核心最大直徑（px）
  const coreR=coreDia/2;
  const pxLeft=l=>l/100*lw, pxTop=t=>t/100*lh; // 圓心（left/top 為百分比，dot 以中心定位）
  let lp=20+Math.random()*60, tp=25+Math.random()*45;
  for(let tries=0;tries<40;tries++){
    const cx=pxLeft(lp), cy=pxTop(tp);
    let ok=true;
    for(const o of threats){
      const ol=parseFloat(o.el.style.left), ot=parseFloat(o.el.style.top);
      const ox=pxLeft(ol), oy=pxTop(ot);
      const dx=cx-ox, dy=cy-oy;
      if(dx*dx+dy*dy < (coreR*2)*(coreR*2)){ ok=false; break; }  // 兩核心圓相距 < 直徑 → 重疊
    }
    if(ok) break;
    lp=20+Math.random()*60; tp=25+Math.random()*45;
  }
  dot.style.left=lp+'%';
  dot.style.top=tp+'%';
  const th={el:dot, t0:Date.now()};
  dot.addEventListener('touchstart',e=>{e.preventDefault();resolveThreat(th);},{passive:false});
  dot.addEventListener('click',()=>resolveThreat(th));
  layer.appendChild(dot);
  threats.push(th);
  $('grid').classList.add('alert');
}
// 從清單移除單一攻擊點
function removeThreat(th){
  if(th.el && th.el.parentNode) th.el.remove();
  const i=threats.indexOf(th);
  if(i>=0) threats.splice(i,1);
  if(!threats.length){ $('grid').classList.remove('alert'); stopThreatTick(); }
}
// 清除全部攻擊點（清盤/overkill/聖徒化結束等）
function clearThreat(){
  threats.forEach(th=>{ if(th.el && th.el.parentNode) th.el.remove(); });
  threats=[];
  $('grid').classList.remove('alert');
  stopThreatTick();
}
// 點掉單一攻擊點 → 依剩餘時間判定 Counter / Perfect / Defense
function resolveThreat(th){
  if(!th || threats.indexOf(th)<0) return;
  const left=Math.max(0,CHARGE_SECONDS-(Date.now()-th.t0)/1000);
  const ratio=left/CHARGE_SECONDS;
  const w=WEAPONS[equippedWeapon];
  removeThreat(th);
  SFX.confirm();

  const counterWin = w ? w.counterWin : DEF_PERFECT_MIN;
  if(ratio < counterWin){
    // === Counter === 免傷 + 反擊武器大傷害　（統一特效：金色微閃）
    flashDefense('gold');
    floatDmg('COUNTER！','50%','38%',true);
    triggerAtkBuff(2);
    weaponCounter();
  }else if(!(w && w.noPerfectBand) && ratio < DEF_DEFENSE_MIN){
    // === Perfect Defense ===　（統一特效：金色微閃）
    perfectCount++;
    flashDefense('gold');
    if(w && w.perfectDamageScale){
      // 散彈槍類：Perfect 檔以傷害取代免傷（打弱化反擊，但不觸發 atkBuff、不免傷）
      floatDmg('PERFECT','50%','40%',true);
      weaponCounter(w.perfectDamageScale);
    }else{
      // 一般武器：完全免傷（狙擊槍 noPerfectBand=true 時此帶消失，落入下方 Defense）
      floatDmg('PERFECT','50%','40%',true);
    }
  }else{
    // === Defense（格擋）===　（統一特效：白色微閃）
    flashDefense('block');
    if(saintMode){
      // v18：聖徒化期間，格擋＝推進 +0.5 秒（playerMax/30），與挨大絕的 +1 秒區隔
      enemyAttack(0, 'ult', playerMax/SAINT_BLOCK_DIVISOR);
      floatDmg('BLOCK','50%','42%',false);
    }else{
      const defScale=(w && w.defenseDamageScale!=null) ? w.defenseDamageScale : 0.5;
      if(defScale<=0){
        floatDmg('BLOCK','50%','42%',false);        // 完全免傷（若有武器設 0）
      }else{
        const dmg=Math.max(1, Math.round(ULT_DAMAGE*defScale));
        enemyAttack(dmg, 'ult');                     // 依武器倍率受傷（散彈 1/4、其他 1/2；仍屬大絕受擊）
        floatDmg('BLOCK −'+dmg,'50%','42%',false);
      }
    }
  }
}
// 武器反擊：依選配武器造成多段/單發傷害，傷害視覺依 w.vfx 呈現
function weaponCounter(dmgScale){
  const w=WEAPONS[equippedWeapon];
  if(!w) return;
  const scale=(dmgScale==null)?1:dmgScale;
  counterCount++;

  if(w.vfx==='single'){
    // 狙擊：單發，跳一個較大的紅色數字
    const total=Math.max(1, Math.round(w.hits*w.dmgPerHit*scale));
    SFX.sniperShot();                        // 狙擊：更響的一發＋破空呼嘯
    enemyDamage(total, true, true);          // 靜默扣血（含 overkill/擊殺判定）
    counterDamage+=total;
    floatDmg(total, '46%','32%', false, 'snipernum');
    return;
  }
  if(w.vfx==='burst'){
    // 散彈：所有彈丸同一瞬間、同一區塊齊發，各自跳出數字
    const per=Math.max(1, Math.round(w.dmgPerHit*scale));   // 每發傷害（依檔位縮放）
    SFX.gunshot(true);
    const bx=40+Math.random()*20;            // 同一區塊的中心
    for(let k=0;k<w.hits;k++){
      enemyDamage(per, true, true);          // 靜默扣血
      counterDamage+=per;
      // 在中心附近微散開，營造「同區塊齊跳」
      floatDmg(per, (bx-6+k*3)+'%', (34+(k%2)*6)+'%', true);
    }
    return;
  }
  // 預設（重機槍等）：逐發跳出
  const per=Math.max(1, Math.round(w.dmgPerHit*scale));
  let i=0;
  const fire=()=>{
    if(over||i>=w.hits) return;
    SFX.gunshot(true);
    enemyDamage(per, true);                  // 走內建逐發數字
    counterDamage+=per;
    i++;
    if(i<w.hits) setTimeout(fire, 90);
  };
  fire();
}

// 依「門檻 key → 值」的表，挑出不超過 current 的最高門檻對應值；找不到回 fallback
function pickByThreshold(map, current, fallback){
  if(!map) return fallback;
  const keys=Object.keys(map).map(Number).filter(k=>!isNaN(k)).sort((a,b)=>a-b);
  let picked=fallback, found=false;
  for(const k of keys){ if(current>=k){ picked=map[k]; found=true; } }
  return found ? picked : fallback;
}

// 依結算數據算分並定出等第。回傳 { score, rank, flawless, execution }
function computeEvaluation(totalTime){
  // ── 規則制評價 ──
  //  S：無傷 且 ≤40 秒
  //  A：無傷（無時間上限，能無傷見到結算基本不會太慢）
  //  B：有傷 且 ≤40 秒
  //  C：有傷 且 ≤50 秒
  //  D：有傷 且 ≤60 秒
  //  E：有傷 且 >60 秒
  let rank;
  if(flawlessRun){
    rank = (totalTime<=40) ? 'S' : 'A';
  }else{
    if(totalTime<=40)      rank='B';
    else if(totalTime<=50) rank='C';
    else if(totalTime<=60) rank='D';
    else                   rank='E';
  }
  // EXP：沿用原積分作為經驗值展示（反擊/完美/無傷/處決加成）
  const ev = GAME_CONFIG.evaluation;
  let exp = 0;
  if(ev){
    const s = ev.score;
    let raw = Math.max(0, s.timeBonus.base - totalTime * s.timeBonus.perSecond);
    raw += counterDamage * s.counterCoef;
    raw += perfectCount  * s.perfectPerHit;
    if(flawlessRun)  raw *= s.flawlessMult;
    if(sawExecution) raw *= s.executionMult;
    exp = Math.round(raw);
  }
  return { score:exp, exp, rank, flawless:flawlessRun, execution:sawExecution };
}

function pickInspectorPortrait(insp){
  if(!insp) return null;
  return pickByThreshold(insp.portraits, currentFavor, insp.image||null);
}

// 依監察官 + 評價等第(或'lose') + 好感度挑一句台詞；挑不到回 null
// v17.3：boss=true 時優先用 bossDialogues（Boss 戰專屬台詞組），缺該 rank 才 fallback 回一般 dialogues。
function pickInspectorDialogue(insp, rankKey, boss){
  if(!insp) return null;
  let byRank = null;
  if(boss && insp.bossDialogues) byRank = insp.bossDialogues[rankKey];
  if(!byRank && insp.dialogues)  byRank = insp.dialogues[rankKey];
  if(!byRank) return null;
  const arr = pickByThreshold(byRank, currentFavor, null);
  if(!arr || !arr.length) return null;
  return arr[Math.floor(Math.random()*arr.length)];
}

function typeInspectorLine(el, text, total){

    if(i<chars.length){
      el.textContent = chars.slice(0,i+1).join('');

      _inspTypeTimer=setTimeout(tick, per);

  };
  tick();
}

  if(over||transitioning||cutinPlaying) return;
  // 找出尚未點掉的格子，依「當前應點順序」逐一模擬點擊，直到盤面被判定清空。
  let guard=0;
  while(!over && cells.length && guard++ < 200){
    if(cells.every(c=>c.classList.contains('done'))) break;
    let target=null;
    if(saintMode || !dualWield){
      // 有序模式（正常＋聖徒化）：點目前 expect 那格
      target=cells.find(c=>+c.dataset.num===expect && !c.classList.contains('done'));
    }
    if(!target){
      // 雙槍或找不到 expect：點任一未完成格
      target=cells.find(c=>!c.classList.contains('done'));
    }
    if(!target) break;
    const before=expect, beforeDone=cells.filter(c=>c.classList.contains('done')).length;
    tap(+target.dataset.num, target);
    // 若這次 tap 沒有推進（例如 saintMode 下點錯不前進），保險改點正確格；仍無進展則跳出防死迴圈
    const afterDone=cells.filter(c=>c.classList.contains('done')).length;
    if(afterDone===beforeDone && expect===before){
      const fix=cells.find(c=>+c.dataset.num===expect && !c.classList.contains('done'));
      if(fix && fix!==target){ tap(+fix.dataset.num, fix); }
      else break;
    }
  }
}

// 敵人框左右滑到底 → 發動聖徒化（依方向給橫斬特效）
(function bindSaintSwipe(){
  const zone=$('top');
  if(!zone) return;
  let startX=0, startY=0, tracking=false;
  const THRESH=Math.max(90, window.innerWidth*0.30);   // 需滑到底（約螢幕寬30%或90px）
  zone.addEventListener('touchstart',e=>{
    if(saintMode||saintUsedThisBattle||over||cutinPlaying) return;
    const t=e.touches[0]; startX=t.clientX; startY=t.clientY; tracking=true;
  },{passive:true});
  zone.addEventListener('touchmove',e=>{
    if(!tracking) return;
    const t=e.touches[0];
    const dx=t.clientX-startX, dy=t.clientY-startY;
    // 水平滑動為主（避免和垂直捲動混淆）
    if(Math.abs(dx)>THRESH && Math.abs(dx)>Math.abs(dy)*1.5){
      tracking=false;
      activateSaint(dx>0?'right':'left');
    }
  },{passive:true});
  zone.addEventListener('touchend',()=>{tracking=false;});
  // 桌機滑鼠拖曳也支援（方便測試）
  let mDown=false;
  zone.addEventListener('mousedown',e=>{
    if(saintMode||saintUsedThisBattle||over||cutinPlaying) return;
    mDown=true; startX=e.clientX; startY=e.clientY;
  });
  zone.addEventListener('mousemove',e=>{
    if(!mDown) return;
    const dx=e.clientX-startX, dy=e.clientY-startY;
    if(Math.abs(dx)>THRESH && Math.abs(dx)>Math.abs(dy)*1.5){
      mDown=false;
      activateSaint(dx>0?'right':'left');
    }
  });
  window.addEventListener('mouseup',()=>{mDown=false;});
})();

// ── 生命歸還（芙蕾亞主動技）：聖徒化中，在上半敵畫面「往上一滑」發動 ──
//    用專用透明層 #returnSwipe（touch-action:none，避開 Safari 捲動與格子 preventDefault）。
//    聖徒化開始時開啟(.on)、結束時關閉。
(function bindReturnSwipe(){
  const zone=$('returnSwipe');
  const aura=$('returnAura');
  if(!zone) return;
  let startY=0, startX=0, tracking=false, fired=false, moved=0;
  // 需上滑 ≥「上半高度的 25%」＝ 螢幕高 50% × 25% ＝ 螢幕高的 12.5%
  const need=()=>Math.max(48, (window.innerHeight||600)*0.125);
  const TAP_SLOP=14;   // 位移小於此值視為「點擊」而非「滑動」

  // 向心聚光：在觸摸點生成一圈向中心收束的光線
  const RAYS=12;
  function showAura(x,y){
    if(!aura) return;
    aura.style.left=x+'px'; aura.style.top=y+'px';
    if(!aura.dataset.built){
      let html='<div class="core"></div>';
      for(let i=0;i<RAYS;i++){
        const a=(360/RAYS)*i;
        html+=`<div class="ray" style="--a:${a}deg;transform:rotate(${a}deg) translateY(76px);animation-delay:${(i%4)*0.08}s"></div>`;
      }
      aura.innerHTML=html; aura.dataset.built='1';
    }
    aura.classList.add('on');
  }
  function hideAura(){ if(aura) aura.classList.remove('on'); }

  // 用座標反查底下的紅點：命中哪個 threat 就化解哪個（圓形命中判定）
  function hitThreatAt(x,y){
    if(typeof threats==='undefined' || !threats.length) return null;
    let best=null, bestD=Infinity;
    for(const th of threats){
      if(!th.el) continue;
      const r=th.el.getBoundingClientRect();
      const cx=r.left+r.width/2, cy=r.top+r.height/2;
      const rad=Math.max(r.width,r.height)/2;
      const d=Math.hypot(x-cx, y-cy);
      if(d<=rad && d<bestD){ best=th; bestD=d; }
    }
    return best;
  }

  function begin(x,y){ startX=x; startY=y; tracking=true; fired=false; moved=0; showAura(x,y); }
  function move(x,y){
    if(!tracking||fired) return;
    moved=Math.max(moved, Math.hypot(x-startX, y-startY));
    if(aura && aura.classList.contains('on')){ aura.style.left=x+'px'; aura.style.top=y+'px'; }
    const up = startY - y;
    if(up > need() && up > Math.abs(x-startX)*1.0){
      fired=true; tracking=false; hideAura();
      activateLifeReturn();
    }
  }
  // 抬手：若整段位移很小（點擊而非滑動）→ 放行給底下的紅點防禦
  function end(x,y){
    const wasTracking=tracking;
    tracking=false; hideAura();
    if(wasTracking && !fired && moved < TAP_SLOP){
      const th = hitThreatAt(x, y);
      if(th) resolveThreat(th);       // 聖徒化期間照常點紅點防禦
    }
  }

  zone.addEventListener('touchstart',e=>{ const t=e.touches[0]; begin(t.clientX,t.clientY); }, {passive:true});
  zone.addEventListener('touchmove', e=>{
    const t=e.touches[0];
    // 只有「已判定為上滑」時才 preventDefault 接管；否則保持被動，讓點擊得以判定
    if(tracking && !fired){
      const up=startY-t.clientY;
      if(up > need()*0.5) e.preventDefault();   // 開始明顯上滑才吃掉預設行為
    }
    move(t.clientX,t.clientY);
  }, {passive:false});
  zone.addEventListener('touchend', e=>{
    const t=(e.changedTouches&&e.changedTouches[0])||{};
    end(t.clientX, t.clientY);
  }, {passive:true});
  zone.addEventListener('touchcancel', ()=>{ tracking=false; hideAura(); }, {passive:true});
  zone.addEventListener('mousedown', e=>begin(e.clientX,e.clientY));
  zone.addEventListener('mousemove', e=>move(e.clientX,e.clientY));
  window.addEventListener('mouseup', e=>end(e.clientX,e.clientY));
})();


/* ---- 外部目錄資源路徑 ---- */
const ASSET_BASE = './assets/';   // 圖/音外部根目錄；正式版把圖放進 assets/enemy/<imageBase>/
/* 載入敵人立繪：優先外部目錄，逐一嘗試常見副檔名，全部失敗才 fallback 到內嵌暫代圖。
   外部路徑格式：assets/enemy/<imageBase>/portrait.<jpeg|jpg|png|webp> */
function loadEnemyPortrait(en){
  const eImg = document.getElementById('enemyImg');
  if(!eImg) return;
  const fallback = asset(en.image);         // 內嵌暫代圖
  // v17：先立刻顯示內嵌圖（避免外部探測期間仍殘留上一隻怪的立繪／延遲數秒才換），
  //      再非同步嘗試外部目錄；外部載入成功才「升級」覆蓋，失敗就維持內嵌。
  if(fallback) eImg.src = fallback;
  if(en.imageBase){
    const exts = (en.imageExt ? [en.imageExt] : ['jpeg','jpg','png','webp']);
    const base = ASSET_BASE + 'enemy/' + en.imageBase + '/portrait.';
    let i = 0;
    const tryNext = ()=>{
      if(i >= exts.length){ if(!fallback) eImg.src = ''; return; }  // 全試完 → 保持內嵌（已在上面設好）
      const probe = new Image();
      const url = base + exts[i++];
      probe.onload  = ()=>{ eImg.src = url; };   // 外部有圖 → 升級覆蓋
      probe.onerror = tryNext;
      probe.src = url;
    };
    tryNext();
  }else{
    eImg.src = fallback;
  }
}

/* ---- 換上指定敵人（開場、亂入、日後連戰共用）---- */
function setEnemy(key){
  const en = GAME_CONFIG.enemies[key];
  if(!en) return;
  currentEnemyKey = key;   // v16：記住目前怪 key，供 boardGridFor() 查每盤格數
  // 數值套入可變戰鬥狀態
  enemyMax = en.hp; enemyHp = en.hp;
  ULT_DAMAGE = en.attack;
  CHARGE_SECONDS = (en.atkInterval!=null) ? en.atkInterval : GAME_CONFIG.tuning.chargeSeconds;
  // v17：Boss 專屬大絕／懲罰參數（缺欄位＝走一般怪預設，維持原行為）
  const u = en.ult || {};
  ULT_SHOTS  = u.shots!=null ? u.shots : 1;
  ULT_GAP_MS = u.gapMs!=null ? u.gapMs : 0;
  ULT_MIN    = u.minMs!=null ? u.minMs : 4000;
  ULT_MAX    = u.maxMs!=null ? u.maxMs : 8000;
  const dp = en.delayPenalty || {};
  DELAY_PENALTY_SCALE = dp.dmgScale!=null ? dp.dmgScale : 1;
  DELAY_TIME_DELTA    = dp.timeDelta!=null ? dp.timeDelta : 0;
  const wp = en.wrongPenalty || {};
  WRONG_PENALTY_SCALE = wp.dmgScale!=null ? wp.dmgScale : 1;
  curEnemyHitFx = en.hitFx || null;   // v17.2：本怪受擊特效三件套（delay/wrong/ult）
  // 名稱與立繪
  const nameEl = document.getElementById('enemyName');
  if(nameEl) nameEl.textContent = displayEnemyName(en.name);   // v17.2：只顯示底線前的名字
  loadEnemyPortrait(en);
}
// UI 顯示名：一律隱藏「_」之後的內容（如 '地下聖徒_A' → '地下聖徒'）。
function displayEnemyName(name){ return String(name==null?'':name).split('_')[0]; }

}
