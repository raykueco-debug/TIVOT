<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CI 格率比較</title>
<!-- CI 格率／尺寸比較（ver -2055，Ray：「CI 是全螢幕的，做 12 格跟 8 格的比較看看，小圖也是，總共四組」）。
     暫時的驗收頁：素材在 resources/ci/_compare/（底線開頭，遊戲不載）。定案後連同素材一起回收。 -->
<style>
:root{--bg:#111;--fg:#e8e2d0;--dim:#8a8578;--gold:#d8b45a}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,"Microsoft JhengHei",sans-serif}
#bar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:#000c;padding:8px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
#bar button{padding:8px 10px;font-size:14px;background:#2a2a34;color:var(--fg);border:1px solid #555;border-radius:6px}
#bar button.on{border-color:var(--gold);color:var(--gold)}
#stage{position:fixed;inset:0 0 auto 0;bottom:96px;display:grid;gap:4px}
#stage.one{grid-template-columns:1fr}
#stage.four{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.cell{position:relative;overflow:hidden;background:#000}
.cell img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tag{position:absolute;left:6px;top:6px;background:#000a;padding:2px 6px;border-radius:4px;font-size:12px;color:var(--gold)}
</style></head><body>
<div id="stage" class="one"></div>
<div id="bar"></div>
<script>
(async()=>{
const base='../resources/ci/_compare/';
const meta=await (await fetch(base+'meta.json?t='+Date.now())).json();
const LAB={'16L':'現行 16格／原尺寸','12L':'A 12格／原尺寸','8L':'B 8格／原尺寸','12S':'C 12格／小圖','8S':'D 8格／小圖'};
const ORDER=['16L','12L','8L','12S','8S'];
let ci=Object.keys(meta)[0], view='12L', mode='one', timers=[];
const bar=document.getElementById('bar'), stage=document.getElementById('stage');
const urls=(c,v)=>{ const m=meta[c].v[v]; return Array.from({length:m.n},(_,i)=>base+c+'_'+v+'/frame_'+String(i).padStart(2,'0')+'.webp'); };
// 全部先載好，比較時不受網路影響
const cache={};
for(const c in meta) for(const v in meta[c].v){ cache[c+v]=urls(c,v).map(u=>{ const im=new Image(); im.src=u; return im; }); }
function stop(){ timers.forEach(clearInterval); timers=[]; }
function play(){
  stop(); stage.className=mode; stage.innerHTML='';
  const list = mode==='one' ? [view] : ['12L','8L','12S','8S'];
  for(const v of list){
    const m=meta[ci].v[v], fr=urls(ci,v);
    const cell=document.createElement('div'); cell.className='cell';
    const img=document.createElement('img'); img.src=fr[0]; cell.appendChild(img);
    const t=document.createElement('div'); t.className='tag';
    t.textContent=LAB[v]+'｜'+m.n+'格 '+m.kb+'KB 解碼'+m.decMB+'MB'; cell.appendChild(t);
    stage.appendChild(cell);
    let i=0; timers.push(setInterval(()=>{ i++; if(i>=fr.length){ return; } img.src=fr[i]; }, 1000/m.fps));
  }
}
function btn(txt, on, fn){ const b=document.createElement('button'); b.textContent=txt; if(on) b.className='on'; b.onclick=fn; bar.appendChild(b); }
function render(){
  bar.innerHTML='';
  for(const c in meta) btn(c==='nouvelle_si'?'諾薇兒聖徒化':'安雅惡夢化', c===ci, ()=>{ ci=c; render(); play(); });
  btn('單張全螢幕', mode==='one', ()=>{ mode='one'; render(); play(); });
  btn('四組並排', mode==='four', ()=>{ mode='four'; render(); play(); });
  if(mode==='one') for(const v of ORDER) btn(LAB[v], v===view, ()=>{ view=v; render(); play(); });
  btn('↺ 重播', false, play);
}
render(); setTimeout(play, 800);
})();
</script>
</body></html>
