<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<base href="../">   <!-- 整頁以專案根目錄為準：立繪與眨眼補丁的路徑都跟遊戲裡一樣 -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>眨眼預覽</title>
<!-- 眨眼成果預覽（開發工具，不進遊戲）：列出 script/blink.js 表上的立繪，用遊戲同一支 modules/blink.js 眨眼。
     經 devserver 開：http://localhost:8000/tools/blink_preview.html -->
<style>
  :root{ --bg:#14131a; --fg:#e8e2d0; --gold:#d4a94a; --card:#1e1c26; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 system-ui, "Microsoft JhengHei", sans-serif; }
  header{ position:sticky; top:0; z-index:5; background:rgba(20,19,26,.95); padding:10px 16px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; border-bottom:1px solid #333; }
  header b{ color:var(--gold); margin-right:8px; }
  button{ background:var(--card); color:var(--fg); border:1px solid #444; border-radius:6px; padding:5px 10px; cursor:pointer; font:inherit; }
  button.on{ border-color:var(--gold); color:var(--gold); }
  #grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(var(--w,220px), 1fr)); gap:12px; padding:16px; }
  .cell{ background:var(--card); border-radius:8px; overflow:hidden; }
  .view{ position:relative; overflow:hidden; aspect-ratio:var(--ar,2/3); background:#2a2833; }
  .box{ position:absolute; }
  .box > .sp-img{ position:absolute; left:0; top:0; width:100%; height:100%; display:block; }
  .sp-blink{ position:absolute; pointer-events:none; display:block; visibility:hidden; max-width:none; }
  .sp-blink.on{ visibility:visible; }
  .name{ padding:4px 8px; font-size:12px; color:#aaa; word-break:break-all; }
  .note{ color:#999; font-size:12px; }
</style>
</head>
<body>
<header>
  <b>眨眼預覽</b><span id="count" class="note"></span>
  <span id="chars"></span>
  <span style="margin-left:auto"></span>
  <button id="zoom" class="on">臉部特寫</button>
  <button id="fast">頻繁眨眼（看效果用）</button>
</header>
<div id="grid"></div>
<script type="module">
import { BLINK } from './script/blink.js';
import * as blink from './modules/blink.js';
const keys = Object.keys(BLINK).sort();
const charOf = k => k.split('_')[0];
const chars = [...new Set(keys.map(charOf))];
let cur = chars.includes('renna') ? 'renna' : chars[0], zoom = true, fast = false;
const srcOf = k => (k.startsWith('npc_') ? 'resources/si/npc/' : 'resources/si/') + k + '.webp';
document.getElementById('count').textContent = `表上 ${keys.length} 張`;
const bar = document.getElementById('chars');
for(const c of chars){
  const b = document.createElement('button'); b.textContent = `${c} (${keys.filter(k=>charOf(k)===c).length})`;
  b.onclick = ()=>{ cur=c; render(); }; b.dataset.c=c; bar.appendChild(b);
}
document.getElementById('zoom').onclick = e=>{ zoom=!zoom; e.target.classList.toggle('on', zoom); render(); };
document.getElementById('fast').onclick = e=>{ fast=!fast; e.target.classList.toggle('on', fast); render(); };
function render(){
  for(const b of bar.children) b.classList.toggle('on', b.dataset.c===cur);
  const g = document.getElementById('grid'); g.innerHTML='';
  g.style.setProperty('--w', zoom ? '260px' : '200px');
  for(const k of keys.filter(k=>charOf(k)===cur)){
    const d = BLINK[k], c = d.closed;
    const cell = document.createElement('div'); cell.className='cell';
    const view = document.createElement('div'); view.className='view';
    const box = document.createElement('div'); box.className='box';
    const im = document.createElement('img'); im.className='sp-img'; im.alt='';
    box.appendChild(im); view.appendChild(box); cell.appendChild(view);
    const nm = document.createElement('div'); nm.className='name'; nm.textContent=k; cell.appendChild(nm);
    g.appendChild(cell);
    im.onload = ()=>{
      const NW=im.naturalWidth, NH=im.naturalHeight, VW=view.clientWidth;
      if(zoom){
        // 以兩隻眼睛的框為中心，取寬 ≈ 眼框寬 × 2.6 的特寫（畫面比例 4:3）
        const cw = Math.max(c[2]*2.6, 180), ch = cw*0.75;
        view.style.setProperty('--ar','4/3');
        const s = VW / cw, cx = c[0]+c[2]/2, cy = c[1]+c[3]/2;
        box.style.width = NW*s+'px'; box.style.height = NH*s+'px';
        box.style.left = (VW/2 - cx*s)+'px'; box.style.top = (VW*0.75/2 - cy*s)+'px';
      }else{
        view.style.setProperty('--ar', NW+'/'+NH);
        box.style.width='100%'; box.style.height='100%'; box.style.left='0'; box.style.top='0';
      }
      blink.bind(box, im, ()=>true);
    };
    im.src = srcOf(k);
  }
}
// 頻繁眨眼：把模組的下一次排程縮短（只在預覽頁）—— 用一個定時器直接切補丁
setInterval(()=>{
  if(!fast) return;
  for(const box of document.querySelectorAll('.box')){
    const h=box.querySelector('.sp-blink-h'), c=box.querySelector('.sp-blink-c'); if(!h||!h.dataset.ok) continue;
    const seq=[[h,45],[c,85],[h,45],[null,0]]; let i=0;
    const step=()=>{ h.classList.remove('on'); c.classList.remove('on'); const [el,ms]=seq[i++]||[]; if(el){ el.classList.add('on'); setTimeout(step, ms); } };
    setTimeout(step, Math.random()*400);
  }
}, 1200);
render();
</script>
</body>
</html>
