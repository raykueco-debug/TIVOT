<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>卡耶爾檢怪</title>
<style>
:root{--bg:#121318;--panel:#1c1e26;--line:#2c2f3a;--ink:#e6e3dc;--dim:#8d8f99;--gold:#d8b66a;--ok:#6fbf8a;--warn:#e0a052}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,"Microsoft JhengHei",sans-serif}
#bar{position:sticky;top:0;z-index:5;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;background:#0d0e12ee;border-bottom:1px solid var(--line)}
#bar h1{font-size:16px;margin:0 8px 0 0;color:var(--gold)}#bar .sub{color:var(--dim);font-size:12px}
button{background:#2a2d38;color:var(--ink);border:1px solid #3a3e4c;border-radius:6px;padding:4px 10px;cursor:pointer;font:inherit}
button:hover{border-color:var(--gold)}button.pri{background:#5a4a24;border-color:var(--gold)}
#msg{color:var(--ok);font-size:13px}
table{border-collapse:collapse;margin:0 0 60px}
th{position:sticky;top:52px;z-index:4;background:#16171d;color:var(--dim);font-weight:600;padding:6px;border-bottom:1px solid var(--line)}
td{vertical-align:top;padding:8px;border-bottom:1px solid var(--line);border-right:1px solid #20222b}
td.head{position:sticky;left:0;z-index:3;background:var(--panel);width:180px;min-width:180px}
td.head .nm{font-size:15px;font-weight:700;color:var(--gold)}td.head .meta{color:var(--dim);font-size:11px;word-break:break-all}
td.head .btns{display:flex;gap:6px;margin:8px 0}td.head .st{font-size:12px;color:var(--dim)}
td.head .st.sub{color:var(--ok)}td.head .st.dirty{color:var(--warn)}
.cell{width:210px}.cell.chain{width:250px}.cell.empty{color:#4a4d58;text-align:center;padding-top:60px;font-size:12px}
canvas{display:block;width:200px;border-radius:4px;background:#2c2e38;cursor:pointer}.chain canvas{width:240px}
body.light canvas{background:#e8e8e8}
.info{font-size:11px;color:var(--dim);margin:3px 0}
.stc{font-size:11px}.stc.ray{color:var(--ok)}.stc.auto{color:var(--warn)}
.links{display:flex;gap:5px;flex-wrap:wrap;margin:3px 0 5px}
.links a{font-size:11px;color:var(--ink);text-decoration:none;border:1px solid #3a3e4c;border-radius:9px;padding:0 7px}
.links a:hover{border-color:var(--gold);color:var(--gold)}
td.ray{box-shadow:inset 0 0 0 2px #2f5a3d}
textarea{width:200px;min-height:50px;resize:vertical;background:#15161c;color:var(--ink);border:1px solid #33364a;border-radius:5px;padding:5px;font:13px/1.4 inherit}
.chain textarea{width:240px}td.head textarea{width:100%}
textarea:focus{outline:none;border-color:var(--gold)}textarea.has{border-color:#7a6a3a}
</style></head><body>
<div id="bar">
 <h1>卡耶爾檢怪</h1>
 <span class="sub">每列一隻怪：第一格把所有動作串起來播（I→A→I→D→I→M→I→R→I→E），後面 I／A／D／M／R／E。點畫面暫停。chk 剪完按「⬇ 輸出」約 10 秒自動換上（綠框＝你的 cut）。</span>
 <button id="bgBtn">淺底</button><button id="saveAll">全部儲存</button><button id="submitAll" class="pri">全部提交</button><span id="msg"></span>
</div>
<table><thead><tr><th>敵人</th><th>全部串播</th><th>I 待機</th><th>A 攻擊</th><th>D 延時</th><th>M 點錯</th><th>R 退回</th><th>E 倒地</th></tr></thead>
<tbody id="tb"></tbody></table>
<script>
const CHK='http://localhost:8130/player.html#',PAGE='canyonbatch',COLS=['I','A','D','M','R','E'];
const LS='canyon_batch_draft_v1',LSS='canyon_batch_submitted_v1';
const ACT=[[/_idle_v\d+$/,'I'],[/_atk_v\d+$/,'A'],[/_delay_v\d+$/,'D'],[/_miss_v\d+$/,'M'],[/_(r|ret|back)_v\d+$/,'R'],[/_(e|dead|down)_v\d+$/,'E']];
let ITEMS,STATE={},ROWS=[],notes={},submitted={},players=[];
const $=s=>document.querySelector(s);
const msg=t=>{$('#msg').textContent=t;clearTimeout(msg.t);msg.t=setTimeout(()=>$('#msg').textContent='',5000)};
try{notes=JSON.parse(localStorage.getItem(LS)||'{}');submitted=JSON.parse(localStorage.getItem(LSS)||'{}')}catch(e){}

// ---- 片段：anim.json ＋ 格；畫在立繪畫布座標上（box），所以串播時各段位置一致 ----
const clips={};
async function clip(k,v){const id=k+'?'+v;if(clips[id])return clips[id];
 const j=await (await fetch(`../../resources/enemy/anim/${k}/anim.json?${v}`)).json();
 j.imgs=[...Array(j.frames)].map((_,i)=>{const im=new Image();im.src=`../../resources/enemy/anim/${k}/frame_${String(i).padStart(2,'0')}.webp?${v}`;return im});
 return clips[id]=j}
class P{ // seq：[{clip, once}]；單一動作時 seq 只有一段
 constructor(cv){this.cv=cv;this.ctx=cv.getContext('2d');this.seq=[];this.si=0;this.i=0;this.t=0;this.paused=false;cv.onclick=()=>this.paused=!this.paused}
 set(seq){this.seq=seq;this.si=0;this.i=0;this.t=0;const c=seq[0]?.clip;if(!c)return;
  const s=Math.min(400/c.canvas[0],600/c.canvas[1]);this.s=s;this.cv.width=Math.round(c.canvas[0]*s);this.cv.height=Math.round(c.canvas[1]*s)}
 tick(dt){const sg=this.seq[this.si];if(!sg)return;const c=sg.clip;
  if(!this.paused){this.t+=dt;const per=1000/c.fps;
   while(this.t>=per){this.t-=per;this.i++;
    if(this.i>=c.frames){if(this.seq.length>1){this.i=0;this.si=(this.si+1)%this.seq.length;break}
     this.i=0;if(!c.loop)this.t-=600}}}
  const cc=this.seq[this.si].clip,im=cc.imgs[Math.min(this.i,cc.frames-1)];if(!im.complete||!im.naturalWidth)return;
  const x=this.ctx,b=cc.box;x.clearRect(0,0,this.cv.width,this.cv.height);x.drawImage(im,b[0]*this.s,b[1]*this.s,b[2]*this.s,b[3]*this.s)}}
let last=performance.now();(function loop(){const t=performance.now(),dt=Math.min(100,t-last);last=t;players.forEach(p=>p.tick(dt));requestAnimationFrame(loop)})();

function group(){const m={};ITEMS.forEach(it=>{let col='X',base=it.key;
  for(const[re,c]of ACT)if(re.test(it.key)){col=c;base=it.key.replace(re,'');break}
  (m[base]=m[base]||{base,zh:it.zh.split('・')[0],cols:{}}).cols[col]=it});return Object.values(m)}
const rowNotes=r=>{const o={};for(const k in notes)if(k.split('|')[0]===r.base&&notes[k].text.trim())o[k]=notes[k];return o};
function rowStatus(r){const el=document.getElementById('st_'+r.base);if(!el)return;const n=Object.keys(rowNotes(r)).length;
 const sub=submitted[r.base],dirty=sub&&JSON.stringify(rowNotes(r))!==sub.sig;
 el.className='st'+(sub&&!dirty?' sub':dirty?' dirty':'');
 el.textContent=n?(sub?(dirty?`${n} 則意見・提交後有改動`:`${n} 則意見・已提交 ${sub.at}`):`${n} 則意見・未提交`):(sub?'已提交（現在無意見）':'')}
function note(r,col,ta){const k=r.base+'|'+col;ta.value=(notes[k]||{}).text||'';ta.classList.toggle('has',!!ta.value.trim());
 ta.oninput=()=>{notes[k]={text:ta.value,key:(r.cols[col]||{}).key||'',at:new Date().toISOString()};ta.classList.toggle('has',!!ta.value.trim());
  localStorage.setItem(LS,JSON.stringify(notes));rowStatus(r)}}
const stHtml=k=>{const s=STATE[k]||{};return s.kind==='Ray 的 cut'?`<span class="stc ray">✔ Ray 的 cut（${s.source.replace('export/','')}，${s.at}）</span>`:`<span class="stc auto">快剪（還沒換成你的 cut）</span>`};

async function loadRow(r){ // 依 STATE 版號（mtime）載各格，再組串播
 const got={};for(const c of COLS){const it=r.cols[c];if(!it)continue;const v=(STATE[it.key]||{}).mtime||0;
  got[c]=await clip(it.key,v);const td=r.td[c];td.classList.toggle('ray',(STATE[it.key]||{}).kind==='Ray 的 cut');
  td.querySelector('.stw').innerHTML=stHtml(it.key);
  td.querySelector('.info').textContent=`${got[c].frames} 格・${(got[c].frames/got[c].fps).toFixed(2)} 秒・${got[c].loop?'循環':'單次'}`;
  td._p.set([{clip:got[c]}])}
 const seq=[],I=got.I;
 ['A','D','M','R','E'].forEach(c=>{if(got[c]){if(I)seq.push({clip:I});seq.push({clip:got[c]})}});if(I)seq.push({clip:I});
 r.chain._p.set(seq.length?seq:[]);
 r.chain.querySelector('.info').textContent=seq.length?seq.map(s=>Object.keys(got).find(c=>got[c]===s.clip)).join('→'):'—'}

function build(){const tb=$('#tb');ROWS.forEach(r=>{const tr=document.createElement('tr');r.td={};
  const h=document.createElement('td');h.className='head';
  h.innerHTML=`<div class="nm">${r.zh}</div><div class="meta">${r.base}</div><div class="btns"><button class="sv">儲存</button><button class="pri sb">提交</button></div><textarea placeholder="整體意見"></textarea><div class="st" id="st_${r.base}"></div>`;
  note(r,'*',h.querySelector('textarea'));h.querySelector('.sv').onclick=()=>save([r]);h.querySelector('.sb').onclick=()=>submit([r]);tr.appendChild(h);
  const mk=(cls,col,links)=>{const td=document.createElement('td');td.className='cell '+cls;const cv=document.createElement('canvas');const p=new P(cv);td._p=p;players.push(p);
   td.innerHTML='';td.append(cv);td.insertAdjacentHTML('beforeend',`<div class="info"></div><div class="stw"></div><div class="links">${links||''}</div>`);
   const ta=document.createElement('textarea');ta.placeholder=(col==='串'?'串起來看的':col+' ')+'意見';note(r,col,ta);td.append(ta);tr.appendChild(td);return td};
  r.chain=mk('chain','串');
  COLS.forEach(c=>{const it=r.cols[c];
   if(!it){const td=document.createElement('td');td.className='cell empty';td.innerHTML='—<br>還沒有';const ta=document.createElement('textarea');ta.placeholder=c+' 意見';note(r,c,ta);td.append(document.createElement('br'),ta);tr.appendChild(td);return}
   r.td[c]=mk('',c,`<a href="${CHK}${it.raw}" target="_blank">chk 原片</a><a href="${CHK}${it.auto}" target="_blank">chk 快剪</a><a href="${CHK}${it.game}" target="_blank">chk 已交件</a>`)});
  tb.appendChild(tr);rowStatus(r);loadRow(r)})}

async function poll(){try{const s=await (await fetch('../../resources/enemy/_neutral_refs/canyon_kf/canyon_deliver_state.json?'+Date.now())).json();
 const ch=Object.keys(s).filter(k=>(s[k].mtime||0)!==((STATE[k]||{}).mtime||0));STATE=s;
 const rows=ROWS.filter(r=>Object.values(r.cols).some(it=>ch.includes(it.key)));rows.forEach(loadRow);
 if(rows.length)msg('已換上：'+ch.map(k=>ITEMS.find(i=>i.key===k)?.zh).join('、'))}catch(e){}}

const payload=rows=>({at:new Date().toISOString(),rows:rows.map(r=>({base:r.base,zh:r.zh,
 notes:Object.fromEntries(Object.entries(rowNotes(r)).map(([k,v])=>[{'*':'整體','串':'串播'}[k.split('|')[1]]||k.split('|')[1],v]))})).filter(x=>Object.keys(x.notes).length)});
const post=async(u,b)=>(await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)})).json();
async function save(rows){localStorage.setItem(LS,JSON.stringify(notes));
 try{const r=await post('/review/save?page='+PAGE,{at:new Date().toISOString(),notes});msg(r.ok?`已儲存（${rows.length===1?rows[0].zh:'全部'}）`:'儲存失敗：'+r.error)}catch(e){msg('已存在瀏覽器（伺服器沒回應）')}}
async function submit(rows){const p=payload(rows);if(!p.rows.length){msg('沒有意見可提交');return}await save(rows);
 try{const r=await post('/review/submit?page='+PAGE,p);if(!r.ok)throw new Error(r.error);const at=new Date().toLocaleString('zh-TW',{hour12:false});
  p.rows.forEach(x=>{const row=ROWS.find(y=>y.base===x.base);submitted[x.base]={at,sig:JSON.stringify(rowNotes(row))}});
  localStorage.setItem(LSS,JSON.stringify(submitted));ROWS.forEach(rowStatus);msg(`已提交 ${p.rows.length} 隻 → ${r.path}`)}catch(e){msg('提交失敗：'+e.message)}}
$('#saveAll').onclick=()=>save(ROWS);$('#submitAll').onclick=()=>submit(ROWS);
$('#bgBtn').onclick=()=>{const on=document.body.classList.toggle('light');$('#bgBtn').textContent=on?'深底':'淺底'};

(async()=>{try{const d=await (await fetch('/review/draft?page='+PAGE)).json();if(d.notes)for(const k in d.notes)if(!notes[k]||(d.notes[k].at||'')>(notes[k].at||''))notes[k]=d.notes[k]}catch(e){}
 ITEMS=await (await fetch('canyon_batch_items.json?'+Date.now())).json();
 STATE=await (await fetch('../../resources/enemy/_neutral_refs/canyon_kf/canyon_deliver_state.json?'+Date.now())).json();
 ROWS=group();build();setInterval(poll,8000)})();
</script></body></html>
