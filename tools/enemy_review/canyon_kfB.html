<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><title>卡耶爾攻擊 B 審閱</title>
<style>body{margin:0;background:#121318;color:#e6e3dc;font:14px system-ui,"Microsoft JhengHei"}h1{font-size:16px;color:#d8b66a;padding:10px 14px;margin:0;border-bottom:1px solid #2c2f3a}
.sub{color:#8d8f99;font-size:12px;padding:6px 14px}.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:12px;padding:14px}
.c{background:#1c1e26;border:1px solid #2c2f3a;border-radius:8px;padding:10px}.n{color:#d8b66a;font-weight:700}.p{display:flex;gap:8px}
.p div{flex:1;text-align:center;font-size:12px;color:#8d8f99}.p img{width:100%;border-radius:4px;background:#24262e;background-image:linear-gradient(45deg,#2c2e37 25%,transparent 25%,transparent 75%,#2c2e37 75%),linear-gradient(45deg,#2c2e37 25%,transparent 25%,transparent 75%,#2c2e37 75%);background-size:16px 16px;background-position:0 0,8px 8px}</style></head><body>
<h1>卡耶爾攻擊 B 審閱（6 張，GPT 出、透明背景）</h1><div class="sub">左＝A（現行立繪＝中立），右＝B（打到那一瞬間，揮動部位帶動態模糊）。看過沒問題才送 Kling（橫式 16:9、AB、3 秒，每支 30 點，共 180 點）。</div><div class="g" id="g"></div>
<script>
const R='../../resources/enemy/',K=R+'_neutral_refs/canyon_kf/';
[['香爐蠍','尾鎚攻擊','mon_canyon_censer_dark','kf_canyon_censer_A_tailslam'],['餓獸','撲咬','mon_canyon_houndbeast','kf_canyon_houndbeast_A_bite'],['鐘殼蟲','雙鉗撲擊','mon_canyon_bellmite_dark','kf_canyon_bellmite_A_pincer'],
 ['鎖鏈餓犬','撲咬','mon_canyon_chainhound_dark','kf_canyon_chainhound_A_bite'],['提燈小鬼','砸燈','mon_canyon_lanternimp_dark','kf_canyon_lanternimp_A_smash'],['爬行朝聖者','撲爪','mon_canyon_crawler_dark','kf_canyon_crawler_A_claw']]
.forEach(([zh,act,a,b])=>g.insertAdjacentHTML('beforeend',`<div class="c"><div class="n">${zh}・A ${act}</div><div class="p"><div><img src="${R}${a}.webp">A 中立</div><div><img src="${K}${b}.png?${Date.now()}">B ${act}</div></div></div>`))
</script></body></html>
