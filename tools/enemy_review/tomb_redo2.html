<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>古墓重出 B 審閱</title>
<style>
:root{--bg:#1a1a30;--fg:#eee;--chk1:#2a2a48;--chk2:#22223c}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Microsoft JhengHei",sans-serif}
h1{font-size:18px;margin:12px 16px}
.note{margin:0 16px 12px;font-size:13px;color:#bbb}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:16px;padding:0 16px 24px}
.card{background:#111126;border-radius:8px;padding:10px}
.card h2{font-size:16px;margin:0 0 4px;color:#ffe08a}
.card p{font-size:13px;margin:0 0 8px;color:#ccc}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pair figure{margin:0;text-align:center;font-size:12px;color:#aaa}
.pair img{width:100%;aspect-ratio:2/3;object-fit:contain;cursor:zoom-in;
 background:conic-gradient(var(--chk1) 25%,var(--chk2) 0 50%,var(--chk1) 0 75%,var(--chk2) 0) 0 0/24px 24px;border-radius:4px}
#zoom{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;cursor:zoom-out}
#zoom img{max-width:96vw;max-height:96vh}
</style></head><body>
<h1>伊甸古墓：重出的攻擊 B（抬棺列已回收）（11-22）</h1>
<div class="note">左＝原圖 A（中立）、右＝新 B（GPT 真透明）。點圖放大。點頭才跑 Wan。</div>
<div class="grid" id="g"></div>
<h1>骷髏塚：散骨（攻擊時程式讓它們高速飛向鏡頭）</h1>
<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(120px,1fr))" id="bones"></div>
<div id="zoom"><img></div>
<script>
const R='../../resources/enemy/_neutral_refs/tomb_kf/';
const L=[
 ['arch_warden','拱門守衛','拱門陰影裡鑽出怪物，雙爪撲向鏡頭'],
 ['crypt_hound','墓犬','正面撲向鏡頭（⚠ 嘴是齜牙，沒張口咬下）'],
 ['chain_hanged','吊鍊屍','盪過來、雙爪往鏡頭耙；比原圖大（去背重做：GPT 重繪）'],
 ['reliquary_hand','聖匣之手','五指朝鏡頭抓（去背重做：GPT 重繪）'],
 ['grave_censer','墓香爐','雙香爐用鏈條甩向鏡頭（11-22 改：用甩的）'],
];
const g=document.getElementById('g');
for(const [n,t,d] of L){
  const c=document.createElement('div'); c.className='card';
  c.innerHTML=`<h2>${t} <small>${n}</small></h2><p>${d}</p><div class="pair">
   <figure><img src="${R}src/mon_${n}.png"><figcaption>A 原圖</figcaption></figure>
   <figure><img src="${R}tb_${n}_B.png?t=${Date.now()}"><figcaption>新 B</figcaption></figure></div>`;
  g.appendChild(c);
}
const bz=document.getElementById('bones');
for(let i=0;i<17;i++){ const c=document.createElement('div'); c.className='card'; c.innerHTML=`<div class="pair" style="grid-template-columns:1fr"><figure><img src="../../resources/enemy/fx/skull_cairn_bones/bone_${String(i).padStart(2,'0')}.webp" style="aspect-ratio:1"><figcaption>bone_${String(i).padStart(2,'0')}</figcaption></figure></div>`; bz.appendChild(c); }
bz.addEventListener('click',e=>{ if(e.target.tagName==='IMG'){ z.querySelector('img').src=e.target.src; z.style.display='flex'; }});
const z=document.getElementById('zoom');
g.addEventListener('click',e=>{ if(e.target.tagName==='IMG'){ z.querySelector('img').src=e.target.src; z.style.display='flex'; }});
z.addEventListener('click',()=>z.style.display='none');
</script></body></html>
