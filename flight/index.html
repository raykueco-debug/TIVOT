function glMassInit(){
  if(glMassProg || !GLX) return;
  const g=GLX;
  glMassProg=g.createProgram();
  g.attachShader(glMassProg,glSh(g.VERTEX_SHADER,GL_MASS_VS));
  g.attachShader(glMassProg,glSh(g.FRAGMENT_SHADER,GL_MASS_FS));
  g.linkProgram(glMassProg);
  if(!g.getProgramParameter(glMassProg,g.LINK_STATUS)){
    console.warn('[gl] 量體 shader 連結失敗', g.getProgramInfoLog(glMassProg)); glMassProg=null; return; }
  for(const n of ['uBuf','uCam','uDir','uOrigin','uRot','uAtlas','uWall','uAlpha','uFog','uFogK'])
    glMassU[n]=g.getUniformLocation(glMassProg,n);
  /* ⚠ 設 uniform **之前一定要 useProgram** —— 不然是 INVALID_OPERATION(1282)，
     而且 `gl.getError()` 不看的話完全沒有症狀（sampler 停在 0，屋頂會去取到
     高度圖那張貼圖）。踩過一次。 */
  g.useProgram(glMassProg);
  g.uniform1i(glMassU.uAtlas,6);
}

/* 一座城的量體網格（懶建：要等 cityMass 與 atlas 都到位）。 */
function glMassBuild(s){
  const key=s.plan; if(!key || glMass[key]!==undefined) return glMass[key];
  const MS=cityMass[key], MA=cityMassArt[key], img=cityPlanLo[key]||cityPlanArt[key];
  if(!MS || !MA || !img || !img.width) return null;     // 還沒到位，下一禎再試
  glMassInit(); if(!glMassProg) return null;
  const g=GLX;
  const hw=s.planW*0.5, hh=hw*img.height/img.width, tall=s.planTall||0;
  const V=[];
  const push=(x,y,z,nx,ny,k,u,v)=>{ V.push(x,y,z,nx,ny,k,u,v); };
  for(let i=0;i<MS.n;i++){
    const au=MS.pu[i], av=MS.pv[i], NS=au.length, hW=MS.h[i]*tall;
    if(hW<=0.5) continue;
    /* 牆：每條邊一個四邊形（地面 → 屋頂高）。 */
    for(let k=0;k<NS;k++){
      const k2=(k+1)%NS;
      const ax=au[k]*hw, ay=av[k]*hh, bx=au[k2]*hw, by=av[k2]*hh;
      let nx=(by-ay), ny=-(bx-ax); const nl=Math.hypot(nx,ny)||1; nx/=nl; ny/=nl;
      push(ax,ay,0,nx,ny,0,0,0); push(bx,by,0,nx,ny,0,0,0); push(bx,by,hW,nx,ny,0,0,0);
      push(ax,ay,0,nx,ny,0,0,0); push(bx,by,hW,nx,ny,0,0,0); push(ax,ay,hW,nx,ny,0,0,0);
    }
    /* 屋頂：一個四邊形蓋住這一塊的外框，貼 atlas 上屬於它的那一格。
       ⚠ atlas 那一格自己帶 alpha（街廓的形狀），所以不必 clip。 */
    const ax2=MS.bb[i*4], ay2=MS.bb[i*4+1], bw2=MS.bb[i*4+2], bh2=MS.bb[i*4+3];
    if(bw2<1||bh2<1) continue;
    const gx0=MS.bbx[i*4], gy0=MS.bbx[i*4+1], gx1=MS.bbx[i*4+2], gy1=MS.bbx[i*4+3];
    const u0=ax2/MS.aw, v0=ay2/MS.ah, u1=(ax2+bw2)/MS.aw, v1=(ay2+bh2)/MS.ah;
    const X0=gx0*hw, Y0=gy0*hh, X1=gx1*hw, Y1=gy1*hh;
    push(X0,Y0,hW,0,0,1,u0,v0); push(X1,Y0,hW,0,0,1,u1,v0); push(X1,Y1,hW,0,0,1,u1,v1);
    push(X0,Y0,hW,0,0,1,u0,v0); push(X1,Y1,hW,0,0,1,u1,v1); push(X0,Y1,hW,0,0,1,u0,v1);
  }
  if(!V.length){ glMass[key]=null; return null; }
  const vao=g.createVertexArray(); g.bindVertexArray(vao);
  const vb=g.createBuffer(); g.bindBuffer(g.ARRAY_BUFFER,vb);
  g.bufferData(g.ARRAY_BUFFER,new Float32Array(V),g.STATIC_DRAW);
  const ST=8*4;
  const bind=(nm,size,off)=>{ const L=g.getAttribLocation(glMassProg,nm);
    if(L<0) return; g.enableVertexAttribArray(L); g.vertexAttribPointer(L,size,g.FLOAT,false,ST,off); };
  bind('p',3,0); bind('nrm',2,12); bind('kind',1,20); bind('uv',2,24);
  g.bindVertexArray(null);
  const tex=g.createTexture();
  g.activeTexture(g.TEXTURE6); g.bindTexture(g.TEXTURE_2D,tex);
  g.texImage2D(g.TEXTURE_2D,0,g.RGBA8,g.RGBA,g.UNSIGNED_BYTE,MA);
  g.generateMipmap(g.TEXTURE_2D);
  g.texParameteri(g.TEXTURE_2D,g.TEXTURE_MIN_FILTER,g.LINEAR_MIPMAP_LINEAR);
  g.texParameteri(g.TEXTURE_2D,g.TEXTURE_MAG_FILTER,g.LINEAR);
  g.texParameteri(g.TEXTURE_2D,g.TEXTURE_WRAP_S,g.CLAMP_TO_EDGE);
  g.texParameteri(g.TEXTURE_2D,g.TEXTURE_WRAP_T,g.CLAMP_TO_EDGE);
  glMass[key]={ vao, n:V.length/8, tex };
  console.log('[gl] 量體網格 '+key.split('/').pop()+'：'+MS.n+' 塊 / '+(V.length/8)+' 頂點');
  return glMass[key];
}
function glMassHas(key){ return !!(key && glMass[key]); }

/* 畫一座城的量體。⚠ 濃度 `massA` **由 CPU 那一支算**（淡入淡出、遲滯、
   -1195 的逐塊門檻都在那裡）—— 這裡只讀，不另算一份（鐵律 7）。 */
function glDrawMass(s, massA, sinp, cosp, fr, fg, fb){
  const M=glMass[s.plan]; if(!M || !(massA>0.003)) return;
  const g=GLX;
  g.useProgram(glMassProg);
  g.enable(g.DEPTH_TEST); g.depthFunc(g.LEQUAL);
  g.enable(g.BLEND); g.blendFunc(g.SRC_ALPHA, g.ONE_MINUS_SRC_ALPHA);
  g.uniform2f(glMassU.uBuf,BW,BH);
  g.uniform3f(glMassU.uCam,cam.x,cam.y,cam.alt);
  g.uniform2f(glMassU.uDir,sinp,cosp);
  g.uniform3f(glMassU.uOrigin, s.mx*MAP_SCALE, s.my*MAP_SCALE, s.gh);
  const rot=s.planRot||0;
  g.uniform2f(glMassU.uRot, Math.cos(rot), Math.sin(rot));
  const wc=glCss4(s.wallCol||'rgba(34,30,26,0.62)');
  g.uniform4f(glMassU.uWall, wc[0],wc[1],wc[2],wc[3]);
  g.uniform1f(glMassU.uAlpha, massA);
  g.uniform3f(glMassU.uFog, fr/255, fg/255, fb/255);
  g.uniform1f(glMassU.uFogK, 1);
  g.activeTexture(g.TEXTURE6); g.bindTexture(g.TEXTURE_2D,M.tex);
  g.bindVertexArray(M.vao);
  g.drawArrays(g.TRIANGLES,0,M.n);
  g.bindVertexArray(null);
  g.disable(g.BLEND);
}
/* 帶 alpha 的色字串 → [r,g,b,a]（0..1）。 */
function glCss4(c){
  const m=/rgba?\(([^)]+)\)/.exec(c);
  if(m){ const v=m[1].split(',').map(Number);
         return [v[0]/255, v[1]/255, v[2]/255, v.length>3?v[3]:1]; }
  const r=glCss3(c); return [r[0],r[1],r[2],1];
}

function render(now){
  const S=sky(), SC=skyColors(S);
  const scaleH=BH*0.62;
  const horizon=BH*HORIZON_F;

  for(let y=0;y<BH;y++){
    const t=clamp(y/Math.max(1,horizon),0,1), tt=t*t;
    const sr=lerp(SC.top[0],SC.hz[0],tt), sg=lerp(SC.top[1],SC.hz[1],tt), sb=lerp(SC.top[2],SC.hz[2],tt);
    const row=y*BW, br=(y&3)<<2;
    SKYROW[y]=rgb(sr|0,sg|0,sb|0);        // 未抖動的純天空色，輪廓混色用
    /* ⚠ GLON：天空由 shader 讀 SKYROW 那張 1×BH 貼圖畫，這裡**不必填 bufU32**
       —— 那一整片算完就丟。抖色也交給 shader（Stage 1b 還沒接，先不抖）。 */
    if(GLON && glReady) continue;
    // 天空是整片平滑漸層 → 8bit 量化會出色帶，逐像素套 Bayer 打散
    for(let x=0;x<BW;x++){
      const d=BAYER[br|(x&3)]*DITHER;
      bufU32[row+x]=rgb(clamp(sr+d,0,255)|0,clamp(sg+d,0,255)|0,clamp(sb+d,0,255)|0);
    }
  }
  for(let i=0;i<BW;i++){ ybuf[i]=BH; prevH[i]=-9999; topFrac[i]=0; }
  /* 深度階梯的快照來源。ybuf 開了 512 格（最大緩衝寬），只有前 BW 格有效，
     整排 set 進去會把後面的垃圾一起搬走 —— 每幀取一次 view 就好。 */
  const ybufRow=ybuf.subarray(0,BW);
  let zsNext=0;

  /* 光照。⚠ terrain_generator.py 已把 hillshade 烘進地貌色，
     這裡的方向項刻意做弱（LIGHT_DIR_K），只負責「日月移動的味道」，
     不跟烘焙陰影打架；主要靠色溫變化表現晝夜。 */
  /* ⚠ 這個係數曾經是 0.0045，等於把方向光關掉：實測中間 50% 的地表
     亮度只差 3%（nl 四分位距 0.587~0.653）——山不會因為朝向而亮暗，
     立體感全靠貼圖裡烘死的 hillshade，整片大陸就成了色塊拼貼。
     拉高到 0.030 並把環境光壓低，受光/背光才拉得開。 */
  const LIGHT_DIR_K=0.030;
  /* 光源在日月之間過渡：白天跟太陽走，入夜交給固定在西邊的銀月。
     ⚠ 方向也要換，不然夜裡的明暗面還停在太陽落下前的位置，
       月亮明明在西邊、山的受光面卻在東邊。 */
  const lx=lerp(Math.cos(MOON_AZ),Math.cos(S.az),S.day);
  const ly=lerp(Math.sin(MOON_AZ),Math.sin(S.az),S.day);
  /* ⚠⚠ **光的方向發佈出去**（ver -1108）：地表以外的東西（遺蹟的立面…）要用
     **同一個**方向，不然同一個畫面上兩套光源 —— 而且這個方向會隨日月移動，
     抄一份寫死的一定走鐘（鐵律 7：算的那一支把結果發佈，其他人只讀）。 */
  lightXY.x=lx; lightXY.y=ly;
  const moonI=lerp(MOON_LIT,0.04,S.day);
  const sunI=clamp(S.el*0.85+0.20,0.05,0.50)+moonI;
  const ambI=lerp(0.46,0.52,S.day);   // 降低環境光：背光面要真的暗得下來
  // 月光是銀色：冷但不藍到發紫，飽和度低於原本的夜色
  /* ⚠ 夕陽的暖色**靠抬綠**，不是靠壓綠壓藍。原本 (1.20,0.88,0.72) 的綠壓得比藍多，
     整片地形被推向洋紅／鮭紅——那個色相在這個遊戲裡是「受擊」的訊號，
     玩家會誤讀成正在被攻擊。改成綠只比紅低一點點，色相就落在金黃而不是紅。 */
  const lightR=lerp(lerp(0.80,1.0,S.day),1.14,S.dusk);
  const lightG=lerp(lerp(0.86,1.0,S.day),1.02,S.dusk);
  const lightB=lerp(lerp(1.04,1.0,S.day),0.76,S.dusk);

  /* 當幀的光照存起來：城是畫在自己的緩衝上的，拿不到這些區域變數，
     但它必須跟地面吃**同一盞燈**，否則黎明黃昏時城會亮得像另一個時區。 */
  LIT.amb=ambI; LIT.sun=sunI; LIT.r=lightR; LIT.g=lightG; LIT.b=lightB;
  /* 霧色也發佈（ver -1207）：量體層搬到 GL 之後那邊也要同一份 ——
     自己再 `skyColors()` 算一次就是鐵律 7 的病。 */
  LIT.fr=SC.hz[0]; LIT.fg=SC.hz[1]; LIT.fb=SC.hz[2];

  const sinp=Math.sin(cam.angle), cosp=Math.cos(cam.angle);
  /* ══⚠⚠ 當幀的投影常數**發佈**出去（ver -1146）══
     `pickTerrain()`（點飛行畫面插釘選）要把螢幕上的一點反解回地圖座標，
     用的必須是**這一幀真的畫出來的那一組**。自己照著式子再算一次就是鐵律 7 的病：
     `cam.angle` 每幀都在動，而 `scaleH`／`horizon` 還吃 `BH` 與 `HORIZON_F`
     （畫質檔一變就跟著變）—— 兩處各算一次，點下去的位置就會與看到的差一截。
     ⚠ 這裡只「寫」，其他人只「讀」。 */
  PROJ.scaleH=scaleH; PROJ.horizon=horizon; PROJ.sinp=sinp; PROJ.cosp=cosp; PROJ.ok=true;
  const FOGS=ZFAR*FOG_START;
  const fr=SC.hz[0], fg=SC.hz[1], fb=SC.hz[2];
  /* ⚠ 不取整。原本 (now*0.006)|0 每 167ms 才跳一個地圖像素（＝20 世界單位），
     位移是整數台階 → 看起來就是 6fps 的抽動，跟畫面的 60fps 無關。
     速度維持不變，只是改成連續值，再配合下方的雙線性取樣才會順。 */
  const cloudScroll=now*0.006;
  const cloudLit=lerp(0.80,1.0,S.day);   // 銀月照著，夜裡的雲不該是灰的

  let z=1.0, dz=0.75;
  /* ══⚠⚠⚠ GLON：地形改由 shader 畫，這裡只留「逐欄地平線」（ver -1201）══
     下面那一大圈（約 350 行：地貌貼圖層、崖面、瀑布、抖色、城的取樣…）在
     `?gl=1` 之下**算完就丟** —— 畫面上看到的全部是 GL 畫的。所以拿掉它是
     **純效能改動，視覺零變化**（與 Stage 1a 的畫面一模一樣）。
     但 `ybuf`／`ZTOP` 還得留著：那八個 `clipByTerrainDepth` 的呼叫者
     （量體層、遺蹟、火車、炊煙、地標、船、怪）還在 2D 那張畫布上，
     要靠它做遮擋。等那些也搬進 GL、改吃深度測試，這一段就能整個刪掉。
     ⚠ 粗版就夠：遮擋只要近似。實測 dz×2＋隔欄取樣，地平線與精確版**誤差 0**，
       而成本由 1.005ms 降到 0.345ms（試作 ver -1198 量的）。
     ⚠ 隔欄沒算到的那幾欄取鄰欄的**較小值**（＝地平線較高）——
       遮擋寧可多擋一點，也不要讓該被擋住的東西露出來。
     ⚠⚠ `PICK3D`（管理人右鍵點地形）在 GLON 下不會被填 —— 那是開發用工具，
       等 overlay 都搬完會改由深度緩衝反解。 */
  if(GLON && glReady){
    const CS=2, DM=2;
    let zh=1.0, dzh=0.75*DM;
    while(zh<ZFAR){
      while(zsNext<ZSLICES && ZS_BOUND[zsNext]<=zh){ ZTOP.set(ybufRow,zsNext*BW); zsNext++; }
      let plx=(-cosp*zh-sinp*zh)+cam.x, ply=(sinp*zh-cosp*zh)+cam.y;
      const prx=(cosp*zh-sinp*zh)+cam.x, pry=(-sinp*zh-cosp*zh)+cam.y;
      const ddx=(prx-plx)/BW*CS, ddy=(pry-ply)/BW*CS, invz=1/zh;
      for(let i=0;i<BW;i+=CS){
        const xi=(plx*INV_SCALE)|0, yi=(ply*INV_SCALE)|0;
        plx+=ddx; ply+=ddy;
        const out=(xi<0||yi<0||xi>=MAPW||yi>=MAPH);
        const th=out?0:HGT[yi*MAPW+xi];
        const hh=(out||th<=CLOUD_H)?CLOUD_H:th;
        let y=(((cam.alt-hh)*invz + zh*curvK[i])*scaleH+horizon)|0;
        if(y<0) y=0;
        if(y<ybuf[i]) ybuf[i]=y;
      }
      zh+=dzh; dzh+=0.011*DM;
    }
    for(let i=1;i<BW;i+=CS){
      const a=ybuf[i-1], b=(i+1<BW)?ybuf[i+1]:a;
      ybuf[i]=a<b?a:b;
    }
    z=ZFAR;                                  // ⚠ 讓下面那一大圈整個跳過
  }
  while(z<ZFAR){
    /* 跨過切片界線就存一次快照。此刻 ybuf 裡是所有深度 < z 的地形，
       而 ZS_BOUND[zsNext] ≤ z，正好是「比這個界線近的東西」。 */
    while(zsNext<ZSLICES && ZS_BOUND[zsNext]<=z){ ZTOP.set(ybufRow,zsNext*BW); zsNext++; }
    /* 城的取樣層級（ver -445）：每個深度步進挑一次就好 —— 同一步進整排欄位
       深度相同。準則同 §6.7 的預縮圖通則：texel 的世界尺寸 ≥ 這個深度下
       一個緩衝像素的世界寬（2z/BW），否則一個像素跨多個 texel，移動就閃。 */
    if(CITY_SAMPS){
      const wpp=2*z/BW;
      for(let c9=0;c9<CITY_SAMPS.length;c9++){
        const C9=CITY_SAMPS[c9], Ls=pyrLevels(C9.key);   // ⚠ 佔位要補建（ver -1305）
        if(!Ls){ C9.cur=null; continue; }
        let li=0;
        while(li+1<Ls.length && (C9.planW/Ls[li].w)<wpp*CITY_LOD_K) li++;
        C9.cur=Ls[li];
      }
    }
    let plx=(-cosp*z-sinp*z)+cam.x, ply=(sinp*z-cosp*z)+cam.y;
    const prx=(cosp*z-sinp*z)+cam.x, pry=(-sinp*z-cosp*z)+cam.y;
    const ddx=(prx-plx)/BW, ddy=(pry-ply)/BW;
    const fog=clamp((z-FOGS)/(ZFAR-FOGS),0,1)*FOG_MAX;
    const invz=1/z;
    /* 林草層的強度隨深度淡出（近景滿、GEO_FAR 之後歸零）。
       每個 z 步進算一次就好 —— 同一步進的整排欄位深度相同。 */
    const vegAmt=GEO_AMP*(z<GEO_FAR?1-(z/GEO_FAR)*(z/GEO_FAR):0);
    const vegOn=vegAmt>0.004;

    for(let i=0;i<BW;i++){
      // 世界座標 → 地圖像素
      const mfx=plx*INV_SCALE, mfy=ply*INV_SCALE;
      const xi=mfx|0, yi=mfy|0;
      let hh,r,g,b,isRiver=0;
      const outside=(xi<0||yi<0||xi>=MAPW||yi>=MAPH);
      const mi=outside?0:yi*MAPW+xi;
      const th=outside?0:HGT[mi];
      if(outside||th<=CLOUD_H){
        /* 雲海：連續位移 + 雙線性取樣。位移與取樣都不再有整數台階，
           流動才會順（原本兩者都是整數，雲每 167ms 才動一格）。
           ⚠ 先加 4096（CT 的倍數）確保為正：負數的 |0 是往零截斷，
             小數部分會變成負的，內插權重就全錯了。 */
        const cfx=mfx+cloudScroll+4096, cfy=mfy+cloudScroll+4096;
        const cx0=cfx|0, cy0=cfy|0, cu=cfx-cx0, cv=cfy-cy0;
        const rw0=(cy0&CTM)*CT, rw1=((cy0+1)&CTM)*CT;
        const cA=cx0&CTM, cB=(cx0+1)&CTM;
        const j00=rw0+cA, j10=rw0+cB, j01=rw1+cA, j11=rw1+cB;
        const w00=(1-cu)*(1-cv), w10=cu*(1-cv), w01=(1-cu)*cv, w11=cu*cv;
        hh=CLOUD_H+(CLOUDH[j00]*w00+CLOUDH[j10]*w10+CLOUDH[j01]*w01+CLOUDH[j11]*w11);
        const q00=CLOUDTEX[j00], q10=CLOUDTEX[j10], q01=CLOUDTEX[j01], q11=CLOUDTEX[j11];
        r=((q00&255)*w00+(q10&255)*w10+(q01&255)*w01+(q11&255)*w11)*cloudLit;
        g=(((q00>>8)&255)*w00+((q10>>8)&255)*w10+((q01>>8)&255)*w01+((q11>>8)&255)*w11)*cloudLit;
        b=(((q00>>16)&255)*w00+((q10>>16)&255)*w10+((q01>>16)&255)*w01+((q11>>16)&255)*w11)*cloudLit;
      }else{
        /* 雙線性取樣高度。⚠ 近景一個地圖像素橫跨約 33 個緩衝像素
           （MAP_SCALE 20 之後更明顯），最近鄰會把地表切成 20 世界單位寬的
           台階，走過去像在爬樓梯。四角內插把台階變成斜面。
           ⚠ 只在「四角都是陸地」時才內插：靠海岸時鄰格是雲海高度 0，
             內插會把大陸邊緣拉成緩坡，斷崖就沒了 —— 那正是浮空大陸的賣點。 */
        const x1=xi<MAPW-1?xi+1:xi, y1=yi<MAPH-1?yi+1:yi;
        const i10=yi*MAPW+x1, i01=y1*MAPW+xi, i11=y1*MAPW+x1;
        const h10=HGT[i10], h01=HGT[i01], h11=HGT[i11];
        let cr,cg,cb;
        if(h10>CLOUD_H && h01>CLOUD_H && h11>CLOUD_H){
          const tx=mfx-xi, ty=mfy-yi;
          const a0=th+(h10-th)*tx, a1=h01+(h11-h01)*tx;
          hh=a0+(a1-a0)*ty;
          /* 顏色也要內插。⚠ 只做高度不做顏色的話，地形是平順的但貼圖仍是
             20 世界單位一格的色塊 —— 那正是「馬賽克太重」的來源，
             而且形狀變平順之後色塊反而更顯眼。 */
          const c00=COL[mi], c10=COL[i10], c01=COL[i01], c11=COL[i11];
          const w00=(1-tx)*(1-ty), w10=tx*(1-ty), w01=(1-tx)*ty, w11=tx*ty;
          cr=(c00&255)*w00+(c10&255)*w10+(c01&255)*w01+(c11&255)*w11;
          cg=((c00>>8)&255)*w00+((c10>>8)&255)*w10+((c01>>8)&255)*w01+((c11>>8)&255)*w11;
          cb=((c00>>16)&255)*w00+((c10>>16)&255)*w10+((c01>>16)&255)*w01+((c11>>16)&255)*w11;
        }else{
          hh=th;
          const c=COL[mi];
          cr=c&255; cg=(c>>8)&255; cb=(c>>16)&255;
        }
        // 高頻細節：在世界座標上取樣，補回被放大糊掉的近景起伏
        const dt=DETH[(((ply|0)&DTM)*DET_TILE)+((plx|0)&DTM)];
        hh+=dt*(DET_AMP/127);
        /* ── 可見性早退 ─────────────────────────────────────────
           這個迴圈每幀跑約 17 萬次（約 744 個深度步進 × 234 欄），但真正寫進
           畫面的只有一小部分 —— 其餘的取樣算完顏色就被更近的地形蓋掉了。
           地貌貼圖那一層進來之後，那段浪費從「有點可惜」變成手機掉幀的主因。
           高度已經算完，投影只要四則運算：先算出這一筆會落在哪一列，
           被蓋住就直接跳過**地貌層＋打光＋分級**整段。
           ⚠ `|` 的優先序低於 `>=`，`a|0 >= b` 會被解析成 `a | (0>=b)`。
             一定要自己加括號。
           ⚠ ybuf/prevH 不用補：它們本來就只在「畫得出來」時才更新。
           ⚠⚠ 但 **plx/ply 一定要補**。這一列的世界座標是靠迴圈尾端
             `plx+=ddx; ply+=ddy;` 一欄一欄累加出來的，直接 continue 會把那一步
             跳掉 —— 之後整排欄位全部取樣到錯的位置，畫面是滿版破圖。
             （這就是 ver -183 一進去就大破圖的原因。） */
        if((((cam.alt-hh)*invz + z*curvK[i])*scaleH+horizon|0) >= ybuf[i]){
          plx+=ddx; ply+=ddy; continue;
        }
        /* ── 林草細節層 ─────────────────────────────────────────
           在世界座標平鋪樹冠圖，乘進底色。乘而不換：底色帶著地貌形狀與
           烘焙好的 hillshade，直接換成貼圖顏色會把山攤平成一張壁紙。
           ⚠ +4096 再取整：世界座標會是負的，而 |0 是往零截斷，負數那半邊
             的相位會整個錯開（雲的取樣也踩過同一個坑）。4096 是 GT 的倍數。
           ⚠ 反重複：每 256 單位一格，依格號選 8 種二面體變換之一。不打散的話
             整片大陸重複一百多次，眼睛一定抓得到那個節奏。 */
        if(vegOn&&geoReady&&BIOME){
          /* ── 地貌細節層 ──────────────────────────────────────
             類別與亮度起伏在載入時就打好表了（見 BIOME），這裡只讀一個 byte。
             ⚠ 先前是每個取樣重跑整條判定（兩次低頻噪聲雙線性、坡度、五層門檻、
               郊區覆蓋率），而那些輸入幾乎都是逐地圖像素的常數 —— 每幀十幾萬次
               重算同一件事，正是手機掉幀的來源。 */
          const bi=BIOME[mi];
          const tex=bi&15;
          /* 人造物與水：底色本身要推過去（細節層是相乘的，只靠它會留在原本的色相上）。 */
          if(RAILBR&&RAILBR[mi]>40){
            /* 石橋：底色推到**貼圖自己的均值**(138,128,114)。細節層是相對均值的
               倍率，底色對上均值，貼出來才是 Ray 那張鋪石本來的顏色 ——
               先前是憑感覺填的 (176,174,169)，比貼圖亮了一截。
               ⚠ 一定要排在**水之前**，否則整段又被水色蓋掉（那正是沒有橋的時候
                 鐵路在河上會斷掉的原因）。 */
            const bw=(RAILBR[mi]/255)*0.94;
            cr+=(138-cr)*bw; cg+=(128-cg)*bw; cb+=(114-cb)*bw;
          }else if(tex===G_WD||tex===G_WL){
            const deep=(tex===G_WL);
            const wr=deep?92:66, wg=deep?126:100, wb=deep?146:124;
            cr+=(wr-cr)*0.72; cg+=(wg-cg)*0.72; cb+=(wb-cb)*0.72;
          }else if(RAILW&&RAILW[mi]>40){
            /* 鐵路：底色推到**貼圖自己的均值**(139,121,101)。細節層是相對均值的
               倍率，底色對上均值，貼出來才是 Ray 那張軌道本來的顏色。
               ⚠ 先前沒有專用貼圖時這裡填的是憑感覺的淺灰 (152,150,146)：那一版
                 借 gravel_dark 當細節，所以底色只能自己湊。有了真貼圖就該對齊它，
                 否則等於把人家畫好的顏色again 洗掉一次。
               ⚠ 判 RAILW 而不是判 tex：橋面那幾格的 tex 已經是 G_BRDG，
                 但它在上面那個分支就處理掉了，走不到這裡。 */
            const rw=(RAILW[mi]/255)*0.90;
            cr+=(139-cr)*rw; cg+=(121-cg)*rw; cb+=(101-cb)*rw;
          }else if(tex===G_GL&&ROADW){
            const rw=(ROADW[mi]/255)*0.82;
            cr+=(135-cr)*rw; cg+=(109-cg)*rw; cb+=(72-cb)*rw;
          }else if(tex>=G_RH&&SUBW){
            const rc=ROOF_COL[tex-G_RH], rw2=(SUBW[mi]/255)*0.55+0.30;
            cr+=(rc[0]-cr)*rw2; cg+=(rc[1]-cg)*rw2; cb+=(rc[2]-cb)*rw2;
          }
          /* ⚠ +40960 再取整：世界座標會是負的，而 |0 往零截斷，負數那半邊的
             相位會整個錯開（雲的取樣踩過同一個坑）。40960 是 GT 的倍數。 */
          let gx, gy;
          if(tex===G_RAIL && RAILDIR){
            /* ── 鐵軌：轉到**軌道座標系**再取樣 ──────────────────
               沿軌方向 u：世界座標投影到軌道方向。
               橫越方向 v：直接由 RAILW 反推 —— 它是羽化距離場（中心 255、
                 邊緣 0），所以 (1−w/255) 就是「離中心線多遠」的 0~1。
               ⚠ v 是**沒有正負號**的（距離場只有大小），所以貼圖是以中線鏡射
                 過去的。Ray 這張兩條鐵軌對稱於中線，鏡射後完全還原；換成不對稱
                 的貼圖就會露餡，屆時得另外烘一個帶號的橫越座標。
               ⚠ 沿軌方向刻意拉長 2 倍（RAIL_ALONG）：照正方形 texel 算，枕木間距
                 只有 3 個螢幕像素，而地形是降取樣緩衝畫的（0.6×）—— 1.9 個緩衝
                 像素一根枕木正好踩在取樣極限上，會閃。拉長到 6 像素就穩了。 */
            const dq=RAILDIR[(((mi/MAPW)|0)/ROAD_DS|0)*RD_W + (((mi%MAPW)/ROAD_DS)|0)];
            if(dq){
              const th=(dq-1)/254*Math.PI, cs=Math.cos(th), sn=Math.sin(th);
              const along=(plx*cs+ply*sn)*RAIL_ALONG_INV;
              const across=128+127*(1-RAILW[mi]*(1/255));
              gx=along+40960; gy=across;
            }else{ gx=(plx+40960)*GEO_INV; gy=(ply+40960)*GEO_INV; }
          }else{
            gx=(plx+40960)*GEO_INV; gy=(ply+40960)*GEO_INV;
          }
          const q=tex*GEO_STRIDE+((((gy|0)&GTM)*GT+((gx|0)&GTM))*3);
          const k0=GEOK[q]*GEO_K1, k1=GEOK[q+1]*GEO_K1, k2=GEOK[q+2]*GEO_K1;
          /* 低頻亮度起伏：週期與貼圖週期互質得夠遠，兩者的節奏不會對齊，
             重複感就散掉了。量化成 4 bit 存在 BIOME 的高位。 */
          const mot=1+(((bi>>4)/15)-0.5)*2*GEO_MOT*vegAmt;
          /* 雪地壓掉植被貼圖（ver -1220）：底色已經漂白，再乘森林的紋理就會被
             乘回褐綠。⚠ 不要壓到 0 —— 留一成，雪下面的樹梢與地形起伏還看得出來。 */
          const vA = SNOW ? vegAmt*(1-0.88*(SNOW[mi]/255)) : vegAmt;
          cr*=(1+(k0-1)*vA)*mot;
          cg*=(1+(k1-1)*vA)*mot;
          cb*=(1+(k2-1)*vA)*mot;
        }
        /* ── 城的底圖：逐像素取樣（ver -445，A 案的本體）──────────────────
           射線打到城的範圍 → 拿插畫的顏色取代地形色。透視由取樣天生正確
           （每個像素都是打出來的），永不拉伸；後面的光照、分級、霧、雲海
           全部照常套用 —— 城與地形從此吃同一套規則。
           ⚠ 插在**地貌細節之後、光照之前**：art 直接蓋掉底色與林草
             （街道上不該有樹冠的紋理），而日夜與霧要跟地形同一份。
           ⚠ 邊緣看 alpha（插畫的羽化邊）：半透明處與地形色混合，
             城的外緣自然融進地貌，不必再有「格線」或「接縫」這種東西。
           ⚠ 雙線性：與 COL／雲海同一等級的取樣品質；只在挑好的那一層
             金字塔上做（層級每個深度步進挑一次，見 z 迴圈頭）。 */
        if(CITYMASK){
          const c8=CITYMASK[mi];
          if(c8){
            const C8=CITY_SAMPS[c8-1], L8=C8.cur;
            if(L8){
              const rx8=plx-C8.wx, ry8=ply-C8.wy;
              const u8=(rx8*C8.ca+ry8*C8.sa)*C8.iw+0.5;
              if(u8>=0&&u8<1){
                const v8=(-rx8*C8.sa+ry8*C8.ca)*C8.ih+0.5;
                if(v8>=0&&v8<1){
                  const fx8=u8*(L8.w-1), fy8=v8*(L8.h-1);
                  const x8=fx8|0, y8=fy8|0, tx8=fx8-x8, ty8=fy8-y8;
                  const r8=y8*L8.w+x8, r9=r8+(y8<L8.h-1?L8.w:0), x9=(x8<L8.w-1?1:0);
                  const q00=L8.d[r8], q10=L8.d[r8+x9], q01=L8.d[r9], q11=L8.d[r9+x9];
                  const wA=(1-tx8)*(1-ty8), wB=tx8*(1-ty8), wC=(1-tx8)*ty8, wD=tx8*ty8;
                  const a8=((q00>>>24)*wA+(q10>>>24)*wB+(q01>>>24)*wC+(q11>>>24)*wD)*(1/255);
                  if(a8>0.02){
                    const pr=(q00&255)*wA+(q10&255)*wB+(q01&255)*wC+(q11&255)*wD;
                    const pg=((q00>>8)&255)*wA+((q10>>8)&255)*wB+((q01>>8)&255)*wC+((q11>>8)&255)*wD;
                    const pb=((q00>>16)&255)*wA+((q10>>16)&255)*wB+((q01>>16)&255)*wC+((q11>>16)&255)*wD;
                    cr+=(pr-cr)*a8; cg+=(pg-cg)*a8; cb+=(pb-cb)*a8;
                  }
                }
              }
            }
          }
        }
        isRiver=RIV[mi];
        const nl=clamp(0.62+(SLX[mi]*lx+SLY[mi]*ly)*LIGHT_DIR_K,0,1.5);
        const sh=(ambI+sunI*nl)*GRADE_EXPO;
        r=cr*sh*lightR; g=cg*sh*lightG; b=cb*sh*lightB;
        // VP1 分級：往亮度收斂＝去飽和（在光照之後、霧之前，霧色才不會被連帶洗掉）
        const lum=r*0.299+g*0.587+b*0.114;
        r=lum+(r-lum)*GRADE_SAT; g=lum+(g-lum)*GRADE_SAT; b=lum+(b-lum)*GRADE_SAT;
      }
      // 曲率：等價於把地表下沉 d²/(2R)，展開後只是加一項 z*curvK[i]
      const yf=((cam.alt-hh)*invz + z*curvK[i])*scaleH+horizon;
      let y=yf|0;
      if(y<ybuf[i]){
        // 次像素：這一列有多少「沒被地形蓋到」。收尾時只拿最後的頂端來混。
        topFrac[i]=(y>0)?clamp(yf-y,0,1):0;
        if(y<0) y=0;
        const sr=r, sg=g, sb=b;        // 未套霧的地表色，立面要從這裡推
        if(fog>0.002){ r=lerp(r,fr,fog); g=lerp(g,fg,fog); b=lerp(b,fb,fog); }
        const dth=BAYER[((y&3)<<2)|(i&3)]*DITHER;
        const top=rgb(clamp(r+dth,0,255)|0,clamp(g+dth,0,255)|0,clamp(b+dth,0,255)|0);
        const bot=ybuf[i];
        /* ⚠ 每幀 prevH 初始化為 -9999 代表「還沒有上一筆」。不特判的話
           最近的那一步 drop 會是一萬多，整片畫面下緣被當成巨型崖面畫出來
           —— 那就是會看到的破圖。 */
        const first=prevH[i]<-9000;
        const drop=first?0:hh-prevH[i]; // 相對「上一個（更近的）已畫取樣」的高度落差
        /* ⚠ 遠處與極短的柱子直接填單色：柱高只有幾個像素、或已經被霧洗到
           接近地平線色時，立面的紋理與漸暗一個都看不出來，卻要付整段
           per-pixel 的代價。畫面大部分面積都落在這一類，這道閘門省下的
           時間比任何其他優化都多。 */
        const y0=y;
        /* 3D 取點的反查表。⚠ 只在管理人按下右鍵那一幀才配置，平常 PICK3D 是
           null，內迴圈只多一次預測得準的分支。跟地圖的 PICK 同一個道理：
           有高度差就沒有解析反函式，唯一準的辦法是**在畫的時候記下來**。 */
        if(PICK3D){ const _e=bot<BH?bot:BH; for(let _y=y0<0?0:y0;_y<_e;_y++) PICK3D[_y*BW+i]=mi; }
        if(bot-y0>3 && fog<0.86){
          /* 立面：**所有**垂直線段都走這條路，不再只有大落差才處理。
             原本落差不到門檻就整條填單一地表色，於是每根柱子都是一道
             純色豎條 —— 那正是「垂直立面怪怪的」。
             顏色由該處地表色推導（雪山得到灰白的壁、森林區得到褐綠的壁），
             加上橫向岩層條紋與往下漸暗（環境光被崖壁自身遮蔽）。
             落差越大越混入獨立的岩石反照率：小起伏是土坡，大落差才是岩壁。 */
          const cap=y0+2;
          for(let yy=y0;yy<cap && yy<bot;yy++) bufU32[yy*BW+i]=top;
          const wx=xi, wy=yi;
          const rocky=clamp((drop-16)/(CLIFF_DH*1.5),0,1);
          /* 瀑布判定。⚠ 不能只看落差：`rocky>0.40` 換算成落差要 >61 世界單位，
             而城的水面 87、雲海面約 48，落差只有 39 —— 河流到大陸邊緣會被當成
             一道普通矮坎。但這是**浮空大陸**：水走到邊緣就是往雲海裡掉，
             沒有別的去處。所以「前一筆（更近的）取樣是雲海」本身就是瀑布的
             充分條件，與落差無關。 */
          const overSea = !first && prevH[i]<=CLOUD_H+12;
          /* ⚠ 內陸的河**預設不是瀑布**。ver -190 把河面抬到「比岸低 6」之後，
             河相對周圍地勢變高，沿岸落差輕易超過 rocky>0.40（＝61 世界單位），
             於是整條河的岸邊都被判成瀑布、畫成翻白的水 —— 使用者看到的
             「河道立面藍藍的」就是這個，不是岸壁沒換色（岩褐在 else 分支，
             那條路徑根本沒被走到）。
             真正的瀑布只有兩種：水掉進雲海（overSea），或真的掛在斷崖上
             （rocky>0.85＝落差 >111 單位，那是崖不是岸）。 */
          const fall=isRiver && (overSea || rocky>0.85);
          const wamb=ambI+sunI*0.35;          // 崖面朝側，取中間調
          for(let yy=cap;yy<bot;yy++){
            const d=(yy-cap)/Math.max(1,bot-cap);      // 0＝崖頂 1＝沒入雲海
            let cr,cg,cb;
            if(fall){
              /* 瀑布：河水落下。色相直接取河道自己的地貌色（COL[mi]），只是
                 被打散成白沫而提亮，往下越散越白。
                 ⚠ 先前寫死 222..255 的純白、且完全不吃日照 —— 夜裡整條瀑布
                   還是正午的白，掛在暗掉的崖面上像螢光漆。水的顏色本來就
                   來自它反射的天光，得跟崖面同一盞燈才對得起來。
                 sunI 給到 0.75（崖面只有 0.35）：水面朝天，接光比側向的岩壁多，
                 這樣夜裡是「暗藍的水」而不是「被一起關燈的灰柱」。 */
              const rc=COL[mi];
              const flow=hash(wx*3, (yy*2 - (now*FALL_SPD|0)) & 511);
              const foam=clamp(0.46+flow*0.26-d*0.14+sstep(0.55,1,d)*0.34,0,1);
              const wsh=(ambI+sunI*0.75)*GRADE_EXPO;
              cr=lerp( rc&255,      248,foam)*wsh*lightR;
              cg=lerp((rc>>8)&255,  250,foam)*wsh*lightG;
              cb=lerp((rc>>16)&255, 255,foam)*wsh*lightB;
              // 與河面走同一條分級曲線，兩者才會是同一種水
              const wl=cr*0.299+cg*0.587+cb*0.114;
              cr=wl+(cr-wl)*GRADE_SAT; cg=wl+(cg-wl)*GRADE_SAT; cb=wl+(cb-wl)*GRADE_SAT;
            }else{
              /* 立面色＝地表色 × 岩層條紋 × 往下漸暗。
                 ⚠ 從地表色推導才會有「顏色變化」——各地的壁自然帶著該地
                   的色調；用一種寫死的岩石色會讓整座大陸的側面長得一樣。
                 大落差再往獨立的岩石反照率靠：地表在背光側本來就暗，
                 純用地表色乘下去會變成黑洞，岩石色把它拉回來。 */
              const strat=STRAT[(wx*5+wy*3+(yy>>1))&255];
              const v=(1-d*0.34)*(0.88+strat*0.14);   // 條紋收斂：每根柱子都有立面了，原本的幅度會整片變雜點
              /* ⚠ 河道的立面不能拿地表色去推 —— 地表色現在是水藍，推出來就是
                 一道藍色的壁。水面下的岸壁是**岩**，用岩褐的絕對色（同 rock_brown
                 的均值）。非河道的地方照舊由地表色推導，各地的壁才帶著該地色調。 */
              let bsr=sr, bsg=sg, bsb=sb;
              if(isRiver){
                const rk=(ambI+sunI*0.5)*GRADE_EXPO;
                bsr=109*rk*lightR; bsg=91*rk*lightG; bsb=72*rk*lightB;
              }
              cr=bsr*v; cg=bsg*v; cb=bsb*v;
              if(rocky>0.01){
                cr=lerp(cr,152*v*wamb*lightR,rocky);
                cg=lerp(cg,138*v*wamb*lightG,rocky);
                cb=lerp(cb,126*v*wamb*lightB,rocky);
              }
              if(yy-cap<2){ cr*=1.22; cg*=1.20; cb*=1.18; }   // 崖唇受光提亮
            }
            /* ── 撞擊點的雲霧水花 ──────────────────────────────
               瀑布掉到雲海就整條消失，看起來像被裁掉。真正該有的是**霧**：
               水砸進雲頂翻起一片白，看不見底反而更有深度。
               ⚠ 只能畫在撞擊點**上方**（yy<bot）。bot 以下的像素屬於更近的
                 取樣、早就畫好了，往下寫會破壞深度順序 —— 這也是為什麼
                 「直下雲海深處」那個方案在這個渲染器裡行不通：更近的雲會後畫、
                 把水柱蓋掉。
               ⚠ 霧要吃同一盞燈：白得不吃日照的話，夜裡會變成一條螢光帶。 */
            if(fall){
              const up=(bot-yy);                        // 距撞擊點幾列
              if(up<MIST_H){
                const t2=1-up/MIST_H;
                const puff=hash(wx*7+i, (yy*3 - (now*MIST_SPD|0)) & 511);
                const m=clamp(t2*t2*(0.55+puff*0.75),0,1)*MIST_AMT;
                const msh=(ambI+sunI*0.80)*GRADE_EXPO;
                cr=lerp(cr,252*msh*lightR,m);
                cg=lerp(cg,253*msh*lightG,m);
                cb=lerp(cb,255*msh*lightB,m);
              }
            }
            if(fog>0.002){ cr=lerp(cr,fr,fog); cg=lerp(cg,fg,fog); cb=lerp(cb,fb,fog); }
            const wd=BAYER[((yy&3)<<2)|(i&3)]*DITHER;
            bufU32[yy*BW+i]=rgb(clamp(cr+wd,0,255)|0,clamp(cg+wd,0,255)|0,clamp(cb+wd,0,255)|0);
          }
        }else{
          for(let yy=y0;yy<bot;yy++) bufU32[yy*BW+i]=top;
        }
        ybuf[i]=y; prevH[i]=hh;
      }
      plx+=ddx; ply+=ddy;
    }
    // 視距 3600 下若沿用 0.0042 會逼近 1800 步；遠景只占幾個像素又被霧吃掉，
    // 放寬成長率把步數壓回 ~800，畫質看不出差別但省一半以上取樣。
    // ⚠ GL 那一支 ver -1241 收到 0.0062（大陸邊緣的崖底才不會被步長切成鋸齒）——
    //   **CPU 這一支刻意不跟**：它是低階備援，多吃 35% 的取樣不划算，
    //   而且它的崖面走的是 span 演算法（見 §6.8.1），沒有同一個病。
    z+=dz; dz+=0.011;
  }
  // 迴圈沒跑到的尾端切片：全部沿用最終的天際線
  while(zsNext<ZSLICES){ ZTOP.set(ybufRow,zsNext*BW); zsNext++; }

  /* ══ 抗鋸齒 ①：輪廓的次像素混色 ══
     z 迴圈跑完後，ybuf[i] 就是該欄地形的最高列 —— 那一列才是真正的
     天空／地形交界，也只有它該做覆蓋率混色。
     ⚠ 一開始我在迴圈裡「每畫一次新頂端就混一次」，結果連續斜坡上每隔
       幾列就有一條偏天空色的亮列（因為上方當下還是天空、更遠的地形之後
       才會補進來），逐欄相位又不同 → 整片鹽粒雜訊。
       交界只有一條，混色也只該做一次。
     成本 O(BW)，一幀幾百次，可以忽略。 */
  for(let i=0;i<BW;i++){
    const f=topFrac[i], ty=ybuf[i];
    if(f<0.08 || ty<=0 || ty>=BH) continue;
    const c=bufU32[ty*BW+i], s=SKYROW[ty];
    const cr=c&255, cg=(c>>8)&255, cb=(c>>16)&255;
    bufU32[ty*BW+i]=rgb(
      (cr+((s&255)-cr)*f)|0,
      (cg+(((s>>8)&255)-cg)*f)|0,
      (cb+(((s>>16)&255)-cb)*f)|0);
  }

  /* ⚠⚠ GLON：地形由底下那張 GL 畫布畫，這裡**不貼回**，改成把 3D 視窗那一段
     清成透明讓它透上來。面板與所有 overlay 照舊畫在這張 2D 畫布上。
     ⚠ Stage 1a 仍然**照跑** CPU 那一圈（ybuf／ZTOP／PICK3D／城的取樣還靠它），
       所以這一版是**畫面對照用，還不會變快** —— 拿掉 CPU 那一圈是 Stage 1b。 */
  if(GLON && glReady){
    glDrawTerrain(S, sinp, cosp, lx, ly, ambI, sunI, lightR, lightG, lightB,
                  fr, fg, fb, cloudLit);
    /* 遺蹟：與地形**同一顆深度緩衝** ⇒ 遮擋是免費的深度測試，
       不必 `clipByTerrainDepth`，也與數量脫鉤（ver -1199 驗過 841 個物件量不到）。 */
    glDrawRuins(sinp, cosp, lx, ly, S.day);
    ctx.clearRect(0,0,W,VIEWH);
  }else{
    bctx.putImageData(buf,0,0);
    ctx.drawImage(bcv,0,0,BW,BH,0,0,W,VIEWH);
  }

  // 疊加物一律裁切在 3D 視窗內，不可溢出到操作面板
  ctx.save();
  ctx.beginPath(); ctx.rect(0,0,W,VIEWH); ctx.clip();
  /* ══⚠⚠⚠ 天體要被地形擋住（ver -1160，Ray：「夕陽也會穿山穿模」）══
     星、曉星、日月都畫在**地形之後**的疊加層，而且原本完全不裁 —— 所以日落時
     太陽會直接畫在山的前面（「穿山」）。
     ⚠ Ray 給的退路是「讓夕陽／日出角度永遠比山高」，但那要犧牲構圖，而且
       山有多高是逐欄不同的，「比山高」其實訂不出一個角度。
     ⚠⚠ 正解便宜得多：天體在**無限遠**，所以拿 `ZFAR` 去裁就對了 ——
       「比 ZFAR 近的地形」＝**所有地形**，於是任何一欄只要有山，那一欄就遮住。
       用的是既有的逐欄遮擋（`clipByTerrainDepth`，鐵律 8），沒有新機制。
     ⚠ 三者一起裁：星星與曉星同樣會穿山，只是平時位置高、不容易看到。
     ⚠ 雲**不裁**：雲是有距離的東西（`drawPuffs` 自己有深度），而且它本來就
       可以飄在山前面。 */
  ctx.save();
  { const sxk=W/BW, syk=VIEWH/BH; clipByTerrainDepth(ZFAR, sxk, syk); }
  drawStars(S,horizon,sinp,cosp,now);   // 先星後月：銀月的光暈要蓋在星星上
  drawDawnStar(S,horizon,sinp,cosp);
  drawSunMoon(S,horizon,sinp,cosp);
  ctx.restore();
  /* 雲分兩趟畫，中間夾著城（見 drawPuffs 的說明）。 */
  /* ⚠⚠ 雲**整批**畫在城之後（ver -448，Ray：「帝都的城鎮陰影、樹影好像在雲的
     圖層之上」）。以前分兩趟、以最近那座城的深度當分界 —— 那是**貼盤子時代**
     的必要之惡（盤子跨上千單位，總得有取捨），而分界取城心讓「城心～遠緣」
     上空的雲被後畫的量體（暗色屋頂）壓過去，就是 Ray 看到的陰影蓋雲。
     A 案（ver -445）之後地面歸地形管、這一層只剩量體與炊煙，而雲團的高度是
     CLOUD_H+180~940（224~984）—— **永遠高過屋頂**（地基 126~145＋量體幾十）：
     沒有任何一朵雲該被城蓋住，夾層的理由整個消失。
     ⚠ 代價只有一種邊角：遠方的雲從高塔背後飄過時不會被塔剪影 —— 雲比塔高，
       重疊只有幾個像素、又是軟的，看不出來。 */
  drawSettlements3D(scaleH,horizon,sinp,cosp);
  drawTrains(S,scaleH,horizon,sinp,cosp);                  // 火車跟城同一層（貼在地上）
  /* ⚠ GLON：遺蹟改由 GL 畫（`glDrawRuins`），這裡不再跑 —— 那是這一層
     從 CPU 移走的**全部**成本（貝利薩爾 d15 實測 2.6~4.5ms／禎）。 */
  if(!(GLON && glRuinReady))
    drawRuins(scaleH,horizon,sinp,cosp);                   // 地表的小型遺蹟（ver -1107，同一層：貼在地上）
  drawRuinBeams(scaleH,horizon,sinp,cosp,now);             // 掃到的遺蹟射出的光柱（ver -1116）
  drawCitySmoke(S,scaleH,horizon,sinp,cosp,now);           // 炊煙蓋在城上（ver -446）
  drawPuffs(S,scaleH,horizon,sinp,cosp,0,Infinity);        // 雲蓋在城與煙上
  drawPlaces(scaleH,horizon,sinp,cosp);
  drawFlock(scaleH,horizon,sinp,cosp,now);
  /* ══⚠⚠ **出怪要淡入**（ver -1433，Ray：「現在看起來是突然出現，出怪要淡入」）══
     包在呼叫端而不是 `drawEnemy3D` 裡面：那一支有好幾個 early return
     （在身後／太遠／貼圖還沒解碼），在裡面 `save()` 要每一條 return 都配一個
     `restore()` —— 漏一個就是**整個畫面從此半透明**，而且很難查。
     ⚠ `enemy.t0` 是生成時戳（本來就有）。⚠ 只在淡入期間才 save/restore，
       之後一幀都不多花。 */
  { const fd = enemy ? Math.min(1, (now-(enemy.t0||0))/ENEMY_FADE_MS) : 1;
    if(fd<1){ ctx.save(); ctx.globalAlpha=fd; drawEnemy3D(scaleH,horizon,sinp,cosp,now); ctx.restore(); }
    else drawEnemy3D(scaleH,horizon,sinp,cosp,now); }
  /* 遭遇提示：**正常遭遇不再顯示**（ver -389，Ray：「這個對話框可以完全移除了」）——
     現在一撞到遭遇距離槍棺就立刻彈上來蓋滿畫面，那一格字只會被門壓在底下閃一眼。
     ⚠ **免戰模式留著**（那是開發用的狀態）：開著免戰時不會進戰鬥，沒有這一格就完全
       看不出遭遇有沒有觸發 —— ver -383 加這行字正是為了這件事（「不改的話下次自己測
       會以為交棒壞了」）。 */
  if(enemy && enemy.state==='engage' && peaceMode) drawEngagePrompt();
  drawStarMarks(scaleH,horizon,sinp,cosp,now);
  drawShip(now);
  vignette(S);
  drawRegionBanner(now);
  /* ⚠ 感應立繪畫在這裡：3D 內容之上、**drawPanel 之前**。順序就是層次 ——
     之後 drawPanel 畫的面板與舵輪會蓋住她，不必也不該用裁切去避開。 */
  drawIntroArt(now);   // 羽蛇登場插圖背景（ver -743）：3D 之上、立繪與對白之下
  drawSenseCI(now);
  drawSpotCI(now);   // 索菈娜「發現了」（ver -1089）：同一層，排在她後面
  drawSnowFall(now);      // 飄雪（ver -1220）：在 3D 內容之上、立繪與面板之下
  drawSturmCI(now);
  drawTalk(now);
  /* 對白中收掉「時間地點」那兩塊 HUD（ver -384）。⚠ 真相來源就是 `sayQueue` ——
     不要另外記一份「現在在講話嗎」，那會與 drawTalk 的收場時機錯開。 */
  { const on=talkingNow();
    if(on!==hudTalking){ hudTalking=on; document.body.classList.toggle('talking', on); } }
  ctx.restore();

  drawPanel(S);
}

/* ── Sturm 立繪：閃入閃出的脈動 ──────────────────────────────────────
   ⚠ 畫在 3D 內容之上、**drawPanel 之前**（同 drawSenseCI）。順序就是層次：
     面板與舵輪會蓋住她，不必也不該用裁切去避開（見 CLAUDE.md §6.5）。
   ⚠ 立繪縮小超過 2 倍要走預縮圖（§6.7 第 3 條）—— 但這張是 **cover 鋪滿
     3D 區**，縮放比通常 >0.5（原圖 1024×1536），縮不到 2 倍，所以直接貼。
     哪天改成小尺寸常駐再補預縮圖。 */
function drawSturmCI(now){
  if(!sturmFlash) return;
  const t=(now-sturmFlash)/STURM_FLASH_MS;
  if(t>=1){ sturmFlash=0; return; }
  if(!sturmCI.complete || !sturmCI.naturalWidth) return;
  /* ── 演出（Ray 指定）：半透明、**由大縮小淡入**，然後脈動著消失 ──────
     ⚠ 不加金色閃光。先前疊了一層 `lighter` 的金色，整個飛行畫面連人一起被
       染成金的 —— Ray：「人不用變金色啊」。
     ⚠ 全程半透明（上限 STURM_CI_A）：她是「力量的顯影」不是一張蓋版 CG，
       不透明的話會整個擋住飛行畫面。
     ⚠ 縮小走 ease-out（前段快）：等速的話前三分之一看起來是靜止的。 */
  const STURM_CI_A = 0.62;        // 半透明上限
  const GROW_IN    = 1.22;        // 淡入起始的放大倍率（由大縮到 1.0）
  const IN_T       = 0.42;        // 淡入佔整段的比例
  const GHOST_GROW = 0.45, GHOST_A = 0.85;   // 與 SENSE_GHOST_* 同值，手感一致
  const iw=sturmCI.naturalWidth, ih=sturmCI.naturalHeight;
  const sc0=Math.max(W/iw, VIEWH/ih);
  const draw=(mul,alpha)=>{
    if(alpha<=0.004) return;
    const w=iw*sc0*mul, h=ih*sc0*mul;
    ctx.globalAlpha=alpha;
    /* ⚠ 上緣對齊（放大時往上多讓一半）：3D 區比立繪矮，cover 之後一定會裁掉
       兩百多像素 —— 下緣對齊會把**頭裁掉只剩下半身**。 */
    ctx.drawImage(sturmCI, Math.round(W/2-w/2), Math.round(-(h-ih*sc0)/2),
                  Math.round(w), Math.round(h));
  };
  ctx.save();
  ctx.beginPath(); ctx.rect(0,0,W,VIEWH); ctx.clip();
  ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality='high';
  if(t<IN_T){
    // 淡入：大 → 小，透明 → 半透明
    const u=t/IN_T, e=1-(1-u)*(1-u);
    draw(GROW_IN+(1-GROW_IN)*e, STURM_CI_A*e);
  }else{
    // 消失：本體淡出，同時一次脈動往外擴散（等同 senseGhost）
    const p=(t-IN_T)/(1-IN_T), e=1-(1-p)*(1-p);
    const base=STURM_CI_A*(1-p);
    draw(1, base);
    draw(1+GHOST_GROW*e, Math.min(1, base*GHOST_A*Math.pow(1-p,1.4)));
  }
  ctx.restore();
}

/* 已發現的隱藏點：在飛行畫面上標出來（投影與 drawPlaces 同一套）。
   ⚠ 只畫**已發現**的 —— 沒發現的連在 3D 裡都不該露出任何痕跡。
   ⚠ 剛感應到的那幾個先亮一段（starNew），之後轉成常駐的淡標記：
     不區分的話玩家分不出「我剛剛找到的是哪一個」。 */
const STAR_MARK_NEW_MS=6000;
let starNewAt=0;
function drawStarMarks(scaleH,horizon,sinp,cosp,now){
  if(!STARS.length || !starFound.size) return;
  if(talkingNow()) return;                 // 同 drawPlaces（ver -1183）：對白期間讓開

  const sxk=W/BW, syk=VIEWH/BH;
  const fresh=new Set(starNew.map(p=>p.id));
  const hot=(now-starNewAt)<STAR_MARK_NEW_MS;
  const list=[];
  for(const sp of STARS){
    if(!starFound.has(sp.id)) continue;
    const dx=sp.x*MAP_SCALE-cam.x, dy=sp.y*MAP_SCALE-cam.y;
    const z=dx*(-sinp)+dy*(-cosp);
    if(z<10||z>ZFAR*0.92) continue;
    const sv=(dx*cosp+dy*(-sinp))/z;
    if(sv<-1.1||sv>1.1) continue;
    list.push({sp,z,
      bx:((sv+1)/2*BW)*sxk,
      by:(((cam.alt-(sp.h||0))/z + z*curvAt(sv))*scaleH+horizon)*syk,
      isNew:hot&&fresh.has(sp.id)});
  }
  list.sort((a,b)=>b.z-a.z);
  ctx.save();
  for(const o of list){
    const fade=clamp((ZFAR*0.92-o.z)/240,0,1);
    const bx=Math.round(o.bx), by=Math.round(clamp(o.by-26,16,VIEWH-30));
    // 剛找到的那幾個會脈動；其餘常駐但壓低存在感
    const pulse=o.isNew?(0.55+0.45*Math.sin(now*0.008)):0;
    ctx.globalAlpha=fade*(o.isNew?1:0.5);
    if(o.isNew){
      ctx.shadowColor='rgba(255,232,120,'+(0.9*pulse).toFixed(2)+')';
      ctx.shadowBlur=10+8*pulse;
    }
    starPath(ctx,bx,by,o.isNew?9:6.5);
    ctx.fillStyle=o.isNew?'rgba(255,240,160,.98)':'rgba(255,232,120,.8)';
    ctx.fill();
    ctx.shadowBlur=0;
    ctx.strokeStyle='rgba(24,18,8,.8)'; ctx.lineWidth=1.2; ctx.stroke();
    if(o.isNew){
      const nm=STAR_KIND[o.sp.kind]||o.sp.kind;
      ctx.font='11px "Noto Serif TC",serif'; ctx.textAlign='center';
      const tw=Math.round(ctx.measureText(nm).width);
      ctx.fillStyle='rgba(5,6,12,.8)'; ctx.fillRect(bx-tw/2-8,by-30,tw+16,17);
      ctx.strokeStyle='rgba(255,232,120,.75)'; ctx.lineWidth=1;
      ctx.strokeRect(bx-tw/2-7.5,by-29.5,tw+15,16);
      ctx.fillStyle='#ffe878'; ctx.fillText(nm,bx,by-18);
    }
  }
  ctx.restore();
  ctx.globalAlpha=1;
}

/* ── 星空 ────────────────────────────────────────────────────────
   ⚠ 星星必須固定在**天球**上，不是貼在螢幕上：每顆存 (方位 az, 仰角 el)，
     每幀依 cam.angle 重新投影。這是「有星空」與「有一層雜訊」的分界 ——
     轉船時星星該跟著掃過去，飛行時該紋風不動（它們無限遠）。
     投影式與日月同一套（drawSunMoon），所以星星與銀月轉起來是同步的。

   ⚠ 只生成看得到的那一段仰角。地平線在畫面 22% 高、縱向尺度 0.62，
     所以畫面上緣對應 el = 0.22/0.62 ≈ 0.355 —— 天頂根本不在視野裡。
     均勻撒滿整個半球的話有六成五的星星永遠在畫面外，白算。
     （el 是仰角的**正弦**，與 S.el 同一個量綱，所以「在 [0,EL] 均勻」
       就等於「單位立體角內密度均勻」，不必再做 asin 修正。）

   ⚠ 為什麼星星不多：這片天空是**被銀月照亮的**（nightTop 抬到 [30,37,60]，
     地平線更亮到 [96,105,133]）。滿月天實際上只看得到亮星，撒得密反而假。
     所以三件事都往「稀疏」調：總數 300（可見約 1/4）、亮度分布偏暗
     （m=rnd()^2.4）、離銀月近的再壓一段。

   ⚠ 地平線附近要淡出：那一帶天空最亮（霧色＝地平線色），星星硬畫上去
     會在交界處看到一排突然出現的點。淡出範圍 el 0.02~0.15。 */
/* ⚠ 命名：這份檔案裡 `STARS` / `starFound` / `drawStarMarks` 已經是
     **隱藏點位**（starpoints.json，地圖上那些五芒星）。天上的星星一律用
     SKYSTAR 前綴，兩者不要再混。 */
const SKYSTAR_N=300;
const SKYSTARS=[];
function initStars(){
  _s=20250820;                      // 與 initPuffs 同一套慣例：先定種子再取
  const EL_MAX=0.36;                // 略高於可見上緣 0.355，避免頂端剛好空一條
  for(let i=0;i<SKYSTAR_N;i++) SKYSTARS.push({
    az:rnd()*Math.PI*2,
    el:rnd()*EL_MAX,
    m:Math.pow(rnd(),2.4),          // 亮度：多數暗、少數亮
    tw:rnd()*Math.PI*2              // 閃爍相位（每顆固定，不逐幀亂數）
  });
}

/* 天球 → 螢幕。星星、晨星共用（日月的 drawSunMoon 自己有一份，剔除條件不同）。
   回傳 null＝在視野外或被地形擋住。
   ⚠ 遮擋要查 ybuf[欄]（該欄地形的最高列，天空在它上面）。少了這一步，
     夜裡的山稜線上會浮著一層星星。 */
function skyProject(az,el,horizon,camAz){
  /* ⚠⚠ da 是 **camAz − az**，不是 az − camAz。這一項的正負決定天空往哪邊掃，
     而它必須跟地形一致 —— 地形每一列的右緣是 `(cosp,−sinp)`（見 render 的
     prx/pry），那個方向的方位角比中央**小**，所以「螢幕往右 ＝ 方位角遞減」。
     寫成 az−camAz 的話，轉船時地形往左滑、天空往右滑，整片星空會像貼在
     螢幕上的雜訊往反方向跑。
     ⚠ drawSunMoon 原本就是寫反的（已一併修正）。日月幾乎總在畫面中央附近，
       鏡像誤差小到看不出來，所以一直沒被發現；星星鋪滿整個畫面寬，一轉就露餡。 */
  let da=camAz-az;
  while(da>Math.PI)da-=Math.PI*2;
  while(da<-Math.PI)da+=Math.PI*2;
  if(Math.abs(da)>0.80) return null;             // 視野半角 45°，先粗篩
  const x=W/2+Math.tan(da)*(W/2);
  if(x<0||x>=W) return null;
  const syk=VIEWH/BH;
  const y=(horizon-el*BH*0.62)*syk;
  if(y<0) return null;
  const ci=clamp((x/(W/BW))|0,0,BW-1);
  if(y>=ybuf[ci]*syk) return null;               // 被地形擋住
  return {x,y};
}

/* ── 晨星（啟明星）─────────────────────────────────────────────
   東方（日出方位＝az 0）的一顆，天亮前最亮、也是最後一顆被天光吃掉的。

   ⚠ **只在黎明那一側**。S.dusk 對日出與日落是對稱的（1-|el|*3.2），
     光看它分不出朝暮 —— 要看 S.t：t<0.5 才是太陽在爬升的那半天。
     不加這道閘的話，黃昏西沉時東邊也會冒出一顆「晨星」。

   ⚠ 亮度不跟一般星星共用 nf。整段設計就是「別的星都沒了它還在」，
     綁同一條曲線就沒有這個效果了：
       up ＝後半夜才升起（太陽仰角 -0.62 → -0.34 淡入）
       out＝日出之後才慢慢被天光吃掉（0.02 → 0.30 淡出）
     所以它在日出當下仍接近全亮，比整片星空多撐一段。

   ⚠ 不閃爍。行星的光是穩的，恆星才閃 —— 讓它定住，跟旁邊的星星就分得開，
     不必再靠更亮去強調。 */
/* ⚠⚠ 世界方位角 az 與**羅盤度數不是同一套**，換算沒有寫在任何地方，
   我是從 updateHUD 的 `deg=(-cam.angle*180/PI+1080)%360` 與
   `camAz=atan2(-sinp,-cosp)=cam.angle+PI` 兩式解出來的：

       羅盤度數 = (180 − az角度) mod 360        （北=0、東=90、南=180、西=270）

   驗證：MOON_AZ=-0.52π=-93.6° → 羅盤 273.6° = 西，與該處註解「方位：西」相符。
   第一版我把 az 0 當成東，其實 az 0 是**南** —— 螢幕上晨星就跑到南邊去了。
   要正東就是 az = π/2。

⚠ 不要貼著日出點放。更早一版給的 az 離日出點只有 5.7°、el 0.165，
   天亮時它正好坐進朝陽的光暈裡 —— 有畫等於沒畫。這裡離正東 12.6°、抬到 12°，
   朝陽在下、晨星在斜上方，兩顆各自成立。 */
const DAWNSTAR_AZ=Math.PI/2+0.22;   // 羅盤約 77°（東，略偏北）
const DAWNSTAR_EL=0.21;             // 約 12°：在地平霧氣之上，離可見上緣 0.355 仍有餘裕
function drawDawnStar(S,horizon,sinp,cosp){
  if(S.t>=0.5) return;
  const up =sstep(-0.62,-0.34,S.el);
  const out=1-sstep(0.02,0.30,S.el);
  const a=up*out;
  if(a<0.02) return;
  const P=skyProject(DAWNSTAR_AZ,DAWNSTAR_EL,horizon,Math.atan2(-sinp,-cosp));
  if(!P) return;
  const r=Math.max(1.6,2.2*DPR);
  const g=ctx.createRadialGradient(P.x,P.y,0,P.x,P.y,r*7);
  g.addColorStop(0,`rgba(206,224,255,${(a*0.42).toFixed(3)})`);
  g.addColorStop(1,'rgba(206,224,255,0)');
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(P.x,P.y,r*7,0,Math.PI*2); ctx.fill();
  /* 十字芒：說「這顆比別的亮」最省的講法。長度只給 5 倍半徑，
     再長就變成聖光效果，不是一顆星。 */
  ctx.strokeStyle=`rgba(226,238,255,${(a*0.5).toFixed(3)})`;
  ctx.lineWidth=Math.max(1,DPR*0.8);
  const L=r*5;
  ctx.beginPath();
  ctx.moveTo(P.x-L,P.y); ctx.lineTo(P.x+L,P.y);
  ctx.moveTo(P.x,P.y-L); ctx.lineTo(P.x,P.y+L);
  ctx.stroke();
  ctx.fillStyle=`rgba(246,250,255,${Math.min(1,a*1.05).toFixed(3)})`;
  ctx.beginPath(); ctx.arc(P.x,P.y,r,0,Math.PI*2); ctx.fill();
}

function drawStars(S,horizon,sinp,cosp,now){
  /* 入夜才有。S.day 在日出/日落當下是 0.5，那時天還是橘的，
     所以門檻拉到 day<0.62 才開始，且用平方曲線讓它最後一段才真的亮起來。 */
  const nf=Math.pow(clamp(1-S.day*1.62,0,1),1.6);
  if(nf<0.012) return;
  const camAz=Math.atan2(-sinp,-cosp);
  const tw=now*0.0016;
  ctx.save();
  for(let i=0;i<SKYSTAR_N;i++){
    const st=SKYSTARS[i];
    const P=skyProject(st.az,st.el,horizon,camAz);
    if(!P) continue;
    const x=P.x, y=P.y;
    /* 銀月周圍壓暗：它是天上最亮的東西，旁邊本來就看不到星。
       仰角小（<21°），cos 修正可略，直接把 (Δ方位, Δ仰角) 當弧度算夾角。 */
    let dm=st.az-MOON_AZ;
    while(dm>Math.PI)dm-=Math.PI*2;
    while(dm<-Math.PI)dm+=Math.PI*2;
    const sep=Math.hypot(dm,st.el-MOON_EL);
    const wash=0.28+0.72*sstep(0.16,0.62,sep);
    /* 地平線淡出。範圍刻意窄（0.015~0.10）：可見仰角總共只到 0.355，
       淡出吃掉 0.15 就等於吃掉下半片天，星星全擠在上緣一條。 */
    const hz=sstep(0.015,0.10,st.el);
    const a=Math.min(1,nf*hz*wash*(0.42+0.58*st.m)*(0.86+0.14*Math.sin(tw+st.tw))*1.15);
    if(a<0.03) continue;
    /* ⚠ 畫**整數像素方塊**，不畫 arc。第一版用半徑 0.5~1.65 的 arc，在 DPR=1
       的畫面上被抗鋸齒攤成一片幾乎全透明的糊塊 —— 實測整條天空只看得到三四點。
       方塊落在整數格上、不吃抗鋸齒，1px 就是紮實的 1px；而且硬點本來就更配
       這個低解析緩衝的味道（地形是最近鄰放大的）。 */
    const r=Math.max(1,Math.round((0.55+1.25*st.m)*DPR));
    if(st.m>0.78){                               // 亮星給一圈很淡的暈
      const R=r*3.2;
      const g=ctx.createRadialGradient(x,y,0,x,y,R);
      g.addColorStop(0,`rgba(214,226,255,${(a*0.30).toFixed(3)})`);
      g.addColorStop(1,'rgba(214,226,255,0)');
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,R,0,Math.PI*2); ctx.fill();
    }
    ctx.fillStyle=`rgba(238,243,255,${a.toFixed(3)})`;
    ctx.fillRect((x-r*0.5)|0,(y-r*0.5)|0,r,r);
  }
  ctx.restore();
}

function drawSunMoon(S,horizon,sinp,cosp){
  const syk=VIEWH/BH;
  const body=(az,el,R,core,glow)=>{
    if(el<-0.22) return;
    const camAz=Math.atan2(-sinp,-cosp);
    let da=camAz-az;              // ⚠ 方向與 skyProject 一致，見該處說明（原本寫反）
    while(da>Math.PI)da-=Math.PI*2;
    while(da<-Math.PI)da+=Math.PI*2;
    if(Math.abs(da)>1.05) return;
    const x=W/2+Math.tan(da)*(W/2);
    const y=(horizon*syk)-el*VIEWH*0.62;
    const g=ctx.createRadialGradient(x,y,0,x,y,R*5.5);
    g.addColorStop(0,glow); g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,R*5.5,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=core; ctx.beginPath(); ctx.arc(x,y,R,0,Math.PI*2); ctx.fill();
  };
  body(S.az,S.el,13, S.dusk>0.35?'#ffd9a0':'#fff6dc', S.dusk>0.35?'rgba(255,168,88,.5)':'rgba(255,238,190,.34)');
  /* 銀月：位置固定、日夜皆在，不繞行也不盈虧。白天光暈收斂（被日光壓過），
     夜裡放到最大 —— 它是這片大陸的名字，該是天上最顯眼的東西。 */
  const mg=lerp(0.52,0.20,S.day);
  body(MOON_AZ,MOON_EL,MOON_R,'#eef1fa',`rgba(198,214,252,${mg.toFixed(2)})`);
}

/* zLo/zHi＝只畫這段深度的雲。城是在雲之後畫的，所以城會壓在**所有**雲上面
   —— 飛在雲上看城時，城的貼圖蓋過本該在它前面的雲團，整座城像浮在雲層之上。
   改成分兩趟：比城遠的雲先畫、比城近的雲在城之後畫。分界取最近那座城的深度
   （城本身橫跨上千單位，單一分界一定有取捨；雲團是軟的大團，取城心最不吃虧）。 */
/* ══⚠⚠⚠ 雲團的軟邊圓斑：**烘一張，之後只貼**（ver -1301）══════════════════
   Ray：「iMac／iPhone 跑起來沒問題，Windows 爆 GPU」。實測就是這裡：
   一幀之內 `createRadialGradient` **141 次**、`ellipse`＋`fill` 各 **140 次**
   （28 團 × 5 個子斑）—— 每個子斑都**當場 new 一個漸層物件**，Chrome 無從快取，
   每次都要重新光柵化，再疊上大面積的半透明填色（overdraw）。

   ⚠⚠ **為什麼 Mac 沒事、PC 爆**：蘋果是統一記憶體 ＋ tile-based GPU，這種畫法
     吃得下；PC 的獨立顯卡（實測 GT 1030）要走 PCIe，大量漸層光柵化＋overdraw
     把 3D 與 Copy 兩個引擎都吃滿 —— 實測 GPU 持續 **95~135%**，而 **CPU 只有
     3~12%**（純 GPU 瓶頸，CPU 在等）。**在 Mac 上開發看不到這件事。**
   ⚠⚠ 這也是為什麼**降畫質完全沒用**（Ray 實測 `?q=0` 與 `?q=4` 一樣卡）：
     `QUALITY` 只縮地形的取樣緩衝，而雲是畫在 2D 畫布上的，一個像素都沒省。

   ⚠ 顏色隨日夜走，所以拿顏色當快取鑰匙 —— 它一秒才變幾次，同一幀之內是常數。
   ⚠ 烘圖的長寬比固定 0.62（＝原本橢圓的比例），所以一張就夠；大小交給
     `drawImage` 縮放 —— 軟邊圓斑放大看不出來。
   ⚠ 烘 192px 寬：再大沒有意義（它本來就是糊的），再小放大到整片天會有階梯。 */
const PUFF_W = 192, PUFF_ASPECT = 0.62;
let _puffCv = null, _puffKey = '';
function puffSprite(cr, cg, cb){
  const key = cr + ',' + cg + ',' + cb;
  if(_puffCv && _puffKey === key) return _puffCv;
  const w = PUFF_W, h = Math.round(PUFF_W * PUFF_ASPECT);
  if(!_puffCv){ _puffCv = document.createElement('canvas'); _puffCv.width = w; _puffCv.height = h; }
  const x = _puffCv.getContext('2d');
  x.clearRect(0, 0, w, h);
  const g = x.createRadialGradient(w/2, h/2, 0, w/2, h/2, w/2);
  g.addColorStop(0, `rgba(${cr},${cg},${cb},.9)`);
  g.addColorStop(1, `rgba(${cr},${cg},${cb},0)`);
  x.fillStyle = g; x.fillRect(0, 0, w, h);
  _puffKey = key;
  return _puffCv;
}
function drawPuffs(S,scaleH,horizon,sinp,cosp,zLo,zHi){
  const sxk=W/BW, syk=VIEWH/BH;
  const fx=-sinp, fy=-cosp;
  const lo=(zLo===undefined)?0:zLo, hi=(zHi===undefined)?Infinity:zHi;
  const list=[];
  PUFFS.forEach(p=>{
    const dx=p.x-cam.x, dy=p.y-cam.y;
    const z=dx*fx+dy*fy;
    if(z<3||z>ZFAR) return;
    if(z<lo||z>=hi) return;
    const s=(dx*cosp+dy*(-sinp))/z;
    if(s<-2.4||s>2.4) return;
    list.push({p,z,s});
  });
  list.sort((a,b)=>b.z-a.z);
  const lit=lerp(0.72,1.0,S.day), warm=S.dusk;   // 銀月照著，夜裡的雲團不該是灰的
  list.forEach(({p,z,s})=>{
    const x=((s+1)/2*BW)*sxk;
    const y=(((cam.alt-p.h)/z + z*curvAt(s))*scaleH+horizon)*syk;
    const R=p.r/z*scaleH*syk*0.9;
    if(R<1.2) return;
    const a=p.a*clamp((ZFAR-z)/(ZFAR*0.45),0,1)*clamp(z/30,0,1);
    if(a<0.012) return;
    const cr=Math.round(lerp(226,255,warm)*lit),
          cg=Math.round(lerp(232,206,warm)*lit),
          cb=Math.round(lerp(244,186,warm)*lit);
    const spr=puffSprite(cr,cg,cb);
    ctx.save(); ctx.globalAlpha=a;
    for(let k=0;k<5;k++){
      const ang=k/5*Math.PI*2+p.seed*6;
      const ox2=Math.cos(ang)*R*0.42, oy2=Math.sin(ang)*R*0.17;
      const rr=R*(0.52+((k*37)%7)/14);
      /* ⚠ 貼上去的矩形 ＝ 原本那個橢圓的外接框（寬 2rr、高 2×0.62rr）。
         結果與原本相同：漸層在半徑 rr 就歸零，外接框四角距中心 1.18rr
         早已全透明，所以「矩形」與「橢圓裁切」畫出來一樣；唯一被切到的是
         上下兩端（距中心 0.62rr、alpha 還有 0.34），而那正是烘圖時
         畫布高度切掉的同一條邊。 */
      ctx.drawImage(spr, x+ox2-rr, y+oy2-rr*0.62, rr*2, rr*1.24);
    }
    ctx.restore();
  });
}

/* ══ 蒸汽火車 ══════════════════════════════════════════════════════
   ⚠「偶有」是規格的一部分，不是省事：每條線上**最多一列車**，跑完一趟要在
     終點站停一段時間才再發車。所以大多數時候低頭看到的是空的軌道，偶爾才
     追得上一列 —— 那個「撞見」才是要的東西。整條線隨時都有車在跑的話，它
     就退成一條會動的背景裝飾了。
   ⚠ 尺寸照**遊戲的比例**不是真實比例。這張地圖 1 世界單位 ≈ 46 公尺，真的
     一列車只有 2 個單位，從巡航高度看等於不存在；城的插畫本來就放大了同樣
     的倍率（一座城 550~1250 單位＝25~58 公里），火車跟著城走才協調。
   ⚠ 發車時刻用各自的 LCG 而不是 Math.random：重整一次就換一套時刻表的話，
     「這條線大概多久一班」這件事玩家永遠感覺不到。 */
const TRAIN_SPEED = 120;        // 世界單位／秒
/* ⚠ 車廂的尺寸是「讀得出來」定的，不是比例定的。真實的車廂長寬比約 8:1，
     從空中畫出來就是一條 2 像素寬的線 —— 使用者回報的「像條蟲、看不出節感」
     就是這個；而 2 像素寬的線在次像素移動時會整段忽有忽無（回報的「閃滅」
     也是同一個根）。改成約 1.8:1 的方塊，一節就是一個看得出來的量體。
   ⚠ 空隙要**夠大**（CAR 30 / GAP 14）：節與節之間至少要留得住一個像素，
     不然五節連成一條，節感一樣沒有。 */
const TRAIN_CAR   = 30;         // 一節車廂的長度（世界單位）
const TRAIN_CAR_W = 17;         // 一節車廂的寬度
const TRAIN_GAP   = 14;         // 節與節之間的空隙
const TRAIN_CARS  = 5;          // 機車頭＋四節
const TRAIN_PITCH = TRAIN_CAR+TRAIN_GAP;
const TRAIN_DWELL = [30,90];    // 終點站停靠秒數的範圍＝發車間隔
/* 整列車在螢幕上的最小長度（像素）。⚠ 這是「不閃」的關鍵，但**下限要壓在
   「整列車的長度」上，不能只壓車身的寬**：只壓寬的話遠處會變成「每節 1 像素長
   ×2.4 像素寬」—— 比自己還胖，五節糊成一條帶子，那正是回報的「像條蟲」。
   壓整列的長度就等於等比放大，長寬比不會被翻過來。
   ⚠ 放大只在最後一小段距離內發生：206 世界單位的車身要 22 像素，換算 z≈1753，
     而剔除面在 2232 —— 最大只放大 1.27 倍，近距離完全是真實投影。 */
const TRAIN_MIN_PX = 22;        // 整列車的最小螢幕長度
const TRAIN_MIN_W  = 1.6;       // 車身最小寬（螢幕像素）
/* 車高＝車寬的幾倍。真實車廂高寬比約 1.2，但從空中俯看時「高」是往螢幕上方
   擠出來的那一截 —— 給足了才看得出是箱子而不是色帶。 */
const TRAIN_BOX_H  = 0.85;
const TRAIN_SPAN   = TRAIN_CARS*TRAIN_CAR + (TRAIN_CARS-1)*TRAIN_GAP;   // 車身總長（世界單位）
/* ── 煙：**一朵一朵的雲塊**，不是一條連續的煙柱 ─────────────────────
   ⚠ 密集取樣（0.18 秒一團、18 團）畫出來是一根**實心白柱** —— 使用者回報的
     「看起來變成光線了」就是這個。等間距、等速長大的團疊在一起，累積不透明度
     遠高於單團，於是整條煙糊成一根繩子，還把後面幾節車廂蓋掉。
   ⚠ 正解是**疏而大**：0.55 秒才噴一團、總共 7 團。團與團之間隔著 66 世界單位
     （車身全長才 206），所以看得出是一朵一朵冒出來、脹大、然後散掉。
   ⚠ 順帶：團數少一半以上，成本也跟著降 —— 一列車的橢圓從 36 個降到 14 個。 */
const SMOKE_N     = 7;          // 同時存在的雲塊數
const SMOKE_DT    = 0.55;       // 每隔幾秒噴一朵
let TRAINS=[];
/* ══ 火車的像素化緩衝（ver -391，Ray：「飛行畫面的火車進行像素化處理」）══
   火車原本是**直接畫在主畫布上的向量圖形**（抗鋸齒、全解析度），可是它旁邊的地形
   是低解析緩衝放大出來的像素塊 —— 一列邊緣乾乾淨淨的車貼在馬賽克山上，讀起來像貼紙。
   作法與怪同一套（見 drawEnemy3D 的 `enemyFB`）：先畫進一張**與地形同解析度**的
   離屏緩衝，再關掉平滑 1:1 放大貼回來。
   ⚠ 緩衝只**長不縮**（縮到剩一半以下才重配）：一列車每幀的外框都會變一點，
     每幀 new 一張 canvas 是白花的配置成本（怪只有一隻，火車可能好幾列）。 */
let trainFB=null, TC=null;

function buildTrains(){
  TRAINS=RAIL_PATHS.map((pts,i)=>{
    /* 累積弧長（世界單位）：靠它等速前進，也靠它把「跑了多遠」換回座標。
       ⚠ 折線的每一段長度並不相等（斜走的一格是 1.414 格），照節點數推進的話
         車速會隨路徑的曲折而忽快忽慢。 */
    const cum=new Float64Array(pts.length);
    for(let k=1;k<pts.length;k++)
      cum[k]=cum[k-1]+Math.hypot(pts[k][0]-pts[k-1][0], pts[k][1]-pts[k-1][1])*MAP_SCALE;
    const len=cum[pts.length-1]||0;
    /* ── 路基高度（不是地面高度）────────────────────────────────
       ⚠ 車不能逐節去讀腳下的 HGT。折線是在**降取樣**的高度場上找出來的，
         全解析度的地面在它底下起伏得多；逐節照讀的結果是整列車在螢幕上
         扭成一條蛇（實測側掠時車身橫向只有 31px，縱向卻散開 99px —— 那 99px
         全是地面的雜訊，不是透視）。
       ⚠ 真實的鐵路本來就不貼著地面走：填方、路塹、橋梁把路基削成一條平順的
         線。所以這裡沿著折線做幾趟一維平滑，存成 hs —— 那才是「軌道面」。
       ⚠ 再抬 EMBANK：路基高出地面一點，車才是坐在軌道上而不是陷進土裡。 */
    const EMBANK=3;
    /* 軌道面直接用 buildRails 算好的**設計高程**（受坡度限制的縱斷面）——
       兩邊用同一條線，車才會跑在自己的軌道上。
       ⚠ 先前這裡是自己再平滑一次地面。那條線會跟著地形爬上山頂，於是
         「地表不鋪軌」的隧道段與「車在哪」對不起來。 */
    const hs=new Float64Array(pts.length);
    const src=pts.prof;
    for(let k=0;k<pts.length;k++) hs[k]=(src?src[k]:HGT[clamp(pts[k][1]|0,0,MAPH-1)*MAPW+clamp(pts[k][0]|0,0,MAPW-1)])+EMBANK;
    /* ── 車站：火車跑到市區外緣就停，不開進城裡 ──────────────────
       軌道本身是鋪到城心的（城裡當然有站場），但**車**只跑到市區外緣就折返 ——
       開進城裡的話車會從手繪的屋頂上輾過去，而且那個尺度下整列車會被城蓋掉，
       看起來就是「憑空消失」。停在外緣反而讀得出「它到站了」。
       ⚠ 位置是沿著**弧長**找的，不是照節點數：兩端各往內走，直到離城心超過
         townEdgeR 為止。折線在城附近常常很曲折，照節點數抓會差很多。
       ⚠ 車頭停在外緣，車廂還在更外面 —— 整列車都在城外，正確。 */
    /* 車站位置與站場路基**共用 railStations** —— 各算各的話會畫在一個地方、
       車停在另一個地方。 */
    const st=railStations(pts);
    const sMin=cum[st[0]], sMax=cum[st[1]];
    return { pts, cum, len, hs, sMin, sMax, s:sMin+TRAIN_SPAN, dir:1,
             wait: 6+i*23,                 // 錯開首發，三條線不要一起出車
             rnd: (0x9E3779B1*(i+1))>>>0,  // 各自的時刻表種子
             puffs:[], puffT:0 };
  /* ⚠ 濾的是**兩站之間**的距離，不是整條線的長度：軌道再長，只要兩座城的
     市區幾乎相接，中間就擺不下一列車。 */
  }).filter(T=>T.sMax-T.sMin>TRAIN_SPAN*1.5);
}
/* 每列車各自的 LCG（數值取自 Numerical Recipes），回 0..1。 */
function trainRnd(T){ T.rnd=(T.rnd*1664525+1013904223)>>>0; return T.rnd/4294967296; }

function updateTrains(dt){
  for(const T of TRAINS){
    if(T.wait>0){ T.wait-=dt; continue; }
    T.s+=TRAIN_SPEED*dt*T.dir;
    /* 到站（市區外緣）：掉頭，停一段時間再發。
       ⚠ 掉頭時 s 要**往回挪一整列車長**。T.s 記的是「行進方向上的**車頭**」，
         而車廂掛在 s 的反方向；掉頭之後原本的車尾變成車頭 —— 不挪的話整列車
         會憑空跳到另一側，也就是直接**跳進城裡**。挪完之後車佔的那一段
         [sMax−SPAN, sMax] 完全沒變，只是換了個頭。 */
    if(T.dir>0 ? T.s>=T.sMax : T.s<=T.sMin){
      T.s=(T.dir>0?T.sMax:T.sMin)-T.dir*TRAIN_SPAN;
      T.dir=-T.dir;
      T.wait=TRAIN_DWELL[0]+trainRnd(T)*(TRAIN_DWELL[1]-TRAIN_DWELL[0]);
    }
    /* 煙：把機車頭走過的位置留在**世界座標**上（不是掛在車上跟著跑）。
       這樣過彎時煙柱會留在彎道外側、慢慢散開，跟真的一樣；掛在車上的話
       整條煙會跟著車一起轉，看起來像一根黏在煙囪上的棍子。 */
    T.puffT+=dt;
    if(T.puffT>=SMOKE_DT){
      T.puffT=0;
      const h=trainAt(T,T.s);
      if(h&&h.tun){ /* 在隧道裡不留煙：煙會留在世界座標上，山頂會冒出一條煙柱 */ }
      else
      /* ⚠ 每團記一個抖動值 j。等間距、等速長大的煙團疊起來是一條**均勻的白繩**，
         不是煙 —— 真的蒸汽是一噴一噴、大小不一的。j 決定這一團的大小與橫向偏移，
         用各自的 LCG 生（同時刻表那條理由：重整後要長一樣）。 */
      if(h){ T.puffs.push({x:h.x,y:h.y,h:h.h,age:0,j:trainRnd(T)});
             if(T.puffs.length>SMOKE_N) T.puffs.shift(); }
    }
    for(const q of T.puffs) q.age+=dt;
  }
}

/* 弧長 → 地圖座標＋切線方向＋地面高度。走不到就回 null。 */
function trainAt(T,s){
  const C=T.cum, P=T.pts, n=P.length;
  if(n<2) return null;
  s=clamp(s,0,T.len);
  // 二分找所在的段
  let lo=0, hi=n-1;
  while(hi-lo>1){ const m=(lo+hi)>>1; if(C[m]<=s) lo=m; else hi=m; }
  const seg=C[hi]-C[lo];
  const t=seg>1e-6?(s-C[lo])/seg:0;
  const x=P[lo][0]+(P[hi][0]-P[lo][0])*t, y=P[lo][1]+(P[hi][1]-P[lo][1])*t;
  const tn=P.tun ? (P.tun[lo]||P.tun[hi]) : 0;      // 任一端在山裡就算在隧道內
  return { x, y, h:T.hs[lo]+(T.hs[hi]-T.hs[lo])*t,   // 軌道面，不是腳下的地面
           dx:P[hi][0]-P[lo][0], dy:P[hi][1]-P[lo][1], tun:tn };
}

/* 3D 視窗裡的火車。投影與 drawPlaces 同一套；遮擋走 clipByTerrainDepth
   （山擋在前面時車要被吃掉，不能浮在山坡上）。 */
/* ══ 城的炊煙（ver -446，Ray：「讓北方泊地城鎮冒煙」）═══════════════════
   資料掛在 SETTLEMENTS 的 `smoke:{n,seed,area}`（鐵律 1）—— 目前只有北方泊地。
   作法照**火車的煙**那一套（一朵一朵的雲塊、世界座標上長高、兩層濃淡、
   §6.7 的像素化緩衝、逐欄地形遮擋），差別只在噴發端是**固定的煙囪**：
   位置由種子從城的內圈生出來、跟著城的旋轉走，每根有自己的節奏與抖動。
   ⚠ 煙囪的位置是**城的局部座標**（-1..1，同取樣的 uv）—— 城搬家、轉向，
     煙跟著走，不必重填。`area` 可把煙囪限制在某一塊（北方泊地讓開北緣的碼頭）。
   ⚠ 只在 `CS_FAR` 之內更新與畫：太遠一朵煙不到一個像素，白付幾十次 ellipse。
     age 用夾過的 dt 推（同量體淡入那一條）—— 離開畫面再回來不會爆一大步。 */
const CS_LIFE=8.0;             // 一朵活多久（秒）—— 柱子要長到屋脊線之上（ver -447）
const CS_DT=2.1;               // 每根煙囪隔幾秒吐一朵（再乘逐根的抖動）
const CS_RISE=19;              // 上升（世界單位／秒）
const CS_WINDX=6, CS_WINDY=2.5;// 風（世界單位／秒）：微微往東南飄
const CS_FAR=ZFAR*0.5, CS_FADEB=ZFAR*0.14;
let citySmokeFB=null, CSC=null, csLast=0;
function chimneysOf(s){
  if(s._chim) return s._chim;
  const lo=cityPlanLo[s.plan]; if(!lo) return null;         // 要圖的長寬比才擺得準
  const sm=s.smoke, n=sm.n||6;
  const hw=s.planW*0.5, hh=hw*lo.height/lo.width;
  const rot=s.planRot||0, ca=Math.cos(rot), sa=Math.sin(rot);
  const A=sm.area||[-0.55,0.55,-0.2,0.5];                   // 預設：內圈偏下（讓開上緣）
  let r0=(sm.seed||7)|0;
  const rnd=()=>((r0=(r0*1103515245+12345)&0x7fffffff)/0x7fffffff);
  const out=[];
  for(let i=0;i<n;i++){
    const u=A[0]+rnd()*(A[1]-A[0]), v=A[2]+rnd()*(A[3]-A[2]);
    const lx=u*hw, ly=v*hh;
    out.push({ mx:s.mx+(lx*ca-ly*sa)/MAP_SCALE,             // 地圖像素座標（proj 吃這個）
               my:s.my+(lx*sa+ly*ca)/MAP_SCALE,
               h0:10+rnd()*14,                              // 煙囪口高（屋頂上一點）
               jit:0.6+rnd()*0.8,                           // 這一根的節奏抖動
               t:rnd()*CS_DT, puffs:[] });
  }
  s._chim=out; return out;
}
function drawCitySmoke(S,scaleH,horizon,sinp,cosp,now){
  if(!window.Settlement||!MAPW) return;
  const dt=csLast?clamp((now-csLast)/1000,0,0.1):0.016; csLast=now;
  const sxk=W/BW, syk=VIEWH/BH;
  const proj=(mx,my,h)=>{
    const dx=mx*MAP_SCALE-cam.x, dy=my*MAP_SCALE-cam.y;
    const z=dx*(-sinp)+dy*(-cosp);
    if(z<40||z>CS_FAR+400) return null;
    const sv=(dx*cosp+dy*(-sinp))/z;
    if(sv<-1.4||sv>1.4) return null;
    return { x:((sv+1)/2*BW)*sxk,
             y:(((cam.alt-h)/z + z*curvAt(sv))*scaleH+horizon)*syk,
             z, k:(W/(2*z)) };
  };
  const lit=lerp(0.66,1.0,S.day);
  /* 白煙（ver -447b，Ray：「黑煙不清楚 還是白煙吧 大一點」）——
     黑煙在暗色屋頂上隱形，只有襯著天空那一截讀得出來；白煙兩邊都清楚。
     外圈灰白、內核稍濃（同火車的兩層作法），照吃日夜的 lit。 */
  const g=Math.round(lerp(200,242,S.day)*lit);
  const gs='rgb('+g+','+g+','+Math.round(g*0.97)+')';
  const c2=Math.round(g*0.78), cs='rgb('+c2+','+c2+','+Math.round(c2*0.99)+')';
  for(const s of buildSettlements()){
    if(!s.smoke) continue;
    const dxs=s.mx*MAP_SCALE-cam.x, dys=s.my*MAP_SCALE-cam.y;
    const zs=dxs*(-sinp)+dys*(-cosp);
    if(zs>CS_FAR || zs<-s.planW*0.7) continue;
    const ch=chimneysOf(s); if(!ch) continue;
    /* 更新（只在看得到的範圍內跑，age 走夾過的 dt）＋收集要畫的雲塊。 */
    const draw=[]; let cx0=1e9,cx1=-1e9,cy0=1e9,cy1=-1e9,zClip=1e9;
    for(const c of ch){
      c.t-=dt;
      if(c.t<=0){ c.t=CS_DT*c.jit*(0.7+Math.random()*0.6);
        c.puffs.push({age:0, j:Math.random()});
        if(c.puffs.length>6) c.puffs.shift(); }
      for(const q of c.puffs){
        q.age+=dt;
        const a0=clamp(1-q.age/CS_LIFE,0,1);
        if(a0<=0.03) continue;
        const drift=q.age/MAP_SCALE;
        const pp=proj(c.mx+CS_WINDX*drift, c.my+CS_WINDY*drift, s.gh+c.h0+q.age*CS_RISE);
        if(!pp) continue;
        const pf=clamp((CS_FAR-pp.z)/CS_FADEB,0,1);
        if(pf<=0.01) continue;
        const born=clamp(q.age/0.2,0,1);                    // 冒出來那 0.2 秒淡入（同火車）
        const r=Math.max(0.9,(5.4+q.age*4.6)*(0.66+q.j*0.68)*pp.k);   // 再大一點（ver -447b，Ray 指定）
        const ox=(q.j-0.5)*r*0.8;
        draw.push({x:pp.x+ox,y:pp.y,r,a0,life:q.age/CS_LIFE,f:pf*born});
        if(pp.x+ox-r<cx0)cx0=pp.x+ox-r; if(pp.x+ox+r>cx1)cx1=pp.x+ox+r;
        if(pp.y-r*1.3<cy0)cy0=pp.y-r*1.3; if(pp.y+r>cy1)cy1=pp.y+r;
        if(pp.z<zClip)zClip=pp.z;
      }
      c.puffs=c.puffs.filter(q=>q.age<CS_LIFE);
    }
    if(!draw.length) continue;
    /* 像素化緩衝＋逐欄遮擋（§6.7 通則；裁切深度取整團最淺的，同火車的理由）。 */
    const fpad=8, fx0=Math.floor(cx0)-fpad, fy0=Math.floor(cy0)-fpad;
    const fbw=Math.ceil(cx1-cx0)+fpad*2, fbh=Math.ceil(cy1-cy0)+fpad*2;
    if(fbw<2||fbh<2) continue;
    const pk=clamp(BW/W,0.15,1);
    const bwp=Math.max(2,Math.round(fbw*pk)), bhp=Math.max(2,Math.round(fbh*pk));
    if(!citySmokeFB){ citySmokeFB=document.createElement('canvas'); CSC=citySmokeFB.getContext('2d'); }
    if(citySmokeFB.width<bwp||citySmokeFB.height<bhp||citySmokeFB.width>bwp*2||citySmokeFB.height>bhp*2){
      citySmokeFB.width=bwp; citySmokeFB.height=bhp; }
    CSC.setTransform(1,0,0,1,0,0); CSC.clearRect(0,0,bwp,bhp);
    CSC.setTransform(bwp/fbw,0,0,bhp/fbh,-fx0*bwp/fbw,-fy0*bhp/fbh);
    for(const q of draw){
      CSC.globalAlpha=q.a0*Math.sqrt(q.a0)*0.52*q.f;
      CSC.fillStyle=gs;
      CSC.beginPath(); CSC.ellipse(q.x,q.y-q.r*0.25,q.r,q.r*0.74,0,0,Math.PI*2); CSC.fill();
      if(q.life<0.4){
        CSC.globalAlpha=(1-q.life/0.4)*0.42*q.f;
        CSC.fillStyle=cs;
        CSC.beginPath(); CSC.ellipse(q.x,q.y-q.r*0.25,q.r*0.55,q.r*0.44,0,0,Math.PI*2); CSC.fill();
      }
    }
    CSC.globalAlpha=1;
    ctx.save();
    clipByTerrainDepth(zClip, sxk, syk, clamp(Math.floor(cx0/sxk)-2,0,BW-1), clamp(Math.ceil(cx1/sxk)+2,0,BW-1));
    ctx.drawImage(citySmokeFB,0,0,bwp,bhp,fx0,fy0,fbw,fbh);
    ctx.restore();
  }
}
/* ══ 地表小型遺蹟的繪製（ver -1107，見 RUIN_ART 的說明）══════════════════
   投影與火車／地標同一套；遮擋走 `clipByTerrainDepth`；像素化走「畫進與地形
   同解析度的離屏、再 1:1 放大」（§6.7 的通則）。
   ⚠ 一座遺蹟畫**一張離屏**：逐塊各開一張會多好幾次 canvas 配置，而它們本來
     就擠在一小塊螢幕上。
   ⚠ 畫家演算法：底板 → 由遠而近的方塊。方塊的牆累積成**一條路徑一次 fill**
     （同量體層）：顏色一樣，重疊不影響外觀，省下幾十次 fill。 */
let ruinFB=null, RFC=null;
/* ══⚠⚠⚠ 幾何擷取模式（ver -1205）═══════════════════════════════════════
   遺蹟要搬上 GPU，需要它的**局部世界座標**幾何。而那幾支產生器
   （`box`／`gable`／`prism`／`crenel`／倒柱）是 Ray 從 -1156 調到 -1167 的成果，
   **絕對不要另外寫一份**（鐵律 8：一個動作一個實作 —— 兩份必然走鐘，
   而且是那種「GL 的城堡跟 CPU 的城堡長得不一樣」的走鐘）。
   ⇒ 改成讓同一支 `drawRuins` 跑一次「只算幾何、不畫」的模式：
     · `px` 回傳假點（不做視錐剔除）—— 擷取要的是 `loc`／`locTop`／`z0`／`h`，
       那四樣**與相機無關**，`base`／`top` 擷取時用不到。
     · `detailK` 給極大值 ⇒ `unreadable`／`tooSmall`／`flatten` 全部不成立、
       多邊柱拿回作者寫的邊數 ⇒ **擷取到的是滿細節的版本**（GPU 不需要 LOD）。
     · 三個距離／視角的 `continue` 一律跳過。
   ⚠ 擷取只在開機跑一次（遺蹟是靜態的），之後每禎只是畫 VBO。 */
let RUIN_CAPTURE=false, ruinCapOut=null;
/* 環境光的三個旋鈕（ver -1165）。`AMB`＝白天也吃這麼多（「多吃一點環境光」）；
   `AMB_NIGHT`＝夜裡**額外**吃的份量（實測把夜裡的亮度比由 1.34 拉回 1.16）；
   `EASE`＝逐禎往新取樣逼近的比例（取樣是 0.4 秒一次的，不平滑會跳階）。 */
const RUIN_AMB=0.08, RUIN_AMB_NIGHT=0.20, RUIN_AMB_EASE=0.08;
/* ⚠⚠ 這兩個數字是**解出來的**，不是憑感覺（ver -1165）。量「畫面亮部的九十百分位」，
   分別在 a=0 與 a=0.16／0.66 兩個點上量，反推斜率，再解到目標比值：
     白天 遺蹟／地形 ≈ 1.10（Ray 驗收過的樣子，只再往環境靠一點點）
     夜裡 遺蹟／地形 ≈ 1.01（原本 1.21~1.34 —— 那就是「晚上太亮」）
   ⚠ 目標不是「夜裡與地形一樣暗」：石頭本來就比林地淺，壓到比地形還暗反而是另一種錯。 */
let ruinAmb=null;
let RZMIN=null;                 // 遺蹟的逐欄最近深度（見 drawRuins 的 colSpan）
function drawRuins(scaleH,horizon,sinp,cosp){
  if(!MAPW) return;
  const sxk=W/BW, syk=VIEWH/BH, dyk=scaleH*syk;
  for(const P of PLACES){
    const A=P.ruin && RUIN_ART[P.ruin]; if(!A) continue;
    /* ⚠⚠ **掃到才看得見**（ver -1107，Ray 定案）：沒感應到之前地表一點痕跡都沒有
       —— 與隱藏點位 ★ 同一條規矩（沒發現的連問號都不給）。
       ⚠ 於是「找到它」只有一條路：混沌感知。名牌／地圖標記也吃同一支旗。 */
    /* ⚠⚠⚠ **擷取時不看旗**（ver -1322）：GL 的網格是開機**一次性**擷取的
       （`glBuildRuins` 就是用 `RUIN_CAPTURE` 走這一支）—— 在這裡被旗擋掉的話
       那座遺蹟**連網格都不會建**，之後掃到了也永遠畫不出來（要重整一次才有）。
       ⇒ 擷取一律全收，「看不看得見」交給畫的那一刻判：CPU 走下面這一行，
         GL 走 `glDrawRuins` 的同一個條件（鐵律 7：判定的資料來源只有 `P.flag`）。 */
    /* ⚠ 與 GL 那條**共用** `revealK`（鐵律 8）：0＝還沒掃到、0→1＝剛掃到、1＝早就有。 */
    const rk0 = RUIN_CAPTURE ? 1 : revealK(P.flag);
    if(rk0<=0.001) continue;
    const wx0=P.x*MAP_SCALE, wy0=P.y*MAP_SCALE;
    const ddx=wx0-cam.x, ddy=wy0-cam.y;
    const dist=Math.hypot(ddx,ddy);
    if(!RUIN_CAPTURE && dist>RUIN_FAR) continue;   // 太遠：小到讀不出形狀，省下來
    const zc=ddx*(-sinp)+ddy*(-cosp);
    if(!RUIN_CAPTURE && zc<RUIN_NEAR) continue;    // 身後／正下方（那個角度本來就看不到）
    /* 淡入走 smoothstep 不走線性（ver -1155）：線性在剛跨進視距那一格會「啪」地
       出現一層薄影，兩端收平才讀得出是**浮出來**的。 */
    const fk=clamp((RUIN_FAR-dist)/RUIN_FADE,0,1), fade=fk*fk*(3-2*fk)*rk0;
    if(!RUIN_CAPTURE && fade<=0.02) continue;
    /* ══⚠⚠ 墊高（ver -1153，Ray：「底加厚墊高」）══
       整地之後地面與石地板會**完全等高**，而逐欄的深度遮擋在同高時是打平手 ——
       哪一欄被裁掉全看浮點誤差，畫面上就是斑駁的破洞（`PODIUM_CLEAR` 那一段
       當年在城上踩過一模一樣的坑）。墊高把平手打破。
       ⚠ 墊高**一定要配基座側壁**（下面 ①a），不然它就是浮在地上 8 個單位。
         這就是 Ray 說的「底加厚」——「厚」是讓「高」看起來有道理的那一半。 */
    /* 這一座用哪一組色階（ver -1164）。沒寫＝預設那一組（石製遺蹟／伊甸古墓）。 */
    const C=(A.pal && RUIN_PAL[A.pal]) || RUIN_COL;
    const lift=A.lift||0;
    const gh=HGT[clamp(P.y|0,0,MAPH-1)*MAPW+clamp(P.x|0,0,MAPW-1)]+lift;   // 整座共用一個底（石地板是平台）
    const ca=Math.cos(A.rot||0), sa=Math.sin(A.rot||0);
    /* ══⚠⚠⚠ `drape` ＝每一塊踩**自己腳下的**地形（ver -1231）════════════════
       `gh` 是**整座共用一個底**（石地板本來就是一塊平台）。那對「站在平地上、
       或整過地」的遺蹟是對的，但對 `noBase`＋不整地的（木雅克）是**災難**：
       (1038,798) 是一個直徑三格的**坑**，四周的地形比坑底高 80〜180，
       於是 34 塊裡有 **22 塊整個埋在地下**（實測）—— 畫面上只剩幾支最高的細柱
       從洞裡冒出來。Ray 說的「柱太多太細太長」，看到的就是那個。
       ⚠⚠ 它**不是**把遺蹟墊平：每一塊各自沉進**自己腳下**的地面，
         所以「嵌進山裡」照舊成立（`z0` 仍然是負的），只是嵌的是**它那一格**的山。
       ⚠ 疊在別人頭上的零件（簷口／拱／柱頭／斷口，`z0>0`）**跟著母塊**，
         不自己取樣 —— 各自取樣的話，隔 0.3 格的拱會相對於它的牆上下滑動。
         規約：`z0<=0` ＝踩地（自己取樣並成為後續的母塊），`z0>0` ＝疊在**前一塊
         踩地的零件**上。所以資料要**母塊寫在它的附件前面**。
       ⚠ 取樣走**雙線性**不是取整格：相鄰兩塊落在不同格時會差一整階，
         那在畫面上是兩段牆莫名其妙錯開一截。 */
    const drape=!!A.drape;
    let curDz=0;
    const hAtLocal=(lx,ly)=>{
      const wx=(wx0+(lx*ca-ly*sa))/MAP_SCALE, wy=(wy0+(lx*sa+ly*ca))/MAP_SCALE;
      const ix=Math.floor(wx), iy=Math.floor(wy), fx=wx-ix, fy=wy-iy;
      const xa=clamp(ix,0,MAPW-1), xb=clamp(ix+1,0,MAPW-1);
      const ya=clamp(iy,0,MAPH-1), yb=clamp(iy+1,0,MAPH-1);
      const h0=HGT[ya*MAPW+xa]*(1-fx)+HGT[ya*MAPW+xb]*fx;
      const h1=HGT[yb*MAPW+xa]*(1-fx)+HGT[yb*MAPW+xb]*fx;
      return (h0*(1-fy)+h1*fy)-gh;
    };
    /* ⚠⚠ 取**自己 footprint 內最低的那一點**，不是中心：斜坡上一塊 50 長的牆，
       兩端的地面可以差 40 —— 取中心的話高的那一端會**浮在地上**（那正是
       -1225 被 Ray 指出的「地基」的另一種長相）。取最低點 ⇒ 高的那一端多埋一點，
       而多埋只會讓它更貼山，不會露底。 */
    /* ⚠ `drapeUp`（ver -1233，Ray：「神殿整體高度位置上移一些，中間露出一點地基」）
       ＝整座**一起往上抬**這麼多。抬了之後每一塊的底離它腳下最低點只剩
       `|z0| − drapeUp`，所以**取樣要更準**（5×5 不是 3×3）：GL 的地形走的是
       平滑高度圖，我這邊少抓到一點低點，差額就是一塊**浮在地上**的零件。 */
    const drapeUp=A.drapeUp||0;
    const drapeDz=(lx,ly,w,l)=>{
      const hw=(w||0)/2, hl=(l||0)/2;
      let m=Infinity;
      for(let i=-2;i<=2;i++) for(let k=-2;k<=2;k++)
        m=Math.min(m, hAtLocal(lx+i*hw*0.5, ly+k*hl*0.5));
      return m+drapeUp;
    };
    /* 局部座標（世界單位、以遺蹟中心為原點）→ 螢幕。回 null＝這一點不能用。 */
    const px=(lx,ly,h)=>{
      /* ⚠ 擷取模式：回一個固定的假點。擷取要的是 `loc`／`locTop`／`z0`／`h`
         （與相機無關），`base`／`top` 用不到 —— 但**不能回 null**，
         不然產生器會判定「這一塊不可見」而整塊丟掉。 */
      if(RUIN_CAPTURE) return { x:0, y:0, z:1000 };
      const wx=wx0+(lx*ca-ly*sa), wy=wy0+(lx*sa+ly*ca);
      const dx=wx-cam.x, dy=wy-cam.y;
      const z=dx*(-sinp)+dy*(-cosp);
      if(z<RUIN_NEAR) return null;
      const sv=(dx*cosp+dy*(-sinp))/z;
      if(sv<-1.6||sv>1.6) return null;
      return { x:((sv+1)/2*BW)*sxk,
               y:(((cam.alt-gh-(h||0))/z + z*curvAt(sv))*scaleH+horizon)*syk, z };
    };

         ⚠⚠ **一定要用位置算出來的假亂數，不可以用 `Math.random()`** ——
           這一層每一禎重算一次，真亂數會讓齒每禎換一批，那就是閃動
           （這一版剛花力氣修掉的東西，不要自己再造一個）。 */

      if(unreadable(ch)) return;                       // 整圈一起判（見 `unreadable`）
      const P=B.locTop||B.loc, N=P.length, zTop=(pt.z0||0)+(B.dz||0)+(pt.h||0);
      for(let k=0;k<N;k++){
        if(K.skip && K.skip.indexOf(k)>=0) continue;

           ② 那一半會落在母塊的**逐欄範圍之外**，而細節件為了省成本不自己算逐欄

                         pt.k==='tower' ? pt.r*2 : (pt.w||pt.dia||pt.len||0),
                         pt.k==='tower' ? pt.r*2 : (pt.l||pt.dia||pt.len||0)));

           `cap`（ver -1164）＝**自動接一個錐頂**：塔身與尖頂以前要寫兩行，

           （鐵律 7）。`cap:{h, r?, rTop?, mat?}`，不寫 `r` 就接著塔頂的半徑。 */

           每禎 **~950 次 fill()**，而 d140 那座城堡在畫面上只剩幾個像素 ——
           **成本完全不隨距離降**（927 次 vs 959 次）。

           而一座 n 邊柱每禎就是 n 個面：26 座塔 × (塔身 10 ＋ 錐頂 10) ≈ 520 個面，
           佔了 950 的六成 —— 與量體層 -1195 那個病完全同源（沒有距離 LOD）。
           ⇒ 邊數改成由**投影直徑**推：大約一個面對一個緩衝像素，夾在 [4, 作者寫的 n]。
           ⚠ 這**不會改剪影**：直徑只有 4px 的塔，畫 10 邊與畫 4 邊在畫面上同一個
             樣子（兩者都被取整到同幾個像素）；近距離 `detailK` 大，照樣拿回滿邊數。
           ⚠ 也**不會有零件浮空**：只降邊數、不刪零件 —— 這是與「整個剔掉」的差別，

        const hAll=pt.h+((pt.cap&&pt.cap.h)||0);
        if(pt.detail ? unreadable(hAll) : tooSmall(hAll, pt.r*2)) continue;
        const flatT=flatten(hAll, pt.r*2);
        const b=push(prism(pt.x,pt.y,pt.r,rT,n,rot,pt.h,PZ),pt,pt.detail,flatT);

        if(pt.cap){

          push(prism(pt.x,pt.y,(K.r==null?rT:K.r),(K.rTop==null?1.4:K.rTop),n,rot,K.h,z1),

        if(pt.detail ? unreadable(pt.h) : tooSmall(pt.h, pt.w||pt.dia, pt.l||pt.dia)) continue;
        push(gable(pt.x,pt.y,pt.w||pt.dia,pt.l||pt.dia,pt.rot||0,pt.h,PZ,pt.axis==='w'),
             { mat:(pt.mat===undefined?'roof':pt.mat), col:pt.col }, pt.detail,
             flatten(pt.h, pt.w||pt.dia, pt.l||pt.dia));

        for(let i=0;i<n;i++){

       由 `A.rot`／`P.x,P.y`／`gh` 在 GL 那邊套上去）。 */
    if(RUIN_CAPTURE){

    /* ══⚠⚠⚠ 離屏緩衝要**對齊地形的像素格**（ver -1165，Ray：「移動時閃動」）══
       這一層是畫進低解析緩衝再放大的（§6.7：貼在地形上的東西要跟著像素化）。
       -1148〜-1164 的寫法是：外框取**螢幕整數像素**（`floor(x0)-6`），緩衝尺寸再
       `round(fbw × BW/W)` —— 兩次獨立的四捨五入，於是
         · 放大倍率 `fbw/bwp` **每隔幾個像素就變一次**（3.00 → 3.03 → 3.06…）
         · 緩衝的像素格與地形的像素格**相位一直在漂**
       相機一動，整張遺蹟就週期性地重採樣一次 —— 實測（相機每禎前進 2.5 個世界單位）
       逐禎差分平時 9.5，**每六、七禎跳到 15**，那就是 Ray 看到的閃動。
       ⚠ 靜止時差分是 0，所以不是亂數、不是排序不穩 —— 純粹是取樣格在動。

       作法：**外框改用地形的格子去量**（`i0…i1` 都是地形像素的整數索引）：
         · 放大倍率永遠正好 `sxk`／`syk`，一個緩衝像素恰好對到一個地形格 → 不再重採樣
         · 原點永遠落在格線上 → 遺蹟的像素塊與地形的像素塊**同相**，一起整格移動
       ⚠ 這也順便修好「遺蹟的馬賽克與地形的馬賽克對不齊」那個更難講的違和感。 */
    const pad=2;                                   // 留白：2 個**地形格**（不是螢幕像素）
    const i0=Math.floor(x0/sxk)-pad, j0=Math.floor(y0/syk)-pad;
    const i1=Math.ceil (x1/sxk)+pad, j1=Math.ceil (y1/syk)+pad;
    const bwp=i1-i0, bhp=j1-j0;
    const fx0=i0*sxk, fy0=j0*syk, fbw=bwp*sxk, fbh=bhp*syk;
    if(bwp<3||bhp<3||fbw>W*4||fbh>VIEWH*4) continue;

    if(ruinFB.width<bwp||ruinFB.height<bhp||ruinFB.width>bwp*2||ruinFB.height>bhp*2){

      g.moveTo(pts[0].x,pts[0].y);

      { const gp=grassPts;

        RFC.fillStyle=grassSample(x0,y0,x1,y1); RFC.fill();
        /* 材質只疊薄薄一層當紋理：疊厚了就變回「一張綠貼紙」，顏色又對不上。 */

          const O=px(0,0,0), XA=px(baseR(A),0,0), YA=px(0,baseR(A),0);

                (XA.x-O.x)*k, (XA.y-O.y)*k, (YA.x-O.x)*k, (YA.y-O.y)*k, O.x, O.y ]));

      if(!low.some(q=>!q)){
        RFC.beginPath();
        for(let k=0;k<shape.length;k++){
          const a0=slab.base[k], b0=slab.base[(k+1)%shape.length];
          const a1=low[k],       b1=low[(k+1)%shape.length];

          RFC.lineTo(b1.x,b1.y); RFC.lineTo(a1.x,a1.y); RFC.closePath();
        }
        RFC.fillStyle=C.dark; RFC.fill();
      }

      poly(RFC,slab.base);
      let textured=false;
      if(ruinTex){
        if(!ruinTexPat) ruinTexPat=RFC.createPattern(ruinTex,'repeat');
        /* 地面座標系的兩條軸（投影出來的），換算成材質的仿射。 */

        if(ruinTexPat && O && XA && YA && ruinTexPat.setTransform){
          const k=RUIN_TEXEL/baseR(A);
          try{
            ruinTexPat.setTransform(new DOMMatrix([
              (XA.x-O.x)*k, (XA.y-O.y)*k,
              (YA.x-O.x)*k, (YA.y-O.y)*k, O.x, O.y ]));

         這一層是畫進低解析緩衝再放大的，1px 的描邊放大後會變成一圈粗黑框，

      let i=0;

       ⚠ 偏移量跟著**投影後的高度**走（近的柱子影子長），不是寫死幾個像素。 */
    /* ══⚠⚠⚠ 排序的主鍵是「底面多高」不是「多遠」（ver -1165，Ray：「移動時閃動」）══
       畫家演算法本來是「由遠而近」（`b.z-a.z`）。**那對堆疊的東西是錯的**：
       一塊坐在另一塊頭上時，兩者的水平深度只差它們的中心偏移 —— 相機一移動，

       這就是閃動：靜止時逐禎差分是 0，一移動就每隔幾禎跳一次

       正解是**照「堆上去」的順序畫**：`z0`（底面離地多高）**與相機無關**，
       所以同一疊的先後**永遠不會翻**。同一層的（`z0` 相同）才比深度 ——
       那些是真的並排的東西，深度交叉時它們在畫面上本來就不重疊。
       ⚠ 為什麼不是「真 3D 距離」：那條也修不好這個。四層崖階是**互相內嵌又往後退**
         的，水平深度差（≈24 單位）大過高度帶來的距離差（≈5），主鍵仍然是深度。
       ⚠ 這條成立的前提是**相機從空中俯瞰**：底面高的東西畫面上也在上面，
         不會被「近而矮」的東西擋住。飛行地圖永遠是這個視角。
       ⚠ 第三順位用**資料順序**（`sort` 在 V8/JSC 都是穩定排序）—— 兩個鍵都相同時

         照投的話影子會浮在半空（三角楣尤其明顯）。那一疊的影子由最底下
         那一塊負責，本來就投對了。 */
      if(B.z0>(B.dz||0)) continue;

      for(let k=0;k<B.base.length;k++){ const q=B.base[k];

    /* ══ ③ 方塊：由遠而近（畫家演算法）══

         柱子看起來是平的貼紙。這一層的立面在畫面上只有幾個像素高 —— 那個尺度下
         **貼材看不出來，明暗看得出來**，所以走的是「朝光的亮一階、背光的暗一階」
         （平塗硬邊，cel 的做法），不是貼圖。
       ⚠ 法線在**世界座標**算（`loc` 是底面四角的世界偏移），所以船繞著飛時
         亮面會跟著換 —— 用螢幕座標算的話轉一圈亮面不會動，馬上穿幫。
       ⚠ 四個面**逐面由遠而近**畫（不再一次 fill）：不同顏色了，疊錯順序會讓
         背面蓋過正面。一塊四面、十幾塊，成本仍然很小。 */
    const LGT=lightXY;
    /* ══⚠⚠ 方塊也貼石材（ver -1148，Ray：「再把貼材貼上就好了」）══
       原本只有**地板**貼材質，方塊是平塗的 —— 理由寫在下面那段註解：石製遺蹟的
       斷柱在畫面上只有幾個像素高，那個尺度下貼材看不出來。**古墓推翻了那個前提**：
       它的門面有 150×62 個世界單位，平塗就是一大片白板（§5：「在深綠的地形上
       讀起來像一張紙」）。
       ⚠⚠ **貼在那一面自己的座標系上**，不是貼在螢幕上：用那一面的兩條邊
         （底邊＝世界長 `wlen`、垂直邊＝世界高 `B.h`）解出仿射 —— 貼螢幕的話
         船一動，石頭表面會像在材質上滑（同地板那一條的理由）。
       ⚠ 蓋在平塗**之上**而且壓半透：明暗（朝光／背光／頂面）是這個解析度下
         唯一讀得出立體的線索，貼材只補表面的顆粒，不可以把明暗洗掉。
       ⚠ `A.tex` 是**明寫的開關**：石製遺蹟維持原樣（它的零件太小，貼了只是雜訊，
         而且那個樣子 Ray 已經驗收過）。 */
    /* 牆與瓦各一個 pattern（見 `ruinTexOf` 的說明：pattern 不可共用）。 */
    const patOf=name=>{
      if(!name) return null;
      if(name===true||name==='_ruins'){
        if(!ruinTex) return null;
        if(!ruinTexPat) ruinTexPat=RFC.createPattern(ruinTex,'repeat');
        return ruinTexPat;
      }
      const e=ruinTexOf(name); if(!e.img) return null;
      if(!e.pat) e.pat=RFC.createPattern(e.img,'repeat');
      return e.pat;
    };
    const wallTex = A.tex ? patOf(A.tex) : null;
    const roofTex = A.roofTex ? patOf(A.roofTex) : null;
    /* p0→p1 是底邊（世界長 wlen）、p0→q0 是另一條邊（世界長 vlen）。 */
    const texQuad=(faceTex,p0,p1,q0,wlen,vlen)=>{
      if(!faceTex || !faceTex.setTransform || wlen<1e-3 || vlen<1e-3) return false;
      const nu=wlen/RUIN_TEXEL, nv=vlen/RUIN_TEXEL;
      try{
        faceTex.setTransform(new DOMMatrix([
          (p1.x-p0.x)/nu, (p1.y-p0.y)/nu,
          (q0.x-p0.x)/nv, (q0.y-p0.y)/nv, p0.x, p0.y ]));

    for(const B of items){
      const NS=B.base.length;                    // ver -1163：方柱 4、多邊柱 n

         雉堞與小尖塔在畫面上只有三到八個像素高 —— 那個尺度下逐面的明暗**看不出來**，
         而它要付的是「每一面各開一條路徑、各 fill 一次、還要先排序」。
         實測這一層的成本不在像素而在**每塊的固定開銷**（近距與遠距一樣貴），
         所以省的就是這個：一塊由 5~7 次 beginPath 收成 1 次。
         ⚠ 同一塊內的面同色，所以**不必排序**（畫家演算法只管塊與塊之間）。
         ⚠ 用「側面」那一階不是頂面：這些東西是立起來的齒與尖，
           跟著牆走才讀得出它們是牆的一部分。 */
      if(B.tiny){
        const c=(B.mat==='roof')?C.roofSide:C.side;
        RFC.beginPath();
        for(let k=0;k<NS;k++){
          const p0=B.base[k], p1=B.base[(k+1)%NS], t1=B.top[(k+1)%NS], t0=B.top[k];
          RFC.moveTo(p0.x,p0.y); RFC.lineTo(p1.x,p1.y); RFC.lineTo(t1.x,t1.y); RFC.lineTo(t0.x,t0.y); RFC.closePath();
        }
        if(!B.ridge){ RFC.moveTo(B.top[0].x,B.top[0].y);
          for(let k=1;k<NS;k++) RFC.lineTo(B.top[k].x,B.top[k].y); RFC.closePath(); }

      }
