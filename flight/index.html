<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<script src="../orientation.js"></script>
<title>TIVOT — 銀月大陸航行</title>
<style>
  :root{ --gold:#c9a227; --parch:#d8cdb4; }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;
    -webkit-user-select:none;user-select:none;}
  html,body{height:100%;overflow:hidden;background:#05060c;
    font-family:"Noto Serif TC",-apple-system,"PingFang TC",serif;}
  #stage{position:fixed;inset:0;touch-action:none;}
  canvas{display:block;width:100%;height:100%;image-rendering:pixelated;}

  .hud{position:fixed;pointer-events:none;color:var(--parch);text-shadow:0 1px 3px rgba(0,0,0,.9);}
  #top{top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;
    display:flex;justify-content:space-between;align-items:flex-start;
    background:linear-gradient(180deg,rgba(5,6,12,.7),transparent);}
  .stat{font-size:11px;letter-spacing:.12em;line-height:1.7;}
  .stat b{color:var(--gold);font-weight:600;}
  .stat .lbl{opacity:.5;font-size:9px;letter-spacing:.2em;}
  #compass{position:fixed;left:50%;transform:translateX(-50%);
    top:calc(env(safe-area-inset-top) + 12px);font-size:10px;letter-spacing:.35em;
    color:var(--gold);opacity:.85;}

  /* 方位：控制區那條羅盤帶已撤（面板只留乾淨的機械式船舵），
     航向改回頂部 HUD 的 #compass（畫面上緣中央的八方位字）。
     #topDist 仍隱：航行距離在面板上有 canvas 繪製版，畫兩次會重複。 */
  #topDist{display:none;}
  /* 地標名牌與提示改貼在面板上緣之上，不壓到 3D 視窗底部 */
  #place{position:fixed;left:0;right:0;bottom:36vh;
    text-align:center;opacity:0;transition:opacity .4s;pointer-events:none;}
  #place.show{opacity:1;}
  #place .nm{font-size:15px;letter-spacing:.3em;color:var(--gold);}
  #place .ty{font-size:9px;letter-spacing:.25em;color:var(--parch);opacity:.55;margin-top:3px;}

  #hint{position:fixed;bottom:calc(34vh + 4px);left:0;right:0;
    text-align:center;font-size:10px;letter-spacing:.18em;color:var(--parch);opacity:.28;}
  #fps{position:fixed;right:12px;top:calc(env(safe-area-inset-top) + 54px);
    font-size:9px;color:var(--parch);opacity:.35;}
  #backBtn,#mapBtn{position:fixed;top:calc(env(safe-area-inset-top) + 10px);z-index:40;
    background:rgba(5,6,12,.72);border:1px solid rgba(201,162,39,.5);color:var(--gold);
    font-family:inherit;font-size:11px;letter-spacing:.14em;padding:5px 12px;cursor:pointer;}
  #backBtn{right:12px;} #mapBtn{right:78px;}
  #backBtn:active,#mapBtn:active{background:rgba(201,162,39,.16);}

  /* 地圖畫面：圖是點開才載的（見 openMap），不進開場載入 */
  #mapView{position:fixed;inset:0;z-index:60;background:rgba(4,5,9,.94);
    display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;}
  #mapView.on{display:flex;}
  #mapWrap{position:relative;width:96vw;max-width:1100px;touch-action:none;}
  #mapCv{display:block;width:100%;border:1px solid rgba(201,162,39,.35);background:#0a0c12;}
  #mapCap{color:var(--parch);font-size:10px;letter-spacing:.2em;opacity:.5;text-align:center;}
  #mapClose{position:absolute;top:8px;right:8px;z-index:2;}
  /* ══ 載入畫面 ══
     排版與主程式的啟動讀取畫面（style.css 的 #assetLoader）**逐項對齊**：
     圈徑/位置、立繪舞台高度、對話框寬度與錨點、底部訊息位置、字級與字距、
     光圈呼吸與文字呼吸動畫全數一致（主程式那邊的圈後來會被 placeRing 對到
     首頁紋章上，這裡沒紋章，吃的就是那邊 CSS 的預設保底值）。
     色盤也在 #boot 內局部覆寫成主程式的 gold/ink，不影響飛行 HUD 自己的金色。
     ⚙ 但**不共用同一份 DOM/提示**：這裡是獨立的一份，日後要換成船艦／航行教學，
       改這邊不會動到戰鬥那側的載入提示。 */
  #boot{position:fixed;inset:0;z-index:50;overflow:hidden;background:#0a0812;
    /* 局部色盤/字體：跟主程式 style.css :root 一致，作用域限於讀取畫面 */
    --gold:#d4a94a; --gold-dim:#8a6d2e; --ink:#ece6d8;
    color:#d9c68a;
    font-family:"Iowan Old Style","Palatino Linotype",Georgia,"Songti TC",serif;}
  #boot.hide{display:none;}
  /* 金色光圈讀取：進度沿圈自 12 點鐘起順時針推進；圈內上=百分比、下=地名字樣 */
  #bRing{position:absolute;left:50%;top:23%;width:200px;height:200px;
    transform:translate(-50%,-50%);border-radius:50%;
    animation:bRingGlow 2.4s ease-in-out infinite;}
  #bRing svg{position:absolute;inset:0;width:100%;height:100%;
    transform:rotate(-90deg);overflow:visible;}
  #bRing .rail{fill:none;stroke:rgba(217,198,138,.18);stroke-width:2.5;}
  #bRing .prog{fill:none;stroke:var(--gold);stroke-width:2.5;stroke-linecap:round;
    transition:stroke-dashoffset .25s ease;filter:drop-shadow(0 0 4px rgba(217,198,138,.7));}
  @keyframes bRingGlow{
    0%,100%{box-shadow:0 0 6px rgba(217,198,138,.18),inset 0 0 8px rgba(217,198,138,.1);}
    50%{box-shadow:0 0 22px rgba(217,198,138,.5),inset 0 0 14px rgba(217,198,138,.25);}}
  #bRingTxt{position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:7px;
    animation:bTextBreath 2.4s ease-in-out infinite;}
  #bPct{font-size:24px;letter-spacing:2px;color:var(--gold);font-variant-numeric:tabular-nums;}
  #bCap{font-size:10.5px;letter-spacing:3px;color:var(--gold);opacity:.85;}
  @keyframes bTextBreath{
    0%,100%{text-shadow:0 0 4px rgba(217,198,138,.25);opacity:.8;}
    50%{text-shadow:0 0 14px rgba(217,198,138,.85);opacity:1;}}
  /* 立繪舞台：吃畫面下半，立繪 contain 貼底、底緣漸隱（同 #alStage） */
  #bStage{position:absolute;left:0;right:0;bottom:0;height:64%;
    display:flex;justify-content:center;align-items:flex-end;pointer-events:none;}
  #bPortrait{width:auto;max-width:88%;max-height:100%;object-fit:contain;object-position:bottom;
    filter:drop-shadow(0 6px 24px rgba(0,0,0,.7));opacity:0;transition:opacity .6s ease;
    -webkit-mask-image:linear-gradient(to bottom,#000 86%,transparent 100%);
    mask-image:linear-gradient(to bottom,#000 86%,transparent 100%);}
  #bPortrait.on{opacity:1;}
  /* 對話框：疊在立繪偏下（同 #alBubble） */
  #bBubble{position:absolute;left:50%;bottom:15%;transform:translateX(-50%);
    width:82%;max-width:300px;background:rgba(16,12,24,.72);
    border:1px solid var(--gold-dim);border-radius:8px;padding:10px 13px;text-align:left;
    box-shadow:0 4px 20px rgba(0,0,0,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);}
  #bBubble .nm{font-size:11px;letter-spacing:2px;color:var(--gold);margin-bottom:5px;opacity:.9;}
  /* Hint：整句淡入停留淡出（不打字）；min-height 兩行防換句時框體跳動 */
  #bHint{font-size:13px;letter-spacing:.5px;line-height:1.6;color:var(--ink);
    min-height:3.2em;opacity:0;transition:opacity .4s ease;}
  #bHint.on{opacity:1;}
  /* 底部訊息：位置同 #alMsg（安全區 + 26px）；small 是飛行版多出的階段進度字句 */
  #bMsg{position:absolute;left:0;right:0;
    bottom:calc(env(safe-area-inset-bottom,0px) + 26px);
    text-align:center;font-size:14px;letter-spacing:4px;color:var(--gold);}
  #bMsg small{display:block;color:var(--ink);opacity:.5;font-size:10px;
    letter-spacing:1px;margin-top:6px;}
</style>
</head>
<body>
<div id="stage"><canvas id="cv"></canvas></div>

<div class="hud" id="top">
  <div class="stat">
    <div class="lbl">大陸曆 1908</div>
    <div><b id="date">14</b> 日　<b id="clock">08:00</b></div>
  </div>
  <div class="stat" id="topDist" style="text-align:right">
    <div class="lbl">航行距離</div>
    <div><b id="dist">0</b> リーグ</div>
  </div>
</div>
<div class="hud" id="compass">北</div>
<div id="place"><div class="nm" id="pnm"></div><div class="ty" id="pty"></div></div>
<button id="mapBtn">地圖</button>
<button id="backBtn">← 返回</button>
<div id="mapView">
  <div id="mapWrap">
    <canvas id="mapCv"></canvas>
    <button id="mapClose">✕ 關閉</button>
  </div>
  <div id="mapCap">拖曳平移 · 滾輪／雙指縮放 · 放大可見市鎮街廓</div>
</div>
<div id="fps"></div>
<div id="boot">
  <div id="bRing">
    <svg viewBox="0 0 100 100">
      <circle class="rail" cx="50" cy="50" r="48"/>
      <circle class="prog" id="bProg" cx="50" cy="50" r="48"
              stroke-dasharray="301.59" stroke-dashoffset="301.59"/>
    </svg>
    <!-- 圈內文字：上百分比、下字樣（層級同 #alRingTxt，不包多餘一層） -->
    <div id="bRingTxt"><div id="bPct">0%</div><div id="bCap">SILVERMOON</div></div>
  </div>
  <div id="bStage">
    <img id="bPortrait" alt="">
    <div id="bBubble"><div class="nm" id="bName"></div><div id="bHint"></div></div>
  </div>
  <div id="bMsg">載 入 銀 月 大 陸<small id="bootMsg"></small></div>
</div>

<script src="settlement.js"></script>
<script>
/* ══════════════════════════════════════════════════════════════════════
   TIVOT — 銀月大陸航行（吃真實地圖版）

   資料來源：terrain_generator.py 的兩張輸出
     · silvermoon_heightmap.png  高度（灰階，0＝雲海之外）
     · silvermoon_terrain.png    地貌色（反照率）
   兩張同尺寸即可，不必是正方形/2 的次方。

   ⚠ 必須用 http 提供（getImageData 在 file:// 會被畫布污染規則擋下）。
     專案已有 dev_server.py / launch.json，開站後走 /flight/ 即可。

   ⚠ 這是**獨立原型**，尚未併進 modules/ 的模組架構：
     自帶迴圈與狀態、不讀 GAME_CONFIG、不經 state.js。
     驗證完手感與美術方向後才會拆進 modules/map.js（見 CLAUDE.md §2 的依賴方向）。
     入口：首頁「試飛」鈕，僅管理人模式可見。
   ══════════════════════════════════════════════════════════════════════ */

const HEIGHT_URL = 'silvermoon_heightmap.png';
const COLOR_URL  = 'silvermoon_terrain.png';

/* ── 世界尺度 ─────────────────────────────────────────────────────
   MAP_SCALE＝一個高度圖像素等於幾個世界單位。放大世界＝提高這個值，
   同時「不」等比放大視距，否則畫面完全一樣、只有數字變大（那是純換單位）。
   真正讓大陸變大的是「一次看到的地圖比例變小」。 */
/*  現值 20：大陸 2152×1200 地圖像素 → 世界 43040×24000。
    ⚠ ZFAR 維持 3600 不跟著放大 —— 那正是「大陸變大」的來源：
      一次看到 3600÷20＝180 個地圖像素（放大前是 360），地貌被放大一倍。
      若連 ZFAR 一起加倍，畫面會完全一樣、只是數字變兩倍（純換單位）。
    ⚠ 副作用：近景每個地圖像素被拉伸成兩倍，塊感加重。
      靠 DET_TILE（以世界座標平鋪 256 單位）補回高頻細節 ——
      世界放大後那層雜訊相對地貌變細，剛好幫忙蓋掉。 */
const MAP_SCALE  = 20;
const INV_SCALE  = 1/MAP_SCALE;
const PEAK_SCALE = 520;   // 高度圖 255 對應的世界高度（越大山越陡）
const CLOUD_H    = 44;    // 雲海高度：低於此高度一律是雲（大陸外緣自然沒入雲中）
const CRUISE_ALT = 700;   // 巡航高度（定高，不隨地形起伏）
/* 版面目標：天空 1/3、陸地 2/3，霧只是兩者之間的過渡帶。
   ⚠ 關鍵不是霧的濃度，是「地形要畫得夠遠」：
     地形在螢幕上的高度 ≈ (鏡頭離地 / z) × scaleH。
     鏡頭離地約 400、若 z 只到 900，最遠地形停在 400/900×200 ≈ 89px ——
     那是畫面中央，不是地平線。地平線到該處之間沒有任何地形可畫，
     只能填天空/霧 → 就是「一半以上都是霧」的成因。
     要讓陸地填到地平線附近，z 必須大到讓該值趨近 0。 */
/*  天空占比 ≈ (地平線位置 + 地形填不到的缺口) / 視窗高。
    視距 3600 下缺口約 31px（含曲率下沉），故 0.22 → 天空約 32%、陸地 68%。 */
const HORIZON_F  = 0.22;
const ZFAR       = 3600;  // 可視距離（世界單位）＝ 360 個地圖像素

/* ── 版面：下方切給操作面板 ──────────────────────────────────────
   直屏把 90° 水平視角塞進窄畫面，角解析度水平/垂直差 2.5 倍，
   最嚴重的變形集中在畫面最下緣（近地單一取樣被放到極大）。
   把那一段切掉當面板，等於同時解決版面與變形。 */
const VIEW_F = 0.66;      // 3D 視窗佔畫面高度比例，其餘為面板

/* ── 星球曲率 ────────────────────────────────────────────────────
   地表高度隨距離平方下沉：drop = d²/(2R)，d＝徑向距離。
   邊緣欄的徑向距離較長（d² = z²(1+s²)），沉得比中央快 → 地平線往兩側彎。
   R 越小彎得越明顯；這是美術旋鈕，不是真實星球尺度。
   副作用（好的）：地形在抵達 ZFAR 前就沉到地平線下，遠裁切自然被藏住。 */
/*  R=1900 時：ZFAR 處中央下沉 213 世界單位，佔鏡頭對地高差(約 450)的 47%
      → 地表急遽捲走，整片縮成球體。
    R=6000：下沉降到 68 單位（15%），弧度只在地平線隱約可見。
    邊緣與中央的落差（＝看得到的弧）＝ ZFAR/(2R)*scaleH，與 R 成反比。 */
/*  ⚠ 弧度大小 ∝ ZFAR/R，所以 ZFAR 一改就必須同步改 R，否則弧度會跟著暴增。
      ZFAR 900→3600（4 倍），R 也要放大同倍率以上才維持「隱隱有弧度」。
      現值：ZFAR 處中央下沉 162 世界單位、地平線邊緣比中央低約 15px。 */
const PLANET_R = 40000;

/* ── 銀月 ────────────────────────────────────────────────────────
   銀月大陸的天上永遠掛著一輪銀色滿月，位置固定在上偏西，日夜皆在。
   這是世界觀不是天文：它不繞行、不盈虧、白天也在，只是被日光蓋過。
   ⚠ 因此夜晚不該是全黑，而是一片被月光洗過的銀藍 —— 夜間的環境光、
     天空色、雲的亮度、暗角都要跟著抬起來，否則「有月亮」只是畫面上
     多一個亮點，地面照樣看不見。 */
const MOON_AZ  = -Math.PI*0.52;  // 方位：西（略偏西南）
/* 仰角。⚠ 投影是 y = 地平線 − el×VIEWH×0.62，地平線只在畫面 22% 處，
   所以 el 0.6 會落到螢幕上方 −81px（看不見）。0.24 剛好停在天空上緣。 */
const MOON_EL  = 0.24;
const MOON_R   = 17;             // 視直徑（滿月，比太陽還顯眼）
const MOON_LIT = 0.34;           // 夜間的月光強度（白天會被日光壓過）

/* ── 峭壁 / 瀑布 ─────────────────────────────────────────────────
   voxel-space 畫的垂直線段本來就是「崖面」，只是原本整條填地表色 →
   看起來像色塊拉絲。高度落差超過門檻就改用岩壁上色（含垂直紋理）。 */
const CLIFF_DH = 75;      // 視為峭壁的高度落差
const FALL_SPD = 0.42;    // 瀑布水流捲動速度

/* ── 色調分級（VP1 風）────────────────────────────────────────────
   參考畫面的特徵：地表暗而去飽和、遠景被高濃度大氣霧洗成灰白、天空淡藍。
   在取樣端做，才會連崖面/雲海一起被同一套曲線吃到。 */
const GRADE_SAT  = 0.68;  // 飽和度（1＝原色，0＝灰階）
const GRADE_EXPO = 0.82;  // 地表整體壓暗
/*  霧起點（佔 ZFAR 比例）。0.38 → 霧從 z≈1370 起，投影落在畫面約 51% 處，
    往上收斂到地平線 —— 剛好是天空與陸地之間那條過渡帶，不再往前吃掉中景。 */
const FOG_START  = 0.38;
/*  霧上限：留一點形體，全白會把地平線的山也吃掉。
    ⚠ 弧度放平後，地形不再於 ZFAR 前沉到地平線下 → 遠裁切邊緣會露出來，
      靠這裡補到接近 1 才蓋得住。 */
const FOG_MAX    = 0.94;

/* ── 細節雜訊 ─────────────────────────────────────────────────────
   世界放大 10 倍＝高度圖被放大 10 倍，原圖的高斯平滑會整片糊掉
   （這正是最早談過的「一張圖不可能同時服務遠景與近景」）。
   解法不是更大的圖，是在世界座標上疊一層高頻程序細節：
   平鋪 256 世界單位、週期性雜訊無接縫，近看有起伏、遠看被霧吃掉。 */
const DET_TILE = 256, DTM = DET_TILE-1;
const DET_AMP  = 26;      // 細節起伏幅度（世界單位）
const DETH = new Int8Array(DET_TILE*DET_TILE);

/* ── 邊緣抬升（載入時的權宜處理）──────────────────────────────────
   terrain_generator.py 用 distance_transform 當基礎高度：
       base_h = np.power(dist, 0.62)      # dist 在海岸線為 0
   於是陸地在邊界是「羽化緩降到 0」——那是海岸線的做法。
   浮空大陸要的是**斷崖**：陸地維持高度直到邊界、然後直接斷掉。
   實測邊緣格高度中位數只有 28（雲海高度 14），落差不足以形成崖面，
   河流走到邊界時也早就降到雲海高度 → 不會有瀑布。

   這裡在載入時把邊界一圈墊高成台地緣，讓斷崖成立。
   ⚠ 這是渲染端的補救；正解是在生成端改一行：
       base_h = 0.35 + 0.65*np.power(dist, 0.62)
     邊緣保有 0.35 的高度，再被 height*land 硬切 → 天然斷崖。 */
const RIM_H = 145;        // 邊緣台地高度（世界單位）
const RIM_W = 34;         // 抬升作用範圍（距邊界的「地圖像素」，與世界尺度無關）
/* ── 操作手感 ──────────────────────────────────────────────────
   拖曳世界的模型：手指把畫面往後拉 → 船往前走（拉的是地面，不是船）。
     往後拉    → 前進          往左後拉 → 往右前方飛
     拉得越遠  → 油門越大      放開     → 減速停住（不自動巡航）
   轉向以「角速度上限」收斂到目標航向，不做瞬間對齊 → 大船的慣性感。 */
/*  MAX_SPD 6＝360 世界單位/秒。大陸同時放大一倍（MAP_SCALE 10→20），

let settleCache=null;                       // 生成結果快取（純函式，算一次就好）
function buildSettlements(){

/* 地標：座標＝地圖像素座標（同 terrain_generator.py 的 PLACES） */
const PLACES=[
  {x:1005,y:600, name:'帝都・聖王廳', type:'教廷・中樞'},
  {x:1310,y:965, name:'薇拉馮德港',   type:'帝國・港灣'},
  {x:985, y:858, name:'卡耶爾山谷',   type:'險地'},
  {x:1000,y:300, name:'北方泊地',     type:'泊地'},
  {x:2030,y:590, name:'東方泊地',     type:'泊地'},
];

const rgb=(r,g,b)=>(255<<24)|(b<<16)|(g<<8)|r;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const lerp=(a,b,t)=>a+(b-a)*t;
let _s=1908;
const rnd=()=>(_s=(_s*1664525+1013904223)&0xffffffff)/0xffffffff;
function hash(x,y){let n=x*374761393+y*668265263;n=(n^(n>>13))*1274126177;return ((n^(n>>16))&0x7fffffff)/0x7fffffff;}
const sm=t=>t*t*(3-2*t);

/* 立面的岩層紋理查表。⚠ 原本每個像素呼叫一次 hash()（數次乘法＋位移），
   改成「每根柱子都有立面」之後那就是整個內圈最熱的一段。查 256 格的表、
   用欄位種子錯開，視覺上分不出差別，成本從函式呼叫降到一次陣列讀取。 */
const STRAT=new Float32Array(256);

/* ── 抗鋸齒 ──────────────────────────────────────────────────────
   ⚠ 畫面上的「鋸齒」有三種來源，混在一起調會調錯地方：
     A 低解析緩衝的最近鄰放大（1.67 倍）→ 那是刻意的 PS1 味，不動。
     B 每根柱子頂端取整（y|0）→ 相鄰柱子差一整個像素，每條稜線都是階梯。
       **這才是要修的。**修法：頂端那一個像素依 y 的小數部分做覆蓋率混色，
       柱子內部完全不碰 → 輪廓變順、方塊感原封不動。
     C 霧與天空漸層的色帶 → 用有序抖動（Bayer）打散。
   Bayer 是 PS1 當年真正在用的手法：不是把色帶磨平，而是換成網點，
   所以結果會**更像**那個年代而不是更不像。 */
const BAYER=new Float32Array(16);
(function(){
  const m=[0,8,2,10, 12,4,14,6, 3,11,1,9, 15,7,13,5];
  for(let i=0;i<16;i++) BAYER[i]=(m[i]/16-0.469);   // −0.47..+0.47
})();
const DITHER=2.6;      // 抖動幅度（色階）。太大會看到網格，太小蓋不掉色帶。

/* ── 雲海貼圖：週期性雜訊，平鋪無接縫 ─────────────────────────── */
const CT=256, CTM=CT-1, CPER=4;
const CLOUDTEX=new Uint32Array(CT*CT);
const CLOUDH=new Uint8Array(CT*CT);
function pnoise(x,y,per){
  const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
  const u=sm(xf),v=sm(yf);
  const X0=((xi%per)+per)%per, Y0=((yi%per)+per)%per;
  const X1=((xi+1)%per+per)%per, Y1=((yi+1)%per+per)%per;
  const a=hash(X0,Y0),b=hash(X1,Y0),c=hash(X0,Y1),d=hash(X1,Y1);
  return (a*(1-u)+b*u)*(1-v)+(c*(1-u)+d*u)*v;
}
function pfbm(x,y,oct,per){let s=0,a=.5,f=1,n=0;for(let i=0;i<oct;i++){s+=pnoise(x*f,y*f,per*f)*a;n+=a;a*=.5;f*=2;}return s/n;}
function genDetail(){
  for(let y=0;y<DET_TILE;y++) for(let x=0;x<DET_TILE;x++){
    const n=pfbm(x/DET_TILE*8, y/DET_TILE*8, 4, 8);   // 週期 8 → 平鋪無接縫
    DETH[y*DET_TILE+x]=clamp((n-0.5)*2*127,-127,127)|0;
  }
}
function genStrat(){ for(let i=0;i<256;i++) STRAT[i]=hash(i*7+13,i*3+5); }
function genCloudTex(){
  for(let y=0;y<CT;y++) for(let x=0;x<CT;x++){
    const n=pfbm(x/CT*CPER,y/CT*CPER,5,CPER);
    const t=sstep(0.34,0.72,n);
    const v=lerp(152,246,t)+(hash(x*5,y*7)-0.5)*9;
    const b=lerp(170,252,t)+(hash(x*11,y*3)-0.5)*9;
    CLOUDTEX[y*CT+x]=rgb(clamp(v,0,255)|0,clamp(v*0.99,0,255)|0,clamp(b,0,255)|0);
    CLOUDH[y*CT+x]=Math.round(t*9);
  }
}

/* ── 載入地圖 ───────────────────────────────────────────────────── */
function loadImg(url){
  return new Promise((res,rej)=>{
    const im=new Image();
    im.onload=()=>res(im);
    im.onerror=()=>rej(new Error('載入失敗：'+url));
    im.src=url;
  });
}
async function loadWorld(){
  const msg={ set textContent(v){ bootUI.set(loadWorld._p||0.2, v); } };
  const step=(p,t)=>{ loadWorld._p=p; bootUI.set(p,t); };
  step(0.20,'讀取高度圖…');
  const [hi,ci]=await Promise.all([loadImg(HEIGHT_URL),loadImg(COLOR_URL)]);
  if(hi.naturalWidth!==ci.naturalWidth || hi.naturalHeight!==ci.naturalHeight)
    throw new Error(`兩張圖尺寸不一致：${hi.naturalWidth}×${hi.naturalHeight} vs ${ci.naturalWidth}×${ci.naturalHeight}`);
  MAPW=hi.naturalWidth; MAPH=hi.naturalHeight;

  const c=document.createElement('canvas'); c.width=MAPW; c.height=MAPH;
  const g=c.getContext('2d',{willReadFrequently:true});

  g.drawImage(hi,0,0);
  const hd=g.getImageData(0,0,MAPW,MAPH).data;
  g.clearRect(0,0,MAPW,MAPH);
  g.drawImage(ci,0,0);
  const cd=g.getImageData(0,0,MAPW,MAPH).data;

  step(0.42,'建立高度場…');
  const N=MAPW*MAPH;
  // ⚠ Uint16：世界尺度放大後高度上限（PEAK_SCALE）已遠超 255
  HGT=new Uint16Array(N); COL=new Uint32Array(N);
  SLX=new Int8Array(N);  SLY=new Int8Array(N);
  RIV=new Uint8Array(N);

  // 高度：取紅通道（灰階三通道相同）。0＝大陸之外。
  const raw=new Float32Array(N);
  for(let i=0;i<N;i++) raw[i]=hd[i*4]/255;
  let rivCnt=0;
  for(let i=0;i<N;i++){
    HGT[i]=clamp(Math.round(raw[i]*PEAK_SCALE),0,65535);
    const r=cd[i*4], g=cd[i*4+1], b=cd[i*4+2];
    COL[i]=rgb(r,g,b);
    /* 河道偵測：terrain_generator.py 的 RIVER=(88,116,132) 經陰影與銳化後
       仍是「藍明顯高於紅」的唯一地貌（雪/岩都是 b≤r）。
       ⚠ 這是從成品色回推的權宜做法；hydro 的 rivers 遮罩另存一張 PNG 會精準得多。 */
    if(b>r+16 && b>g+4 && b>70 && b<200){ RIV[i]=1; rivCnt++; }
  }
  window.__rivPct=(rivCnt/N*100).toFixed(2);
  /* 邊緣抬升：先用 chamfer 兩趟求「到雲海的距離」，再把邊界一圈墊成台地緣。
     只作用在 RIM_W 內，內陸低地保持原樣。 */
  step(0.58,'整平大陸邊緣…');
  {
    const INF=1e9, dist=new Float32Array(N);
    for(let i=0;i<N;i++) dist[i]=(HGT[i]>CLOUD_H)?INF:0;
    for(let y=0;y<MAPH;y++) for(let x=0;x<MAPW;x++){
      const i=y*MAPW+x; if(dist[i]===0) continue;
      let d=dist[i];
      if(x>0)            d=Math.min(d,dist[i-1]+1);
      if(y>0)            d=Math.min(d,dist[i-MAPW]+1);
      if(x>0&&y>0)       d=Math.min(d,dist[i-MAPW-1]+1.414);
      if(x<MAPW-1&&y>0)  d=Math.min(d,dist[i-MAPW+1]+1.414);
      dist[i]=d;
    }
    for(let y=MAPH-1;y>=0;y--) for(let x=MAPW-1;x>=0;x--){
      const i=y*MAPW+x; if(dist[i]===0) continue;
      let d=dist[i];
      if(x<MAPW-1)          d=Math.min(d,dist[i+1]+1);
      if(y<MAPH-1)          d=Math.min(d,dist[i+MAPW]+1);
      if(x<MAPW-1&&y<MAPH-1)d=Math.min(d,dist[i+MAPW+1]+1.414);
      if(x>0&&y<MAPH-1)     d=Math.min(d,dist[i+MAPW-1]+1.414);
      dist[i]=d;
    }
    let lifted=0;
    for(let i=0;i<N;i++){
      if(HGT[i]<=CLOUD_H) continue;
      if(dist[i]>=RIM_W) continue;
      // raw 也要同步：下面的坡度是從 raw 差分算的，只改 HGT 會讓崖頂法線是舊的
      if(HGT[i]<RIM_H){ HGT[i]=RIM_H; raw[i]=RIM_H/PEAK_SCALE; lifted++; }
    }
    window.__rimLifted=lifted;
  }

  /* ── 鏟平城下地形 ─────────────────────────────────────────────
     聚落是貼在地表上畫的一塊平面，底下若是起伏的山坡，城就會有一半陷進
     坡裡、另一半浮在空中。既然城是「蓋出來的」，就讓它把地基整平——
     真實的城市本來也會削坡造地。
     ⚠ 目標高度取**環帶中位數**（R~1.6R 的一圈），不取中心點：中心剛好
       落在山尖或溝底時，整座城會被抬到山頂或陷進谷裡。
     ⚠ 只鏟陸地格，海格一律不動 —— 港都的港灣要留著，填平了就沒有水岸。
     ⚠ HGT 與 raw 都要改：下面的坡度是從 raw 差分算的，只改 HGT 會讓
       城邊的法線還是舊坡度（同邊緣抬升那段的理由）。
     ⚠ 外圈留一段裙帶平滑過渡，否則城界會是一圈垂直斷崖。 */
  step(0.66,'整平城鎮地基…');
  {
    /* 鎏平範圍：完全整平到 2R，也就是城界外再放一個城區半徑的平地。
       城市不是突然在山坡上停住的——郊區、耕地、道路都需要平地，
       外圍還是崎岘地形的話，城看起來像被戴在山上。 */
    const PAD=2.8;                       // 裙帶外緣（佔半徑倍數）
    const FLAT=2.0;                      // 這個倍數以內完全整平
    let flattened=0;
    for(const S of SETTLEMENTS){
      const R=SETTLE_R[S.t], cx=S.x|0, cy=S.y|0;
      // 目標高度：環帶（R ~ 1.6R）內陸地的中位數
      const ring=[];
      const r1=Math.ceil(R*3.6);
      for(let dy=-r1;dy<=r1;dy++)for(let dx=-r1;dx<=r1;dx++){
        // ⚙ 環帶要取在**裙帶以外**（>PAD），不然量到的是自己剛鎏平的地
        const d=Math.hypot(dx,dy); if(d<R*2.8||d>R*3.6) continue;
        const x=cx+dx,y=cy+dy;
        if(x<0||y<0||x>=MAPW||y>=MAPH) continue;
        const h=HGT[y*MAPW+x]; if(h<=CLOUD_H) continue;
        ring.push(h);
      }
      if(!ring.length) continue;
      ring.sort((a,b)=>a-b);
      const target=ring[ring.length>>1];
      const rP=Math.ceil(R*PAD);
      for(let dy=-rP;dy<=rP;dy++)for(let dx=-rP;dx<=rP;dx++){
        const x=cx+dx,y=cy+dy;
        if(x<0||y<0||x>=MAPW||y>=MAPH) continue;
        const i=y*MAPW+x, h=HGT[i];
        if(h<=CLOUD_H) continue;                       // 海不填
        const d=Math.hypot(dx,dy)/R;
        if(d>PAD) continue;
        // d<=FLAT 完全整平；FLAT~PAD 之間平滑回到原地形
        const u=(d-FLAT)/(PAD-FLAT);
        const t=d<=FLAT?1:1-(u*u*(3-2*u));      // smoothstep（index.html 沒有這個 helper，內聯）
        if(t<=0) continue;
        const nh=Math.round(h+(target-h)*t);
        if(nh===h) continue;
        HGT[i]=nh; raw[i]=nh/PEAK_SCALE; flattened++;
      }
    }
    window.__settleFlattened=flattened;
  }

  // 坡度（給逐幀光照用）—— 必須在邊緣抬升之後，否則崖頂的法線是舊的
  step(0.70,'計算坡度…');
  for(let y=0;y<MAPH;y++){
    const ym=y>0?y-1:0, yp=y<MAPH-1?y+1:MAPH-1;
    for(let x=0;x<MAPW;x++){
      const i=y*MAPW+x;
      const xm=x>0?x-1:0, xp=x<MAPW-1?x+1:MAPW-1;
      SLX[i]=clamp((raw[y*MAPW+xp]-raw[y*MAPW+xm])*760,-127,127)|0;
      SLY[i]=clamp((raw[yp*MAPW+x]-raw[ym*MAPW+x])*760,-127,127)|0;
    }
  }
  // 地標：x/y 是「地圖像素」座標 → 換算成世界座標 wx/wy 供投影使用
  PLACES.forEach(P=>{
    const xi=clamp(P.x|0,0,MAPW-1), yi=clamp(P.y|0,0,MAPH-1);
    P.h=HGT[yi*MAPW+xi];
    P.wx=P.x*MAP_SCALE; P.wy=P.y*MAP_SCALE;
  });
}

/* ── 畫布 ───────────────────────────────────────────────────────── */
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let W=0,H=0,VIEWH=0,BW=0,BH=0,buf=null,bufU32=null,bcv=null,bctx=null;
let curvK=null;      // 每欄的曲率係數 (1+s²)/(2R)
let prevH=null;      // 每欄「上一個畫出的取樣高度」→ 判定崖面
let topFrac=null;    // 每欄頂端的次像素未覆蓋比例 → 收尾時做輪廓抗鋸齒
let ybufZ=null;      // 每欄「最高那一列」是在哪個深度畫的 → 聚落的遮擋判定
let SKYROW=null;     // 每列的天空色，輪廓混色要拿它當背景
function resize(){
  W=innerWidth;H=innerHeight;
  VIEWH=Math.round(H*VIEW_F);
  cv.width=W;cv.height=H;cv.style.width=W+'px';cv.style.height=H+'px';
  ctx.imageSmoothingEnabled=false;
  /* 緩衝寬度佔畫面寬的比例。維持 0.60。
     ⚠ 抗馬賽克靠的是雙線性取樣，不是解析度 —— 解析度只讓邊緣更銳，
       成本卻隨面積平方成長。這一版已經為了畫質加了不少 per-sample 的工
       （高度／顏色／雲海三處雙線性、每根柱子都畫立面），先把解析度的
       額度讓出來，效能餘裕留給手機。
     要更銳就調這個值，但**一定要在實機上看 HUD 的 fps**：
     開發用的瀏覽器分頁一離開前景 rAF 就停，量到的數字不可信。 */
  BW=clamp(Math.round(W*0.60),200,420);
  BH=Math.round(BW*VIEWH/W);          // 緩衝比例對齊「3D 視窗」而非整個畫面
  bcv=document.createElement('canvas');bcv.width=BW;bcv.height=BH;
  bctx=bcv.getContext('2d');
  buf=bctx.createImageData(BW,BH);
  bufU32=new Uint32Array(buf.data.buffer);
  curvK=new Float32Array(BW);
  for(let i=0;i<BW;i++){
    const s=(i+0.5)/BW*2-1;           // 欄位在視錐內的橫向比例 −1..1
    curvK[i]=(1+s*s)/(2*PLANET_R);    // 邊緣 s=±1 時是中央的兩倍 → 地平線兩側下彎
  }
  prevH=new Float32Array(BW);
  topFrac=new Float32Array(BW);
  ybufZ=new Float32Array(BW);
  SKYROW=new Uint32Array(BH);
}
addEventListener('resize',resize);resize();
// 地標/雲團等疊加物要套同一條曲率，否則會跟地形錯開（越遠越明顯）
const curvAt=s=>(1+s*s)/(2*PLANET_R);

/* ── 攝影機 ─────────────────────────────────────────────────────── */
const cam={x:1005*MAP_SCALE,y:760*MAP_SCALE,angle:0,alt:CRUISE_ALT,speed:0,bank:0};

/* ══ 操作：單手拖曳世界 ══
   手指把畫面往後拉 → 船往前走（拉的是地面，不是船）。
     往後拉    → 前進          往左後拉 → 往右前方飛
     拉得越遠  → 速度越快      放開     → 減速停住（不自動巡航）
   一根手指同時給油門（縱向幅度）與舵量（橫向幅度）。

   ⚠ 橫向死區 STEER_DEAD：這是單手方案能不能對準目標的關鍵。
     縱向拉出去的同時，手指的橫向本來就會有十幾像素的晃動；沒有死區的話
     那些晃動全部變成舵量，船一路蛇行。死區之外才開始計舵，且從 0 起算
     （不是從死區邊界跳到某個值），越過門檻時才不會頓一下。 */
let fwd=0, rgt=0, dragging=false, ox=0, oy=0, moved=0, dragId=null;
let rudder=0;                               // 實際生效的舵量（含鍵盤）——只給面板顯示用
const STEER_DEAD=14;                        // 橫向死區（像素）
const TAP_SLOP=12;                          // 位移小於此值＝點擊而非拖曳
const stage=document.getElementById('stage');
stage.addEventListener('pointerdown',e=>{
  if(dragId!==null) return;                       // 單手操作：只認第一根手指
  dragId=e.pointerId; dragging=true;
  ox=e.clientX; oy=e.clientY; fwd=0; rgt=0; moved=0;
});
stage.addEventListener('pointermove',e=>{
  if(e.pointerId!==dragId) return;
  const dx=e.clientX-ox, dy=e.clientY-oy;
  moved=Math.max(moved,Math.hypot(dx,dy));
  fwd=clamp(dy/DRAG_FULL,-1,1);                   // 往下（往後）拉＝前進
  const mag=Math.max(0,Math.abs(dx)-STEER_DEAD);  // 扣掉死區後才算舵量
  rgt=clamp(-Math.sign(dx)*mag/(DRAG_FULL-STEER_DEAD),-1,1);   // 往左拉＝往右偏
});
const endDrag=e=>{
  if(e && e.pointerId!==dragId) return;
  // 幾乎沒動＝點擊：命中已展開的名牌就進入該地標
  if(dragging && moved<TAP_SLOP && e && e.clientX!=null){
    const px=e.clientX, py=e.clientY;
    for(const h of hotspots){
      if(px>=h.x&&px<=h.x+h.w&&py>=h.y&&py<=h.y+h.h){ enterPlace(h.P); break; }
    }
  }
  dragging=false; dragId=null; fwd=0; rgt=0;
};
stage.addEventListener('pointerup',endDrag);
stage.addEventListener('pointercancel',endDrag);
/* 鍵盤：WASD（方向鍵同義）。桌機上摸不到拉桿，W/S 就是推拉那根桿子 ——
   ⚠ 用「持續推移」而不是一按到底：拉桿的手感就在於可以停在半速，
     鍵盤若一按就滿舵，等於桌機玩到的是另一套操作。 */
const keys={};
addEventListener('keydown',e=>{ keys[e.key.toLowerCase()]=true; });
addEventListener('keyup',  e=>{ keys[e.key.toLowerCase()]=false; });
/* ⚠ 切換視窗／分頁時 keyup 收不到，鍵會卡在 true。
   舊設計是「按著才會動」，卡鍵放開就停、看得出來；現在拉桿有記憶，
   一個漏掉的 keyup 會把油門一路推到底並停在那，畫面上看起來像船自己在跑。
   失焦一律清空按鍵狀態。 */
const clearKeys=()=>{ for(const k in keys) keys[k]=false; };
addEventListener('blur',clearKeys);
document.addEventListener('visibilitychange',()=>{ if(document.hidden) clearKeys(); });

const clock={minutes:8*60,date:14,dist:0};

// 返回主頁（原型是獨立頁面，不共用遊戲的場景切換）
document.getElementById('backBtn').addEventListener('click',()=>{ location.href='../index.html'; });

/* ══ 地圖畫面 ══
   直接用那張插畫（有地名、有圖例），裁切範圍與地形完全一致 →
   世界座標換算成圖上位置是直的：地圖像素 ÷ (MAPW,MAPH) 就是百分比。
   ⚠ 圖是**點開才載**（226KB）。飛行開場已經要讀高度圖與地貌圖，
     沒有理由讓一張只在暫停時看的圖跟著擋在前面。 */
/* ══ 2.5D 大陸浮雕 ══
   把高度場以斜角正投影烘成一張圖：sy = y*TILT − 高度×誇張倍率。
   由遠（北，y 小）往近（南，y 大）逐列畫，畫家演算法自然形成遮擋。
   ⚠ 用 COL（合成的地貌色）而不是那張插畫：插畫把地名與圖例畫死在像素裡，
     跟著地形位移會歪掉；而且用同一份反照率，地圖看到的顏色才跟飛行畫面
     是同一片大陸。
   ⚠ TILT 必須與 settlement.js 一致，否則聚落會浮在地表之上或陷進去。
   ⚠ 烘一次就好（2.6M 取樣）：以半解析度做，之後平移縮放都只是貼圖。 */
const MAP_TILT=(window.Settlement?Settlement.TILT:0.58);
const MAP_HEX=2.4;                     // 高度誇張倍率（1＝真實比例，太真實會扁得看不出山）
const MAP_SS=0.5;                      // 烘焙解析度（相對地圖像素）
let relief=null;                       // {cv, w, h, riseOf(x,y), topOf(x,y)}
function buildRelief(){
  if(relief) return relief;
  const sw=Math.round(MAPW*MAP_SS), sh0=Math.round(MAPH*MAP_SS);
  const hK=MAP_SS/MAP_SCALE*MAP_HEX;                    // 高度值 → 烘焙畫布像素
  let maxRise=0;
  for(let i=0;i<MAPW*MAPH;i+=13) if(HGT[i]>maxRise) maxRise=HGT[i];
  maxRise=Math.ceil(maxRise*hK)+2;
  const sh=Math.round(sh0*MAP_TILT)+maxRise+2;
  const cv=document.createElement('canvas'); cv.width=sw; cv.height=sh;
  const c=cv.getContext('2d');
  const img=c.createImageData(sw,sh), U=new Uint32Array(img.data.buffer);
  const SEA=rgb(28,38,52);
  U.fill(0);                                            // 透明底，海另外畫
  const step=Math.round(1/MAP_SS);
  for(let y=0;y<sh0;y++){
    const my=Math.min(MAPH-1,(y*step)|0);
    const gy=y*MAP_TILT+maxRise;                        // 地面線
    for(let x=0;x<sw;x++){
      const mx=Math.min(MAPW-1,(x*step)|0);
      const i=my*MAPW+mx, hh=HGT[i];
      if(hh<=CLOUD_H){                                  // 雲海／海：平的一片
        const py=(gy|0); if(py>=0&&py<sh) U[py*sw+x]=SEA;
        continue;
      }
      const rise=hh*hK;
      const top=(gy-rise)|0, bot=(gy|0)+1;
      const c0=COL[i];
      // 頂面：地貌色。側面：同色壓暗 → 讀得出立體，又不必另做岩壁貼圖
      const r0=c0&255, g0=(c0>>8)&255, b0=(c0>>16)&255;
      const face=rgb((r0*0.62)|0,(g0*0.62)|0,(b0*0.66)|0);
      for(let yy=Math.max(0,top);yy<bot&&yy<sh;yy++)
        U[yy*sw+x]=(yy<top+2)?c0:face;
    }
  }
  c.putImageData(img,0,0);
  relief={ cv, w:sw, h:sh, maxRise, hK, sh0 };
  return relief;
}
/* 地圖像素 → 浮雕畫布座標（聚落要坐在地表上，用同一條換算） */
function reliefXY(mx,my){
  const R=relief, i=(Math.min(MAPH-1,my|0))*MAPW+(Math.min(MAPW-1,mx|0));
  const hh=HGT[i]>CLOUD_H?HGT[i]:CLOUD_H;
  return { x:mx*MAP_SS, y:my*MAP_SS*MAP_TILT+R.maxRise-hh*R.hK };
}

const mapView=document.getElementById('mapView'), mapCv=document.getElementById('mapCv');
const mctx=mapCv.getContext('2d');
let mapOpen=false;
/* 視圖：zoom 1＝整張大陸剛好塞滿寬度；cx/cy＝視野中心的地圖像素座標 */
const MV={ zoom:1, cx:0, cy:0, min:1, max:16 };

function mapFit(){
  const R=buildRelief();
  const w=mapCv.clientWidth||900;
  const h=Math.round(w*R.h/R.w);
  const dpr=Math.min(2,devicePixelRatio||1);
  if(mapCv.width!==Math.round(w*dpr)){
    mapCv.width=Math.round(w*dpr); mapCv.height=Math.round(h*dpr);
    mapCv.style.height=h+'px';
  }
  return { w, h, dpr, base:w/R.w, R };   // base：zoom=1 時 1 浮雕像素＝幾個 CSS px
}
function drawMap(){
  if(!mapOpen || !MAPW) return;
  const { w, h, dpr, base, R } = mapFit();
  const sc=base*MV.zoom;                                   // 浮雕像素 → CSS px
  const halfW=w/2/sc, halfH=h/2/sc;
  MV.cx=clamp(MV.cx, Math.min(halfW,R.w/2), Math.max(R.w-halfW,R.w/2));
  MV.cy=clamp(MV.cy, Math.min(halfH,R.h/2), Math.max(R.h-halfH,R.h/2));
  const ox=w/2-MV.cx*sc, oy=h/2-MV.cy*sc;

  mctx.setTransform(dpr,0,0,dpr,0,0);
  mctx.fillStyle='#0a0c12'; mctx.fillRect(0,0,w,h);
  mctx.imageSmoothingEnabled=MV.zoom<2.5;                  // 放很大改硬像素，免得糊成一團
  mctx.drawImage(R.cv, ox, oy, R.w*sc, R.h*sc);

  /* 聚落：坐在地表上（reliefXY 換算高度），交給 settlement.js 的斜角渲染器。
     它自己依螢幕直徑決定 LOD → 整張大陸時是符號，放大才長出街廓與建築。
     ⚠ 排序：畫家演算法，y 大（南、近）的後畫，否則南邊的城會被北邊的蓋住。 */
  if(window.Settlement){
    const list=buildSettlements().slice().sort((a,b)=>a.my-b.my);
    for(const s of list){
      const p=reliefXY(s.mx,s.my);
      const sx=ox+p.x*sc, sy=oy+p.y*sc;
      // 聚落半徑是地圖像素 → 換到浮雕像素
      const rs=sc*MAP_SS, dia=s.radius*2*rs;
      if(sx<-dia-40||sy<-dia-40||sx>w+dia+40||sy>h+dia+40) continue;
      Settlement.draw(mctx, s, { ox:sx, oy:sy, scale:rs }, Settlement.DEBUG);
      if(dia>26){
        mctx.font='11px "Noto Serif TC",serif'; mctx.textAlign='center';
        const tw=mctx.measureText(s.name).width;
        mctx.fillStyle='rgba(8,7,12,.8)';
        mctx.fillRect(sx-tw/2-5, sy+dia*0.26, tw+10, 15);
        mctx.fillStyle='#e8dcbc'; mctx.fillText(s.name, sx, sy+dia*0.26+11);
      }
    }
  }

  /* 自機：同樣坐在地表上 */
  const p=reliefXY(cam.x/MAP_SCALE, cam.y/MAP_SCALE);
  const px=ox+p.x*sc, py=oy+p.y*sc;
  mctx.save(); mctx.translate(px,py);
  mctx.rotate(-cam.angle);                                 // 圖正北朝上，直接套航向
  mctx.fillStyle='#c9a227';
  mctx.beginPath(); mctx.moveTo(0,-11); mctx.lineTo(-7,8); mctx.lineTo(0,4); mctx.lineTo(7,8);
  mctx.closePath(); mctx.fill();
  mctx.strokeStyle='rgba(8,7,12,.85)'; mctx.lineWidth=1.2; mctx.stroke();
  mctx.restore();
  mctx.strokeStyle='rgba(201,162,39,.5)'; mctx.lineWidth=1;
  mctx.beginPath(); mctx.arc(px,py,15,0,Math.PI*2); mctx.stroke();
}
function updateMapMe(){ if(mapOpen) drawMap(); }

document.getElementById('mapBtn').addEventListener('click',()=>{
  // ⚠ 浮雕與聚落都是點開才算（2.6M 取樣 + 26 座聚落），不進飛行開場
  const R=buildRelief();
  MV.zoom=1; MV.cx=R.w/2; MV.cy=R.h/2;
  mapOpen=true; mapView.classList.add('on'); drawMap();
});
document.getElementById('mapClose').addEventListener('click',e=>{

/* 縮放與平移：滾輪／雙指縮放以指標為錨點，單指拖曳平移 */
function zoomAt(cssX, cssY, factor){
  const { w, h, base }=mapFit();
  const sc=base*MV.zoom;
  const mx=MV.cx+(cssX-w/2)/sc, my=MV.cy+(cssY-h/2)/sc;    // 指標下的地圖座標
  MV.zoom=clamp(MV.zoom*factor, MV.min, MV.max);
  const sc2=base*MV.zoom;
  MV.cx=mx-(cssX-w/2)/sc2; MV.cy=my-(cssY-h/2)/sc2;        // 讓該點維持在指標下
  drawMap();
}
mapCv.addEventListener('wheel',e=>{
  e.preventDefault();
  const r=mapCv.getBoundingClientRect();
  zoomAt(e.clientX-r.left, e.clientY-r.top, e.deltaY<0?1.18:1/1.18);
},{passive:false});
const mPts=new Map(); let mPinch=0;
mapCv.addEventListener('pointerdown',e=>{ mapCv.setPointerCapture(e.pointerId); mPts.set(e.pointerId,{x:e.clientX,y:e.clientY}); });
mapCv.addEventListener('pointermove',e=>{
  const p=mPts.get(e.pointerId); if(!p) return;
  const dx=e.clientX-p.x, dy=e.clientY-p.y;
  p.x=e.clientX; p.y=e.clientY;
  const { base }=mapFit(), sc=base*MV.zoom;
  if(mPts.size===1){ MV.cx-=dx/sc; MV.cy-=dy/sc; drawMap(); }
  else if(mPts.size===2){
    const [a,b]=[...mPts.values()];
    const d=Math.hypot(a.x-b.x,a.y-b.y);
    if(mPinch){
      const r=mapCv.getBoundingClientRect();
      zoomAt((a.x+b.x)/2-r.left,(a.y+b.y)/2-r.top, d/mPinch);
    }
    mPinch=d;
  }
});
const mUp=e=>{ mPts.delete(e.pointerId); if(mPts.size<2) mPinch=0; };
mapCv.addEventListener('pointerup',mUp);
mapCv.addEventListener('pointercancel',mUp);
addEventListener('resize',()=>{ if(mapOpen) drawMap(); });

/* ══ 航行 BGM ══
   停船＝Standby.mp3，航行＝Sail.mp3，兩者依速度交叉淡入淡出。

   ▍為什麼要兩個 <audio> 疊著跑
   單一元素做不到「無斷點循環」：audio.loop 是硬接回開頭（尾巴還在響、
   開頭直接切進來 → 接點一個突兀的跳變）；自己 seek 回 0 則中間必然有一段
   靜音。要真的沒有斷感，得在尾端 XF 秒讓**同一首的下一輪**先開始播，
   前一輪同時淡出 —— 兩條音軌重疊那 5 秒。所以每首各準備兩個元素輪流當班。
   ⚠ 把淡入淡出烘進音檔也可以，但那樣兩輪之間仍然是「淡出完才淡入」，
     中間會空掉；重疊才是消除斷感的關鍵，跟音檔怎麼做無關。

   ▍自動播放
   從首頁點「試飛」是換頁，手勢不會延續 → 先試播，被擋就掛一次性的
   pointerdown/keydown 補播；玩家一碰畫面就會響。 */
const BGM_VOL=0.2695, XFADE=5.0, MIX_RATE=0.014;  // 0.55 × 0.70 × 0.70（全域下調，與 config.js bgmVol 同步）；MIX_RATE：兩曲交叉約 3.5 秒
function makeLoop(src){
  const a=[new Audio(src), new Audio(src)];
  a.forEach(x=>{ x.preload='auto'; x.volume=0; x.loop=false; });
  let cur=0, on=false;
  a.forEach((x,i)=>x.addEventListener('ended',()=>{
    x.pause(); x.currentTime=0; if(cur===i) cur=1-i;    // 交棒給已經在播的那個
  }));
  return {
    /* ⚠ on 只有在 play() **真的成功**時才設 true。
       先前不管成敗都設 true，於是開場那次（一定會被自動播放政策擋掉）
       也算「已播放」→ 補播的監聽器立刻被移除，之後再也不會重試，
       結果就是整趟飛行完全沒有聲音。 */
    start(){
      if(on) return;
      const p=a[0].play();
      if(p && p.then) p.then(()=>{
        on=true;
        /* 順手預熱第二個元素：這是**確定播得動之後**才做，不會跟 start()
           搶同一個元素（先前在建構時就預熱，它的 pause() 有機會晚於
           start() 的 play() 執行，反而把剛起播的曲子按停）。 */
        const B=a[1], q=B.play();
        if(q && q.then) q.then(()=>{ B.pause(); B.currentTime=0; }).catch(()=>{});
      }).catch(()=>{});
      else on=true;
    },
    stop(){ a.forEach(x=>{x.pause();}); on=false; },
    playing(){ return on; },
    tick(gain){
      if(!on) return;
      const A=a[cur], B=a[1-cur], d=A.duration;
      if(!d||!isFinite(d)){ A.volume=gain; return; }
      const t=A.currentTime;
      let va=1;
      if(t>d-XFADE){                       // 尾端 XF 秒：A 淡出、B 同時淡入
        va=clamp((d-t)/XFADE,0,1);
        if(B.paused){ B.currentTime=0; const p=B.play(); if(p) p.catch(()=>{}); }
        B.volume=(1-va)*gain;
      }
      A.volume=va*gain;
    }
  };
}
const bgmSail=makeLoop('Sail.mp3'), bgmIdle=makeLoop('Standby.mp3');
let sailMix=0;                       // 0＝停船 1＝航行，收斂跟隨避免忽大忽小
function updateBgm(dt){
  // 門檻取很低：一有推進就切成航行曲，回到完全靜止才回待機
  const want=(Math.abs(cam.speed)>0.06)?1:0;
  sailMix+=(want-sailMix)*(1-Math.pow(1-MIX_RATE, dt/16.67));
  bgmSail.tick(BGM_VOL*sailMix);
  bgmIdle.tick(BGM_VOL*(1-sailMix));
}
(function startBgm(){
  /* ⚠ 監聽器要**確認真的播出來**才移除。play() 回傳的是 Promise，
     成功與否在下一個 tick 才知道，所以 kick 當下不能立刻判斷 ——
     每次事件都重試一次，等 playing() 轉 true 才收工。 */
  const kick=()=>{
    bgmSail.start(); bgmIdle.start();
    if(bgmSail.playing() && bgmIdle.playing()){
      removeEventListener('pointerdown',kick); removeEventListener('keydown',kick);
    }
  };
  kick();                                   // 先試：重整之類的情境手勢還在
  addEventListener('pointerdown',kick);     // 被擋就等第一次觸碰／按鍵
  addEventListener('keydown',kick);
})();

/* ── 雲團（3D 定位，飛行時錯身而過）───────────────────────────── */
const PUFFS=[];
function initPuffs(){
  _s=5150;
  for(let i=0;i<48;i++) PUFFS.push({
    x:cam.x+(rnd()-0.5)*1500, y:cam.y+(rnd()-0.5)*1500,
    h:CLOUD_H+180+rnd()*760, r:90+rnd()*260,
    a:0.18+rnd()*0.32, seed:rnd()
  });
}
function recyclePuffs(){
  const fx=-Math.sin(cam.angle), fy=-Math.cos(cam.angle);
  PUFFS.forEach(p=>{
    const dx=p.x-cam.x, dy=p.y-cam.y;
    const z=dx*fx+dy*fy;
    if(z<-140 || Math.hypot(dx,dy)>1250){
      const side=(rnd()-0.5)*1100, dist=520+rnd()*560;
      p.x=cam.x+fx*dist-fy*side; p.y=cam.y+fy*dist+fx*side;
      p.h=CLOUD_H+180+rnd()*760; p.r=90+rnd()*260;
      p.a=0.18+rnd()*0.32; p.seed=rnd();
    }
  });
}

/* ── 日月 ───────────────────────────────────────────────────────── */
function sky(){
  const t=clock.minutes/1440;
  const el=Math.sin((t-0.25)*Math.PI*2);
  const az=(t-0.25)*Math.PI*2;
  return {t,el,az,day:clamp(el*1.5+0.5,0,1),dusk:clamp(1-Math.abs(el)*3.2,0,1)};
}
function skyColors(S){
  // VP1 風：天頂淡藍、地平線近乎灰白（霧色＝地平線色，遠景才會洗成同一片）
  // ⚠ 夜色抬高：銀月照著，天不會黑到 [12,15,30]。地平線更要亮，
  //   因為霧色＝地平線色，壓太暗遠景會整片沉成黑幕、看不出地形輪廓。
  const nightTop=[30,37,60],  nightHz=[96,105,133];
  const dayTop  =[96,126,164],dayHz  =[214,222,230];
  const duskTop =[58,50,96],  duskHz =[228,176,142];
  const top=[0,0,0],hz=[0,0,0];
  for(let i=0;i<3;i++){
    top[i]=lerp(nightTop[i],dayTop[i],S.day);
    hz[i] =lerp(nightHz[i], dayHz[i], S.day);
    top[i]=lerp(top[i],duskTop[i],S.dusk*0.72);
    hz[i] =lerp(hz[i], duskHz[i], S.dusk*0.80);
  }
  return {top,hz};
}

function update(dt,now){
  // 鍵盤：傳統配置（WASD／方向鍵），直接餵進同一組操作向量
  let f=fwd, r=rgt;
  if(keys.w||keys.arrowup)    f=1;
  if(keys.s||keys.arrowdown)  f=-0.5;
  if(keys.a||keys.arrowleft)  r=-1;
  if(keys.d||keys.arrowright) r=1;
  const held = dragging || keys.w||keys.s||keys.a||keys.d ||
               keys.arrowup||keys.arrowdown||keys.arrowleft||keys.arrowright;
  rudder=r;
  // 舵輪：角速度 ∝ 舵量。放手就停在當下角度 —— 實體舵輪本來就不會自己回正
  wheelAng+=clamp(r,-1,1)*WHEEL_SPIN*dt;

  /* 轉向：舵量 → 角速度，**成比例**。
     ⚠ 原本是 clamp(atan2(r,f), ±TURN_RATE*dt)：TURN_RATE*dt 只有 0.018 弧度，
       而 r 只要 0.02 算出來的角度就超過它 —— 等於任何橫拉都直接夾到滿舵。
       沒有中間值就沒辦法微調，這才是「很難對準目標前進」的真正原因。
       改成 r 直接當舵量：輕推慢慢修、大拉才急轉。
       單手方案更依賴這件事 —— 縱向拉油門時橫向必定帶點晃動，
       配上 STEER_DEAD 的死區，那些晃動才不會變成蛇行。
     ⚠ 門檻用「真的在動」而不是「有前進意圖」：放手後船還在滑行，
       這時仍該轉得動；反過來停著就不該原地打轉。 */
  /* 原地迴轉：把拖曳「往前推」（f<0）＝主動停住，此時橫向拖曳直接轉船身。
     ⚠ 單純停著不該自轉（放著也會亂轉就不對了），但「往前推」是明確的
       「我要停下來調頭」意圖，跟放手滑行是兩回事，所以只認前推。
       迴轉率壓到 SPIN_EFF —— 靠推進器原地轉的大船本來就比航行中轉得慢。 */
  let turned=0;
  const mov=Math.abs(cam.speed)/MAX_SPD;
  const spin=held && f<-0.15;
  const eff=Math.max(spin?SPIN_EFF:0, clamp(mov*2.2,0,1));   // 舵效：慢速時舵不吃水
  if(Math.abs(r)>0.015 && eff>0.001){
    const step=clamp(r,-1,1)*TURN_RATE*dt*eff;
    cam.angle-=step;                                // 角度遞減＝向右偏（見 compass 換算）
    turned=step;
  }
  /* 偏艏：由「這一幀轉了多少」推目標角度，再收斂跟隨 → 入彎慢慢壓、出彎慢慢回。
     ⚠ 這裡是**向心**（船艏指進彎道內側）。物理上大船轉彎是艉部甩出去、
       艏部切進去，本來就該向心；先前寫成離心，玩家看到的是「往左拉、船頭
       卻朝右」，讀不出自己在轉哪邊。飛空艇更該像飛機一樣壓進彎道。 */
  const bankTarget=clamp(turned/(TURN_RATE*16.67)*BANK_MAX, -BANK_MAX, BANK_MAX);
  cam.bank+=(bankTarget-cam.bank)*(1-Math.pow(1-BANK_EASE, dt/16.67));

  /* 油門：往後拉的幅度＝速度。放開→滑行減速停住，不自動巡航。
     ⚠ 用「每幀比率 → 依 dt 換算」的指數逼近，不能直接乘 dt：
       直接乘會讓係數遠大於 1，變成一兩幀就到位（放開瞬間急煞，沒有慣性）。
     往前推（f<0）＝主動煞車：收斂率改用 ACCEL，那是螺旋槳實際在反轉出力，
     本來就該比放開手的惰行有力，否則「往前推」按下去跟放手沒兩樣。 */
  const target = held ? clamp(f,0,1)*MAX_SPD : 0;
  const rate = (held && f<-0.15) ? ACCEL
             : (target>cam.speed) ? ACCEL : BRAKE;
  cam.speed += (target-cam.speed)*(1-Math.pow(1-rate, dt/16.67));
  if(cam.speed<0.004) cam.speed=0;

  cam.alt=CRUISE_ALT;
  const fx=-Math.sin(cam.angle), fy=-Math.cos(cam.angle);
  const mv=cam.speed*dt*0.06;
  cam.x+=fx*mv; cam.y+=fy*mv;
  clock.dist+=Math.abs(mv);              // 後退也是航行距離，不該倒扣
  /* 0.10：時間跟著「走了多少世界單位」推進，而速度與世界都加倍了，
     沿用 0.20 會讓一日從 40 秒縮成 20 秒。晝夜的節奏是照真實秒數調的
     （太快會像縮時攝影），與世界尺度無關，所以要對半補回來。 */
  clock.minutes+=Math.abs(mv)*0.10;
  while(clock.minutes>=1440){clock.minutes-=1440;clock.date++;}
  recyclePuffs();

  const h=Math.floor(clock.minutes/60),m=Math.floor(clock.minutes%60);
  document.getElementById('clock').textContent=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
  document.getElementById('date').textContent=clock.date;
  document.getElementById('dist').textContent=Math.round(clock.dist);
  const deg=((-cam.angle*180/Math.PI)+1080)%360;
  document.getElementById('compass').textContent=['北','東北','東','東南','南','西南','西','西北'][Math.round(deg/45)%8];

  // 地標名稱已改由 3D 內的名牌呈現（drawPlaces），這裡不再重複彈 DOM 提示

  // 船的視覺狀態（甩帆/螺旋槳/浮動）必須在 cam.angle 定案後才算，否則角速度差一幀
  updateShipVisual(dt,now);
}

/* ── 渲染 ───────────────────────────────────────────────────────── */
const ybuf=new Int32Array(512);
function render(now){
  const S=sky(), SC=skyColors(S);
  const scaleH=BH*0.62;
  const horizon=BH*HORIZON_F;

  for(let y=0;y<BH;y++){
    const t=clamp(y/Math.max(1,horizon),0,1), tt=t*t;
    const sr=lerp(SC.top[0],SC.hz[0],tt), sg=lerp(SC.top[1],SC.hz[1],tt), sb=lerp(SC.top[2],SC.hz[2],tt);
    const row=y*BW, br=(y&3)<<2;
    SKYROW[y]=rgb(sr|0,sg|0,sb|0);        // 未抖動的純天空色，輪廓混色用
    // 天空是整片平滑漸層 → 8bit 量化會出色帶，逐像素套 Bayer 打散
    for(let x=0;x<BW;x++){
      const d=BAYER[br|(x&3)]*DITHER;
      bufU32[row+x]=rgb(clamp(sr+d,0,255)|0,clamp(sg+d,0,255)|0,clamp(sb+d,0,255)|0);
    }
  }
  for(let i=0;i<BW;i++){ ybuf[i]=BH; prevH[i]=-9999; topFrac[i]=0; ybufZ[i]=ZFAR; }

  /* 光照。⚠ terrain_generator.py 已把 hillshade 烘進地貌色，
     這裡的方向項刻意做弱（LIGHT_DIR_K），只負責「日月移動的味道」，
     不跟烘焙陰影打架；主要靠色溫變化表現晝夜。 */
  /* ⚠ 這個係數曾經是 0.0045，等於把方向光關掉：實測中間 50% 的地表
     亮度只差 3%（nl 四分位距 0.587~0.653）——山不會因為朝向而亮暗，
     立體感全靠貼圖裡烘死的 hillshade，整片大陸就成了色塊拼貼。
     拉高到 0.030 並把環境光壓低，受光/背光才拉得開。 */
  const LIGHT_DIR_K=0.030;
  /* 光源在日月之間過渡：白天跟太陽走，入夜交給固定在西邊的銀月。
     ⚠ 方向也要換，不然夜裡的明暗面還停在太陽落下前的位置，
       月亮明明在西邊、山的受光面卻在東邊。 */
  const lx=lerp(Math.cos(MOON_AZ),Math.cos(S.az),S.day);
  const ly=lerp(Math.sin(MOON_AZ),Math.sin(S.az),S.day);
  const moonI=lerp(MOON_LIT,0.04,S.day);
  const sunI=clamp(S.el*0.85+0.20,0.05,0.50)+moonI;
  const ambI=lerp(0.46,0.52,S.day);   // 降低環境光：背光面要真的暗得下來
  // 月光是銀色：冷但不藍到發紫，飽和度低於原本的夜色
  const lightR=lerp(lerp(0.80,1.0,S.day),1.20,S.dusk);
  const lightG=lerp(lerp(0.86,1.0,S.day),0.88,S.dusk);
  const lightB=lerp(lerp(1.04,1.0,S.day),0.72,S.dusk);

  const sinp=Math.sin(cam.angle), cosp=Math.cos(cam.angle);
  const FOGS=ZFAR*FOG_START;
  const fr=SC.hz[0], fg=SC.hz[1], fb=SC.hz[2];
  /* ⚠ 不取整。原本 (now*0.006)|0 每 167ms 才跳一個地圖像素（＝20 世界單位），
     位移是整數台階 → 看起來就是 6fps 的抽動，跟畫面的 60fps 無關。
     速度維持不變，只是改成連續值，再配合下方的雙線性取樣才會順。 */
  const cloudScroll=now*0.006;
  const cloudLit=lerp(0.80,1.0,S.day);   // 銀月照著，夜裡的雲不該是灰的

  let z=1.0, dz=0.75;
  while(z<ZFAR){
    let plx=(-cosp*z-sinp*z)+cam.x, ply=(sinp*z-cosp*z)+cam.y;
    const prx=(cosp*z-sinp*z)+cam.x, pry=(-sinp*z-cosp*z)+cam.y;
    const ddx=(prx-plx)/BW, ddy=(pry-ply)/BW;
    const fog=clamp((z-FOGS)/(ZFAR-FOGS),0,1)*FOG_MAX;
    const invz=1/z;

    for(let i=0;i<BW;i++){
      // 世界座標 → 地圖像素
      const mfx=plx*INV_SCALE, mfy=ply*INV_SCALE;
      const xi=mfx|0, yi=mfy|0;
      let hh,r,g,b,isRiver=0;
      const outside=(xi<0||yi<0||xi>=MAPW||yi>=MAPH);
      const mi=outside?0:yi*MAPW+xi;
      const th=outside?0:HGT[mi];
      if(outside||th<=CLOUD_H){
        /* 雲海：連續位移 + 雙線性取樣。位移與取樣都不再有整數台階，
           流動才會順（原本兩者都是整數，雲每 167ms 才動一格）。
           ⚠ 先加 4096（CT 的倍數）確保為正：負數的 |0 是往零截斷，
             小數部分會變成負的，內插權重就全錯了。 */
        const cfx=mfx+cloudScroll+4096, cfy=mfy+cloudScroll+4096;
        const cx0=cfx|0, cy0=cfy|0, cu=cfx-cx0, cv=cfy-cy0;
        const rw0=(cy0&CTM)*CT, rw1=((cy0+1)&CTM)*CT;
        const cA=cx0&CTM, cB=(cx0+1)&CTM;
        const j00=rw0+cA, j10=rw0+cB, j01=rw1+cA, j11=rw1+cB;
        const w00=(1-cu)*(1-cv), w10=cu*(1-cv), w01=(1-cu)*cv, w11=cu*cv;
        hh=CLOUD_H+(CLOUDH[j00]*w00+CLOUDH[j10]*w10+CLOUDH[j01]*w01+CLOUDH[j11]*w11);
        const q00=CLOUDTEX[j00], q10=CLOUDTEX[j10], q01=CLOUDTEX[j01], q11=CLOUDTEX[j11];
        r=((q00&255)*w00+(q10&255)*w10+(q01&255)*w01+(q11&255)*w11)*cloudLit;
        g=(((q00>>8)&255)*w00+((q10>>8)&255)*w10+((q01>>8)&255)*w01+((q11>>8)&255)*w11)*cloudLit;
        b=(((q00>>16)&255)*w00+((q10>>16)&255)*w10+((q01>>16)&255)*w01+((q11>>16)&255)*w11)*cloudLit;
      }else{
        /* 雙線性取樣高度。⚠ 近景一個地圖像素橫跨約 33 個緩衝像素
           （MAP_SCALE 20 之後更明顯），最近鄰會把地表切成 20 世界單位寬的
           台階，走過去像在爬樓梯。四角內插把台階變成斜面。
           ⚠ 只在「四角都是陸地」時才內插：靠海岸時鄰格是雲海高度 0，
             內插會把大陸邊緣拉成緩坡，斷崖就沒了 —— 那正是浮空大陸的賣點。 */
        const x1=xi<MAPW-1?xi+1:xi, y1=yi<MAPH-1?yi+1:yi;
        const i10=yi*MAPW+x1, i01=y1*MAPW+xi, i11=y1*MAPW+x1;
        const h10=HGT[i10], h01=HGT[i01], h11=HGT[i11];
        let cr,cg,cb;
        if(h10>CLOUD_H && h01>CLOUD_H && h11>CLOUD_H){
          const tx=mfx-xi, ty=mfy-yi;
          const a0=th+(h10-th)*tx, a1=h01+(h11-h01)*tx;
          hh=a0+(a1-a0)*ty;
          /* 顏色也要內插。⚠ 只做高度不做顏色的話，地形是平順的但貼圖仍是
             20 世界單位一格的色塊 —— 那正是「馬賽克太重」的來源，
             而且形狀變平順之後色塊反而更顯眼。 */
          const c00=COL[mi], c10=COL[i10], c01=COL[i01], c11=COL[i11];
          const w00=(1-tx)*(1-ty), w10=tx*(1-ty), w01=(1-tx)*ty, w11=tx*ty;
          cr=(c00&255)*w00+(c10&255)*w10+(c01&255)*w01+(c11&255)*w11;
          cg=((c00>>8)&255)*w00+((c10>>8)&255)*w10+((c01>>8)&255)*w01+((c11>>8)&255)*w11;
          cb=((c00>>16)&255)*w00+((c10>>16)&255)*w10+((c01>>16)&255)*w01+((c11>>16)&255)*w11;
        }else{
          hh=th;
          const c=COL[mi];
          cr=c&255; cg=(c>>8)&255; cb=(c>>16)&255;
        }
        // 高頻細節：在世界座標上取樣，補回被放大糊掉的近景起伏
        const dt=DETH[(((ply|0)&DTM)*DET_TILE)+((plx|0)&DTM)];
        hh+=dt*(DET_AMP/127);
        isRiver=RIV[mi];
        const nl=clamp(0.62+(SLX[mi]*lx+SLY[mi]*ly)*LIGHT_DIR_K,0,1.5);
        const sh=(ambI+sunI*nl)*GRADE_EXPO;
        r=cr*sh*lightR; g=cg*sh*lightG; b=cb*sh*lightB;
        // VP1 分級：往亮度收斂＝去飽和（在光照之後、霧之前，霧色才不會被連帶洗掉）
        const lum=r*0.299+g*0.587+b*0.114;
        r=lum+(r-lum)*GRADE_SAT; g=lum+(g-lum)*GRADE_SAT; b=lum+(b-lum)*GRADE_SAT;
      }
      // 曲率：等價於把地表下沉 d²/(2R)，展開後只是加一項 z*curvK[i]
      const yf=((cam.alt-hh)*invz + z*curvK[i])*scaleH+horizon;
      let y=yf|0;
      if(y<ybuf[i]){
        // 次像素：這一列有多少「沒被地形蓋到」。收尾時只拿最後的頂端來混。
        topFrac[i]=(y>0)?clamp(yf-y,0,1):0;
        if(y<0) y=0;
        const sr=r, sg=g, sb=b;        // 未套霧的地表色，立面要從這裡推
        if(fog>0.002){ r=lerp(r,fr,fog); g=lerp(g,fg,fog); b=lerp(b,fb,fog); }
        const dth=BAYER[((y&3)<<2)|(i&3)]*DITHER;
        const top=rgb(clamp(r+dth,0,255)|0,clamp(g+dth,0,255)|0,clamp(b+dth,0,255)|0);
        const bot=ybuf[i];
        /* ⚠ 每幀 prevH 初始化為 -9999 代表「還沒有上一筆」。不特判的話
           最近的那一步 drop 會是一萬多，整片畫面下緣被當成巨型崖面畫出來
           —— 那就是會看到的破圖。 */
        const first=prevH[i]<-9000;
        const drop=first?0:hh-prevH[i]; // 相對「上一個（更近的）已畫取樣」的高度落差
        /* ⚠ 遠處與極短的柱子直接填單色：柱高只有幾個像素、或已經被霧洗到
           接近地平線色時，立面的紋理與漸暗一個都看不出來，卻要付整段
           per-pixel 的代價。畫面大部分面積都落在這一類，這道閘門省下的
           時間比任何其他優化都多。 */
        const y0=y;
        if(bot-y0>3 && fog<0.86){
          /* 立面：**所有**垂直線段都走這條路，不再只有大落差才處理。
             原本落差不到門檻就整條填單一地表色，於是每根柱子都是一道
             純色豎條 —— 那正是「垂直立面怪怪的」。
             顏色由該處地表色推導（雪山得到灰白的壁、森林區得到褐綠的壁），
             加上橫向岩層條紋與往下漸暗（環境光被崖壁自身遮蔽）。
             落差越大越混入獨立的岩石反照率：小起伏是土坡，大落差才是岩壁。 */
          const cap=y0+2;
          for(let yy=y0;yy<cap && yy<bot;yy++) bufU32[yy*BW+i]=top;
          const wx=xi, wy=yi;
          const rocky=clamp((drop-16)/(CLIFF_DH*1.5),0,1);
          const fall=isRiver && rocky>0.40;   // 河道 + 真的是斷崖 → 瀑布
          const wamb=ambI+sunI*0.35;          // 崖面朝側，取中間調
          for(let yy=cap;yy<bot;yy++){
            const d=(yy-cap)/Math.max(1,bot-cap);      // 0＝崖頂 1＝沒入雲海
            let cr,cg,cb;
            if(fall){
              /* 瀑布：河水落下。色相直接取河道自己的地貌色（COL[mi]），只是
                 被打散成白沫而提亮，往下越散越白。
                 ⚠ 先前寫死 222..255 的純白、且完全不吃日照 —— 夜裡整條瀑布
                   還是正午的白，掛在暗掉的崖面上像螢光漆。水的顏色本來就
                   來自它反射的天光，得跟崖面同一盞燈才對得起來。
                 sunI 給到 0.75（崖面只有 0.35）：水面朝天，接光比側向的岩壁多，
                 這樣夜裡是「暗藍的水」而不是「被一起關燈的灰柱」。 */
              const rc=COL[mi];
              const flow=hash(wx*3, (yy*2 - (now*FALL_SPD|0)) & 511);
              const foam=clamp(0.46+flow*0.26-d*0.14+sstep(0.55,1,d)*0.34,0,1);
              const wsh=(ambI+sunI*0.75)*GRADE_EXPO;
              cr=lerp( rc&255,      248,foam)*wsh*lightR;
              cg=lerp((rc>>8)&255,  250,foam)*wsh*lightG;
              cb=lerp((rc>>16)&255, 255,foam)*wsh*lightB;
              // 與河面走同一條分級曲線，兩者才會是同一種水
              const wl=cr*0.299+cg*0.587+cb*0.114;
              cr=wl+(cr-wl)*GRADE_SAT; cg=wl+(cg-wl)*GRADE_SAT; cb=wl+(cb-wl)*GRADE_SAT;
            }else{
              /* 立面色＝地表色 × 岩層條紋 × 往下漸暗。
                 ⚠ 從地表色推導才會有「顏色變化」——各地的壁自然帶著該地
                   的色調；用一種寫死的岩石色會讓整座大陸的側面長得一樣。
                 大落差再往獨立的岩石反照率靠：地表在背光側本來就暗，
                 純用地表色乘下去會變成黑洞，岩石色把它拉回來。 */
              const strat=STRAT[(wx*5+wy*3+(yy>>1))&255];
              const v=(1-d*0.34)*(0.88+strat*0.14);   // 條紋收斂：每根柱子都有立面了，原本的幅度會整片變雜點
              cr=sr*v; cg=sg*v; cb=sb*v;
              if(rocky>0.01){
                cr=lerp(cr,152*v*wamb*lightR,rocky);
                cg=lerp(cg,138*v*wamb*lightG,rocky);
                cb=lerp(cb,126*v*wamb*lightB,rocky);
              }
              if(yy-cap<2){ cr*=1.22; cg*=1.20; cb*=1.18; }   // 崖唇受光提亮
            }
            if(fog>0.002){ cr=lerp(cr,fr,fog); cg=lerp(cg,fg,fog); cb=lerp(cb,fb,fog); }
            const wd=BAYER[((yy&3)<<2)|(i&3)]*DITHER;
            bufU32[yy*BW+i]=rgb(clamp(cr+wd,0,255)|0,clamp(cg+wd,0,255)|0,clamp(cb+wd,0,255)|0);
          }
        }else{
          for(let yy=y0;yy<bot;yy++) bufU32[yy*BW+i]=top;
        }
        ybuf[i]=y; prevH[i]=hh; ybufZ[i]=z;
      }
      plx+=ddx; ply+=ddy;
    }
    // 視距 3600 下若沿用 0.0042 會逼近 1800 步；遠景只占幾個像素又被霧吃掉，
    // 放寬成長率把步數壓回 ~800，畫質看不出差別但省一半以上取樣。
    z+=dz; dz+=0.011;
  }

  /* ══ 抗鋸齒 ①：輪廓的次像素混色 ══
     z 迴圈跑完後，ybuf[i] 就是該欄地形的最高列 —— 那一列才是真正的
     天空／地形交界，也只有它該做覆蓋率混色。
     ⚠ 一開始我在迴圈裡「每畫一次新頂端就混一次」，結果連續斜坡上每隔
       幾列就有一條偏天空色的亮列（因為上方當下還是天空、更遠的地形之後
       才會補進來），逐欄相位又不同 → 整片鹽粒雜訊。
       交界只有一條，混色也只該做一次。
     成本 O(BW)，一幀幾百次，可以忽略。 */
  for(let i=0;i<BW;i++){
    const f=topFrac[i], ty=ybuf[i];
    if(f<0.08 || ty<=0 || ty>=BH) continue;
    const c=bufU32[ty*BW+i], s=SKYROW[ty];
    const cr=c&255, cg=(c>>8)&255, cb=(c>>16)&255;
    bufU32[ty*BW+i]=rgb(
      (cr+((s&255)-cr)*f)|0,
      (cg+(((s>>8)&255)-cg)*f)|0,
      (cb+(((s>>16)&255)-cb)*f)|0);
  }

  bctx.putImageData(buf,0,0);
  ctx.drawImage(bcv,0,0,BW,BH,0,0,W,VIEWH);

  // 疊加物一律裁切在 3D 視窗內，不可溢出到操作面板
  ctx.save();
  ctx.beginPath(); ctx.rect(0,0,W,VIEWH); ctx.clip();
  drawSunMoon(S,horizon,sinp,cosp);
  drawPuffs(S,scaleH,horizon,sinp,cosp);
  drawSettlements3D(scaleH,horizon,sinp,cosp);
  drawPlaces(scaleH,horizon,sinp,cosp);
  drawShip(now);
  vignette(S);
  ctx.restore();

  drawPanel(S);
}

function drawSunMoon(S,horizon,sinp,cosp){
  const syk=VIEWH/BH;
  const body=(az,el,R,core,glow)=>{
    if(el<-0.22) return;
    const camAz=Math.atan2(-sinp,-cosp);
    let da=az-camAz;
    while(da>Math.PI)da-=Math.PI*2;
    while(da<-Math.PI)da+=Math.PI*2;
    if(Math.abs(da)>1.05) return;
    const x=W/2+Math.tan(da)*(W/2);
    const y=(horizon*syk)-el*VIEWH*0.62;
    const g=ctx.createRadialGradient(x,y,0,x,y,R*5.5);
    g.addColorStop(0,glow); g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,R*5.5,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=core; ctx.beginPath(); ctx.arc(x,y,R,0,Math.PI*2); ctx.fill();
  };
  body(S.az,S.el,13, S.dusk>0.35?'#ffd9a0':'#fff6dc', S.dusk>0.35?'rgba(255,168,88,.5)':'rgba(255,238,190,.34)');
  /* 銀月：位置固定、日夜皆在，不繞行也不盈虧。白天光暈收斂（被日光壓過），
     夜裡放到最大 —— 它是這片大陸的名字，該是天上最顯眼的東西。 */
  const mg=lerp(0.52,0.20,S.day);
  body(MOON_AZ,MOON_EL,MOON_R,'#eef1fa',`rgba(198,214,252,${mg.toFixed(2)})`);
}

function drawPuffs(S,scaleH,horizon,sinp,cosp){
  const sxk=W/BW, syk=VIEWH/BH;
  const fx=-sinp, fy=-cosp;
  const list=[];
  PUFFS.forEach(p=>{
    const dx=p.x-cam.x, dy=p.y-cam.y;
    const z=dx*fx+dy*fy;
    if(z<3||z>ZFAR) return;
    const s=(dx*cosp+dy*(-sinp))/z;
    if(s<-2.4||s>2.4) return;
    list.push({p,z,s});
  });
  list.sort((a,b)=>b.z-a.z);
  const lit=lerp(0.72,1.0,S.day), warm=S.dusk;   // 銀月照著，夜裡的雲團不該是灰的
  list.forEach(({p,z,s})=>{
    const x=((s+1)/2*BW)*sxk;
    const y=(((cam.alt-p.h)/z + z*curvAt(s))*scaleH+horizon)*syk;
    const R=p.r/z*scaleH*syk*0.9;
    if(R<1.2) return;
    const a=p.a*clamp((ZFAR-z)/(ZFAR*0.45),0,1)*clamp(z/30,0,1);
    if(a<0.012) return;
    const cr=Math.round(lerp(226,255,warm)*lit),
          cg=Math.round(lerp(232,206,warm)*lit),
          cb=Math.round(lerp(244,186,warm)*lit);
    ctx.save(); ctx.globalAlpha=a;
    for(let k=0;k<5;k++){
      const ang=k/5*Math.PI*2+p.seed*6;
      const ox2=Math.cos(ang)*R*0.42, oy2=Math.sin(ang)*R*0.17;
      const rr=R*(0.52+((k*37)%7)/14);
      const gg=ctx.createRadialGradient(x+ox2,y+oy2,0,x+ox2,y+oy2,rr);
      gg.addColorStop(0,`rgba(${cr},${cg},${cb},.9)`);
      gg.addColorStop(1,`rgba(${cr},${cg},${cb},0)`);
      ctx.fillStyle=gg;
      ctx.beginPath(); ctx.ellipse(x+ox2,y+oy2,rr,rr*0.62,0,0,Math.PI*2); ctx.fill();
    }
    ctx.restore();
  });
}

/* ══ 地標 ══
   遠：只有一枚向下的箭頭浮在地標上方（不透露名稱）
   近：箭頭下方展開名牌 —— 名牌出現＝可點擊進入
   點擊判定用 hotspots（每幀重建），tap 與拖曳靠位移量區分。 */
/* 1800 世界單位＝90 地圖像素。大陸放大一倍後跟著加倍，維持「相對地圖」
   的同一段距離；沿用 900 會變成要飛到幾乎貼著地標才跳出名字。 */
const NAME_DIST = 1800;   // 進入此距離才顯示名稱＝可進入
let hotspots=[];
function drawPlaces(scaleH,horizon,sinp,cosp){
  const sxk=W/BW, syk=VIEWH/BH;
  hotspots=[];
  const list=[];
  PLACES.forEach(P=>{
    const dx=P.wx-cam.x, dy=P.wy-cam.y;
    const z=dx*(-sinp)+dy*(-cosp);
    if(z<10||z>ZFAR*0.92) return;
    const s=(dx*cosp+dy*(-sinp))/z;
    if(s<-1.1||s>1.1) return;
    list.push({P,bx:((s+1)/2*BW)*sxk,
                 by:(((cam.alt-(P.h||0))/z + z*curvAt(s))*scaleH+horizon)*syk,
                 z, near:Math.hypot(dx,dy)<NAME_DIST});
  });
  list.sort((a,b)=>b.z-a.z);
  list.forEach(o=>{
    const fade=clamp((ZFAR*0.92-o.z)/240,0,1);
    ctx.globalAlpha=fade;
    /* ⚠ 只有「遠處的箭頭」浮動。名牌一旦展開就整組定住 ——
       名牌是要讀的字，2.5px 的正弦擺動在 11px 的字上等於一直在晃，
       而且它同時是點擊熱區，會動的按鈕本來就難按。
       座標取整：字落在半個像素上會被反鋸齒糊掉，看起來也像在抖。 */
    const ay=Math.round(clamp(o.by-30,18,VIEWH-40));   // 箭頭底端（指著地標）
    const bx=Math.round(o.bx);
    const bob=o.near?0:Math.sin(performance.now()*0.004+o.bx)*2.5;

    // 向下箭頭
    ctx.fillStyle= o.near ? '#c9a227' : 'rgba(201,162,39,.62)';
    ctx.beginPath();
    ctx.moveTo(bx, ay+bob);
    ctx.lineTo(bx-6.5, ay-10+bob);
    ctx.lineTo(bx+6.5, ay-10+bob);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle='rgba(8,7,12,.55)'; ctx.lineWidth=1; ctx.stroke();

    // 近距離才展開名牌（＝可點擊）
    if(o.near){
      ctx.font='11px "Noto Serif TC",serif'; ctx.textAlign='center';
      const tw=Math.round(ctx.measureText(o.P.name).width);
      const bx0=bx-((tw/2)|0)-9, by0=ay-32, bwid=tw+18, bhei=18;
      ctx.fillStyle='rgba(5,6,12,.8)'; ctx.fillRect(bx0,by0,bwid,bhei);
      ctx.strokeStyle='#c9a227'; ctx.lineWidth=1; ctx.strokeRect(bx0+0.5,by0+0.5,bwid,bhei);
      ctx.fillStyle='#c9a227'; ctx.fillText(o.P.name,bx,by0+13);
      // 點擊熱區放大一圈，手指才好按
      hotspots.push({x:bx0-8,y:by0-8,w:bwid+16,h:bhei+22,P:o.P});
    }
    ctx.globalAlpha=1;
  });
}

/* ══ 聚落（3D 飛行畫面）══
   聚落在世界裡是有大小的東西，不是地圖上的一枚圖釘 —— 飛過去就該看見城。
   投影與地標同一套（drawPlaces），差別是還要換算「一個世界單位在這個
   深度佔幾個螢幕像素」：橫向視錐在深度 z 的半寬就是 z，對應 BW 個緩衝像素，
   所以 1 世界單位 = W/(2z) 螢幕像素。
   ⚠ 遮擋要同時看「高度」與「深度」。ybuf 是該欄地形的最高列，但那通常是
     **最遠**的山脊（越遠的高地投影越靠地平線＝列數越小），聚落位在它下方
     是正常的，不代表被擋 —— 只比 ybuf 會把每一座城都判成看不見。
     真正被擋的條件是：那一列的來源比聚落**更近**（ybufZ < z），而且它
     壓在聚落的地面之上（ybuf < by）。兩者同時成立才是前面有山。
   ⚠ LOD 交給 settlement.js 依螢幕直徑自己決定，遠處自動退成符號。 */
function drawSettlements3D(scaleH,horizon,sinp,cosp){
  if(!window.Settlement || !MAPW) return;
  const sxk=W/BW, syk=VIEWH/BH;
  const nightK=clamp(1-sky().day*1.25,0,1);      // 入夜程度：城裡的燈火強度
  const list=[];
  for(const s of buildSettlements()){
    const dx=s.mx*MAP_SCALE-cam.x, dy=s.my*MAP_SCALE-cam.y;
    const z=dx*(-sinp)+dy*(-cosp);
    if(z<60||z>ZFAR*0.9) continue;
    const sv=(dx*cosp+dy*(-sinp))/z;
    if(sv<-1.35||sv>1.35) continue;
    const col=Math.round(((sv+1)/2)*BW);
    if(col<0||col>=BW) continue;
    const i=(Math.min(MAPH-1,s.my|0))*MAPW+(Math.min(MAPW-1,s.mx|0));
    const gh=HGT[i]>CLOUD_H?HGT[i]:CLOUD_H;
    const by=((cam.alt-gh)/z + z*curvAt(sv))*scaleH+horizon;      // 緩衝列
    if(ybufZ[col]<z-40 && ybuf[col]<by-2) continue;                // 前面有更近的山稜擋住
    list.push({s, z, x:((sv+1)/2*BW)*sxk, y:by*syk});
  }
  list.sort((a,b)=>b.z-a.z);                                       // 遠的先畫
  for(const o of list){
    const sc=W/(2*o.z);                                            // 世界單位 → 螢幕像素
    const R=SETTLE_R[o.s.tier]*MAP_SCALE;                          // 半徑（世界單位）
    if(R*2*sc<3) continue;
    ctx.save();
    /* 城要跟同深度的地形吃同一份霧。原本只有一個「靠近 ZFAR 才淡出」的
       距離淡出，中景的城完全不吃霧 —— 周圍地表已經被霧洗掉一半、城還是
       滿對比，看起來就是浮在霧前面的一張圖。這裡直接套用地形那條霧曲線
       （FOG_START/FOG_MAX 同源），城才會跟著地面一起沉進大氣裡。 */
    const fogS=ZFAR*FOG_START;
    const fogK=clamp((o.z-fogS)/(ZFAR-fogS),0,1)*FOG_MAX;
    ctx.globalAlpha=clamp((ZFAR*0.9-o.z)/(ZFAR*0.30),0,1)*(1-fogK);
    /* 地面壓縮率（tilt）：讓城真的躺在地上。
       橫向：1 世界單位 = sc 螢幕像素。
       縱向：地面列是 ((alt-gh)/z + z*curv)*scaleH，對 z 微分得
              (-(alt-gh)/z² + curv)*scaleH → 再乘 syk 換成螢幕像素。
       兩者相除就是這個深度的真實壓縮率。固定 0.58 是地圖畫面用的斜角常數，
       搬到 3D 裡就成了一張不隨視角變形的貼紙浮在地表上。
       ⚙ 夾上下限：飛得極低時 z² 分母會把值推到失控。 */
    const gh0=HGT[(Math.min(MAPH-1,o.s.my|0))*MAPW+(Math.min(MAPW-1,o.s.mx|0))];
    const dydz=(-(cam.alt-(gh0>CLOUD_H?gh0:CLOUD_H))/(o.z*o.z)+curvAt(0))*scaleH*syk;
    const tilt=clamp(Math.abs(dydz)/sc,0.06,1.10);
    /* ⚠ Settlement.draw 的 scale 是「每個**地圖像素**幾個螢幕像素」——
       s.radius 存的是地圖像素（同地圖畫面那邊傳 sc*MAP_SS）。
       sc 是每個**世界單位**幾個螢幕像素，兩者差一個 MAP_SCALE。
       直接傳 sc 的話整座城會縮小 20 倍 → screenDia 永遠 <20 → LOD 0，
       飛到城上空也只看得到一顆符號點。上面那行尺寸檢查用的 R 有乘
       MAP_SCALE，所以檢查會過、畫出來卻是點——兩邊單位不一致的典型病。 */
    Settlement.draw(ctx, o.s, { ox:o.x, oy:o.y, scale:sc*MAP_SCALE, tilt, night:nightK,
                                 rot:cam.angle, groundL:30, groundA:0.28 }, Settlement.DEBUG);
    ctx.restore();
  }
}

/* 進入地標（目前只做確認演出；之後接場景切換） */
let entering=null;
function enterPlace(P){
  entering={P,t:performance.now()};
