uniform vec3 uLcol;            // lightR, G, B
uniform vec2 uLi;              // ambI, sunI
uniform vec3 uFog;             // 霧色（地平線色）
uniform float uCloudLit;
uniform float uTime;      // 毫秒，瀑布的水流動畫用
out vec4 o;

const float BAY[16]=float[16](${[...BAYER].map(v=>v.toFixed(5)).join(',')});
float hRaw(ivec2 t){ return float(texelFetch(uH, t, 0).r); }
/* 這一點的地表高度：陸海看最近鄰、表面高度看平滑那一張。
   ⚠ uv 用 mf/uMap —— texel 中心在 (i+0.5)，所以 mf=i+0.5 剛好取到整格的值、
     格與格之間才內插（與最近鄰版在格心完全一致，不會整體位移）。 */
/* ══⚠⚠⚠ 地形的最高點（ver -1302）══ 射線一旦高過它、而且還在往上爬，
   就**不可能再打到任何東西** —— 見主迴圈那個提早結束。由 JS 從高度圖量出來。 */
uniform float uMaxH;
/* 跳空用的 max-mipmap（ver -1303）：每一階存子格的最大值。NEAREST，走 texelFetch。 */
uniform sampler2D uHmax;
uniform int uMaxLod;
float hSurf(vec2 mf, ivec2 ti, bool outside, out bool cloud){
  if(outside){ cloud=true; return ${CLOUD_H}.0; }
  /* ⚠⚠ 陸海的界線也走**平滑高度**（ver -1219，Ray：「大陸邊緣的立面也用同樣方式處理」）。
     -1216 只把陸地的表面磨平，陸／海的分類還是逐格的布林 —— 於是大陸的輪廓
     在俯視上是一排 20 單位的方格，那就是邊緣看起來還是一堆方塊的原因。
     改成「內插後的高度掉到雲海面以下就是海」，界線變成一條**等高線**，是平滑的。
     ⚠ 舊註解怕的是「內插會把斷崖拉成緩坡」—— 實際上不會：海床遠低於雲海面，
       一格 20 單位之內高度就從幾百掉到幾十，斜率超過 10:1，讀起來仍然是垂直的崖。
     ⚠ 順帶省一次取樣：不再需要最近鄰那一張（uH）來判陸海，行進迴圈裡只剩一次 texture()。 */
  /* ⚠⚠⚠ **海也回這張圖上的值**（ver -1239）：靠岸那一圈存的是往下凹的海面
     （見 JS 端的 RIM_DEEP_*），射線因此能走到大陸的底，崖面才畫得出厚度。
     遠離陸地的海仍然是雲海面，所以外海的樣子一個字都沒變。
     ⚠ 這一段在 GLSL 的樣板字串裡，**註解不可以有反引號**（踩第七次了）。 */
  float ts = texture(uHs, mf/uMap).r;
  cloud = ts <= ${CLOUD_H}.0;
  return ts;
}
/* 城的地面：世界座標 → 這座城的 uv（與 CPU 同一條式子），回 rgb + alpha。
   ⚠ 反分級要在這裡做（CPU 是烘進金字塔的，§6.7.5）：插畫的色調是對著
     「不吃 GRADE_SAT、只除 BAKED_VAL 乘 TRIM」那條舊路校的，取樣路把城當地形畫
     會**再分級一次** —— 不反轉的話整座城會洗成灰白。 */
vec4 citySample(sampler2D tex, vec4 P0, vec4 P1, float tpw, vec2 wp, float z){
  if(P1.w<0.5) return vec4(0.0);
  vec2 r=wp-P0.xy;
  float u=(r.x*P0.z+r.y*P0.w)*P1.x+0.5;
  float v=(-r.x*P0.w+r.y*P0.z)*P1.y+0.5;
  if(u<0.0||u>=1.0||v<0.0||v>=1.0) return vec4(0.0);
  /* ⚠⚠⚠ 一定要 textureLod，**不可以用 texture()**（ver -1211，Ray 回報
     「帝都亂七八糟還有方型的底」「底色會隨著移動有直條在底部移動」）。
     texture() 的層級是硬體用**螢幕空間的導數**挑的，而這裡是 raymarch：
     相鄰的兩個像素可能打在天差地遠的深度上，導數是垃圾 → 每個 2×2 quad
     各挑一個亂七八糟的層級。挑到最粗那幾層時，整張插畫被平均成一塊（含輪廓外
     那一圈本來 alpha=0 的地方）→ alpha 不再是 0 → **整個外接矩形被畫出來**
     ＝「方型的底」；而層級逐欄跳動 ＝「隨著移動的直條」。
     正解是自己算：一個緩衝像素在這個深度覆蓋 2z/BW 個世界單位（wpp），
     層級 = log2(每世界單位的 texel 數 × wpp × CITY_LOD_K)
     —— 與 CPU 那一支挑金字塔層級的判準是同一條式子（鐵律 7）。 */
  float wpp=2.0*z/uBuf.x;
  float lod=max(log2(max(tpw*wpp*${CITY_LOD_K}, 1e-6)), 0.0);
  vec4 c=textureLod(tex, vec2(u,v), lod);
  if(c.a<=0.02) return vec4(0.0);
  float lum=dot(c.rgb, vec3(0.299,0.587,0.114));
  c.rgb=(vec3(lum)+(c.rgb-vec3(lum))*uInvS)*P1.z;
  return c;
}
ivec2 clampT(ivec2 t){ return clamp(t, ivec2(0), ivec2(uMap)-1); }

void main(){
  float px=gl_FragCoord.x, py=uBuf.y-gl_FragCoord.y;   // GL 原點在左下，畫面是左上
  float sv=(px+0.5)/uBuf.x*2.0-1.0;
  float scaleH=uBuf.y*0.62, horizon=uBuf.y*${HORIZON_F};
  float sinp=uDir.x, cosp=uDir.y;
  vec2 dir=vec2(sv*cosp - sinp, -sv*sinp - cosp);
  float curv=(1.0+sv*sv)/(2.0*${PLANET_R}.0);
  float k2=(py-horizon)/scaleH;         // (camAlt-h)/z + z*curv
  float k=k2;                           // （k 在下面的區塊裡會被 vec3 遮蔽，所以留一份 k2）
  float z=1.0, dz=0.75;
  for(int i=0;i<900;i++){
    if(z>=${ZFAR}.0) break;
    float hNeed=uCam.z-(k-z*curv)*z;
    vec2 wp=uCam.xy+dir*z;
    vec2 mf=wp*${INV_SCALE};
    ivec2 ti=ivec2(floor(mf));
    bool outside = mf.x<0.0||mf.y<0.0||mf.x>=uMap.x||mf.y>=uMap.y;
    /* ══⚠⚠⚠ 打不到就別走了（ver -1302，效能分配）════════════════════════
       hNeed ＝這一步射線所在的高度。地形的最高點是 uMaxH，所以 hNeed 大於它時
       這一步不可能命中；而 hNeed 對 z 的斜率是 -k + 2*curv*z，
       **斜率為正就代表它只會越爬越高** ⇒ 往後每一步也都打不到。
       兩者同時成立就可以直接跳出，最後輸出的天空色與 gl_FragDepth=1.0
       **與跑完 900 步一模一樣**（位元等價，不是近似）。

       ⚠⚠ **為什麼非修不可**：ZFAR 3600，而步進序列（z=1、dz=0.75、每步 +0.0062）
         跑滿 **900 步只走到 z 約 3184** —— 迴圈是被**迭代上限**擋掉的，不是被 ZFAR。
         於是**每一個天空像素都把 900 步跑好跑滿**，每一步取樣一次高度貼圖。
         實測地形最高 520、巡航高度 700：**任何往上打的射線從第一步就注定
         打不到，卻照樣走 900 步。**
       ⚠⚠ 這是「把飛行地圖整個搬上 GPU」（ver -1198~-1223）漏掉的那一塊：
         CPU 那一版是**逐欄**跑的，ybuf 的地平線追蹤天然就會提早收手；
         改成**逐像素**之後每條射線各走各的，那個提早結束沒有人補回來。
       ⚠ 這不是降畫質、也不是改演算法 —— 是把「證明打不到之後還在走」的那一段砍掉。
       ⚠⚠ 這一段在 GLSL 的樣板字串裡，**註解不可以有反引號**（憲法記的第七次，
         我是第八次 —— 寫註解時順手用反引號括變數名就會炸）。 */
    if(hNeed>uMaxH && (2.0*curv*z - k)>0.0) break;
    /* ══⚠⚠⚠ 階層跳空（ver -1303）════════════════════════════════════════
       由粗到細問 max-mipmap：這一塊的最高點都在射線之下 ⇒ 整塊跳過。

       ⚠⚠ **跳的距離是「整數個原本的步」**，不是任意距離 —— 這是位元等價的關鍵。
         原序列是 z+=dz、dz+=0.0062；跳 kk 步之後
           z  += dz*kk + 0.0031*kk*(kk-1)
           dz += 0.0062*kk
         射線因此**永遠落在原本會取樣的那些 z 上**，第一個命中的點一模一樣。
         跳任意距離的話取樣點會偏移，命中的 z 就變了，畫面不會等價。
       ⚠⚠ **安全距離用 DDA 算，不要用「一格的寬度」去猜**：dir 沒有正規化
         （|dir| 最大約 2.6），拿格寬當距離會一口氣跨過兩三格 ⇒ 跳過地形、畫面破洞。
         這裡算的是「沿著射線還有多遠才離開**這一塊**」，那是精確值。
       ⚠⚠ **hNeed 在區間內不是單調的**：往下看的射線它先降後升（頂點在
         z=k/(2*curv)）。所以要取區間內的**最小值**來比 —— 只看起點會漏掉
         中間那一段比較低的地方。
       ⚠ 由粗到細：命中前的空曠地帶粗階就過了（一次跳很遠），逼近地形時
         粗階擋下來、換細階，自然收斂。 */
    {
      vec2 dm = dir*${INV_SCALE};                 // 每單位 z 在地圖上走幾格
      bool jumped=false;
      for(int L=7; L>=1; L--){
        if(L>uMaxLod) continue;
        float cs = exp2(float(L));                // 這一階一格涵蓋幾個地圖格
        /* 沿射線離開這一塊還有多遠（DDA，取兩軸的較小值）。 */
        vec2 lo = floor(mf/cs)*cs;
        /* GLSL 不能用 < 比較向量（那會是編譯錯誤，而編譯錯誤就是悄悄退回 CPU）。 */
        vec2 sd = vec2(abs(dm.x)<1e-6 ? 1e-6 : dm.x, abs(dm.y)<1e-6 ? 1e-6 : dm.y);
        vec2 tv = (mix(lo, lo+cs, step(0.0, dm)) - mf) / sd;
        float adv = min(tv.x, tv.y);
        if(!(adv>0.0)) continue;
        /* 換算成「幾個原步」：0.0031*kk^2 + (dz-0.0031)*kk = adv */
        float bq = dz - 0.0031;
        float kk = floor((-bq + sqrt(max(bq*bq + 4.0*0.0031*adv, 0.0))) / (2.0*0.0031));
        if(kk < 1.0) continue;
        float zAdv = dz*kk + 0.0031*kk*(kk-1.0);
        float z2 = z + zAdv;
        /* 區間內 hNeed 的最小值（頂點落在區間內就取頂點）。 */
        float zv = clamp(k/(2.0*curv), z, z2);
        float hMin = min(min(uCam.z-(k-z*curv)*z, uCam.z-(k-z2*curv)*z2),
                         uCam.z-(k-zv*curv)*zv);
        float blk = texelFetch(uHmax, ivec2(mf)>>L, L).r;
        if(blk < hMin){ z=z2; dz+=0.0062*kk; jumped=true; break; }
      }
      if(jumped) continue;
    }
    bool cloud; float hs=hSurf(mf, ti, outside, cloud);
    if(hs>=hNeed){
      /* 霧提前算 —— 崖面那一段要用它當閘門（同 CPU 的 fog<0.86）。 */
      float fogS=${ZFAR}.0*${FOG_START};
      float fog=clamp((z-fogS)/(${ZFAR}.0-fogS),0.0,1.0)*${FOG_MAX};
      vec3 c;
      /* ⚠ below 兩支都要有（雲海的天際線一樣要抗鋸齒）—— 所以提到外面宣告。 */
      float below=hs-hNeed;
      /* 上一個射線步進落在哪一格的地面：立面的落差與地貌貼圖的縱向足跡都要它。
         算一次就好（鐵律 7）—— 原本只有立面那一段在算。 */
      vec2 mfP=(uCam.xy+dir*max(z-dz,1.0))*${INV_SCALE};
      bool cP; float hPrev=hSurf(mfP, clampT(ivec2(floor(mfP))),
                                 mfP.x<0.0||mfP.y<0.0||mfP.x>=uMap.x||mfP.y>=uMap.y, cP);
      if(cloud){
        c=vec3(0.82,0.86,0.92)*uCloudLit;
      }else{
        /* 雙線性：⚠ 只在「四角都是陸地」時才內插 —— 靠海岸時鄰格是雲海高度，
           內插會把大陸邊緣拉成緩坡，斷崖就沒了（舊路徑同一條守門）。 */
        /* ⚠ 內插要錨在**格心**（ver -1217）：texel i 的中心在 mf=i+0.5，
             所以四個角要從 floor(mf-0.5) 起算。原本用 floor(mf) 等於把格值錨在
             格角上 —— 顏色會與高度差半格，而且在格心取到的是四格的混色。 */
        vec2 pc=mf-0.5; ivec2 tc=ivec2(floor(pc));
        ivec2 t00=clampT(tc), t10=clampT(tc+ivec2(1,0)),
              t01=clampT(tc+ivec2(0,1)), t11=clampT(tc+ivec2(1,1));
        float h10=hRaw(t10), h01=hRaw(t01), h11=hRaw(t11);
        vec2 f=pc-floor(pc);
        vec3 c00=texelFetch(uC,t00,0).rgb;
        if(hRaw(t00)>${CLOUD_H}.0 && h10>${CLOUD_H}.0 && h01>${CLOUD_H}.0 && h11>${CLOUD_H}.0){
          vec3 c10=texelFetch(uC,t10,0).rgb, c01=texelFetch(uC,t01,0).rgb, c11=texelFetch(uC,t11,0).rgb;
          c=mix(mix(c00,c10,f.x), mix(c01,c11,f.x), f.y);
        }else{ c=c00; }
        /* ══ 地貌貼圖層（ver -1208）══════════════════════════════════════
           與 CPU 那一支同一條邏輯：先把底色推向人造物的絕對色（石橋／鐵路／
           道路／屋頂）或水色，再乘上貼圖的「相對均值倍率」與低頻亮度起伏。
           ⚠ 乘而不換：底色帶著地貌形狀與烘焙好的 hillshade，直接換色會把山攤平。
           ⚠ 強度隨深度淡出（GEO_FAR 之後歸零）——遠景看不出紋理，省下來。 */
        float vegAmt=${GEO_AMP}*(z<${GEO_FAR}.0 ? 1.0-(z/${GEO_FAR}.0)*(z/${GEO_FAR}.0) : 0.0);
        /* 雪地壓掉植被貼圖（ver -1220）：底色已經漂白（雪烘在 COL 裡），
           再乘森林的紋理就會被乘回褐綠。⚠ 留一成，雪下面的樹梢還看得出來。 */
        vegAmt *= 1.0 - 0.88*texture(uSnow, mf/uMap).r;
        if(uGeoOn>0.5 && vegAmt>0.004){
          uint bi=texelFetch(uBiome,clampT(ti),0).r;
          uint tx=bi&15u;
          vec4 mk=texelFetch(uMask,clampT(ti),0);
          if(mk.r*255.0>40.0)        c=mix(c, vec3(138.,128.,114.)/255.0, mk.r*0.94);
          else if(tx==8u||tx==9u)    c=mix(c, (tx==9u? vec3(92.,126.,146.) : vec3(66.,100.,124.))/255.0, 0.72);
          else if(mk.g*255.0>40.0)   c=mix(c, vec3(139.,121.,101.)/255.0, mk.g*0.90);
          else if(tx==5u)            c=mix(c, vec3(135.,109.,72.)/255.0, mk.b*0.82);
          else if(tx>=10u && tx<=12u){
            vec3 rc = tx==10u? vec3(80.,76.,69.) : (tx==11u? vec3(93.,86.,66.) : vec3(102.,91.,61.));
            c=mix(c, rc/255.0, mk.a*0.55+0.30);
          }
          /* 取樣座標。⚠ 鐵軌要轉進**軌道座標系**：沿軌方向由 RAILDIR 的角度投影，
             橫越方向由 RAILW 的距離場反推（中心 255、邊緣 0）。 */
          vec2 gxy;
          float dq = (tx==13u) ? texture(uRailDir, (floor(mf)/${'6.0'})/uRD).r*255.0 : 0.0;
          if(tx==13u && dq>0.5){
            float th=(dq-1.0)/254.0*3.14159265;
            float along=(wp.x*cos(th)+wp.y*sin(th))*${'1.0/0.60'};
            float across=128.0+127.0*(1.0-mk.g);
            gxy=vec2(along+40960.0, across);
          }else{
            gxy=(wp+vec2(40960.0))*${'1.0/1.6'};
          }
          /* 這個像素在貼圖上的足跡（texel 為單位），兩軸各算一次：
             · 橫向：一欄在這個深度覆蓋 2z/BW 個世界單位
             · 縱向：一列覆蓋 (z/scaleH)/(地表沿射線的坡度 ＋ 射線自己的下降率)
               —— 分母趨近 0 就是「面幾乎與視線平行」，也就是 Ray 說的立面陡坡，
               足跡會爆開，正是那裡條紋最兇。
             ⚠ raymarch 裡**不可以**讓硬體用導數去挑層級（相鄰像素的深度可以差很遠，
               導數是垃圾）—— 與城的插畫同一條教訓（ver -1211）。 */
          float rr=abs(k2-2.0*z*curv);
          float gg=(hs-hPrev)/max(dz,0.001);
          float fpx=(2.0*z/uBuf.x)*${'1.0/1.6'};
          float fpy=(z/scaleH)/max(gg+rr,0.02)*${'1.0/1.6'};
          float glod=max(0.5*log2(max(fpx*fpx, fpy*fpy))+${GEO_LOD_BIAS}, 0.0);
          vec3 k=textureLod(uGeo, vec3(gxy/256.0, float(tx)), glod).rgb*(255.0/128.0);
          /* ⚠ 低頻亮度起伏**一定要內插**（ver -1217，Ray：「靠近山體時還是會露出方塊粒」）。
             它是逐格 ±18% 的亮度乘數 —— 逐格取的話，地形幾何再平滑，表面照樣是
             一格一格的亮暗方塊。BIOME 是 R8UI（整數貼圖濾不了），所以把高 4 bit
             抽成單獨一張 R8 + LINEAR。 */
          float mot=1.0+(texture(uMot, mf/uMap).r-0.5)*2.0*${GEO_MOT}*vegAmt;
          c*=(vec3(1.0)+(k-vec3(1.0))*vegAmt)*mot;
        }
        /* 城的手繪地面：蓋掉地貌色，**在光照之前** —— 日夜與霧才會照地形走
           （§6.7.5：插在地貌細節之後、光照之前）。 */
        vec4 ca=citySample(uCityA,uCityA0,uCityA1,uCityT.x,wp,z);
        if(ca.a>0.0) c=mix(c,ca.rgb,ca.a);
        vec4 cb2=citySample(uCityB,uCityB0,uCityB1,uCityT.y,wp,z);
        if(cb2.a>0.0) c=mix(c,cb2.rgb,cb2.a);
        /* ══ 崖面（ver -1209）══════════════════════════════════════════
           CPU 那一支是 span 演算法：畫完頂面之後往下補一條立面（§6.8.1 的
           「崖面是 span 演算法」就是指它）。逐像素的作法不同但更直接：
           **這一點在方塊頂面之下多深**（hs − hNeed）就是它在立面上的位置。
           ⚠ 落差由「上一個射線步進落在哪一格」反推（多一次 texelFetch，很便宜）
             —— 為什麼一定要是「一步」而不是「一格地圖」，見下面那一段。 */
        bool cliffDone=false;
        /* ⚠⚠⚠ 落差要量「相對**上一個射線步進**」（＝CPU 的 hh−prevH），
           不可以量「相對一格地圖」（ver -1211，Ray：「山都變顆粒狀的了」）。

          vec2 mf2=(uCam.xy+dir*z2)*${INV_SCALE};

          bool c2; float s2=hSurf(mf2, clampT(ivec2(floor(mf2))), o2, c2);

       在 z≈1000 時一步由 4.8 個世界單位降到 3.0 —— 崖腳被步長切出的鋸齒
       （相鄰兩欄的最大落差）由 11 降到 7 個緩衝像素，實測 fps 不變（60）。
       ⚠ CPU 那一支**刻意不跟**，理由見那邊的註解。 */
    z+=dz; dz+=0.0062;
  }
  o=vec4(texelFetch(uSky, ivec2(0, int(py)), 0).rgb, 1.0);
  gl_FragDepth=1.0;
}`;

  for(const n of ['uH','uHs','uC','uS','uSky','uMap','uBuf','uCam','uDir','uLdir','uLcol','uLi','uFog','uCloudLit','uTime',
                  'uCityA','uCityB','uCityA0','uCityB0','uCityA1','uCityB1','uCityT','uInvS',
                  'uBiome','uMask','uGeo','uRailDir','uRD','uGeoOn','uMot','uSnow','uMaxH','uHmax','uMaxLod'])
    glU[n]=g.getUniformLocation(glProg,n);
  g.uniform1i(glU.uH,0); g.uniform1i(glU.uHs,11); g.uniform1i(glU.uC,1); g.uniform1i(glU.uS,2); g.uniform1i(glU.uSky,3);
  g.uniform1i(glU.uCityA,4); g.uniform1i(glU.uCityB,5);
  g.uniform1f(glU.uInvS, 1/GRADE_SAT);
  g.uniform1i(glU.uBiome,7); g.uniform1i(glU.uMask,8); g.uniform1i(glU.uMot,12);
  g.uniform1i(glU.uSnow,13);
  g.uniform1i(glU.uGeo,9);   g.uniform1i(glU.uRailDir,10);
  return true;
}

/* 世界資料上傳（loadWorld 跑完才叫，⚠ 用處理過的陣列）。 */
function glUploadWorld(){
  if(!GLX) return;
  const g=GLX;
  const mk=(unit)=>{ const t=g.createTexture(); g.activeTexture(g.TEXTURE0+unit);
    g.bindTexture(g.TEXTURE_2D,t);
    g.texParameteri(g.TEXTURE_2D,g.TEXTURE_MIN_FILTER,g.NEAREST);
    g.texParameteri(g.TEXTURE_2D,g.TEXTURE_MAG_FILTER,g.NEAREST);
    g.texParameteri(g.TEXTURE_2D,g.TEXTURE_WRAP_S,g.CLAMP_TO_EDGE);
    g.texParameteri(g.TEXTURE_2D,g.TEXTURE_WRAP_T,g.CLAMP_TO_EDGE); return t; };
  glTexH=mk(0);
  g.texImage2D(g.TEXTURE_2D,0,g.R16UI,MAPW,MAPH,0,g.RED_INTEGER,g.UNSIGNED_SHORT,HGT);
  /* 平滑高度（ver -1216）：同一份 HGT，改存成 R16F 並開 LINEAR ——
     行進迴圈就只要一次 texture() 就拿到雙線性內插好的高度（取樣器免費做）。
     ⚠ 傳 Float32Array、internalformat 給 R16F：GPU 存的是 2 bytes/texel
       （＝與 R16UI 同大小，2152×1200 約 4.9MB），暫時的 Float32 只是上傳緩衝。
     ⚠ MIN/MAG 都要 LINEAR；WRAP 照舊 CLAMP（地圖外由 outside 那一支擋掉）。 */
  { const hf=new Float32Array(MAPW*MAPH);
    /* ⚠⚠ 海那一半填的是**海面高度**不是 0（ver -1239）：`hSurf` 現在直接回這張圖的值
       （不再對海回常數 `CLOUD_H`），靠岸那一圈因此是往下凹的槽 ＝ 大陸的厚度。
       ⚠ 沒有 `SEASURF`（極早期／CPU-only）就退回 `CLOUD_H`，行為與 -1238 相同。 */
    let maxH=0;
    for(let i=0,n=hf.length;i<n;i++){
      const v = HGT[i]>CLOUD_H ? HGT[i] : (SEASURF?SEASURF[i]:CLOUD_H);
      hf[i]=v; if(v>maxH) maxH=v;
    }
    /* ⚠ 射線的提早結束要用**這張圖自己的**最大值（鐵律 7：不要另外去量 HGT ——
       海的那一半填的是 SEASURF，兩者不同）。留 1% 餘裕給 R16F 的量化誤差。 */
    TERR_MAXH = maxH*1.01 + 1;
    g.uniform1f(glU.uMaxH, TERR_MAXH);
    /* ══⚠⚠⚠ 跳空用的 max-mipmap（ver -1303）══════════════════════════════
       每一階存**子格的最大值**（不是平均）。射線行進時先問粗的那一階：
       整塊的最高點都在射線之下 ⇒ **那一塊不可能被打到，整塊跳過**。
       ⚠⚠ 這是「不變的輸出、少一個數量級的工作」：跳掉的是**證明打不到**的區間。
       實測（JS 端用同一份資料模擬，保守版）：每像素讀取 **277 → 35 次**，
       全畫面 3740 萬 → 471 萬 ⇒ **7.9 倍**。額外貼圖 6.6 MB、建表 135ms（一次性）。
       ⚠ **一定要 NEAREST**：mipmap 的語意在這裡是「這一塊的最大值」，
         線性內插會把相鄰塊混進來 ⇒ 混出比真實最大值**低**的數，那就會跳過地形
         （畫面破洞）。MIN 用 `NEAREST_MIPMAP_NEAREST`，shader 走 `texelFetch` 指定階。
       ⚠ 逐階自己算、自己上傳，**不要用 `generateMipmap`** —— 那一支做的是
         「平均」（box filter），在這裡是錯的答案。 */
    /* ⚠⚠⚠ **底階要先做 3×3 膨脹**（ver -1303，實測抓到的 bug）：
       `hSurf` 是**雙線性**取樣，它讀的是 `mf-0.5` 周圍那四個 texel ——
       其中可能有一個落在**隔壁格**裡。只取「這一格的最大值」涵蓋不到那個鄰居，
       於是偶爾會跳過真的打得到的地形（實測某個機位差 337 個通道、最大 28）。
       把底階換成「周圍九格的最大值」之後，每一階的方塊就涵蓋了
       **自己 ＋ 一圈邊界**，雙線性的取樣足跡一定被包住。
       ⚠ 這只影響**跳空用**的那張貼圖；真正取樣高度的 `uHs` 一個位元都沒動。 */
    const hd=new Float32Array(MAPW*MAPH);
    for(let y=0;y<MAPH;y++){
      const y0=y>0?y-1:0, y1=y<MAPH-1?y+1:MAPH-1;
      for(let x=0;x<MAPW;x++){
        const x0=x>0?x-1:0, x1=x<MAPW-1?x+1:MAPW-1;
        let m=hf[y*MAPW+x];
        const rows=[y0*MAPW, y*MAPW, y1*MAPW], cols=[x0,x,x1];
        for(let r=0;r<3;r++) for(let c=0;c<3;c++){ const v=hf[rows[r]+cols[c]]; if(v>m) m=v; }
        hd[y*MAPW+x]=m;
      }
    }
    let lw=MAPW, lh=MAPH, prev=hd;
    glTexHmax=g.createTexture(); g.activeTexture(g.TEXTURE0+14);
    g.bindTexture(g.TEXTURE_2D,glTexHmax);
    g.texImage2D(g.TEXTURE_2D,0,g.R16F,lw,lh,0,g.RED,g.FLOAT,prev);
    TERR_MAXLOD=0;
    for(let L=1; L<=7 && lw>1 && lh>1; L++){
      const w=Math.max(1,lw>>1), h=Math.max(1,lh>>1), cur=new Float32Array(w*h);
      for(let y=0;y<h;y++){
        const y0=y<<1, y1=Math.min(y0+1,lh-1);
        for(let x=0;x<w;x++){
          const x0=x<<1, x1=Math.min(x0+1,lw-1);
          const a=prev[y0*lw+x0], b=prev[y0*lw+x1], c=prev[y1*lw+x0], d=prev[y1*lw+x1];
          cur[y*w+x] = Math.max(Math.max(a,b), Math.max(c,d));
        }
      }
      g.texImage2D(g.TEXTURE_2D,L,g.R16F,w,h,0,g.RED,g.FLOAT,cur);
      prev=cur; lw=w; lh=h; TERR_MAXLOD=L;
    }
    g.texParameteri(g.TEXTURE_2D,g.TEXTURE_MIN_FILTER,g.NEAREST_MIPMAP_NEAREST);
    g.texParameteri(g.TEXTURE_2D,g.TEXTURE_MAG_FILTER,g.NEAREST);
    g.texParameteri(g.TEXTURE_2D,g.TEXTURE_WRAP_S,g.CLAMP_TO_EDGE);
    g.texParameteri(g.TEXTURE_2D,g.TEXTURE_WRAP_T,g.CLAMP_TO_EDGE);
    g.texParameteri(g.TEXTURE_2D,g.TEXTURE_BASE_LEVEL,0);
    g.texParameteri(g.TEXTURE_2D,g.TEXTURE_MAX_LEVEL,TERR_MAXLOD);
    g.useProgram(glProg);
    /* ⚠⚠⚠ **unit 14 從這一刻起屬於地形，任何人都不准借**（ver -1310 的教訓）：
       它是「上傳一次、之後每禎都假設它還在那裡」的長期綁定，而 texture unit 是
       **全域狀態、跨 program 共用** —— 被借走一次，地形的跳空就會拿別人的貼圖
       當高度用，畫面撕裂而且**沒有任何錯誤訊息**。要臨時綁貼圖請用 6／15
       （那一族是「畫之前自己綁」的，見 glRuinTexture 的檔頭）。 */
    g.uniform1i(glU.uHmax,14);
    g.uniform1i(glU.uMaxLod,TERR_MAXLOD);
    console.log('[gl] 跳空 max-mipmap '+(TERR_MAXLOD+1)+' 階，最高點 '+TERR_MAXH.toFixed(0));
    glTexHs=g.createTexture(); g.activeTexture(g.TEXTURE0+11);
    g.bindTexture(g.TEXTURE_2D,glTexHs);
    g.texImage2D(g.TEXTURE_2D,0,g.R16F,MAPW,MAPH,0,g.RED,g.FLOAT,hf);
    g.texParameteri(g.TEXTURE_2D,g.TEXTURE_MIN_FILTER,g.LINEAR);
    g.texParameteri(g.TEXTURE_2D,g.TEXTURE_MAG_FILTER,g.LINEAR);
    g.texParameteri(g.TEXTURE_2D,g.TEXTURE_WRAP_S,g.CLAMP_TO_EDGE);
    g.texParameteri(g.TEXTURE_2D,g.TEXTURE_WRAP_T,g.CLAMP_TO_EDGE); }
  SEASURF=null;                     // 用完就放掉（5MB）
  glTexC=mk(1);
  g.texImage2D(g.TEXTURE_2D,0,g.RGBA8,MAPW,MAPH,0,g.RGBA,g.UNSIGNED_BYTE,
               new Uint8Array(COL.buffer,COL.byteOffset,COL.byteLength));
  /* 坡度：Int8 兩張併成 RG8（+128 偏移，shader 那邊減回來）。 */
  const sl=new Uint8Array(MAPW*MAPH*2);
  for(let i=0,n=MAPW*MAPH;i<n;i++){ sl[i*2]=SLX[i]+128; sl[i*2+1]=SLY[i]+128; }
  glTexS=mk(2);
  g.texImage2D(g.TEXTURE_2D,0,g.RG8,MAPW,MAPH,0,g.RG,g.UNSIGNED_BYTE,sl);
  /* ⚠ 坡度要 LINEAR（ver -1217）：逐格取＝逐格一個固定的明暗，靠近山體就是方格。 */
  g.texParameteri(g.TEXTURE_2D,g.TEXTURE_MIN_FILTER,g.LINEAR);
  g.texParameteri(g.TEXTURE_2D,g.TEXTURE_MAG_FILTER,g.LINEAR);
  glTexSky=mk(3);
  /* ══ 地貌貼圖層的資料（ver -1208）══════════════════════════════════════
     ⚠ 四張遮罩**打包成一張 RGBA8**（railbr / railw / roadw / subw）——
       分四張要四次 texelFetch，打包只要一次，而且省三份貼圖描述子。 */
  glTexBiome=mk(7);
  g.texImage2D(g.TEXTURE_2D,0,g.R8UI,MAPW,MAPH,0,g.RED_INTEGER,g.UNSIGNED_BYTE,BIOME);
  /* 低頻亮度起伏：BIOME 的高 4 bit 抽成單獨一張 R8＋LINEAR（ver -1217）。
     ⚠ 為什麼不能直接從 BIOME 取：它是 R8UI，**整數貼圖不可濾**。
       而這一項是逐格 ±18% 的亮度乘數 —— 不內插的話幾何再平滑，
       表面照樣是一格一格的亮暗方塊。 */
  if(SNOW){
    glTexSnow=mk(13);
    g.texImage2D(g.TEXTURE_2D,0,g.R8,MAPW,MAPH,0,g.RED,g.UNSIGNED_BYTE,SNOW);
    g.texParameteri(g.TEXTURE_2D,g.TEXTURE_MIN_FILTER,g.LINEAR);
    g.texParameteri(g.TEXTURE_2D,g.TEXTURE_MAG_FILTER,g.LINEAR);
  }
  { const mo=new Uint8Array(MAPW*MAPH);
    for(let i=0,n=mo.length;i<n;i++) mo[i]=((BIOME[i]>>4)*17);   // 0..15 → 0..255
    glTexMot=mk(12);
    g.texImage2D(g.TEXTURE_2D,0,g.R8,MAPW,MAPH,0,g.RED,g.UNSIGNED_BYTE,mo);
    g.texParameteri(g.TEXTURE_2D,g.TEXTURE_MIN_FILTER,g.LINEAR);
    g.texParameteri(g.TEXTURE_2D,g.TEXTURE_MAG_FILTER,g.LINEAR); }
  { const N=MAPW*MAPH, m=new Uint8Array(N*4);
    for(let i=0;i<N;i++){
      m[i*4]  = RAILBR?RAILBR[i]:0;
      m[i*4+1]= RAILW ?RAILW[i] :0;
      m[i*4+2]= ROADW ?ROADW[i] :0;
      m[i*4+3]= SUBW  ?SUBW[i]  :0;
    }
    glTexMask=mk(8);
    g.texImage2D(g.TEXTURE_2D,0,g.RGBA8,MAPW,MAPH,0,g.RGBA,g.UNSIGNED_BYTE,m);
    console.log('[gl] 地貌遮罩 '+(m.byteLength/1048576).toFixed(1)+'MB');
  }
  if(RAILDIR){ glTexRail=mk(10);
    g.texImage2D(g.TEXTURE_2D,0,g.R8,RD_W,RD_H,0,g.RED,g.UNSIGNED_BYTE,RAILDIR); }
  glReady=true;
  console.log('[gl] 世界資料已上傳：'+MAPW+'×'+MAPH+
    '（高度 '+(HGT.byteLength/1048576).toFixed(1)+'MB、色 '+(COL.byteLength/1048576).toFixed(1)+
    'MB、坡度 '+(sl.byteLength/1048576).toFixed(1)+'MB）');
}

/* ══ 城的手繪地面：上傳成貼圖（ver -1206）══════════════════════════════
   ⚠ GL 的 mipmap 取代 `CITY_PYR` 那一整套逐次減半的金字塔與逐深度挑層級
     （§6.7.5）—— 硬體本來就會做，而且做得比較好。
   ⚠ 用**全解析**那一張（`cityPlanArt`）；還沒載到就先用 192px 縮圖，
     載到之後換上（同舊路徑「永遠有得取樣、不存在空窗」的保證）。 */
const glCityTex={}, glCityFull={};
/* ══⚠⚠⚠ 上傳一定要走 ImageBitmap，不要直接餵 HTMLImageElement（ver -1306）══
   實測（東方泊地 1024x1024、GT 1030、`g.finish()` 逼它做完）：

     texImage2D ← HTMLImageElement   78.5ms 首次 / **36.7ms 熱快取**
     texImage2D ← ImageBitmap        **2.4ms**（15 倍）
     generateMipmap                  **0ms**（硬體全免費，不是它的錯）

   貴的是**主執行緒把圖轉成貼圖格式**那一段，而且它每次都要做一遍 ——
   熱快取一樣貴，所以「載過了就便宜」的直覺在這裡是錯的。
   `createImageBitmap` 把那一段搬去主執行緒外（實測 41ms，但在 await 裡，
   不卡幀），上傳只剩一次記憶體搬運。

   ⚠ `glCityTexture` 是**在畫的迴圈裡同步呼叫**的，所以不能等 ——
     作法是「排解碼、這一幀先用手上有的」：
       已經有貼圖 → 先頂著（多半是縮圖那一版），bitmap 好了下一幀才換上
       完全沒有   → 同步上傳縮圖（192px 約 1ms）
     那就是 §6.7.5「永遠有得取樣、不存在空窗」那條保證，只是多了一階。
   ⚠ 上傳完就 `close()`：ImageBitmap 抱著解碼後的點陣（1024² ＝ 4MB），
     留著等於 -1195／-1304 白放。要重傳時再解一次就好（那時本來就不趕）。 */
const glCityBM={}, glCityBMWait={};
function glCityUpload(key, src, wantFull){
  const g=GLX;
  let t=glCityTex[key];
  if(!t){ t=g.createTexture(); glCityTex[key]=t; }
  g.activeTexture(g.TEXTURE4); g.bindTexture(g.TEXTURE_2D,t);
  g.texImage2D(g.TEXTURE_2D,0,g.RGBA8,g.RGBA,g.UNSIGNED_BYTE,src);
  g.generateMipmap(g.TEXTURE_2D);
  g.texParameteri(g.TEXTURE_2D,g.TEXTURE_MIN_FILTER,g.LINEAR_MIPMAP_LINEAR);
  g.texParameteri(g.TEXTURE_2D,g.TEXTURE_MAG_FILTER,g.LINEAR);
  g.texParameteri(g.TEXTURE_2D,g.TEXTURE_WRAP_S,g.CLAMP_TO_EDGE);
  g.texParameteri(g.TEXTURE_2D,g.TEXTURE_WRAP_T,g.CLAMP_TO_EDGE);
  glCityFull[key]=wantFull;
  return t;
}
function glCityTexture(key){
  if(!GLX) return null;
  const full=cityPlanArt[key], lo=cityPlanLo[key];
  const img=full||lo;
  if(!img || !img.width) return null;
  const wantFull=!!full;
  if(glCityTex[key] && glCityFull[key]===wantFull) return glCityTex[key];

  /* 解碼好了就換上（2.4ms） */
  const B=glCityBM[key];
  if(B && B.full===wantFull){
    delete glCityBM[key];
    try{ const t=glCityUpload(key, B.bm, wantFull); B.bm.close && B.bm.close(); return t; }
    catch(_){ B.bm.close && B.bm.close(); }
  }
  /* 還沒好 → 排一次解碼（同一張只排一次）。
     ⚠⚠⚠ **一定要從 Blob 建，不可以從 `<img>` 建**（ver -1306 實測，733x1536）：

       createImageBitmap(HTMLImageElement)   同步段 **70.2ms**（整段都是同步的！）
       createImageBitmap(Blob)               同步段 **0.1ms**、總計 32.3ms（主執行緒外）

     從 `<img>` 那一支根本沒有非同步可言 —— 它回傳的是一個「已經做完」的
     promise，主執行緒該卡的一分都沒少。改走 Blob 才真的搬得出去。
     ⚠ `fetch(img.src)` 打的是 HTTP 快取（圖早就載過了），實測 3.3ms。 */
  if(!glCityBMWait[key] && typeof createImageBitmap==='function' && img.src){
    glCityBMWait[key]=true;
    fetch(img.src).then(r=>r.blob()).then(b=>createImageBitmap(b))
      .then(bm=>{ if(glCityBM[key]) { try{ glCityBM[key].bm.close(); }catch(_){} }
                  glCityBM[key]={ bm, full:wantFull }; })
      .catch(()=>{})
      .then(()=>{ glCityBMWait[key]=false; });
  }
  /* 這一幀先用手上有的 */
  if(glCityTex[key]) return glCityTex[key];
  if(typeof createImageBitmap!=='function') return glCityUpload(key, img, wantFull); // 老瀏覽器退路
  if(lo) return glCityUpload(key, lo, false);        // 192px，約 1ms
  return null;
}
/* ⚠⚠ 走遠了要把貼圖也刪掉（ver -1304）。`releaseFarCityArt` 原本只放掉 CPU 那一半
   （`cityPlanArt`／`CITY_PYR`），而 GL 這一份是**另一塊記憶體（VRAM）**，沒有人動它。
   ⚠ 而且它永遠等不到自己被重建：`RELEASE_R`(14400) 遠大於 `ZFAR`(3600)，
     被放掉的城**再也不會被 `glPickCities` 選到** ⇒ `glCityTexture` 不再呼叫 ⇒
     那張全解析＋mipmap 就抱到分頁關掉為止。實測十座城走一遍 **25.8 MB**
     （拉芬一座 7.4MB、東泊 5.3MB）—— 2GB 的卡還好，內顯與手機是共用系統記憶體。
   ⚠ 刪了不會有空窗：下次飛近時 `glCityTexture` 依 `cityPlanArt||cityPlanLo` 重建
     （而且本來就要重建 —— `glCityFull` 那個守門在全解析被放掉之後必然不相等）。 */
function releaseCityTexture(key){
  const t=glCityTex[key];
  if(t && GLX) { try{ GLX.deleteTexture(t); }catch(_){} }
  delete glCityTex[key]; delete glCityFull[key];
  const B=glCityBM[key];                      // ⚠ 還沒用掉的 bitmap 也是解碼後的點陣（ver -1306）
  if(B){ try{ B.bm.close(); }catch(_){} delete glCityBM[key]; }
}
/* 這一禎要畫哪兩座城：取最近的兩座（CITYMASK 保證同一點最多屬於一座城，
   而城之間隔得夠遠，兩個槽實務上夠用）。 */
function glPickCities(){
  if(!CITY_SAMPS) return [];
  const L=[];
  for(const C of CITY_SAMPS){
    const dx=C.wx-cam.x, dy=C.wy-cam.y;
    const d=Math.hypot(dx,dy);
    if(d>ZFAR+C.planW) continue;
    L.push({C,d});
  }
  L.sort((a,b)=>a.d-b.d);
  return L.slice(0,2).map(e=>e.C);
}

/* 每禎：把這一禎的相機／光照／天空交給 shader 畫一次。 */
function glDrawTerrain(S, sinp, cosp, lx, ly, ambI, sunI, lightR, lightG, lightB,
                       fr, fg, fb, cloudLit){
  if(!glReady) return false;
  const g=GLX, cvg=document.getElementById('glcv');
  if(cvg.width!==BW || cvg.height!==BH){ cvg.width=BW; cvg.height=BH; }
  cvg.style.height=VIEWH+'px';
  g.viewport(0,0,BW,BH);
  /* 天空：直接把 CPU 這一禎算好的 SKYROW 上傳成 1×BH 的貼圖 ——
     漸層與抖色的配方留在一處（鐵律 7），shader 不自己再算一份。 */
  if(!glSkyBuf || glSkyBuf.length!==BH*4) glSkyBuf=new Uint8Array(BH*4);
  for(let y=0;y<BH;y++){ const c=SKYROW[y]|0;

in vec2 nrm;        // 側面法線（頂面給 0,0）
in float kind;      // 0 牆側 1 屋頂側 2 牆頂 3 屋頂面 4 明指顏色

uniform vec3 uOrigin;   // 這座遺蹟的世界落點 (wx0, wy0, gh)

const GL_RUIN_FS=`#version 300 es
precision highp float;
in vec3 vCol; in float vZ;
in vec2 vUV; in float vRoof; in float vTexOn;

uniform sampler2D uTexW, uTexR;
uniform float uTexOn;          // 那一座有沒有貼材（0＝沒有，照舊平塗）

       原本是 mix(c, t, 0.42)（＝CPU 的 source-over）—— 那是把面的顏色往**貼圖自己的

         直接換色會把山攤平」）—— 同一個問題的同一個答案。
       ⚠ a 仍然是 **0.42**（與 CPU 同一個數字，鐵律 7）。副作用是整體暗一階

    c *= (1.0-0.42) + 0.42*t;

/* CSS 色字串 → [0..1]×3。⚠ 色票寫的是 '#rrggbb' 與 'rgba(...)' 兩種。 */
function glCss3(c){

    return [parseInt(h.slice(0,2),16)/255, parseInt(h.slice(2,4),16)/255, parseInt(h.slice(4,6),16)/255];

  const m=/rgba?\(([^)]+)\)/.exec(c);
  if(m){ const v=m[1].split(',').map(Number); return [v[0]/255, v[1]/255, v[2]/255]; }

function glRuinTexture(name){
  if(!name) return null;
  if(glRuinTex[name]!==undefined) return glRuinTex[name];
  const e=(name==='flight_ruins') ? { img:ruinTex } : RUIN_TEX[name];
  if(!e || !e.img || !e.img.width) return null;       // 還沒載到：下一禎再試
  const g=GLX, t=g.createTexture();
  /* ⚠ unit 6（不是 14）—— 14 是地形的 max-mipmap，借來上傳也會把它踩掉（ver -1310）。 */
  g.activeTexture(g.TEXTURE0+6); g.bindTexture(g.TEXTURE_2D,t);
  g.texImage2D(g.TEXTURE_2D,0,g.RGBA8,g.RGBA,g.UNSIGNED_BYTE,e.img);
  g.generateMipmap(g.TEXTURE_2D);
  g.texParameteri(g.TEXTURE_2D,g.TEXTURE_MIN_FILTER,g.LINEAR_MIPMAP_LINEAR);
  g.texParameteri(g.TEXTURE_2D,g.TEXTURE_MAG_FILTER,g.LINEAR);
  g.texParameteri(g.TEXTURE_2D,g.TEXTURE_WRAP_S,g.REPEAT);
  g.texParameteri(g.TEXTURE_2D,g.TEXTURE_WRAP_T,g.REPEAT);
  glRuinTex[name]=t;
  return t;
}
/* ══⚠⚠⚠ **掃到那一刻淡入**（ver -1322，Ray：「無名遺跡被掃到的瞬間應該就要淡入
   3d 物件啊」）══════════════════════════════════════════════════════════
   回 0＝還沒掃到（不要畫）／0→1＝剛掃到（淡入中）／1＝早就掃到了。
   ⚠⚠ **「什麼時候掃到的」不存檔**：旗本身才是狀態（鐵律 9，誰插的寫在 `senseStars`）。
     這裡只記「**這一次開機**第一眼看到它已經插著的時刻」——
     · 玩到一半掃到 ⇒ 那一刻開始淡入（就是 Ray 要的）。
     · 讀檔／重整進來時它早就插著 ⇒ 第一幀就記下，於是也淡入一次；
       那比「啪一聲出現」好，而且不會有人把它讀成 bug。
   ⚠ 沒有 `flag` 的遺蹟（伊甸古墓那種明擺著的）一律回 1，不受這一條管。
   ⚠ CPU 與 GL **共用這一支**（鐵律 8）：兩條路的淡入曲線要一模一樣，
     不然切換渲染路徑會看到兩種節奏。 */
const RUIN_REVEAL_MS = 900;
const ruinRevealAt = {};
function revealK(flag, now){
  if(!flag) return 1;
  if(!flagOn(flag)) return 0;
  const t0 = ruinRevealAt[flag] || (ruinRevealAt[flag] = (now || performance.now()));
  const k = clamp(((now||performance.now()) - t0) / RUIN_REVEAL_MS, 0, 1);
  return k*k*(3-2*k);                 // smoothstep，同距離淡入那一支
}
function glDrawRuins(sinp,cosp,lx,ly,dayK){
  if(!glRuinReady) return;
  const g=GLX;
  /* 環境光：**沿用 CPU 那一支的常數與取樣器**（鐵律 7）——
     `screenSample` 現在是非同步回讀（ver -1203），不會卡管線。 */
  const sc=screenSample(0,0,W,VIEWH,true);
  if(!ruinAmb) ruinAmb=sc.slice();
  else for(let q=0;q<3;q++) ruinAmb[q]+=(sc[q]-ruinAmb[q])*RUIN_AMB_EASE;
  const nightK=clamp(1-dayK*1.25,0,1);
  g.useProgram(glRuinProg);
  g.enable(g.DEPTH_TEST); g.depthFunc(g.LEQUAL);
  g.uniform2f(glRuinU.uBuf,BW,BH);
  g.uniform3f(glRuinU.uCam,cam.x,cam.y,cam.alt);
  g.uniform2f(glRuinU.uDir,sinp,cosp);
  g.uniform2f(glRuinU.uLdir,lx,ly);
  g.uniform3f(glRuinU.uAmb,ruinAmb[0]/255,ruinAmb[1]/255,ruinAmb[2]/255);
  g.uniform1f(glRuinU.uAmbA,RUIN_AMB+RUIN_AMB_NIGHT*nightK);
  for(const R of glRuins){
    const dx=R.origin[0]-cam.x, dy=R.origin[1]-cam.y;
    const dist=Math.hypot(dx,dy);
    if(dist>RUIN_FAR) continue;
    const fk=clamp((RUIN_FAR-dist)/RUIN_FADE,0,1), fade=fk*fk*(3-2*fk);
    if(fade<=0.02) continue;
    /* ══⚠⚠⚠ **掃到那一刻淡入**（ver -1322，Ray：「無名遺跡被掃到的瞬間應該就要
       淡入 3d 物件啊」）══════════════════════════════════════════════════
       `revealK` ＝ 0 還沒掃到 ／ 0→1 剛掃到（淡入中）／ 1 早就掃到了。
       ⚠ 與距離的 `fade` **相乘**不是取代：那一支管「離得夠近才浮出來」，
         這一支管「發現了沒」——兩件事，乘起來才兩邊都對。 */
    const rk=revealK(R.flag);
    if(rk<=0.001) continue;
    g.uniform1f(glRuinU.uAlpha,fade*rk);
    g.uniform3f(glRuinU.uOrigin,R.origin[0],R.origin[1],R.origin[2]);
    g.uniform2f(glRuinU.uRot,R.rot[0],R.rot[1]);
    const flat=[]; for(const c of R.pal) flat.push(c[0],c[1],c[2]);
    g.uniform3fv(glRuinU.uPal,new Float32Array(flat));
    /* 逐座綁自己的兩張貼材（沒有就關掉，照舊平塗）。 */
    const tw=glRuinTexture(R.texW), tr=glRuinTexture(R.texR)||tw;
    g.uniform1f(glRuinU.uTexOn, tw?1:0);
    if(tw){ g.activeTexture(g.TEXTURE0+6);  g.bindTexture(g.TEXTURE_2D,tw);
            g.activeTexture(g.TEXTURE0+15); g.bindTexture(g.TEXTURE_2D,tr); }
    g.bindVertexArray(R.vao);
    g.drawArrays(g.TRIANGLES,0,R.n);
  }
  g.bindVertexArray(null);
}


/* ══════════════════════════════════════════════════════════════════════
   GL 量體層（ver -1207）—— 城的街廓，靜態網格
   ══════════════════════════════════════════════════════════════════════
   Ray：「以後飛行地圖的量體會加 10 倍以上」。CPU 那一支的成本是**逐塊**的
   （東方泊地 340 塊，實測每禎 ~300 次 drawImage ＋ 數百次 fill，3~11ms）——
   加十倍就是加十倍。GPU 上與數量脫鉤。

   ⚠⚠⚠ **GPU 上「屋頂的 6×6 仿射細分」整套不需要**：那是 Canvas 2D 只有仿射、
     吃不下 1/z 才要的補丁（§6.7 整章、以及 -1163 那段 RSPLIT 的註解）。
     硬體光柵器本來就有透視正確的插值 —— 一個四邊形貼一次就對了。
   ⚠ 幾何來源是 `cityMass`（`loadMass` 解出來的多邊形），本來就是**局部座標**，
     不必像遺蹟那樣開擷取模式。
   ⚠ 牆用 `wallCol`（半透的暗色，疊在地面插畫上）—— 與 CPU 同一個值。
   ⚠ 屋頂貼 `cityMassArt` 那張 atlas：每塊在 atlas 上有自己的一格（帶 alpha），
     所以**不必逐塊 clip**（clip 要重新光柵化路徑，幾百塊就吃掉畫格）。 */
let glMassProg=null, glMassU={}, glMass={};   // plan key → {vao, n, tex}

const GL_MASS_VS=`#version 300 es
in vec3 p;        // 局部座標（u*hw, v*hh, 高度）
in vec2 nrm;      // 牆的法線（屋頂給 0,0）
in float kind;    // 0 牆 1 屋頂
in vec2 uv;       // 屋頂在 atlas 上的座標
uniform vec2 uBuf; uniform vec3 uCam; uniform vec2 uDir;
uniform vec3 uOrigin; uniform vec2 uRot;
out float vKind; out vec2 vUv; out float vZ; out float vShade;
void main(){
  float wx=uOrigin.x+(p.x*uRot.x-p.y*uRot.y);
  float wy=uOrigin.y+(p.x*uRot.y+p.y*uRot.x);
  float wz=uOrigin.z+p.z;
  vec2 d=vec2(wx,wy)-uCam.xy;
  float sinp=uDir.x, cosp=uDir.y;
  float z=d.x*(-sinp)+d.y*(-cosp);
  if(z<8.0){ gl_Position=vec4(2.,2.,2.,1.); vZ=1.0; vKind=0.0; vUv=vec2(0.); vShade=1.0; return; }
  float sv=(d.x*cosp+d.y*(-sinp))/z;
  float scaleH=uBuf.y*0.62, horizon=uBuf.y*${HORIZON_F};
  float curv=(1.0+sv*sv)/(2.0*${PLANET_R}.0);
  float sy=((uCam.z-wz)/z + z*curv)*scaleH+horizon;
  gl_Position=vec4(sv, 1.0-2.0*sy/uBuf.y, 0.0, 1.0);
  vZ=clamp(z/${ZFAR}.0,0.0,1.0);
  vKind=kind; vUv=uv; vShade=1.0;
}`;
const GL_MASS_FS=`#version 300 es
precision highp float;
in float vKind; in vec2 vUv; in float vZ; in float vShade;
uniform sampler2D uAtlas;
uniform vec4 uWall;     // 牆色（含 alpha，與 CPU 的 wallCol 同值）
uniform float uAlpha;   // 這一禎整層的濃度（淡入淡出，與 CPU 同一個 _massA）
uniform vec3 uFog; uniform float uFogK;
out vec4 o;
void main(){
  vec4 c;
  if(vKind>0.5){ c=texture(uAtlas,vUv); if(c.a<0.02) discard; }
  else          c=uWall;
  /* 霧：與地形同一條曲線（量體是貼在地上的東西，要跟著沉進大氣）。 */
  float fogS=${ZFAR}.0*${FOG_START};
  float fog=clamp((vZ*${ZFAR}.0-fogS)/(${ZFAR}.0-fogS),0.0,1.0)*${FOG_MAX}*uFogK;
  o=vec4(mix(c.rgb,uFog,fog), c.a*uAlpha);
