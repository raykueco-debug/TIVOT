/* ══════════════════════════════════════════════════════════════════════
   飛空艇：分層精靈（19 世紀蒸汽帆船，正俯視）

   ▍為什麼分層
   單張圖只能整張斜切，幅度一大船體就跟著歪。拆成「船體／帆／索具／
   螺旋槳／旗」之後，各組帆可以獨立甩動、而且帶不同的延遲係數：轉向時
   前帆先甩、後帆跟上，回正時同樣有先後差 —— 那個時間差才是「一艘大船
   在轉」的讀感來源，不是幅度。

   ▍素材放哪
   ship/ 之下，全部對齊同一張畫布（512×569）、透明背景、船艏朝上（12 點）：
     hull.png / sails_fore.png / sails_main.png / sails_aft.png
     rigging.png / prop_l.png / prop_r.png / flag.png        （後四者可省略）
   hull 是必要層：載得到才切進精靈模式，其餘缺哪張就跳過哪層。
   ⚠ 現況是由 split_ship.py 從單張 Ship_FLIGHT.png 自動拆出來的（美術給的是
     合成圖）。改圖時重跑該腳本即可；它會順便印出重心，就是下面的 artPivot。
     目前沒有 rigging/flag 兩層 —— 索具已隨各層帆一起切走（桁與側支索本來
     就該跟帆同動），旗子原圖沒有。

   ▍沒有素材時
   走 PROC 分支 —— 同一套動畫參數，圖層改由程序繪製（原本那艘小船拆成
   幾層，另補上螺旋槳與艉旗）。素材抽掉也不會開天窗。
   ⚠ 兩種模式的圖層錨點不同（程序船比例較扁、桅位不同），所以 layers 同時
     帶 pivot（程序用）與 artPivot（精靈用）兩組。
   ══════════════════════════════════════════════════════════════════════ */
const SHIP_DIR = './ship/';

const SHIP_VISUAL = {
  /* 船身佔畫布高度的比例。畫布空間 → 螢幕尺寸由它換算，
     換素材時若船在畫布裡佔比不同，只要動這一個值。
     現行素材上下都貼齊畫布（頂＝首斜桅尖、底＝艉舵）故為 1。 */
  artFill:  1.00,
  /* 精靈模式的放大倍率。程序船是粗線條，67px 就夠看；換成 1190px 的精描
     圖之後同樣尺寸會糊成一團，故放大。只影響顯示大小，不動任何手感參數。 */
  artZoom:  1.5,
  /* 顆粒度：船畫在低解析畫布上再最近鄰放大。
     1＝完全比照地形的解析度（BW/W，約 0.6），>1 較細、<1 更粗。
     精描的船直接畫在螢幕解析度會比 voxel 背景銳利一個檔次，像貼上去的。 */
  pixelScale: 1,
  pivot:    {x:0.50, y:0.60},    // 旋轉中心＝船身長度 60% 處（從艏往艉算）

  /* 甩動彈簧 —— 整套效果的核心。目標值由角速度決定，實際值用彈簧追過去，
     刻意讓它 overshoot：鬆手回正時會過中線一點再擺回來。
       回彈不夠明顯 → 降 swayDamp（0.80 附近）
       甩動太黏     → 提 swayStiff
       幅度不夠     → 提 swayGain                                        */
  swayGain: 42,      // 角速度（rad／60fps 幀）→ 目標甩動量
  swayStiff:0.055,
  swayDamp: 0.86,
  swayMax:  1.2,
  luff:     0.12,    // 甩動時的橫向壓縮＝洩風

  propBase: 0.35,    // 怠速轉速（rad／幀）
  propGain: 2.8,
  propBlur: 0.42,    // 高速殘影濃度

  bobAmp:   3.0,
  bobSpeed: 0.0016,

  sailStretch: 0.06,       // 滿帆時的縱向伸展
  sailDim:  [0.88, 0.12],  // 帆的不透明度＝base + fill*gain（洩風時稍暗）

  /* ── 風 ──────────────────────────────────────────────────────
     甩動只在轉向時發生，直行時帆是死的 —— 一艘靠風走的船不該這樣。
     這裡加一層與操作無關的持續擾動：陣風強度（gust）自己緩慢起伏，
     各層依錨點的前後位置吃不同相位 → 陣風由艏往艉掃過去。
     ⚠ 慢帆比滿帆抖得更兇、但漣漪更慢：停船時是鬆垮地飄，
       滿速時是繃緊了在細顫。這兩種質地的差別才是「風」的讀感，
       單純加大振幅只會變成帆在抽搐。
     flutter/ripple/billow 都吃 swayScale —— 同樣是為了在 100px 的顯示
     尺寸下讀得出來，改 artZoom 時一起連動，不必逐項重調。 */
  wind: {
    gain:    1.00,    // 總強度，0＝完全關掉風
    freq:    0.0021,  // 脈動頻率
    lag:     6.0,     // 層間相位差（乘上錨點 y）→ 陣風的行進
    flutter: 6.0,     // 縱向抖動（512 畫布像素）
    ripple:  0.020,   // 沿帆寬的縱向錯位（skewY；左右舷反向）
    billow:  0.16,    // 鼓脹／洩風（縱向縮放）
  },

  /* offset／skew 的統一倍率。
     ⚠ 規格的 14/11/8 是照「船在螢幕上約 400px 高」訂的，佔船長約 3.5%；
       我們只有約 100px，同樣的 3.5% 剩不到 2 個像素 —— 實測三態並排完全
       看不出差別。倍率拉到 3 才讀得出「帆先甩、船體不動」。
       再往上（實測 5）桁會明顯脫離桅杆，因為桅杆屬 hull 層不跟著動。
       改 artZoom 時這個值要跟著調：讀感取決於螢幕像素，不是畫布比例。 */
  swayScale: 3.0,

  /* 陣列順序＝繪製順序（由下往上）。
     offset／skew 以 512 寬的畫布為基準，實際畫布不是 512 時自動等比換算。
     ⚠ artPivot 是 split_ship.py 量出的各層重心，不是規格上的估值 ——
       這張圖是「單桅三段橫帆」而非三根桅杆分列船身，帆的分布比規格假設的
       更集中在前段，照抄 0.30/0.45/0.62 會讓斜切的支點落在帆外面。 */
  layers:[
    {key:'prop_l',     pivot:{x:.38,y:.90},                                    prop:-1, artPivot:{x:.386,y:.906}},
    {key:'prop_r',     pivot:{x:.62,y:.90},                                    prop: 1, artPivot:{x:.613,y:.906}},
    {key:'hull',       pivot:{x:.50,y:.60}, delay:0,    offset:0,  skew:0    },   // delay 0 → 不變形，錨點不影響
    {key:'rigging',    pivot:{x:.50,y:.55}, delay:0.55, offset:5,  skew:0.06 },
    {key:'sails_aft',  pivot:{x:.50,y:.79}, delay:0.70, offset:8,  skew:0.10, dim:1, artPivot:{x:.50,y:.467}},
    {key:'sails_main', pivot:{x:.50,y:.62}, delay:0.85, offset:11, skew:0.13, dim:1, artPivot:{x:.50,y:.273}},
    {key:'sails_fore', pivot:{x:.50,y:.39}, delay:1.00, offset:14, skew:0.16, dim:1, artPivot:{x:.50,y:.130}},
    {key:'flag',       pivot:{x:.50,y:.84}, delay:1.20, offset:18, skew:0.22, flag:1, artPivot:{x:.50,y:.20}},
  ]
};

/* ── 素材載入（缺圖不算失敗，該層跳過即可）─────────────────────────
   ⚠ Console 會固定出現 rigging.png / flag.png 兩筆 404 —— 那是刻意的：
     寧可少兩筆雜訊也要保住「把檔案丟進 ship/ 就自動生效」這件事，
     改成讀 manifest 就得多維護一份清單、還會忘記更新。不是 bug。 */
const SHIP_IMG={};
let SHIP_ART=null;                 // {w,h}：hull 載到才有值＝進入精靈模式
function loadShipArt(){
  const one=key=>new Promise(res=>{
    const im=new Image();
    im.onload =()=>{ SHIP_IMG[key]=im; res(); };
    im.onerror=()=>res();
    im.src=SHIP_DIR+key+'.png';
  });
  return Promise.all(SHIP_VISUAL.layers.map(L=>one(L.key))).then(()=>{
    const h=SHIP_IMG.hull;
    if(h && h.naturalWidth) SHIP_ART={w:h.naturalWidth,h:h.naturalHeight};
  });
}

/* ── 視覺狀態（純表現，不影響飛行物理）──────────────────────────── */
const ship={angVel:0,sway:0,swayVel:0,propAngle:0,bob:0,gust:0.5,_prevHeading:0};
function updateShipVisual(dt,now){
  const V=SHIP_VISUAL;
  /* 全程用「60fps 幀」當時間單位，和本檔其他跟隨式參數（ACCEL/BANK_EASE）
     同一套慣例。⚠ 不能照規格直接乘毫秒 dt —— 剛性 0.055 乘上 16.67 會讓
     彈簧一幀就飛出去，畫面上是抽搐不是甩動。 */
  const f=dt/16.67;

  let d=cam.angle-ship._prevHeading;
  while(d> Math.PI) d-=Math.PI*2;          // ±π 跨越
  while(d<-Math.PI) d+=Math.PI*2;
  ship._prevHeading=cam.angle;
  ship.angVel = f>1e-4 ? d/f : 0;

  /* cam.angle 遞減＝向右偏 → angVel<0 → sway<0 → 帆往畫面左方（＝彎道外側）甩。
     正負號剛好，不必再反相。滿舵時 angVel≈0.0183，×42≈0.77，離上限還有餘裕。 */
  const target=clamp(ship.angVel*V.swayGain,-1,1);
  const force =(target-ship.sway)*V.swayStiff;
  ship.swayVel=(ship.swayVel+force*f)*Math.pow(V.swayDamp,f);
  ship.sway   =clamp(ship.sway+ship.swayVel*f,-V.swayMax,V.swayMax);

  ship.propAngle+=(V.propBase+cam.speed*V.propGain)*f;

  /* 陣風：三個不可通約的正弦疊加成 0..1 的緩慢起伏。
     用 sin 而不是亂數，是因為亂數逐幀跳動會變成雜訊；要的是「一陣一陣」。
     頻率彼此不成整數倍 → 合成波不會回到同一個形狀，聽不出週期。 */
  const wt=now*V.wind.freq;
  ship.gust=clamp(0.5+0.30*Math.sin(wt)+0.14*Math.sin(wt*2.37+1.1)+0.06*Math.sin(wt*5.13+2.7),0,1);

  /* 上下飄動：兩個不同週期的正弦疊加，避免規律得像機械擺動。
     停船時也持續（浮空艇本來就浮著），只是幅度小一點。 */
  const idle=0.55+0.45*clamp(cam.speed/MAX_SPD,0,1);
  ship.bob=(Math.sin(now*V.bobSpeed)*V.bobAmp+Math.sin(now*V.bobSpeed*0.44)*V.bobAmp*0.6)*idle;
}

/* ── 繪製 ─────────────────────────────────────────────────────────
   船先畫在自己的低解析畫布（shipFB）上，再以最近鄰放大貼回主畫布。
   ⚠ 這是為了讓船的顆粒與地形一致：地形是 BW×BH 的緩衝放大到 W×VIEWH
     （約 1.67 倍、image-rendering:pixelated），船若照螢幕解析度直接畫，
     會比背景銳利一整個檔次 —— 看起來就是「貼上去的另一張圖」。
   ⚠ shipFB 內部仍開 imageSmoothing（精靈是 5 倍降取樣進來的，關掉會抖成
     馬賽克）；只有最後那一次放大關掉。顆粒感要來自放大，不是取樣失真。
   附帶好處：所有圖層的合成都在一張小畫布上完成，帆的 alpha 不會逐層
   疊在地形上（原本 0.88 的帆會透出背景，現在只透一次）。 */
let shipFB=null, SC=null;
let shipHit=null;          // {x,y,r}：船在螢幕上的命中圈，每幀由 drawShip 更新
/* 當幀的投影常數（唯一的寫入點是 `render()`，見那裡的說明）。 */
const PROJ={ ok:false, scaleH:0, horizon:0, sinp:0, cosp:1 };
/* ══⚠⚠ 螢幕上的一點 → 地形上的地圖座標（ver -1146，釘選工具用）══
   作法與地形本身同一套**體素射線**：沿著那一欄的視線由近而遠推進，
   每一步算出地面在螢幕上的 y，**第一次**升到點擊點之上的那一步就是命中
   —— 「取第一次」正好就是遮擋（前面的山擋住後面的谷），不必另做一套。
   ⚠ 投影參數讀 `PROJ`（render 每幀發佈），不自己再算一次（鐵律 7）。
   ⚠ 步長由近而遠**等比放大**：近處要準（一步 4 個世界單位＝地圖像素的 1/5），
     遠處一個地圖像素本來就不到一個螢幕像素，再細也讀不出來。
   ⚠ 回 null ＝ 點到天空（那一欄的地形整條都在點擊點之下），呼叫端當成「沒插」。 */
function pickTerrain(sx,sy){
  if(!PROJ.ok || !MAPW) return null;
  const scaleH=PROJ.scaleH, horizon=PROJ.horizon, sinp=PROJ.sinp, cosp=PROJ.cosp;
  const syk=VIEWH/BH;
  const sv=sx/W*2-1;                      // 螢幕 x → 視線的橫向座標（同 px() 的逆）
  if(sv<-1.6||sv>1.6) return null;
  const curv=curvAt(sv);
  for(let z=60; z<ZFAR; z+=Math.max(4,z*0.012)){
    /* 前向 (-sinp,-cosp) 與右向 (cosp,-sinp) 是正交單位向量，
       所以視線上距離 z、橫向 sv·z 的那一點就是這兩個的線性組合。 */
    const dx=z*(-sinp)+sv*z*cosp;
    const dy=z*(-cosp)+sv*z*(-sinp);
    const mx=(cam.x+dx)/MAP_SCALE, my=(cam.y+dy)/MAP_SCALE;
    if(mx<0||my<0||mx>=MAPW||my>=MAPH) return null;
    const h=HGT[(my|0)*MAPW+(mx|0)];
    const ys=(((cam.alt-h)/z + z*curv)*scaleH+horizon)*syk;
    if(ys<=sy) return [Math.round(mx), Math.round(my)];
  }
  return null;
}
function drawShip(now){
  const V=SHIP_VISUAL;
  const k=Math.min(2.9,W/135);
  const CW=SHIP_ART?SHIP_ART.w:512, CH=SHIP_ART?SHIP_ART.h:512;
  const uk=CW/512;                      // offset 的畫布基準換算
  const Z=SHIP_ART?V.artZoom:1;
  const S=(24*k*Z)/(CH*V.artFill);      // 畫布空間 → 螢幕（24＝程序船的高度單位）
  const fill=clamp(cam.speed/MAX_SPD,0,1);

  // 外接半徑：船的對角線 + 側傾轉出來的餘裕；尾流另外往下加長
  const R=Math.ceil(Math.hypot(CW*S*0.58, CH*S*0.64))+10;
  const WK=Math.ceil((14+54+10)*Z);
  const fw=R*2, fh=R*2+WK;                                  // 螢幕像素
  const pk=clamp(BW/W*V.pixelScale,0.15,1);
  const bw=Math.max(8,Math.round(fw*pk)), bh=Math.max(8,Math.round(fh*pk));
  if(!shipFB || shipFB.width!==bw || shipFB.height!==bh){
    shipFB=document.createElement('canvas'); shipFB.width=bw; shipFB.height=bh;
    SC=shipFB.getContext('2d');
  }
  SC.setTransform(1,0,0,1,0,0);
  SC.clearRect(0,0,bw,bh);
  SC.imageSmoothingEnabled=true;
  SC.scale(bw/fw,bh/fh);                // 之後一律用「螢幕像素」思考
  SC.translate(R,R);                    // 錨點＝原點

  drawWake(now,k,fill,S,CW,CH,Z);

  SC.save();
  SC.rotate(cam.bank);                  // 偏艏（世界不轉、船不依 heading 自轉）
  SC.scale(S,S);
  SC.translate(-CW*V.pivot.x,-CH*V.pivot.y);   // 讓 pivot 落在原點

  for(const L of V.layers){
    const img=SHIP_ART?SHIP_IMG[L.key]:null;
    if(SHIP_ART && !img) continue;               // 精靈模式缺這層＝略過
    const pv=(SHIP_ART&&L.artPivot)?L.artPivot:L.pivot;
    const px=CW*pv.x, py=CH*pv.y;

    SC.save();
    if(L.prop){ drawPropLayer(L,img,px,py,fill,CH); SC.restore(); continue; }

    const s=ship.sway*(L.delay||0);

    /* 風：只作用在帆，且**只走縱向**（畫面上下＝船的艏艉向）。
       ⚠ 橫向抖動會跟轉向甩動搶同一個軸，兩者一疊就分不出哪個是風、
         哪個是在轉彎；改成縱向之後兩者正交，各自讀得清楚。
       錯開分兩層：
         · 層與層：相位吃錨點 y（越靠船艉陣風越晚到）→ 由艏往艉掃過去
         · 單層之內：skewY 讓縱向位移隨離桅杆的距離增加 → 左右舷反向，
           像帆的外緣輪流吃到風、根部才跟上 */
    let sy=L.dim?1+fill*V.sailStretch:1, fy=0, fb=0;
    if(L.dim && V.wind.gain>0){
      const Wd=V.wind, taut=fill;
      /* ⚠ 繃緊時要「更小**也更慢**」。原本振幅隨速度變小、頻率卻變快 ——
         小振幅＋高頻＝震動，不是風。表風壓上來、帆被壓死不再拍動，
         剩下的是整片緩慢的呼吸；高頻細顫在 100px 上只會變成雜訊。 */
      const ph=now*Wd.freq*2.6*(1-0.20*taut) - pv.y*Wd.lag;
      const fl=(Math.sin(ph)+0.45*Math.sin(ph*2.31+1.7))*Wd.gain*ship.gust;
      const slack=1-0.72*taut;              // 鬆帆晃得兇、滿帆幾乎不動
      fy=fl*Wd.flutter*slack;               // 整片上下起伏
      fb=fl*Wd.ripple *slack;               // 沿帆寬的縱向錯位
      sy+=(ship.gust-0.5)*Wd.billow*Wd.gain*(0.35+0.65*taut);   // 鼓脹／洩風
    }

    SC.translate(px,py);
    /* ⚠ 斜切取負號：畫布 y 往下為正，帆位於錨點「前方」（靠船艏）的部分 y<0。
       要讓那一端甩得比根部更遠，就得 x += -s*skew*y。用規格上的正號會變成
       艏端往反方向落後，看起來像帆被折斷。 */
    SC.transform(
      1-Math.abs(s)*V.luff,             fb*V.swayScale,
      -s*(L.skew||0)*V.swayScale,       sy,
      s*(L.offset||0)*uk*V.swayScale,   fy*uk*V.swayScale
    );
    SC.translate(-px,-py);
    if(L.dim) SC.globalAlpha=V.sailDim[0]+fill*V.sailDim[1];

    if(L.flag)      drawFlagLayer(img,now,fill,CW,CH,px,py);
    else if(img)    SC.drawImage(img,0,0);
    else if(PROC[L.key]) PROC[L.key](CW,CH,fill);
    SC.restore();
  }
  SC.restore();

  /* ── 日照：船跟地形吃同一盞燈 ─────────────────────────────────
     船原本完全不吃日照，夜裡還是正午的白帆掛在暗掉的大陸上，像螢光貼紙
     （同瀑布先前的毛病，見 drawPanel 上方那段註解）。
     ⚠ 用 source-atop：它只作用在**已經不透明**的像素上，透明區不會被塗成
       方塊。若改用 multiply，Canvas 的 multiply 走 source-over 合成，
       會把整張離屏緩衝填成一塊實心色。
     ⚠ 上色在貼回主畫布**之前**、且在尾流之後 —— 尾流也是船的一部分，
       同一盞燈照著才對得起來。
     色調：入夜壓成銀藍（銀月是冷光），日夕之交偏暖橙。 */
  {
    const Sk=sky();
    const nightA=clamp(1-Sk.day*1.2,0,1);          // 入夜程度
    const dk=Sk.dusk;                               // 日夕之交
    const tr=Math.round(lerp(34,255,dk)), tg=Math.round(lerp(46,184,dk)), tb=Math.round(lerp(78,100,dk));
    const a=clamp(nightA*0.58*(1-dk*0.45)+dk*0.30,0,0.7);
    if(a>0.01){
      SC.setTransform(1,0,0,1,0,0);
      SC.globalCompositeOperation='source-atop';
      SC.fillStyle='rgba('+tr+','+tg+','+tb+','+a.toFixed(3)+')';
      SC.fillRect(0,0,bw,bh);
      SC.globalCompositeOperation='source-over';
    }
  }
  /* 貼回主畫布。⚠ 目的地座標取整：bob 帶小數的話，整片顆粒每幀都在
     半格上重新取樣、邊緣糊掉 —— 剛好抵消掉我們要的效果。 */
  const dx=Math.round(W/2-R), dy=Math.round(VIEWH*0.76+ship.bob-R);
  ctx.imageSmoothingEnabled=false;
  ctx.drawImage(shipFB,0,0,bw,bh,dx,dy,fw,fh);
  /* ── 探索冷卻完成：船的輪廓閃一下（Ray 指定）──────────────────────
     ⚠ 直接把**剛畫好的船緩衝**再疊一次就好 —— 它已經帶著船的 alpha，
       用 `lighter` 疊出來就是沿著輪廓的一圈光，不必另外做遮罩或描邊。
     ⚠ 放大一點點（1.06）才會讀成「輪廓在發光」而不是「整艘船變亮」。 */
  if(senseRdyFlash){
    const ft=(now-senseRdyFlash)/RDY_FLASH_MS;
    if(ft>=1) senseRdyFlash=0;
    else{
      const fa=Math.sin(Math.PI*clamp(ft,0,1));
      const gz=1.06, gw2=fw*gz, gh2=fh*gz;
      ctx.save();
      ctx.globalCompositeOperation='lighter';
      ctx.globalAlpha=0.55*fa;
      ctx.drawImage(shipFB,0,0,bw,bh, dx-(gw2-fw)/2, dy-(gh2-fh)/2, gw2, gh2);
      ctx.restore();
    }
  }
  /* 船的螢幕命中圈 —— 長按船身要靠它（見 stage 的 pointerdown）。
     ⚠ 半徑取 R*0.8 而不是 R：R 是外接圓，含側傾與尾流的餘裕，
       照它算的話船邊上一大圈空白也會被當成「按在船上」。 */
  shipHit={x:W/2, y:VIEWH*0.76+ship.bob, r:R*0.8};
}

/* 螺旋槳：高速時以較低 alpha 重繪兩次、角度各退一點＝殘影
   ⚠ 殘影間距取 π/6：四葉槳的葉距是 π/2，三個位置（0、π/6、π/3）剛好把
     葉距填滿成盤面。用規格的 0.25 弧度太密，滿速下每幀轉 8.7 弧度（遠大於
     葉距）會頻閃成亂跳，補那麼一點沒有用。 */
function drawPropLayer(L,img,px,py,fill,CH){
  const V=SHIP_VISUAL, R=CH*0.052;
  const ghosts=fill>0.22?2:0;
  for(let g=ghosts;g>=0;g--){
    SC.save();
    SC.translate(px,py);
    SC.rotate((ship.propAngle-g*0.524)*L.prop);
    SC.translate(-px,-py);
    if(g>0) SC.globalAlpha=V.propBlur*(1-g*0.34)*fill;
    if(img) SC.drawImage(img,0,0);
    else    PROC.prop(px,py,R);
    SC.restore();
  }
}

/* 旗：切成 6 條垂直帶逐條套正弦位移。windGain 由速度決定（垂下 → 平展） */
function drawFlagLayer(img,now,fill,CW,CH,px,py){
  const wind=0.4+0.6*fill;
  if(img){
    const strips=6, sw=img.width/strips;
    for(let i=0;i<strips;i++){
      const amp=Math.pow(i/strips,1.6)*5*wind*(CW/512);
      const dy=Math.sin(now*0.008-i*0.55)*amp;
      SC.drawImage(img, i*sw,0,sw,img.height, i*sw,dy,sw,img.height);
    }
    return;
  }
  PROC.flag(px,py,CH,wind,now);
}

/* ══ 程序圖層（無素材時的替身）══
   以「原型小船」的座標系作畫：y −15（艏）..+9（艉）、x ±12.5，原點對齊
   hull 錨點。procSpace 負責把它映射進畫布空間 —— 縮放後的線寬剛好等於
   原本 ctx.scale(k,k) 下的值，所以這些數字可以整包沿用。 */
function procSpace(CW,CH,fn){
  const V=SHIP_VISUAL;
  SC.save();
  SC.translate(CW*V.pivot.x, CH*V.pivot.y);
  SC.scale(CH*V.artFill/24, CH*V.artFill/24);
  fn();
  SC.restore();
}
function procSail(my,mh,sw,sh){
  SC.strokeStyle='#2b2419'; SC.lineWidth=0.7;
  SC.beginPath(); SC.moveTo(0,my); SC.lineTo(0,my-mh); SC.stroke();                    // 桅
  SC.beginPath(); SC.moveTo(-sw,my-mh*0.72); SC.lineTo(sw,my-mh*0.72); SC.stroke();    // 桁
  SC.fillStyle='rgba(226,219,198,.94)';
  SC.beginPath();
  SC.moveTo(-sw,my-mh*0.72);
  SC.quadraticCurveTo(0,my-mh*0.72+sh*0.34, sw,my-mh*0.72);
  SC.lineTo(sw*0.86,my-mh*0.72+sh); SC.quadraticCurveTo(0,my-mh*0.72+sh*1.3,-sw*0.86,my-mh*0.72+sh);
  SC.closePath(); SC.fill();
  SC.fillStyle='rgba(120,112,96,.28)';                                                 // 背光側
  SC.beginPath();
  SC.moveTo(0,my-mh*0.72); SC.lineTo(sw,my-mh*0.72);
  SC.lineTo(sw*0.86,my-mh*0.72+sh); SC.quadraticCurveTo(0,my-mh*0.72+sh*1.3,0,my-mh*0.72+sh);
  SC.closePath(); SC.fill();
}
const PROC={
  hull(CW,CH){ procSpace(CW,CH,()=>{
    // 船殼：尖艏、方艉，黑色塗裝配金線
    SC.fillStyle='#241f1a';
    SC.beginPath();
    SC.moveTo(0,-15); SC.quadraticCurveTo(4.6,-8, 5.0,0);
    SC.lineTo(4.2,9); SC.lineTo(-4.2,9); SC.lineTo(-5.0,0);
    SC.quadraticCurveTo(-4.6,-8, 0,-15); SC.closePath(); SC.fill();
    // 甲板
    SC.fillStyle='#8a7350';
    SC.beginPath();
    SC.moveTo(0,-12.4); SC.quadraticCurveTo(3.5,-7, 3.8,0);
    SC.lineTo(3.2,7.4); SC.lineTo(-3.2,7.4); SC.lineTo(-3.8,0);
    SC.quadraticCurveTo(-3.5,-7, 0,-12.4); SC.closePath(); SC.fill();
    // 舷側金線
    SC.strokeStyle='rgba(201,162,39,.55)'; SC.lineWidth=0.5;
    SC.beginPath(); SC.moveTo(-4.4,-1); SC.lineTo(-3.7,8); SC.moveTo(4.4,-1); SC.lineTo(3.7,8); SC.stroke();
    // 舷外浮翼（飛空艇的支撐翼）
    SC.fillStyle='#4a3f33';
    SC.beginPath(); SC.moveTo(-4.6,1); SC.lineTo(-12.5,4.2); SC.lineTo(-11.8,5.8); SC.lineTo(-4.4,4.6); SC.closePath(); SC.fill();
    SC.beginPath(); SC.moveTo(4.6,1); SC.lineTo(12.5,4.2); SC.lineTo(11.8,5.8); SC.lineTo(4.4,4.6); SC.closePath(); SC.fill();
    // 煙囪（主桅與後桅之間）
    SC.fillStyle='#1c1814'; SC.fillRect(-1.05,2.0,2.1,3.4);
    SC.fillStyle='#3a3128'; SC.fillRect(-1.05,2.0,2.1,0.8);
    // 艉燈
    SC.fillStyle='rgba(255,206,120,.9)';
    SC.beginPath(); SC.arc(0,8.2,0.75,0,Math.PI*2); SC.fill();
  }); },
  /* 索具：自各桅頂拉向艏艉的支索。獨立成層才吃得到 delay 0.55 的中段延遲 */
  rigging(CW,CH){ procSpace(CW,CH,()=>{
    SC.strokeStyle='rgba(43,36,25,.55)'; SC.lineWidth=0.28;
    SC.beginPath();
    SC.moveTo(0,-13.6); SC.lineTo(0,-8.4);
    SC.moveTo(0,-8.5);  SC.lineTo(-2.6,-2.2); SC.moveTo(0,-8.5); SC.lineTo(2.6,-2.2);
    SC.moveTo(0,-4.2);  SC.lineTo(-2.4,3.4);  SC.moveTo(0,-4.2); SC.lineTo(2.4,3.4);
    SC.moveTo(0,2.0);   SC.lineTo(-2.0,8.2);  SC.moveTo(0,2.0);  SC.lineTo(2.0,8.2);
    SC.stroke();
  }); },
  sails_fore(CW,CH){ procSpace(CW,CH,()=>procSail(-6.5,6.5,3.4,3.2)); },
  sails_main(CW,CH){ procSpace(CW,CH,()=>procSail( 0.5,9.0,4.6,4.4)); },
  sails_aft (CW,CH){ procSpace(CW,CH,()=>procSail( 6.0,6.0,3.2,3.0)); },
  /* 螺旋槳：四葉黃銅。旋轉已由 drawPropLayer 套好，這裡只畫靜態外形 */
  prop(px,py,R){
    SC.fillStyle='#b08d3c';
    for(let b=0;b<4;b++){
      SC.save();
      SC.translate(px,py); SC.rotate(b*Math.PI/2);
      SC.beginPath(); SC.ellipse(0,-R*0.60,R*0.23,R*0.60,0,0,Math.PI*2); SC.fill();
      SC.restore();
    }
    SC.fillStyle='#3a3128';
    SC.beginPath(); SC.arc(px,py,R*0.24,0,Math.PI*2); SC.fill();
  },
  /* 艉旗：三角旗，沿長度套遞增振幅的正弦（越外擺越大） */
  flag(px,py,CH,wind,now){
    const P=CH*SHIP_VISUAL.artFill/24, len=3.2*P, segs=8;
    const off=t=>Math.sin(now*0.008-t*3.4)*Math.pow(t,1.6)*1.9*P*wind;
    SC.beginPath();
    for(let i=0;i<=segs;i++){ const t=i/segs; SC.lineTo(px+off(t)-0.40*P*(1-t*0.85), py+t*len); }
    for(let i=segs;i>=0;i--){ const t=i/segs; SC.lineTo(px+off(t)+0.40*P*(1-t*0.85), py+t*len); }
    SC.closePath();
    SC.fillStyle='rgba(201,162,39,.82)'; SC.fill();
    SC.strokeStyle='rgba(43,36,25,.5)'; SC.lineWidth=0.16*P; SC.stroke();
  }
};

/* 尾跡：自兩具螺旋槳噴出的凝結尾（SOA 飛空艇那種）。
   ⚠ 出口要跟著螺旋槳走：偏艏時艉部連同螺旋槳會甩向彎道外側，出口不跟著
     移動的話，尾流會從船身中段憑空冒出來，而且轉彎時整束不動＝穿幫。
     所以起點吃 cam.bank 的旋轉（＝螺旋槳的實際去處），
     但尾巴本身留在螢幕空間往下拉 —— 那是航跡，不隨船身轉。
   ⚠ 偏向取 −cam.bank：船艏切進彎道，走過的航跡留在彎道外側（像開車右轉時
     後照鏡裡的路往左後方去）。與 bank 同向會看起來像整艘船在平移。
   位置直接讀 layers 裡兩個螺旋槳層的錨點，換素材時不必再對一次。 */
function drawWake(now,k,spd,S,CW,CH,Z){
  if(spd<=0.02) return;
  const V=SHIP_VISUAL;
  const cb=Math.cos(cam.bank), sb=Math.sin(cam.bank);
  const len=(14+spd*54)*Z, segs=16;
  SC.save(); SC.lineCap='round';
  for(const L of V.layers){
    if(!L.prop) continue;
    const pv=(SHIP_ART&&L.artPivot)?L.artPivot:L.pivot;
    const lx=(pv.x-V.pivot.x)*CW*S, ly=(pv.y-V.pivot.y)*CH*S;   // 槳軸相對旋轉中心
    const x0=lx*cb-ly*sb, y0=lx*sb+ly*cb;                        // 套上偏艏
    const side=L.prop;
    for(let i=0;i<segs;i++){
      const a0=i/segs, a1=(i+1)/segs;
      const wob =Math.sin(now*0.004+i*0.55+side)*1.5*a0*Z;   // 尾端輕微擺動＝亂流
      const wob2=Math.sin(now*0.004+(i+1)*0.55+side)*1.5*a1*Z;
      SC.globalAlpha=(1-a0)*(1-a0)*0.5*spd;
      SC.strokeStyle='#eef2f8';
      SC.lineWidth=(1.9-a0*1.5)*k*0.5*Z;
      SC.beginPath();
      SC.moveTo(x0+side*a0*5*k*Z+wob -cam.bank*22*a0*Z, y0+a0*len);
      SC.lineTo(x0+side*a1*5*k*Z+wob2-cam.bank*22*a1*Z, y0+a1*len);
      SC.stroke();
    }
  }
  SC.restore(); SC.globalAlpha=1;
}

function vignette(S){
  const v=ctx.createRadialGradient(W/2,VIEWH*0.5,VIEWH*0.34,W/2,VIEWH*0.5,VIEWH*1.05);
  v.addColorStop(0,'rgba(0,0,0,0)');
  v.addColorStop(1,`rgba(0,0,0,${lerp(0.44,0.42,S.day)})`);   // 夜裡有銀月，暗角不必再壓
  ctx.fillStyle=v; ctx.fillRect(0,0,W,VIEWH);
}

/* ══ 操作面板 ══
   舵輪（Wheel）裝在基座（Base）上 —— 基座頭部的那個圓孔就是舵軸的軸座，
   所以**輪轂必須落在軸孔上**，基座的腳則踩在操作區底緣。先前是各畫各的
   （輪轂在畫面底緣、基座另外擺在面板中央），看起來像基座被輪臂穿過去、
   浮在半空，那不是「裝上去」，是兩張圖疊在一起。
   ⚠ 兩張圖都已去透明留白後壓成 webp（1.4MB → 70/48KB）：這是飛行開場
     就要載的東西，原尺寸 PNG 會把開場拖長。
   ⚠ BORE / HEAD_R 是從 Base.webp 量出來的比例（軸孔中心、頭盤半徑）。
     webp 是 bbox 裁切後縮放的，**換圖就要重量**，否則輪轂會偏離軸孔。 */
const helmArt={ wheel:null, base:null, pointer:null };
(function loadHelm(){
  const one=(k,src)=>{ const im=new Image(); im.onload=()=>{helmArt[k]=im;}; im.src=src; };
  one('wheel','wheel.webp'); one('base','base.webp'); one('pointer','pointer.webp');
})();
/* ══ 甲板背景：兩層（ver -1078；-1082 接上四時段）══
   交接檔 `flight/HANDOFF_deck_layers.md`、美術規格 `flight/_deck_spec.md`。
   Ray：「我想把**雲海跟甲板分開**，雲海在船動的時候會**向後跑**」
   · `Sky_<band>.webp`  3072×1024 RGB  —— 雲海全景，**橫向無縫循環**（會動）
   · `Deck_<band>.webp` 1536×1024 RGBA —— 甲板＋圍欄＋繩梯＋船頭，天空是真 alpha（不動）
   ⚠⚠ 兩張的**縱向尺度必須一致**（同一個 `sc`），地平線才對得上 ——
     甲板層的地平線（圍欄上緣那條）是照天空層 18% 的地平線畫的。

   ══⚠⚠⚠ 時段：**問主遊戲那一支，不在這裡再算一份晝夜**（鐵律 7）══
   這一頁是非 module 的獨立文件，import 不到 `script/clock.js` —— 但頁尾那個
   `<script type="module">` 可以，所以由它把 `band()` **掛上 window**，這裡只讀。
   ⚠ 於是「幾點算黎明／白天／黃昏／夜」全站**只有 `script/clock.js` 一處**在定義
     （城鎮背景、插圖、店舖背景吃的是同一支）—— 這一頁不再是「第二份真相」。
   ⚠ 拿不到（module 掛了）就退回白天：那是**預設值**不是第二份規則，
     最壞情況只是一直用日景，不會走鐘。
   ⚠ 美術交的是**四張**（dawn/day/dusk/night），而 `band()` 有五段 ——
     `midnight` 併進 `night`。這張表是「哪一段用哪張圖」，不是晝夜的定義。
   ⚠ **逐時段載入、載過就快取**：一次只抓用得到的那一對（兩張約 0.7MB），
     不要四段全抓。飛行本身不花時間（§6.5.4.0），所以一趟航行只會用到一段 ——
     真的換段一定伴隨一次進出場，那時這一頁早就重載了。
   ⚠ **圖載不到也不會壞**：整段不畫，面板回到原本那層漸層；
     `onerror` 記成 null 且不重試（每次開機噴一輪 404 是雜訊）。 */
const DECK_BAND_ART={ Dawn:'dawn', Day:'day', Dusk:'dusk', night:'night', midnight:'night' };
const deckCache={};                      // 時段 → {deck, sky}
function deckBand(){
  const b = (typeof window.__clockBand==='function') ? window.__clockBand() : 'Day';
  return DECK_BAND_ART[b] || 'day';
}
function deckPair(){
  const b=deckBand();
  let P=deckCache[b];
  if(!P){
    P=deckCache[b]={ deck:null, sky:null };
    const one=(k,kind)=>{ const im=new Image();
      im.onload =()=>{ P[k]=im; };
      im.onerror=()=>{ P[k]=null; };     // 沒這一張：安靜放棄，不重試
      im.src=kind+'_'+b+'.webp'; };
    one('deck','Deck'); one('sky','Sky');
  }
  return P;
}
/* 頁尾的 module 掛好 `__clockBand` 之後叫這一支：用**正確的時段**提早開抓，
   別讓第一幀才開始載（`primeArt` 的預熱也才有東西可熱）。 */
window.__deckPrefetch=()=>{ try{ deckPair(); }catch(_){} };
/* ══ 雲海怎麼動 ══（交接檔第四節；**ver -1080 改掉前進那一半**）
   · **轉向**綁 `cam.angle` —— 轉舵、天空橫掃。這一半是**物理正確**的，
     而且與上半 3D 視窗讀同一個 `cam.angle`（鐵律 7），兩邊不可能走鐘。
   · **前進**＝**從消失點往外擴**（ver -1080，Ray：「前進的時候背景不應該左右平移吧？
     應該要往 viewer 方向收」）。他是對的：直線前進的光流是**以正前方為中心的放射狀
     擴張**（FOE＝focus of expansion），橫移是錯的 —— -1078 那一版是為了省事才做成
     橫移，稿上也自己寫了「這一半物理上是假的」。
     FOE ＝ **畫面橫向中心 × 天空層的地平線那一列**（正前方無限遠的那個點）：
     以它為中心放大，地平線上的點不動、其餘往外擴 —— 那正是前進該有的樣子。
   ⚠⚠ **放大要循環，而且不可以「放到底再跳回去」**（那是一次明顯的閃跳）。
     作法是經典的無限縮放：**同時畫兩層**，尺度差一個 `SKY_ZOOM_F`，小的那層
     淡入蓋在大的那層上；一個循環走完時，小的剛好長到大的那層的起始尺度，
     兩者交棒，畫面上**完全接得起來**（自檢：u→1 時看到的是 F 倍的那一張，
     u=0 時看到的也是 F 倍的那一張）。
   ⚠ 兩層**都必然蓋滿面板**（尺度分別是 F^u≥1 與 F^(u+1)≥F），所以大的那層
     可以用 α=1 當底 —— 不會透出下面的漸層。
   ⚠ `F` 不要大：它同時決定**最大放大倍率**（F²）與交叉淡接時兩張圖的差距。
     太大 → 尾段被放大到糊、而且淡接時看得出是同一張圖的兩個尺寸（疊影）。
   ⚠ 綁 `mv` 而不是 `cam.speed`：停船／交棒進戰鬥／對話暫停時 `mv` 本來就是 0，
     Sturm 與開發用加速也自動吃到 —— 不必在這裡再判一次（鐵律 7/8）。
   ⚠ `skyZoom` 是**純視覺狀態**：不進存檔、不跨場（這一頁每次出航都重載）。 */
const SKY_PAN      = 0.6;     // ×W：每弧度捲動幾個畫面寬（轉 90° ≈ 掃過一個畫面寬）
const SKY_HORIZON  = 0.18;    // 天空層的地平線佔圖高的比例（美術規格，換圖要重量）
const SKY_ZOOM_F   = 1.6;     // 一個循環放大幾倍（＝兩層的尺度間距；最大倍率是它的平方）
const SKY_ZOOM_PER = 4500;    // 前進幾個世界單位走完一個循環（滿速 360/秒 → 約 12 秒）
/* ══⚠⚠ 升空／降落時天空層跟著上下（ver -1105，Ray：「船升空降落時控制版的背景
   也要同步」）══ 起降是**高度**在動（`cam.alt` 由 `altTween` 驅動，400↔700），
   而面板上那片天空原本只吃「轉向」與「前進」—— 於是升空那一段上半在爬、
   下半紋風不動，兩個畫面各說各話。
   · 升空（alt 變大）＝天空層**往下**滑（地平線沉下去），降落反過來。
   · 幅度寫成**面板高的比例**（不是像素）：`TK_ALT_LOW` 那一端正好是 `SKY_ALT_SPAN`
     個面板高 —— 起降的高度範圍改了它自己跟著對，不必重調（鐵律 7）。
   ⚠ 甲板層**不動**：那是自己的船，它與鏡頭是一起升降的。動的只有背後的天空。 */
const SKY_ALT_SPAN = 0.55;    // 低點與巡航之間，天空層上下移動幾個面板高
const SEAM_FADE    = 0.10;    // 面板上緣沉進底色的高度（佔面板高）——「接線」那一條
let skyZoom=0;                // 循環相位，累加在 update 的位移那一行（唯一那一處）
const BORE={x:0.4481,y:0.1581};          // Base.webp 軸孔中心（佔圖寬/圖高的比例）
const HEAD_R=0.2274;                     // 基座頭盤半徑佔基座寬的比例（95.5/420）
const WHEEL_SPIN=0.0052;                 // 舵量 → 舵輪角速度（rad/ms，滿舵約 0.83 轉/秒）
const HELM_FOOT=4;                       // 舵軸離畫面底緣的像素（軸心壓在底緣 → 只看得到上半輪）
const BASE_K=1.05;                       // 基座寬 ÷ 舵輪直徑（>1＝比畫面寬，左右由畫面裁掉）
const GAUGE_K=0.85;                      // 刻度帶半徑 ÷ 頭盤半徑（<1：整條刻度都落在頭盤黃銅面上）
const GAUGE_SPAN=Math.PI*2/3;            // 掛角 120°：10 點（零速）→ 12 點 → 2 點（滿速）
const GAUGE_RED=0.75;                    // 紅漆自滿速的 75% 起
const HOOK_LEN=0.32;                     // 銅針鉤長 ÷ 刻度環半徑（只有扣過盤緣的那截看得到）
const HOOK_W=0.42;                       // 鉤寬 ÷ 鉤長（素材原比例 0.8 太肥，橫向壓窄）
let wheelAng=0;

/* ── 機械式速度表（基座頭盤上的刻度環 + 扣在盤緣的銅針）──────────────
   讀法是**盤不動、銅針走**：刻度環刻在基座頭盤面上，銅針隨速度沿環滑動，
   10 點＝停船、12 點＝半速、2 點＝滿速（掛角 120°）。

   ⚠ 定位：這是**給舵手看的擺設**，不是玩家要盯的儀表 —— 油門實際上大家都
     拉到底，速度沒有判讀價值。所以它刻意做得不顯眼：對比壓低、不寫數字、
     被舵輪遮住不補救。要精確值去看地圖。之前為了「讀得到」把刻度打亮、把
     銅針提到舵前面，是把一個氣氛細節當成功能在做，方向就錯了。

   ⚠ 銅針的裝法：它**裝在盤面的背後**，針臂整根藏在頭盤後面（所以不畫），
     只有越過盤緣的那一小截由上方往下扣到盤面正面，扣住刻度環。畫面上看得到
     的就只有那個鉤。這也是為什麼不能把針畫在舵輪前面 —— 那等於一根尖銅片
     橫在舵輪與掌舵者之間，轉舵時手會掃過針尖。整組一律在舵**之後**。

   ⚠ 為什麼掛角是 120° 而不是整圈：軸心壓在畫面底緣，樞紐以下的角度全在畫面
     外，掛角一旦超過 180° 兩端就沒入畫面外。

   ⚠ 為什麼銅針不綁 cam.angle：那是絕對航向，船一轉整根就甩，既不是航向儀也
     不是速度計。控制區的方位帶已撤（要看航向去開地圖），這根專職速度。

   ⚠ tilt：頭盤是俯視的橢圓（縱向被壓扁），刻度與鉤一起套同一個縱向縮放，
     環才箍在盤上而不是浮在盤上。tilt 由素材比例自己算出來，換圖不用改。 */
function gaugeAngle(v){ return -GAUGE_SPAN*0.5+clamp(v,0,1)*GAUGE_SPAN; }   // 自 12 點順時針
const gaugeCA=a=>a-Math.PI*0.5;                 // 上式的角 → canvas arc 角

function drawSpeedScale(cx,cy,R,tilt){
  const dir=(a,r)=>[Math.sin(a)*r,-Math.cos(a)*r];
  ctx.save(); ctx.translate(cx,cy); ctx.scale(1,tilt);
  ctx.lineCap='butt';

  // 盤面上車出來的一道淺凹槽，刻線刻在裡面
  ctx.strokeStyle='rgba(14,10,5,.5)'; ctx.lineWidth=R*0.18;
  ctx.beginPath(); ctx.arc(0,0,R,gaugeCA(gaugeAngle(0)),gaugeCA(gaugeAngle(1))); ctx.stroke();
  // 凹槽內外緣各一道銅線（車出來的邊）
  ctx.strokeStyle='rgba(206,172,98,.32)'; ctx.lineWidth=Math.max(1,R*0.010);
  for(const k of [0.90,1.10]){
    ctx.beginPath(); ctx.arc(0,0,R*k,gaugeCA(gaugeAngle(0)),gaugeCA(gaugeAngle(1))); ctx.stroke();
  }

  // 刻線：每 0.5 一格，每 2.0 一根長刻。不寫數字。
  const n=Math.round(MAX_SPD*2);
  for(let i=0;i<=n;i++){
    const a=gaugeAngle(i/2/MAX_SPD), major=(i%4===0);
    const p0=dir(a,R*(major?0.905:0.955)), p1=dir(a,R*1.09);
    ctx.strokeStyle=major?'#dcc189':'#ac9260';
    ctx.lineWidth=major?Math.max(1.6,R*0.026):Math.max(1,R*0.013);
    ctx.beginPath(); ctx.moveTo(p0[0],p0[1]); ctx.lineTo(p1[0],p1[1]); ctx.stroke();
  }

  // 極速區段紅漆：自滿速的 GAUGE_RED 起到底，刷在凹槽外緣
  ctx.strokeStyle='#9e3625'; ctx.lineWidth=Math.max(1.4,R*0.030);
  ctx.beginPath();
  ctx.arc(0,0,R*1.135,gaugeCA(gaugeAngle(GAUGE_RED)),gaugeCA(gaugeAngle(1)));
  ctx.stroke();
  ctx.restore(); ctx.lineWidth=1;
}

/* 銅針：只畫「扣過盤緣」的那一截 —— 針臂在盤後，看不到就不畫。
   素材原本尖端朝上，這裡上下翻轉成尖端朝盤心，鉤身往外跨過盤緣，
   看起來就是由上方往下扣住刻度環。 */
function drawSpeedNeedle(cx,cy,R,tilt){
  const P=helmArt.pointer; if(!P) return;
  const len=R*HOOK_LEN, pw=len*HOOK_W;
  ctx.save(); ctx.translate(cx,cy); ctx.scale(1,tilt);
  ctx.rotate(gaugeAngle(clamp(cam.speed/MAX_SPD,0,1)));
  ctx.translate(0,-R*1.15);                     // 移到盤緣：鉤跨在這條線上
  ctx.scale(1,-1);                              // 翻轉 → 尖端朝盤心
  ctx.drawImage(P,-pw*0.5,-len*0.5,pw,len);
  ctx.restore();
}

function drawPanel(S){
  const y0=VIEWH, ph=H-VIEWH;
  const g=ctx.createLinearGradient(0,y0,0,H);
  g.addColorStop(0,'#12101a'); g.addColorStop(1,'#08070d');
  ctx.fillStyle=g; ctx.fillRect(0,y0,W,ph);
  ctx.strokeStyle='rgba(201,162,39,.55)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(0,y0+0.5); ctx.lineTo(W,y0+0.5); ctx.stroke();

  /* 舵輪 + 基座：一整組「裝好的舵」，以**舵為準心**取景。
       · 舵軸壓在畫面底緣（HELM_FOOT）→ 只看得到上半輪，把手切出畫面左右，
         那是站在舵後的視角；整輪縮進面板會變成一張圖示。
       · 半徑 R 由「上半輪頂端剛好突出 3D 視窗 HELM_OUT 像素」反推。
       · 基座軸孔對準舵轂（BORE），尺寸跟著舵走（BASE_K）——比畫面寬、
         腳也遠在畫面外，超出的部分直接讓畫面裁掉，不縮小求全。
     ⚠ 順序：基座 → 速度計 → 舵輪。舵輪最後畫才會遮住基座與銅針的一部分，
       那是「基座立在舵的另一側」該有的層次。 */
  const cx=W/2;
  const wcy=H-HELM_FOOT;                 // 舵軸：畫面底緣
  const R=wcy-(y0-HELM_OUT);             // 半徑：上半輪頂到 3D 視窗內 HELM_OUT

  /* ⚙ helm 素材必須用雙線性取樣。resize() 為了地形的像素感把整個 ctx 的
     imageSmoothingEnabled 關掉，但那對舵輪這種圓形素材是災難：512px 的圖
     縮放到非整數倍時，最近鄰會把圓周踩成階梯——輪框外緣與輪轂的銅環
     看起來就是「不圓」（尤其接近 1:1 的縮放比，邊緣會一格一格週期性進出）。
     這一段畫完再關回去（見函式尾），地形的 blit 不受影響。 */
  ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality='high';

  /* ══ 甲板背景（ver -1078）══ 天空層（捲動）→ 甲板層（不動），兩層都在
     基座與舵輪**之後**畫 —— 它們是背景，舵要壓在前面。
     ⚠⚠ 必須在 `imageSmoothingEnabled=true` 的區段裡畫：`resize()` 為了地形的
       像素感把整個 ctx 的平滑關掉，天空層縮放時用最近鄰會出現週期性的階梯邊
       （同上面舵輪那段的坑）。函式尾巴本來就會關回去。
     ⚠⚠ **要裁在面板內**：cover-fit 的高一定 ≥ 面板高，不裁的話會蓋到 3D 視窗
       下緣（交接檔漏了這一條）。
     ⚠ 底下那層 `#12101a → #08070d` 的漸層留著：極端比例下左右會露一點邊。 */
  const DA=deckPair();
  if(DA.deck){
    const D=DA.deck;
    const sc=Math.max(W/D.width, ph/D.height);        // cover-fit 進面板
    const dw=D.width*sc, dh=D.height*sc;
    const dx=(W-dw)/2, dy=y0+(ph-dh)/2;
    ctx.save();
    ctx.beginPath(); ctx.rect(0,y0,W,ph); ctx.clip();
    if(DA.sky){
      const S2=DA.sky, sw0=S2.width*sc, sh0=S2.height*sc;
      const panX=cam.angle*SKY_PAN*W;                  // 轉向：螢幕空間的橫移（不受縮放影響）
      const foX=W/2, foY=dy+SKY_HORIZON*sh0;           // 消失點＝正前方的地平線那一點
      /* ⚠⚠⚠ **基準位置要把消失點擺在圖的正中**（ver -1081，Ray：「我往正前方飛
         還是有左右橫移」）。-1080 把天空層貼在**甲板層的左緣**（`dx`）—— 但天空層
         有兩倍寬（3072 vs 1536），所以它的中心落在畫面中心**右邊 `dw/2`**。
         橫向平鋪時那個偏移看不出來（平移一個貼圖寬長得一樣），**可是一旦以消失點
         為中心放大，偏移就會跟著倍率一起長** ——
             圖心 ＝ foX + k×(基準圖心 − foX)
         基準圖心不等於 `foX` 的話，`k` 一變圖心就橫著跑。那就是他看到的橫移。
         把基準圖心釘在 `foX` 上（`skyX0 = foX − sw0/2`），圖心就恆等於 `foX`，
         任何倍率下都不動 —— 與地平線那一條是同一個道理（算式保證，不是調的）。 */
      const skyX0=foX-sw0/2;
      /* 起降的高度差 → 天空層的縱向位移（見 SKY_ALT_SPAN）。平飛時 `cam.alt`
         恆等於 `CRUISE_ALT`，這一項就是 0 —— 不影響既有的任何一幀。 */
      const altDy=(cam.alt-CRUISE_ALT)/Math.max(1,(CRUISE_ALT-TK_ALT_LOW))*(ph*SKY_ALT_SPAN);
      /* 以 `(foX,foY)` 為中心放大 `k` 倍，再橫向平移 `panX`；橫向折回貼圖寬之內
         （轉舵可以轉到天涯海角，一定要折）。 */
      const layer=(k,alpha)=>{
        if(alpha<=0.004) return;
        const w2=sw0*k, h2=sh0*k;
        const by=foY+(dy-foY)*k+altDy;
        let x=foX+(skyX0-foX)*k+panX;                  // ＝ foX − w2/2 + panX（圖心永遠在 foX）
        x-=Math.ceil(x/w2)*w2;                         // 折到 ≤0 的第一張
        ctx.globalAlpha=alpha;
        for(; x<W; x+=w2) ctx.drawImage(S2, x, by, w2, h2);
      };
      const u=skyZoom-Math.floor(skyZoom);
      layer(Math.pow(SKY_ZOOM_F,u+1), 1);              // 大的那層當底（必然蓋滿）
      layer(Math.pow(SKY_ZOOM_F,u  ), u);              // 小的那層淡入蓋上去
      ctx.globalAlpha=1;
    }
    ctx.drawImage(D, dx, dy, dw, dh);
    ctx.restore();
    /* ══ 接線：方向計坐在一條**跨過接縫的儀表帶**上（ver -1085，Ray：「槍棺的楣
       已經在最底部，我不想在一個畫面放兩個楣」「方向計試試看吧」）══
       上半是**俯視**的地形（霧色偏亮、像素化），下半是**前視**的甲板 ——
       兩個相機硬接在一條線上就是兩張圖被切開；夜景尤其明顯（上面亮霧、下面暗天），
       而且甲板層的索具與桅杆是被切斷的。
       作法：一條**由上而下 透明→實→透明**的暗帶，**中心正好壓在接縫上**，
       上緣起於**方向計的上緣**（`compassRect().y`）。於是
         · 地形往下沉進暗帶、甲板往上沉進暗帶 —— 兩張圖不再直接相碰
         · 方向計正好嵌在暗帶的上半 ＝ 它**就是**那條分隔（不是又一條橫槓）
       讀起來是駕駛艙的遮光罩：儀表裝在罩上，罩擋住視窗的下緣。
       ⚠⚠ 要畫在**舵輪與基座之前**：舵輪頂端本來就突出視窗 `HELM_OUT`px，
         畫在它之後會把那一截鍍暗，那是前景不該被罩到。
       ⚠⚠ 也要畫在 clip **之外**：它跨到面板上方，留在 `rect(0,y0,W,ph)` 裡會被裁掉。
       ⚠ 這一條**不跟著方向計收合**（對白時方向計會滑下去淡掉，見 talkHideEase）——
         罩是結構，儀表才是會收的那個。收掉的話對白期間接縫又露出來了。
       ⚠ 底色與面板漸層的頂端同一個值：罩上去等於把那層底色拉過來，
         不是另外疊一片黑（換底色時不會走鐘）。 */
    {
      const top=compassRect().y, bot=y0+Math.round(ph*SEAM_FADE);
      const t0=(y0-top)/(bot-top);                   // 接縫在這條帶子上的位置
      const G=ctx.createLinearGradient(0,top,0,bot);
      G.addColorStop(0,          'rgba(18,16,26,0)');
      G.addColorStop(t0*0.60,    'rgba(18,16,26,.55)');
      G.addColorStop(t0,         'rgba(18,16,26,1)');
      G.addColorStop(1,          'rgba(18,16,26,0)');
      ctx.fillStyle=G; ctx.fillRect(0,top,W,bot-top);
    }
    /* ⚠⚠ 金線要**畫在甲板之後**：函式開頭那一條（y0+0.5）畫得比甲板早，
       整條被甲板層蓋掉了 —— 所以「本來就有的畫框線」一直沒出現在畫面上。
       ⚠ 它現在落在暗帶最實的那一列 ＝ 罩子上的一道黃銅飾條。 */
    ctx.strokeStyle='rgba(201,162,39,.55)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(0,y0+0.5); ctx.lineTo(W,y0+0.5); ctx.stroke();
  }

  let gaugeR=R*0.47, tilt=0.86;          // 基座沒載到時的退路
  if(helmArt.base){
    const B=helmArt.base;
    const bw=R*2*BASE_K, bh=bw*B.height/B.width;
    // ⚠ 橫向用 BORE.x 而不是 0.5：軸孔本來就不在圖的正中央，
    //   用圖中心對齊會讓整座基座相對舵軸偏左。
    ctx.drawImage(B, cx-bw*BORE.x, wcy-bh*BORE.y, bw, bh);
    const headR=HEAD_R*bw;               // 頭盤橫向半徑
    gaugeR=headR*GAUGE_K;
    // 頭盤是俯視橢圓：縱向半徑＝軸孔到圖頂的距離，兩者相除即為縱向壓扁比例
    tilt=clamp((BORE.y*bh)/headR,0.5,1);
  }

  drawSpeedScale (cx,wcy,gaugeR,tilt);     // 刻度環：刻在頭盤面上
  drawSpeedNeedle(cx,wcy,gaugeR,tilt);     // 銅針：扣在盤緣上（針臂在盤後，不畫）

  /* 舵輪最後畫 —— 它在最前面，會遮住基座、刻度環與銅針的一部分。
     那是對的層次：基座立在舵的另一側，指針裝在盤背後。任何東西浮在舵之前，
     等於橫在舵輪與掌舵者之間，轉舵時手會掃過去。
     ⚠ 裁掉軸心以下：底緣那 HELM_FOOT 像素不該露出下半輪的一截。 */
  if(helmArt.wheel){
    ctx.save();
    ctx.beginPath(); ctx.rect(0,0,W,wcy); ctx.clip();
    ctx.translate(cx,wcy); ctx.rotate(wheelAng);
    ctx.drawImage(helmArt.wheel, -R, -R, R*2, R*2);
    ctx.restore();
  }
  ctx.imageSmoothingEnabled=false;         // 還給地形 blit（像素感靠它）
  /* ── 橫條羅盤帶：船與控制區之間 ───────────────────────────────
     位置定在 3D 視窗下緣、舵輪突出線之上（y0−HELM_OUT−24）——
     那正好是船的下方、面板的上方，兩者之間唯一的空檔。
     ⚠ 要避開舵輪突出的那一段（HELM_OUT），否則會被輪緣壓住。
     ⚠ 掃的是「方位」不是螢幕位置：先取最近的 15° 整數倍當基準，再算它
       此刻該落在螢幕哪裡。反過來寫（掃固定螢幕位置再問那裡是不是八方位）
       會變成 13 格裡只有三種可能值，得靠航向恰好對齊才命中方位字，
       實測只有約 13% 的航向看得到字，其餘時候整條只剩刻點。
       羅盤卡在轉、指標不動，本來就該這樣算。 */
  const deg=((-cam.angle*180/Math.PI)%360+360)%360;
  /* ⚠ 幾何走 compassRect()：疲勞對話框要與這一條同寬對齊，兩邊各寫一份會走鐘。 */
  const CR=compassRect();
  /* 對話中往下滑出並淡掉。進度由 loop() 推進，這裡只讀現值。 */
  const hid=talkHideEase();
  if(hid>=0.999) return;
  ctx.save();
  ctx.globalAlpha=1-hid;
  ctx.translate(0,talkHideDy()*hid);
  const bw2=CR.w-12, cbx=CR.x+6;                    // ⚠ 不能叫 bx，上面基座已用掉
  const ccy=CR.y+17;
  ctx.fillStyle='rgba(6,7,12,.55)';
  ctx.fillRect(CR.x,CR.y,CR.w,CR.h);
  ctx.save();
  ctx.beginPath(); ctx.rect(cbx,ccy-16,bw2,32); ctx.clip();
  ctx.font='10px "Noto Serif TC",serif'; ctx.textAlign='center';
  const base=Math.round(deg/15)*15;
  for(let k=-7;k<=7;k++){
    const a=base+k*15;                              // 這一格代表的方位
    const px=cbx+bw2/2+(a-deg)/90*(bw2/2);          // 相對航向 → 螢幕位置
    if(px<cbx-4||px>cbx+bw2+4) continue;
    const an=((a%360)+360)%360;
    const major=an%45===0;
    ctx.strokeStyle=major?'rgba(201,162,39,.65)':'rgba(216,205,180,.22)';
    ctx.beginPath(); ctx.moveTo(px,ccy+4); ctx.lineTo(px,ccy+(major?-2:1)); ctx.stroke();
    if(major){
      ctx.fillStyle='rgba(216,205,180,.75)';
      ctx.fillText(['北','東北','東','東南','南','西南','西','西北'][(an/45)%8],px,ccy-6);
    }
  }
  ctx.restore();
  drawBearingLights(CR, cbx, bw2, deg);
  /* ── Sturm 充能：從中間向兩邊發光 ──────────────────────────────
     ⚠ 用 `lighter` 疊加而不是實色覆蓋：方向計的刻度與方位字要透出來，
       蓋掉的話按住的兩秒等於看不到航向。
     ⚠ 漸層以**中線**為中心往兩側衰減，所以視覺上是「從中間長出去」，
       而不是一整條同時變亮 —— Ray 指定的就是這個方向感。 */
  {
    const nowS=performance.now();
    /* ── 冷卻中：一條**細而暗**的進度，同樣從中間往兩邊長 ────────────
       ⚠ 與「正在充能」共用方向感（都從中間長出去），但**亮度與厚度差一個量級**
         —— 兩者要能一眼分開：亮而滿版＝手指按著在充，暗而細＝在等冷卻。 */
    if(sturmReady>nowS){
      const cd=clamp(1-(sturmReady-nowS)/STURM_CD_MS,0,1);
      const cx0=cbx+bw2/2, hf=bw2*0.5*cd;
      const gg=ctx.createLinearGradient(cx0-hf,0,cx0+hf,0);
      gg.addColorStop(0,'rgba(201,162,39,0)');
      gg.addColorStop(0.5,'rgba(201,162,39,.42)');
      gg.addColorStop(1,'rgba(201,162,39,0)');
      ctx.fillStyle=gg;
      ctx.fillRect(cx0-hf, CR.y+CR.h-3, hf*2, 2);
    }
    /* ── 冷卻完成：閃一下（Ray 指定「讓玩家知道 CD 完成」）────────────
       ⚠ 一次性、短：邊緣觸發設的旗標，時間到就自己歸零，不會一直閃。 */
    if(sturmRdyFlash){
      const ft=(nowS-sturmRdyFlash)/RDY_FLASH_MS;
      if(ft>=1) sturmRdyFlash=0;
      else{
        const fa=Math.sin(Math.PI*clamp(ft,0,1));
        ctx.save();
        ctx.globalCompositeOperation='lighter';
        ctx.fillStyle='rgba(255,226,140,'+(0.28*fa).toFixed(3)+')';
        ctx.fillRect(CR.x,CR.y,CR.w,CR.h);
        ctx.restore();
        ctx.strokeStyle='rgba(255,226,140,'+(0.95*fa).toFixed(3)+')';
        ctx.lineWidth=1.5;
        ctx.strokeRect(CR.x+0.75,CR.y+0.75,CR.w-1.5,CR.h-1.5);
      }
    }
    const p = sturmT0 ? clamp((nowS-sturmT0)/STURM_HOLD_MS,0,1) : 0;
    if(p>0.001){
      const cx=cbx+bw2/2, half=bw2*0.5*p;
      const g=ctx.createLinearGradient(cx-half,0,cx+half,0);
      g.addColorStop(0,   'rgba(201,162,39,0)');
      g.addColorStop(0.5, 'rgba(255,226,140,'+(0.30+0.45*p).toFixed(3)+')');
      g.addColorStop(1,   'rgba(201,162,39,0)');
      ctx.save();
      ctx.globalCompositeOperation='lighter';
      ctx.fillStyle=g;
      ctx.fillRect(cx-half, CR.y, half*2, CR.h);
      ctx.restore();
      /* 充滿的那一刻把整條描一圈金邊，給一個明確的「可以放手了」。 */
      if(p>=1){
        ctx.strokeStyle='rgba(255,226,140,.9)'; ctx.lineWidth=1.5;
        ctx.strokeRect(CR.x+0.75,CR.y+0.75,CR.w-1.5,CR.h-1.5);
      }
    }
  }
  ctx.strokeStyle='#c9a227';                        // 中央指標（不動）
  ctx.beginPath(); ctx.moveTo(cbx+bw2/2,ccy-16); ctx.lineTo(cbx+bw2/2,ccy+9); ctx.stroke();
  ctx.restore();          // ⚠ 對應收起動畫那個 save（translate + globalAlpha）
  ctx.textAlign='left';
}

/* ── 主迴圈 ─────────────────────────────────────────────────────── */
let last=performance.now(),acc=0,n=0;
/* ── 畫質調節器 ───────────────────────────────────────────────────
   收集每幀的**工作時間**（不是 rAF 間隔，理由見 QUALITY 的說明），取中位數。
   一幀的預算是 16.7ms，但瀏覽器自己的合成、GC、事件處理也要吃 —— 所以
   守的是 12ms，留 4~5ms 餘裕。
   ⚠ 樣本要夠多才動：單幀的尖峰（GC、載入城的貼圖、切歌）到處都是，
     看一幀就降級的話會在載入途中無緣無故掉到最低畫質再也回不來。
   ⚠ 升級要看更久、門檻更低（7ms），而且升上去之後把計數清掉重新觀察 ——
     升到一半又掉下來會變成每兩秒抖一次，比一直待在低畫質更難看。 */
/* ══⚠⚠⚠ GPU 計時器（ver -1302，純量測，不動任何繪圖）══════════════════
   Ray：「應該要查的是優化跟效能分配問題」。

   ⚠⚠ **效能分配的病根**：HUD 上的 `w`（每幀工作時間）量的是 **CPU 送出指令**
     的時間，不是那一幀真正花掉的時間。ver -1198~-1223 把地形／量體／遺蹟／
     地貌貼圖整批搬上 GPU 之後，那些 commit 記的「3~11ms → 0.14ms」「7.7 → 1.5」
     「120.6 → 3.5」全都是這個指標 —— 成本沒有消失，是**搬到了它看不見的地方**。
   ⚠⚠ 連帶把畫質調節器一起帶歪：`qualityTick(workMs)` 吃的是同一個數字，
     於是 `med<7ms → 升畫質` 永遠成立、`med>12ms → 降畫質` 永遠不成立 ——
     它會一路推到 q0 而且再也不降，但 GPU 早就滿了。
   ⚠ 所以要先把 **GPU 那一段真的量出來**，才談得上分配。這一支只做量測：
     `beginQuery` 包住整個 render，讀到的是那一幀所有 GL 指令在 GPU 上的耗時。
   ⚠ 結果是**非同步**的（要等 GPU 跑完），所以是「這一幀問上一批的答案」——
     排成佇列輪詢，不要 `finish()` 去等（那會把管線打斷，量到的是被自己干擾的數字）。
   ⚠ `disjoint` 旗標拉起來代表那一批量測作廢（驅動被搶走／換頻率），要整批丟掉。
   ⚠ 沒有這個擴充功能（多數行動裝置都沒有）就整支靜靜關掉，HUD 不印那一欄。 */
let gpuExt=null, gpuQ=[], gpuCur=null, gSm=0, gpuOff=false;
function gpuTimerBegin(){
  if(gpuOff || !GLX || !glReady) return;
  if(gpuExt===null){
    try{ gpuExt = GLX.getExtension('EXT_disjoint_timer_query_webgl2') || false; }catch(e){ gpuExt=false; }
    if(!gpuExt){ gpuOff=true; return; }
  }
  if(gpuQ.length>=4) return;            // 佇列滿了就跳過這一幀，不要無限堆
  try{
    const q=GLX.createQuery();
    GLX.beginQuery(gpuExt.TIME_ELAPSED_EXT, q);
    gpuCur=q;
  }catch(e){ gpuOff=true; gpuCur=null; }
}
function gpuTimerEnd(){
  if(gpuCur){
    try{ GLX.endQuery(gpuExt.TIME_ELAPSED_EXT); gpuQ.push(gpuCur); }catch(e){ gpuOff=true; }
    gpuCur=null;
  }
  /* ⚠⚠ 輪詢要**無條件**跑，不可以掛在「這一幀有沒有開新的查詢」下面：
     佇列滿了 `gpuTimerBegin` 會跳過 → `gpuCur` 是空的 → 早期版本在這裡就
     `return` → **再也不會輪詢**，整支永遠卡在滿佇列（實測就卡住了）。
     這與「任何可能不會被呼叫的回呼，都不可以是唯一的解鎖點」（§6.5.5）同一族。 */
  if(gpuOff || !gpuExt || !GLX || !glReady || !gpuQ.length) return;
  try{
    const q=gpuQ[0]; if(!q) return;
    if(GLX.getParameter(gpuExt.GPU_DISJOINT_EXT)){ gpuQ.forEach(x=>GLX.deleteQuery(x)); gpuQ=[]; return; }
    if(!GLX.getQueryParameter(q, GLX.QUERY_RESULT_AVAILABLE)) return;
    const ns=GLX.getQueryParameter(q, GLX.QUERY_RESULT);
    GLX.deleteQuery(q); gpuQ.shift();
    const ms=ns/1e6;
    gSm = gSm ? gSm*0.9+ms*0.1 : ms;
  }catch(e){ gpuOff=true; }
}
function gpuTimerText(){ return gSm ? ' g'+gSm.toFixed(1) : ''; }

const QF=[]; let qCool=0; let wSm=0;
/* ⚠⚠⚠ **越卡要降得越快**（ver -1303，效能分配）══════════════════════════
   舊版的取樣窗與靜置期都是**用幀數算**的（40 幀才第一次評、換檔後靜置 90 幀）。
   那在 60fps 下是 0.7 秒與 1.5 秒，很合理；**但幀率正是它要修的那個量** ——
   實測 Ray 的機器（GT 1030，GPU 100%／79°C）掉到 2fps 時，
   40 幀＝20 秒、90 幀＝45 秒 ⇒ **降一級要一分多鐘，從 q0 降到 q4 要四分鐘以上**。
   越需要它快的時候它越慢，這就是分配錯誤。

   作法：**嚴重超支就立刻降**，不必等滿窗、也不吃靜置期。
   · 門檻 `PANIC_MS`（24ms ＝預算的兩倍）：中位數過它就是「這台明顯吃不下」。
   · 只要 `PANIC_MIN` 幀（8 幀）就足以判定 —— 那不是雜訊，是持續的超支。
   ⚠ 只放寬**降級**這一邊。升級照舊要看滿 90 幀、而且門檻更低（7ms）——
     升上去又掉下來會變成每兩秒抖一次，比一直待在低畫質更難看（原本的理由不變）。
   ⚠ 單幀的尖峰仍然不算數（GC、載入城的貼圖、切歌）：看的是**中位數**，
     所以連續 8 幀都在 24ms 以上才會動，偶發的一兩幀打不到它。 */
const PANIC_MS = 24, PANIC_MIN = 8;
function qualityTick(workMs){
  if(qLocked) return;
  QF.push(workMs);
  if(QF.length>90) QF.shift();
  /* ① 恐慌降級：不等滿窗、不吃靜置期。 */
  if(QF.length>=PANIC_MIN && qLevel<QUALITY.length-1){
    const tail=QF.slice(-PANIC_MIN).sort((x,y)=>x-y);
    if(tail[tail.length>>1] > PANIC_MS){ qLevel++; onQualityChange(); return; }
  }
  /* ② 平時的評估（原本那一套，一個字沒改）。 */
  if(QF.length<40) return;
  if(qCool>0){ qCool--; return; }
  const a=QF.slice().sort((x,y)=>x-y), med=a[a.length>>1];
  if(med>12 && qLevel<QUALITY.length-1){ qLevel++; onQualityChange(); }
  else if(med<7 && qLevel>0 && QF.length>=90){ qLevel--; onQualityChange(); }
}
function onQualityChange(){
  QF.length=0;
  qCool=90;          // 換檔後靜置約 1.5 秒再評，避免 resize 那一兩幀被算進去
  resize();          // 排程重建（真正的重建在下一幀開頭，見 resize 的說明）
  /* ⚠ 預縮圖的清除已搬進 applyResize —— 要跟 DPR **實際**改變的那一刻同步。
     留在這裡的話，清掉之後到下一幀重建之間若有人重畫立繪，會用舊 DPR
     再生一份並留下來。 */
}

function loop(now){
  const dt=Math.min(40,now-last); last=now;
  /* ══⚠⚠⚠ 降落鈕要在**所有早退之前**更新（ver -1170，Ray：「飛行畫面對話中
     不要有降落選項」）══
     `updateLandBtn()` 本來排在迴圈尾端 —— 而它上面有三道早退（父頁暫停／大地圖、
     **對白中**、升降過場），那幾種狀態一開始，這一支就再也不跑，鈕**保持在進入
     那個狀態之前的樣子**。所以對白一開始時若鈕剛好亮著，它會**整段對白都亮著**，
     浮在立繪正中央 —— 那就是 Ray 看到的東西。
     ⚠⚠ 把判斷寫進 `busy` 是不夠的：**沒有人去問它**。
       這是「狀態沒有人更新」而不是「狀態算錯」—— 查的時候差一步就會修錯地方。
     ⚠ 成本可以忽略：`busy` 成立時它連掃都不掃就 return。 */
  updateLandBtn();
  /* ⚠⚠ 父頁說停（畫面收起／戰鬥中／整備・設定窗蓋著）＝整幀跳過（ver -481）：
     不更新也不畫 —— 反正看不見。dt 已經吃掉（last=now），恢復那一幀不會補跑。
     ⚠ **開大地圖也凍**（ver -776，Ray：「開大地圖、整備頁、選單、回主選單期間
       飛行地圖 freeze，就算有怪也不會進入戰鬥」）——整備／選單已由 extPaused
       蓋到（__flightHoldToggle），回主選單整個殺掉 iframe，只有大地圖（DOM 罩在
       canvas 上）漏了：不凍的話怪照生照追、toBattle 照彈棺。地圖有自己的
       draw／resize，凍住整個 loop 不影響它。 */
  if(extPaused || mapOpen){ requestAnimationFrame(loop); return; }
  flushResize();     // 重建畫布只在這裡發生 —— 緊接著就是 render，不會露出空畫布
  talkHideStep(now); // ⚠ 方向計收合進度：一定要在這裡推，不能掛在 drawTalk（見該處說明）
  /* ⚠⚠ **對話中＝遊戲暫停**（ver -481，Ray：「對話期間不要生怪…一邊點對話一邊怪
     往我衝過來，對話都點不完」）：世界不推（船、怪、刷新計時、火車、軟邊界），
     只畫（立繪與框在 render 裡）＋ 音樂淡接照走。對白一收，下一幀世界接著動 ——
     出薩梅爾的劇本蜈蚣也是在那一幀立刻刷（scriptedDue 不排隊）。 */
  const talking = !!(sayQueue && !sayEndAt);
  if(talking){ render(now); updateBgm(dt); requestAnimationFrame(loop); return; }
  /* 升空／進城過場（ver -781；-783 守門改看 takeoffPlaying）：照 render（下降／上升、
     雲動看得到）但**不 update** —— 不生怪、船不動、不進戰鬥，**也不讓 update 的
     `cam.alt=CRUISE_ALT` 把高度重設回 700**。有 altTween 時由它驅動 cam.alt；
     HOLD 期間（takeoffPlaying 真、altTween 還沒設）cam.alt 維持 playTakeoff 設的 100。 */
  if(takeoffPlaying){
    if(altTween){
      const t=clamp((now-altTween.t0)/altTween.dur,0,1);
      let e;
      if(altTween.ease==='takeoff'){
        /* 升空（ver -784，Ray：「加速感是**先慢後快**，不要全程等速」＋「到頂上下
           晃一下」）：-783 的欠阻尼彈簧速度前段最快（讀起來偏先快），改成**分段**——
           前 70% 用 u² **加速上升**（逐步位移單調遞增＝真的先慢後快）衝到 1.05 過衝點，
           後 30% 阻尼晃回 1.0（到頂衝 ~730 → 下擺 ~693 → 回穩 700）。 */
        const P=0.70;
        if(t<P){ const u=t/P; e=1.05*u*u; }
        else{ const u=(t-P)/(1-P); e=1 + 0.05*Math.cos(1.5*Math.PI*u)*Math.exp(-2.2*u); }
      }else if(altTween.ease==='dropbob'){
        /* 降落（ver -783；-784 修方向）：前 22% 小幅阻尼擺盪（sin 正相＝alt 先下
           後上，因 to<from）→ 之後**先快後慢**下降（Ray：「降落則相反」＝與升空的
           先慢後快相反＝減速煞停 ease-out）。 */
        const T=0.22;
        if(t<T){ const u=t/T; e=0.06*Math.sin(2*Math.PI*u)*(1-u); }
        else{ const u=(t-T)/(1-T); e=1-(1-u)*(1-u); }
      }else if(altTween.easeIn){ e=t*t;                  // 加速降（退路）
      }else{ e=1-(1-t)*(1-t); }                          // 減速升（退路）
      cam.alt=altTween.from+(altTween.to-altTween.from)*e;
    }
    render(now); updateBgm(dt); requestAnimationFrame(loop); return;
  }
  edgeNag(now);      // 快飛出圖了 → 蕾娜叫你回頭（軟邊界）
  const wt0=performance.now();
  gpuTimerBegin();
  update(dt,now); updateRegion(now); updateTrains(dt/1000); render(now); updateBgm(dt); updateMapMe();
  gpuTimerEnd();
  { const w=performance.now()-wt0; qualityTick(w);
    /* ⚠ HUD 要同時有「每秒幾張」與「一幀算多久」（ver -1213）。
       只有 fps 的話分不出兩件完全不同的事：**我們算太慢**（work 接近 16ms），
       還是**螢幕本來就只給 30Hz**（work 3ms 卻還是 30fps ＝ iOS 低耗電模式、
       或系統節流）。Ray 回報「fps 穩定在 30」時我手上沒有這個數字，
       就只能猜 —— 那正是要避免的。 */
    wSm = wSm ? wSm*0.9+w*0.1 : w; }
  acc+=dt;n++;
  /* HUD 加上**地圖座標與航向** —— 截圖時才知道人在哪。
     先前每次回報都得靠地形猜位置，猜錯就修錯地方。座標用地圖像素
     （與 SETTLEMENTS／build_city.py 同一套單位），可以直接拿去對資料。 */
  if(acc>500){
    const mx=Math.round(cam.x/MAP_SCALE), my=Math.round(cam.y/MAP_SCALE);
    const deg=Math.round(((cam.angle*180/Math.PI)%360+360)%360);
    /* ⚠ 版本號一定要在 HUD 上（ver -307）。先前有整整一輪的來回是因為分不清
       「回報的畫面跑的是哪一版」—— 我量到改善、Ray 看到一模一樣，兩邊講的
       其實可能不是同一份程式。截圖裡看得到版本，這一整類誤會就消失了。
       ⚠ 這一頁是獨立的 HTML，讀不到 config.js 的 VERSION（那是 ESM），
         所以在建置時由 tools 同步；沒同步到就會停在舊字串，看到不合的
         版本號先查這裡。 */
    document.getElementById('fps').textContent=
      FLIGHT_VER+'  '+Math.round(1000/(acc/n))+' fps '+BW+'×'+BH+' q'+qLevel+(qLocked?'!':'')
      /* ⚠ 「現在走的是哪一條渲染路徑」一定要印出來（ver -1212）。-1211 那一次
         Ray 在手機上回報「卡頓更嚴重了」，實際上他跑的是 CPU 路徑 —— 因為
         `?gl=1` 讀的是這一頁自己的網址，而主遊戲是把它當 iframe 內嵌的。
         截圖裡看得到 gpu/cpu，這一整類誤判就不會再發生（同版本號那一條）。 */
      +(GLON&&glReady?' gpu':(GPU_SOFT?' cpu(sw)':' cpu'))+' w'+wSm.toFixed(1)+gpuTimerText()
      +'  ('+mx+','+my+') '+deg+'° h'+Math.round(cam.alt);
    acc=0;n=0;
  }
  requestAnimationFrame(loop);
}

/* ══ 載入畫面 ══
   ⚠ 這是**獨立的一份**，不共用主程式的 #assetLoader。樣式照搬（金色進度圈
     ＋監察官立繪＋對話框輪播），但提示內容自成一組 —— 這裡日後要放
     船艦／航行教學，跟戰鬥那側的教學是兩回事，共用的話改一邊就會動到另一邊。

/* 操作說明：輪播在讀取畫面上（Ray 指定放回來）。

const BOOT_HINTS=[

  '右上角「地圖」可查看大陸全貌與自己的位置，放大可見市鎮街廓。',

];
/* ══ 讀取頁的說明者（ver -425，Ray：「出航之後換成蕾娜」）══════════════════
   ⚠⚠ 這是 `config.loadingHost` 的**第二份**（這一頁是非 module 的獨立文件，

   ⚠ 旗標與主遊戲共用同一把鑰匙（`tivot_flags_v1`，§6.10）。 */
const BOOT_HOST = {
  flag:'set_sail',
  before:{ name:'監察官　フレイヤ', img:'../resources/inspector/freya_si_01.webp' },

const bootUI=(()=>{

  const HOLD=5000, FADE=400;
  /* 光圈／立繪自己淡進淡出的長度。⚠ 與上面 CSS 的 `#boot #bRing{transition:.26s}`
     同一個量（改一邊要看另一邊）。 */
  const BLANK_MS=260;
  const hints=BOOT_HINTS.slice();
  for(let i=hints.length-1;i>0;i--){ const j=Math.random()*(i+1)|0; [hints[i],hints[j]]=[hints[j],hints[i]]; }
  let hintI=0, timer=0;
  const im=$('bPortrait');
  im.onload=()=>im.classList.add('on');
  const host=bootHost();
  im.src=host.img;
  $('bName').textContent=host.name;
  function cycle(){
    const h=$('bHint');
    h.textContent=hints[hintI++ % hints.length];
    h.classList.add('on');                       // 淡入
    timer=setTimeout(()=>{
      h.classList.remove('on');                  // 淡出
      timer=setTimeout(cycle, FADE+50);

     ⚠ 要隔一幀（`requestAnimationFrame` 兩次）才拿得掉，同主程式 showLoader 的理由：
       同一幀加上又拿掉會被合併成一次計算，過場整個跳掉。 */
  {

      b.classList.add('blank');
      requestAnimationFrame(()=>requestAnimationFrame(()=>b.classList.remove('blank')));

    set(p){
      $('bProg').setAttribute('stroke-dashoffset', (RING*(1-clamp(p,0,1))).toFixed(1));
      $('bPct').textContent=Math.round(clamp(p,0,1)*100)+'%';

       ⚠⚠ **兩段**（ver -439）：先把光圈與立繪收掉（`.blank`，剩一片黑），
         再把黑掀開 —— 直接淡整層的話玩家會看到光圈與飛行畫面疊在一起。 */
    done(){ clearTimeout(timer); const b=$('boot'); if(!b) return;
      b.classList.add('blank');
      setTimeout(()=>{
        /* ⚠⚠ 升空過場要在讀取頁**淡出之前**啟動（ver -783，Ray：「出城卻會先 700
           再跳 100 再升 700，應該一出城就是 100」）—— 它會立刻把 cam.alt 設 100
           ＋蓋上黑幕。讀取頁本來就是黑的，淡進起飛的黑幕是無縫的；不先設好的話
           那 480ms 淡出會露出 alt 700 的畫面（就是那個「先 700」）。 */
        /* ⚠ 戰鬥回程不升空（ver -846，Ray：「空中戰結束以後不用再做升空的動作」）——
           船本來就在巡航高度的遭遇座標（回程鑰匙帶的 alt），再演一次「從 100 升到
           700」是把打完仗讀成又出了一次城。讀取頁自己的淡出照走，掀開就是巡航畫面。 */
        try{ if(!retFromBattle) playTakeoff(); }catch(_){}
        b.classList.add('fade');
        setTimeout(()=>b.classList.add('hide'), 480);
      }, BLANK_MS); },
  };
})();

/* ══ 起降過場（ver -781，Ray 定案「用高度維度」——VP1 沒有、我們的優勢）══
   topdown 那套整組放棄。改用**真的 cam.alt**：
     · 出城（起飛）＝從全黑起 → 高度由 100 快速升回巡航 700、黑幕淡出、地平線浮現。
     · 進城（降落）＝高度由 700 快速降到 100、鏡頭拉近、雲霧撲面、**1 秒內整個畫面
       （含操作面盤）淡到全黑**，觸底（100）前黑幕就淡完，然後交棒進城。
   ⚠ 期間 `altTween`：loop 只 render 不 update（我自己驅動 cam.alt，見 loop 守門）。
   ⚠ 黑幕蓋在**最上層**（z 100）—— 連舵輪面盤（畫在 canvas 上）也一起黑。
   ⚠ 雲霧撲面：一層白霧從中央擴散＋淡出（撲向鏡頭）。 */
let takeoffPlaying=false;
let altTween=null;                                    // { from, to, t0, dur, easeIn }
const TK_ALT_LOW=400;                                 // 起降的低點（ver -790，Ray：「700～400，100 太低有些高地城市會潛入」）
function tkOverlay(){
  if(!document.getElementById('tkCSS')){
    const st=document.createElement('style'); st.id='tkCSS';
    st.textContent=
      '#takeoff{position:fixed;inset:0;z-index:100;overflow:hidden;pointer-events:none;}'
      +'#takeoff .tk-black{position:absolute;inset:0;background:#05040a;opacity:0;}'
      +'#takeoff .tk-fog{position:absolute;inset:-20%;pointer-events:none;opacity:0;'
      +'background:radial-gradient(60% 45% at 50% 48%,rgba(240,244,250,.95),'
      +'rgba(226,232,240,.55) 45%,transparent 78%);}';
    document.head.appendChild(st);
  }
  const ov=document.createElement('div'); ov.id='takeoff';
  ov.innerHTML='<div class="tk-fog"></div><div class="tk-black"></div>';
  document.body.appendChild(ov);
  return ov;
}
/* 出城（起飛）：**一出城就是 100**（ver -783，Ray）——立刻設 alt=100＋黑幕全黑
   （撐住蓋過讀取頁淡出，不露 700）→ 停一下 → 同步「黑幕淡出＋高度 100→700 上升」，
   掀開第一眼就是低空從黑裡浮現。與進城完全對稱（反向）。 */
/* 升空／降落的過場演完了沒。⚠ 保險絲 12 秒：萬一旗標因故沒收，戲不能卡在這裡
   （同 `s9RideWait` 的作法）。 */
function afterTakeoff(fn, t0){
  t0=t0||performance.now();
  if((takeoffPlaying || altTween) && performance.now()-t0 < 12000){
    setTimeout(()=>afterTakeoff(fn,t0), 120); return;
  }
  fn();
}
function playTakeoff(){
  if(takeoffPlaying || altTween) return;
  takeoffPlaying=true;
  cam.alt=TK_ALT_LOW;                                 // 立刻低空，不留 700
  const ov=tkOverlay(), bk=ov.querySelector('.tk-black'), fog=ov.querySelector('.tk-fog');
  bk.style.opacity='1'; fog.style.opacity='.9';       // 全黑＋雲霧，先撐住（蓋讀取頁淡出）
  const HOLD=520;                                     // 撐住的時間（≈讀取頁淡出 480ms）
  setTimeout(()=>{
    /* 阻尼上升（ver -783）：easeOutBack 過衝到頂再落回＝「上下晃一下」；
       dur 2000 讓加速＋過衝＋回穩都看得出來。 */
    altTween={ from:TK_ALT_LOW, to:CRUISE_ALT, t0:performance.now(), dur:2000, ease:'takeoff' };
    bk.style.transition='opacity 1.2s ease-out'; bk.style.opacity='0';    // 黑幕淡出（與上升同步）
    fog.style.transition='opacity 1.2s ease-out'; fog.style.opacity='0';  // 雲霧散
  }, HOLD);
  setTimeout(()=>{ altTween=null; cam.alt=CRUISE_ALT; try{ ov.remove(); }catch(_){}
                   takeoffPlaying=false; }, HOLD+2060);
}
/* 進城（降落）：高度 700→100 快速降＋雲霧撲面＋1 秒淡全黑，觸底前黑幕淡完 → done()。 */
function playLanding(done){
  if(altTween){ done&&done(); return; }
  takeoffPlaying=true;
  const A0=cam.alt||CRUISE_ALT;
  const ov=tkOverlay(), bk=ov.querySelector('.tk-black'), fog=ov.querySelector('.tk-fog');
  /* 降速 ver -782 慢 30%（1150→1500）；淡入從降落一開始就同步啟動（rAF 第一幀）、
     時長跟著拉到 1.3s，於觸底（1.5s）前淡完。 */
  altTween={ from:A0, to:TK_ALT_LOW, t0:performance.now(), dur:1700, ease:'dropbob' };  // 先晃再加速降
  requestAnimationFrame(()=>{
    bk.style.transition='opacity 1.45s ease-in'; bk.style.opacity='1';   // 淡全黑（與降落同步起，觸底前淡完）
    fog.style.transition='opacity 1.25s ease-in'; fog.style.opacity='.92';  // 雲霧撲面
  });
  /* 黑幕淡完（~1.3s，早於觸底 1.5s）→ 交棒。⚠ 交棒後這一頁被父頁收掉，
     overlay 不必自己移除；altTween 歸零、高度復位給下一趟。 */
  setTimeout(()=>{ altTween=null; cam.alt=CRUISE_ALT; takeoffPlaying=false;
                   done&&done(); }, 1470);
}

/* ⚠⚠ **音效全部 → 圖 → BGM，音效不載完不放行**（ver -430，Ray 指定的全域規則，
   憲法 §6.6）。這一頁以前是**反過來的**：地形與船艦圖先跑完、讀取頁收掉，
   感應心跳／神楽鈴／Sturm 那幾支要等 1.2 秒後才在背景抓 —— 慢網下長按感應時
   心跳根本還沒到手。
   ⚠ 這一頁的音效走 **HTMLAudio**（不是主遊戲的 WebAudio 解碼），所以「載完」＝
     `canplaythrough`。逐支給 8 秒的保底：一支抓不到不能把整頁擋死。
   ⚠ 環境音與 BGM **不在這一段**：它們排在最後（`makeLoop` 自己 `preload='auto'`），
     而且晚到只是晚幾百毫秒起播。 */
function preloadSfx(){
  const list=[senseBeat, senseSE, sturmSE, kerbPopSE].filter(Boolean);
  return Promise.all(list.map(a=>new Promise(res=>{
    if(a.readyState>=4) return res();
    const fin=()=>{ a.removeEventListener('canplaythrough',fin); a.removeEventListener('error',fin); res(); };
    a.addEventListener('canplaythrough',fin); a.addEventListener('error',fin);
    setTimeout(fin, 8000);            // 保底：一支卡住不能擋死整頁
    try{ a.load(); }catch(_){ fin(); }
  })));
}
(async()=>{
  const t0=performance.now();
  try{
    bootUI.set(0.04);   // ① 音效（不設總時限，見 preloadSfx）
    await preloadSfx();
    /* ⚠ crisis 跟著讀取頁一起抓，但**不擋放行**（ver -1064）：它是一首曲子，
       §6.6 的順序是「音效 → 圖 → 音樂」，音樂本來就排最後、晚到只是晚起播。
       這裡只是在音效段結束時把它踢下去，讓它與圖並行下載 ——
       等到真的用到（羽蛇／墜船）通常早就好了。 */
    try{ crisisLoop.load(); }catch(_){}
    bootUI.set(0.10);   // 準備雜訊貼圖…
    genCloudTex(); genDetail(); genStrat();
    bootUI.set(0.16);
    await loadWorld();  // ② 圖
    bootUI.set(0.82);   // 載入船艦圖層…
    // 船的素材缺了也照跑（走程序圖層），所以不放進上面的 try 依賴鏈裡擋開場
    await loadShipArt();
    initPuffs();
    initStars();
    bootUI.set(1);
    window.__loadMs=Math.round(performance.now()-t0);
    // 感應的立繪與各角色立繪：開場跑完才在背景抓（圖晚到不會壞，音效已經在上面等過了）
    setTimeout(()=>{ senseArt(); spotArt();
                     for(const k in PORTRAIT) portraitArt(k); }, 1200);
    window.__map=MAPW+'×'+MAPH;
    // 進度圈跑到滿再收，不要瞬間閃掉
    setTimeout(()=>bootUI.done(),260);
    /* ══ 戰鬥回程（ver -845，殺掉重載那條）══ 上下文在回程鑰匙（restoreFlightPos
       收進 retCtx），勝負由父頁在重開前補進 `won` 欄。等畫面真的還給玩家再演。 */
    if(retCtx){ const c=retCtx; retCtx=null;
      setTimeout(()=>{ try{ afterBattleReturn(!!c.won, !!c.scripted, c.doneKey||null, null); }catch(e){} }, 900); }
    /* 出航之後的劇情：讀取頁收乾淨之後才演。
       ⚠ Stage9 的飛行段優先（ver -1104）：它接手了就不要再疊一段出航對白上去。 */
    /* ⚠⚠⚠ **等升空真的演完才開口**（ver -1172，Ray：「索拉娜的『這破船』等到船
       完全升空才播放，不要在升空中播放」）：舊版是「開機後 2600ms」，而升空是
       `HOLD(520)+2060 = 2580ms` —— 兩個**各自獨立**的數字剛好差 20ms，任何一邊
       動一下（讀取慢一點、`playTakeoff` 晚一點才開始）就會疊在一起
       （鐵律 7：同一個時刻不要用兩個式子各算一次）。改成**問狀態**。 */
    setTimeout(()=>afterTakeoff(()=>{
      if(!s9FlightMaybe()) departureTalkMaybe();
    }), 700);
    requestAnimationFrame(loop);
  }catch(e){
    document.getElementById('bootMsg').textContent=e.message+'（需以 http 提供，不能直接雙擊開啟）';
  }
})();
</script>
<!-- 道具欄：主遊戲的模組（ES module，與這一頁其餘的一般 <script> 並存）。 -->
<script type="module">
  import { band } from '../script/clock.js';
  /* ══ 把主遊戲的「時段」掛上 window（ver -1082）══
     這一頁其餘的程式是非 module 的，import 不到 `script/clock.js`；由這裡代勞，
     甲板／天空的時段差分就不必在飛行頁再算一份晝夜（鐵律 7）。
     ⚠ module script 是 deferred 的：它在整份文件解析完之後、開機那一串 await
       解開之前跑到，所以 `deckPair()` 拿得到正確的時段。 */
  window.__clockBand = band;
  try{ window.__deckPrefetch && window.__deckPrefetch(); }catch(_){}
  /* 道具鈕已拆（ver -1085，Ray：「道具拿掉」）—— 入口留在系統選單／整備頁那一邊。
     ⚠ `showBag` 的 import 一起拿掉了：留著一個沒有人叫的 import 只是雜訊。 */
</script>
