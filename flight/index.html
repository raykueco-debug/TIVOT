      /* ══⚠⚠⚠ 剔除背面（ver -1204，Ray：「還是微卡」）═══════════════════════
         這一支**從來沒有剔過背面** —— NS 個面全部畫，靠 `faces.sort` 的畫家順序
         讓正面蓋住背面。量體層（`drawSettlements3D`）早在 -304 就剔了，這裡漏掉。
         實測貝利薩爾 d15：**每禎 890 次 `fill()`**（359 貼材 ＋ 531 平色），
         而 `drawRuins` 是那個取景最長那幾禎的唯一主因（4.3~5.5ms）。
         ⚠ **不透明凸體的背面本來就被正面完全蓋住**，所以剔掉它畫面零變化，
           純粹是省掉一半的路徑與一半的 `setTransform`（貼材那一步最貴）。
         ⚠ 判法與量體層同一條（鐵律 8 的精神）：拿**頂面的帶號**（shoelace）
           當朝向基準，邊的走向與它同號＝背對鏡頭。
         ⚠ `ridge`（山牆）的頂面是一條線、帶號為 0 —— 那時不能剔，否則整個屋頂
           會消失。退回「全部畫」（山牆只有四個面，本來就便宜）。 */
      let S2f=0;
      for(let k=0;k<NS;k++){ const k2=(k+1)%NS;
        S2f += B.top[k].x*B.top[k2].y - B.top[k2].x*B.top[k].y; }
      const cullBack = !B.ridge && Math.abs(S2f)>1e-3;
      for(let k=0;k<NS;k++){
        if(cullBack){
          const p0=B.base[k], p1=B.base[(k+1)%NS];
          if((p1.x-p0.x)*S2f >= 0) continue;          // 與頂面同號＝背面
        }
        const a=B.loc[k], b=B.loc[(k+1)%NS];
        let nx=(b[1]-a[1]), ny=-(b[0]-a[0]);          // 邊的法線（順時針＝朝外）
        const nl=Math.hypot(nx,ny)||1; nx/=nl; ny/=nl;
        const d=nx*LGT.x+ny*LGT.y;                    // >0＝朝光
        const rf = B.mat==='roof';       // 屋頂走冷灰那一組（ver -1162）
        faces.push({ k, z:(B.base[k].z+B.base[(k+1)%NS].z)/2,
                     /* `B.col`＝整塊同一個顏色、不分明暗（現在只有門洞在用）：
                        門洞要讀成**一個洞**，有明暗就變成一塊深色的板子。 */
                     col: B.col || (d>0.30 ? (rf?C.roofLit :C.sideLit)
                                  : (d<-0.30 ? (rf?C.roofDark:C.dark)
                                             : (rf?C.roofSide:C.side))) });
      }
      faces.sort((p,q)=>q.z-p.z);
      for(const f of faces){
        const k=f.k, p0=B.base[k], p1=B.base[(k+1)%NS], t1=B.top[(k+1)%NS], t0=B.top[k];
        RFC.beginPath();
        RFC.moveTo(p0.x,p0.y); RFC.lineTo(p1.x,p1.y); RFC.lineTo(t1.x,t1.y); RFC.lineTo(t0.x,t0.y); RFC.closePath();
        RFC.fillStyle=f.col; RFC.fill();
        /* ⚠ 門洞（`B.col`）不貼：它是一個洞，不是一塊石頭。
           ⚠ `tiny`（ver -1164）也不貼：雉堞與小尖塔在畫面上只有一兩個像素，
             貼材在那個尺度是雜訊，而 `setTransform` 是這一層最貴的一步 ——
             細節件的數量又正好是它最多的時候。 */
        const tx = (B.col||B.tiny) ? null : ((B.mat==='roof' && roofTex) ? roofTex : wallTex);
        if(tx){
          const a=B.loc[k], b=B.loc[(k+1)%NS];
          if(texQuad(tx,p0,p1,t0,Math.hypot(b[0]-a[0],b[1]-a[1]),B.h)){
            /* ⚠ **乘不是蓋**（ver -1228）：source-over 會把面的顏色往貼圖自己的亮度拉，
               暗面被提亮、亮面被壓平 ＝ 整座洗白又沒有立體感。理由見 GL_RUIN_FS。 */
            RFC.globalCompositeOperation='multiply';
            RFC.globalAlpha=0.42; RFC.fillStyle=tx; RFC.fill(); RFC.globalAlpha=1;
            RFC.globalCompositeOperation='source-over';
          }
        }
      }
      /* ⚠ 山牆（`ridge`）沒有頂面 —— 它的「頂」是一條屋脊線，fill 出來是零面積。 */
      if(B.ridge) continue;
      poly(RFC,B.top);
      RFC.fillStyle = B.colTop || B.col || (B.mat==='roof' ? C.roofTop : C.top); RFC.fill();
      { const tx = (B.col||B.tiny) ? null : ((B.mat==='roof' && roofTex) ? roofTex : wallTex);
        if(tx){
          const a=B.loc[0], b=B.loc[1], d=B.loc[B.loc.length-1];
          if(texQuad(tx,B.top[0],B.top[1],B.top[3],
                     Math.hypot(b[0]-a[0],b[1]-a[1]), Math.hypot(d[0]-a[0],d[1]-a[1]))){
            /* ⚠ **乘不是蓋**（ver -1228）：source-over 會把面的顏色往貼圖自己的亮度拉，
               暗面被提亮、亮面被壓平 ＝ 整座洗白又沒有立體感。理由見 GL_RUIN_FS。 */
            RFC.globalCompositeOperation='multiply';
            RFC.globalAlpha=0.42; RFC.fillStyle=tx; RFC.fill(); RFC.globalAlpha=1;
            RFC.globalCompositeOperation='source-over';
          }
        } }
    }
    /* ══⚠⚠⚠ ④ 環境光（ver -1165，Ray：「3d 模型都多吃一點環境光，晚上不該那麼亮」）══
       量體的顏色本來是**常數**（`RUIN_COL`／`RUIN_PAL`）—— 地形會隨日月變暗變色，
       它不會。實測（白石古堡，取畫面亮部的九十百分位）：
         白天 遺蹟 191／地形 165（比 1.16）　　夜裡 遺蹟 165／地形 123（比 **1.34**）
       —— 白天的關係 Ray 已經驗收過，夜裡那 1.34 就是「晚上太亮」。

       作法：**整張離屏往「畫面上旁邊那塊地形的顏色」靠**（`screenSample`）。
       用取樣不用公式：那一個顏色已經把光照、分級、**霧**、時段全部算進去了，
       自己再算一次必然走鐘（鐵律 7，同草的底色）。於是這一支同時做完兩件事 ——
       「多吃環境光」（白天也吃 16%）與「晚上不該那麼亮」（夜裡吃到 66%）。
       ⚠ `source-atop` ＝只蓋在**已經畫上去的像素**上（拿量體自己的 alpha 當遮罩）——
         同 §6.5 立繪 `buildDim` 那一招。用 `multiply` 會把透明區也填滿。
       ⚠⚠ 取樣是 0.4 秒一次的，而夜裡它佔到 66% 的權重 —— **直接用會每 0.4 秒跳一次**
         （那正是這一版剛修掉的那種閃動）。所以逐禎往新值**指數逼近**，跳階就看不見了。
       ⚠ 夜的份量走 `nightK`，與敵人立繪、船同一盞燈（`drawEnemy3D` 的同一條式子）。 */
    { const sc=screenSample(x0,y0,x1,y1,true);
      if(!ruinAmb) ruinAmb=sc.slice();
      else for(let q=0;q<3;q++) ruinAmb[q]+=(sc[q]-ruinAmb[q])*RUIN_AMB_EASE;
      const SK=sky(), nightK=clamp(1-SK.day*1.2,0,1);
      RFC.setTransform(1,0,0,1,0,0);
      RFC.globalCompositeOperation='source-atop';
      RFC.globalAlpha=RUIN_AMB+RUIN_AMB_NIGHT*nightK;
      RFC.fillStyle='rgb('+(ruinAmb[0]|0)+','+(ruinAmb[1]|0)+','+(ruinAmb[2]|0)+')';
      RFC.fillRect(0,0,bwp,bhp);
      RFC.globalAlpha=1; RFC.globalCompositeOperation='source-over'; }
    /* ⑤ 貼回主畫面：逐欄遮擋（山擋得住它）＋遠距淡出。 */
    ctx.save();
    /* ⚠ 逐欄裁（見上面 colMin）—— 不是拿 `zmin` 一個深度裁整座。
       ⚠ 只裁遺蹟真的畫得到的那幾欄（同 `clipByTerrainDepth` 的 c0/c1：
         裁切路徑越複雜，之後每一次繪製都要跟著付）。 */
    /* ══⚠⚠⚠ 用哪一個深度去裁 —— 逐欄的**最近**點（ver -1153 定案）══
       遺蹟是**躺在地上**的東西，所以能擋住它的只有「比它近緣更近」的地形；
       近緣到遠緣之間那一段地形，就是它自己腳下踩著的地，本來就擋不到它。
       ⚠⚠ 這條路 -1150 走過、-1151 又推翻了，來回一趟的原因值得記下來：
         · -1150 用最近點 → Ray 回報石製遺蹟**穿過山體**。看起來像判定太寬鬆，
           其實是**遺蹟坐在陡坡上**：它自己 footprint 裡的上坡地比它高又比它近，
           落在近緣與遠緣之間 —— 那一段本來就不該擋它，判定沒錯，**地形才是問題**。
         · -1151 改用基座**遠**緣把它壓住 → 治好穿山，卻對**貼地的平板**系統性地錯：
           那個深度上的地形就是石台腳下的地、高度一樣，於是每一欄的 `lim` 都落在
           石台自己身上，近半邊被裁掉 —— 畫面上圓台變成一道**弧**（實測：石台在
           第 155 列，逐欄 lim 154~157）。
         **真正的解是把地整平**（`A.podium`，見 loadWorld 那一段）：footprint 之內
         不再有比遺蹟高的地，最近點就是對的了。兩件事要一起，缺一邊都會回到上面
         那兩種症狀之一。
       ⚠ 所以：**坐在坡上的遺蹟一定要給 `podium`**。不給的下場不是「少一點細節」，
         是整座被自己腳下的坡吃掉。 */
    clipByColDepth(RZMIN, sxk, syk, rc0, rc1);
    ctx.globalAlpha=fade;
    ctx.drawImage(ruinFB,0,0,bwp,bhp,fx0,fy0,fbw,fbh);
    ctx.globalAlpha=1;
    ctx.restore();
  }
}
/* ══⚠⚠ 剔除距離：遠到讀不出形狀就不畫（同火車「不如在那個距離就不要出現」的理由）══
   ⚠⚠⚠ **ver -1155 由 9000 收到 3600**（Ray：「遠距離還是會看到古墓穿山」
     →「那讓 3D 物件到一定距離才畫，並且是淡入出現這樣就好」）。
     遠距離的遮擋本來就只有**逐欄一個深度**的精度（見 `clipByColDepth` 那一段的
     取捨表），而距離越遠、深度切片越粗、物件越小 —— 想在那裡做對，代價遠高於
     它值得的。**Ray 的解法是繞開它**：那個距離本來就讀不出形狀，不如不要畫。
   ⚠ 尺度感：9000＝450 地圖像素（整個大陸的五分之一）；3600＝180 像素，
     古墓（沿壁 170 世界單位）在那裡約 18 個螢幕像素 —— 剛好是「看得出那裡有東西」
     的下限。再近就一路清楚起來。
   ⚠ **名牌與金箭頭不受這條管**（`drawPlaces` 自己一套）：遠遠仍然看得到「那裡有
     一個地點」，飛近了實體才浮出來 —— 那正是要的節奏。
   ⚠ 日後某一座要看得更遠，在 `RUIN_ART[x]` 加一個 `far` 覆寫即可（現在還不需要，
     一個數字先別拆成兩個）。 */
const RUIN_FAR=3600, RUIN_FADE=1400, RUIN_NEAR=60;

/* ══⚠⚠ 被掃到的遺蹟射出一道光柱（ver -1116，Ray：「被掃到的遺蹟要產生一道光柱，
   方向計的提示就不用了」）══
   它**取代**方向計上那一束「感應」提示：光柱在世界裡，玩家抬頭就看得到方向與距離，
   不必低頭讀儀表 —— 而且遠遠看到一道光正是「那裡有東西」最直接的說法。
   ⚠ 看得到的距離**遠大於遺蹟本身**（`BEAM_FAR` vs `RUIN_FAR`）：石頭幾十個像素就
     糊了，光柱是燈塔，要在看不見石頭的距離就先看得到。
   ⚠ 垂直線在這個相機下投影**仍然是垂直線**（沒有 roll），所以一根光柱就是
     「同一個螢幕 x、兩個 y」，不必逐段投影。
   ⚠ 遮擋走 `clipByTerrainDepth`：山擋得住它的下半截，露出山稜上方那一段 ——
     那正好給了距離感。
   ⚠ 顏色接感應那一系（青白）：它是混沌感知找出來的東西，同一個色系讀得出因果。
   ⚠ 與地形同一顆像素（畫進低解析離屏再放大，§6.7）：畫在全解析上會是這個
     畫面裡唯一一條「乾淨的漸層」，反而突兀。 */
const BEAM_H=1100;        // 光柱高度（世界單位）
const BEAM_W=34;          // 光柱寬度（世界單位）
const BEAM_FAR=26000;     // 看得到的距離（遠大於遺蹟本身）
let beamFB=null, BFC=null;
/* 兩種光柱的顏色。⚠ 釘選用**金色**，與大地圖那根針、方向計上那束黃光同一個
   （`drawMapPin` 的註解：「玩家要認得出兩者是同一件事」）—— 它們本來就是同一根釘子。 */
const BEAM_TINT = {
  sense: { hot:'150,236,244', cool:'120,220,236' },   // 混沌感知找出來的遺蹟（青白）
  pin:   { hot:'255,236,170', cool:'255,214,96'  },   // 釘選（金）
};
/* ══⚠⚠ 畫**一道**光柱（ver -1146 由 drawRuinBeams 抽出來）══
   原本這一段寫死在「掃到的遺蹟」那個迴圈裡；釘選也要一模一樣的一道光，
   所以抽成一支、兩邊都呼叫它（鐵律 8：一個動作一個實作）。
   ⚠ 抽出來時**行為一個字都沒改** —— 遺蹟那一支只是把自己的顏色與距離傳進來。 */
function drawBeamAt(mx,my,tint,far,scaleH,horizon,sinp,cosp,now){
    const sxk=W/BW, syk=VIEWH/BH;
    const wx=mx*MAP_SCALE, wy=my*MAP_SCALE;
    const dx=wx-cam.x, dy=wy-cam.y;
    const dist=Math.hypot(dx,dy);
    if(dist>far) return null;
    const z=dx*(-sinp)+dy*(-cosp);
    if(z<RUIN_NEAR||z>ZFAR*0.95) return null;
    const sv=(dx*cosp+dy*(-sinp))/z;
    if(sv<-1.3||sv>1.3) return null;
    const gh=HGT[clamp(my|0,0,MAPH-1)*MAPW+clamp(mx|0,0,MAPW-1)];
    const cx=((sv+1)/2*BW)*sxk;
    const yAt=h=>(((cam.alt-gh-h)/z + z*curvAt(sv))*scaleH+horizon)*syk;
    const y0=yAt(0), y1=yAt(BEAM_H);
    if(y1>VIEWH||y0<-VIEWH) return null;
    const halfW=Math.max(1.2, BEAM_W*0.5*W/(2*z));
    /* 脈動：慢、幅度小 —— 這是一道靜靜立著的光，不是警報器。 */
    const pul=0.82+0.18*Math.sin(now*0.0016);
    const top=Math.max(y1,-40), bot=Math.min(y0,VIEWH+20);
    if(bot-top<2) return null;
    const pad=Math.ceil(halfW*3)+6;
    const fx0=Math.floor(cx-pad), fy0=Math.floor(top)-4;
    const fbw=Math.ceil(pad*2), fbh=Math.ceil(bot-top)+8;
    if(fbw<3||fbh<3||fbh>VIEWH*3) return null;
    const pk=clamp(BW/W,0.15,1);
    const bwp=Math.max(2,Math.round(fbw*pk)), bhp=Math.max(2,Math.round(fbh*pk));
    if(!beamFB){ beamFB=document.createElement('canvas'); BFC=beamFB.getContext('2d'); }
    if(beamFB.width<bwp||beamFB.height<bhp||beamFB.width>bwp*2||beamFB.height>bhp*2){
      beamFB.width=bwp; beamFB.height=bhp; }
    BFC.setTransform(1,0,0,1,0,0); BFC.clearRect(0,0,bwp,bhp);
    BFC.setTransform(bwp/fbw,0,0,bhp/fbh,-fx0*bwp/fbw,-fy0*bhp/fbh);
    /* 三層：外暈（寬、淡）→ 光柱（漸淡到頂）→ 核心（窄、亮）。
       ⚠ 頂端要淡到 0：切齊的光柱讀起來是一根柱子，不是一道光。 */
    const grad=(w,a0)=>{
      const g=BFC.createLinearGradient(0,y0,0,y1);
      g.addColorStop(0,   'rgba('+tint.hot +','+(a0*pul).toFixed(3)+')');
      g.addColorStop(0.45,'rgba('+tint.cool+','+(a0*0.55*pul).toFixed(3)+')');
      g.addColorStop(1,   'rgba('+tint.cool+',0)');
      BFC.fillStyle=g; BFC.fillRect(cx-w,y1,w*2,y0-y1);
    };
    BFC.globalCompositeOperation='lighter';
    grad(halfW*2.6, 0.16);
    grad(halfW,     0.42);
    grad(halfW*0.38,0.72);
    BFC.globalCompositeOperation='source-over';
    ctx.save();
    clipByTerrainDepth(z, sxk, syk,
      clamp(Math.floor((cx-pad)/sxk)-1,0,BW-1), clamp(Math.ceil((cx+pad)/sxk)+1,0,BW-1));
    ctx.globalCompositeOperation='lighter';
    ctx.drawImage(beamFB,0,0,bwp,bhp,fx0,fy0,fbw,fbh);
    ctx.globalCompositeOperation='source-over';
    ctx.restore();
    return { cx, y0, z };          // 呼叫端要拿它掛讀數（釘選的座標）
}
/* 掃到的遺蹟射出的光柱（誰要畫）＋**釘選的那一根**（ver -1146）。 */
function drawRuinBeams(scaleH,horizon,sinp,cosp,now){
  if(!MAPW) return;
  for(const P of PLACES){
    if(!P.sense || !P.flag || !flagOn(P.flag)) continue;
    if(P.town && flagOn('mapcard_'+P.town)) continue;
    drawBeamAt(P.x,P.y,BEAM_TINT.sense,BEAM_FAR,scaleH,horizon,sinp,cosp,now);
  }
  /* ══ 釘選（Ray：「點一下飛行畫面，可生成從地面發出的光柱」「並顯示該座標」）══
     ⚠ 釘子只有一根，而且與大地圖共用同一個 `MV.pin`（鐵律 7）——
       在天上插的釘子，打開地圖就在那裡；方向計那束黃光也自動指過去。
     ⚠ 剔除距離用 `ZFAR`（地形畫多遠、光柱就看得到多遠）而不是遺蹟那個
       `BEAM_FAR`：遺蹟是「走近才發現」，釘選是玩家自己插的，他知道它在那裡，
       看得到才有意義。 */
  if(MV.pin){
    const r=drawBeamAt(MV.pin[0],MV.pin[1],BEAM_TINT.pin,ZFAR*0.95,
                       scaleH,horizon,sinp,cosp,now);
    if(r) drawPinLabel(r.cx, r.y0, MV.pin);
  }
}
/* 光柱底下的座標讀數。
   ⚠⚠ 畫在**主畫布**（全解析），不進那張低解析離屏 —— 光柱要跟地形同一顆像素
     （§6.7），但**數字不是世界裡的東西**，跟著像素化就糊到讀不出來。
   ⚠ 底部可能落在畫面外（站得很近、或光柱在腳下）：夾回窗內，不然讀數會消失。
   ⚠⚠ 下界夾的是 **`skyBottom()`** 不是 `VIEWH`：羅盤與舵輪就壓在那一截，
     夾到 `VIEWH` 會讓讀數躲到羅盤後面（實測就是）。而它正好也是**點擊**的下界
     —— 讀數與釘選共用同一條邊界，不另訂一個數字（鐵律 7）。 */
function drawPinLabel(cx,y0,pin){
  const txt='('+pin[0]+','+pin[1]+')';
  const y=clamp(y0, 22, skyBottom()-4);
  ctx.save();
  ctx.font='600 13px ui-monospace,Menlo,monospace';
  ctx.textAlign='center'; ctx.textBaseline='bottom';
  const w=ctx.measureText(txt).width;
  ctx.fillStyle='rgba(8,10,16,.62)';
  ctx.fillRect(cx-w/2-6, y-16, w+12, 17);
  ctx.strokeStyle='rgba(255,214,96,.55)'; ctx.lineWidth=1;
  ctx.strokeRect(cx-w/2-6, y-16, w+12, 17);
  ctx.fillStyle='#ffd660';
  ctx.fillText(txt, cx, y-3);
  ctx.restore();
}

function drawTrains(S,scaleH,horizon,sinp,cosp){
  if(!TRAINS.length) return;
  const sxk=W/BW, syk=VIEWH/BH;
  /* 世界座標 → 螢幕。回 null＝在身後或太偏，不必畫。
     far＝這個東西的剔除距離（不給就用火車的預設）。 */
  const proj=(mx,my,h,far)=>{
    const dx=mx*MAP_SCALE-cam.x, dy=my*MAP_SCALE-cam.y;
    const z=dx*(-sinp)+dy*(-cosp);
    if(z<40||z>(far||ZFAR*0.62)) return null;      // 遠處看不出是火車，省下來
    const sv=(dx*cosp+dy*(-sinp))/z;
    if(sv<-1.4||sv>1.4) return null;
    return { x:((sv+1)/2*BW)*sxk,
             y:(((cam.alt-h)/z + z*curvAt(sv))*scaleH+horizon)*syk,
             z, k:(W/(2*z)) };                     // k＝1 世界單位有幾個螢幕像素
  };
  /* ── 隧道洞口：**已移除**（ver -299，Ray 指定）───────────────────────
     曾經有一個站在軌道上、面朝洞外的拱形黑洞。拿掉的理由：它是一個**懸空的
     平面**，貼不到真正的山壁上 —— 地形是逐欄光柵化的高度場，山壁的位置每欄
     都不同，而洞口只有一個深度、一個朝向，兩者對不齊，看起來就是浮在山前面
     的一片黑。要貼準得逐欄去找山壁與軌道的交線，代價遠超過它的價值。
     ⚠ 也不要退回「在地表蓋一塊石材」那一版：那是貼在地上的，從空中看是一小片
       灰色補丁，讀不出「這裡有個洞」。兩條路都試過了。
     現在的行為：隧道段**不鋪地表軌道**（stampPaths），火車逐節沒入山體
     （見下方進隧道那段）—— 軌道走到山腳自然中斷，車就開進去了。
     ⚠ 另一條路「強迫火車繞山走」實測過**不可行**：把 RAIL_TUNNEL 由 6 拉到
       1000，隧道只從 6 段降到 4 段，而幹線長度暴增（1929→2409、9423→12449，
       +25~32%），山區變成蛇行。原因是隧道**不是路徑選出來的**：縱斷面受坡度
       限制，地面高過設計高程 TUNNEL_MIN 就判定在山裡，調成本消不掉它。 */

  /* ── 「開進市區了沒」──────────────────────────────────────────────
     市區的平面圖是一張貼在地上的盤子，車開進去就該被它蓋住。但盤子是後畫的
     （城畫在火車之前還是之後都不對：城是地景、車在地景上跑），所以這裡用
     幾何判定而不是靠繪製順序：離城心比「盤子半徑」近就算進城了。
     ⚠ 半徑取 planW 的一半再收 8%：平面圖的最外圈是郊區與田地，車在那裡還
       看得見才對；收到市街緣才開始沒入。
     ⚠ 每幀建一次（聚落數十個、只做平方比較），不快取 —— buildSettlements
       本來就有快取，這裡只是讀它。 */
  const CITYZ=[];
  if(window.Settlement && MAPW){
    for(const s of buildSettlements()){
      if(!s.plan||!s.planW) continue;
      const r=(s.planW*0.5/MAP_SCALE)*0.92;
      CITYZ.push(s.mx, s.my, r*r);
    }
  }
  const inCity=(mx,my)=>{
    for(let i=0;i<CITYZ.length;i+=3){
      const dx=mx-CITYZ[i], dy=my-CITYZ[i+1];
      if(dx*dx+dy*dy < CITYZ[i+2]) return true;
    }
    return false;
  };
  const hideAt=q => !!(q.tun || inCity(q.x,q.y));

  for(const T of TRAINS){
    /* 停在站裡就不畫。⚠ 車站在市區外緣、城蓋不住它，所以這是**刻意**讓它消失：
       一列停著不動的車跟一段軌道旁的雜物沒兩樣，反而讓「偶爾撞見一列在跑的車」
       這件事變得廉價。要改成停著也畫，就把這一行拿掉即可（煙要一併關掉）。 */
    if(T.wait>0) continue;
    const head=trainAt(T,T.s);
    if(!head) continue;
    const hp=proj(head.x,head.y,head.h);
    if(!hp) continue;
    /* 先看整列車在螢幕上有多長，決定走哪一條路。 */
    const tail=trainAt(T, T.s - T.dir*TRAIN_SPAN);
    if(!tail) continue;
    const tp=proj(tail.x,tail.y,tail.h);
    if(!tp) continue;
    const spanPx=Math.hypot(hp.x-tp.x, hp.y-tp.y);

    /* seats＝要畫的每一節，各自帶頭尾兩點與線寬。
       ⚠ 逐節**各自投影**（而不是「一個點 + 軸對齊的 fillRect」）：車朝著鏡頭
         開走時各節深度差很大，投影出來是一串垂直排開的位置，而每節仍是水平
         橫槓的話，讀起來是一把梯子不是一列車。取頭尾兩點就自動帶上朝向：
         轉彎、斜著開、正對鏡頭都對。 */
    /* ⚠ 太小就**整列不畫**，不要硬撐到最小尺寸。ver -279 曾經在螢幕空間等比撐開
         成一條直線排（放棄彎道），結果遠處的車轉彎時是**整根棍子在轉**——
         Ray 回報「不如在那個距離就不要出現」，對：一個轉得不對的東西比沒有更糟。
       ⚠ 所以淡出改綁在**投影長度**上，不是綁距離：長度掉到 TRAIN_MIN_PX 就淡完，
         剛好接上不畫的門檻，中間沒有跳變。 */
    if(spanPx<TRAIN_MIN_PX) continue;
    /* ── 進隧道：**從車頭逐節消失**（Ray 指定，ver -293）────────────
       ⚠ 這裡原本判的是**車頭**：`if(head.tun) continue`，車頭一進洞整列瞬間
         不見。當時的註解說逐節判「會出現半列車卡在洞口」所以不採用 ——
         那個判斷是錯的：**半列車卡在洞口正是火車進隧道該有的樣子**，
         整列同時消失才是破綻。
       ⚠ 整列都在洞裡時 seats 會是空的，下面的 `if(!seats.length) continue`
         自然接住，不必另外判。
       ⚠ 煙不必跟著擋：噴發端本來就有 `h.tun` 的守衛（在洞裡不留煙），
         所以車進洞之後只會剩下先前留在洞外的那幾團慢慢淡掉 —— 那是對的。 */
    const seats=[];
    for(let c=0;c<TRAIN_CARS;c++){
      const s1=T.s - T.dir*(c*TRAIN_PITCH), s2=s1 - T.dir*TRAIN_CAR;
      let q1=trainAt(T, s1), q2=trainAt(T, s2);
      if(!q1||!q2) continue;
      /* 「這一端該不該藏起來」：在山肚子裡（隧道）**或**已經開進市區。
         ⚠ 進城與進隧道走**同一條路徑**（ver -300，Ray 指定「火車進城要逐節
           消失」）—— 兩者都是「車一節一節沒入某個東西」，寫成兩套只會分岔。
           先前進城是 `if(T.wait>0) continue` 整列瞬間不見，那正是 -293 在隧道
           上修掉的同一個病。 */
      const h1=hideAt(q1), h2=hideAt(q2);
      if(h1 && h2) continue;                         // 整節都藏起來了
      if(h1 || h2){
        /* 跨界的那一節：把已經沒入的那一端收回交界，車就是**滑進去**
           而不是整節憑空不見。
           ⚠ 二分找交界而不是直接丟掉這一節 —— 一節車 30 世界單位，
             整節丟掉在近處是看得出來的一次跳。
           ⚠ 解析度的上限是折線的節距（tun 旗標是逐節點存的，見 trainAt），
             約 20 世界單位，比一節車短，所以收得進去。再細也沒有資料。 */
        let a = h1 ? s2 : s1;                        // 還看得到的那一端
        let b = h1 ? s1 : s2;                        // 已經沒入的那一端
        for(let it=0; it<6; it++){
          const m=(a+b)*0.5, qm=trainAt(T,m);
          if(!qm) break;
          if(hideAt(qm)) b=m; else a=m;
        }
        const qe=trainAt(T,a);
        if(!qe) continue;
        if(h1) q1=qe; else q2=qe;
      }
      const p1=proj(q1.x,q1.y,q1.h), p2=proj(q2.x,q2.y,q2.h);
      if(p1&&p2) seats.push({ax:p1.x,ay:p1.y,bx:p2.x,by:p2.y,
                             w:Math.max(TRAIN_MIN_W, TRAIN_CAR_W*(p1.k+p2.k)*0.5),
                             up:TRAIN_CAR_W*0.5*(p1.k+p2.k)*0.5});
    }
    if(!seats.length) continue;

    /* ── 煙先投影好 ────────────────────────────────────────────
       ⚠ 一定要在**裁切之前**算完，因為裁切的欄位範圍要把煙一起框進去。
         先前只用車身的 x 範圍去框（cx0/cx1 只掃 seats）—— 煙拖得比車身長得多，
         超出去的那一段落在裁切路徑之外，於是整條煙被一刀垂直切斷。
         那就是回報的「煙霧的裁點太明顯」。
       ⚠ 每一團煙有**自己的深度**，所以淡出也要各算各的：拿車頭的 fade 套全部
         的話，拖在最後面那幾團會在越過剔除面時整團憑空消失 —— 又是一個裁點。 */
    const CUT0=ZFAR*0.62, FADEB=ZFAR*0.16;   // 煙團各自的距離淡出仍用這一組
    const puffDraw=[];
    let cx0=1e9, cx1=-1e9, zClip=hp.z;
    for(const q of seats){ cx0=Math.min(cx0,q.ax,q.bx); cx1=Math.max(cx1,q.ax,q.bx); }
    for(let pi=0; pi<T.puffs.length; pi++){
      const q=T.puffs[pi];
      const life=q.age/(SMOKE_N*SMOKE_DT);
      const a0=clamp(1-life,0,1);
      if(a0<=0.03) continue;
      const rise=q.age*22;                         // 煙往上飄（世界單位／秒）
      const pp=proj(q.x,q.y,q.h+rise);
      if(!pp) continue;
      const pf=clamp((CUT0-pp.z)/FADEB,0,1);       // 這一團自己的距離淡出
      if(pf<=0.01) continue;
      const jt=(q.j||0);
      /* 大小差很多才像雲塊（0.62~1.38 倍）；橫向也錯開一點，不要排成一直線。 */
      const r=Math.max(1.1,(9+q.age*19)*(0.62+jt*0.76)*pp.k);
      const ox=(jt-0.5)*r*0.9;
      /* ⚠ 冒出來的那 0.16 秒要有個**淡入**。少了它，每 0.55 秒就有一朵雲憑空
         以全不透明度出現 —— 那是硬邊的「啪」一下，看起來像閃。0.16 秒短到
         不影響「一噴一噴」的節奏，卻足以把那個硬邊磨掉。 */
      const born=clamp(q.age/0.16,0,1);
      puffDraw.push({x:pp.x+ox, y:pp.y, r, a0, life, f:pf*born});
      if(pp.x+ox-r<cx0) cx0=pp.x+ox-r;
      if(pp.x+ox+r>cx1) cx1=pp.x+ox+r;
      if(pp.z<zClip) zClip=pp.z;                   // 裁切取最淺的那一團，見下
    }

    /* ⚠ 裁切的深度取**整團裡最淺的**（車頭與所有煙團之中最小的 z），不是車頭的。
       煙拖在車後，車朝著鏡頭開時煙比車遠、背對鏡頭時煙比車近；拿車頭的深度
       一律去裁，另一半的情況就會把煙誤判成「被前面的地形擋住」而切掉一塊。
       取最淺的是安全邊：寧可讓煙偶爾透出山一點點（它本來就是軟的、又飄在高處），
       也不要一條硬邊。 */
    /* ── 像素化緩衝：把整列車（含煙）畫進去，再一次貼回主畫布 ──────────
       ⚠ 外框要把**煙**一起框進去（煙拖得比車身長很多）—— cx0/cx1 上面已經含了煙，
         這裡再補縱向與一圈餘裕（車廂高度、車頭那盞燈的光暈）。
       ⚠ 透明度照舊在離屏那一層處理（煙每團自己的 alpha、車身的 fade），
         貼回來時 globalAlpha 是 1 —— 行為與原本一模一樣，只有解析度變了。 */
    let cy0=1e9, cy1=-1e9;
    for(const q of seats){
      const hh=Math.max(1.1,q.w*TRAIN_BOX_H)+q.w*0.5+q.up;
      cy0=Math.min(cy0,q.ay-hh,q.by-hh); cy1=Math.max(cy1,q.ay+q.w,q.by+q.w);
    }
    for(const q of puffDraw){ cy0=Math.min(cy0,q.y-q.r*1.35); cy1=Math.max(cy1,q.y+q.r*1.15); }
    const fpad=Math.ceil(Math.max(6, seats[0].w*3.2));
    const fx0=Math.floor(cx0)-fpad, fy0=Math.floor(cy0)-fpad;
    const fbw=Math.ceil(cx1-cx0)+fpad*2, fbh=Math.ceil(cy1-cy0)+fpad*2;
    if(fbw<2||fbh<2) continue;
    const pk=clamp(BW/W,0.15,1);                       // 與地形同一個解析度
    const bwp=Math.max(2,Math.round(fbw*pk)), bhp=Math.max(2,Math.round(fbh*pk));
    if(!trainFB){ trainFB=document.createElement('canvas'); TC=trainFB.getContext('2d'); }
    if(trainFB.width<bwp || trainFB.height<bhp || trainFB.width>bwp*2 || trainFB.height>bhp*2){
      trainFB.width=bwp; trainFB.height=bhp;
    }
    TC.setTransform(1,0,0,1,0,0); TC.clearRect(0,0,bwp,bhp);
    TC.setTransform(bwp/fbw,0,0,bhp/fbh,-fx0*bwp/fbw,-fy0*bhp/fbh);
    TC.lineCap='butt';
    ctx.save();
    clipByTerrainDepth(zClip, sxk, syk, Math.floor(cx0/sxk)-2, Math.ceil(cx1/sxk)+2);
    /* 淡出綁**投影長度**：spanPx 從 1.7 倍門檻掉到門檻的過程中淡完，門檻以下
       本來就不畫，所以消失的那一刻不透明度已經是 0，沒有跳變。
       ⚠ 淡出帶不能太窄。ver -279 用過 ZFAR*0.075 的距離帶，實測在剔除面前一格
         還有 6% 不透明度、113 個像素，下一格直接歸零 —— 那是看得出來的一下消失。
       ⚠ 綁長度而不是綁距離，是因為「看不看得清楚」本來就是長度的事：同樣的
         距離，車頭朝著鏡頭時投影長只有側掠時的幾分之一。 */
    const ft=clamp((spanPx-TRAIN_MIN_PX)/(TRAIN_MIN_PX*0.7),0,1);
    const fade=ft*ft*(3-2*ft);
    const lit=lerp(0.66,1.0,S.day);

    /* ── 煙 ────────────────────────────────────────────────────
       先畫，讓車頭壓在煙上（煙是從車頭噴出來往後散的，車該在最前面）。
       ⚠ 兩層：外圈是散開的灰白蒸汽，內圈是還沒散的濃煙。單層畫出來是一顆
         糊掉的球，兩層才有「一團一團往後拖」的樣子。
       ⚠ puffDraw 是由**舊到新**排的（puffs[0] 最舊）：舊的最大最淡，該在最底下。
         反過來畫的話那些大而淡的團會蓋在整列車上，煙就變成一塊糊掉的白斑
         （第一版就是，後面三節整個被埋掉）。 */
    const g=Math.round(lerp(198,240,S.day)*lit);
    const gs='rgb('+g+','+g+','+Math.round(g*0.97)+')';
    const c2=Math.round(g*0.74), cs='rgb('+c2+','+c2+','+Math.round(c2*0.99)+')';
    for(const q of puffDraw){
      /* 一朵雲塊自己的生命：剛冒出來最濃，脹大的同時淡掉。
         ⚠ 團數少了之後每一朵可以濃一點（0.34→0.46）也不會糊成一片 ——
           糊掉的原因從來不是單團太濃，是團太多疊在一起。 */
      TC.globalAlpha=q.a0*Math.sqrt(q.a0)*0.46*q.f;
      TC.fillStyle=gs;
      TC.beginPath(); TC.ellipse(q.x,q.y-q.r*0.25,q.r,q.r*0.74,0,0,Math.PI*2); TC.fill();
      if(q.life<0.42){                                 // 剛冒出來那幾朵的濃核
        TC.globalAlpha=(1-q.life/0.42)*0.42*q.f;
        TC.fillStyle=cs;
        TC.beginPath(); TC.ellipse(q.x,q.y-q.r*0.25,q.r*0.55,q.r*0.44,0,0,Math.PI*2); TC.fill();
      }
    }

    /* ── 車身 ──────────────────────────────────────────────────
       一節一段粗線，**butt 端點**。⚠ 端點不能用 round：圓端會把每節往兩頭
       各撐出半個線寬，正好把 TRAIN_GAP 那點空隙吃掉 —— 五節於是黏成一條，
       那就是回報的「像條蟲」。
       ⚠ 不畫車窗車輪：這個尺寸下加細節只會變成雜點。讀得出「一串一節一節的
         深色量體沿著軌道在動、前頭冒著煙」就夠了。 */
    TC.globalAlpha=fade;
    const wPx=seats[0].w;
    for(let i=0;i<seats.length;i++){
      const q=seats[i], w=q.w;
      /* 車廂＝**真的方塊**：地面矩形往上擠出一個高度，畫「看得到的側面」＋車頂。
         ⚠ 先前是一段粗線＋一道高光，那讀起來是**一片色帶**（Ray 回報「車廂是
           平面」）。一條線無論怎麼描邊都沒有厚度 —— 要有體積就得真的把頂面與
           側面分開畫、各自給不同的亮度，眼睛靠的是那個明暗差。
         ⚠ 側面只畫**朝鏡頭的那一邊**：兩邊都畫的話遠端那面會從車頂後面露出來，
           變成一節有兩層樓。判法與街廓量體同一套（看螢幕帶號）。 */
      const dx=q.bx-q.ax, dy=q.by-q.ay;
      const L=Math.hypot(dx,dy)||1;
      const nx=-dy/L, ny=dx/L;                 // 螢幕上的車身橫向
      const hw2=w*0.5;
      /* 地面四角（已含 up：車坐在軌道上，不是陷進去） */
      const gAx=q.ax+nx*hw2, gAy=q.ay-q.up+ny*hw2;
      const gBx=q.bx+nx*hw2, gBy=q.by-q.up+ny*hw2;
      const gCx=q.bx-nx*hw2, gCy=q.by-q.up-ny*hw2;
      const gDx=q.ax-nx*hw2, gDy=q.ay-q.up-ny*hw2;
      const hh2=Math.max(1.1, w*TRAIN_BOX_H);  // 車高（螢幕像素）
      /* 側面：畫**下緣在螢幕上比較低**的那一條長邊（＝朝鏡頭那面）。 */
      const sideAB=(gAy+gBy)>(gCy+gDy);
      const s0x=sideAB?gAx:gCx, s0y=sideAB?gAy:gCy;
      const s1x=sideAB?gBx:gDx, s1y=sideAB?gBy:gDy;
      TC.beginPath();
      TC.moveTo(s0x,s0y); TC.lineTo(s1x,s1y);
      TC.lineTo(s1x,s1y-hh2); TC.lineTo(s0x,s0y-hh2); TC.closePath();
      TC.fillStyle = i===0 ? '#141519' : '#2b2620';        // 側面在陰影裡，最暗
      TC.fill();
      /* 車頭端面：只有正對著看的時候才有面積，畫了才不會像被削掉一半。 */
      TC.beginPath();
      TC.moveTo(gAx,gAy); TC.lineTo(gDx,gDy);
      TC.lineTo(gDx,gDy-hh2); TC.lineTo(gAx,gAy-hh2); TC.closePath();
      TC.fillStyle = i===0 ? '#1b1d22' : '#332d26';
      TC.fill();
      /* 車頂：最亮的一面（天光直接照到），與側面的明暗差就是「這是個箱子」。 */
      TC.beginPath();
      TC.moveTo(gAx,gAy-hh2); TC.lineTo(gBx,gBy-hh2);
      TC.lineTo(gCx,gCy-hh2); TC.lineTo(gDx,gDy-hh2); TC.closePath();
      TC.fillStyle = i===0 ? '#3c4048' : '#5b4f42';
      TC.fill();
      /* 描邊：森林與道碴都是雜色的，沒有邊的話車身會溶進背景（遠處尤其）。
         ⚠ 只描車頂那一圈就夠 —— 側面已經是最暗的色塊，再描等於加粗一圈黑。 */
      if(w>=2.6){
        TC.strokeStyle='rgba(10,10,12,.66)'; TC.lineWidth=1;
        TC.stroke();
      }
    }
    /* 機車頭正面的一點暖光（夜裡才看得出來，白天被壓掉）。 */
    if(S.day<0.45 && seats[0]){
      const p0={x:seats[0].ax, y:seats[0].ay-seats[0].up}, r=Math.max(1.5, wPx*1.1);
      const g2=TC.createRadialGradient(p0.x,p0.y-r*0.3,0,p0.x,p0.y-r*0.3,r*2.4);
      g2.addColorStop(0,'rgba(255,206,132,'+(0.55*(1-S.day/0.45)).toFixed(2)+')');
      g2.addColorStop(1,'rgba(255,206,132,0)');
      TC.fillStyle=g2;
      TC.beginPath(); TC.arc(p0.x,p0.y-r*0.3,r*2.4,0,Math.PI*2); TC.fill();
    }
    /* 貼回主畫布：關掉平滑＝最近鄰，1:1 放大成與地形同一種像素塊。
       ⚠ 主畫布的 `imageSmoothingEnabled` 在 resize 時就關掉了（地形靠它），
         drawPanel 會暫時打開再關回去 —— 這裡在 drawPanel 之前，所以是關著的。
         還是明寫一次，免得將來有人在中間插一段開了平滑的繪製。 */
    TC.globalAlpha=1;                                  // 下一列車要從乾淨的狀態開始
    ctx.imageSmoothingEnabled=false;
    ctx.drawImage(trainFB,0,0,bwp,bhp,fx0,fy0,fbw,fbh);
    ctx.restore();
    ctx.globalAlpha=1;
    ctx.lineCap='round';
  }
}

/* ══ 地標 ══
   遠：只有一枚向下的箭頭浮在地標上方（不透露名稱）
   近：箭頭下方展開名牌 —— 名牌出現＝可點擊進入
   點擊判定用 hotspots（每幀重建），tap 與拖曳靠位移量區分。 */
/* 1800 世界單位＝90 地圖像素。大陸放大一倍後跟著加倍，維持「相對地圖」
   的同一段距離；沿用 900 會變成要飛到幾乎貼著地標才跳出名字。 */
const NAME_DIST = 1800;   // 進入此距離才顯示名稱＝可進入
/* ══⚠⚠ 這個地點**現在**顯示成什麼字（ver -1184）════════════════════════
   Ray：「石製遺蹟：（進入後改名為瓦努努石陣）」—— 地名可以是一個**狀態**。
   ⚠⚠ **只有這一支在決定**（鐵律 7/8）：名牌、大地圖上的標籤、降落鈕、進入時
     那張地名卡全部問它。各自讀 `P.name` 的話，改名就只會改到其中幾個。
   ⚠⚠ **`P.name` 本身不動** —— 它是識別字串（`markOf`／`STAGE1_DEST`／拖城覆寫
     都拿它比對）。要改的是「印出來的字」，不是「它是誰」。
   ⚠ SETTLEMENTS 那一族用 `n` 當名字（沒有 `name`），所以退路要兩個都吃。 */
function placeName(P){
  if(!P) return '';
  const w=(P.nameWhen||[]).find(o=>o && (o.need || o.not)
            && (!o.need || flagOn(o.need))
            && (!o.not  || !flagOn(o.not)));
  return String((w && w.name) || P.name || P.n || '');
}
let hotspots=[];
function drawPlaces(scaleH,horizon,sinp,cosp){
  const sxk=W/BW, syk=VIEWH/BH;
  hotspots=[];
  /* 對白中整層讓開（ver -1183）：名牌與金箭頭就落在立繪的臉與對話框上。
     ⚠ `hotspots` 要**先清空再 return** —— 只是不畫的話上一幀的熱區還留著，
       玩家推對白點到那個位置就會被判成「點地標」（而畫面上根本沒有東西）。 */
  if(talkingNow()) return;
  const list=[];
  PLACES.forEach(P=>{
    if(P.flag && !flagOn(P.flag)) return;   // ver -858：發現旗才畫（夏爾森林）
    const dx=P.wx-cam.x, dy=P.wy-cam.y;
    const z=dx*(-sinp)+dy*(-cosp);
    if(z<10||z>ZFAR*0.92) return;
    const s=(dx*cosp+dy*(-sinp))/z;
    if(s<-1.1||s>1.1) return;
    list.push({P,bx:((s+1)/2*BW)*sxk,
                 by:(((cam.alt-(P.h||0))/z + z*curvAt(s))*scaleH+horizon)*syk,
                 z, near:Math.hypot(dx,dy)<NAME_DIST});
  });
  list.sort((a,b)=>b.z-a.z);
  list.forEach(o=>{
    const fade=clamp((ZFAR*0.92-o.z)/240,0,1);
    ctx.globalAlpha=fade;
    /* ⚠ 只有「遠處的箭頭」浮動。名牌一旦展開就整組定住 ——
       名牌是要讀的字，2.5px 的正弦擺動在 11px 的字上等於一直在晃，
       而且它同時是點擊熱區，會動的按鈕本來就難按。
       座標取整：字落在半個像素上會被反鋸齒糊掉，看起來也像在抖。 */
    const ay=Math.round(clamp(o.by-30,18,VIEWH-40));   // 箭頭底端（指著地標）
    const bx=Math.round(o.bx);
    const bob=o.near?0:Math.sin(performance.now()*0.004+o.bx)*2.5;

    // 向下箭頭
    ctx.fillStyle= o.near ? '#c9a227' : 'rgba(201,162,39,.62)';
    ctx.beginPath();
    ctx.moveTo(bx, ay+bob);
    ctx.lineTo(bx-6.5, ay-10+bob);
    ctx.lineTo(bx+6.5, ay-10+bob);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle='rgba(8,7,12,.55)'; ctx.lineWidth=1; ctx.stroke();

    // 近距離才展開名牌（＝可點擊）
    if(o.near){
      ctx.font='11px "Noto Serif TC",serif'; ctx.textAlign='center';
      const nm=placeName(o.P);
      const tw=Math.round(ctx.measureText(nm).width);
      const bx0=bx-((tw/2)|0)-9, by0=ay-32, bwid=tw+18, bhei=18;
      ctx.fillStyle='rgba(5,6,12,.8)'; ctx.fillRect(bx0,by0,bwid,bhei);
      ctx.strokeStyle='#c9a227'; ctx.lineWidth=1; ctx.strokeRect(bx0+0.5,by0+0.5,bwid,bhei);
      ctx.fillStyle='#c9a227'; ctx.fillText(nm,bx,by0+13);
      // 點擊熱區放大一圈，手指才好按
      hotspots.push({x:bx0-8,y:by0-8,w:bwid+16,h:bhei+22,P:o.P});
    }
    ctx.globalAlpha=1;
  });
}

/* ══ 飛鳥群 ══════════════════════════════════════════════════════════
   偶爾一群鳥橫過視野。純氣氛，沒有互動。
   ⚠ 不做成「敵人」的一種：牠們不需要狀態機、不需要遭遇判定，
     共用那套只會把敵人的邏輯撐得更複雜。
   ⚠ 編隊用「領頭鳥 + 各自的偏移」而不是每隻獨立飛：獨立飛的話再怎麼調
     都像一把散開的點，看不出是一群。偏移帶各自的緩慢繞行，群才會呼吸。
   ⚠ 拍翅相位每隻錯開：整群同步拍翅非常假，那是複製貼上的讀感。 */
const FLOCK_CFG = {
  gapMin: 22000, gapMax: 46000,   // 兩群之間的間隔（ms）
  n: [7, 16],                     // 每群幾隻
  spawnDist: 900,                 // 生成距離（世界單位）——比怪近得多，要看得清
  speed: 2.6,                     // 世界單位／(ms*0.06)，約玩家極速的 43%
  spread: 120,                    // 編隊散佈半徑（世界單位）
  life: 26000,                    // 活這麼久就散（ms）
};
let flock=null, flockTimer=FLOCK_CFG.gapMin*0.5;

function spawnFlock(){
  const C=FLOCK_CFG;
  // 生在側前方，讓牠橫過視野；高度落在玩家上下，有時從下方掠過
  const a=cam.angle+(Math.random()<0.5?1:-1)*(0.5+Math.random()*0.8);
  const x=cam.x-Math.sin(a)*C.spawnDist, y=cam.y-Math.cos(a)*C.spawnDist;
  // 航向：橫過玩家前方（不朝玩家來，也不背離）
  const h=cam.angle+(Math.random()<0.5?1:-1)*(1.2+Math.random()*0.6);
  const n=C.n[0]+((Math.random()*(C.n[1]-C.n[0]+1))|0);
  const birds=[];
  for(let i=0;i<n;i++){
    birds.push({
      // 編隊偏移：V 字骨架加一點亂數，免得排得太整齊像圖表
      ox:(Math.random()-0.5)*C.spread,
      oy:(Math.random()-0.5)*C.spread,
      oa:(Math.random()-0.5)*70,          // 高度偏移
      orb:Math.random()*6.28,             // 各自緩慢繞行的相位
      wing:Math.random()*6.28,            // 拍翅相位：錯開才不像複製貼上
      hz:0.020+Math.random()*0.010,       // 拍翅頻率也各自不同
    });
  }
  flock={ x, y, alt:cam.alt+(Math.random()-0.45)*160,
          hx:-Math.sin(h), hy:-Math.cos(h), birds, t0:performance.now() };
}

function updateFlock(dt,now){
  const C=FLOCK_CFG;
  if(!flock){
    flockTimer-=dt;
    if(flockTimer<=0) spawnFlock();
    return;
  }
  const mv=C.speed*dt*0.06;
  flock.x+=flock.hx*mv; flock.y+=flock.hy*mv;
  const dx=flock.x-cam.x, dy=flock.y-cam.y;
  if(now-flock.t0>C.life || Math.hypot(dx,dy)>2600){
    flock=null;
    flockTimer=C.gapMin+Math.random()*(C.gapMax-C.gapMin);
  }
}

function drawFlock(scaleH,horizon,sinp,cosp,now){
  if(!flock) return;
  const sxk=W/BW, syk=VIEWH/BH;
  const S=sky();
  const lit=clamp(0.22+S.day*0.78,0.22,1);
  const col='rgba('+Math.round(38*lit+8)+','+Math.round(34*lit+8)+','+Math.round(32*lit+10)+',';
  ctx.save();
  for(const b of flock.birds){
    const orb=now*0.0009+b.orb;
    const wx=flock.x+b.ox+Math.cos(orb)*16, wy=flock.y+b.oy+Math.sin(orb*1.3)*16;
    const dx=wx-cam.x, dy=wy-cam.y;
    let z=dx*(-sinp)+dy*(-cosp);
    if(z<30||z>ZFAR*0.55) continue;                  // 太遠就看不見了，不必畫
    const sv=(dx*cosp+dy*(-sinp))/z;
    if(sv<-1.25||sv>1.25) continue;
    const alt=flock.alt+b.oa+Math.sin(orb*0.8)*10;
    const px=((sv+1)/2*BW)*sxk;
    const py=(((cam.alt-alt)/z + z*curvAt(sv))*scaleH+horizon)*syk;
    const sc=W/(2*z);
    const span=Math.max(1.2, sc*22);                 // 翼展（世界單位 22）
    if(span<1.0) continue;
    /* 一隻鳥就是一個「M」：兩撇翅膀，拍動時改的是**上揚的幅度**。
       這個尺寸下畫身體是浪費，剪影才是辨識點。 */
    const f=Math.sin(now*b.hz+b.wing);
    const up=span*0.34*f;
    ctx.strokeStyle=col+(0.62+0.24*S.day).toFixed(2)+')';
    ctx.lineWidth=Math.max(0.8,span*0.13);
    ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.beginPath();
    ctx.moveTo(px-span*0.5, py-up);
    ctx.lineTo(px,           py+span*0.06);
    ctx.lineTo(px+span*0.5, py-up);
    ctx.stroke();
  }
  ctx.restore();
}

/* ══ 敵人：巨型蜈蚣（FLM_CENTIPI）════════════════════════════════════
   ▍雙軌（同飛空艇）
   有去背素材時走精靈模式（頭／體節／尾／左右翅分層，比照 split_ship.py 的
   作法由腳本自動拆），沒有就走下面的程序繪製。現在是程序版——
   resources/flight_enemy/flm_centipi.png 是六視圖合成稿，**背景不透明**
   （模糊紅金漸層）而翅膀是半透明的，自動去背會把翅膀一起吃掉，得先有去背稿。
   行為與動畫先做完，素材到位只要把 drawBody/drawWings 換成貼圖層即可。

   ▍為什麼身體要分節
   單張圖不可能「扭」。體節各自帶一個相位差，正弦波沿身體由頭往尾 traveling，
   那才是蜈蚣的蛇行。跟飛空艇「前帆先甩、後帆跟上」是同一套延遲鏈。

   ▍為什麼投影逐節算
   每一節都走跟地形/聚落完全同一條投影式 → 透視、朝向、貼地關係全部免費，
   不必另外算旋轉矩陣（同 ver -140 聚落改逐點投影的理由）。

   ▍行為
   50~60 秒自遠方刷新一隻 → 以刷新當下的相對距離 D0 為基準巡航 →
   距離縮至 0.7·D0 轉為主動追擊 → 進船身一定範圍顯示「進入戰鬥」→
   3 秒後與敵人一同消失，重新計時。戰鬥本身尚未實作。 */
const ENEMY_CFG = {
  gapMin: 30000, gapMax: 40000,   // 刷新間隔（ms；ver -481，Ray：「30~40秒刷一隻」）
  /* 速度＝玩家極速的倍數。1.20 時牠整個撞上來——比玩家快的追擊者在
     這種正面接近的幾何下沒有周旋餘地，玩家等於只能挨撞。0.60 讓牠
     略慢於玩家，遭遇變成「牠攔在航路上」而不是「牠追上你」。 */
  speedK: 0.60,
  pixelScale: 1.0,                // 繪製解析度（×BW/W）——見 drawEnemy3D 的像素化
  chaseAt: 0.60,                  // 距離縮到 D0 的這個比例 → 轉主動追擊
  /* 距離又被拉開到 D0 的這個比例 → 放棄追擊、回歸原本的橫向巡航。
     ⚠ 必須大於 chaseAt：同一個門檻進出，玩家停在邊界上時會每幀在

/* ══⚠⚠⚠ 稀有等級 → **出現率**（ver -1188，Ray 定案）══════════════════════════
   > 「E 是 50% 的出現率／D 20%／C 15%／B 10%／A 5%／S 滿足特定條件才出現」
   ⚠⚠ **這是「等級」的出現率，不是「那一隻」的**（-500 的舊表是逐隻加權，
     五隻 E 的怪加起來會把別的等級擠掉）—— 所以抽法改成**兩段**：
       ① 先照這張表抽**等級**（只在**有合格成員**的等級之間正規化）
       ② 再在那一級裡**等機率**抽一隻
     這樣「E 是 50%」才真的是 50%，與那一級裡有幾隻無關。
   ⚠⚠ **S 不進隨機抽選**（Ray：「滿足特定條件才出現」，條件他還沒給）——
     劇本遭遇（指定 kind）照舊叫得出 S 的怪，那條路不經過這裡。
     條件給了之後：把它加進 `RARITY_ROLL`、並在 `enemyKindEligible` 補那道守門。 */
const ENEMY_RARITY_P={E:50,D:20,C:15,B:10,A:5};        // ⚠ S 不在表上＝不隨機出
const RARITY_ROLL=['E','D','C','B','A'];               // 抽選的順序（只影響除錯時好不好讀）
function enemyKindEligible(k, x, y){
  const K=ENEMY_KINDS[k];
  if(K.fromStage && gameStage() < K.fromStage) return false;
  if(K.landOnly){
    const mx=(x/MAP_SCALE)|0, my=(y/MAP_SCALE)|0;
    if(mx<0||my<0||mx>=MAPW||my>=MAPH) return false;
    if(!HGT || HGT[my*MAPW+mx] <= CLOUD_H) return false;   // 雲海之下＝海域 → 全陸域的怪不出
  }
  /* `notRegion`（ver -509，空賊船：[區域：薩梅爾空域外全域]）：生成點落在這個
     國界之內就不出。⚠ 國界圖沒載完（REGION null）一律**不合格** —— regionAt 那時
     回 0 會被誤判成「已出薩梅爾」（§6.10 劇本遭遇那條踩過的坑），寧缺勿濫。 */
  if(K.notRegion!=null){
    if(!REGION) return false;
    if(regionAt(x/MAP_SCALE, y/MAP_SCALE)===K.notRegion) return false;
  }
  return true;
}

  const p=ENEMY_RARITY_P[r]||0;

function pickEnemyKind(x, y){
  const pool=Object.keys(ENEMY_KINDS).filter(k=>enemyKindEligible(k,x,y));
  if(!pool.length) return null;
  /* 依等級分堆。⚠ 沒有成員的等級**不參與正規化** —— 不然「那一級抽到了但沒人」
     就得重抽，而重抽會把機率悄悄推回去。 */
  const by={}; 
  for(const k of pool){
    const r=ENEMY_KINDS[k].rarity;
    if(!ENEMY_RARITY_P[r]) continue;            // ⚠ S（或沒寫等級）不進隨機池
    (by[r]=by[r]||[]).push(k);
  }
  const tiers=RARITY_ROLL.filter(r=>by[r] && by[r].length);
  /* 整池都是 S／沒寫等級 ⇒ 退回「等機率抽一隻」，不要回 null（那會變成不出怪）。 */
  if(!tiers.length) return pool[(Math.random()*pool.length)|0];
  let tot=0; for(const r of tiers) tot+=rarityP(r);
  let x2=Math.random()*tot, pick=tiers[tiers.length-1];
  for(const r of tiers){ x2-=rarityP(r); if(x2<=0){ pick=r; break; } }
  const g=by[pick];
  return g[(Math.random()*g.length)|0];
}

function drawIntroArt(now){

  const j=dt<700 ? 7*(1-dt/700) : 0;
  const ox=(Math.random()*2-1)*j, oy=(Math.random()*2-1)*j;
  const im=introArt.img;

  const k=Math.max(W/im.width, VIEWH/im.height);
  const dw=im.width*k, dh=im.height*k;
  const bx=(W-dw)/2+ox, by=(VIEWH-dh)/2+oy;
  ctx.save();
  ctx.drawImage(im, bx, by, dw, dh);

/* opt（全部選填，劇本遭遇用；不給就是平時那隻隨機刷的）：
     kind      指定怪種      ahead  生在正前方並直接朝玩家撲（state 直接進 chase）
     speedMul  速度倍率      script 這一隻是哪一條劇本遭遇（交棒時要記旗標） */
function spawnEnemy(opt){
  opt=opt||{};
  const C=ENEMY_CFG;
  /* 生成方位：一律在**視野之外**。敵人不該在玩家眼前憑空出現 ——
     擺到畫面外再讓牠自己漂進來，出場就有了來處。
     （先前的作法是生成一團雲霧罩住牠，已撤：那是遮蔽而不是解決，
       而且雲團得另外管生命週期，還跟共用的 PUFFS 回收邏輯打架。） */
  /* ⚠ 劇本遭遇是**正前方**：偏移角 0 ＝玩家的航向，所以牠一定在畫面正中，
     而且距離會隨玩家自己前進一起縮短（不像平時那隻是橫著切過去的）。 */
  const off=opt.ahead ? 0
          : C.spawnOffMin+Math.random()*(C.spawnOffMax-C.spawnOffMin);
  const a=cam.angle+(Math.random()<0.5?off:-off);
  const ox=-Math.sin(a), oy=-Math.cos(a);
  /* 生成距離可逐次覆寫（ver -455）：劇本遭遇要生得近一點 —— 2800 幾乎貼著
     ZFAR 的霧，玩家看到的是一顆霧裡的小點；1800 在視野的清楚段，
     「有東西正面撲過來」第一眼就成立。 */
  const sd=opt.spawnDist||C.spawnDist;
  const x=cam.x+ox*sd, y=cam.y+oy*sd;
  /* 巡航朝向：**橫向**切過視野，不是直直朝玩家飛。
     直朝玩家的話，牠一路都是頭對著鏡頭——正俯視下只看得到一顆頭和兩片翅，
     體節、步足、蛇行全部縮在後面看不見，玩家根本認不出那是什麼東西，
     只知道有東西撞上來。轉成側向，牠的側面才展開給玩家看。
     ⚠ 純 90°，**不留內收**：巡航階段牠只是橫越，不朝玩家來。
       這代表距離不會自己縮短（自定點作垂直運動，距離只會變大），
       追擊要靠**玩家自己接近**才會觸發——那正是要的：牠攔在航路上，
       你可以繞開，靠太近牠才轉頭。 */
  let tx=cam.x-x, ty=cam.y-y;
  const L=Math.hypot(tx,ty)||1; tx/=L; ty/=L;
  /* 橫向有兩個方向，要選**朝畫面內**那一側 —— 隨機選的話有一半機率
     牠會往畫面外漂走，玩家一輩子看不到那隻。
     判法：各往前試一小步，取投影橫向位置 |sv| 較小的那個。 */
  const sinp0=Math.sin(cam.angle), cosp0=Math.cos(cam.angle);
  const svOf=(px2,py2)=>{
    const dx2=px2-cam.x, dy2=py2-cam.y;
    const z2=dx2*(-sinp0)+dy2*(-cosp0);
    return Math.abs((dx2*cosp0+dy2*(-sinp0))/(Math.abs(z2)<1?1:z2));
  };

  if(opt.ahead){
    /* 劇本遭遇：朝向直接指著玩家（狀態也直接進 chase）—— 牠是來攔你的，不是路過。 */
    hx=tx; hy=ty;

     合格條件寫在 kind 上：
       fromStage — stage 幾之後才登場（羽蛇＝2，Ray：「stage2 的劇情之後才會
                   加入隨機敵人」；stage 由主線 setStage 推進）
       landOnly  — [區域：全陸域]：生成點的地形要在雲海之上（雲海＝這個世界的海，
                   同 seaProbe 的判法：HGT ≤ CLOUD_H ＝海）。
     劇本遭遇（opt.kind 指定）不經過抽選，照舊。 */
  const kind=(opt.kind && ENEMY_KINDS[opt.kind]) ? opt.kind : pickEnemyKind(x,y);
  if(!kind) return;                       // 這一格沒有合格的怪（理論上不會：蜈蚣/空賊無條件）
  const K=ENEMY_KINDS[kind];
  /* cruiseHx/cruiseHy、alt0＝「原本的動作」。放棄追擊時要能回到這裡，
     而且是轉回去不是跳回去（同追擊的限角速度）。 */
  const alt0=opt.ahead ? cam.alt : cam.alt+Math.random()*60-20;
  /* ⚠⚠ **只要生成就追**（ver -478，Ray：「怪只要生成就會追到進戰鬥為止」）：
     平時那隻也直接進 chase —— 朝向仍是橫向起步（上面挑好的 hx/hy），
     追擊的限角速度會把牠劃一道弧彎過來，側面照樣先展開給玩家看。

  enemy={ x, y, alt:alt0, alt0, hx, hy, cruiseHx:hx, cruiseHy:hy, kind,
          d0:sd, state:'chase', tEngage:0, phase:Math.random()*6.28,
          t0:performance.now(), trail:[],
          /* ⚠ 速度**只在這裡算一次**（鐵律 7）：`K.speedK` 是平時的倍率，劇本遭遇再乘

  for(let i=1;i<=Math.ceil(K.bodyLen/C.trailStep)+4;i++)

     以前重設只有三處（engage 逾時／長按生怪／降落進城），交棒進戰鬥那一條沒有。
     ⚠ 劇情戰特別明顯：打完那一刻 `done` 旗一立，雜怪的閘門
       （`SCRIPTED_ENCOUNTERS.some(S=>!flagOn(S.done))`）同時打開，兩件事撞在一起。
     ⚠ 收在**生成的那一支**（鐵律 8）：計時器歸零的路徑不只一條（交棒、掉頭離開、
       劇本怪插隊），寫在各個呼叫端一定會漏掉其中一條 —— 這一次漏的就是交棒。
     ⚠ 間隔在 `enemy` 存在期間是**凍著**的（`-=dt` 在 `if(!enemy)` 裡面），
       所以這一行等於「這一隻處理完之後，再等一個完整的間隔」。 */
  enemyTimer=C.gapMin+Math.random()*(C.gapMax-C.gapMin);
  /* ══⚠⚠⚠ 索菈娜「發現了」**只給「主動按著畫面生怪」那一條**（ver -1362 改定，Ray：
       「索敵的索拉娜 ci 是**主動按著畫面才觸發**，並不是**畫面刷怪就跑一次 ci**」
       「索敵是生怪才有的特效，並不是有怪就跑索敵動畫」）══
     -1089 原本收在**生成的那一支**，理由是「劇本遭遇、自動刷新、長按生怪三條路
     都經過這裡」（鐵律 8）—— **那個收法本身沒錯，錯在收的範圍**：
     它讓**每一次自動刷怪**都插播一張她的半透明立繪＋一句語音。
     ⚠⚠⚠ 而且**沒有任何守門**，於是：
       · **S2 就會演** —— 索菈娜 `from:8`，那時她根本還沒入隊，
         畫面上卻是她開口說「發現了」。Ray 回報的「我現在在 s2 就常常按出索敵」
         就是這個（不是 `featureOn` 那三道閘門 —— 實測 S1/2/7 全 false）。
       · 玩家沒有做任何動作，演出卻自己跳出來 —— 那不是「索敵」，那是插播。
     ⇒ 現在只有 `opt.byHold`（長按天空生怪）才演：**玩家按著畫面，她回報找到了**。
     ⚠ 這一條**不牴觸鐵律 8**：判定仍然只有這一處，改的是**條件**不是位置 ——
       三條生成路徑照舊都經過這裡，只是其中兩條不演。
     ⚠ 連帶：`canSpawnHold()` 要 `featureOn('sense')`（S8＋），所以這一段
       自然落在索菈娜入隊之後 —— **不必另外加一道章節鎖**（鐵律 7：
       同一個條件不要寫兩次）。
     ⚠⚠ **ver -1363 起長按生怪不再是管理人限定**（Ray 定案），所以她這一段
       **一般玩家真的看得到** —— -1362 收窄時留下的那個疑慮（「CI 與兩組語音
       會不會變成開發限定」）已經自己解掉了。 */
  /* ⚠⚠⚠ ver -1433：`spotFire()` 已**移到 `spawnByHold()`**（Ray：「教學的獵手之眼
     要跑索敵動畫跟語音」）—— 那一段走的是**劇本遭遇**（`spawnScripted`），
     根本不經過這一支，所以索敵的 CI 與語音整個沒演。
     ⇒ 落點改成「長按天空真的撐滿了」那一刻：**兩條生成路徑（劇本／隨機）都演**，
       而那正是「玩家按著畫面，她回報找到了」的定義（鐵律 8）。 */
}

function updateEnemy(dt,now){
  const C=ENEMY_CFG;
  if(s9On) return;      // Stage9 飛行段演出中：不刷怪也不推進追擊（ver -1104）
  const K=enemy?ENEMY_KINDS[enemy.kind]:null;
  if(!enemy){
    /* 劇本遭遇**優先於自動刷新**：條件到了就立刻生，不等計時器（Ray：「立刻刷怪」）。 */
    const S=scriptedDue();
    if(S){ spawnScripted(S); return; }
    /* ⚠⚠ **第一隻劇本蜈蚣打完之前，一隻雜怪都不刷**（ver -483（-893 前用詞），Ray：「在第一隻
       蜈蚣出場前不要有其他怪」；-454 只擋「排隊中」——旗標還沒立的試飛時段、
       打輸重生等待再刷的空檔都漏）。判準是**還有劇本遭遇沒打完**（done 旗標）。
       ⚠ 開發時要怪就按「生怪」鈕（它走 spawnEnemy 直達，不經這裡）。
       ⚠ 日後加了更後期的劇本遭遇，這一條會把雜怪一路封到那一場打完 ——
         到時把判準改成「旗標已立而未打完」（加回 flagOn(S.flag)）。 */
    if(SCRIPTED_ENCOUNTERS.some(S=>!flagOn(S.done))) return;
    if(scriptPending) return;
    /* ══ 船不動就不生怪（ver -756，Ray：「飛行地圖若不動就不生怪」）══
       停著＝看地圖／掛機／整理，不該被怪撞。計時器**凍著**（不扣 dt），
       一開船才繼續倒數。⚠ 0.06 ＝螺旋槳／環境音那條「在動」的同一個門檻。 */
    if(Math.abs(cam.speed)<=0.06) return;
    enemyTimer-=dt;
    if(enemyTimer<=0) spawnEnemy();
    return;
  }
  /* 條件在「場上已經有一隻平時的怪」時才到（玩家繞路繞久了）：
     牠**掉頭離開**（ver -478，Ray：「有劇情怪的話就掉頭」）—— 不是原地消失：
     轉身飛遠、拉開到生成距離就撤場；槽位空了，下一幀上面 `!enemy` 那一支
     自然把劇本怪刷出來。
     ⚠ 已經在交棒（engage）的那一隻不能動 —— 牠正要進戰鬥。 */
  if(!enemy.script && enemy.state!=='engage' && enemy.state!=='flee'){
    if(scriptedDue()) enemy.state='flee';
  }
  const dx=cam.x-enemy.x, dy=cam.y-enemy.y;
  const dist=Math.hypot(dx,dy);
  /* 追擊的最近點（ver -502 錯身判定用）。只在 chase 記 —— flee/cruise 不算追。 */
  if(enemy.state==='chase') enemy.minDist=Math.min(enemy.minDist!=null?enemy.minDist:Infinity, dist);

  if(enemy.state==='engage'){
    // 提示停留中：敵人停住，時間到就一同消失並重新計時
    if(now-enemy.tEngage>=C.holdMs){
      enemy=null;
      enemyTimer=C.gapMin+Math.random()*(C.gapMax-C.gapMin);
    }
    return;
  }

  /* ⚠⚠ **不放棄追擊**（ver -478，Ray：「只要生成就會追到進戰鬥為止」）——
     原本的 giveUpAt（拉開到 0.85·d0 回歸巡航）整段撤掉；chaseAt 也不再有事做
     （生成即 chase）。追擊只在三個出口結束：進戰鬥（engage/交棒）、
     劇本怪要上場（flee，見上）、降落進城（doLand 清場）。
     giveUpAt/chaseAt 兩個常數留在 ENEMY_CFG 當紀錄。 */
  /* 掉頭離開（flee，ver -478）：往遠離玩家的方向轉（同追擊的限角速度——
     直接反轉朝向是瞬間直角轉彎），爬回原高度，拉開到生成距離就撤場。 */
  if(enemy.state==='flee'){
    const cur=Math.atan2(enemy.hy,enemy.hx), want=Math.atan2(-dy,-dx);
    let da=want-cur;
    while(da>Math.PI) da-=Math.PI*2;
    while(da<-Math.PI) da+=Math.PI*2;
    const step=clamp(da,-K.turnRate*dt,K.turnRate*dt);
    const na=cur+step;
    enemy.hx=Math.cos(na); enemy.hy=Math.sin(na);
    const rollWant=clamp(step/Math.max(1,dt)/K.turnRate,-1,1);
    enemy.roll=(enemy.roll||0)+(rollWant-(enemy.roll||0))*(1-Math.exp(-dt/260));
    enemy.alt+=((enemy.alt0!==undefined?enemy.alt0:enemy.alt)-enemy.alt)*(1-Math.exp(-dt/420));
    if(dist>Math.max(enemy.d0, C.spawnDist)){ enemy=null; return; }
  }
  if(enemy.state==='cruise'){
    /* 回歸原動作：朝向轉回生成時的橫向巡航方位，高度爬回原高度。
       兩者都用與追擊相同的收斂方式，放棄追擊看起來才像「牠失去興趣、
       慢慢轉回去繼續走」，而不是瞬間切換成另一個東西。 */
    const cur=Math.atan2(enemy.hy,enemy.hx), want=Math.atan2(enemy.cruiseHy,enemy.cruiseHx);
    let da=want-cur;
    while(da>Math.PI) da-=Math.PI*2;
    while(da<-Math.PI) da+=Math.PI*2;
    if(Math.abs(da)>1e-3){
      const step=clamp(da,-K.turnRate*dt,K.turnRate*dt);
      const na=cur+step;
      enemy.hx=Math.cos(na); enemy.hy=Math.sin(na);
      const rollWant=clamp(step/Math.max(1,dt)/K.turnRate,-1,1);
      enemy.roll=(enemy.roll||0)+(rollWant-(enemy.roll||0))*(1-Math.exp(-dt/260));
    }else{
      enemy.roll=(enemy.roll||0)*Math.exp(-dt/260);
    }
    enemy.alt+=((enemy.alt0!==undefined?enemy.alt0:enemy.alt)-enemy.alt)*(1-Math.exp(-dt/420));
  }
  if(enemy.state==='chase'){
    /* 轉向限角速度：直接把朝向換成「指著玩家」是瞬間直角轉彎，
       一隻二十幾節的長蟲不可能那樣動。這裡只讓朝向每幀朝目標轉一小步，
       身體再靠下面的軌跡跟上 —— 頭先轉、身體循著頭走過的路彎過去，
       那個時間差才是「活的東西在轉身」的讀感來源（同飛空艇帆的延遲鏈）。 */
    const want=Math.atan2(dy,dx), cur=Math.atan2(enemy.hy,enemy.hx);
    let da=want-cur;
    while(da>Math.PI) da-=Math.PI*2;
    while(da<-Math.PI) da+=Math.PI*2;
    /* 終端撲擊（ver -502）：接近程度 0（lungeDist 外）→ 1（engage 內緣），
       角速度與速度跟著放大 —— 係數存在 enemy.lunge，位移那一行讀它（鐵律 7）。 */
    const lf=clamp(1-(dist-C.engage)/Math.max(1,C.lungeDist-C.engage),0,1);
    enemy.lunge=lf;
    const turnR=K.turnRate*(1+(C.lungeTurn-1)*lf);
    const step=clamp(da,-turnR*dt,turnR*dt);
    const na=cur+step;
    enemy.hx=Math.cos(na); enemy.hy=Math.sin(na);
    /* 角速度 → 側傾。船轉彎會外傾，那是「在轉」最直接的視覺線索；
       沒有它，換視角就只是一連串靜態的圖在交替。
       低通濾一下：直接吃瞬時角速度會隨 dt 抖。 */
    const rollWant=clamp(step/Math.max(1,dt)/turnR,-1,1);
    enemy.roll=(enemy.roll||0)+(rollWant-(enemy.roll||0))*(1-Math.exp(-dt/260));
    /* 追擊時沉到玩家高度**之下**：船是固定畫在畫面 76% 高的精靈，
       敵人若與船同高，投影出來會停在地平線附近（畫面 30% 高）——
       兩者永遠碰不到一起，逼近的壓迫感就沒了。
       ⚠ 原本是「以固定最大速率朝定值下沉」：追擊一觸發就瞬間進入最大下降率、
         到位又突然停住，兩端各有一個速度折點 —— 看起來就是高度驟降一階。
         改兩件事：
           · 目標高度隨**接近程度**連續變（越近沉得越深），不是一觸發就跳到底
           · 用指數逼近而非固定速率，起降兩端都自然收斂
         再加一點振翅造成的上下浮動，昆蟲本來就不會飛得像條直線。 */
    const near=clamp(1-dist/Math.max(1,enemy.d0*C.chaseAt),0,1);
    const wantAlt=cam.alt-C.diveAlt*near;
    enemy.alt+=(wantAlt-enemy.alt)*(1-Math.exp(-dt/420));
  }

  /* 撲擊加速只在 chase（ver -502）：其他狀態 lunge 不設或不吃。 */
  const lungeK=(enemy.state==='chase' && enemy.lunge) ? (1+(C.lungeSpd-1)*enemy.lunge) : 1;
  const mv=MAX_SPD*enemy.spdK*lungeK*dt*0.06;   // 與玩家同一套積分（見 update 的 mv）
                                          // ⚠ spdK 在 spawnEnemy 算好（含劇本遭遇的倍率），這裡只讀
  enemy.x+=enemy.hx*mv; enemy.y+=enemy.hy*mv;

  /* 軌跡：每前進 trailStep 就記一點。身體是沿這條軌跡排的，
     所以牠轉彎時身體會循著頭走過的路彎過去，而不是整條剛體一起轉。 */
  const tl=enemy.trail, hd=tl[0];
  if(!hd || Math.hypot(enemy.x-hd.x,enemy.y-hd.y)>=C.trailStep){
    tl.unshift({x:enemy.x,y:enemy.y});
    const maxN=Math.ceil(K.bodyLen/C.trailStep)+6;
    if(tl.length>maxN) tl.length=maxN;
  }

  /* ⚠⚠ 劇本遭遇**看得到才進戰鬥**（ver -455，Ray：「確保玩家不會是在沒看到
     蜈蚣的狀況下進入戰鬥」）。牠是正面刷出、直奔而來的 —— 但玩家可能在牠
     逼近的那幾秒裡轉了向，牠就從側後方追上：距離到了、畫面上卻沒有牠。
     沒看到就**先不交棒**，牠繼續追著咬（本來就不放棄）；玩家一回頭看到牠，
     下一幀就進戰鬥。⚠ 只管劇本遭遇：平時的怪照舊「不論前後左右」（Ray 舊規）。 */
  /* ⚠ 掉頭中的那一隻**不交棒**（ver -478（-893 前用詞））：牠正在讓位給劇本怪，
     玩家追上去貼臉也不該把牠打下來 —— 那一場注定是劇本怪的。 */
  /* 錯身而過＝接戰（ver -502，見 ENEMY_CFG.nearMiss）。
     ⚠ 只給平時的怪：劇本遭遇有「看得到才進戰鬥」的硬規（ver -455），
       從側後方錯身交棒會違反它 —— 牠本來就正面撲來，錯身極少發生。 */
  const nearMissHit = !enemy.script && enemy.state==='chase'
    && enemy.minDist!=null && enemy.minDist<C.nearMiss && dist>enemy.minDist+40;
  /* 劇本遭遇的接近加速（ver -745，Ray：「接近玩家時兩倍速」）：
     只乘一次（nearApplied），連續判會每幀翻倍。 */
  if(enemy.script && enemy.script.nearMul && !enemy.nearApplied && dist<enemy.script.nearDist){
    enemy.spdK*=enemy.script.nearMul; enemy.nearApplied=true;
  }
  if((dist<=C.engage || nearMissHit) && enemy.state!=='flee'){
    if(enemy.holdBattle) return;   // 登場演出保留中（ver -741 羽蛇）：開戰由演出收尾自己叫
    if(enemy.script){
      /* ⚠ 上面的 dx/dy 是「玩家−敵人」，投影要的是「敵人−鏡頭」＝取負。 */
      const ex=-dx, ey=-dy;
      const zE=ex*(-Math.sin(cam.angle))+ey*(-Math.cos(cam.angle));
      const svE=zE>40 ? Math.abs((ex*Math.cos(cam.angle)+ey*(-Math.sin(cam.angle)))/zE) : 9;
      if(zE<=40 || svE>1.15) return;          // 在身後／畫面外 → 先不進
      /* 演出型（羽蛇）：**撞上這一刻**才進劇情（ver -745）—— 不交棒，
         改跑登場序列（凍結、戰鬥圖背景、對白…），開戰由序列收尾自己叫。 */
      if(enemy.script.intro==='serpent' && !enemy.introRan){
        enemy.introRan=true; runSerpentIntro(enemy.script); return;
      }
    }
    enemy.state='engage'; enemy.tEngage=now; toBattle(enemy.kind);
  }
}

/* ══ 遭遇 → 舒爾特盤（ver -382（-893 前用詞），Ray：「怪碰到船以後進入舒爾特盤」）══
   飛行頁與主遊戲是**兩個頁面**，所以交棒走 localStorage：
     `tivot_battle_req_v1`  這一場要打誰（`config.battles` 的鍵）
     `tivot_flight_ret_v1`  打完回來要站在哪（座標／航向／高度）
   主遊戲那邊由 `main.js` 在讀取頁被點掉之後接手；打贏才跳回來，
   打輸走一般的失敗流程（Game Over → 主選單，ver -376 的規矩）。
   ⚠ 只交棒一次：`engage` 每幀都會進來，沒有這道鎖會連跳好幾次。
   ⚠ 留 1.1 秒讓「遭遇　◯◯」那一格看得到 —— 直接跳頁的話玩家不知道發生什麼事。 */
let battleGoing=false;
let lastBattleScripted=false;   // 剛打的那一場是不是劇本遭遇（見 toBattle 與 __flightResume）
let lastScriptS=null;           // 那一場是哪一條劇本遭遇（打輸重生要重掛，ver -480）
/* ⚠⚠ **父頁說停＝整個模擬凍住**（ver -481，Ray：「飛行畫面一旦關閉就要全部關掉，
   切頁要乾淨」「戰鬥中飛行畫面是暫停的，不會有怪產生」）。
   以前 __flightPause 只收音訊 —— iframe 藏起來之後 rAF 照跑，怪照生、照追、
   照 toBattle：玩家在城鎮跑劇情，背景的飛行頁把棺彈出來（Ray 就撞到這個）。
   extPaused 由 __flightPause／__flightHold 設、__flightResume 清；
   loop() 一開頭就整幀跳過（連畫都不畫 —— 反正看不見）。 */
let extPaused=false;
/* ══ 免戰模式（ver -383，Ray 指定）══
   開著的時候碰到怪**只演「遭遇」那一格**，不跳頁進戰鬥 —— 畫地圖時不會被打斷。
   ⚠ 擋在 `toBattle()` 這**唯一的發動點**（鐵律 8）：日後多一條進戰鬥的路
     （例如空賊主動撞船）也自動吃到，不必再擋一次。
   ⚠ 狀態存 localStorage：畫地圖常常重整，每次重開都要再按一次很煩。
     ⚠ 但也因此**它會一直記著** —— 鈕在開著的時候是綠的，那就是唯一的提醒。
     `progress.newRun()` 不清它：那是工具開關，不是一輪遊戲的進度。 */
const PEACE_KEY='tivot_flight_peace_v1';
let peaceMode=(()=>{ try{ return localStorage.getItem(PEACE_KEY)==='1'; }catch(_){ return false; } })();
{
  const pb=document.getElementById('peaceBtn');
  const sync=()=>{ if(pb) pb.classList.toggle('on', peaceMode); };
  sync();
  if(pb) pb.addEventListener('click',()=>{
    peaceMode=!peaceMode;
    try{ localStorage.setItem(PEACE_KEY, peaceMode?'1':'0'); }catch(_){}
    sync();
  });
}
/* ══ Kerberos 之門（飛行頁這一半，ver -387）══════════════════════════════
   ⚠⚠ 這裡的 `top.ar` / `top.dip` 與主遊戲 `modules/story.js` 的 `KERB_META` **是同一組
     數字**（由 tools/kerberos_cut.py 印出來的）。飛行頁是另一個 HTML、非 module，
     import 不到那一份，所以只能抄一份 —— **改圖重跑腳本之後兩邊都要貼**
     （鐵律 7 的但書：真的必須出現在兩邊時，兩邊註解互指）。
   幾何是**解出來的**：

  /* ⚠⚠ 吊墜**留在面板左上，不掛回門上**（ver -481，Ray：「飛行畫面的吊墜是固定
     吊在操作面版左上方的，所以飛行畫面彈槍棺出來的時候槍棺上不會有吊墜」——
     推翻 -443「推棺那一刻回到門上」）。交棒後主遊戲那一半的門帶著吊墜出現，
     那一格的差異 Ray 知情。棺上推的震動仍讓面板上的吊墜甩一下（慣性）。 */
  fkerbPendSwing(9, 2.0);
  /* 撞頂那一瞬（ver -568）：畫面震＋震動＋吊墜甩得最兇的那一下。 */
  setTimeout(()=>{ fkerbThud(); fkerbPendSwing(22, 2.6); }, FKERB_RISE_MS);
  setTimeout(()=>{
    if(embedded()){
      flightAudio(false);                          // 進戰鬥：這一頁的音樂與環境音收掉
      /* ══⚠⚠ 回程鑰匙（ver -845（-893 前用詞），Ray：「只要不是可以操控的飛行畫面，都應該要把
         飛行畫面 kill 掉」）══ 父頁交棒後會把這個 iframe **整個卸載**（發燙與
         「圖讀不出來」的元凶＝上百 MB 的地形/金字塔一直押著記憶體）。
         所以座標＋勝負記帳要的上下文（這一場是不是劇本遭遇、贏了要記哪支 done）
         **現在**就寫進回程鑰匙 —— 打完重載，restoreFlightPos 讀座標、
         afterBattleReturn 讀上下文（勝負由父頁在重開前補進 `won` 欄）。 */
      try{ localStorage.setItem('tivot_flight_ret_v1', JSON.stringify(
        { x:cam.x, y:cam.y, angle:cam.angle, alt:cam.alt,
          fromBattle:1, scripted: lastBattleScripted?1:0,
          doneKey: (lastBattleScripted && lastScriptS && lastScriptS.done) || null })); }catch(e){}
      /* `scripted`＝這一場是不是**劇情戰**（ver -493（-893 前用詞），Ray：「加上是否為劇情戰的判定，
         之後就讀那一個」）——由發起端（唯一知道的人）宣告，主遊戲照這個分流
         開場白與 talkOnce。隨機遭遇＝false。 */
      window.parent.__tivotFlight.battle({ battle:battleIdFor(kind), geom:fkerbGeom, scripted: lastBattleScripted });
      return;
    }
    /* 獨立模式：照舊寫交棒鑰匙再跳頁。`gate:'kerb'` 告訴主遊戲門已經推到頂了。 */
    try{
      localStorage.setItem('tivot_battle_req_v1',
        JSON.stringify({ battle:battleIdFor(kind), gate:'kerb', geom:fkerbGeom, scripted: lastBattleScripted }));
      localStorage.setItem('tivot_flight_ret_v1', JSON.stringify(
        { x:cam.x, y:cam.y, angle:cam.angle, alt:cam.alt }));
    }catch(e){}
    /* ⚠⚠ **跳最外層那一頁**（ver -415）：如果其實是在 iframe 裡（只是父頁的掛鉤不見了），
       用 `location.href` 會把主遊戲載進**這個小框裡** —— 畫面上就是「遊戲開在遊戲裡」，
       而且那條路徑上還有「開棺」。跳 `window.top` 才是對的。
       ⚠ 用絕對 URL：`window.top.location.href` 的相對路徑是相對**最外層**那一頁解的。 */
    const url=new URL('../index.html', location.href).href;
    try{ (window.top||window).location.href=url; }catch(_){ location.href=url; }
  }, FKERB_RISE_MS+150);
}

/* 這一頁的音樂與環境音：內嵌時由父頁開關（戰鬥期間要安靜，回來要接回去）。
   ⚠ 不能只靠「iframe 藏起來 rAF 就停」：rAF 停了 `updateBgm` 也不再跑，
     那幾個 <audio> 會**維持當時的音量繼續播**。要明確停。 */
function flightAudio(on){
  const loops=[bgmMain, ambSail, ambIdle, sfxTrain, sfxGull];
  for(const L of loops){ try{ on ? L.start() : L.stop(); }catch(_){} }
  /* Crisis（羽蛇劇情段）只收不開（ver -745）：它的生命週期是那一段自己的，
     這裡只是「進戰鬥／被藏起來一定要安靜」的保險（play() 的競態擋不勝擋）。 */
  if(!on){ try{ crisisLoop.pause(); }catch(_){} }
}
/* 父頁在戰鬥打完、要把畫面交還這一頁時呼叫（ver -388）。
   ⚠ `battleGoing` 一定要歸零：不歸零的話船永遠停著（見 update 的那一行），

/* ══ stage2 出航對白（ver -741，Ray 的稿）══
   「蕾：事不宜遲，直接回聖王廳去吧。（地圖彈出，地標。）蕾：看到帝都就表示到了。」
   旗標演完才記（中途重整會重播 —— 城鎮段落同一個慣例）。 */
/* ══ 大地圖上的話框（ver -756）══ 「大地圖」＝**開啟的地圖畫面**（Ray 定義）。
   地圖是一層 DOM（#mapView）蓋在 canvas 上，drawTalk 畫不到那裡 ——
   所以這種「地圖上要講一句話」的框自己是一塊 DOM，疊在地圖下緣。
   樣式仿 canvas 對話框（金框、名字欄）；pointer-events:none ＝ 不擋平移縮放。 */
let mapSayEl=null;
function mapSayShow(name, text){
  mapSayHide();
  const mv=document.getElementById('mapView'); if(!mv) return;
  const el=document.createElement('div');
  /* ver -773（Ray：「大地圖的對話框要用平常一樣的尺寸」）：寬度＝平常飛行
     對話框（compassRect().w，＝方向計那條帶），置中、貼底——不再是 82%。
     配色也對齊平常那個框（名字 #c9a227／內文 #ece6d8／底 .84／框 .55）。 */
  const bw=compassRect().w;
  /* ver -790（Ray：「對話框不要貼底，中心大約在畫面下 1/4 處」）：中心置於畫面
     75% 高（＝下 1/4），不再貼底。 */
  el.style.cssText='position:absolute;left:50%;top:75%;'
    +'transform:translate(-50%,-50%);width:'+bw+'px;box-sizing:border-box;pointer-events:none;z-index:5;'
    +'background:rgba(10,9,16,.84);border:1px solid rgba(201,162,39,.55);border-radius:8px;'
    +'padding:8px 13px 12px;color:#ece6d8;font-size:15px;line-height:1.5;';
  el.innerHTML='<div style="color:#c9a227;font-size:11px;margin-bottom:3px;">'+name+'</div>'+text;
  mv.appendChild(el);
  mapSayEl=el;
}
function mapSayHide(){ if(mapSayEl){ try{ mapSayEl.remove(); }catch(_){} mapSayEl=null; } }

function s9RideWait(done){

       範圍或拉長 `SPAWN_HOLD_MS`，**不要用 ADMIN 兜回去**（那是把功能關掉，不是修）。

/* ⚠⚠ **場上還有怪就不給再生**（ver -1091，Ray：「生怪在結束一場戰鬥前不能再使用」）：
   -1086 那一版是 `enemy=null; spawnEnemy()` —— 等於**把正在追的那隻換掉**，
   索菈娜的「發現了」也跟著重播一次。要生下一隻，先把手上這一隻解決掉
   （打完、或牠自己放棄追擊撤場）。
   ⚠ 交棒進戰鬥的那一秒（`battleGoing`）也擋：那時船與怪都停住了，
     再生一隻只會在門推上去的背後多一個東西。
   ⚠ 判定寫成一支（`canSpawnHold`）：按下去要**先問過**才排計時（沒排就沒有
     那 1.2 秒的空等），計時到了**再問一次**（按著的這 1.2 秒裡可能剛好刷出一隻）。 */
/* ⚠⚠ **生怪吃與索敵同一道門**（ver -1132，Ray：「stage8 之前根本不應該開啟
   索敵生怪」）：它是「長按天空」——與索敵（長按船身）是**同一族手勢、同一章解鎖**，
   能力還沒給的章節裡整個手勢都不該有反應。
   ⚠ 這一道**就是章節鎖本身**（鐵律 7）：別的地方（例如索菈娜那一段 CI）
     要「S8 之後才有」時**問它就好**，不要再寫第二個 `gameStage()>=8`。 */
function canSpawnHold(){ return featureOn('sense') && !enemy && !battleGoing && !s9On; }
function spawnByHold(){
  if(!canSpawnHold()) return;
  /* ⚠⚠ **長按天空＝索菈娜的〈獵手之眼〉索敵**（ver -1418，Ray：「是長按天空，
     船身是安雅的搜索」）。劇本遭遇的 `onSkyHold` 等的就是這一刻 ——
     記在這裡而不是 `pointerdown`：那邊只是起算，撐不滿 `SPAWN_HOLD_MS`
     （或中途動了）就會被 clearTimeout 掉，不算「索敵完成」。 */
  skyHeldOnce=true;
  s9GateHit('skyhold');          // 這一段的教學閘門（ver -1418）：做到了就收掉聚光燈
  /* ⚠⚠ **索敵的 CI 與語音在這裡演**（ver -1433，見 `spawnEnemy` 那一段的說明）——
     它是「長按天空」這個手勢的回饋，與「生出來的是哪一隻」無關。 */
  /* 追那一段：這一按就是要牠出來 —— 讓劇本遭遇搶在隨機刷怪之前（鐵律 7：
     「這一趟該生誰」只有 `scriptedDue` 一支在答）。 */
  /* ⚠⚠⚠ **索敵動畫演完才生**（ver -1480；-1482 修成單一生成點）：
     以前是 `spotFire()` 之後**同一拍**就 spawn —— 玩家看到的是「她還在喊
     『找到了』，怪已經在那裡了」，而且 CI 半透明地蓋滿畫面，那一隻出場根本看不到。
     ⚠⚠ **劇本那條不在這裡生**：`updateEnemy()` 每幀都在問「沒有怪就生劇本遭遇」，
       這裡再生一次就是**一次按出兩隻**（-1480 的病）。這裡只負責**翻旗**，
       生成交給那唯一的一支（鐵律 8）。
     ⚠ 判「這一次是不是劇本那條」要直接看 `scriptPending`，**不能用 `scriptedDue()`**
       —— 那一支現在看的是 `skySpotDone`，這一刻還沒翻，會回 null。 */
  const wantScript = !!(scriptPending && scriptPending.onSkyHold);
  spotFire(()=>{
    skySpotDone=true;                 // 劇本遭遇從這一刻起才放行（見 scriptedDue）
    if(!wantScript) spawnEnemy();     // 隨機那條沒有別人會生，長按就是要牠現在出來
  });
}

/* 程序翅（drawWingsProc）已內聯進 drawEnemy3D（蟲翅/鳥翼兩個分支）——
   ver -495 清死碼時把零呼叫的原函式拆掉，畫法的說明見 drawEnemy3D 該兩段。 */

/* ══ 國界 ══════════════════════════════════════════════════════════
   國界**不畫在畫面上**，只用來定位：飛越國境時左下角淡入淡出顯示當前所在國。

   資料由 build_regions.py 從 Reference/region.png 抽出來（那張是疊在
   silvermoon_sheet.png 上畫的，疊色是線性的所以解得出來；見該檔檔頭）。
   索引圖是半解析度：1 像素 = 2 地圖像素 = 40 世界單位，對「我在哪一國」
   這個用途綽綽有餘，而且整張只有幾 KB。 */
let REGION=null, REGION_W=0, REGION_H=0, REGION_NAME=[];
/* ══ 國界折線（ver -736，Ray：「遊戲中的地圖也要畫出明顯國界線…是按鈕開啟的
   參考地圖」「線就好，不用色塊，因為隨 stage 禁航區會變」）══
   從 REGION 索引圖描出來（鐵律 7：國界只有那一份真相，這裡不另讀檔），
   地圖座標的折線，畫法同 ROAD_PATHS（drawMap 逐點過 reliefXY）。
   只描**國與國**的界（兩側都 >0）：海岸線本來就看得出來，逐島描一圈只是噪音。 */
let BORDER_PATHS=[];
function buildBorderPaths(S){
  BORDER_PATHS=[];
  const W=REGION_W, H=REGION_H, at=(x,y)=>REGION[y*W+x];
  /* ① 收集半解析格邊：左右／上下兩格是不同的國 → 那條格線是界 */
  const list=[];
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const a=at(x,y);
    if(x+1<W){ const b=at(x+1,y); if(a!==b && a>0 && b>0) list.push([x+1,y,x+1,y+1]); }
    if(y+1<H){ const b=at(x,y+1); if(a!==b && a>0 && b>0) list.push([x,y+1,x+1,y+1]); }
  }
  /* ② 端點雜湊把小段串成折線（三國交界的第三條自然斷成另一條，無妨） */
  const key=(x,y)=>x+','+y, adj=new Map();
  list.forEach((s,i)=>{ for(const [px,py] of [[s[0],s[1]],[s[2],s[3]]]){
    const k=key(px,py); if(!adj.has(k)) adj.set(k,[]); adj.get(k).push(i); } });
  const used=new Uint8Array(list.length);
  for(let i=0;i<list.length;i++){
    if(used[i]) continue;
    used[i]=1;
    const pts=[[list[i][0],list[i][1]],[list[i][2],list[i][3]]];
    for(let end=0;end<2;end++){
      for(;;){
        const p=end===0?pts[0]:pts[pts.length-1];
        const cand=(adj.get(key(p[0],p[1]))||[]).filter(j=>!used[j]);
        if(!cand.length) break;
        const s=list[cand[0]]; used[cand[0]]=1;
        const q=(s[0]===p[0]&&s[1]===p[1])?[s[2],s[3]]:[s[0],s[1]];
        if(end===0) pts.unshift(q); else pts.push(q);
      }
    }
    /* ③ 共線合併（長直段收成兩點）＋ Chaikin 一次（磨掉格線的階梯） */
    const mg=[pts[0]];
    for(let k=1;k<pts.length-1;k++){
      const a=mg[mg.length-1], b=pts[k], c=pts[k+1];
      if((b[0]-a[0])*(c[1]-b[1])!==(b[1]-a[1])*(c[0]-b[0])) mg.push(b);
    }
    mg.push(pts[pts.length-1]);
    let sm=mg;
    if(mg.length>3){
      sm=[mg[0]];
      for(let k=0;k<mg.length-1;k++){
        const a=mg[k], b=mg[k+1];
        sm.push([a[0]*0.75+b[0]*0.25, a[1]*0.75+b[1]*0.25],
                [a[0]*0.25+b[0]*0.75, a[1]*0.25+b[1]*0.75]);
      }
      sm.push(mg[mg.length-1]);
    }
    BORDER_PATHS.push(sm.map(p=>[p[0]*S, p[1]*S]));   // S＝半解析 → 地圖像素
  }
}
let regionCur=-1, regionShownAt=0;
const REGION_IN=420, REGION_HOLD=2600, REGION_OUT=900;   // 淡入／停留／淡出（ms）

function loadRegions(){
  /* ⚠ `?v=N`：同名覆蓋要快取戳記（§5 鐵則）。v3＝ver -735 依 Ray 更正：
     羅賽爾退回本土、島群全劃阿斯佩里亞聯合王國（id 13）、埃蘭只剩西方中島
     （json 與 png 一起改、一起升版）。 */
  return fetch('region_map.json?v=3').then(r=>r.ok?r.json():null).then(J=>{
    if(!J) return;
    REGION_NAME=J.regions.map(r=>r.zh);
    return new Promise(res=>{
      const im=new Image();
      im.onload=()=>{
        const c=document.createElement('canvas');
        c.width=J.w; c.height=J.h;
        const g=c.getContext('2d',{willReadFrequently:true});
        g.drawImage(im,0,0);
        const d=g.getImageData(0,0,J.w,J.h).data;
        REGION=new Uint8Array(J.w*J.h);
        for(let i=0,j=0;i<REGION.length;i++,j+=4) REGION[i]=d[j];
        REGION_W=J.w; REGION_H=J.h;
        /* 國界折線（ver -736）：縮放比從 json 拿（mapW/w）——
           loadRegions 可能比 loadWorld 先完成，那時 MAPW 還是 0。 */
        try{ buildBorderPaths(J.mapW/J.w); }catch(_){ BORDER_PATHS=[]; }
        res();
      };
      im.onerror=()=>res();
      setTimeout(res,4000);
      im.src='region_map.png?v=3';
    });
  }).catch(()=>{});
}

function regionAt(mx,my){
  if(!REGION) return 0;
  const x=(mx*REGION_W/MAPW)|0, y=(my*REGION_H/MAPH)|0;
  if(x<0||y<0||x>=REGION_W||y>=REGION_H) return 0;
  return REGION[y*REGION_W+x];
}

/* ══════════════════════════════════════════════════════════════════════
   禁航區（ver -1136，Ray：「在大地圖上把伊斯維亞、羅賽爾、埃蘭、阿斯佩里亞
   劃為禁航區，國境線有空氣牆，撞到會自動轉 180 度」）
   ──────────────────────────────────────────────────────────────────────
   · **名單是國界表的 id**（`region_map.json`）—— 不寫座標、不畫第二份多邊形：
     國界本來就有逐像素的查表（`regionAt`），禁航只是「這幾個 id 不准進」（鐵律 7）。
   · 撞牆＝**退回撞牆前那一格 ＋ 航向轉 180°**。只轉向不退位的話，船會卡在
     線上反覆觸發；只退位不轉向則是「推不動的牆」，玩家不知道發生什麼事。
   · ⚠ 這與地圖邊緣的空氣牆（`edgeDamp`／`wallSteer`）是**兩件事**：那一條是
     「世界到此為止」（軟阻尼，不說話），這一條是**政治邊界**（硬掉頭＋蕾娜出聲）。
   ⚠⚠ 日後某一國開放（Ray -736 的原話：「隨 stage 禁航區會變」），把 id 從這裡
     拿掉即可；要依章節開放就在這一支加條件 —— 判定只有 `noflyAt()` 一處。 */
const NOFLY_IDS = [3, 9, 12, 13];   // 伊斯維亞／羅賽爾／埃蘭／阿斯佩里亞（region_map.json）
function noflyAt(mx,my){ return NOFLY_IDS.indexOf(regionAt(mx,my))>=0; }
/* 蕾娜的三句（Ray 的稿，一字未改）＋播完之後的那一句。
   ⚠ 「播完了沒」記成**旗**（`nofly_told`）：誰插的＝第三句播出去那一刻；
     沒有人拔（鐵律 9）。不記旗的話每次出航都會再聽一輪。 */
const NOFLY_LINES = [
  { who:'renna/chase',    text:'慢著！那邊不是教區！直接飛進去會被打下來的！' },
  { who:'renna/talkwork', text:'非教區的國家可不認聖王廳紋章，要入國得乖乖辦手續。' },
  { who:'renna/bow',      text:'如果你非要硬闖，可以先把我們放下船嗎？。' },
];
const NOFLY_SILENT = { who:'renna/upsetstare', text:'......就跟你說是禁航區了。' };
const NOFLY_FLAG = 'nofly_told';
const NOFLY_COOL = 1200;            // 同一次撞牆不重複說話（ms）
let noflyIdx = 0;                   // 這一趟講到第幾句（旗立了就一律最後那一句）
let noflySafe = null;               // 最後一個**合法**位置（撞到就退回這裡）
let noflySaidAt = 0;
/* ══⚠⚠ **掉頭是「自動轉舵」不是「跳 180°」**（ver -1137，Ray：「調轉 180 度要自動
   轉舵，不是直接跳 180」）══
   作法與地圖邊緣那道牆**同一套**（`wallSteer`，鐵律 8）：把舵量**注入 r**，
   讓既有的轉向那一行（`cam.angle -= step`）自己轉過去 —— 於是舵輪會跟著轉、
   船身會側傾、角速度也照既有的曲線走。直接改 `cam.angle` 的話那三件事全部沒有，
   畫面上就是「瞬間換了個方向」。
   ⚠ 目標航向在**撞到的那一刻**記下來（`noflyWant`），之後一路轉到它為止 ——
     不是每幀重算「現在的反向」（那會轉不完：每轉一點目標就跟著跑）。
   ⚠ 180° 是最短路的退化情形（da 正好 ±π），固定往右轉，不要讓它每幀左右猶豫。 */
/* ⚠⚠ **掉頭要快、而且船要照樣往前滑一點**（ver -1138，Ray：「讓它快速轉 180 度
   的同時稍微前進一點，不然一直觸發國境線對話」）══
   -1137 是「位置每幀退回上一個合法點」＝ 船**釘在牆上不動**，而轉舵要一兩秒 ——
   那一兩秒裡它每一幀都還在禁區的判定裡，對白於是一直被觸發（而且船看起來像卡住）。
   現在改成：撞到就**往回推一小段**（脫離線上）＋ **鎖住判定直到轉完**，
   轉的那半秒船照它自己的速度往前滑 —— 讀起來是「急轉彎」不是「撞牆定格」。
   ⚠ 角速度倍率走 `eff`（那一行本來就是 `TURN_RATE*dt*eff`）：不另外寫一條轉向公式。 */
const NOFLY_TURN_MUL = 3.2;   // 自動掉頭的角速度倍率（180° 約半秒轉完）
const NOFLY_NUDGE    = 6;     // 撞到時往回推幾個**地圖像素**（只要脫離線上就好）
let noflyTurn = 0, noflyWant = 0;
/* 「這一次撞牆已經處理過了」——飛出禁區才重新上膛（見 noflyCheck 的②）。 */
let noflyArmed = true;
function noflyBounce(){
  if(noflyTurn) return;                       // 已經在轉了
  noflyWant = cam.angle + Math.PI;
  noflyTurn = 1;
}
/* 回傳這一幀要打多少舵（0＝沒在自動轉）。⚠ 與 `wallSteer` 同一個符號約定：
   角度遞減＝向右偏，所以舵量取 -sign(da)。 */
function noflySteer(ang){
  if(!noflyTurn) return 0;
  let da = noflyWant - ang;
  while(da>Math.PI) da-=Math.PI*2;
  while(da<-Math.PI) da+=Math.PI*2;
  if(Math.abs(da)<0.12){ noflyTurn=0; return 0; }   // 轉到了 → 鬆手
  return (da>0 ? -1 : 1);
}

/* 每一幀跑一次：撞到就掉頭。⚠ 掛在 `update()` 真的移動那一行之後（唯一的呼叫點）。 */
function noflyCheck(now){
  if(!REGION || s9On) return;                       // 劇情飛行段不擋（那一段是照劇本走的）
  const mx=cam.x/MAP_SCALE, my=cam.y/MAP_SCALE;
  /* 飛出去了 → 重新上膛（下一次撞牆才會再演一次）。 */
  if(!noflyAt(mx,my)){ noflySafe={x:cam.x, y:cam.y}; noflyArmed=true; return; }
  /* ══ 在禁區裡 ══ 兩件事分開做（ver -1138）：
     ① **不准再深入** —— 位置退回上一個合法點。⚠ 這不是「定格」：掉頭是逐幀轉的，
        船頭一轉出去，下一幀的位移就合法了 —— 讀起來是「貼著牆急轉」而不是卡住。
     ② **一次撞牆只演一次** —— `noflyArmed` 要等真的飛出去才重新上膛
        （Ray：「不然一直觸發國境線對話」）。掉頭那一段船會在線上蹭幾幀，
        沒有這道門就會一幀一句。 */
  if(noflySafe){ cam.x=noflySafe.x; cam.y=noflySafe.y; }
  if(!noflyArmed) return;
  noflyArmed=false;
  /* 撞牆：**往回推一小段**（脫離線上，不是整個退回去）＋ 開始自動轉舵。 */
  const bx=-Math.sin(cam.angle), by=-Math.cos(cam.angle);
  cam.x -= bx*NOFLY_NUDGE*MAP_SCALE;
  cam.y -= by*NOFLY_NUDGE*MAP_SCALE;
  noflySafe={x:cam.x, y:cam.y};
  noflyBounce();
  if(now - noflySaidAt < NOFLY_COOL) return;
  noflySaidAt = now;
  if(sayQueue || senseOn || mapOpen || battleGoing) return;   // 畫面上已經有人在講話就不插隊
  if(flagOn(NOFLY_FLAG) || noflyIdx >= NOFLY_LINES.length){ say([NOFLY_SILENT], now); return; }
  const b = NOFLY_LINES[noflyIdx++];
  say([b], now);
  if(noflyIdx >= NOFLY_LINES.length) addFlag(NOFLY_FLAG);     // 三句都講完了（鐵律 9）
}

/* 每幀檢查所在國；換了就重新計時。
   ⚠ 0（無主之地／雲海）不觸發橫幅 —— 飛出海岸線再飛回來會一直閃。
     但仍要更新 regionCur，否則出海再回同一國不會提示。 */
/* ══ 飄雪（ver -1220，Ray：「進入諾爾維亞王國後畫面有 20% 機率開始飄雪特效」）══
   ⚠ 觸發是**進入那一刻**擲一次，不是每一幀擲 —— 每幀擲的話不管機率多低，
     待久了一定會下，「20%」就沒有意義（同一族：狀態要答得出誰插誰拔，鐵律 9）。
   ⚠ **離開就停**（淡出），下次再進來重新擲：所以同一趟航行裡走出去再走回來
     是**另一次**機會，這是刻意的 —— 不然玩家永遠沒辦法「再試一次」。
   ⚠ 不寫進存檔：天氣是這一趟飛行的事，重載一次天氣本來就該重擲。 */
const SNOW_REGION=4;          // 諾爾維亞王國（REGION_NAME[4]）
const SNOW_CHANCE=0.20;
const SNOW_FADE_MS=2600;      // 進／出都用它淡
let snowOn=false, snowAt=0, snowOffAt=0;
function updateRegion(now){
  if(!REGION) return;
  const r=regionAt(cam.x/MAP_SCALE, cam.y/MAP_SCALE);
  if(r!==regionCur){
    const was=regionCur;
    regionCur=r;
    if(r!==0 && was!==-1) regionShownAt=now;      // 開場那次不提示
    /* ⚠ `was!==-1`：開場那一次不算「進入」（玩家沒有跨過任何界）。 */
    if(r===SNOW_REGION && was!==SNOW_REGION && was!==-1){
      if(Math.random()<SNOW_CHANCE){ snowOn=true; snowAt=now; snowOffAt=0; }
    }else if(r!==SNOW_REGION && snowOn){
      snowOn=false; snowOffAt=now;
    }
  }
}
/* 雪花：**位置存在螢幕空間**、逐幀往下飄並左右擺。
   ⚠ 不存世界座標：這是「擋風玻璃上的雪」，不是地面上的物件 —— 存世界座標的話
     轉個彎雪就整片掃出畫面，讀起來是雪在跑不是船在轉。
   ⚠ 種子用 `hash()` 不用 `Math.random()`（§6.8.1）：逐幀重建的東西不准用真亂數，
     這裡每一片的相位是**它自己的 id 算出來的**，所以不會閃。 */
const SNOW_N=150;
function snowAlpha(now){
  if(snowOn) return Math.min(1,(now-snowAt)/SNOW_FADE_MS);
  if(!snowOffAt) return 0;
  const a=1-(now-snowOffAt)/SNOW_FADE_MS;
  if(a<=0){ snowOffAt=0; return 0; }
  return a;
}
function drawSnowFall(now){
  const A=snowAlpha(now); if(A<=0.002) return;
  /* ⚠ 與地形同一個像素格（§6.7「畫在地形上的東西要跟著像素化」）：
     雪花畫成**緩衝像素**大小的方塊、落在整數格上，不然一片抗鋸齒的圓點貼在
     馬賽克地形上讀起來就是貼紙。 */
  const sx=W/BW, sy=VIEWH/BH;
  ctx.save();
  ctx.beginPath(); ctx.rect(0,0,W,VIEWH); ctx.clip();
  for(let i=0;i<SNOW_N;i++){
    const seed=hash(i*13+7, i*29+3);            // 這一片的相位（固定，不逐幀重擲）
    const dep=0.35+0.65*hash(i*17+5, i*7+11);   // 遠近：決定速度、大小與亮度
    const spd=(26+dep*70)/1000;                 // 緩衝像素／毫秒
    const yy=((now*spd + seed*BH*3) % (BH+8)) - 4;
    const sway=Math.sin(now*0.0013*(0.6+dep) + seed*6.283)*(1.5+dep*3.5);
    const xx=((seed*BW*7 + hash(i*3+1,i*11+2)*BW) % BW + sway + BW) % BW;
    const px=Math.round(xx)*sx, py=Math.round(yy)*sy;
    if(py<-sy || py>VIEWH) continue;
    const w=Math.max(1,Math.round(dep*1.6))*sx;
    ctx.globalAlpha=A*(0.30+dep*0.55);
    ctx.fillStyle='#eef4ff';
    ctx.fillRect(px, py, w, w);
  }
  ctx.restore();
}

function drawRegionBanner(now){
  if(!regionShownAt || !REGION_NAME[regionCur]) return;
  const t=now-regionShownAt, total=REGION_IN+REGION_HOLD+REGION_OUT;
  if(t>total){ regionShownAt=0; return; }
  const a=t<REGION_IN ? t/REGION_IN
        : t<REGION_IN+REGION_HOLD ? 1
        : 1-(t-REGION_IN-REGION_HOLD)/REGION_OUT;
  const name=REGION_NAME[regionCur];
  ctx.save();
  ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  /* ⚠ 高度**跟著方向計走**，不要用 VIEWH 的比例硬寫：羅盤帶的位置是由
     HELM_OUT 反推的，比例值遲早會壓到它身上（0.93 就正好疊在上面）。
     襯底往上 19、往下 9，所以基線退到帶子上緣再留 6px 才不相觸。 */
  const x=Math.round(W*0.045), y=compassRect().y-15;
  /* 淡入時從左邊滑進來一小段：純 alpha 淡入在低解析度畫面上讀起來像閃爍，
     加一點位移才有「進入某地」的方向感。 */
  const slide=(1-Math.min(1,t/REGION_IN))*14;
  ctx.globalAlpha=a;
  ctx.font='15px "Noto Serif TC",serif';
  const wTxt=ctx.measureText(name).width;
  /* 襯底用漸層而不是實色方塊：方塊在這個尺寸下像個 UI 元件，
     漸層才像字浮在畫面上。 */
  const g=ctx.createLinearGradient(x-14-slide,0,x+wTxt+40-slide,0);
  g.addColorStop(0,'rgba(6,7,12,0)');
  g.addColorStop(0.18,'rgba(6,7,12,.55)');
  g.addColorStop(0.72,'rgba(6,7,12,.45)');
  g.addColorStop(1,'rgba(6,7,12,0)');
  ctx.fillStyle=g;
  ctx.fillRect(x-14-slide,y-19,wTxt+54,28);
  ctx.fillStyle='#c9a227';
  ctx.fillRect(x-slide,y-13,2,14);
  ctx.fillStyle='rgba(224,214,190,.95)';
  ctx.fillText(name,x-slide+9,y);
  ctx.restore();
  ctx.globalAlpha=1;
}

function drawEngagePrompt(){
  ctx.save();
  ctx.textAlign='center';
  ctx.font='13px "Noto Serif TC",serif';
  const yy=Math.round(VIEWH*0.30);
  const t='遭遇　'+ENEMY_KINDS[enemy.kind].name;
  /* ⚠ 只剩免戰版（ver -389）：正常遭遇根本不畫這一格（見呼叫端）。 */
  const t2 = '—　免 戰 中　—';
  ctx.fillStyle='rgba(6,7,12,.62)';
  ctx.fillRect(W/2-92,yy-22,184,46);
  ctx.fillStyle='rgba(216,205,180,.92)'; ctx.fillText(t,W/2,yy-4);
  ctx.fillStyle='#c9a227'; ctx.font='12px "Noto Serif TC",serif';
  ctx.fillText(t2,W/2,yy+16);
  ctx.restore();
  ctx.textAlign='left';
}

function drawEnemy3D(scaleH,horizon,sinp,cosp,now){
  if(!enemy) return;
  const C=ENEMY_CFG;
  const K=ENEMY_KINDS[enemy.kind];   // 兩條繪製路徑都要，提到最前面宣告
  const sxk=W/BW, syk=VIEWH/BH;
  const project=(wx,wy,alt)=>{
    const dx=wx-cam.x, dy=wy-cam.y;
    let z=dx*(-sinp)+dy*(-cosp); if(z<20) z=20;
    const sv=(dx*cosp+dy*(-sinp))/z;
    return [((sv+1)/2*BW)*sxk,
            (((cam.alt-alt)/z + z*curvAt(sv))*scaleH+horizon)*syk,
            z, W/(2*z)];
  };
  // 頭的深度先算一次：整隻在身後或太遠就不畫
  const hp=project(enemy.x,enemy.y,enemy.alt);   // bob 只影響繪製，剔除用本體高度
  const zc=hp[2];
  if(zc>ZFAR*0.95) return;
  /* ⚠ 在身後也不畫，而且要用**未夾制**的深度判。project 對 z<20 做了夾制，
     夾過之後 P[3]=W/40，一隻體長 210 的怪會算出近 2000px 的外框，
     enemyFB 跟著配到 1000×1000 —— 一張只會被貼到畫面外的貼圖，純浪費。
     ⚠ 這條 return 只是「不畫」。**進入戰鬥的提示不在這裡** —— 它已經搬到
       畫格主流程，敵人在身後、被山擋住、還沒解碼立繪，都照樣要提示。 */
  if((enemy.x-cam.x)*(-sinp)+(enemy.y-cam.y)*(-cosp) < 40) return;

  const S=sky();
  /* 振翅浮動：疊在繪製端而不是寫回 enemy.alt —— 寫回去會跟上面的指數逼近
     互相拉扯，變成一邊追目標一邊被浮動推開，收斂不了。 */
  const bob=Math.sin(now*0.0031+enemy.phase)*5.5;
  /* 受光：跟船與地形同一盞燈。夜裡壓暗並偏冷（銀月是冷光），
     日夕之交偏暖 —— 常數與 drawShip 的色調同源。 */
  const nightK=clamp(1-S.day*1.2,0,1);
  const lit=clamp(0.26+S.day*0.74,0.26,1);
  const warmR=lerp(1,1.12,S.dusk), warmG=lerp(1,1.00,S.dusk), warmB=lerp(1,0.84,S.dusk);
  const coolR=lerp(1,0.72,nightK), coolG=lerp(1,0.80,nightK), coolB=lerp(1,1.06,nightK);
  const shade=(r,g,b,a)=>'rgba('+Math.round(clamp(r*lit*warmR*coolR,0,255))+','
                               +Math.round(clamp(g*lit*warmG*coolG,0,255))+','
                               +Math.round(clamp(b*lit*warmB*coolB,0,255))+','+a+')';

  /* ── 剛體怪（plan:'rigid'）─────────────────────────────────────
     不變形、不分節，整隻依「朝向 vs 鏡頭」挑一張方位圖貼上去。
     判準是船的朝向與「船→鏡頭」向量的夾角：
       |θ|<40°  → 正面（朝你來）
       |θ|>140° → 背面（背對你）
       其餘      → 側視，左右由外積正負決定
     ⚠ 不做螢幕旋轉：飛船是保持水平的，轉向時換的是**視角**不是傾角。
       鏈狀怪那套 ang−π/2 的旋轉搬過來會把船轉成直立。 */
  if(K.plan==='rigid'){
    const set=enemyArt[enemy.kind];
    const P=project(enemy.x,enemy.y,enemy.alt+bob);
    if(!set || P[2]>ZFAR*0.95) return;
    const tcx=cam.x-enemy.x, tcy=cam.y-enemy.y;
    const tl=Math.hypot(tcx,tcy)||1;
    const dot=(enemy.hx*tcx+enemy.hy*tcy)/tl;
    const crs=(enemy.hx*tcy-enemy.hy*tcx)/tl;
    /* 視角換圖要**交叉淡入**，不能過門檻就硬換。
       船的朝向本身已經有角速度上限（turnRate），會突然變的是「用哪張圖」——
       在門檻兩側各留 BAND 的過渡帶，兩張疊著畫、權重線性交換。
       ⚠ 過渡帶不能太寬：兩張圖差異大，疊太久會出現雙重影。±10°，
         再加 smoothstep 讓權重快速通過 50/50 —— 線性的話中段停留最久，
         而中段正是疊影最明顯的地方。

       ── 方位表 ─────────────────────────────────────────────
       每張圖登記它的**原生方位角** th，門檻取相鄰兩張的中點。
       原本只有四張、門檻在 40°/140°，一跳 90° 的形變全靠 squash 硬撐；
       補上兩張斜視圖後成了一圈八個，最遠只差 ~27°。
       flip：斜視圖各自只在一邊是原圖，另一邊得水平鏡射（見 sprite 的註）。
       ⚠ 鏡射要包在 rotate 裡面：side傾是螢幕空間的，鏡的是圖不是傾角。 */
    const th=Math.abs(Math.atan2(crs,dot));
    const R=(crs>0);
    const HALFPI=Math.PI/2;
    const VIEWS=[
      {img:set.front,           th:0,          flip:false, fixed:true},
      {img:set.frontQ,          th:K.qFront,   flip:!R},
      {img:R?set.sideR:set.sideL, th:HALFPI,   flip:false},
      {img:set.rearQ,           th:K.qRear,    flip:R},
      {img:set.rear,            th:Math.PI,    flip:false, fixed:true},
    ].filter(v=>v.img);
    const BAND=0.17;                                  // ±10°
    let ai=0;
    while(ai<VIEWS.length-1 && th>(VIEWS[ai].th+VIEWS[ai+1].th)/2) ai++;
    let vA=VIEWS[ai], vB=null, mix=0;
    const bLo=ai>0 ? (VIEWS[ai-1].th+vA.th)/2 : -1e9;
    const bHi=ai<VIEWS.length-1 ? (vA.th+VIEWS[ai+1].th)/2 : 1e9;
    if(th<bLo+BAND){      vB=VIEWS[ai-1]; mix=sstep(0,1,(bLo+BAND-th)/(2*BAND)); }
    else if(th>bHi-BAND){ vB=VIEWS[ai+1]; mix=sstep(0,1,(th-(bHi-BAND))/(2*BAND)); }
    const img=vA.img;
    if(!img) return;
    const wpp=K.bodyLen/((set.sideR||img).width);     // 世界單位／來源像素（側視寬＝船長）
    /* 依夾角**橫向收縮**：船轉向鏡頭時，船身的視長 ∝ sinθ。
       每張圖只需補「離它自己的原生角度」那一段：squash = sinθ / sin(原生θ)，
       所以在門檻上兩張算出來的寬度**完全相等** —— 接縫不會有寬度跳動。
       ⚠ 正面／背面圖不套（fixed）：θ=0 時船身視長為零，那張圖的寬度代表的是
         **帆桁的展幅**不是船長，跟著 sinθ 縮會直接壓成一條線。
       ⚠ 桅杆與帆是直立的、理論上不該跟著橫縮。只有四張圖時側視得縮到 0.30，
         那個誤差是看得出來的；補上斜視圖後側視最多只縮到 0.90，已無妨。 */
    /* 收縮有下限:輪廓寬其實是 max(船長·sinθ, 帆桁展幅·cosθ) —— 接近正／背面時
       撐住寬度的是帆桁不是船長,一路照 sinθ 縮會縮到比正面圖還窄。
       實測 150°~154° 就有一個 10% 的凹陷(斜後圖 74px 對背視圖 82px)。
       下限取「端點視圖的寬度」:那張圖畫的正是帆桁展幅,拿它當底最省事。
       (舊碼的 max(0.30,…) 是同一件事的土法版,0.30 是湊的,這裡有依據。) */
    const endW=(set.front&&set.rear)?Math.min(set.front.width,set.rear.width):0;
    const sq=(v)=>{
      if(v.fixed) return 1;
      const q=Math.abs(Math.sin(th))/Math.sin(v.th);
      return endW?Math.max(q,endW/v.img.width):q;
    };
    const squash=sq(vA);
    const w=img.width*wpp*P[3]*squash, h=img.height*wpp*P[3];
    if(w<2) return;
    const imgB=vB?vB.img:null;
    const wB=imgB?imgB.width*wpp*P[3]*sq(vB):0, hB=imgB?imgB.height*wpp*P[3]:0;
    const pad=Math.ceil(Math.max(w,h,wB,hB)*0.6)+6;   // 兩張都要框得下
    const x0=Math.round(P[0]-w/2)-pad, y0=Math.round(P[1]-h/2)-pad;
    const fw=Math.ceil(w)+pad*2, fh=Math.ceil(h)+pad*2;
    const pk=clamp(BW/W*C.pixelScale,0.15,1);
    const bwp=Math.max(2,Math.round(fw*pk)), bhp=Math.max(2,Math.round(fh*pk));
    if(!enemyFB || enemyFB.width!==bwp || enemyFB.height!==bhp){
      enemyFB=document.createElement('canvas'); enemyFB.width=bwp; enemyFB.height=bhp;
      EC=enemyFB.getContext('2d');
    }
    EC.setTransform(1,0,0,1,0,0); EC.clearRect(0,0,bwp,bhp);
    EC.setTransform(bwp/fw,0,0,bhp/fh,-x0*bwp/fw,-y0*bhp/fh);
    /* 側傾：繞船自己的中心轉一個小角度。飛船保持水平飛行，但轉彎會外傾。 */
    const roll=(enemy.roll||0)*0.28;      // 最大約 16°
    EC.save(); EC.translate(P[0],P[1]); EC.rotate(roll);
    const blit=(im,ww,hh,flip,al)=>{
      EC.globalAlpha=al;
      if(flip){ EC.save(); EC.scale(-1,1); EC.drawImage(im,-ww/2,-hh/2,ww,hh); EC.restore(); }
      else EC.drawImage(im,-ww/2,-hh/2,ww,hh);
    };
    /* ⚠ 權重取**平方根**不是直接用 mix:兩張各畫 0.5 疊起來,覆蓋率是
       0.5+0.5-0.25＝0.75 —— 過渡帶正中央的船會有四分之一透明度,天空
       透出來,整艘船發白。等功率(sqrt)權重把最低覆蓋率拉到 0.91,
       兩端仍精確收斂到 1／0,不會在門檻上跳。 */
    blit(img,w,h,vA.flip,imgB?Math.sqrt(1-mix):1);
    if(imgB) blit(imgB,wB,hB,vB.flip,Math.sqrt(mix));
    EC.globalAlpha=1; EC.restore();
    ctx.save(); ctx.imageSmoothingEnabled=false;
    clipByTerrainDepth(P[2],W/BW,VIEWH/BH);   // 山也該擋住船
    ctx.drawImage(enemyFB,0,0,bwp,bhp,x0,y0,fw,fh);
    ctx.restore();
    return;
  }

  /* 體節沿**軌跡**排，不是沿 −heading 拉一條直線。
     直線的話整條蟲是剛體，轉向時會像一根棒子在原地轉。沿軌跡排之後，
     每一節都走頭曾經走過的位置 —— 轉彎自然成為一條弧，身體依序跟上。 */
  const segL=K.bodyLen/K.segs;
  const wob=now*K.waveHz+enemy.phase;
  /* 追擊/遭遇時扭得猙獰：振幅放大，並疊上兩個**不整除**的倍頻，
     相位再隨節次錯開 —— 單一正弦是規律的波浪，怎麼加大都只是「游得快」；
     要讓它讀成「竄」就得破壞週期性，讓相鄰體節的擺向對不上。 */
  const rage=(enemy.state==='chase'||enemy.state==='engage')?1:0;
  const spine=[{x:enemy.x,y:enemy.y}].concat(enemy.trail||[]);
  const posAt=(d)=>{
    let acc=0;
    for(let j=1;j<spine.length;j++){
      const a=spine[j-1], b=spine[j];
      const sd=Math.hypot(b.x-a.x,b.y-a.y);
      if(acc+sd>=d){ const f=sd?(d-acc)/sd:0;
        return {x:a.x+(b.x-a.x)*f, y:a.y+(b.y-a.y)*f}; }
      acc+=sd;
    }
    const e=spine[spine.length-1]||spine[0];       // 軌跡不夠長就沿當下朝向外推
    const rem=d-acc;
    return {x:e.x-enemy.hx*rem, y:e.y-enemy.hy*rem};
  };
  /* ══⚠⚠⚠ **朝向要拿「沒有波動的那條路徑」去算**（ver -1468，Ray：「龍的飛行圖…
     現在會上下鏡射，不要發生這種狀況」）══════════════════════════════════════
     `pts` 是**畫**的位置（含擺動），`apts` 是**算角度**用的位置（不含擺動）。

     ⚠⚠ 為什麼只有 `vertical:true` 的怪會出事：
       · `vertical:false`（蜈蚣）的擺動是**左右**的 —— 牠真的在蛇行，
         角度跟著擺動走**是對的**。
       · `vertical:true`（羽蛇／王座徘徊者）的擺動加在**高度**上，投影到螢幕就是
         **上下位移** —— 而那不是「轉向」，是「上下起伏」。拿它算角度等於
         把起伏讀成掉頭：擺幅一旦壓過相鄰兩節的深度位移，**相鄰點在螢幕上就
         前後顛倒**，那一段圖當場被轉 180°（讀起來就是上下鏡射）。
     ⚠⚠ 這不是偶發：照現行數值（waveAmp 6.0／wavePhase 1.70／每節 13.8 世界單位）
       算過一輪 —— 每節深度位移 3px 時**有 34% 的節在任一瞬間是反的**，
       1.5px 時 43%。正對鏡頭飛（深度位移最小）時最嚴重，那正是追擊的畫面。
     ⚠ 尾巴擺幅本來就比較大（`0.35+i/segs`），所以越往尾巴越容易翻 —— 與
       Ray 看到的一致。 */
  const pts=[], apts=[];
  for(let i=0;i<K.segs;i++){
    const base=posAt(segL*i), aft=posAt(segL*i+8);
    let ux=base.x-aft.x, uy=base.y-aft.y;
    const ul=Math.hypot(ux,uy)||1; ux/=ul; uy/=ul;   // 該節的局部前進方向
    const w1=Math.sin(wob-i*K.wavePhase);
    const w2=rage*0.60*Math.sin(wob*2.37-i*1.90+Math.sin(i*2.1)*2.0);
    const w3=rage*0.38*Math.sin(wob*3.91+i*0.70);
    const off=(w1+w2+w3)*K.waveAmp*(1+rage*0.85)*(0.35+i/K.segs);   // 尾巴擺幅大
    if(K.vertical){
      pts.push(project(base.x, base.y, enemy.alt+bob+off));
      apts.push(project(base.x, base.y, enemy.alt+bob));            // 角度：不吃高度擺動
    }else{
      const P=project(base.x-uy*off, base.y+ux*off, enemy.alt+bob);
      pts.push(P); apts.push(P);                                    // 左右擺動＝真的在蛇行，照吃
    }
  }


  /* ── 像素化：先縮小再放大 ─────────────────────────────────────

     先在 pk 倍的低解析緩衝上畫完，再關掉平滑用 nearest 放大貼回。

     ⚠ 這個值原本寫死 52（程序翅的翅展 46 加餘裕）。換成素材之後，
       一張俯視圖的全寬是蜈蚣 172／羽蛇 290 世界單位，半寬就已經超出 52 ——

  /* ══⚠⚠⚠ **外框要框得住「真的會畫多大」，不是「圖有多大」**（ver -1470，

     ⚠ 代價只有離屏緩衝大一點，而它本來就是 `pk`（≈0.6）的低解析緩衝。 */
  const _art=enemyArt[enemy.kind], _sp=K.sprite;
  /* ══⚠⚠ **尺只有一把，但有兩種量法**（ver -1475）══

    ? (_sp.spanW ? _sp.spanW/_art.width

    : 0;

  for(let i=1;i<pts.length;i++)

  if(art && SP){

    const swS = useFront ? -1 : 1;                   // 「往後」在圖空間的方向

    if(SP.trail)
    /* ══⚠⚠ **四條凝結尾**（ver -1469，Ray：「加上拖尾的不透明白束，就用船的尾流，
       但不透明就好，給個四條」）══

         · **不透明**：船那一支是 `alpha=(1-a)²·0.5·spd`，這裡一律 1 ——

         翅收起來時四條會跟著往內靠，不然收翅的瞬間尾跡會憑空外擴。
       ⚠ 方向用 `segAng(1)`（＝往後），與身體同一支：拿別的角度算會在轉彎時分家。 */
    {

      const span=(0.45+flap*0.55);
      const half=A.width*wppA*sc*0.5*span;                  // 現在的半展幅（螢幕 px）
      /* ⚠⚠ **錨在翅的後緣**（ver -1474）：原本錨在 `pts[1]`（頭後面一節），
         而素材從頭往後鋪了好幾百個世界單位 ⇒ **整條尾跡都被身體蓋住，看不到**

      /* ⚠ 正面視（`faceCam`）走**螢幕座標**：牠永遠正立，所以「往後」就是
