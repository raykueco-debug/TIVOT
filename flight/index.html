              if(Math.hypot(x-cx3,y-cy3)>9.0) continue;   // 出海段：河口寬 18 地圖像素（360 世界單位）
              const i=y*MAPW+x;
              if(HGT[i]<=CLOUD_H) continue;                  // 已經是雲海：留著，那就是落口
              if(HGT[i]>wlOut){ HGT[i]=wlOut; raw[i]=wlOut/PEAK_SCALE; }
              RIV[i]=1; COL[i]=rgb(84,120,142);
            }
          }
        }
      }
    }
  }

  /* ══⚠⚠⚠ 坡度（`SLX`／`SLY`）—— **一定要排在生物群系打表之前**（ver -1146）══
     給逐幀光照用，也是**崖面判定的輸入**（下面 `step(0.82)` 那一段的 `sl`）。
     ⚠ 必須在「整平邊緣／河面／城鎮地基」之後算，否則崖頂的法線是舊的。
     ⚠⚠⚠ **ver -1146 之前它被擺在打表後面**（檔案裡在 `step(0.92)` 前），於是
       打表讀到的是剛配置好、**全是 0** 的坡度 —— 崖面那條分支從來沒有成立過，
       `rock_grey`／`rock_brown` 兩類地貌**整張圖 0 格**（實測），而那兩張貼圖
       一直照常載入。修好之後灰岩 5.4 萬格、褐岩 14.8 萬格（陸地的 7.8%）。
       ⚠ 線索是 `step()` 的進度**倒退**（…0.78 → 0.82 → 0.70 → 0.92）——
         新增任何一段時順手看一眼那串數字是不是遞增的。 */
  /* ══ 地圖編輯的地形筆畫（ver -1253；**位置 ver -1264 改**）══
     ⚠⚠⚠ **一定要排在這裡：`loadWorld` 最後一次動 `HGT` 之後、算坡度之前。**
       -1253~-1263 擺在「整平河面」之前，於是**編輯器看到的地形**（開機全部跑完
       的結果）與**重放時筆畫讀到的地形**（只跑到一半）是兩回事 ——
       凡是「依現場地形決定要寫什麼」的筆（`自動修正` 取鄰居平均、`擦除` 補水、
       `河` 沿線取水位）就會**畫的時候一個樣、重整之後另一個樣**。
       實測河那一筆最大差 15；`自動修正`／`擦除` 先前測到 0 只是因為那幾塊剛好
       沒被整平河面／整地碰到 —— **那是運氣不是正確**。
       搬到這裡之後「編輯器的 HGT」與「重放時的 HGT」是同一個狀態，
       所有筆一次全部變成決定性的，不必逐支去記快照。
     ⚠ 必須在 `step(0.70)` 之前：坡度是從 `raw` 差分算的，畫出來的山要長出法線；
       道路／鐵路（0.78）與地貌（0.82）也都要看得到它。
     ⚠ 代價：畫的 `水` 不再被「整平河面」整平（那一段已經在它前面跑完）——
       要一條會流的河請用 `河` 那支筆，它自己就有水位與河床。 */
  applyMapEdits('terrain', raw);

  step(0.70);   // 計算坡度…
  for(let y=0;y<MAPH;y++){
    const ym=y>0?y-1:0, yp=y<MAPH-1?y+1:MAPH-1;
    for(let x=0;x<MAPW;x++){
      const i=y*MAPW+x;
      const xm=x>0?x-1:0, xp=x<MAPW-1?x+1:MAPW-1;
      SLX[i]=clamp((raw[y*MAPW+xp]-raw[y*MAPW+xm])*760,-127,127)|0;
      SLY[i]=clamp((raw[yp*MAPW+x]-raw[ym*MAPW+x])*760,-127,127)|0;
    }
  }

  /* ── 地貌貼圖 ────────────────────────────────────────────
     全圖鋪設，沒有覆蓋權重表：哪裡鋪哪一張由取樣時的生物群系選擇器決定
     （高度＋坡度＋低頻噪聲），不需要一張 2.6MB 的逐像素分類圖。 */
  step(0.74);   // 載入地貌貼圖…
  await loadGeoAll();

  /* 道路網。⚠ 排在整平與「地形遷就插畫」之後：路要走**最終**的地形，
     不然會出現路從城的台階上直直插下去。 */
  step(0.78);   // 鋪設道路…
  buildRoads();
  /* 鐵路：排在公路之後、同一張高度場。⚠ 兩者的先後不影響結果（各算各的），
     但 RAILW 在生物群系打表時要蓋過 ROADW（平交道讀成鐵路），所以得先有。 */
  buildRails();
  buildTrains();          // 時刻表：軌道鋪好才排得出來

  /* ── 生物群系打表 ──────────────────────────────────────── */
  step(0.82);   // 判定地貌…
  {
    BIOME=new Uint8Array(MAPW*MAPH);
    for(let y=0;y<MAPH;y++){
      for(let x=0;x<MAPW;x++){
        const i=y*MAPW+x;
        const hh=HGT[i];
        if(hh<=CLOUD_H){ BIOME[i]=0; continue; }              // 雲海：用不到
        const wx=x*MAP_SCALE+40960, wy=y*MAP_SCALE+40960;
        const sxf=wx/VEGSEL_WORLD*VS, syf=wy/VEGSEL_WORLD*VS;
        const sx0=sxf|0, sy0=syf|0, su=sxf-sx0, sv2=syf-sy0;
        const nr0=(sy0&VSM)*VS, nr1=((sy0+1)&VSM)*VS;
        const nc0=sx0&VSM, nc1=(sx0+1)&VSM;
        const nz=VEGSEL[nr0+nc0]*(1-su)*(1-sv2)+VEGSEL[nr0+nc1]*su*(1-sv2)
                +VEGSEL[nr1+nc0]*(1-su)*sv2   +VEGSEL[nr1+nc1]*su*sv2;
        const nz2=VEGSEL[(((sy0+23)&VSM)*VS)+((sx0+37)&VSM)];
        const sl=(SLX[i]<0?-SLX[i]:SLX[i])+(SLY[i]<0?-SLY[i]:SLY[i]);
        const subw=SUBW?SUBW[i]:0;
        let tex;
        if(RAILBR && RAILBR[i]>40){
          tex=G_BRDG;                     // 石橋：Ray 給的鋪石貼圖
        }else if(RIV[i] && sl<BIOME_WATER_SL){
          tex=(nz>0.5)?G_WL:G_WD;
        }else if(sl>BIOME_CLIFF+(nz-0.5)*40){
          tex=(hh>BIOME_ROCKALT)?G_RG:G_RB;
        }else if(hh>BIOME_SNOW+(nz-0.5)*2*BIOME_SNOW_J){
          tex=G_SN;
        }else if(hh>BIOME_TREE+(nz-0.5)*2*BIOME_TREE_J){
          tex=G_GD;
        }else if(nz>BIOME_WASTE){
          tex=G_WB;
        }else if(subw>18 && roofPickW(subw, VEGSEL[((((syf*4)|0)&VSM)*VS)+((((sxf*4)|0)&VSM))])>=0){
          const g=roofPickW(subw, VEGSEL[((((syf*4)|0)&VSM)*VS)+((((sxf*4)|0)&VSM))]);
          tex=(g===0?G_RH:(g===1?G_RM:G_RL));
        }else if(RAILW&&RAILW[i]>40){
          /* 鐵軌＋枕木＋道碴，Ray 畫的專用貼圖（取樣要對齊軌道方向，見著色端）。
             ⚠ 排在公路之前：平交道上兩者重疊，該讀成鐵路（鐵軌是連續的，
               公路在那裡是被切斷的那一方）。 */
          tex=G_RAIL;
        }else if(ROADW&&ROADW[i]>40){
          tex=G_GL;
        }else{
          const altk=clamp((hh-VEG_ALT_LO)/(VEG_ALT_HI-VEG_ALT_LO),0,1);
          const sel=clamp((nz-0.5)*1.9+0.5+altk*0.55-0.18,0,1);
          tex=(sel<0.5)?G_FL:G_FD;
        }
        const mot=clamp(Math.round(nz2*15),0,15);
        BIOME[i]=tex|(mot<<4);
      }
    }
    /* 谷底的地貌貼圖：沿用那一格算好的 `mot`（高 4 bit），只換類別。
       ⚠⚠ ver -1246 由 `G_RB`（rock_brown）改成 **`G_GL`（gravel_light）**：
         平面圖畫的是**灰岩碎石坡＋乾河床的砂徑**，而 `rock_brown` 是
         「棕色的大塊崖岩」、`rock_grey` 是「灰色的大塊崖岩」——
         兩者的尺度都是**崖面**，鋪在谷底會讀成一地的巨石。
         `gravel_light` 是「淺色地面上散著碎石」，尺度與那張圖對得上。
       ⚠ 這一層是**相乘**的細節紋理（存的是相對自身均值的倍率），色相由 `COL`
         決定 —— 所以貼圖換成灰岩、底色換成那張圖的灰，兩件要一起改（-1237 的教訓）。
       ⚠ 掃的是谷地那幾千格，不是 258 萬格 —— 不要塞進上面的主迴圈。 */
    for(const i of valleyRock) BIOME[i]=G_GL|(BIOME[i]&0xf0);
    /* ⚠⚠ 湖一律是水面地貌（ver -1260）：上面那張分類表在判水之前先判**坡度**
       （`sl>BIOME_CLIFF` ⇒ 岩），而湖若畫在坡上，靠岸那一圈的坡度是陡的 ⇒
       會沿著湖緣長出一圈岩石。湖就是水，不必問坡度。
       ⚠ 高 4 bit（那一格的細節抖動）留著；深淺兩種水沿用它決定，才不會整片同調。 */
    if(LAKEM) for(let i=0;i<LAKEM.length;i++) if(LAKEM[i])
      BIOME[i]=((BIOME[i]>>4)>=8?G_WL:G_WD)|(BIOME[i]&0xf0);
    /* 貼材筆（ver -1254）：⚠ 一定要在這裡，不能更早 —— BIOME 是這一段
       現生出來的，早一步塗會被整張蓋掉。與 `valleyRock` 同理，也同樣要
       **連 COL 的底色一起換**（見 MAT_PALETTE 的註解）。 */
    applyMapEdits('mat');
  }

  /* 碼頭位置：城區內「水面貼著陸地」的那一圈就是濱水面。從中挑幾個彼此拉開的
     點，方向取「陸→水」的法線 —— 棧橋自然朝水裡伸，不必手工指定角度。
     ⚠ 挑點要強制間隔，否則會全擠在同一段岸邊。 */
  await loadDock();
  for(const S of SETTLEMENTS){
    if(!S.plan) continue;
    /* ⚠ 只找**城區之內**的濱水面。0.55 會把加寬後的河也算進來，棧橋於是蓋到
       郊外的河岸上；0.40 收在插畫自己的港區範圍內。 */
    const R=Math.ceil(S.planW*0.40/MAP_SCALE);
    const cand=[];
    for(let dy=-R;dy<=R;dy++)for(let dx=-R;dx<=R;dx++){
      const x=S.x+dx, y=S.y+dy;
      if(x<1||y<1||x>=MAPW-1||y>=MAPH-1) continue;
      const i=y*MAPW+x;
      if(!RIV[i]||HGT[i]<=CLOUD_H) continue;          // 要是城內水域
      let nx=0, ny=0, land=0;
      for(const [ex,ey] of [[1,0],[-1,0],[0,1],[0,-1]]){
        const j=(y+ey)*MAPW+(x+ex);
        if(!RIV[j]&&HGT[j]>CLOUD_H){ nx-=ex; ny-=ey; land++; }   // 陸→水的方向
      }
      if(land===0||land>2) continue;                   // 0＝水中央、3+＝水道太窄
      cand.push({dx,dy,ang:Math.atan2(ny,nx)});
    }
    const picked=[];
    for(const c of cand){
      if(picked.some(q=>Math.hypot(q.dx-c.dx,q.dy-c.dy)<11)) continue;
      picked.push(c);
      if(picked.length>=6) break;
    }
    S.piersLocal=picked;
  }

  /* 郊區密度場：自城區外緣往外遞減。⚠ 起點是**插畫的外緣**不是城心 ——
     城區本身由插畫負責，郊區要從它結束的地方接手，不然會蓋在城上。 */
  {
    SUBW=new Uint8Array(MAPW*MAPH);
    for(const S of SETTLEMENTS){
      const R=SETTLE_R[S.t];
      const r0=(S.planW?S.planW*0.5/MAP_SCALE:R*1.15);   // 城區外緣（地圖像素）
      const r1=r0+(S.t.indexOf('city')===0?58:26);       // 郊區能散多遠：城大則遠
      const rr=Math.ceil(r1);
      for(let dy=-rr;dy<=rr;dy++)for(let dx=-rr;dx<=rr;dx++){
        const x=S.x+dx, y=S.y+dy;
        if(x<0||y<0||x>=MAPW||y>=MAPH) continue;
        const i=y*MAPW+x;
        if(HGT[i]<=CLOUD_H||RIV[i]) continue;             // 海上河上不長房子
        const d=Math.hypot(dx,dy);
        if(d>r1||d<r0*0.86) continue;
        const t=1-clamp((d-r0*0.86)/(r1-r0*0.86),0,1);
        const w=Math.round(255*(t*t*(3-2*t)));
        if(w>SUBW[i]) SUBW[i]=w;
      }
    }
  }

  /* ══⚠⚠ 北國的雪（ver -1220，Ray：「以 Ravnsdal 為起點，飛行地圖上要加一些雪點」
     「地上要有雪」）══════════════════════════════════════════════════════
     ⚠⚠ **烘進 `COL`，不要寫進 shader**（鐵律 7/8）：COL 這一份 CPU 路徑直接讀、
       GL 路徑由 `glUploadWorld` 上傳 —— 烘一次兩條路都吃到，而且**不會走鐘**。
       寫進 shader 的話 `?gl=0` 會沒有雪，那是同一個量兩個計算點。
     ⚠ **一定要排在 `step(0.82)` 判地貌之後**：BIOME 是**從 COL 的顏色分類出來的**，
       先漂白會把整片北方判成別的地貌（貼圖與道路色一起錯）。雪是「看起來的顏色」，
       不是「這裡是什麼地」。
     配方三項相乘：
       · **緯度**：`SNOW_Y0`(400) 開始有、`SNOW_Y1`(40) 滿 —— 拉芬斯達爾 (243) 落在 0.44，
         北方泊地 (150) 0.69。Ray 說的「以 Ravnsdal 為起點」＝那裡要看得出開始積雪，
         所以起點放在它**南邊**一段，不是壓在它身上（壓在身上它自己就一片雪都沒有）。
       · **高度**：同一緯度先積在高處（`SNOW_H0`~`SNOW_H1`），山頂比谷地白。
       · **斑塊**：低頻值噪聲（6 格一格、雙線性內插）——「加一些雪點」要的是**斑駁**，
         不是一條緯度線以北整片刷白。⚠ 用 `hash()` 不用 `Math.random()`：
         這一份會被存進 COL、而且重載要長一樣（§6.8.1）。
     ⚠ 水面（`RIV`）與雲海不積雪：河要看得出還是河（結冰是另一件事，Ray 沒說）。
     ⚠ 城的手繪底圖蓋在這之上（取樣路），所以**城本身不受影響** ——
       城裡要不要有雪是那張插畫的事（見 `resources/map/_ravnsdal_spec.md` §七）。 */
  {
    /* ⚠ 這四個數字是**看著畫面調的**（Ray：「地上要有雪」——第一版只有高處白、
       拉芬斯達爾一帶還是綠森林，等於沒下）。現行值在拉芬斯達爾 (y=243) 的谷地
       算出來約 0.35（看得出是雪地、但地貌還讀得出來），北方泊地 (y=150) 的高地
       接近 0.83（幾乎全白）。要調濃淡先動 `SNOW_Y0`（雪線往南／往北移）。 */
    const SNOW_Y0=500, SNOW_Y1=100;       // 緯度：開始／滿
    const SNOW_H0=60,  SNOW_H1=260;       // 高度：開始／滿
    const SNOW_MAX=0.92;                  // 最深也留一點地色，不要純白
    const SR=232, SG=238, SB=246;         // 雪色（偏冷的白）
    const G=6;                            // 斑塊的格距（地圖格）
    const sn=(gx,gy)=>hash(gx*7+11, gy*13+5);
    /* ⚠⚠ 雪量要**發佈出去**（鐵律 7）：地貌貼圖層（森林／草）是**乘**在底色上的，
       底色漂白了、貼圖照乘，雪地就會被乘回褐綠色 —— 實測諾爾維亞的低地就是這樣。
       所以把每一格的雪量存成一張圖，兩條渲染路徑都讀它去**壓掉植被貼圖的強度**。
       ⚠ 這是「算一次、別人只讀」，不是「兩邊各算一次」。 */
    SNOW=new Uint8Array(MAPW*MAPH);
    let painted=0;
    for(let y=0;y<MAPH;y++){
      const latT=clamp((SNOW_Y0-y)/(SNOW_Y0-SNOW_Y1),0,1);
      if(latT<=0) continue;
      const fy=y/G, gy=Math.floor(fy), ty=fy-gy, wy=ty*ty*(3-2*ty);
      for(let x=0;x<MAPW;x++){
        const i=y*MAPW+x;
        const hh=HGT[i];
        if(hh<=CLOUD_H || RIV[i]) continue;
        const fx=x/G, gx=Math.floor(fx), tx=fx-gx, wx=tx*tx*(3-2*tx);
        const p00=sn(gx,gy), p10=sn(gx+1,gy), p01=sn(gx,gy+1), p11=sn(gx+1,gy+1);
        const patch=(p00+(p10-p00)*wx)+((p01+(p11-p01)*wx)-(p00+(p10-p00)*wx))*wy;
        const altT=clamp((hh-SNOW_H0)/(SNOW_H1-SNOW_H0),0,1);
        /* 斑塊只調**濃淡**不做全有全無：0.35~1.0，所以雪線附近是零星的雪點，
           再往北整片才連起來。 */
        const a=clamp(latT*(0.70+0.30*altT)*(0.45+0.55*patch),0,1)*SNOW_MAX;
        if(a<0.02) continue;
        const c=COL[i], r=c&255, g2=(c>>8)&255, b=(c>>16)&255;
        COL[i]=rgb((r+(SR-r)*a)|0, (g2+(SG-g2)*a)|0, (b+(SB-b)*a)|0);
        SNOW[i]=(a*255)|0;
        painted++;
      }
    }
    console.log('[world] 北國的雪：'+(painted/(MAPW*MAPH)*100).toFixed(1)+'% 的地表著雪');
  }

  // 地標：x/y 是「地圖像素」座標 → 換算成世界座標 wx/wy 供投影使用
  PLACES.forEach(P=>{
    const xi=clamp(P.x|0,0,MAPW-1), yi=clamp(P.y|0,0,MAPH-1);
    P.h=HGT[yi*MAPW+xi];
    P.wx=P.x*MAP_SCALE; P.wy=P.y*MAP_SCALE;
  });

  step(0.92);   // 讀取國界…
  await loadRegions();

  /* 城的取樣遮罩（ver -445）：要等 MAPW 有值＋縮圖到位（上面 cityPlansReady
     已 await 過），放在這裡兩者都齊。 */
  try{ buildCityMask(); }catch(e){ console.warn('[city] 遮罩建不出來', e); }
  /* GL 地形（ver -1200，`?gl=1`）：⚠ 一定要在這裡才上傳 —— loadWorld 的邊緣抬升、
     城的整地、河道與水位全部改過 HGT/COL，早一步上傳就會與畫面上的地形對不起來。 */
  /* ⚠ `gl-on` 那個 class 掛在**這裡**（初始化真的成功之後），不是在 GLON 那一行 ——
     理由見 GLON 的註解：開不起來時掛上去會變成「整片沒有地形」。 */
  if(GLON){ try{ if(glInit()){ glUploadWorld(); glBuildRuins();
                               document.body.classList.add('gl-on'); } }
            catch(e){ console.warn('[gl] 初始化失敗，維持 CPU 路徑', e); } }
  /* ⚠ -1314 曾經在這裡把起跑檔位設成最低檔；-1315 改成**整條 GL 不開**
     （見 `glInit` 的說明）之後那一段就沒有意義了 —— 走 CPU 路徑的畫質階梯
     本來就會自己找到位置。同一件事不要有兩套機制（鐵律 8）。 */

  step(0.94);   // 預熱貼圖…
  /* ⚠ primeArt 是**純優化**（預先解碼貼圖），不是開場的必要條件——用 race 夾 4 秒
     當總保底：萬一它還是吊住（warmImage 已逐張夾 1.5s，這裡多一層），開場照樣往下走，
     貼圖進視野時瀏覽器自己會解（ver -793）。 */
  await Promise.race([ primeArt(), new Promise(r=>setTimeout(r,4000)) ]);
}

/* ── 貼圖預熱 ────────────────────────────────────────────────────────
   ⚠ `img.onload` 只保證**位元組到齊**。瀏覽器通常把解碼延後到第一次
     `drawImage`，而第一次繪製還要再付一次 CPU→GPU 上傳。所以「第一次飛近
     某座城」那一幀要同時解碼平面圖＋屋頂 atlas —— 桌機看不太出來，手機上
     就是使用者回報的「一進去就掉 fps」。
   作法：開場進度條還在時，把這些圖解碼並各畫一次，把解碼與上傳的成本
     挪到誠實的載入階段。
   ⚠ `decode()` 在部分舊瀏覽器沒有，要 fallback（同 ctx.filter 那個教訓）。
   ⚠ 畫 8×8 而不是 1×1：某些瀏覽器對 1px 的 drawImage 會走特例路徑，
     不保證真的把整張上傳。 */
async function primeArt(){
  await Promise.all(cityArtReady);
  const imgs=[];
  const take=o=>{ for(const k in o){ const v=o[k]; if(v&&v.width) imgs.push(v); } };
  /* ⚠ cityPlanArt 這時通常是**空的** —— 全解析插畫改成飛近才載（ensureCityArt），
     它自己會在公開前預熱。這裡只處理開場就在手上的：縮圖、已到位的量體 atlas、
     棧橋、舵輪。 */
  take(cityPlanLo); take(cityPlanArt); take(cityMassArt); take(dockArt); take(helmArt);
  /* 甲板兩層（ver -1078）：每幀都貼，解碼要在載入階段付掉。
     ⚠ 這裡**只熱已經開抓的那一段**（`deckCache` 現有的），不要叫 `deckPair()` ——
       那會在時段還沒掛上來時先把「白天」那一對抓下去，等於多載一對。 */
  for(const b in deckCache) take(deckCache[b]);
  if(!imgs.length) return;
  let n=0;
  for(const im of imgs){ await warmImage(im); n++; }
  window.__primed=n;
}

/* ── 畫布 ───────────────────────────────────────────────────────── */
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let W=0,H=0,VIEWH=0,BW=0,BH=0,buf=null,bufU32=null,bcv=null,bctx=null;
let PICK3D=null;   // 3D 取點的反查表；只在管理人按右鍵那一幀非 null（見 pick3dAt）
let curvK=null;      // 每欄的曲率係數 (1+s²)/(2R)
let prevH=null;      // 每欄「上一個畫出的取樣高度」→ 判定崖面
let topFrac=null;    // 每欄頂端的次像素未覆蓋比例 → 收尾時做輪廓抗鋸齒
/* ── 逐欄深度階梯（ZTOP）─────────────────────────────────────────
   聚落／船／怪要判「前面的地形有沒有擋住我」。原本只記每欄的**頂列**與
   那一列的深度（ybufZ），但頂列幾乎永遠是**最遠**的那道山脊 —— 只要地平線
   上有遠山（也就是絕大多數畫面），判定就變成「稜線比我遠 → 整欄都看得到」，
   於是欄位下半段的**近景**山坡明明擋在前面，城還是照畫上去。
   那就是「城鎮浮在前景之前」。

   地形是由近而遠光柵化的（painter），每欄的 ybuf 只會單調往上縮 —— 也就是
   「列號 → 深度」在欄內天生是單調的。所以只要在幾個深度切片上各存一次
   ybuf 的快照，就得到一座階梯：ZTOP[b][i] ＝「比 ZS_BOUND[b] 更近的地形」
   在第 i 欄佔到的最高列。查詢時取 bound ≤ Z 的那一層，該層之下的像素全是
   比我近的地形（該遮），之上則是天空或比我遠的地形（該畫）。

   切片用平方分佈（近密遠疏）：近處一格幾十世界單位、遠處幾百，
   而遠處本來就被霧洗掉，誤差看不出來。
   成本：每幀 ZSLICES×BW 次寫入（typed-array 的 `set`）+ 每個查詢一次乘法，可忽略。

const Q = () => QUALITY[qLevel];
/* ══⚠⚠⚠ 緩衝寬的**下限要跟著視窗走**，不可以寫死（ver -1196）════════════
   Ray 的手機 `innerWidth` 只有 **320**（HUD 那行 `inner 320x645`），而舊的下限是
   寫死的 160 —— 於是整個自適應階梯的**下面三階全部撞到地板、變成同一階**：

     q0 320×0.60=192 → 192
     q1 320×0.54=173 → 173
     q2 320×0.48=154 → **160**  ← 地板
     q3 320×0.40=128 → **160**  ← 地板
     q4 320×0.33=106 → **160**  ← 地板

   也就是說他那台機子**從 q2 開始，再怎麼降畫質緩衝都不會變小** ——
   調節器把 qLevel 一路推到 4，看起來在降級，實際上一個像素都沒省。
   那就是「掉到 q4 還是掉禎」的結構性原因（-755 加 q4 那一階等於白加）。
   ⚠ 430px 的機子也吃到：q4 要 142，照樣被 160 夾回去。
   ⇒ 下限改成**由階梯自己的最後一階推**（鐵律 7：一個量一個計算點）——
     最低那一階要多少就給多少，另外留一個絕對硬底 96 給極窄的視窗。
   ⚠ 這不會讓高畫質變差：上面幾階本來就高於下限，一個字都沒動。 */
const BUF_HARD_MIN = 96, BUF_MAX = 420;
/* ⚠⚠⚠ **下限不可以大過上限**（ver -1303）：`applyResize` 算的是
   `clamp(w*bwf, bufFloor(w), BUF_MAX)`，而視窗寬超過約 1273px 時
   `w*0.33` 就超過 420 ⇒ **五個畫質檔位全部被夾成同一個 420**，
   整個階梯在桌機的大視窗上等於不存在（1920 寬實測 q0 與 q4 都是 420）。
   這與 -1196 修的是同一個病的另一端：那次是下限寫死 160 把下面三階壓平，
   這次是下限跟著視窗長大、反過來把上面幾階壓平。 */
const bufFloor = w => Math.min(BUF_MAX,
                               Math.max(BUF_HARD_MIN,
                                        Math.round(bufW(w) * QUALITY[QUALITY.length-1].bwf)));
/* ⚠⚠ **上限要夾在「視窗寬」上，不是夾在算完的緩衝寬上**（ver -1303）。
   夾在結果上的話，只要 `w*0.33` 就超過 420（視窗寬 ≥1273px），五個檔位會被
   一起夾成 420 ⇒ **階梯在大視窗上整個消失**，降畫質一個像素都省不到
   （這正是 Ray 實測「q0 與 q4 一樣卡」的原因之一）。
   改成先把視窗寬夾到「q0 剛好頂到上限」的那個寬度，再乘各檔的係數 ——
   於是 q0 仍然是 420，而 q4 是 420×0.33/0.60 ≈ 231，階梯回來了。
   ⚠ 小視窗（`w` 本來就沒到）行為**一個字都沒變**。 */
const bufW = w => Math.min(w, BUF_MAX / QUALITY[0].bwf);

/* ── 裝置像素比 ───────────────────────────────────────────────────
   ⚠ 畫布**要開到裝置像素**，不能只開 CSS 像素。地形本來就是低解析度緩衝
     放大上來的，看不出差別；但**立繪、對話框、所有 canvas 文字**是直接畫在
     這張畫布上的，畫布只有 CSS 像素時整張會被瀏覽器再放大一次（雙線性），
     於是立繪糊掉、字帶毛邊 —— 那就是「顆粒化糊化」。
   ⚠ 上限壓在 2：手機 DPR 常是 3，那是 9 倍的填充量，而地形 blit 是全螢幕的。
     2 已經看不出鋸齒，3 只換來掉幀。低配機再由 QUALITY 往下壓。 */
let DPR=1;
/* ⚠⚠ 這裡是**真正在重建畫布**的那一支，不要直接呼叫它 —— 呼叫 resize()（下方）。
   理由見 resize() 的說明：設 cv.width 會把畫布清空，時機錯了就是一幀全空。 */
function applyResize(){
  /* ⚠ 頁面在隱藏（display:none / 0×0）狀態下載入時 innerWidth 是 0 ——
     BH 會算成 NaN，createImageData 直接 throw，而這裡是頂層開機路徑，
     炸了整頁就死透（後面的 cam/輸入/loop 全沒建，resize 也救不回）。
     退回 390×844 先把畫布建起來；真的顯示時 resize 事件會用真尺寸重建。 */
  const nw=innerWidth||390, nh=innerHeight||844;
  const ndpr=Math.min(Q().dpr, devicePixelRatio||1);
  /* 尺寸、DPR、緩衝寬都沒變就什麼都別做。iOS 的網址列一動就發 resize，
     其中不少是同尺寸的重複事件；照做一遍等於白白重建 1.2M 像素的畫布與整批緩衝。
     ⚠ 一定要**連 BW 一起比**：QUALITY 的第 2、3 級 dpr 同樣是 1，只有 bwf
       不同（0.48 vs 0.40）。只比視窗與 DPR 的話，q2→q3 會被誤判成「沒變」而
       整個跳過，緩衝解析度永遠降不下去 —— 調節器就形同壞掉。 */
  const nBW=clamp(Math.round(bufW(nw)*Q().bwf),bufFloor(nw),BUF_MAX);
  if(nw===W && nh===H && ndpr===DPR && nBW===BW && cv.width===Math.round(nw*ndpr)) return;
  W=nw;H=nh;
  DPR=ndpr;
  VIEWH=Math.round(H*VIEW_F);
  { const bb=document.getElementById('boostBtn');
    if(bb) bb.style.top=(VIEWH+12)+'px';
    /* 降落鈕：**3D 視窗的正中央**（ver -443，Ray 指定）。面板上緣是算出來的，
       所以縱向由這裡寫進去（同上面那兩顆）。 */
    const lb=document.getElementById('landBtn');
    if(lb) lb.style.top=Math.round(VIEWH/2)+'px'; }
  layoutFKerb();          // 楣／槍棺的幾何（ver -387）：寬高由畫面比例反推，見那一支
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  cv.style.width=W+'px';cv.style.height=H+'px';
  /* ⚠ 順序：設 width/height 會把 context 的狀態（含變換）整個重置，
     所以 setTransform 一定要在後面。之後所有繪圖照舊用 CSS 像素座標。 */
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.imageSmoothingEnabled=false;
  castMeasure();
  for(const k in portraitLod) delete portraitLod[k];   // DPR/尺寸變了，預縮圖要重做
  /* 緩衝寬度佔畫面寬的比例。維持 0.60。
     ⚠ 抗馬賽克靠的是雙線性取樣，不是解析度 —— 解析度只讓邊緣更銳，
       成本卻隨面積平方成長。這一版已經為了畫質加了不少 per-sample 的工
       （高度／顏色／雲海三處雙線性、每根柱子都畫立面），先把解析度的
       額度讓出來，效能餘裕留給手機。
     要更銳就調這個值，但**一定要在實機上看 HUD 的 fps**：
     開發用的瀏覽器分頁一離開前景 rAF 就停，量到的數字不可信。 */
  BW=clamp(Math.round(bufW(W)*Q().bwf),bufFloor(W),BUF_MAX);
  BH=Math.round(BW*VIEWH/W);          // 緩衝比例對齊「3D 視窗」而非整個畫面
  bcv=document.createElement('canvas');bcv.width=BW;bcv.height=BH;
  bctx=bcv.getContext('2d');
  buf=bctx.createImageData(BW,BH);
  bufU32=new Uint32Array(buf.data.buffer);
  curvK=new Float32Array(BW);
  for(let i=0;i<BW;i++){
    const s=(i+0.5)/BW*2-1;           // 欄位在視錐內的橫向比例 −1..1
    curvK[i]=(1+s*s)/(2*PLANET_R);    // 邊緣 s=±1 時是中央的兩倍 → 地平線兩側下彎
  }
  prevH=new Float32Array(BW);
  topFrac=new Float32Array(BW);
  ZTOP=new Int32Array(ZSLICES*BW);
  CZMIN=new Float32Array(BW);
  SKYROW=new Uint32Array(BH);
}
/* ══ 重建畫布的時機 ══
   ⚠⚠ 設 `cv.width` 會把畫布**清成透明**。所以重建必須緊接著一次完整的
     render()，中間不能讓瀏覽器把畫面送出去 —— 否則那一幀就是全空的閃白。

   舊寫法有兩個地方會踩到，實機上合起來就是「進飛行畫面全屏閃爍」：
     ① `addEventListener('resize', resize)` 完全沒有防抖。iOS 進頁時工具列
        會收合，innerHeight 一路變，resize 連發十幾次 → 連閃十幾下。
     ② `onQualityChange()` 是在 `qualityTick()` 裡呼叫的，而那是在 `render()`
        **之後** —— 清空的畫布就這樣被送出去，下一幀才補畫。手機剛進飛行時
        負載最重，調節器會連降好幾檔，每一檔閃一下。

   改成：resize() 只**掛一個旗標**，真正的重建在 loop() 開頭、update/render
   之前執行。同一幀內來幾次事件都只重建一次，而且重建完必定馬上重畫。 */
let _needResize=false;
function resize(){ _needResize=true; }
function flushResize(){ if(!_needResize) return; _needResize=false; applyResize(); }
addEventListener('resize',resize);
applyResize();   // 開場這一次要同步做完：loop 還沒開始跑，沒有「下一幀」可以等
// 地標/雲團等疊加物要套同一條曲率，否則會跟地形錯開（越遠越明顯）
const curvAt=s=>(1+s*s)/(2*PLANET_R);

   教學圈出來的範圍要與真的按得動的範圍一致，不然會出現「亮著卻按不動」
   （§6.5.5 明令要避免的那一種）。 */

/* 天空手勢（索敵）的下界（ver -1292 的那條線，-1495 搬過來）。
   ⚠ 不要改成「飛行窗的上半」（`VIEWH/2`＝0.33H）：那條線在船**之上**，
     天空那一塊會被壓到只剩窗頂那一條。 */

            && Math.hypot(x-shipHit.x, y-shipHit.y) <= shipHit.r*SHIP_HIT_PAD);

/* 天空那一塊（ver -1418）：飛行窗的上半 —— **避開船圈**（那是安雅的感應）

  const bot = shipHit ? Math.max(40, shipHit.y - shipHit.r - 10) : skyBottom()*0.55;
  return { left:W*0.12, top:VIEWH*0.06, width:W*0.76,

  return { left:shipHit.x-shipHit.r, top, width:shipHit.r*2,
           height:Math.max(48, bot-top) };

  /* 長按船身＝感應隱藏點位（節奏見 SENSE_SUMMON_MS/SENSE_HOLD_MS）。
     ⚠ 與操舵不衝突：操舵是靠**位移**算油門與舵量的，按住不動 fwd/rgt 就是 0
       —— 船會自己慢下來，正好是「停下來感應」。一動就取消（見 pointermove）。 */
  /* 長按方向計＝Sturm 充能。⚠ 充能未滿就不起算 —— 讓「按了沒反應」直接
     對應到「還沒充好」，不會讓人以為是判定失靈。 */
  sturmT0=0;
  if(featureOn('sturm') && sturmHit(e.clientX,e.clientY)){
    if(performance.now()>=sturmReady){
      sturmT0=performance.now();
      senseUnlock(sturmSE);        // ⚠ 必須在手勢裡解鎖，見 sturmSE 的說明
    }else sturmNag();              // 還沒充好 → 諾薇兒開口（ver -1173）
  }
  /* ══ 船身的兩個力度（ver -1086，Ray：「對話改成輕點船，搜索是長按」）══
     同一個物件、兩個力度：**點一下＝閒聊、按著不放＝感應**。
     ⚠ 「點到船了沒」只算一次（`onShip`）—— 放手那一支要用同一個答案，
       各算一次的話船在螢幕上是會動的（`shipHit` 每幀由 drawShip 更新），
       按下與放開之間它已經不在原處了（鐵律 7）。 */
  downAt=performance.now();
  /* ══⚠⚠⚠ **感應的範圍：飛行窗裡的船體，而且不含方向計**（ver -1127，Ray：
       「索敵在按加速以及長按控制盤面都會誤觸發，嚴格把觸發範圍限制在飛行窗
         船體及方向計以外的區域」）══
     船的命中圈是 `shipHit`（每幀由 drawShip 更新，圓心 `VIEWH*0.76`、半徑 `R*0.8`）
     —— 它**本來就會溢出兩個不該碰的地方**：
       · 下緣越過 `VIEWH` → 長按**控制盤面**（操舵那一整塊）也算按在船上
         （-1132 起下界改成 `skyBottom()`：方向計與舵輪也是面板，見那一支）
       · 方向計畫在 `VIEWH-61 ~ VIEWH-31`，正好落在圈內 → 長按**加速**同時起算感應
     所以這裡加兩道硬條件（兩道都是「這一點屬不屬於船」的一部分，收在同一個算式）：
       ① `clientY < skyBottom()`：控制盤面不是飛行窗（含伸進窗裡的方向計與舵輪）
       ② `!sturmHit()`：方向計那一帶歸加速（它剛剛才判過，範圍已放大）
     ⚠ 圈本身**稍微放大**（`SHIP_HIT_PAD`，同 Ray 那句「實際點擊範圍稍微增大」）：
       範圍收窄之後要按得到才行 —— 排除區是硬的，圈是鬆的，兩者不衝突。
     ⚠ 仍然只算一次（`onShip`）：放手那一支要用同一個答案（鐵律 7）。 */
  onShip=onShipAt(e.clientX,e.clientY);
  senseT0=0;
  if(featureOn('sense') && onShip){
    senseT0=performance.now();
    // ⚠ 一定要在這裡解鎖：這是唯一還在手勢裡的時機（見 senseUnlock）
    senseUnlock(senseBeat); senseUnlock(senseSE);
  }
  /* ══ 長按**船身以外（天空）**＝生怪（ver -1086；**-1363 起不再是管理人限定**）══
     ⚠ 守門只有 `canSpawnHold()` 一支（S8＋／場上沒怪／不在交棒），理由見那一支。
     ⚠ 在手指還按著的時候就觸發（不是放開才生）—— 長按要當場有回饋，
       不然會讓人以為沒反應而一直按。一動或放開就取消。 */
  clearTimeout(spawnHoldT); spawnHoldT=0;
  /* ⚠⚠ 「船身以外」指的是**天空**，不是控制盤面（ver -1127）：-1086 寫這一條時
     船的命中圈還蓋著盤面上緣，所以盤面落在感應那一邊、沒人發現；-1127 把感應
     收進飛行窗之後，盤面就會掉到這裡來 —— 而**按住盤面不動是玩家的煞車動作**，
     在那裡生一隻怪出來是實打實的誤觸。所以這一條也一起收進飛行窗（同 `onShip` 的①）。 */
  if(canSpawnHold() && e.clientY < skyHuntFloor() && !onShip && !sturmT0)
    spawnHoldT=setTimeout(()=>{ spawnHoldT=0; spawnByHold(); }, SPAWN_HOLD_MS);
});
stage.addEventListener('pointermove',e=>{
  if(e.pointerId!==dragId) return;
  const dx=e.clientX-ox, dy=e.clientY-oy;
  moved=Math.max(moved,Math.hypot(dx,dy));
  if(moved>TAP_SLOP && senseT0) senseCancel();      // 一動就不是長按
  if(moved>TAP_SLOP && sturmT0) sturmCancel();       // 同上：一動就不是長按
  if(moved>TAP_SLOP && spawnHoldT){ clearTimeout(spawnHoldT); spawnHoldT=0; }
  fwd=clamp(dy/DRAG_FULL,-1,1);                   // 往下（往後）拉＝前進
  const mag=Math.max(0,Math.abs(dx)-STEER_DEAD);  // 扣掉死區後才算舵量
  rgt=clamp(-Math.sign(dx)*mag/(DRAG_FULL-STEER_DEAD),-1,1);   // 往左拉＝往右偏
});
const endDrag=e=>{
  if(e && e.pointerId!==dragId) return;
  if(senseT0) senseCancel();
  clearTimeout(spawnHoldT); spawnHoldT=0;
  const held = downAt ? performance.now()-downAt : 0;
  // 幾乎沒動＝點擊：命中已展開的名牌就進入該地標
  if(dragging && moved<TAP_SLOP && e && e.clientX!=null){
    const px=e.clientX, py=e.clientY;
    let hitName=false;
    for(const h of hotspots){
      if(px>=h.x&&px<=h.x+h.w&&py>=h.y&&py<=h.y+h.h){ enterPlace(h.P); hitName=true; break; }
    }
    /* **輕點船身＝閒聊**（ver -1086；**ver -1171 起預設關閉**，見 `SHIP_TAP_TALK`）。
       ⚠ 用「按了多久」而不是「感應有沒有發動」來分辨輕點與長按：長按放手時
       `senseT0` 已經被上面那一行收掉了，拿它當判準會讓每一次長按放手都再補一段閒聊。 */
    if(SHIP_TAP_TALK && !hitName && onShip && held<TAP_MS && !s9Tutor) talkTap();
    /* ══ 釘選：點一下飛行畫面 → 地面射出一道光柱＋座標；再點一下移除
       （ver -1146，Ray：「加入飛行畫面釘選工具」「點一下飛行畫面，可生成從地面
         發出的光柱」「並顯示該座標」「再點一下可移除」）══
       ⚠⚠ **與大地圖的釘選是同一根釘子**（`MV.pin`，鐵律 7）：在天上插的，
         打開地圖就在那裡；方向計上那束黃光也自動指過去，不必另接。
       ⚠⚠ 「再點一下移除」＝**切換**，與路人單句「點一下出、再點一下收」同一個
         慣例（§6.5.4）—— 所以有釘子時**不重新定位**，先拔掉。要移到別處就點兩下
         （拔、再插），這比「點哪就跳哪、沒辦法收掉」好懂。
       ⚠ 這一支排在船身與名牌**之後**：那兩者各有自己的意思，釘選吃的是
         「剩下的那片畫面」。排除區與 `onShip` 那一組完全一致：
         · `py<skyBottom()`　控制盤面不是飛行窗（含伸進窗裡的方向計與舵輪）
         · `!sturmHit()`　　 方向計那一帶歸加速
         · `!onShip`／`!hitName`　**船身歸長按感應**（ver -1171 起輕點不再閒聊，
           但這一條**不要跟著放寬** —— 船身讓給感應，不是讓給釘選）、名牌歸進入
       ⚠ 點到天空（射線整條都沒撞到地形）＝**什麼都不做**，不是「插在無限遠」。 */
    if(!hitName && !onShip && !mapOpen && held<TAP_MS
       && py<skyBottom() && !sturmHit(px,py)){
      if(MV.pin) MV.pin=null;
      else { const q=pickTerrain(px,py); if(q) MV.pin=q; }
      if(mapOpen) drawMap();
    }
  }
  if(dragId!==null){ try{ stage.releasePointerCapture(dragId); }catch(_){} }
  dragging=false; dragId=null; fwd=0; rgt=0;
  sturmCancel();
};
stage.addEventListener('pointerup',endDrag);
stage.addEventListener('pointercancel',endDrag);
/* 保險絲：捕獲若因故沒生效（某些瀏覽器在按住時開新視窗會丟掉捕獲），
   視窗層級的放開與失焦一樣把手放開。寧可多停一次，也不要卡住油門。 */
addEventListener('pointerup',endDrag);
addEventListener('pointercancel',endDrag);
addEventListener('blur',()=>endDrag());
document.addEventListener('visibilitychange',()=>{ if(document.hidden) endDrag(); });
/* 鍵盤：WASD（方向鍵同義）。桌機上摸不到拉桿，W/S 就是推拉那根桿子 ——
   ⚠ 用「持續推移」而不是一按到底：拉桿的手感就在於可以停在半速，
     鍵盤若一按就滿舵，等於桌機玩到的是另一套操作。 */
const keys={};
addEventListener('keydown',e=>{ keys[e.key.toLowerCase()]=true; });
addEventListener('keyup',  e=>{ keys[e.key.toLowerCase()]=false; });
/* ⚠ 切換視窗／分頁時 keyup 收不到，鍵會卡在 true。
   舊設計是「按著才會動」，卡鍵放開就停、看得出來；現在拉桿有記憶，
   一個漏掉的 keyup 會把油門一路推到底並停在那，畫面上看起來像船自己在跑。
   失焦一律清空按鍵狀態。 */
const clearKeys=()=>{ for(const k in keys) keys[k]=false; };
addEventListener('blur',clearKeys);
document.addEventListener('visibilitychange',()=>{ if(document.hidden) clearKeys(); });

/* ══ 時間（ver -435，Ray 定案）══════════════════════════════════════════
   「第一次進入城鎮的時間是 1908年10月11日 11:00，從這個時間點開始計時。（ver -1324 由 6月13日改）
     程式內的活動就用現在的計時方式，大地圖則是**一場戰鬥 1 小時、進入其他城鎮或
     地圖 1 小時**，時間線性往前推進。」

   ⚠⚠ **這一頁以前有一個自己的假時鐘**（`{minutes:8*60, date:14}` 寫死，
     再靠航行距離 `mv*0.10` 往前推）—— 它與主遊戲的時鐘完全沒有關係，
     所以城裡是 6/13 傍晚、飛上天卻永遠是「14 日 08:00」。ver -435 拆掉了：
     這一頁改成**讀主遊戲那一份**（`tivot_clock_v1`，開局起算的分鐘數）。
   ⚠⚠ **飛行本身不再花時間**：時間只在「打一場」與「進一個地方」時各 +1 小時。
     那正是 Ray 說的「線性往前推進」—— 時間跟著**事件**走，不跟著你繞了多少圈走。
     連帶：晝夜（`sky()` 讀 `clock.minutes`）在飛行途中不再流動，
     過了那一小時才跳一格。這是規則改了之後的結果，不是壞掉。
   ⚠⚠ `EPOCH` 與 `script/clock.js` 的那一份是**同一組數字**（1908-10-11 11:00）——
     這一頁是非 module 的獨立文件，import 不到那一份，**改一邊要改另一邊**
     （鐵律 7 的但書）。 */
const CLOCK_KEY='tivot_clock_v1';
const CLOCK_EPOCH={ y:1908, mo:10, d:11, h:11, mi:0 };   // ver -1324：由 6/13 改成 10/11
const HOUR=60;                       // 大地圖上「一件事」的時間單位（Ray 指定 1 小時）
function clockElapsed(){
  try{ const n=parseInt(localStorage.getItem(CLOCK_KEY),10); return isFinite(n)&&n>0?n:0; }
  catch(e){ return 0; }
}
/* ⚠ 推進走這一支（唯一的寫入點，鐵律 8）：戰鬥交棒與進入地點都叫它。 */
function clockAdvance(min){
  const v=Math.max(0, clockElapsed()+(min|0));
  try{ localStorage.setItem(CLOCK_KEY, String(v)); }catch(e){}
  syncClock();
  return v;
}
/* 目前的年月日時分。⚠ 用真的 Date 算跨日／跨月，不要自己數（同 script/clock.js）。 */
function clockNow(){
  const d=new Date(Date.UTC(CLOCK_EPOCH.y, CLOCK_EPOCH.mo-1, CLOCK_EPOCH.d,
                            CLOCK_EPOCH.h, CLOCK_EPOCH.mi));
  d.setUTCMinutes(d.getUTCMinutes()+clockElapsed());
  return { y:d.getUTCFullYear(), mo:d.getUTCMonth()+1, d:d.getUTCDate(),
           h:d.getUTCHours(), mi:d.getUTCMinutes() };
}
/* `clock` 這個物件仍然存在，因為晝夜（`sky()`）與閒聊時段（`talkPeriod`）都讀它 ——
   但它現在是**主時鐘的投影**，不是自己在跑。`dist` 還是這一頁自己的（航行距離）。 */
const clock={minutes:0,date:0,dist:0};
function syncClock(){
  const t=clockNow();
  clock.minutes=t.h*60+t.mi;
  clock.date=t.d;
  const dEl=document.getElementById('date');   if(dEl) dEl.textContent=t.d;
  const cEl=document.getElementById('clock');  if(cEl)
    cEl.textContent=String(t.h).padStart(2,'0')+':'+String(t.mi).padStart(2,'0');
  const yEl=document.getElementById('era');    if(yEl) yEl.textContent='大陸曆 '+t.y+'年'+t.mo+'月';
}
syncClock();

/* ══ 右上那一顆：**系統選單**（ver -1085，Ray：「改成通用的 II 系統鈕」）══
   -775 起它是一顆「回到主畫面」的圓形 ✕；現在改成打開**與槍棺齒輪同一個**
   系統選單（音量／震動／自動播放／回到主選單全在裡面，鐵律 8）——
   「回到主畫面」變成選單裡的一個選項，而不是右上角一按就走。
   ⚠ 選單住在**父頁**（那裡才有 settings 模組與它所有的掛鉤）。
   ⚠ 獨立開發模式沒有父頁 → 退回舊行為（跳回 index），不要變成一顆按不動的鈕。 */
document.getElementById('backBtn').addEventListener('click',()=>{
  try{ if(window.parent!==window && window.parent.__tivotFlight
         && window.parent.__tivotFlight.menu){
    window.parent.__tivotFlight.menu(); return; } }catch(_){}
  location.href='../index.html';
});

/* ══ 地圖畫面 ══
   直接用那張插畫（有地名、有圖例），裁切範圍與地形完全一致 →
   世界座標換算成圖上位置是直的：地圖像素 ÷ (MAPW,MAPH) 就是百分比。
   ⚠ 圖是**點開才載**（226KB）。飛行開場已經要讀高度圖與地貌圖，
     沒有理由讓一張只在暫停時看的圖跟著擋在前面。 */
/* ══ 2.5D 大陸浮雕 ══
   把高度場以斜角正投影烘成一張圖：sy = y*TILT − 高度×誇張倍率。
   由遠（北，y 小）往近（南，y 大）逐列畫，畫家演算法自然形成遮擋。
   ⚠ 用 COL（合成的地貌色）而不是那張插畫：插畫把地名與圖例畫死在像素裡，
     跟著地形位移會歪掉；而且用同一份反照率，地圖看到的顏色才跟飛行畫面
     是同一片大陸。
   ⚠ TILT 必須與 settlement.js 一致，否則聚落會浮在地表之上或陷進去。
   ⚠ 烘一次就好（2.6M 取樣）：以半解析度做，之後平移縮放都只是貼圖。 */
const MAP_TILT=(window.Settlement?Settlement.TILT:0.58);
const MAP_HEX=2.4;                     // 高度誇張倍率（1＝真實比例，太真實會扁得看不出山）
const MAP_SS=0.5;                      // 烘焙解析度（相對地圖像素）
/* ══ 平面 2D 開發地圖（ver -832，Ray：「先把大地圖做成全平面不要有 3D，
   我直接點座標給你比較快」）══ 網址帶 ?flatmap ＝地圖視圖改畫 COL 的 1:1 正俯視
   （不吃斜投影／tilt／高度位移），點選讀數＝精確地圖座標（與 SETTLEMENTS／
   build_city.py 同一套）。物件與浮雕同形（cv/w/h/ss/flat/pick），
   drawMap／mapPick／疊加物全部照走 reliefXY 那一條，不另寫一套（鐵律 8）。 */
const FLATMAP=/[?&]flatmap/.test(location.search);
let relief=null;                       // {cv, w, h, ss, flat, maxRise, hK, pick}
function buildRelief(){
  if(relief) return relief;
  if(FLATMAP){
    const cv=document.createElement('canvas'); cv.width=MAPW; cv.height=MAPH;
    const c=cv.getContext('2d');
    const img=c.createImageData(MAPW,MAPH), U=new Uint32Array(img.data.buffer);
    const SEA=rgb(28,38,52);
    for(let i=0;i<MAPW*MAPH;i++) U[i]=(HGT[i]<=CLOUD_H)?SEA:COL[i];
    c.putImageData(img,0,0);
    /* ss＝「地圖像素→畫布像素」倍率（平面是 1:1）；pick 不必反查表 ——
       畫布座標本身就是地圖座標，mapPick 直接用。 */
    relief={ cv, w:MAPW, h:MAPH, maxRise:0, hK:0, sh0:MAPH, ss:1, flat:true, pick:null };
    return relief;
  }
  const sw=Math.round(MAPW*MAP_SS), sh0=Math.round(MAPH*MAP_SS);
  const hK=MAP_SS/MAP_SCALE*MAP_HEX;                    // 高度值 → 烘焙畫布像素
  let maxRise=0;
  for(let i=0;i<MAPW*MAPH;i+=13) if(HGT[i]>maxRise) maxRise=HGT[i];
  maxRise=Math.ceil(maxRise*hK)+2;
  const sh=Math.round(sh0*MAP_TILT)+maxRise+2;
  const cv=document.createElement('canvas'); cv.width=sw; cv.height=sh;
  const c=cv.getContext('2d');
  const img=c.createImageData(sw,sh), U=new Uint32Array(img.data.buffer);
  /* 反查表：每個浮雕像素記下「是哪個地圖像素畫的」。
     ⚠ 非有不可：浮雕是斜角投影、還依高度往上位移，螢幕座標**沒有**解析的
       反函式（drawMap 的讀數註解也記了這件事）。畫的時候順手記下來才是精確的。
     ⚠ 後畫的覆蓋先畫的，而迴圈是由遠而近 —— 所以留在表上的正好是看得見的
       那一格，不必另外做深度判斷。 */
  const PICK=new Int32Array(sw*sh).fill(-1);
  const SEA=rgb(28,38,52);
  U.fill(0);                                            // 透明底，海另外畫
  const step=Math.round(1/MAP_SS);
  for(let y=0;y<sh0;y++){
    const my=Math.min(MAPH-1,(y*step)|0);
    const gy=y*MAP_TILT+maxRise;                        // 地面線
    for(let x=0;x<sw;x++){
      const mx=Math.min(MAPW-1,(x*step)|0);
      const i=my*MAPW+mx, hh=HGT[i];
      if(hh<=CLOUD_H){                                  // 雲海／海：平的一片
        const py=(gy|0); if(py>=0&&py<sh){ U[py*sw+x]=SEA; PICK[py*sw+x]=i; }
        continue;
      }
      const rise=hh*hK;
      const top=(gy-rise)|0, bot=(gy|0)+1;
      const c0=COL[i];
      // 頂面：地貌色。側面：同色壓暗 → 讀得出立體，又不必另做岩壁貼圖
      const r0=c0&255, g0=(c0>>8)&255, b0=(c0>>16)&255;
      const face=rgb((r0*0.62)|0,(g0*0.62)|0,(b0*0.66)|0);
      for(let yy=Math.max(0,top);yy<bot&&yy<sh;yy++){
        U[yy*sw+x]=(yy<top+2)?c0:face; PICK[yy*sw+x]=i;
      }
    }

  c.putImageData(img,0,0);
  relief={ cv, w:sw, h:sh, maxRise, hK, sh0, ss:MAP_SS, flat:false, pick:PICK };
  return relief;
}
/* 地圖像素 → 浮雕畫布座標（聚落要坐在地表上，用同一條換算）
   ⚠ 平面模式（?flatmap）：畫布就是 1:1 正俯視，恆等式 —— 所有疊加物自動落對位。 */
function reliefXY(mx,my){
  const R=relief;
  if(R.flat) return { x:mx, y:my };
  const i=(Math.min(MAPH-1,my|0))*MAPW+(Math.min(MAPW-1,mx|0));
  const hh=HGT[i]>CLOUD_H?HGT[i]:CLOUD_H;
  return { x:mx*MAP_SS, y:my*MAP_SS*MAP_TILT+R.maxRise-hh*R.hK };
}

/* ══ 禁航區的紅罩（ver -1136）══ 烘一次就好：逐個**浮雕像素**問它是哪一格地圖
   （`relief.pick` 反查表，平面模式直接是 1:1），那一格落在禁航國就塗紅。
   ⚠ 地形圖與國界表都齊了才烘得出來（開機時 REGION 可能還在路上）——
     沒烘成就回 null，下一幀再試（畫面上就是「地圖開著、罩晚一拍才出現」）。
   ⚠ 名單改了要重烘：`noflyMaskCv=null` 就好（目前只有開機一次，沒有人改）。 */
let noflyMaskCv=null;
function noflyMask(){
  if(noflyMaskCv) return noflyMaskCv;
  if(!REGION || !MAPW || !relief) return null;
  const R=relief;
  const cv=document.createElement('canvas'); cv.width=R.w; cv.height=R.h;
  const c=cv.getContext('2d');
  const img=c.createImageData(R.w,R.h), U=new Uint32Array(img.data.buffer);
  /* ABGR（同 `rgb()` 那一套）：紅、約 22% 不透明 —— 「半透淡」是 Ray 的字，
     太濃會把地貌蓋掉，那張圖玩家還要拿來認路。 */
  const RED = (56<<24) | (48<<16) | (48<<8) | 210;
  const inNofly = new Uint8Array(REGION_W*REGION_H);
  for(let i=0;i<inNofly.length;i++) inNofly[i] = NOFLY_IDS.indexOf(REGION[i])>=0 ? 1 : 0;
  const kx=REGION_W/MAPW, ky=REGION_H/MAPH;
  for(let y=0;y<R.h;y++){
    for(let x=0;x<R.w;x++){
      const o=y*R.w+x;
      let mi;
      if(R.flat) mi = y*MAPW + x;                 // 平面：畫布就是地圖
      else { mi = R.pick[o]; if(mi<0) continue; } // 浮雕：反查表（-1＝這一點沒有地表）
      const mx=mi%MAPW, my=(mi/MAPW)|0;
      const ri=((my*ky)|0)*REGION_W + ((mx*kx)|0);
      if(inNofly[ri]) U[o]=RED;
    }
  }
  c.putImageData(img,0,0);
  noflyMaskCv=cv; return cv;
}

const mapView=document.getElementById('mapView'), mapCv=document.getElementById('mapCv');
const mctx=mapCv.getContext('2d');
let mapOpen=false;
/* 視圖：zoom 1＝整張大陸剛好塞滿寬度；cx/cy＝視野中心的地圖像素座標 */
const MV={ zoom:1, cx:0, cy:0, min:1, max:FLATMAP?48:16 };   // 平面模式放大到看得清單一像素
/* ══ 地圖目的地標記（ver -743，Ray：「地圖沒有標出聖王廳，要移過去然後標記。
   把標記功能寫入」）══ 一個持久的目的地標（跨開關、跨重載——存 localStorage），
   劇情設（出航對白指聖王廳）、劇情清（抵達之後的稿再說）。
   畫在 drawMap 的聚落名牌那一層之上：金圈脈動＋菱標＋名字。 */
const MAP_MARK_KEY='tivot_map_mark_v1';
let MAP_MARK=null;
try{ MAP_MARK=JSON.parse(localStorage.getItem(MAP_MARK_KEY)||'null'); }catch(_){}
function setMapMark(mx,my,label){
  MAP_MARK={ x:mx, y:my, label:label||'' };
  try{ localStorage.setItem(MAP_MARK_KEY, JSON.stringify(MAP_MARK)); }catch(_){}
  if(mapOpen) drawMap();
}
function clearMapMark(){
  MAP_MARK=null;
  try{ localStorage.removeItem(MAP_MARK_KEY); }catch(_){}
  if(mapOpen) drawMap();
}
/* 平移鏡頭到某個地圖座標（900ms ease；出航對白「移過去」用）。 */
function mapPanTo(mx,my,ms){
  const q=reliefXY(mx,my);
  const x0=MV.cx, y0=MV.cy, t0=performance.now(), T=ms||900;
  const step=()=>{
    const t=Math.min(1,(performance.now()-t0)/T), e=1-Math.pow(1-t,3);
    MV.cx=x0+(q.x-x0)*e; MV.cy=y0+(q.y-y0)*e; drawMap();
    if(t<1 && mapOpen) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

function mapFit(){
  const R=buildRelief();
  const w=mapCv.clientWidth||900;
  /* ⚠ 高度改吃容器的實際高度，不再由大陸長寬比推 —— 畫布要滿版，
     大陸放不放得下是由 MV.zoom 決定的，不該讓長寬比決定畫布多高。 */
  const h=mapCv.clientHeight||Math.round(w*R.h/R.w);
  const dpr=Math.min(2,devicePixelRatio||1);
  if(mapCv.width!==Math.round(w*dpr)||mapCv.height!==Math.round(h*dpr)){
    mapCv.width=Math.round(w*dpr); mapCv.height=Math.round(h*dpr);
  }
  return { w, h, dpr, base:w/R.w, R };   // base：zoom=1 時 1 浮雕像素＝幾個 CSS px
}
function drawMap(){
  if(!mapOpen || !MAPW) return;
  const { w, h, dpr, base, R } = mapFit();
  const sc=base*MV.zoom;                                   // 浮雕像素 → CSS px
  const halfW=w/2/sc, halfH=h/2/sc;
  MV.cx=clamp(MV.cx, Math.min(halfW,R.w/2), Math.max(R.w-halfW,R.w/2));
  MV.cy=clamp(MV.cy, Math.min(halfH,R.h/2), Math.max(R.h-halfH,R.h/2));
  const ox=w/2-MV.cx*sc, oy=h/2-MV.cy*sc;

  mctx.setTransform(dpr,0,0,dpr,0,0);
  mctx.fillStyle='#0a0c12'; mctx.fillRect(0,0,w,h);
  mctx.imageSmoothingEnabled=MV.zoom<2.5;                  // 放很大改硬像素，免得糊成一團
  mctx.drawImage(R.cv, ox, oy, R.w*sc, R.h*sc);

  /* ══ 禁航區的紅色薄罩（ver -1136，Ray：「禁航區用紅色半透淡遮罩」）══
     畫在地形**之上、國界線之下** —— 線是輪廓、罩是「這一塊不准進」，線要壓在罩上面
     才讀得出邊界在哪。
     ⚠⚠ 罩是**烘一次的離屏畫布**（`noflyMask()`），不是每幀逐像素算：它與地形共用
       同一個 `drawImage` 變換（`R.cv` 那一行的 ox/oy/sc），所以永遠對得準，
       而且逐幀成本只有一次貼圖。
     ⚠ 用浮雕的反查表（`R.pick`）決定每個浮雕像素是哪一格地圖 —— 斜角投影沒有
       解析的反函式（見 buildRelief 的說明），這是唯一精確的作法。 */

     因為隨 stage 禁航區會變」；⚠ ver -1136 起**禁航的那幾國另外鋪一層紅罩**，
     見上面那一段 —— 「不用色塊」那句話針對的是「每一國一個顏色」，不是這個）══
     畫在地形之上、公路之下。
     製圖學的國界符號：深色打底＋暗紅**點劃線** —— 虛線與鐵路同理（自然界
     沒有虛線），而且與公路（金）／鐵路（深＋淺枕木）／河（藍灰）都分得開。
     ⚠ 虛線節距跟著縮放走（同鐵路那一條的理由）；畫完要把 dash 歸零，
       不然接下來的公路整批變虛線。 */
  if(BORDER_PATHS.length){
    mctx.lineCap='round'; mctx.lineJoin='round';
    const trace=()=>{
      for(const pts of BORDER_PATHS){
        mctx.beginPath();
        for(let k=0;k<pts.length;k++){
          const q=reliefXY(pts[k][0], pts[k][1]);
          if(k) mctx.lineTo(ox+q.x*sc, oy+q.y*sc); else mctx.moveTo(ox+q.x*sc, oy+q.y*sc);
        }
        mctx.stroke();
      }
    };
    mctx.setLineDash([]);
    mctx.strokeStyle='rgba(20,12,10,.62)';
    mctx.lineWidth=Math.max(2.4, sc*R.ss*2.6);

    const du=Math.max(4, sc*R.ss*5);
    mctx.setLineDash([du*1.6, du*0.8, du*0.4, du*0.8]);   // 長劃・點・長劃（點劃線）
    mctx.strokeStyle='rgba(224,92,72,.95)';
    mctx.lineWidth=Math.max(1.2, sc*R.ss*1.1);
    trace();
    mctx.setLineDash([]);
  }

  /* 道路：畫在聚落之下、地形之上。跟 3D 畫面同一份 ROAD_PATHS，
     所以地圖上看到的路就是實際飛過去會看到的那一條。 */
  if(ROAD_PATHS.length){
    mctx.lineCap='round'; mctx.lineJoin='round';
    for(let pass=0;pass<2;pass++){

      mctx.strokeStyle = pass? 'rgba(196,168,116,.85)' : 'rgba(38,30,20,.55)';
      mctx.lineWidth   = pass? Math.max(0.8, sc*R.ss*1.1) : Math.max(1.6, sc*R.ss*2.2);
      for(const pts of ROAD_PATHS){
        mctx.beginPath();
        for(let k=0;k<pts.length;k++){
          const q=reliefXY(pts[k][0], pts[k][1]);
          if(k) mctx.lineTo(ox+q.x*sc, oy+q.y*sc); else mctx.moveTo(ox+q.x*sc, oy+q.y*sc);

  /* 鐵路：畫在公路之上、聚落之下，走**製圖學的鐵路符號** ——
     深色實線打底，上面壓一排淺色短虛線（＝枕木）。
     ⚠ 第一版是「冷灰的細實線」，結果在地圖上跟**河**分不開（河是

  if(RAIL_PATHS.length){

        for(let k=0;k<pts.length;k++){

          if(k) mctx.lineTo(ox+q.x*sc, oy+q.y*sc); else mctx.moveTo(ox+q.x*sc, oy+q.y*sc);

  if(window.Settlement){
    const list=buildSettlements().slice().sort((a,b)=>a.my-b.my);
    for(const s of list){
      const p=reliefXY(s.mx,s.my);
      const sx=ox+p.x*sc, sy=oy+p.y*sc;
      // 聚落半徑是地圖像素 → 換到浮雕像素
      const rs=sc*R.ss, dia=s.radius*2*rs;

      const unlocked = !!s.town &&
        (PLACE_STAGE_FROM[s.name]==null || gameStage()>=PLACE_STAGE_FROM[s.name]);
      if(dia>26 || unlocked){

        const tw=mctx.measureText(s.name).width;

        mctx.fillRect(sx-tw/2-5, sy+dia*0.26, tw+10, 15);

  if(STARS.length && starShow){

      const sx=ox+q.x*sc, sy=oy+q.y*sc;
      if(sx<-24||sy<-24||sx>w+24||sy>h+24) continue;

        mctx.strokeStyle='rgba(24,18,8,.85)'; mctx.lineWidth=1.4; mctx.stroke();

      }

        mctx.font='10px "Noto Serif TC",serif'; mctx.textAlign='center';
        const tw=mctx.measureText(nm).width;
        mctx.fillStyle='rgba(8,7,12,.78)'; mctx.fillRect(sx-tw/2-4, sy+r+2, tw+8, 13);

      if(!found && starShow<2 && !ADMIN) continue;
      const q=reliefXY(P.x,P.y);
      const sx=ox+q.x*sc, sy=oy+q.y*sc;
      if(sx<-24||sy<-24||sx>w+24||sy>h+24) continue;
      const r=Math.max(6, Math.min(13, 6*Math.sqrt(MV.zoom)));
      starPath(mctx,sx,sy,r);
      if(found){
        mctx.fillStyle='rgba(255,232,120,.92)'; mctx.fill();
        mctx.strokeStyle='rgba(24,18,8,.85)'; mctx.lineWidth=1.4; mctx.stroke();
      }else{
        mctx.strokeStyle='rgba(255,232,120,.55)'; mctx.lineWidth=1.4; mctx.stroke();
      }

      const nm=placeName(P);
      const tw=mctx.measureText(nm).width;
      mctx.fillStyle='rgba(8,7,12,.78)'; mctx.fillRect(sx-tw/2-4, sy+r+2, tw+8, 13);

  const p=reliefXY(cam.x/MAP_SCALE, cam.y/MAP_SCALE);
  drawShipMark(mctx, ox+p.x*sc, oy+p.y*sc, cam.angle);

  drawMapMark(ox,oy,sc,performance.now());   // 目的地標記（ver -743）：最上層

  {

    const t2=R.flat
      ? ('×'+MV.zoom.toFixed(2)+'  平面1:1  中心 ('+Math.round(MV.cx)+','+Math.round(MV.cy)+')')
      : ('×'+MV.zoom.toFixed(2)+'  地圖像素');

    /* ⚠ 拖城的狀態列已隨移城搬進地圖編輯器（ver -1254）——
       這一頁不再拿得起任何聚落，讀數也就沒有第四行。 */
    const t4=null;

/* 點一下讀座標：拖曳超過 4px 就不算點選（不然平移完會順便標一個點）。

/* 畫面座標 → 地圖座標（mapPick 與拖城共用，鐵律 8）：
   浮雕走反查表、平面直接就是（同 mapPick 原本那段）。出界回 null。 */
function mapCoordAt(cssX,cssY){
  const { w, h, base }=mapFit(), R=relief; if(!R||(!R.pick&&!R.flat)) return null;
  const sc=base*MV.zoom, ox=w/2-MV.cx*sc, oy=h/2-MV.cy*sc;
  const rx=Math.round((cssX-ox)/sc), ry=Math.round((cssY-oy)/sc);
  if(rx<0||ry<0||rx>=R.w||ry>=R.h) return null;
  const i=R.flat ? (ry*MAPW+rx) : R.pick[ry*R.w+rx];
  return i<0 ? null : [i%MAPW, (i/MAPW)|0];
}
/* 拖城：這一點抓得到哪座聚落（半徑取圖標／平面圖較大者，最少 12 地圖像素）。
   ⚠⚠ **遺蹟（只住在 `PLACES` 的地點）也抓得到**（ver -1109，Ray：「遺蹟也要可以
     雙擊移動啊」）：包成同樣形狀的把手（`name`/`mx`/`my`），下游
     （`moveSettlement`）一行都不必改（鐵律 8）。
   ⚠ ver -1254 起唯一的呼叫端是**地圖編輯器的「移城」筆**。
   ⚠ 聚落**優先**：同一點上兩者都抓得到時，先給城 —— 城比較大，遺蹟多半在城外。
   ⚠ 沒被感應到的遺蹟照樣抓得到：那是管理人的工具，不該被玩家的進度擋住。 */
function grabSettlementAt(mx,my){
  if(!ADMIN) return null;
  let best=null, bd=1e9;
  for(const s of buildSettlements()){
    const r=Math.max(12, s.radius||0, (s.planW||0)*0.5/MAP_SCALE);
    const d=Math.hypot(mx-s.mx, my-s.my);
    if(d<=r && d<bd){ best=s; bd=d; }
  }
  if(best) return best;
  for(const P of PLACES){
    if(SETTLEMENTS.some(S=>S.n===P.name)) continue;      // 同名的城已經在上面處理
    /* ⚠ 半徑讀 `base.r`（世界單位）→ 換成地圖像素再放寬 1.4 倍；
       最小 10 地圖像素，不然縮圖時根本點不到（同聚落的 12）。 */
    const A2=P.ruin && RUIN_ART[P.ruin];
    const r=Math.max(10, A2 ? A2.base.r/MAP_SCALE*1.4 : 0);
    const d=Math.hypot(mx-P.x, my-P.y);
    if(d<=r && d<bd){ best={ name:P.name, mx:P.x, my:P.y, _place:P }; bd=d; }
  }
  return best;
}
/* 拖城：把聚落搬到 (x,y) —— 地圖顯示層（settleCache 的 mx/my）與資料
   （SETTLEMENTS／同名 PLACES）一起改，圖標與名牌即時跟著走。 */
function moveSettlement(s,x,y){
  s.mx=x; s.my=y;
  const S=SETTLEMENTS.find(S2=>S2.n===s.name); if(S){ S.x=x; S.y=y; }
  const P=PLACES.find(p=>p.name===s.name);    if(P) placeMoveTo(P,x,y);
  if(s._place && s._place!==P) placeMoveTo(s._place,x,y);
  drawMap();
}

     只改 x/y 的話名牌會留在舊位置，而且沒有任何錯誤訊息。 */
function placeMoveTo(P,x,y){
  P.x=x; P.y=y;
  P.wx=x*MAP_SCALE; P.wy=y*MAP_SCALE;

   1:1 的離屏畫布（2152×1200），視圖只是把它縮放貼上 —— 平移縮放不必重算像素。
   ⚠ 全圖重畫約 250 萬格，開一次編輯器／切一次模式才做；畫筆只重畫髒區
     （`putImageData` 的髒矩形版本）。 */
function mePix(i,h){
  if(h<=CLOUD_H){                                   // 雲海：越深越暗，讀得出大陸的形狀
    const k=clamp(h/CLOUD_H,0,1);
    return [18+k*14, 26+k*20, 44+k*26];
  }
  if(meMode===1 && BIOME){                          // 地貌模式：塗的是貼材的代表色
    const g=BIOME[i]&0x0f, M=MAT_PALETTE.find(m=>m.g===g);
    const c=M?M.c:[ (COL[i]&255), (COL[i]>>8)&255, (COL[i]>>16)&255 ];
    const k=0.62+0.38*clamp((h-CLOUD_H)/(PEAK_SCALE-CLOUD_H),0,1);
    return [c[0]*k, c[1]*k, c[2]*k];
  }
  /* 高度模式：純明度。⚠ Ray 指定「高度用深淺表示」—— 不要加陰影或彩色分層，
     那會讓「這一塊比那一塊高多少」變成用猜的。
     ⚠⚠ **要伽瑪，不能線性**：陸地高度 45~521 但**平均只有 169**（實測，
       51.6% 的格子是陸地）—— 線性映射會把大半個大陸壓在最暗的三分之一，
       整張圖看起來只有幾座山是亮的，中間的起伏全部糊成一片黑。
       0.62 次方把平均值抬到中灰，山還是最亮。 */
  const k=clamp((h-CLOUD_H)/(PEAK_SCALE-CLOUD_H),0,1);
  const v=32+216*Math.pow(k,0.62);
  return [v, v*0.985, v*0.93];
}
function mePaint(d){
  if(!meImg) return;
  const D=meImg.data;
  const x0=d?Math.max(0,d.x0):0, x1=d?Math.min(MAPW-1,d.x1):MAPW-1;
  const y0=d?Math.max(0,d.y0):0, y1=d?Math.min(MAPH-1,d.y1):MAPH-1;
  for(let y=y0;y<=y1;y++){
    const row=y*MAPW;
    for(let x=x0;x<=x1;x++){
      const i=row+x, o=i*4;
      let c;
      if(RIV[i] && HGT[i]>CLOUD_H){                 // 河：一律畫得出來（編輯時要看得見）
        const k=clamp((HGT[i]-CLOUD_H)/(PEAK_SCALE-CLOUD_H),0,1);
        c=[52+40*k, 92+46*k, 118+50*k];
      }else c=mePix(i,HGT[i]);
      D[o]=c[0]; D[o+1]=c[1]; D[o+2]=c[2]; D[o+3]=255;
    }
  }
  if(d) meBaseG.putImageData(meImg, 0,0, x0,y0, x1-x0+1, y1-y0+1);
  else  meBaseG.putImageData(meImg, 0,0);
}
function meBuildBase(){
  if(!meBase){ meBase=document.createElement('canvas'); }
  if(meBase.width!==MAPW||meBase.height!==MAPH){
    meBase.width=MAPW; meBase.height=MAPH; meBaseG=meBase.getContext('2d');
    meImg=meBaseG.createImageData(MAPW,MAPH);
  }
  mePaint(null);
}

/* ── 視圖 ──────────────────────────────────────────────────────── */
/* 工具列與色票的版面：兩者都是覆蓋層，而工具列會換行（手機上三四排都有可能）——

function meLayoutBar(){
  const bar=meEl('meBar');
  if(!bar) return 0;
  const h=bar.offsetHeight||0;
  let extra=0;
  /* ⚠ 只會有一條 strip 是開著的（工具是單選），所以兩條都貼在工具列正下方。 */
  for(const id of ['meMat','meFlatBar']){
    const el=meEl(id); if(!el) continue;
    el.style.top=h+'px';
    if(el.classList.contains('on')) extra=el.offsetHeight||0;
  }
  return h+extra;
}
function meFit(){
  const c=meEl('meCv'), W=c.clientWidth||innerWidth, H=c.clientHeight||innerHeight;
  /* ⚠ 讓開工具列：不讓的話「全地圖平面顯示」有一截永遠壓在鈕底下，
     而那一截通常正是剛畫完的東西（-1254 實測，畫的山脊整條藏在工具列後面）。 */
  const top=meLayoutBar(), Hv=Math.max(80, H-top-16);
  meView.s=Math.min(W/MAPW, Hv/MAPH);
  meView.x=MAPW/2 - W/(2*meView.s);
  meView.y=(MAPH/2 - Hv/(2*meView.s)) - top/meView.s;
}
function meToMap(cx,cy){ return [meView.x+cx/meView.s, meView.y+cy/meView.s]; }
function meDraw(){
  if(!meOpen) return;

  if(c.width!==Math.round(W*dpr)||c.height!==Math.round(H*dpr)){ c.width=Math.round(W*dpr); c.height=Math.round(H*dpr); }
  const g=c.getContext('2d');

  g.drawImage(meBase, -meView.x*s, -meView.y*s, MAPW*s, MAPH*s);
  const P=(x,y)=>[(x-meView.x)*s, (y-meView.y)*s];
  const poly=(pts,col,w,dash)=>{
    g.beginPath();
    for(let k=0;k<pts.length;k++){ const q=P(pts[k][0],pts[k][1]); k?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1]); }

     這就是「先套用再問」對擦除的實現：擦到哪裡，那一段當場就不見了。 */
  const extra = [meCur, mePend && mePend.k==='edit' ? mePend.e : null].filter(e=>e && e.t==='erase');
  for(const pts of mapEditCut(ROAD_PATHS, extra)) poly(pts,'rgba(214,178,92,.85)',Math.max(1,s*1.6));
  for(const pts of mapEditCut(RAIL_PATHS, extra)) poly(pts,'rgba(226,232,240,.92)',Math.max(1,s*1.4),[Math.max(2,s*3),Math.max(2,s*2.4)]);
  /* 手繪但還沒生效的線（要重整才會真的鋪出來）—— 用亮青色與上面分開。
     ⚠ 擦除筆碰到的那幾條畫成紅色虛線＝「按確定就會消失」（ver -1256）。
     ⚠⚠ **等待確認的那一條也要畫**：它刻意還沒進 `MAP_EDITS`（那才是「生效」），
       但「先套用再問」的前提是**看得到才答得出來** —— 不畫的話按下放開的瞬間
       線就消失了，而下面正在問你要不要留它。地形筆沒有這個問題（HGT 真的改了），

  const lines = (mePend && mePend.k==='edit' && (mePend.e.t==='rail'||mePend.e.t==='road'))

  for(const E of lines){
    if(E.t!=='rail'&&E.t!=='road') continue;
    /* ⚠ 手繪的線也吃橡皮擦（一視同仁）：畫的時候與重整之後才會是同一件事 ——

       ⚠⚠⚠ **已生效的手繪線要畫成「真的路」的顏色**（ver -1259，Ray：「確認以後

         「這一條已經生效」與「這一條還在等你回答」的差別** —— 而後者會擋掉

    const pending = mePend && mePend.k==='edit' && mePend.e===E;
    /* ⚠ 顯示也要帶序號，不然畫面上會比地面多／少一截（`mapEditCut` 靠它判先後）。 */
    const disp=E.pts.slice(); disp.src=MAP_EDITS.indexOf(E);
    const col = pending ? 'rgba(255,226,110,1)'
                        : (E.t==='rail'?'rgba(226,232,240,.92)':'rgba(214,178,92,.85)');
    const w   = pending ? Math.max(2.4,s*3) : (E.t==='rail'?Math.max(1,s*1.4):Math.max(1,s*1.6));
    const dsh = pending ? [Math.max(4,s*5),Math.max(3,s*3)]
                        : (E.t==='rail'?[Math.max(2,s*3),Math.max(2,s*2.4)]:null);
    for(const seg of mapEditCut([disp], extra)) poly(seg, col, w, dsh);

  if(meCur&&(meCur.t==='rail'||meCur.t==='road')&&meCur.pts.length>1)
    poly(meCur.pts,'rgba(255,240,140,.95)',Math.max(1.6,s*2));

  g.font='11px system-ui,sans-serif'; g.textBaseline='middle';
  for(const S of SETTLEMENTS){
    const q=P(S.x,S.y);
    g.fillStyle='#ffd24a'; g.fillRect(q[0]-3,q[1]-3,6,6);
    g.fillStyle='rgba(255,255,255,.92)'; g.fillText(S.n, q[0]+7, q[1]);
  }
  for(const pl of PLACES){
    if(SETTLEMENTS.some(S=>S.n===pl.name)) continue;
    const q=P(pl.x,pl.y);
    g.strokeStyle='#9fd8ff'; g.lineWidth=1.4;
    g.beginPath(); g.arc(q[0],q[1],4,0,7); g.stroke();

     ⚠ 兩者都走大地圖那兩支 glyph（`drawMarkGlyph`／`drawPinGlyph`，鐵律 8），
       只有位置是這裡算的（平面 1:1 的 `P`，不套 `reliefXY`）。
     ⚠ 排在自機**之前**：三者疊在一起時自機要在最上面（那是「我在哪」，
       標記與釘是「我要去哪」）。 */
  if(typeof MAP_MARK!=='undefined' && MAP_MARK){
    const q=P(MAP_MARK.x, MAP_MARK.y);
    drawMarkGlyph(g, q[0], q[1], MAP_MARK.label, performance.now());
  }
  if(typeof MV!=='undefined' && MV && MV.pin){
    const q=P(MV.pin[0], MV.pin[1]);

  }
  /* ── 自機（ver -1311，Ray：「地圖編輯加入船的位置」）──────────────────
     ⚠ 記號走**大地圖那一支** `drawShipMark`，不另畫一個（鐵律 8）。
     ⚠ 位置是**平面 1:1 的地圖像素**（走這裡的 `P`），不套 `reliefXY` ——
       編輯器整頁刻意沒有立體，套了浮雕位移就會與底下那張底圖對不上。
     ⚠ 畫在聚落與地標**之後**、筆刷游標之前：自機要蓋在資料層上（找得到自己），
       但不能蓋住正在畫的那一筆。
     ⚠ 座標讀數用**地圖像素**，與大地圖的「自機 (x,y)」同一套單位 —— 截圖回報時
       兩邊的數字可以直接對。
     ⚠ **畫一次就夠，不會過期**：編輯器只能從大地圖進去，而 `loop()` 第一道
       `if(extPaused || mapOpen)` 就把整幀凍住了（ver -776）—— 船在這裡不可能移動，
       所以不必掛進 `updateMapMe` 每禎重畫。 */
  {
    const mx=cam.x/MAP_SCALE, my=cam.y/MAP_SCALE;
    const q=P(mx,my);
    drawShipMark(g, q[0], q[1], cam.angle);
    const lab='自機 ('+Math.round(mx)+','+Math.round(my)+')';
    const w=g.measureText(lab).width;
    g.fillStyle='rgba(8,7,12,.78)'; g.fillRect(q[0]+17, q[1]-8, w+8, 16);
    g.fillStyle='#ffd98a'; g.fillText(lab, q[0]+21, q[1]);

  if(meBrushAt && meTool!=='pan' && meTool!=='move' && meTool!=='del' &&

    g.beginPath(); g.arc(q[0],q[1], Math.max(2,meBrushR()*s), 0, 7);

}
let meBrushAt=null;
/* 這一筆擦除會吃掉幾個折線節點（0 ＝什麼都沒碰到）。 */
function meEraseCount(E){
  let n=0;
  for(const list of [ROAD_PATHS, RAIL_PATHS])
    for(const pts of list)
      for(const q of pts) if(meLineNear(E,q[0],q[1])) n++;

}
/* ⚠⚠ 擦除的實作**不在這裡**：它現在只是一支普通的筆畫（`t:'erase'`），
   真正做事的是 `mapEditCut()`（見上方「擦除」那一節）—— 折線鋪出去之前先被剪斷。
   ver -1256 那一版是「碰到就把手繪的那一條整條從 `MAP_EDITS` 刪掉」，
   -1257 收掉了：自動產生的路網刪不掉（它不是資料），而同一支筆對兩種線有兩種
   行為是鐵律 8 的病。 */
function meBrushR(){ return +meEl('meSize').value||18; }
function meBrushA(){ return +meEl('meAmp').value||45; }

/* ── 復原 ────────────────────────────────────────────────────────

   ⚠ 記的是「碰到的格子」不是「改到的格子」：水／貼材要跨過 0.5 才寫，
     但復原要能把整個筆刷範圍還原回去。 */
function meSnapStart(){
  meSnapI=[]; meSnapH=[]; meSnapR=[]; meSnapC=[]; meSnapB=[]; meSnapN=0;
}
function meSnapPush(i){
  meSnapI.push(i); meSnapH.push(HGT[i]); meSnapR.push(RIV[i]);
  meSnapC.push(COL[i]); meSnapB.push(BIOME?BIOME[i]:0); meSnapN++;

function meUndoPush(rec){ meUndo.push(rec); if(meUndo.length>MEUNDO_MAX) meUndo.shift(); }
function meDoUndo(){
  if(meBusy()){ meNag(); return; }
  const u=meUndo.pop();
  if(!u){ meFlash('沒有可以復原的步驟'); return; }
  /* ⚠ 復原與「取消」是同一件事，走同一支 `meRevert`（鐵律 8）——
     差別只有：復原要**先把它從 `MAP_EDITS` 拿掉**（它已經生效過了），

  if(u.k==='edit'){ const k=MAP_EDITS.indexOf(u.e); if(k>=0) MAP_EDITS.splice(k,1); }
  meRevert(u); meSave();

function meUndoLabel(u){
  if(u.k==='move')  return u.name+' 搬回 ('+u.from[0]+','+u.from[1]+')';
  if(u.k==='del')   return u.name+' 放回來了';

function meLabel(t){ return {hill:'山',dig:'挖',flat:'平',fix:'自動修正',water:'水',lake:'湖',
  river:'河',mat:'貼材',rail:'鐵路',road:'公路',erase:'擦除'}[t]||t; }
let meFlashT=0;
function meFlash(msg){ meFlashT=performance.now(); meEl('meInfo').textContent=msg; }

/* ── 開關 ──────────────────────────────────────────────────────── */
function openMapEdit(){
  if(!ADMIN||!MAPW) return;

  meBuildBase(); meFit(); meDraw();
  meFlash('筆畫 '+MAP_EDITS.length+' 筆　⚠ 關閉時會重新載入，讓地形重新烘一次');
}
function closeMapEdit(){
  /* ⚠ 還有沒答的那一題就不准關：關閉＝重整，那一筆沒寫進 `MAP_EDITS`

       重整就沒了 —— 不帶的話進一次地圖編輯，S9 那段教學就忘了你是從夏爾村出來的。

       ⚠⚠ **平飛時它其實不會有差別**：`update()` 每幀無條件 `cam.alt=CRUISE_ALT`

         所以「船的位置跟角度」在這一頁就是 **x／y／angle 三個**，不要以為還有第四個。
       （實測：存 512 進去，重整之後量到的是 696.7 —— 那是起飛 tween 正在收斂到 700，
         不是還原失敗。）
     ⚠⚠ **有殘留就用合併不要覆蓋**：那一把鑰匙同時也是打完仗的回程
       （`fromBattle`／`won`／`scripted`／`doneKey`）。正常情況下它在開機那一刻
       就被讀掉清空了，所以這裡讀到東西＝有一筆還沒消化的回程 —— 覆蓋掉
       等於把那一場的勝負記帳吞了。 */
  try{
    let j={}; 
    try{ j=JSON.parse(localStorage.getItem('tivot_flight_ret_v1')||'{}')||{}; }catch(_){ j={}; }
    j.x=cam.x; j.y=cam.y; j.angle=cam.angle; j.alt=cam.alt;
    if(sailedFrom && !j.town) j.town=sailedFrom;
    localStorage.setItem('tivot_flight_ret_v1', JSON.stringify(j));
  }catch(_){}

     是「地形變了但路還在山上」，而那看起來像 bug，其實只是還沒重算。 */
  location.reload();
}

/* ── 工具列 ────────────────────────────────────────────────────── */
function meSetTool(t){
  meTool=t;
  for(const b of document.querySelectorAll('#meBar button[data-tool]'))
    b.classList.toggle('on', b.dataset.tool===t);
  meEl('meMat').classList.toggle('on', t==='mat');
  meEl('meFlatBar').classList.toggle('on', t==='flat');
  if(t==='flat'){
    /* 預設仍是帝都高（ver -1264 定的地面基準）—— 只有**還沒填過**才預填，
       不然每次切回來都會把手打的數字蓋掉。 */
    const inp=meEl('meFlatH'), cap=capitalH();

/* ── 指標 ──────────────────────────────────────────────────────── */
function meStrokeBegin(mx,my){
  /* ⚠⚠ 守門擺在**這裡**不是擺在事件處理器裡（鐵律 8）：起筆的入口只有這一支，
     日後多一條路（鍵盤、腳本、驗收）會自動吃到。事件那邊只負責那句提示。 */
  if(meBusy()){ meNag(); return; }
  if(meTool==='erase'){
    meCur={ t:'erase', r:meBrushR(), pts:[[mx,my]] };
    /* ⚠ 擦除現在也會動陣列（水那一半）⇒ 要開復原帳。
       ⚠⚠ 與自動修正同理，**放開才套用一次**：填回去的值取自「周圍現在長什麼樣」，
         分段套用時後面幾段會讀到前面剛補好的格子 ⇒ 畫的時候與重整之後會不一樣。 */
    meSnapStart(); meDirty=null;
    return;
  }
  if(meTool==='rail'||meTool==='road'){
    meCur={ t:meTool, pts:[[mx,my]] };
    if(meTool==='erase') meCur.r=meBrushR();
    return;
  }
  meCur={ t:meTool, r:meBrushR(), pts:[[mx,my]] };
  /* ⚠⚠ **自動修正與河都是「放開才套用一次」**（見 meApply：兩者的輸入都是
     「周圍／沿線現在長什麼樣」，分段套用時後面幾段會讀到前面剛改過的結果 ⇒
     畫的時候與重整之後不一樣）。所以這裡只開帳、不畫。 */
  if(meTool==='fix'||meTool==='river'){ meSnapStart(); meDirty=null; return; }
  if(meTool==='hill') meCur.a=meBrushA();      // ⚠ 挖不讀力道（固定 DIG_STEP）
  if(meTool==='mat')  meCur.g=meMatG;
  /* 湖：**起筆那一格**的高度就是水面（保持高度，見 meApply）。
     平：**帝都那一格**的高度（Ray 指定的地面基準，見 capitalH）。 */
  if(meTool==='lake')
    meCur.h=HGT[clamp(my|0,0,MAPH-1)*MAPW+clamp(mx|0,0,MAPW-1)];
  /* 平：鏟到**輸入框裡的高度**（ver -1269，Ray：「可直接手動輸入」）。
     ⚠ 空白／打了怪東西就退回帝都高 —— 那是 -1264 定的地面基準，也是預設值。 */
  if(meTool==='flat'){
    const v=parseFloat(meEl('meFlatH').value);
    meCur.h=clamp(isFinite(v)?Math.round(v):capitalH(), 0, PEAK_SCALE);
  }
  meSnapStart(); meDirty=null;
  meStrokeStep(mx,my,true);
}
function meStrokeStep(mx,my,first){
  if(!meCur) return;
  if(meCur.t==='erase'||meCur.t==='rail'||meCur.t==='road'){
    const l=meCur.pts[meCur.pts.length-1];
    /* ⚠ 擦除的取樣要密（半徑的一半）：只記端點的話拖快一點會從路上跳過去，
       中間那一段沒被剪到 —— 畫面上是「擦了但沒斷」。 */
    const step = meCur.t==='erase' ? Math.max(1,(meCur.r||14)/2) : 3;
    if(Math.hypot(mx-l[0],my-l[1])>=step) meCur.pts.push([mx,my]);
    return;
  }
  if(meCur.t==='fix'||meCur.t==='river'){   // 只記路徑，放開才算（同上）
    const l0=meCur.pts[meCur.pts.length-1];
    /* ⚠ 河的取樣要密一點：中心線的形狀就是河的形狀，記太疏會變成折線。 */
    const st = meCur.t==='river' ? 2 : Math.max(1,(meCur.r||18)/3);
    if(Math.hypot(mx-l0[0],my-l0[1])>=st) meCur.pts.push([mx,my]);
    return;
  }
  const l=meCur.pts[meCur.pts.length-1];
  const seg = first ? [[mx,my]] : [l,[mx,my]];
  if(!first){
    if(Math.hypot(mx-l[0],my-l[1])<0.7) return;
    meCur.pts.push([mx,my]);
  }
  /* ⚠ 編輯器沒有 `raw`（那是 loadWorld 的區域變數）—— 所以這裡不更新坡度，
     畫出來的山在**重整之後**才長出法線。說明列已經寫了。 */
  const d=meApply(meCur, seg, null, meSnapPush);
  if(d){
    mePaint(d);
    meDirty = meDirty ? { x0:Math.min(meDirty.x0,d.x0), y0:Math.min(meDirty.y0,d.y0),
                          x1:Math.max(meDirty.x1,d.x1), y1:Math.max(meDirty.y1,d.y1) } : d;
  }
}
function meStrokeEnd(){
  if(!meCur) return;
  const E=meCur; meCur=null;
  if(E.t==='erase'){
    /* ① 折線：只是數一數會剪到幾個節點（真的剪是在鋪之前，`mapEditCut`）。
       ⚠ 判斷走**同一支** `meLineNear`（畫面上剪不剪也是它，鐵律 7）。 */
    /* ⚠⚠⚠ **先簡化再套用**（ver -1264 修）：放開才套用的那幾支筆（擦除／自動修正／
       河）如果先用**密的**路徑套用、之後才把**簡化過的**存進去，重放讀到的就是
       另一條線 ⇒ 畫的時候與重整之後不一樣（實測河差 7）。
       邊拖邊套的那幾支做不到這件事（簡化不了還沒發生的點），那是 -1254 記著的
       ≤2 單位差；但這三支可以做到**完全一樣**，就該做到。 */
    E.pts=meSimplify(E.pts, Math.max(0.5,(E.r||14)/6));
    const nLine=meEraseCount(E);
    /* ② 水：這一半會真的改陣列，而且整條一次算完（與重放同一條路，鐵律 8）。 */
    meEraseWet=0;
    const d=meApply(E, E.pts, null, meSnapPush);
    if(d){ mePaint(d); meDirty=d; }
    const nWet=meEraseWet;
    meCovClear(meDirty); meDirty=null;
    if(!nLine && !nWet){
      meSnapI=null;
      meFlash('這一筆沒有擦到任何公路、鐵路或水');
      meDraw(); return;
    }
    meAsk({ k:'edit', e:E, i:meSnapI, h:meSnapH, r:meSnapR, c:meSnapC, b:meSnapB,
            d:meStrokeBox(E) },
          '擦除　大小 '+(E.r||14)+
          (nLine?('　軌道／路面 '+nLine+' 節'):'')+
          (nWet?('　水面 '+nWet+' 格'):''));
    meSnapI=null;
    meDraw(); return;
  }
  if(E.t==='rail'||E.t==='road'){
    if(E.pts.length<2){ meDraw(); return; }
    E.pts=meSimplify(E.pts, 2);
    /* ⚠ 手繪的線**沒有動到任何陣列**（見 mapEditPaths）—— 取消就是丟掉它，
       沒有東西要還原，所以不帶 snapshot。
       ⚠⚠ **不要在這裡寫「重整後才會真的鋪出來」**（ver -1258 拿掉，Ray 問
         「公路三點重整後才會真的鋪出來是什麼意思」）：那句話講的是一個
         **玩家看不到的中間狀態** —— 關閉編輯器本來就會重新載入，所以不存在
         「畫好了、但還沒鋪」的那一刻可以被看見。它只會讓人以為還要多做什麼。
         改印**長度**：那才是畫線時真的需要的回饋（這一條有多長）。 */
    let L=0; for(let k=1;k<E.pts.length;k++)
      L+=Math.hypot(E.pts[k][0]-E.pts[k-1][0], E.pts[k][1]-E.pts[k-1][1]);
    meAsk({ k:'edit', e:E },
          meLabel(E.t)+'　'+E.pts.length+' 點・全長 '+Math.round(L*MAP_SCALE)+' 單位');
    meDraw(); return;
  }
  if(E.t==='fix'||E.t==='river'){
    /* ⚠⚠⚠ **先簡化再套用**（見擦除那一段的說明）：存進去的是哪一條線，
       套用的就要是哪一條線，否則重整之後會變樣。 */
    E.pts=meSimplify(E.pts, Math.max(0.5,(E.r||18)/8));
    /* 整條一次算完 —— 與 `applyMapEdits` 重放時走的是同一條路（鐵律 8）。 */
    const d=meApply(E, E.pts, null, meSnapPush);
    if(d){ mePaint(d); meDirty=d; }
  }
  meCovClear(meDirty); meDirty=null;
  if(!meSnapI||!meSnapI.length){ meDraw(); return; }
  const box=meStrokeBox(E);                 // ⚠ 要在簡化**之前**量：還原的髒區照原線算才蓋得滿
  if(E.t!=='fix'&&E.t!=='river')            // 那兩支上面已經簡化過了
    E.pts=meSimplify(E.pts, Math.max(0.5,(E.r||18)/8));
  meAsk({ k:'edit', e:E, i:meSnapI, h:meSnapH, r:meSnapR, c:meSnapC, b:meSnapB, d:box },
        meLabel(E.t)+'　大小 '+(E.r||0)+
        (E.a!=null?('　力道 '+E.a):'')+
        (E.t==='dig'?('　深 '+DIG_STEP):'')+
        (E.h!=null?((E.t==='lake'?'　水面 ':'　鏟到 ')+E.h
                    +(E.t==='flat'&&E.h===capitalH()?'（帝都高）':'')):'')+
        (E.g!=null?('　'+((MAT_PALETTE.find(m=>m.g===E.g)||{}).n||'')):'')+
        '　'+E.pts.length+' 點　共 '+(meSnapI.length)+' 格');
  meSnapI=null;
  meDraw();
}

/* ── 每一次改變的確認（ver -1256）──────────────────────────────────
   Ray：「每次改變都要確認才生效」。`rec` 就是**復原用的那一筆紀錄** ——
   兩者需要的資訊一模一樣（要還原什麼），所以不另存一份（鐵律 7）：
   按「確定」就把它推進 `MAP_EDITS`＋存檔＋放進復原堆；
   按「取消」就當場走一次復原的還原路徑。 */
function meBusy(){ return !!mePend; }
function meAsk(rec, text){
  mePend=rec;
  meEl('meAskT').textContent=text;
  meEl('meAsk').classList.add('on');
  meEl('mapEdit').classList.add('asking');
}
function meAskClose(){ mePend=null;
  const b=meEl('meAsk'); b.classList.remove('on'); b.classList.remove('nag');
  meEl('mapEdit').classList.remove('asking'); }
/* 有人想做別的事但這一題還沒答 —— 讓確認列閃一下（重播動畫要先拔 class 再逼一次 reflow）。 */
function meNag(){
  const b=meEl('meAsk'); if(!b) return;
  b.classList.remove('nag'); void b.offsetWidth; b.classList.add('nag');
  meFlash('這一筆還沒確認：按「確定」留下，或「取消」丟掉（Enter／Esc 也行）');
}
function meAskYes(){
  const u=mePend; if(!u) return;
  meAskClose();
  if(u.k==='del'){
    /* ⚠ 順序：先寫帳本再動陣列 —— 反過來的話中途出錯會變成
       「畫面上沒了、重整又回來」，而那種不一致最難查。 */
    settleDelWrite(u.name,true);
    settleOvWrite(u.name,null);            // 它不在了，位置覆寫沒有意義
    Object.assign(u, settleDelApply(u.name));
    try{ buildCityMask(); }catch(_){}
    meUndoPush(u);
    meFlash(u.name+' 已刪除\n⚠ 道路／鐵路／整地要**重整**才會跟著消失；定稿請從 SETTLEMENTS／PLACES 刪掉再 settleDelClear()');
    console.log('刪城：'+u.name+'　定稿請從 SETTLEMENTS／PLACES 真的刪掉，再 settleDelClear()');
    drawMap(); meDraw(); return;
  }
  if(u.k==='move'){
    settleOvWrite(u.name,[u.x,u.y]);
    meUndoPush(u);
    meFlash(u.name+' → ('+u.x+','+u.y+')　已生效\n⚠ 定稿請寫回 SETTLEMENTS／build_city.py 再 settleDragClear()');
    console.log('移城落定：'+u.name+' ('+u.x+','+u.y+')　定稿請寫回 SETTLEMENTS／build_city.py，再 settleDragClear()');
  }else{
    MAP_EDITS.push(u.e); meUndoPush(u); meSave();
    meFlash('已生效：'+meLabel(u.e.t)+'（共 '+MAP_EDITS.length+' 筆）');
  }
  meDraw();
}
function meAskNo(){
  const u=mePend; if(!u) return;
  meAskClose();
  meRevert(u);
  meFlash('已取消'+(u.k==='move'?('：'+u.name+' 搬回 ('+u.from[0]+','+u.from[1]+')')
                  :(u.k==='del'?('：'+u.name+' 留著'):'，畫面已還原')));
  meDraw();
}
/* 還原一筆（取消與復原**共用**，鐵律 8）。 */
function meRevert(u){
  if(u.k==='del'){
    /* ⚠ 取消與復原共用這一支，但兩者到這裡的狀態不同：
       **取消**時還沒刪（`meAskYes` 才動手）⇒ `u.s`／`u.p` 是空的，什麼都不必做；
       **復原**時已經刪了 ⇒ 把物件放回原索引、帳本拿掉那一筆。 */
    if(u.s||u.p){
      settleDelRestore(u);
      settleDelWrite(u.name,false);
      settleOvWrite(u.name, u.prevOv);
      try{ buildCityMask(); }catch(_){}
      drawMap();
    }
    return;
  }
  if(u.k==='move'){
    const tgt=buildSettlements().find(z=>z.name===u.name) ||
              { name:u.name, _place:PLACES.find(p=>p.name===u.name) };
    moveSettlement(tgt, u.from[0], u.from[1]);
    settleOvWrite(u.name, u.prevOv);
    try{ buildCityMask(); }catch(_){}
    return;
  }
  if(u.i){
    for(let n=0;n<u.i.length;n++){
      const i=u.i[n];
      HGT[i]=u.h[n]; RIV[i]=u.r[n]; COL[i]=u.c[n];
      if(BIOME) BIOME[i]=u.b[n];
    }
    mePaint(u.d);
  }
}
/* 折線簡化（Douglas–Peucker）。拖曳每 0.7 地圖像素就記一點，一條 200px 的筆畫
   會留下近三百個點 —— 存進 localStorage 與匯出到程式裡都難看，而那些點**沒有
   資訊量**：筆刷半徑本來就比取樣間距大一個數量級。
   ⚠ 容差取**筆刷半徑的八分之一**（最少 0.5）：那遠小於一個筆刷，重放出來的
     山脊與畫的時候看到的差不到一格。容差再大就會開始削掉真的轉折。 */
function meSimplify(pts, tol){
  if(pts.length<3) return pts;
  const keep=new Uint8Array(pts.length); keep[0]=keep[pts.length-1]=1;
  const st=[[0,pts.length-1]];
  while(st.length){
    const [a,b]=st.pop(); if(b<=a+1) continue;
    const ax=pts[a][0], ay=pts[a][1], bx=pts[b][0], by=pts[b][1];
    const dx=bx-ax, dy=by-ay, L=Math.hypot(dx,dy)||1;
    let bi=-1, bd=tol;
    for(let k=a+1;k<b;k++){
      const d=Math.abs((pts[k][0]-ax)*dy-(pts[k][1]-ay)*dx)/L;
      if(d>bd){ bd=d; bi=k; }
    }
    if(bi>0){ keep[bi]=1; st.push([a,bi],[bi,b]); }
  }
  const out=[]; for(let k=0;k<pts.length;k++) if(keep[k]) out.push(pts[k]);
  return out;
}
function meStrokeBox(E){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9; const r=(E.r||18)+2;
  for(const q of E.pts){ if(q[0]-r<x0)x0=q[0]-r; if(q[0]+r>x1)x1=q[0]+r;
                         if(q[1]-r<y0)y0=q[1]-r; if(q[1]+r>y1)y1=q[1]+r; }
  return { x0:Math.max(0,x0|0), y0:Math.max(0,y0|0),
           x1:Math.min(MAPW-1,Math.ceil(x1)), y1:Math.min(MAPH-1,Math.ceil(y1)) };
}


/* ── 地圖編輯：事件綁定（ver -1254）──────────────────────────────── */
(function(){

  /* ⚠⚠ **中鍵按住＝平移**（ver -1256，Ray 指定）：不必切回「平移」筆，
     畫到一半要挪畫面就按中鍵拖。放開就回到原本那支筆（`meMid` 只活在按著的期間）。

/* ══ 航行的音 ══
   三軓：音樂（bgm_flight）定音量一直播；航行／停船的**環境音**
   （se_flight_sail_loop／se_flight_idle_loop）依速度交叉，**疊在音樂之上**。
   ⚠ 舊版把那兩支環境音當成「兩首 BGM」在輮播 —— 換上真正的音樂之後

   前一輪同時淡出 —— 兩條音軌重疊那 5 秒。所以每首各準備兩個元素輪流當班。
   ⚠ 把淡入淡出烘進音檔也可以，但那樣兩輪之間仍然是「淡出完才淡入」，
     中間會空掉；重疊才是消除斷感的關鍵，跟音檔怎麼做無關。

   從首頁點「試飛」是換頁，手勢不會延續 → 先試播，被擋就掛一次性的

/* 音量：與主遊戲同一套（ver -441 起是「逐支拉平到 −20 LUFS ＋ 分層比例」，
   見上面 `fileVol` 那一段）。⚠ 兩支環境音的母帶差 8.8 dB（航行 −31.8、

const AMB_SAIL = fileVol('se_flight_sail_loop');         // 撞上限（母帶 −31.8）

function makeLoop(src, xf){
  const XFADE=xf||5.0;
  const a=[new Audio(src), new Audio(src)];
  a.forEach(x=>{ x.preload='auto'; x.volume=0; x.loop=false; });
  let cur=0, on=false;
  a.forEach((x,i)=>x.addEventListener('ended',()=>{
    x.pause(); x.currentTime=0; if(cur===i) cur=1-i;    // 交棒給已經在播的那個
  }));
  return {
    /* ⚠ on 只有在 play() **真的成功**時才設 true。
       先前不管成敗都設 true，於是開場那次（一定會被自動播放政策擋掉）
       也算「已播放」→ 補播的監聽器立刻被移除，之後再也不會重試，
       結果就是整趟飛行完全沒有聲音。 */
    start(){
      if(on) return;

         有時會無音樂音效」）。輪播若正輪到 a[1] 時被 stop（戰鬥／收頁），寫死 a[0]
         的話：tick 盯著暫停中的 a[cur]=a[1] 調音量、真正在播的 a[0] 音量永遠停在
         尾端淡出的 0 —— 整段靜音。「有時」＝取決於停下當刻輪到哪一個（約每圈輪替）。 */
      const A=a[cur];
      const p=A.play();
      if(p && p.then) p.then(()=>{
        on=true;
        /* 順手預熱另一個元素：這是**確定播得動之後**才做，不會跟 start()
           搶同一個元素（先前在建構時就預熱，它的 pause() 有機會晚於
           start() 的 play() 執行，反而把剛起播的曲子按停）。 */
        const B=a[1-cur], q=B.play();
        if(q && q.then) q.then(()=>{ B.pause(); B.currentTime=0; }).catch(()=>{});
      }).catch(()=>{});
      else on=true;
    },
    /* ⚠⚠ **停下來要把音量一起歸零**（ver -1468）：`stop()` 只 `pause()` 的話，
       下一次 `start()` 是從**上一段留下來的音量**接回去的 —— 而 `tick` 要等
       下一幀才把它調對，中間那一格就是「突然全音量冒出來一聲」。
       正在播的音量本來就每幀由 `tick` 重設，歸零沒有任何副作用。 */
    stop(){ a.forEach(x=>{x.pause(); x.volume=0;}); on=false; },
    playing(){ return on; },
    tick(gain){
      if(!on) return;
      const A=a[cur], B=a[1-cur], d=A.duration;
      if(!d||!isFinite(d)){ A.volume=gain; return; }
      const t=A.currentTime;
      let va=1;
      if(t>d-XFADE){                       // 尾端 XF 秒：A 淡出、B 同時淡入
        va=clamp((d-t)/XFADE,0,1);
        if(B.paused){ B.currentTime=0; const p=B.play(); if(p) p.catch(()=>{}); }
        B.volume=(1-va)*gain;
      }
      A.volume=va*gain;
    }
  };

function gullSndTarget(){
  if(!flock) return 0;
  const d=Math.hypot(flock.x-cam.x, flock.y-cam.y, (flock.alt||cam.alt)-cam.alt);
  const t=clamp((GULL_SND_FAR-d)/(GULL_SND_FAR-GULL_SND_NEAR),0,1);

/* 目標音量（0~1）：最近那一列在跑的火車有多近。 */
function trainSndTarget(){
  let best=Infinity;
  for(const T of TRAINS){
    if(T.wait>0) continue;                     // 停在站裡的車不出聲（與畫的判斷一致）
    const q=trainAt(T,T.s);
    if(!q) continue;
    const d=Math.hypot(q.x*MAP_SCALE-cam.x, q.y*MAP_SCALE-cam.y, cam.alt-q.h);
    if(d<best) best=d;
  }
  if(!isFinite(best)) return 0;
  const t=clamp((TRAIN_SND_FAR-best)/(TRAIN_SND_FAR-TRAIN_SND_NEAR),0,1);
  return t*t*(3-2*t);                          // smoothstep：兩頭都不會突然起落
}

/* ── 雲團（3D 定位，飛行時錯身而過）───────────────────────────── */
const PUFFS=[];
function initPuffs(){
  _s=5150;
  for(let i=0;i<48;i++) PUFFS.push({
    x:cam.x+(rnd()-0.5)*1500, y:cam.y+(rnd()-0.5)*1500,
    h:CLOUD_H+180+rnd()*760, r:90+rnd()*260,
    a:0.18+rnd()*0.32, seed:rnd()
  });
}
function recyclePuffs(){
  const fx=-Math.sin(cam.angle), fy=-Math.cos(cam.angle);
  PUFFS.forEach(p=>{
    const dx=p.x-cam.x, dy=p.y-cam.y;
    const z=dx*fx+dy*fy;
    if(z<-140 || Math.hypot(dx,dy)>1250){
      const side=(rnd()-0.5)*1100, dist=520+rnd()*560;
      p.x=cam.x+fx*dist-fy*side; p.y=cam.y+fy*dist+fx*side;
      p.h=CLOUD_H+180+rnd()*760; p.r=90+rnd()*260;
      p.a=0.18+rnd()*0.32; p.seed=rnd();
    }
  });
}

/* ── 日月 ───────────────────────────────────────────────────────── */
function sky(){
  const t=clock.minutes/1440;
  const el=Math.sin((t-0.25)*Math.PI*2);
  const az=(t-0.25)*Math.PI*2;
  return {t,el,az,day:clamp(el*1.5+0.5,0,1),dusk:clamp(1-Math.abs(el)*3.2,0,1)};
}
function skyColors(S){
  // VP1 風：天頂淡藍、地平線近乎灰白（霧色＝地平線色，遠景才會洗成同一片）
  // ⚠ 夜色抬高：銀月照著，天不會黑到 [12,15,30]。地平線更要亮，
  //   因為霧色＝地平線色，壓太暗遠景會整片沉成黑幕、看不出地形輪廓。
  const nightTop=[30,37,60],  nightHz=[96,105,133];
  const dayTop  =[96,126,164],dayHz  =[214,222,230];
  /* ⚠ duskHz 同時是**霧色**（見 render 的 fr/fg/fb）→ 它決定整片遠景的底色。
     176 的綠配 142 的藍是偏粉的橘；抬到 198 就落在金黃。 */
  const duskTop =[58,50,96],  duskHz =[230,198,150];
  const top=[0,0,0],hz=[0,0,0];
  for(let i=0;i<3;i++){
    top[i]=lerp(nightTop[i],dayTop[i],S.day);
    hz[i] =lerp(nightHz[i], dayHz[i], S.day);
    top[i]=lerp(top[i],duskTop[i],S.dusk*0.72);
    hz[i] =lerp(hz[i], duskHz[i], S.dusk*0.80);
  }
  return {top,hz};
}

     探索教學前玩家不可操控船隻，前後左右都不可」）══════════════════════
     `s9On` 的守門本來**只擋在手勢那一條**（`pointerdown` 的 `only` 判斷），
     而**鍵盤（WASD／方向鍵）走的是另一條路**、直接餵進這裡的 `f`/`r`
     —— 於是教學期間前後左右照樣開得動。
     ⚠ 這正是這一行的註解早就寫過的那件事：「擋在**算操作向量這一處**，
       擋在 pointerdown 的話鍵盤那條會漏」—— `s9Ride` 做對了，`s9On` 沒跟上。
     ⚠ 要教的那兩個動作不受影響：Sturm 的推進是下面 `sturmAutoUntil` 那一段
       （排在這一行之後）給的，感應根本不移動船。 */
  if(s9Ride || s9On){ f=0; r=0; held=false; }
  /* 發動後自動前進一秒：把油門推滿。⚠ 要**同時**把 held 打開 —— 油門的目標值
     是 `held ? f*MAX_SPD : 0`，只給 f 而 held 是 false 的話目標仍是 0，
     船一動也不動。 */
  if(now<sturmAutoUntil){ f=1; held=true; }
  /* ══ 觸牆自動轉舵掉頭 ══
     ⚠ 作法是**把舵量注入 r**，不是直接改 cam.angle。因為 r 一路餵給既有的
       轉向、側傾(bank)、舵輪旋轉 —— 注入舵量的話那三件事自動全對；直接改
       航向的話船會憑空平移轉向，舵輪還停在原位，一眼就假。
     ⚠ 是**混入**不是覆蓋：wallAmt 隨深入程度由 0 漸增到 1，接管是漸進的，
       玩家不會覺得舵突然被搶走。
     ⚠ 目標方向取「四邊各自的內推向量加權和」，不是「指向地圖中心」——
       指向中心的話在角落會轉一個大彎，而且沿著邊界平飛時也會被硬掰回去。 */
  const wall=wallSteer(cam.x/MAP_SCALE, cam.y/MAP_SCALE, cam.angle);
  if(wall.latched) r = wall.rudder;      // 打滿舵、直接接管，不與玩家的舵混合
  /* 禁航區的自動掉頭（ver -1137）：同樣**直接接管**舵量 —— 兩道牆的手感一致。
     ⚠ 排在 `wallSteer` 之後：真的同時貼到世界邊緣與國界時，讓禁航這一邊贏
       （它有明確的目標航向，邊緣那一條只是「往裡推」）。 */
  const nfR = noflySteer(cam.angle);
  if(nfR) r = nfR;

  rudder=r;
  // 舵輪：角速度 ∝ 舵量。放手就停在當下角度 —— 實體舵輪本來就不會自己回正
  wheelAng+=clamp(r,-1,1)*WHEEL_SPIN*dt;

  /* 轉向：舵量 → 角速度，**成比例**。
     ⚠ 原本是 clamp(atan2(r,f), ±TURN_RATE*dt)：TURN_RATE*dt 只有 0.018 弧度，
       而 r 只要 0.02 算出來的角度就超過它 —— 等於任何橫拉都直接夾到滿舵。
       沒有中間值就沒辦法微調，這才是「很難對準目標前進」的真正原因。
       改成 r 直接當舵量：輕推慢慢修、大拉才急轉。
       單手方案更依賴這件事 —— 縱向拉油門時橫向必定帶點晃動，
       配上 STEER_DEAD 的死區，那些晃動才不會變成蛇行。
     ⚠ 門檻用「真的在動」而不是「有前進意圖」：放手後船還在滑行，
       這時仍該轉得動；反過來停著就不該原地打轉。 */
  /* 原地迴轉：把拖曳「往前推」（f<0）＝主動停住，此時橫向拖曳直接轉船身。
     ⚠ 單純停著不該自轉（放著也會亂轉就不對了），但「往前推」是明確的
       「我要停下來調頭」意圖，跟放手滑行是兩回事，所以只認前推。
       迴轉率由**推的深度**決定（見 SPIN_EFF／SPIN_EFF_MAX）：輕推是慢慢挪，
       推到底是全推力甩頭，比巡航滿舵還快一點。 */
  let turned=0;
  const mov=Math.abs(cam.speed)/MAX_SPD;
  const spin=held && f<-0.15;
  /* 推得越深轉得越快：門檻處 SPIN_EFF、推到底 SPIN_EFF_MAX。 */
  const spinEff=spin
      ? SPIN_EFF+(SPIN_EFF_MAX-SPIN_EFF)*clamp((-f-0.15)/0.85,0,1)
      : 0;
  /* ⚠ 自動掉頭時舵效直接給滿：空氣牆把速度吃掉了，而「慢速時舵不吃水」會讓
     自動轉舵完全轉不動 —— 貼在牆上動彈不得，那正是最糟的手感。
     「全速轉舵一次到位」也就是這個 1 的意思：用得到的最大角速度轉完。 */
  /* ⚠ 禁航掉頭給 `NOFLY_TURN_MUL`（>1）：`eff` 本來就是乘在 `TURN_RATE*dt` 上的
     舵效係數，要「快速轉」在這裡放大就好，不必另寫一條轉向公式（鐵律 7）。 */
  const eff=Math.max(spinEff, clamp(mov*2.2,0,1), wall.latched?1:0, nfR?NOFLY_TURN_MUL:0);
  if(Math.abs(r)>0.015 && eff>0.001){
    const step=clamp(r,-1,1)*TURN_RATE*dt*eff;
    cam.angle-=step;                                // 角度遞減＝向右偏（見 compass 換算）
    turned=step;
  }
  /* 偏艏：由「這一幀轉了多少」推目標角度，再收斂跟隨 → 入彎慢慢壓、出彎慢慢回。
     ⚠ 這裡是**向心**（船艏指進彎道內側）。物理上大船轉彎是艉部甩出去、
       艏部切進去，本來就該向心；先前寫成離心，玩家看到的是「往左拉、船頭
       卻朝右」，讀不出自己在轉哪邊。飛空艇更該像飛機一樣壓進彎道。 */
  const bankTarget=clamp(turned/(TURN_RATE*16.67)*BANK_MAX, -BANK_MAX, BANK_MAX);
  cam.bank+=(bankTarget-cam.bank)*(1-Math.pow(1-BANK_EASE, dt/16.67));

  /* 油門：往後拉的幅度＝速度。放開→滑行減速停住，不自動巡航。
     ⚠ 用「每幀比率 → 依 dt 換算」的指數逼近，不能直接乘 dt：
       直接乘會讓係數遠大於 1，變成一兩幀就到位（放開瞬間急煞，沒有慣性）。
     往前推（f<0）＝主動煞車：收斂率改用 ACCEL，那是螺旋槳實際在反轉出力，
     本來就該比放開手的惰行有力，否則「往前推」按下去跟放手沒兩樣。 */
  const target = held ? clamp(f,0,1)*MAX_SPD : 0;
  const rate = (held && f<-0.15) ? ACCEL
             : (target>cam.speed) ? ACCEL : BRAKE;
  cam.speed += (target-cam.speed)*(1-Math.pow(1-rate, dt/16.67));
  if(cam.speed<0.004) cam.speed=0;

  cam.alt=CRUISE_ALT;
  const fx=-Math.sin(cam.angle), fy=-Math.cos(cam.angle);
  /* ⚠ Sturm 的倍率跟 SPD_BOOST 一樣套在**位移**上，不是套在 cam.speed：
     cam.speed 同時驅動速度錶、螺旋槳、環境音與側傾，改它會讓那些一起失真。 */
  let mv=cam.speed*dt*0.06*SPD_BOOST*(now<sturmUntil?STURM_MULT:1);
  /* 邊界的空氣牆：向外的位移被吃掉，而且**速度也跟著掉** ——
     只擋位移不掉速度的話，速度計還滿著、船卻不動，那看起來像卡住了。 */
  /* ⚠⚠ 遭遇交棒等待期間**船也要停**（ver -387）：敵人一進 engage 就停住了，
     但船沒停 —— 那 1.1 秒的等待夠船走掉近 400 單位，比 engage 半徑還遠，
     於是玩家看到的是「牠貼到船上了才跳頁」。停的是**位移**不是 cam.speed：
     速度錶／螺旋槳／尾流照樣讀 cam.speed，改它會讓那些儀表一起說謊
     （同 SPD_BOOST／Sturm 的作法）。
     ⚠ 只在**真的要進戰鬥**時停（`battleGoing`）；免戰模式下遭遇照演但不跳頁，
       那時把船停住只會在畫地圖時擋路。 */
  if(battleGoing) mv=0;
  const ek=edgeDamp(cam.x/MAP_SCALE, cam.y/MAP_SCALE, fx, fy);
  if(ek<1){
    mv*=ek;
    const bleed=1-Math.pow(1-0.10, dt/16.67);      // 每 60fps 幀約追上 10%
    cam.speed += (cam.speed*ek - cam.speed)*bleed;
  }
  cam.x+=fx*mv; cam.y+=fy*mv;
  noflyCheck(now);        // 禁航區的空氣牆（ver -1136）：撞到就退回去並掉頭
  /* 雲海的擴張跟著**實際位移**走（ver -1080）—— 這裡是船真的移動的唯一一行。 */
  skyZoom += mv/SKY_ZOOM_PER;
  clock.dist+=Math.abs(mv);              // 後退也是航行距離，不該倒扣
  /* ⚠⚠ **航行本身不再推進時間**（ver -435（-893 前用詞），Ray 定案）。以前是
     `clock.minutes += |mv| * 0.10` —— 時間跟著「走了多少世界單位」跑，
     於是繞圈子也會天黑，而且那個時鐘與主遊戲的完全是兩回事。
     現在時間只在**事件**上走：一場戰鬥 1 小時、進一個地方 1 小時
     （見 `clockAdvance` 的兩個呼叫點），日期與時刻由 `syncClock()` 從主時鐘投影。 */
  recyclePuffs();

  document.getElementById('dist').textContent=Math.round(clock.dist);
  const deg=((-cam.angle*180/Math.PI)+1080)%360;
  document.getElementById('compass').textContent=['北','東北','東','東南','南','西南','西','西北'][Math.round(deg/45)%8];
  senseUpdate(now);           // 長按船身的感應演出
  prefetchCityArt();          // 城的全解析插畫：飛進 PREFETCH_R 就開始載
  updateEnemy(dt,now);
  updateFlock(dt,now);

  // 地標名稱已改由 3D 內的名牌呈現（drawPlaces），這裡不再重複彈 DOM 提示

  // 船的視覺狀態（甩帆/螺旋槳/浮動）必須在 cam.angle 定案後才算，否則角速度差一幀
  updateShipVisual(dt,now);
}

   地形成本與地圖複雜度無關、3D 物件與數量脫鉤 —— 試作實測 841 個 instanced
   立方體的成本是 **−0.095ms（量不到）**，而 CPU 上**一座**遺蹟就是 950 次 fill
   ＝ 3.4ms（ver -1198／-1199）。

     會做邊緣抬升、城的整地、河道與水位（那十處寫入全在載入階段）。
     用原圖的話海岸線、城的地基、河都會對不上。

   ⚠ Stage 1a 的範圍：地形（雙線性高度＋顏色）、雲海、霧、坡度打光、VP1 分級、
     深度輸出。**還沒有**：地貌貼圖層（BIOME／鐵路／道路／屋頂）、崖面岩層、

     不是壞掉；那些是 Stage 1b。
