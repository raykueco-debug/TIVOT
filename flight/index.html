    const dydz=(-(cam.alt-o.s.gh)/(o.z*o.z)+curvAt(0))*scaleH*syk;
    const tilt=clamp(Math.abs(dydz)/sc,0.06,1.10);
    /* ── 手繪平面圖：網格投影 ───────────────────────────────────
       把平面圖切成 N×N 格，每格各自投影 —— 用一堆小的仿射變換去逼近
       1/z 的非線性投影。這是用 canvas 2D 貼地面貼圖的標準作法。

       ⚠ 為什麼不能只切橫條（我的第一版）：條是沿圖自己的 v 軸切的，
         但平面圖是轉過角度的（planRot），**等 v 線不是等深度線**。
         實測同一條的兩端深度差到 1658 vs 544，一個仿射矩陣根本吃不下，
         畫出來是滿畫面的斜向拖曳。二維切分才與朝向無關。
       ⚠ 每格取三個角算矩陣（仿射只能表達平行四邊形），第四角的誤差
         在一格之內可以忽略；格子越多誤差越小。
       ⚠ 格距隨深度調（見下方 walk）：遠處的城只有幾十像素，切 40×40 是純浪費。
       ⚠ 由遠而近畫：近的要蓋住遠的。深度對 (jx,jy) 是仿射的，所以這件事
         只是兩個掃描方向，不必排序（見下方的 jx0/jy0）。
       ⚠ 相鄰格的來源矩形多取 0.6px、目的地也多畫一點：不重疊會露出格線。 */
    const planImg=o.s.plan?cityPlanArt[o.s.plan]:null;
    if(planImg){
      const hw=o.s.planW*0.5, hh=hw*planImg.height/planImg.width;
      const ca=Math.cos(o.s.planRot), sa=Math.sin(o.s.planRot);
      /* ── 格距依深度分配（不是均勻切）─────────────────────────
         一格若在螢幕上還有幾十像素，仿射逼近的誤差就會在格邊裂開
         （相鄰格各用自己的三個角算矩陣，第四角對不起來）。
         仿射逼近的誤差看的是「一格橫跨多少深度比例」，所以格子該在**螢幕上**
         等大，而不是在圖上等大。均勻切的話格距要遷就最近的那一排，遠處那半張
         圖就陪著一起切細 —— 實測近距離 1600 格裡真正畫出來的只有 500 格上下，
         其餘不是在畫面外就是在身後，而遠處那些畫出來的格子每格只有一兩像素。

         深度對平面座標 (u,v) 是**仿射**的：
           z(u,v) = zc + A·u + B·v，A＝hw·(−ca·sinp − sa·cosp)、B＝hh·(sa·sinp − ca·cosp)
         而一格投影後的緩衝像素寬 ≈ Δu·hw·(W/2z)·pk。要它等於 T 個像素就是
           Δu = 2T·z /(hw·W·pk)  —— 步長正比於該處的深度，z 大的地方自動跳大格。
         ⚠ 步數要有上限（近處 z→0 時步長跟著→0），作法見下方 walk。 */
      /* 每格目標大小（低解析緩衝的像素）。舊版是「城心那個深度 9 像素」，
         近處的格子實際上遠比 9 大；現在是**每一格都**約這麼大，所以同樣的
         數字會切出更多格。11 是與舊版畫面比對後取的：近景比舊版細、
         中景略粗一點看不出來，格數少一半。 */
      const CELL_PX=Q().cell;
      const N_MAX=Q().nmax;                         // 單軸格數上限（近距離會頂到）
      const pkq=clamp(BW/W,0.15,1);
      const zc=(o.s.mx*MAP_SCALE-cam.x)*(-sinp)+(o.s.my*MAP_SCALE-cam.y)*(-cosp);
      const gradU=hw*(-ca*sinp - sa*cosp), gradV=hh*(sa*sinp - ca*cosp);
      /* 沿一軸走出格線：從 −1 走到 +1，步長 ∝ 當地深度。回傳格數。

         ⚠ 步數必須有上限（貼著城飛時近端 z→0，步長跟著→0，格數無底洞），
           但**上限不能靠「走不完就把剩下的併成一格」**——那一格會橫跨整片深度，
           仿射矩陣被拉成放射狀，畫面上就是「城被吸走」的拖曳。ver -171 犯過這個錯。
           正解是先算出「走完全程要幾步」再回頭定步長：
             步數 M = ∫ du/(K·z_eff(u))，z_eff＝max(z,60)（身後的部分夾住）
           所以 K = I/N_MAX，I 是那個積分。z 對 u 是線性的，積分有解析解，
           但夾制段讓它分段——直接數值積分 64 段更短且不會寫錯，成本可以忽略。 */
      const walk=(out,grad,half)=>{
        const SEG=64;
        let I=0;
        for(let i=0;i<SEG;i++){
          const u=-1+2*(i+0.5)/SEG, z=zc+grad*u;
          I+=(2/SEG)/(z>CITY_ZNEAR?z:CITY_ZNEAR);
        }
        let K=2*CELL_PX/Math.max(1e-6,half*W*pkq);
        const Kfit=I/N_MAX;
        if(K<Kfit) K=Kfit;
        let u=-1, k=0; out[0]=-1;
        const cap=N_MAX+4;                         // 數值積分的餘量，正常走不到
        while(u<1 && k<cap){
          const z=zc+grad*u;
          u+=K*(z>CITY_ZNEAR?z:CITY_ZNEAR); k++;
          out[k]=u<1?u:1;
        }
        if(out[k]<1){ k++; out[k]=1; }
        return k;
      };
      if(!cityU){ cityU=new Float64Array(256); cityV=new Float64Array(256); }
      const NU=walk(cityU,gradU,hw), NV=walk(cityV,gradV,hh);
      /* 兩套投影點：地面（G）與抬升後（P）。
         抬升量取自高度圖，讓大教堂與山坡上的莊園立起來、一般屋舍稍微墊高。
         ⚠ 立面刻意很小：這個尺寸下一格才幾像素，立面畫大了必破圖。
         ⚠ 沒有高度圖就 G === P，等於維持原本的平貼。 */
      /* ⚠ 有量體層（MASS）時地面層就**退回平貼**：HM 留 null → hAt 恆 0 →
         GD 與 PT 同值 → lift 為 0，下面那段立面也自動不畫。
         抬升與立面改由量體層負責，兩邊都做就會疊出雙重牆。 */
      /* ⚠ cityMass 是以 **plan**（色圖）為 key，不是 planH。載入時每張 plan
         只抓一次街廓資料，而十一座市鎮共用同一張 stown_plan。 */
      const MASS=o.s.plan?cityMass[o.s.plan]:null;
      const HM=(!MASS&&o.s.planH)?cityHeight[o.s.planH]:null;
      const tall=o.s.planTall||0;
      const hAt=(u,v)=>{
        if(!HM||!tall) return 0;
        const px=clamp(Math.round((u*0.5+0.5)*(HM.w-1)),0,HM.w-1);
        const py=clamp(Math.round((v*0.5+0.5)*(HM.h-1)),0,HM.h-1);
        return HM.d[py*HM.w+px]/255*tall;
      };
      /* (N+1)×(N+1) 個投影點，存進預配置的 typed array（PT＝抬升後、GD＝地面）。
         ⚠ 舊版是 P/G 兩層陣列、每點一個新的四元素陣列 —— N=40 時每幀 3362 個
           物件。手機的畫格時間有一大截是花在配置與 GC 上，不是在畫。 */
      const NP=(NU+1)*(NV+1);
      if(!cityPts || cityPts.length<NP*4){ cityPts=new Float64Array(NP*4); cityGnd=new Float64Array(NP*4); }
      const PT=cityPts, GD=cityGnd;
      for(let jy=0,q=0;jy<=NV;jy++){
        const v=cityV[jy];
        for(let jx=0;jx<=NU;jx++,q+=4){
          const u=cityU[jx];
          const x=u*hw, y=v*hh;
          const lx=(x*ca-y*sa)/MAP_SCALE, ly=(x*sa+y*ca)/MAP_SCALE;
          projectInto(GD,q,lx,ly,0);
          projectInto(PT,q,lx,ly,hAt(u,v));
        }
      }
      /* 先畫進低解析緩衝再放大貼回。兩個理由：
         · 填充量降到 36%（0.6²）——網格投影是幾百次 drawImage，實測直接畫
           在主畫布上 render 要 51ms（≈19fps）。
         · 城的顆粒才跟世界一致。地形是 234×334 上採樣的，城若用全解析度
           貼，會比地形銳利得多，本身就是違和點。 */
      let bx0=1e9,by0=1e9,bx1=-1e9,by1=-1e9,zmn=1e9;
      for(let q=0;q<NP*4;q+=4){                  // 抬升後的點最高，框它就夠
        const px=PT[q], py=PT[q+1];
        if(px<bx0)bx0=px; if(px>bx1)bx1=px;
        if(py<by0)by0=py; if(py>by1)by1=py;
        if(PT[q+3]<zmn)zmn=PT[q+3];
      }
      /* ⚠ 有量體層時上緣要再往上讓：上面那個外框是用**地面**格點算的，而稜柱
         是往上長的 —— 不讓的話塔頂會被緩衝的上緣切平（實測帝都近距離整排
         屋頂被削掉）。讓的量＝最高的量體在最近的那個深度投影出來的像素高度。 */
      if(MASS&&tall>0) by0-=tall*scaleH*syk/Math.max(60,zmn);
      /* 逐欄最小深度：每一格四邊形取四角的最近深度，填進它橫跨的欄位。
         ⚠ 一開始只沿著 u 方向的橫邊填 —— 這在城的 u 軸剛好指向鏡頭時會崩：
           那些邊投影出來幾乎是**垂直的**，一條邊只蓋到一兩欄，大片欄位拿不到
           真正的最近值，裁出來就是一條條竖條把城挖出洞（實測帝都東向時整片街廓消失）。
           改成逐格就跟方位無關。取四角最小值是安全邊：寧可少遮，不可誤遮。
         PT 是抬升後的點，但抬升只改 y，x 與深度跟地面點一樣。 */
      const cc0=clamp(Math.floor(bx0/sxk)-1,0,BW-1), cc1=clamp(Math.ceil(bx1/sxk)+1,0,BW-1);
      for(let i=cc0;i<=cc1;i++) CZMIN[i]=Infinity;
      const ROWQ=(NU+1)*4;
      for(let jy=0;jy<NV;jy++){
        const r0=jy*ROWQ, r1=r0+ROWQ;
        for(let jx=0;jx<NU;jx++){
          const qa=r0+jx*4, qb=qa+4, qc=r1+jx*4, qd=qc+4;
          let mn=PT[qa], mx=mn;
          const xb=PT[qb], xc=PT[qc], xd=PT[qd];
          if(xb<mn)mn=xb; else if(xb>mx)mx=xb;
          if(xc<mn)mn=xc; else if(xc>mx)mx=xc;
          if(xd<mn)mn=xd; else if(xd>mx)mx=xd;
          if(mx<0||mn>W) continue;                       // 整格在畫面外
          let zm=PT[qa+3];
          if(PT[qb+3]<zm)zm=PT[qb+3];
          if(PT[qc+3]<zm)zm=PT[qc+3];
          if(PT[qd+3]<zm)zm=PT[qd+3];
          let ia=(mn/sxk)|0, ib=(mx/sxk)|0;
          if(ia<cc0)ia=cc0; if(ib>cc1)ib=cc1;
          for(let i=ia;i<=ib;i++) if(zm<CZMIN[i]) CZMIN[i]=zm;
        }
      }
      /* ⚠ 外框夾在**視窗內**，不是視窗外 600px。飛近時量體的投影會遠遠
         溢出畫面，原本那個 ±600 讓緩衝長到 954×524＝約 50 萬像素 ——
         比整個地形緩衝（234×334＝7.8 萬）還大六倍，而且多出來的部分
         畫完就被貼到畫面外，一個像素都看不到。純浪費。 */
      bx0=Math.max(bx0-2,-8); by0=Math.max(by0-2,-8);
      bx1=Math.min(bx1+2,W+8); by1=Math.min(by1+2,VIEWH+8);
      /* ── 緩衝格柵鎖在螢幕像素上（ver -296）────────────────────────────
         ⚠⚠ 這是「城在移動時整片抖」的真正來源。城是先畫進 bwp×bhp 的低解析
           緩衝再放大貼回，而**放大比與原點每幀都在變**：
             bwp = round(fw·pk) 是整數、fw 是浮點 → 比例 bwp/fw 每幀不同；
             bx0 也是浮點，貼回時才 Math.round。
           於是同一個世界位置每幀落在緩衝 texel 的不同相位上，重取樣的結果
           逐幀跳動 —— 靜止看不出來，一動就整片爬行。地形沒有這個病，因為
           它的緩衝是固定尺寸、固定對齊螢幕的。
         正解是讓緩衝格柵**永遠**是螢幕格柵的整數倍：
           · 縮放比取整數倒數 pk = 1/STEP（不再是任意浮點）
           · 外框原點與尺寸都吸附到 STEP 的整數倍
         這樣一個緩衝 texel 恆等於螢幕上固定的 STEP×STEP 一塊，相位是常數。 */
      const pkRaw=clamp(BW/W,0.15,1);
      const STEP=Math.max(1,Math.round(1/pkRaw));   // 一個緩衝 texel 蓋幾個螢幕像素
      const LOCK=(window.__lockLattice!==false);   // 除錯開關：主控台設 false 可即時回到舊行為做 A/B
      const pk=LOCK?1/STEP:pkRaw;
      if(LOCK){ bx0=Math.floor(bx0/STEP)*STEP; by0=Math.floor(by0/STEP)*STEP; }
      let fw=Math.ceil(bx1-bx0), fh=Math.ceil(by1-by0);
      if(LOCK){ fw=Math.ceil(fw/STEP)*STEP; fh=Math.ceil(fh/STEP)*STEP; }
      if(fw<2||fh<2||bx1<0||by1<0||bx0>W||by0>VIEWH){ ctx.restore(); continue; }
      const bwp=LOCK?Math.max(2,fw/STEP):Math.max(2,Math.round(fw*pk)),
            bhp=LOCK?Math.max(2,fh/STEP):Math.max(2,Math.round(fh*pk));
      /* ⚠ 緩衝**一次配到上限，之後永不重配**。外框已經夾在視窗內，
         所以 (W+16)×(VIEWH+16)×pk 就是它可能長到的最大值 —— 直接配那麼大。
         先前的「只長不縮」仍會在飛近的過程中重配十幾次，每次都是一張新的
         GPU 貼圖：配置與 GC 吃畫格時間（fps 爆跌），iOS 的 canvas 記憶體預算
         被撐爆後還會把既有 canvas 丟掉（城變空白／破圖）。
         只讀 (0,0,bwp,bhp) 這塊子區域，所以緩衝比需要的大沒有關係。 */
      const capW=Math.ceil((W+16)*pk)+2, capH=Math.ceil((VIEWH+16)*pk)+2;
      if(!cityFB || cityFB.width!==capW || cityFB.height!==capH){
        cityFB=document.createElement('canvas'); cityFB.width=capW; cityFB.height=capH;
        CFB=cityFB.getContext('2d');
      }
      CFB.setTransform(1,0,0,1,0,0); CFB.clearRect(0,0,bwp,bhp);
      const kx=LOCK?pk:bwp/fw, ky=LOCK?pk:bhp/fh;

      /* ── 選預縮圖層級（見 planMipChain）───────────────────────────────
         需要多寬：整張平面圖投影到**緩衝**上有多少像素。
         2·hw 是世界寬度，(W/2z) 是該深度的世界→螢幕比，再乘 pk 進緩衝。 */
      const wantW=Math.max(8, (2*hw)*(W/(2*Math.max(60,o.z)))*pk);
      const planSrc=planMipFor(o.s.plan, planImg, wantW);
      /* ── 底圖厚度（PLATE_DROP）：**已移除**（ver -312）─────────────────────
         -311 曾經逐格往下拉一道垂直四邊形，想用厚度蓋住「從廣場穿出來的草地」。
         ⚠⚠ 那是**治標**：真正的原因是格距太粗（見 QUALITY 的 cell 註解），
           草地是格內的仿射誤差露出來的地形，不是地形真的比底圖高。
         ⚠ 而且它**填的是格子的四邊形，不吃平面圖的 alpha** —— 格網是 u,v∈[-1,1]
           的**正方形**，所以填出來是一塊圍著城的**方形台**，不是城的圓輪廓。
           Ray：「把你加高的方型區域拿掉」。
         格距修好之後不需要它了。日後若真的遇到地形頂穿底圖，正解是**整地**
           （podium）或把厚度**沿平面圖的 alpha 剪影**拉，不是填整個格網。 */
      /* 來源矩形改逐格算（格線非均勻）：平面座標 −1..1 → 圖上像素。
         ⚠ sux/svy 必須跟著**選到的那一層**走，不能沿用原圖尺寸。 */
      const sux=planSrc.width*0.5, svy=planSrc.height*0.5;
      /* ── 由遠而近的順序：兩個掃描方向，不再排序 ────────────────
         格點在世界裡是規則網格，而深度 z＝dx·(−sinp)+dy·(−cosp) 是世界座標的
         線性組合 → **z 對 (jx,jy) 是仿射的**。所以「先畫遠的」不必比較大小，
         只要沿 jx／jy 各自從 z 大的那一頭起步即可（voxel 地形光柵化的標準作法）。
         ⚠ 這與嚴格的深度排序在「同列相隔很遠的兩格」上會有出入，但那種格子
           本來就不重疊 —— 會互相遮的只有相鄰格，逐列由遠而近就夠。
         換掉的是每幀 N² 個 cell 物件（N=40 → 1600 個）＋一次 sort。 */
      const zdx=PT[1*4+3]-PT[3], zdy=PT[(NU+1)*4+3]-PT[3];
      const jx0=zdx>0?NU-1:0, jxs=zdx>0?-1:1;
      const jy0=zdy>0?NV-1:0, jys=zdy>0?-1:1;
      /* 立面的顏色整批只設一次：fillStyle 每次都要重新解析字串，
         而這個迴圈近距離會跑上千次。 */
      /* ⚠ 立面顏色可逐城覆寫：一般城的牆是「屋瓦陰影」，暗色讀成牆在陰影裡；
         聖王廳是白石建築，同一個暗色會讓整座聖座變成一團黑。米白＋較低的
         不透明度讓它讀成「受光的石牆」。
         ⚠ 不上貼圖：一面牆常常只有 3~8px 高，石紋進去只是雜訊。 */
      CFB.fillStyle=o.s.wallCol||'rgba(34,30,26,0.62)';
      const row=NU+1;
      /* ⚠⚠ **底圖已改在地形取樣迴圈裡畫**（ver -445，A 案）—— 取樣器活著時
         這整段格網**不畫**（畫了會疊兩份，而且它正是拉伸的來源）。
         這裡只留兩個用途：①取樣器還沒就緒（極早期）當退路 ②上面那段 CZMIN
         （逐欄最小深度）照算 —— 量體層貼回時的遮擋裁切還靠它。 */
      const groundSampled=!!(CITYMASK && CITY_PYR[o.s.plan]);
      if(!groundSampled)
      for(let ky2=0;ky2<NV;ky2++){
        const jy=jy0+jys*ky2;
        /* ⚠ 這一組是**整列**的來源矩形，格內若發生近裁面裁切會各自重算（見下方）。 */
        for(let kx2=0;kx2<NU;kx2++){
          const jx=jx0+jxs*kx2;
          /* ⚠ 這裡原本逐格判斷「格心落在海上就不畫」。格子大小隨距離變，
             鏡頭一動哪些格被剔除就整塊整塊地跳 —— 海岸線因此鋸齒抖動。
             已改成在 build_city.py 逐像素烘進 alpha：靜態、精確、零成本。 */
          const iA=(jy*row+jx)*4, iB=iA+4, iC=((jy+1)*row+jx)*4, iD=iC+4;
          /* ⚠ 任一角太近或在身後就整格跳過。project 對 z<24 做了夾制，
             夾過的角會被推到一個完全錯的螢幕位置，那一格就會扯成一片
             —— 這就是「城有時會破」。夾制是為了避免除零，不能拿來畫。 */
          /* ── 近裁面裁切（ver -292）──────────────────────────────
             ⚠⚠ 這裡原本是「有一個角比 ZNEAR 近就**整格丟掉**」。遠處沒差
               （跨界的格子很少），**貼近城的時候那是把半座城丟掉**：實測鏡頭
               到城心 440（城的繪製半徑 396，等於只在城緣外 44 個單位）時，
               1855 格裡 1008 格栽在這一條，實際只畫出 175 格。
               看到的就是「廣場中央該白的地方冒出綠地」—— 不是地形頂出來，
               是那幾格**根本沒畫**，底下的地貌直接露出來。
             ⚠ 不能靠調低 ZNEAR：被丟的格子裡有 840 格 z 是**負的**（幾何上
               真的在鏡頭後方），門檻再低也救不回來。實測 14→9 反而更少。
             正解是把格子**裁成可見的那一塊再畫**。
             ⚠ 裁切有解析解：深度對平面座標是仿射的（z = zc + gradU·u + gradV·v，
               見上面 walk 的說明），所以 z=ZNEAR 在 uv 平面上是一條直線。
               把矩形往深度增加的方向縮到四角都過關即可，縮掉的是一塊楔形。
               兩軸各縮同一個比例 f＝缺口÷可用深度 —— f·Gu + f·Gv 剛好補上缺口，
               不必解不等式，也不會偏袒某一軸。 */
          let cu0=cityU[jx], cu1=cityU[jx+1], cv0=cityV[jy], cv1=cityV[jy+1];
          let PS=PT, PA=iA, PB=iB, PC=iC, PD=iD, clipped=false;
          {
            let zn=PT[iA+3];
            const zb0=PT[iB+3], zc0=PT[iC+3], zd0=PT[iD+3];
            if(zb0<zn)zn=zb0; if(zc0<zn)zn=zc0; if(zd0<zn)zn=zd0;
            if(zn<CITY_ZNEAR){
              const Gu=Math.abs(gradU*(cu1-cu0)), Gv=Math.abs(gradV*(cv1-cv0));
              const G=Gu+Gv;
              if(!(G>1e-9)) continue;
              const f=(CITY_ZNEAR-zn)/G;
              if(f>=1) continue;                 // 整格都在近裁面內側，真的沒得畫
              if(gradU>0) cu0+=f*(cu1-cu0); else cu1-=f*(cu1-cu0);
              if(gradV>0) cv0+=f*(cv1-cv0); else cv1-=f*(cv1-cv0);
              /* ⚠ 一定要**重投影**裁過的四角，不能沿用 PT —— 原本那幾個角有的
                 在鏡頭後面，PT 裡存的是被 CITY_ZCLAMP 夾過的假螢幕位置。 */
              const uu0=cu0,uu1=cu1,vv0=cv0,vv1=cv1;
              const UU=[uu0,uu1,uu0,uu1], VV=[vv0,vv0,vv1,vv1];
              for(let k2=0;k2<4;k2++){
                const xq=UU[k2]*hw, yq=VV[k2]*hh;
                projectInto(cityClipQ, k2*4, (xq*ca-yq*sa)/MAP_SCALE,
                            (xq*sa+yq*ca)/MAP_SCALE, hAt(UU[k2],VV[k2]));
              }
              PS=cityClipQ; PA=0; PB=4; PC=8; PD=12; clipped=true;
            }
          }
          /* ⚠ 保險絲：一格內的深度比例失控（近角比遠角近三倍以上）就整格不畫。
             仿射矩陣吃不下這種格子，畫出來是一條放射狀的拖曳——寧可缺一格。
             步長依深度分配之後正常情況不會觸發，這條是防下次再寫錯。 */
          {
            let zmin=PS[PA+3], zmax=zmin;
            const zb=PS[PB+3], zcc=PS[PC+3], zd=PS[PD+3];
            if(zb<zmin)zmin=zb; if(zb>zmax)zmax=zb;
            if(zcc<zmin)zmin=zcc; if(zcc>zmax)zmax=zcc;
            if(zd<zmin)zmin=zd; if(zd>zmax)zmax=zd;
            if(zmax>zmin*CITY_ZRATIO) continue;
          }
          const qax=PS[PA], qay=PS[PA+1], qbx=PS[PB], qby=PS[PB+1],
                qcx=PS[PC], qcy=PS[PC+1], qdx=PS[PD], qdy=PS[PD+1];
          /* 整格落在外框之外就跳過。緩衝夾到視窗之後，這種格子的 drawImage
             畫出來的是零個可見像素 —— 飛到城上空時它們是大宗（近距離量到
             1147 次 drawImage 裡有一半以上在畫面外）。八次 min/max 換掉一次
             帶轉換的 drawImage，很划算。 */
          if(Math.min(qax,qbx,qcx,qdx)>bx1||Math.max(qax,qbx,qcx,qdx)<bx0||
             Math.min(qay,qby,qcy,qdy)>by1||Math.max(qay,qby,qcy,qdy)<by0) continue;
          /* 來源矩形跟著裁過的 uv 走，否則圖會偏。sy/shh 同理（外層那組是整格的）。 */
          const sx=(cu0+1)*sux, sw=(cu1-cu0)*sux;
          const sy=(cv0+1)*svy, shh=(cv1-cv0)*svy;
          const a1=(qbx-qax)/sw, b1=(qby-qay)/sw;
          const c1=(qcx-qax)/shh, d1=(qcy-qay)/shh;
          if(!isFinite(a1)||!isFinite(d1)) continue;
          if(Math.abs(a1*d1-b1*c1)<1e-7) continue;     // 退化成一條線就跳過
          /* 立面：把抬升後的量體與地面連起來，只畫**朝鏡頭那一邊**。
             取深度最小的那條邊即可 —— 其餘三面被自己擋住，畫了也看不到，
             而且會在相鄰格之間互相穿插。
             ⚠ 用平塗暗色而不是貼圖：一格的立面只有幾像素，貼圖進去只會變雜訊；
               暗色反而乾淨地讀成「牆在陰影裡」。
             ⚠ 四條邊照 A→B→D→C 的環序，選深度和最小的那條；
               舊版是每格 new 出一個 4×5 的巢狀陣列來比大小。 */
          /* ⚠ 裁過的格子不畫立面：GD（地面點）沒有跟著重投影，lift 會拿裁過的
             頂點去減整格的地面點，算出來是假的。裁切只發生在最近的那一兩排，
             那裡的立面本來就只有幾像素。 */
          const lift=clipped?0:(Math.abs(qay-GD[iA+1])+Math.abs(qdy-GD[iD+1]));
          /* ⚠ lift 設上限：近距離時單格的立面可以長到幾十像素，
             一堆長條暗面疊在一起就是整片拖曳。超過就不畫那一面。 */
          if(lift>1.2 && lift<26){
            const eAB=PT[iA+3]+PT[iB+3], eBD=PT[iB+3]+PT[iD+3],
                  eDC=PT[iD+3]+PT[iC+3], eCA=PT[iC+3]+PT[iA+3];
            let t1=iA, t2=iB, m=eAB;
            if(eBD<m){ m=eBD; t1=iB; t2=iD; }
            if(eDC<m){ m=eDC; t1=iD; t2=iC; }
            if(eCA<m){ m=eCA; t1=iC; t2=iA; }
            CFB.setTransform(kx,0,0,ky,-bx0*kx,-by0*ky);
            CFB.beginPath();
            CFB.moveTo(PT[t1],PT[t1+1]); CFB.lineTo(PT[t2],PT[t2+1]);
            CFB.lineTo(GD[t2],GD[t2+1]); CFB.lineTo(GD[t1],GD[t1+1]);
            CFB.closePath();
            CFB.fill();
          }
          /* ── 相鄰格的重疊：量要用**緩衝像素**，不是來源圖的像素 ──────────
             ⚠⚠ 這裡原本是固定的 `+1.2`，而那 1.2 是**平面圖上的像素**。
               一格的來源寬 sw 約 36 個圖像素，投影到緩衝上可能只有 8 個像素
               —— 1.2 個圖像素 ≈ 0.27 個緩衝像素，等於**根本沒有重疊**。
               而 drawImage 帶轉換時四邊是**做抗鋸齒**的：每一格的邊緣是半透明，
               兩格各半並不會補成不透明，於是沿著整片格線留下一張半透明的網
               —— Ray 回報的「破圖 格子狀」就是這個。
             正解是把重疊量定在緩衝空間再換回圖空間：
               緩衝像素／圖像素 = |(a1·kx, b1·ky)|（u 向）、|(c1·kx, d1·ky)|（v 向）
               需要的圖像素數 = OVER_PX ÷ 上面那個比例
             ⚠ 兩邊各讓半格（對稱），否則只有一側補得到。
             ⚠ 夾上下限：太小補不到接縫，太大會讓一格畫到鄰格的內部（近距離
               一格很大時，多畫的那一截是拿自己的仿射矩陣去畫別人的地盤）。 */
          const su=Math.hypot(a1*kx, b1*ky), sv2=Math.hypot(c1*kx, d1*ky);
          const ou=clamp(OVER_PX/Math.max(su,1e-6), 0.6, 24);
          const ov=clamp(OVER_PX/Math.max(sv2,1e-6), 0.6, 24);
          // 緩衝的座標系＝(螢幕座標 − 外框原點) × 縮放
          CFB.setTransform(a1*kx, b1*ky, c1*kx, d1*ky,
                           (qax-a1*sx-c1*sy-bx0)*kx, (qay-b1*sx-d1*sy-by0)*ky);
          CFB.drawImage(planSrc, sx-ou*0.5, sy-ov*0.5, sw+ou, shh+ov,
                                 sx-ou*0.5, sy-ov*0.5, sw+ou, shh+ov);
          if(GRIDDBG){
            CFB.setTransform(kx,0,0,ky,-bx0*kx,-by0*ky);
            CFB.strokeStyle='rgba(255,40,40,0.9)'; CFB.lineWidth=0.6;
            CFB.beginPath();
            CFB.moveTo(qax,qay); CFB.lineTo(qbx,qby);
            CFB.lineTo(qdx,qdy); CFB.lineTo(qcx,qcy); CFB.closePath();
            CFB.stroke();
          }
        }
      }

      /* ── 底圖側面：**已移除**（ver -303）───────────────────────────────
         -300~-302 這裡是「取底圖剪影 → 填實色 → 在螢幕空間往下疊 dpx 像素」。
         ⚠⚠ 那是**螢幕空間**的抹壓，不是幾何：dpx 隨距離變，貼近時 70 個世界
           單位會投影成上百像素，整座城下緣被抹成一大片灰白（Ray：「破得一塌
           糊塗」）。把上限夾小又會在底圖與地面之間露縫（Ray：「圖又破出來」）——
           兩邊都不對，因為問題不在上限，在於**用抹壓假造厚度**這件事本身。
         要做真的厚度得走幾何：逐格從地面點拉一道垂直四邊形到抬高後的點
         （就是原本的「立面」那套，見下方 lift 那段），而不是整張圖往下抹。 */
      /* ── 街廓量體 ─────────────────────────────────────────────
         上面那層已經把平面圖平貼在地上了。這一層在它上面把每個街廓拉伸成
         獨立的稜柱：垂直牆＋平屋頂，塊與塊不共用頂點。

         ⚠ 這是與舊版最關鍵的差別。舊版抬的是共用的網格頂點，等於把紋理整片
           往上剪切，所以高度圖要先糊 5px、planTall 要夾在 26。街廓各自獨立，
           街道自然成為塊與塊之間的谷 —— 高度因此沒有上限。

         ⚠ 頂面不必重新投影：垂直抬升不改變 sv，所以螢幕 x 與地面同值，
           只有 y 差 (h/z)·scaleH·syk。每個頂點省一次 projectInto。
         ⚠ 所有牆累積成**一條路徑、一次 fill**：顏色都一樣，幾百次 fill 換成
           一次，這是這一層最大的一筆節省。 */
      const MS=MASS, MA=cityMassArt[o.s.plan];
      /* ── 量體層要不要長出來 ───────────────────────────────────
         ⚠ 尺標**不能用 fw/fh** —— 那是外框，而外框在上面被夾進了視窗
           （bx0/by1 那四行）。城一旦大到溢出畫面，夾過的外框就不再跟著
           距離長，反而隨著城滑向邊緣**變小**。於是一次直線接近會讓這個
           值上上下下越過門檻好幾回，整層在「全 24 塊」與「一塊都沒有」
           之間跳 —— 那就是回報的「經過的時候一下扁一下立體」。
           實測（375×812、由南直線接近）：帝都的 max(fw,fh) 在一次接近中
           下跌 9 次、聖王廳 1 次；改用下面這條之後兩座都是 0 次。
         尺標改成由城心距離推出來的螢幕寬：planW 是世界單位、投影的尺度是
         W/(2d)，兩者相乘就是城平貼在螢幕上會有多寬。它只跟距離有關，
         單調、不受裁切影響。d 夾住下限，飛到城正上方時分母才不會爆。
         ⚠ 用**直線距離**而不是前向深度 zc：zc 會隨航向變（同一個位置轉一圈
           實測 42~85），轉頭就可能越過門檻。距離對旋轉是不變的，原地打舵
           不會改變任何一座城的層級。
         ⚠ 還要遲滯（MASS_OFF）：門檻本身會隨自適應畫質跳檔（27→45→75→
           128），沒有遲滯的話光是換一次檔就足以把整層抹掉。旗標存在聚落
           物件上，逐城各自記各自的。 */
      const mdx=o.s.mx*MAP_SCALE-cam.x, mdy=o.s.my*MAP_SCALE-cam.y;
      const massW=o.s.planW*W/(2*Math.max(60,Math.hypot(mdx,mdy)))*pkRaw;
      const massT=MASS_ON_PX;
      /* ⚠⚠ **太近也要收掉**（ver -444，Ray：「經過、離開畫面時底圖被拉伸」）。
         量體是一根根稜柱，牆的螢幕高度是 `牆高 × dyk ÷ z` —— z 一小就爆炸：
         實測飛到城的上空時，最近那幾塊的牆各自是**一整片蓋滿畫面的暗色板**，
         把底下的平面圖整個蓋掉（看起來就是「底圖被拉伸／城不見了」）。
         ⚠ 這不是 `MASS_ZNEAR`／`MASS_ZRATIO` 擋得住的：那兩條看的是**塊內**的
           深度差，而這些塊本身深度很一致，只是**整塊都太近**。
         ⚠ 判斷用**投影寬度**不是距離：那是螢幕上的量，與畫質、視野、城的大小
           都無關（同 `MASS_ON_PX` 的理由，那一條也是這樣訂的）。
         ⚠ 收掉之後看到的是**平面圖**，而屋頂本來就畫在平面圖上 ——
           從正上方看見的就該是屋頂，缺的只有牆，而那個角度本來也看不到牆。
         ⚠ 走既有的 `_massA` 淡出（400ms），不是硬切。 */
      const tooNear = massW >= MASS_TOO_PX;
      o.s._massOn = tooNear ? false
                            : (o.s._massOn ? (massW>=massT*MASS_OFF) : (massW>=massT));
      /* 旗標仍然是「該不該有量體」的判斷（含遲滯），但畫出來的濃度走 _massA
         這個連續值，逐幀朝旗標推進 → 淡入／淡出。
         ⚠ dt 夾 100ms：城在畫面外時這一段不執行，_massAt 會過期；不夾的話
           一回到畫面就是一大步，等於沒有淡入。
         ⚠ 初值 0（不是直接等於旗標）—— 第一次看到一座城時也要淡進來。 */
      { const nowMs=performance.now();
        const dtm=Math.min(100, nowMs-(o.s._massAt||nowMs));
        o.s._massAt=nowMs;
        const tgt=o.s._massOn?1:0, stp=dtm/MASS_FADE_MS;
        let a=(o.s._massA==null)?0:o.s._massA;
        a = (a<tgt) ? Math.min(tgt,a+stp) : Math.max(tgt,a-stp);
        o.s._massA=a; }
      const massA=o.s._massA;
      if(MS&&MA&&tall>0&&massA>0.003){
        const dyk=scaleH*syk;
        /* 方位桶：由遠而近的順序只取決於 (gradU,gradV) 的方向（見 loadMass）。 */
        let az=Math.atan2(gradV,gradU)/(Math.PI*2); az-=Math.floor(az);
        const ORD=MS.ord[Math.min(MASS_AZ-1,(az*MASS_AZ)|0)];
        if(!massPts||massPts.length<64) massPts=new Float64Array(64);
        const MP=massPts;
        /* ⚠ 淡入的濃度**只套在量體層**（牆＋屋頂），底下的手繪平面圖維持不透明
           —— 兩者疊在同一個 CFB 上，所以這正好是一次交叉淡化：立體長出來的
           同時平面圖從底下透出來，中間沒有任何一格是空的。
           ⚠ 代價：淡化途中屋頂子格之間那 0.5px 的**刻意重疊會二次疊色**，
             看得到一條極淡的接縫。全不透明時被蓋掉所以看不見。400ms 的過渡
             期間可接受；真的礙眼就得把量體改畫到另一張離屏再整張合成。 */
        CFB.globalAlpha=massA;
        /* 第一趟：牆。整批累積成一條路徑，最後一次 fill。 */
        CFB.setTransform(kx,0,0,ky,-bx0*kx,-by0*ky);
        CFB.beginPath();
        let anyWall=false;
        const drawn=[];
        for(let t=0;t<MS.n;t++){
          const bi=ORD[t], au=MS.pu[bi], av=MS.pv[bi], np2=au.length;
          const hW=MS.h[bi]*tall;
          if(hW<=0.5) continue;
          /* 多邊形頂點：地面投影 + 立面高度。頂點數 ≤12（build 端簡化過）。 */
          if(MP.length<np2*4){ massPts=new Float64Array(np2*4); }
          const P=massPts;
          let ok=true, S2=0, mnx=1e9,mxx=-1e9,mny=1e9,mxy=-1e9;
          let zlo=1e9, zhi=-1e9;
          for(let k=0;k<np2;k++){
            const x0=au[k]*hw, y0=av[k]*hh;
            projectInto(P,k*4,(x0*ca-y0*sa)/MAP_SCALE,(x0*sa+y0*ca)/MAP_SCALE,0);
            const zk=P[k*4+3];
            if(zk<MASS_ZNEAR){ ok=false; break; }
            if(zk<zlo)zlo=zk; if(zk>zhi)zhi=zk;
          }
          if(!ok)continue;
          /* ⚠ 保險絲：一塊之內的深度比例失控（近端比遠端近三倍以上）就整塊不畫。
             仿射矩陣吃不下這種形狀，畫出來是一道放射狀的拖曳 —— 低空貼近帝都時
             會看到一條白色光柱從城裡射進天空（使用者回報的「飄圖穿過前景」）。
             舊的網格版本有這條，我搬成多邊形時漏了。寧可缺一塊。 */
          if(zhi>zlo*MASS_ZRATIO)continue;
          /* 頂面 y：各頂點用自己的 z（近的牆高、遠的牆矮，稜柱該有的透視）。 */
          for(let k=0;k<np2;k++){
            const L=hW*dyk/P[k*4+3];
            P[k*4+2]=L;                                   // 借第三欄存立面高度
            const ty=P[k*4+1]-L, px=P[k*4];
            if(px<mnx)mnx=px; if(px>mxx)mxx=px;
            if(ty<mny)mny=ty; if(P[k*4+1]>mxy)mxy=P[k*4+1];
          }
          if(mnx>bx1||mxx<bx0||mny>by1||mxy<by0) continue;
          if(mxx-mnx<Q().blk&&mxy-mny<Q().blk) continue;  // 螢幕上太小就不畫
          // 頂面的螢幕帶號（shoelace）
          for(let k=0;k<np2;k++){
            const k2=(k+1)%np2;
            S2+=P[k*4]*(P[k2*4+1]-P[k2*4+2])-P[k2*4]*(P[k*4+1]-P[k*4+2]);
          }
          /* 牆的帶號 2A=(x_q−x_p)(L_p+L_q)，與頂面**異號**的才是朝鏡頭的下緣。
             同號的兩面被屋頂自己擋住，畫了看不到還會與鄰塊互相穿插。 */
          for(let k=0;k<np2;k++){
            const k2=(k+1)%np2;
            const pxx=P[k*4], pyy=P[k*4+1], Lp=P[k*4+2];
            const qxx=P[k2*4], qyy=P[k2*4+1], Lq=P[k2*4+2];

            /* 只畫朝鏡頭那一邊：其餘被自己擋住。
               ⚠ ver -304 實測過**四面全畫**：覆蓋 3057→3078、破洞 257→273，
                 在指標的噪訊範圍內，等於**沒有差別**，卻多一倍路徑。
                 所以「破洞沿著街廓輪廓」不是背面牆被剔掉造成的，別再往這裡改。 */
            if((qxx-pxx)*S2>=0) continue;
            /* ⚠⚠ 纏繞方向必須**統一**。所有的牆累積成同一條路徑、最後一次
               `fill()`，而 canvas 預設是 **nonzero** 規則 —— 兩塊反向纏繞的
               四邊形疊在一起會**互相抵消**，挖出一個洞。剔背面時剩下的都同向
               所以看不出來；四面全畫之後就炸了（實測覆蓋反而由 3057 掉到
               2520、破洞 257→432）。
               這種牆是一條「垂直帶」，纏繞方向只取決於 x 的走向，
               所以 x 往回走的那一面照反序送點即可。 */
            if(qxx>=pxx){
              CFB.moveTo(pxx,pyy-Lp); CFB.lineTo(qxx,qyy-Lq);
              CFB.lineTo(qxx,qyy);    CFB.lineTo(pxx,pyy);
            }else{
              CFB.moveTo(pxx,pyy);    CFB.lineTo(qxx,qyy);
              CFB.lineTo(qxx,qyy-Lq); CFB.lineTo(pxx,pyy-Lp);
            }
            CFB.closePath(); anyWall=true;
          }
          drawn.push(bi);
        }
        if(anyWall) CFB.fill();                           // fillStyle 沿用地面層的暗色
        /* 第二趟：屋頂。每塊一次 drawImage —— atlas 上那一格已經帶著自己的
           alpha，所以不必逐塊 clip（clip 要重新光柵化路徑，幾百塊就吃掉畫格）。 */
        /* ⚠ 一塊一個仿射矩陣，只有在**塊內深度幾乎不變**時才成立 —— 投影是 1/z
             的非線性，仿射近似不了。舊版一座城 300 多個碎塊，每塊深度比接近 1，
             所以看不出來；換成 24 個大量體之後，實測相機在聖王廳南 25 地圖像素
             時有 11/24 塊的深度比超過 1.5、最大 4.91，畫出來就是使用者回報的
             「靠近時貼圖被拉伸」。
           修法是把**屋頂的仿射**細分成幾格，各自定矩陣；牆不動，仍是一根稜柱
           （拆幾何的話相鄰子塊的接縫會各自長出一道不該有的內牆）。
           ⚠ 只沿**深度梯度**方向細分就夠。深度對平面座標 (u,v) 是仿射的（見
             loadMass 的方位分桶），所以與梯度垂直的方向上深度是常數，那個方向
             的投影本來就是仿射、切了純浪費。 */
        
        const RSPLIT_MAX=6;
        for(let t=0;t<drawn.length;t++){
          const bi=drawn[t], hW=MS.h[bi]*tall;
          const ax2=MS.bb[bi*4], ay2=MS.bb[bi*4+1],
                bw2=MS.bb[bi*4+2], bh2=MS.bb[bi*4+3];
          if(bw2<1||bh2<1)continue;
          const gx0=MS.bbx[bi*4], gy0=MS.bbx[bi*4+1],
                gx1=MS.bbx[bi*4+2], gy1=MS.bbx[bi*4+3];
          /* 這一塊在兩軸上各跨多少深度 → 決定各軸要切幾格。
             目標：每一小格的深度比 ≤ 1.25。 */
          projectInto(MP,0,(gx0*hw*ca-gy0*hh*sa)/MAP_SCALE,(gx0*hw*sa+gy0*hh*ca)/MAP_SCALE,hW);
          const z00=MP[3];
          if(z00<MASS_ZNEAR)continue;
          projectInto(MP,0,(gx1*hw*ca-gy0*hh*sa)/MAP_SCALE,(gx1*hw*sa+gy0*hh*ca)/MAP_SCALE,hW);
          const z10=MP[3];
          projectInto(MP,0,(gx0*hw*ca-gy1*hh*sa)/MAP_SCALE,(gx0*hw*sa+gy1*hh*ca)/MAP_SCALE,hW);
          const z01=MP[3];
          if(z10<MASS_ZNEAR||z01<MASS_ZNEAR)continue;
          const zmin=Math.max(60,Math.min(z00,z10,z01));
          const rU=Math.abs(z10-z00)/zmin, rV=Math.abs(z01-z00)/zmin;
          const nU=Math.min(RSPLIT_MAX,Math.max(1,Math.ceil(rU/0.25)));
          const nV=Math.min(RSPLIT_MAX,Math.max(1,Math.ceil(rV/0.25)));
          const sw=bw2/nU, sh=bh2/nV, du=(gx1-gx0)/nU, dv=(gy1-gy0)/nV;
          for(let iv=0;iv<nV;iv++)for(let iu=0;iu<nU;iu++){
            const u0=gx0+du*iu, v0=gy0+dv*iv, u1=u0+du, v1=v0+dv;
            const c3=[[u0,v0],[u1,v0],[u0,v1]], sc3=[];
            let bad=false;
            for(let k=0;k<3;k++){
              const x0=c3[k][0]*hw, y0=c3[k][1]*hh;
              projectInto(MP,0,(x0*ca-y0*sa)/MAP_SCALE,(x0*sa+y0*ca)/MAP_SCALE,hW);
              if(MP[3]<MASS_ZNEAR){ bad=true; break; }
              sc3.push([MP[0],MP[1]]);
            }
            if(bad)continue;
            const sx=ax2+sw*iu, sy=ay2+sh*iv;
            const a2=(sc3[1][0]-sc3[0][0])/sw, b2=(sc3[1][1]-sc3[0][1])/sw,
                  c2=(sc3[2][0]-sc3[0][0])/sh, d2=(sc3[2][1]-sc3[0][1])/sh;
            if(!isFinite(a2)||!isFinite(d2)||Math.abs(a2*d2-b2*c2)<1e-7) continue;
            /* ── 屋頂也要走預縮圖（ver -310）───────────────────────────────
               ⚠⚠ **這一層才是「格子狀」的真兇。** `?grid=1` 的青線（屋頂子格）
                 密度與回報的格子完全吻合，紅線（平面圖的格）粗得多、對不上。
               原理與地面層同一條：atlas 被縮小十幾倍，而 canvas 的雙線性縮小時
               只讀 **2×2 個 texel** —— 每個子格各自抓到不同的那 2×2，於是每格
               亮度細節都不一樣，拼起來就是一張網。子格切得越細（RSPLIT 最多
               6×6），網目越密，這就是為什麼它比地面層明顯。
               ⚠ atlas 座標（MS.bb 那組）必須**整組乘上 ms**，否則會取到別塊的圖。
               ⚠ ver -306 我在這裡試過重疊量的修正，因為指標量不出差別而放棄 ——
                 那個指標數的是「破洞」，而這是**亮度型**的接縫，永遠測不到。
                 教訓：指標測不到，不代表問題不存在。 */
            const mip=massMipFor(o.s.plan, MA, Math.hypot(a2*kx, b2*ky));
            const ms=mip.ms;
            const sxm=sx*ms, sym=sy*ms, swm=sw*ms, shm=sh*ms;
            const a2m=a2/ms, b2m=b2/ms, c2m=c2/ms, d2m=d2/ms;
            CFB.setTransform(a2m*kx, b2m*ky, c2m*kx, d2m*ky,
                             (sc3[0][0]-a2m*sxm-c2m*sym-bx0)*kx,
                             (sc3[0][1]-b2m*sxm-d2m*sym-by0)*ky);
            /* 子格之間的重疊：與地面層同一條規則，量定在**緩衝像素**再換回
               atlas 像素。⚠ 只往內擴、最後一個子格不擴 —— atlas 上每塊緊鄰排列，
               往外擴會跨進別塊的貼圖。 */
            const mu2=Math.hypot(a2m*kx, b2m*ky), mv2=Math.hypot(c2m*kx, d2m*ky);
            const eu=(iu<nU-1)?clamp(OVER_PX/Math.max(mu2,1e-6),0.3,6):0;
            const ev=(iv<nV-1)?clamp(OVER_PX/Math.max(mv2,1e-6),0.3,6):0;
            CFB.drawImage(mip.img, sxm,sym,swm+eu,shm+ev, sxm,sym,swm+eu,shm+ev);
            if(GRIDDBG){
              CFB.setTransform(kx,0,0,ky,-bx0*kx,-by0*ky);
              CFB.strokeStyle='rgba(0,230,255,0.9)'; CFB.lineWidth=0.6;
              CFB.beginPath();
              CFB.moveTo(sc3[0][0],sc3[0][1]); CFB.lineTo(sc3[1][0],sc3[1][1]);
              CFB.lineTo(sc3[1][0]+(sc3[2][0]-sc3[0][0]), sc3[1][1]+(sc3[2][1]-sc3[0][1]));
              CFB.lineTo(sc3[2][0],sc3[2][1]); CFB.closePath();
              CFB.stroke();
              CFB.setTransform(a2*kx, b2*ky, c2*kx, d2*ky,
                               (sc3[0][0]-a2*sx-c2*sy-bx0)*kx,
                               (sc3[0][1]-b2*sx-d2*sy-by0)*ky);
            }
          }
        }
        CFB.setTransform(1,0,0,1,0,0);
        CFB.globalAlpha=1;              // ⚠ CFB 是共用緩衝，一定要還回去
      }
      /* 依光線上色：同 drawShip 那套。素材本身已經把「固定的色調對齊」烘進去
         （build_city.py 的 SAT/VAL），這裡只加隨時間變的部分。
         ⚠ source-atop：只作用在不透明處，透明區不會被塗成方塊。
         ⚠ 這個世界的日夜之後不會即時推移，而是戰後結算時跳一段，
           所以實際只會停在夜／黎明／早／黃昏四個狀態上——這條曲線
           在那四點取值都對得起來，不必為此改成離散表。 */
      /* ── 碼頭 ────────────────────────────────────────────────
         沿濱水面往水裡伸。每一段用一個仿射矩陣把貼圖鋪到「世界上的矩形」投影出來
         的平行四邊形上 —— 與城的網格同一套作法，所以棧橋是躺在水面上而不是
         浮在畫面上的一張圖。
         ⚠ 排在色罩之前：這樣棧橋跟城吃同一份曝光與夜色，不會自己一個亮度。 */
      if(o.s.piersLocal && dockArt.dock_strip && o.z<2200){
        const strip=dockArt.dock_strip, endp=dockArt.dock_end;
        const segMap=PIER_SEG/MAP_SCALE, halfW=(PIER_W*0.5)/MAP_SCALE;
        const nseg=o.s.t.indexOf('city')===0?4:3;
        for(const pr of o.s.piersLocal){
          const ca2=Math.cos(pr.ang), sa2=Math.sin(pr.ang);
          for(let k2=0;k2<nseg;k2++){
            const t0=k2*segMap;
            // 這一段的三個角（局部地圖像素）：近端左、近端右、遠端左
            const ax=pr.dx - sa2*halfW + ca2*t0,        ay=pr.dy + ca2*halfW + sa2*t0;
            const bx=pr.dx + sa2*halfW + ca2*t0,        by=pr.dy - ca2*halfW + sa2*t0;
            const cx4=pr.dx - sa2*halfW + ca2*(t0+segMap), cy4=pr.dy + ca2*halfW + sa2*(t0+segMap);
            const A=project(ax,ay,PIER_HOFF), B=project(bx,by,PIER_HOFF), C=project(cx4,cy4,PIER_HOFF);
            if(A[3]<60||B[3]<60||C[3]<60) continue;
            const sw2=strip.width, sh2=strip.height;
            const a1=(B[0]-A[0])/sw2, b1=(B[1]-A[1])/sw2;
            const c1=(C[0]-A[0])/sh2, d1=(C[1]-A[1])/sh2;
            if(!isFinite(a1)||!isFinite(d1)||Math.abs(a1*d1-b1*c1)<1e-7) continue;
            CFB.setTransform(a1*kx, b1*ky, c1*kx, d1*ky,
                             (A[0]-bx0)*kx, (A[1]-by0)*ky);
            const img2=(k2===nseg-1&&endp)?endp:strip;
            CFB.drawImage(img2, 0,0,img2.width,img2.height, 0,0,sw2,sh2);
          }
        }
        CFB.setTransform(1,0,0,1,0,0);
      }

      CFB.setTransform(1,0,0,1,0,0);
      {
        /* ── 曝光對齊 ──
           地面每一格都吃 (ambI+sunI*nl)*GRADE_EXPO×光色；城原本完全不吃，
           只有一層夜/夕的色罩。實測黃昏時城比腳下的地亮兩倍以上 ——
           使用者看到的「城的反光跟旁邊差太多」就是這個。
           這裡用**平坦法線 0.62**（城是貼在地面上的平面）走同一條式子，
           再除掉素材裡已經烘好的 VAL，免得同一份壓暗算兩次。
           ⚠ 只能用 source-atop 疊黑來做乘法：Canvas 的 multiply 走 source-over，
             會把整張緩衝連透明區一起填成實心色（這個坑 HANDOFF 記過）。
             疊黑 alpha=1-k 的結果正好是 c×k，數學上就是乘法。 */
        const shC=(LIT.amb+LIT.sun*0.62)*GRADE_EXPO;
        const kC=clamp(shC/CITY_BAKED_VAL*CITY_TRIM,0,1);
        if(kC<0.995){
          CFB.globalCompositeOperation='source-atop';
          CFB.fillStyle='rgba(0,0,0,'+(1-kC).toFixed(3)+')';
          CFB.fillRect(0,0,bwp,bhp);
          CFB.globalCompositeOperation='source-over';
        }
        /* 色相：亮度已經由上面那一步對齊，這裡只剩「光是什麼顏色」。
           所以 alpha 比舊版小得多（舊版那層同時在當壓暗用，才會壓成一坨橘）。 */
        const Sk=sky();
        const nA=clamp(1-Sk.day*1.2,0,1), dk=Sk.dusk;
        let tr=lerp(52,255,dk), tg=lerp(66,196,dk), tb=lerp(104,120,dk);
        /* ⚠ 色罩是 source-atop，也就是**往 tint 色 lerp**。tint 色如果比城本身亮，
           這一層就會把城**提亮** —— 而地形的光色是 r=cr*sh*lightR 的**乘法**，
           只會壓暗。兩者方向相反，黃昏就分家了：實測城在黃昏的絕對亮度 100.1，
           比正午的 69.9 還高（地形正確地由 84.8 降到 69.0），比值 1.45。
           修法是把 tint 拉回同一個曝光空間：乘上城這一幀實際吃到的曝光 kC，
           於是它只能換色、不能加亮。夜與黎明同一條式子一起修好。 */
        const tk=clamp(kC,0,1);
        tr=Math.round(tr*tk); tg=Math.round(tg*tk); tb=Math.round(tb*tk);
        const aa=clamp(nA*0.30+dk*0.16,0,0.34);
        if(aa>0.01){
          CFB.globalCompositeOperation='source-atop';
          CFB.fillStyle='rgba('+tr+','+tg+','+tb+','+aa.toFixed(3)+')';
          CFB.fillRect(0,0,bwp,bhp);
          CFB.globalCompositeOperation='source-over';
        }
      }
      /* 山稜遮擋：只有這一次貼回需要裁，而且只裁城真正佔到的那幾欄
         （外框已經算出來了）。整排 234 欄的裁切路徑要讓這張圖每個像素都付費。 */
      clipByCityDepth(sxk,syk,cc0,cc1);
      /* ⚠⚠ 這一次貼回**要開平滑**（ver -295）。城是畫進 bwp×bhp 的低解析緩衝
         再放大貼回的，放大比 bwp/fw 是分數，而 bx0/fw 每幀都隨相機變 ——
         最近鄰的取樣相位因此逐幀跳動：同一個目標像素這幀取這個 texel、
         下幀取隔壁那個，整片城就在抖。這就是「靜止看不出、一動才明顯」。
         ⚠ 實測（相機移 1 世界單位，比較城區與同高度的地形）：
             城區 差>30 的像素 1.28%　地形 0.01%　——  差一百倍。
           地形是直接畫在螢幕上、不經緩衝，所以沒有這個問題。
         ⚠ 關平滑是為了地形的像素感（見 resize），但城是**手繪插畫不是像素圖**，
           最近鄰在它身上只會製造雜訊。畫完立刻關回去還給地形。 */
      /* ⚠ 平滑維持開啟（ver -295 起）。格柵鎖住之後放大比是整數、原點也是整數，
         最近鄰在這裡已經是精確的；但緩衝**內部**的格線仍逐幀微動（walk 的步長
         隨深度連續變），雙線性順手把那一截也磨掉。實測次像素爬行
         雙線性 1.17×地形、最近鄰 1.30× —— 差不多，留原本的就好。 */
      ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality='high';
      ctx.drawImage(cityFB,0,0,bwp,bhp,LOCK?bx0:Math.round(bx0),LOCK?by0:Math.round(by0),fw,fh);
      ctx.imageSmoothingEnabled=false;
      /* 夜間路燈：城貼回去之後才畫，燈要在城上面。
         ⚠ 距離太遠就整批跳過：那個尺寸下每盞燈不到一個像素，畫了只是把城
           洗成一片亮斑，還要付幾百次 fillRect。 */
      /* ⚠ noLamps：聖王廳是聖座不是市街，不點市井燈火。 */
      if(nightK>0.06 && o.z<1800 && !o.s.noLamps){
        const LM=lampsFor(o.s,planImg);
        const hwL=o.s.planW*0.5, hhL=hwL*planImg.height/planImg.width;
        const caL=Math.cos(o.s.planRot), saL=Math.sin(o.s.planRot);
        const a2=clamp(nightK,0,1)*clamp((1800-o.z)/700,0,1);
        ctx.fillStyle='rgba(255,214,150,'+(0.85*a2).toFixed(3)+')';
        for(let i=0;i<LM.length;i+=2){
          const x2=LM[i]*hwL, y2=LM[i+1]*hhL;
          const q=project((x2*caL-y2*saL)/MAP_SCALE,(x2*saL+y2*caL)/MAP_SCALE,4);
          if(q[3]<60) continue;
          if(q[0]<bx0-4||q[0]>bx1+4||q[1]<by0-4||q[1]>by1+4) continue;
          const sz=q[2]>0.06?2:1;                    // 近一點的燈給 2px，遠的 1px
          ctx.fillRect(q[0]|0,q[1]|0,sz,sz);
        }
      }
      ctx.restore();
      continue;
    }
    /* ⚠ ver -445：底圖已由取樣層畫在地形上 —— 全解析插畫還沒載到（planImg null）
       時也**不要**退回程序生成的小房子，那會疊在插畫的街廓上（實測北方泊地
       遠看是一片白色小點蓋著插畫）。量體（牆與屋頂）等全解析與 atlas 到了才有，
       中間那一小段是「只有地面的城」—— 遠距離看不出差別。 */
    if(planCity){ ctx.restore(); continue; }
    /* ⚠ Settlement.draw 的 scale 是「每個**地圖像素**幾個螢幕像素」——
       s.radius 存的是地圖像素（同地圖畫面那邊傳 sc*MAP_SS）。
       sc 是每個**世界單位**幾個螢幕像素，兩者差一個 MAP_SCALE。
       直接傳 sc 的話整座城會縮小 20 倍 → screenDia 永遠 <20 → LOD 0，
       飛到城上空也只看得到一顆符號點。上面那行尺寸檢查用的 R 有乘
       MAP_SCALE，所以檢查會過、畫出來卻是點——兩邊單位不一致的典型病。 */
    Settlement.draw(ctx, o.s, { ox:o.x, oy:o.y, scale:sc*MAP_SCALE, tilt, night:nightK,
                                 rot:cam.angle, groundL:30, groundA:0.28,
                                 waterAt:seaProbe, project }, Settlement.DEBUG);
    ctx.restore();
  }
}

/* ══ 降落（ver -416，Ray：「靠近城鎮時加入降落按鈕，點擊進入城鎮預設畫面」）══
   ⚠ 只有**寫了 `town` 的聚落**才降得下去（見 SETTLEMENTS）——其餘的城還沒有城鎮內容。
   ⚠ 範圍用 `townEdgeR()`（市區外緣，同車站用的那一支，鐵律 7），再放寬一點點：
     那是「飛到城的上空」而不是「飛到城心正上方」。
   ⚠ 推棺中／戰鬥中／地圖開著時一律不顯示 —— 那幾拍玩家的注意力不在飛行上。
   ⚠ **每幀跑但只在狀態改變時碰 DOM**：`classList.toggle` 每幀呼叫會讓瀏覽器一直
     重算樣式（這一頁是 60fps 的 canvas，那個成本不是零）。 */
const LAND_K = 1.25;           // 判定半徑＝市區外緣的幾倍
let landTarget=null, landOn=false;
function nearestTown(){
  let best=null, bd=Infinity;
  for(const S of SETTLEMENTS){
    if(!S.town) continue;
    const d=Math.hypot(cam.x-S.x*MAP_SCALE, cam.y-S.y*MAP_SCALE);
    if(d < townEdgeR(S)*LAND_K && d<bd){ bd=d; best=S; }
  }
  return best;
}
function updateLandBtn(){
  const busy = battleGoing || mapOpen || (typeof booting!=='undefined' && booting);
  const S = busy ? null : nearestTown();
  const want = !!S;
  if(S!==landTarget){
    landTarget=S;
    const t=document.getElementById('landTxt');
    if(t && S) t.textContent='降落　'+S.n;
  }
  if(want!==landOn){
    landOn=want;
    const b=document.getElementById('landBtn'); if(b) b.classList.toggle('on', want);
  }
}
function doLand(){
  const S=landTarget; if(!S || !S.town) return;
  /* ⚠ **進入城鎮＝終止追擊**（ver -478，Ray：「進入城鎮也會終止追擊」）——
     追兵清掉、刷新計時重排；不清的話出城那一刻牠還貼在船尾，等於降落白降。 */
  enemy=null;
  enemyTimer=ENEMY_CFG.gapMin+Math.random()*(ENEMY_CFG.gapMax-ENEMY_CFG.gapMin);
  /* ⚠ **進入城鎮 1 小時**（ver -435，Ray：「進入其他城鎮或地圖 1 小時」）。
     ⚠ 記在這裡而不是進城之後：城鎮那一邊的計時是「每走一步 10 分鐘」，
       那是**城裡**的規矩；「飛過去降落」花掉的是大地圖的時間，兩者不能混（鐵律 7）。 */
  clockAdvance(HOUR);
  /* 內嵌：交給父頁開城鎮（同遭遇戰的作法，走 `__tivotFlight`）。 */
  if(embedded()){
    flightAudio(false);
    try{ window.parent.__tivotFlight.land(S.town); }catch(_){}
    return;
  }
  /* 獨立模式：寫一把「要降在哪」的鑰匙再跳最外層（主遊戲開機時讀了就清）。 */
  try{ localStorage.setItem('tivot_land_req_v1', JSON.stringify({ town:S.town })); }catch(e){}
  const url=new URL('../index.html', location.href).href;
  try{ (window.top||window).location.href=url; }catch(_){ location.href=url; }
}
document.getElementById('landBtn').addEventListener('click', e=>{ e.stopPropagation(); doLand(); });

/* ══ Stage 1 的地圖限制（ver -429，Ray 指定）══════════════════════════════
   「出地圖以後除了北方泊地之外所有地圖點入蕾娜都會說『別晃了，趕快往北方泊地去！』」
   ⚠⚠ 擋在 `enterPlace()` 這**唯一的入口**（鐵律 8）：日後多一條進地標的路
     （地圖上點、選單裡選…）也自動吃到，不必再擋一次。
   ⚠ 只在 **stage 1** 擋 —— 那正是「前往北方泊地」這一段任務還開著的時候。
     `gameStage()` 由主遊戲那一邊在 stage 0 結束時推到 1（§6.5.4.1）。
   ⚠ **降落（`doLand`）不擋**：那是回帝都的路，擋掉會把玩家困在天上。 */
/* ⚠⚠ **帝都也放行**（ver -432，Ray：「除了帝都與北方泊地都還不能進去」）——
   那是他剛出發的地方，擋掉等於回不了家。⚠ 寫成清單不是單一字串：
   日後多開一個地方只加一項（鐵律 1）。 */
const STAGE1_DEST = ['北方泊地', '帝都'];
const STAGE1_NAG  = [{ who:'renna', text:'別晃了，趕快往北方泊地去！' }];
function stage1Blocked(P){
  return gameStage()===1 && P && STAGE1_DEST.indexOf(P.name) < 0;
}

   蕾娜說溜嘴、諾薇兒接話。⚠ **只在打贏之後**演（`__flightResume({won:true})`）：
   ver -430 起打輸也會回到這一頁，而這一段的第一句是「小命保住了」。
   ⚠ 一輪只演一次 —— 旗標記在 `progress` 的 flags，所以讀檔會跟著回去（§6.9）。
   ⚠ `who` 帶表情差分（`renna/relief`），展開在 `say()`（見 pkey）。
   ⚠ `who:'player'` ＝**主角的空白對話框**：只有名字、沒有台詞，而且**不動台上的人**
     （§6.5：他不在台上，他說話不代表別人要換位）。 */
const AFTER_SHIP_FLAG = 'renna_recommend_talk';
const AFTER_SHIP_TALK = [

  { who:'nouvelle/surprise',  text:'咦？是團長推薦的嗎？' },

];

/* 進入地標（目前只做確認演出；之後接場景切換） */
let entering=null;
function enterPlace(P){

    /* ⚠ 已經在演別的對白就不插隊（同「對話」鈕的規矩）——兩段搶同一個舞台會疊在一起。 */
    if(!sayQueue) say(STAGE1_NAG, performance.now());
    return;
  }

  clockAdvance(HOUR);

/* ══════════════════════════════════════════════════════════════════════
   飛空艇：分層精靈（19 世紀蒸汽帆船，正俯視）

   ▍為什麼分層
   單張圖只能整張斜切，幅度一大船體就跟著歪。拆成「船體／帆／索具／
   螺旋槳／旗」之後，各組帆可以獨立甩動、而且帶不同的延遲係數：轉向時
   前帆先甩、後帆跟上，回正時同樣有先後差 —— 那個時間差才是「一艘大船
   在轉」的讀感來源，不是幅度。

   ▍素材放哪
   ship/ 之下，全部對齊同一張畫布（512×569）、透明背景、船艏朝上（12 點）：
     hull.png / sails_fore.png / sails_main.png / sails_aft.png
     rigging.png / prop_l.png / prop_r.png / flag.png        （後四者可省略）
   hull 是必要層：載得到才切進精靈模式，其餘缺哪張就跳過哪層。
   ⚠ 現況是由 split_ship.py 從單張 Ship_FLIGHT.png 自動拆出來的（美術給的是
     合成圖）。改圖時重跑該腳本即可；它會順便印出重心，就是下面的 artPivot。
     目前沒有 rigging/flag 兩層 —— 索具已隨各層帆一起切走（桁與側支索本來
     就該跟帆同動），旗子原圖沒有。

   ▍沒有素材時
   走 PROC 分支 —— 同一套動畫參數，圖層改由程序繪製（原本那艘小船拆成
   幾層，另補上螺旋槳與艉旗）。素材抽掉也不會開天窗。
   ⚠ 兩種模式的圖層錨點不同（程序船比例較扁、桅位不同），所以 layers 同時
     帶 pivot（程序用）與 artPivot（精靈用）兩組。
   ══════════════════════════════════════════════════════════════════════ */
const SHIP_DIR = './ship/';

const SHIP_VISUAL = {
  /* 船身佔畫布高度的比例。畫布空間 → 螢幕尺寸由它換算，
     換素材時若船在畫布裡佔比不同，只要動這一個值。
     現行素材上下都貼齊畫布（頂＝首斜桅尖、底＝艉舵）故為 1。 */
  artFill:  1.00,
  /* 精靈模式的放大倍率。程序船是粗線條，67px 就夠看；換成 1190px 的精描
     圖之後同樣尺寸會糊成一團，故放大。只影響顯示大小，不動任何手感參數。 */
  artZoom:  1.5,
  /* 顆粒度：船畫在低解析畫布上再最近鄰放大。
     1＝完全比照地形的解析度（BW/W，約 0.6），>1 較細、<1 更粗。
     精描的船直接畫在螢幕解析度會比 voxel 背景銳利一個檔次，像貼上去的。 */
  pixelScale: 1,
  pivot:    {x:0.50, y:0.60},    // 旋轉中心＝船身長度 60% 處（從艏往艉算）

  /* 甩動彈簧 —— 整套效果的核心。目標值由角速度決定，實際值用彈簧追過去，
     刻意讓它 overshoot：鬆手回正時會過中線一點再擺回來。
       回彈不夠明顯 → 降 swayDamp（0.80 附近）
       甩動太黏     → 提 swayStiff
       幅度不夠     → 提 swayGain                                        */
  swayGain: 42,      // 角速度（rad／60fps 幀）→ 目標甩動量
  swayStiff:0.055,
  swayDamp: 0.86,
  swayMax:  1.2,
  luff:     0.12,    // 甩動時的橫向壓縮＝洩風

  propBase: 0.35,    // 怠速轉速（rad／幀）
  propGain: 2.8,
  propBlur: 0.42,    // 高速殘影濃度

  bobAmp:   3.0,
  bobSpeed: 0.0016,

  sailStretch: 0.06,       // 滿帆時的縱向伸展
  sailDim:  [0.88, 0.12],  // 帆的不透明度＝base + fill*gain（洩風時稍暗）

  /* ── 風 ──────────────────────────────────────────────────────
     甩動只在轉向時發生，直行時帆是死的 —— 一艘靠風走的船不該這樣。
     這裡加一層與操作無關的持續擾動：陣風強度（gust）自己緩慢起伏，
     各層依錨點的前後位置吃不同相位 → 陣風由艏往艉掃過去。
     ⚠ 慢帆比滿帆抖得更兇、但漣漪更慢：停船時是鬆垮地飄，
       滿速時是繃緊了在細顫。這兩種質地的差別才是「風」的讀感，
       單純加大振幅只會變成帆在抽搐。
     flutter/ripple/billow 都吃 swayScale —— 同樣是為了在 100px 的顯示
     尺寸下讀得出來，改 artZoom 時一起連動，不必逐項重調。 */
  wind: {
    gain:    1.00,    // 總強度，0＝完全關掉風
    freq:    0.0021,  // 脈動頻率
    lag:     6.0,     // 層間相位差（乘上錨點 y）→ 陣風的行進
    flutter: 6.0,     // 縱向抖動（512 畫布像素）
    ripple:  0.020,   // 沿帆寬的縱向錯位（skewY；左右舷反向）
    billow:  0.16,    // 鼓脹／洩風（縱向縮放）
  },

  /* offset／skew 的統一倍率。
     ⚠ 規格的 14/11/8 是照「船在螢幕上約 400px 高」訂的，佔船長約 3.5%；
       我們只有約 100px，同樣的 3.5% 剩不到 2 個像素 —— 實測三態並排完全
       看不出差別。倍率拉到 3 才讀得出「帆先甩、船體不動」。
       再往上（實測 5）桁會明顯脫離桅杆，因為桅杆屬 hull 層不跟著動。
       改 artZoom 時這個值要跟著調：讀感取決於螢幕像素，不是畫布比例。 */
  swayScale: 3.0,

  /* 陣列順序＝繪製順序（由下往上）。
     offset／skew 以 512 寬的畫布為基準，實際畫布不是 512 時自動等比換算。
     ⚠ artPivot 是 split_ship.py 量出的各層重心，不是規格上的估值 ——
       這張圖是「單桅三段橫帆」而非三根桅杆分列船身，帆的分布比規格假設的
       更集中在前段，照抄 0.30/0.45/0.62 會讓斜切的支點落在帆外面。 */
  layers:[
    {key:'prop_l',     pivot:{x:.38,y:.90},                                    prop:-1, artPivot:{x:.386,y:.906}},
    {key:'prop_r',     pivot:{x:.62,y:.90},                                    prop: 1, artPivot:{x:.613,y:.906}},
    {key:'hull',       pivot:{x:.50,y:.60}, delay:0,    offset:0,  skew:0    },   // delay 0 → 不變形，錨點不影響
    {key:'rigging',    pivot:{x:.50,y:.55}, delay:0.55, offset:5,  skew:0.06 },
    {key:'sails_aft',  pivot:{x:.50,y:.79}, delay:0.70, offset:8,  skew:0.10, dim:1, artPivot:{x:.50,y:.467}},
    {key:'sails_main', pivot:{x:.50,y:.62}, delay:0.85, offset:11, skew:0.13, dim:1, artPivot:{x:.50,y:.273}},
    {key:'sails_fore', pivot:{x:.50,y:.39}, delay:1.00, offset:14, skew:0.16, dim:1, artPivot:{x:.50,y:.130}},
    {key:'flag',       pivot:{x:.50,y:.84}, delay:1.20, offset:18, skew:0.22, flag:1, artPivot:{x:.50,y:.20}},
  ]
};

/* ── 素材載入（缺圖不算失敗，該層跳過即可）─────────────────────────
   ⚠ Console 會固定出現 rigging.png / flag.png 兩筆 404 —— 那是刻意的：
     寧可少兩筆雜訊也要保住「把檔案丟進 ship/ 就自動生效」這件事，
     改成讀 manifest 就得多維護一份清單、還會忘記更新。不是 bug。 */
const SHIP_IMG={};
let SHIP_ART=null;                 // {w,h}：hull 載到才有值＝進入精靈模式
function loadShipArt(){
  const one=key=>new Promise(res=>{
    const im=new Image();
    im.onload =()=>{ SHIP_IMG[key]=im; res(); };
    im.onerror=()=>res();
    im.src=SHIP_DIR+key+'.png';
  });
  return Promise.all(SHIP_VISUAL.layers.map(L=>one(L.key))).then(()=>{
    const h=SHIP_IMG.hull;
    if(h && h.naturalWidth) SHIP_ART={w:h.naturalWidth,h:h.naturalHeight};
  });
}

/* ── 視覺狀態（純表現，不影響飛行物理）──────────────────────────── */
const ship={angVel:0,sway:0,swayVel:0,propAngle:0,bob:0,gust:0.5,_prevHeading:0};
function updateShipVisual(dt,now){
  const V=SHIP_VISUAL;
  /* 全程用「60fps 幀」當時間單位，和本檔其他跟隨式參數（ACCEL/BANK_EASE）
     同一套慣例。⚠ 不能照規格直接乘毫秒 dt —— 剛性 0.055 乘上 16.67 會讓
     彈簧一幀就飛出去，畫面上是抽搐不是甩動。 */
  const f=dt/16.67;

  let d=cam.angle-ship._prevHeading;
  while(d> Math.PI) d-=Math.PI*2;          // ±π 跨越
  while(d<-Math.PI) d+=Math.PI*2;
  ship._prevHeading=cam.angle;
  ship.angVel = f>1e-4 ? d/f : 0;

  /* cam.angle 遞減＝向右偏 → angVel<0 → sway<0 → 帆往畫面左方（＝彎道外側）甩。
     正負號剛好，不必再反相。滿舵時 angVel≈0.0183，×42≈0.77，離上限還有餘裕。 */
  const target=clamp(ship.angVel*V.swayGain,-1,1);
  const force =(target-ship.sway)*V.swayStiff;
  ship.swayVel=(ship.swayVel+force*f)*Math.pow(V.swayDamp,f);
  ship.sway   =clamp(ship.sway+ship.swayVel*f,-V.swayMax,V.swayMax);

  ship.propAngle+=(V.propBase+cam.speed*V.propGain)*f;

  /* 陣風：三個不可通約的正弦疊加成 0..1 的緩慢起伏。
     用 sin 而不是亂數，是因為亂數逐幀跳動會變成雜訊；要的是「一陣一陣」。
     頻率彼此不成整數倍 → 合成波不會回到同一個形狀，聽不出週期。 */
  const wt=now*V.wind.freq;
  ship.gust=clamp(0.5+0.30*Math.sin(wt)+0.14*Math.sin(wt*2.37+1.1)+0.06*Math.sin(wt*5.13+2.7),0,1);

  /* 上下飄動：兩個不同週期的正弦疊加，避免規律得像機械擺動。
     停船時也持續（浮空艇本來就浮著），只是幅度小一點。 */
  const idle=0.55+0.45*clamp(cam.speed/MAX_SPD,0,1);
  ship.bob=(Math.sin(now*V.bobSpeed)*V.bobAmp+Math.sin(now*V.bobSpeed*0.44)*V.bobAmp*0.6)*idle;
}

/* ── 繪製 ─────────────────────────────────────────────────────────
   船先畫在自己的低解析畫布（shipFB）上，再以最近鄰放大貼回主畫布。
   ⚠ 這是為了讓船的顆粒與地形一致：地形是 BW×BH 的緩衝放大到 W×VIEWH
     （約 1.67 倍、image-rendering:pixelated），船若照螢幕解析度直接畫，
     會比背景銳利一整個檔次 —— 看起來就是「貼上去的另一張圖」。
   ⚠ shipFB 內部仍開 imageSmoothing（精靈是 5 倍降取樣進來的，關掉會抖成
     馬賽克）；只有最後那一次放大關掉。顆粒感要來自放大，不是取樣失真。
   附帶好處：所有圖層的合成都在一張小畫布上完成，帆的 alpha 不會逐層
   疊在地形上（原本 0.88 的帆會透出背景，現在只透一次）。 */
let shipFB=null, SC=null;
let shipHit=null;          // {x,y,r}：船在螢幕上的命中圈，每幀由 drawShip 更新
function drawShip(now){
  const V=SHIP_VISUAL;
  const k=Math.min(2.9,W/135);
  const CW=SHIP_ART?SHIP_ART.w:512, CH=SHIP_ART?SHIP_ART.h:512;
  const uk=CW/512;                      // offset 的畫布基準換算
  const Z=SHIP_ART?V.artZoom:1;
  const S=(24*k*Z)/(CH*V.artFill);      // 畫布空間 → 螢幕（24＝程序船的高度單位）
  const fill=clamp(cam.speed/MAX_SPD,0,1);

  // 外接半徑：船的對角線 + 側傾轉出來的餘裕；尾流另外往下加長
  const R=Math.ceil(Math.hypot(CW*S*0.58, CH*S*0.64))+10;
  const WK=Math.ceil((14+54+10)*Z);
  const fw=R*2, fh=R*2+WK;                                  // 螢幕像素
  const pk=clamp(BW/W*V.pixelScale,0.15,1);
  const bw=Math.max(8,Math.round(fw*pk)), bh=Math.max(8,Math.round(fh*pk));
  if(!shipFB || shipFB.width!==bw || shipFB.height!==bh){
    shipFB=document.createElement('canvas'); shipFB.width=bw; shipFB.height=bh;
    SC=shipFB.getContext('2d');
  }
  SC.setTransform(1,0,0,1,0,0);
  SC.clearRect(0,0,bw,bh);
  SC.imageSmoothingEnabled=true;
  SC.scale(bw/fw,bh/fh);                // 之後一律用「螢幕像素」思考
  SC.translate(R,R);                    // 錨點＝原點

  drawWake(now,k,fill,S,CW,CH,Z);

  SC.save();
  SC.rotate(cam.bank);                  // 偏艏（世界不轉、船不依 heading 自轉）
  SC.scale(S,S);
  SC.translate(-CW*V.pivot.x,-CH*V.pivot.y);   // 讓 pivot 落在原點

  for(const L of V.layers){
    const img=SHIP_ART?SHIP_IMG[L.key]:null;
    if(SHIP_ART && !img) continue;               // 精靈模式缺這層＝略過
    const pv=(SHIP_ART&&L.artPivot)?L.artPivot:L.pivot;
    const px=CW*pv.x, py=CH*pv.y;

    SC.save();
    if(L.prop){ drawPropLayer(L,img,px,py,fill,CH); SC.restore(); continue; }

    const s=ship.sway*(L.delay||0);

    /* 風：只作用在帆，且**只走縱向**（畫面上下＝船的艏艉向）。
       ⚠ 橫向抖動會跟轉向甩動搶同一個軸，兩者一疊就分不出哪個是風、
         哪個是在轉彎；改成縱向之後兩者正交，各自讀得清楚。
       錯開分兩層：
         · 層與層：相位吃錨點 y（越靠船艉陣風越晚到）→ 由艏往艉掃過去
         · 單層之內：skewY 讓縱向位移隨離桅杆的距離增加 → 左右舷反向，
           像帆的外緣輪流吃到風、根部才跟上 */
    let sy=L.dim?1+fill*V.sailStretch:1, fy=0, fb=0;
    if(L.dim && V.wind.gain>0){
      const Wd=V.wind, taut=fill;
      /* ⚠ 繃緊時要「更小**也更慢**」。原本振幅隨速度變小、頻率卻變快 ——
         小振幅＋高頻＝震動，不是風。表風壓上來、帆被壓死不再拍動，
         剩下的是整片緩慢的呼吸；高頻細顫在 100px 上只會變成雜訊。 */
      const ph=now*Wd.freq*2.6*(1-0.20*taut) - pv.y*Wd.lag;
      const fl=(Math.sin(ph)+0.45*Math.sin(ph*2.31+1.7))*Wd.gain*ship.gust;
      const slack=1-0.72*taut;              // 鬆帆晃得兇、滿帆幾乎不動
      fy=fl*Wd.flutter*slack;               // 整片上下起伏
      fb=fl*Wd.ripple *slack;               // 沿帆寬的縱向錯位
      sy+=(ship.gust-0.5)*Wd.billow*Wd.gain*(0.35+0.65*taut);   // 鼓脹／洩風
    }

    SC.translate(px,py);
    /* ⚠ 斜切取負號：畫布 y 往下為正，帆位於錨點「前方」（靠船艏）的部分 y<0。
       要讓那一端甩得比根部更遠，就得 x += -s*skew*y。用規格上的正號會變成
       艏端往反方向落後，看起來像帆被折斷。 */
    SC.transform(
      1-Math.abs(s)*V.luff,             fb*V.swayScale,
      -s*(L.skew||0)*V.swayScale,       sy,
      s*(L.offset||0)*uk*V.swayScale,   fy*uk*V.swayScale
    );
    SC.translate(-px,-py);
    if(L.dim) SC.globalAlpha=V.sailDim[0]+fill*V.sailDim[1];

    if(L.flag)      drawFlagLayer(img,now,fill,CW,CH,px,py);
    else if(img)    SC.drawImage(img,0,0);
    else if(PROC[L.key]) PROC[L.key](CW,CH,fill);
    SC.restore();
  }
  SC.restore();

  /* ── 日照：船跟地形吃同一盞燈 ─────────────────────────────────
     船原本完全不吃日照，夜裡還是正午的白帆掛在暗掉的大陸上，像螢光貼紙
     （同瀑布先前的毛病，見 drawPanel 上方那段註解）。
     ⚠ 用 source-atop：它只作用在**已經不透明**的像素上，透明區不會被塗成
       方塊。若改用 multiply，Canvas 的 multiply 走 source-over 合成，
       會把整張離屏緩衝填成一塊實心色。
     ⚠ 上色在貼回主畫布**之前**、且在尾流之後 —— 尾流也是船的一部分，
       同一盞燈照著才對得起來。
     色調：入夜壓成銀藍（銀月是冷光），日夕之交偏暖橙。 */
  {
    const Sk=sky();
    const nightA=clamp(1-Sk.day*1.2,0,1);          // 入夜程度
    const dk=Sk.dusk;                               // 日夕之交
    const tr=Math.round(lerp(34,255,dk)), tg=Math.round(lerp(46,184,dk)), tb=Math.round(lerp(78,100,dk));
    const a=clamp(nightA*0.58*(1-dk*0.45)+dk*0.30,0,0.7);
    if(a>0.01){
      SC.setTransform(1,0,0,1,0,0);
      SC.globalCompositeOperation='source-atop';
      SC.fillStyle='rgba('+tr+','+tg+','+tb+','+a.toFixed(3)+')';
      SC.fillRect(0,0,bw,bh);
      SC.globalCompositeOperation='source-over';
    }
  }
  /* 貼回主畫布。⚠ 目的地座標取整：bob 帶小數的話，整片顆粒每幀都在
     半格上重新取樣、邊緣糊掉 —— 剛好抵消掉我們要的效果。 */
  const dx=Math.round(W/2-R), dy=Math.round(VIEWH*0.76+ship.bob-R);
  ctx.imageSmoothingEnabled=false;
  ctx.drawImage(shipFB,0,0,bw,bh,dx,dy,fw,fh);
  /* ── 探索冷卻完成：船的輪廓閃一下（Ray 指定）──────────────────────
     ⚠ 直接把**剛畫好的船緩衝**再疊一次就好 —— 它已經帶著船的 alpha，
       用 `lighter` 疊出來就是沿著輪廓的一圈光，不必另外做遮罩或描邊。
     ⚠ 放大一點點（1.06）才會讀成「輪廓在發光」而不是「整艘船變亮」。 */
  if(senseRdyFlash){
    const ft=(now-senseRdyFlash)/RDY_FLASH_MS;
    if(ft>=1) senseRdyFlash=0;
    else{
      const fa=Math.sin(Math.PI*clamp(ft,0,1));
      const gz=1.06, gw2=fw*gz, gh2=fh*gz;
      ctx.save();
      ctx.globalCompositeOperation='lighter';
      ctx.globalAlpha=0.55*fa;
      ctx.drawImage(shipFB,0,0,bw,bh, dx-(gw2-fw)/2, dy-(gh2-fh)/2, gw2, gh2);
      ctx.restore();
    }
  }
  /* 船的螢幕命中圈 —— 長按船身要靠它（見 stage 的 pointerdown）。
     ⚠ 半徑取 R*0.8 而不是 R：R 是外接圓，含側傾與尾流的餘裕，
       照它算的話船邊上一大圈空白也會被當成「按在船上」。 */
  shipHit={x:W/2, y:VIEWH*0.76+ship.bob, r:R*0.8};
}

/* 螺旋槳：高速時以較低 alpha 重繪兩次、角度各退一點＝殘影
   ⚠ 殘影間距取 π/6：四葉槳的葉距是 π/2，三個位置（0、π/6、π/3）剛好把
     葉距填滿成盤面。用規格的 0.25 弧度太密，滿速下每幀轉 8.7 弧度（遠大於
     葉距）會頻閃成亂跳，補那麼一點沒有用。 */
function drawPropLayer(L,img,px,py,fill,CH){
  const V=SHIP_VISUAL, R=CH*0.052;
  const ghosts=fill>0.22?2:0;
  for(let g=ghosts;g>=0;g--){
    SC.save();
    SC.translate(px,py);
    SC.rotate((ship.propAngle-g*0.524)*L.prop);
    SC.translate(-px,-py);
    if(g>0) SC.globalAlpha=V.propBlur*(1-g*0.34)*fill;
    if(img) SC.drawImage(img,0,0);
    else    PROC.prop(px,py,R);
    SC.restore();
  }
}

/* 旗：切成 6 條垂直帶逐條套正弦位移。windGain 由速度決定（垂下 → 平展） */
function drawFlagLayer(img,now,fill,CW,CH,px,py){
  const wind=0.4+0.6*fill;
  if(img){
    const strips=6, sw=img.width/strips;
    for(let i=0;i<strips;i++){
      const amp=Math.pow(i/strips,1.6)*5*wind*(CW/512);
      const dy=Math.sin(now*0.008-i*0.55)*amp;
      SC.drawImage(img, i*sw,0,sw,img.height, i*sw,dy,sw,img.height);
    }
    return;
  }
  PROC.flag(px,py,CH,wind,now);
}

/* ══ 程序圖層（無素材時的替身）══
   以「原型小船」的座標系作畫：y −15（艏）..+9（艉）、x ±12.5，原點對齊
   hull 錨點。procSpace 負責把它映射進畫布空間 —— 縮放後的線寬剛好等於
   原本 ctx.scale(k,k) 下的值，所以這些數字可以整包沿用。 */
function procSpace(CW,CH,fn){
  const V=SHIP_VISUAL;
  SC.save();
  SC.translate(CW*V.pivot.x, CH*V.pivot.y);
  SC.scale(CH*V.artFill/24, CH*V.artFill/24);
  fn();
  SC.restore();
}
function procSail(my,mh,sw,sh){
  SC.strokeStyle='#2b2419'; SC.lineWidth=0.7;
  SC.beginPath(); SC.moveTo(0,my); SC.lineTo(0,my-mh); SC.stroke();                    // 桅
  SC.beginPath(); SC.moveTo(-sw,my-mh*0.72); SC.lineTo(sw,my-mh*0.72); SC.stroke();    // 桁
  SC.fillStyle='rgba(226,219,198,.94)';
  SC.beginPath();
  SC.moveTo(-sw,my-mh*0.72);
  SC.quadraticCurveTo(0,my-mh*0.72+sh*0.34, sw,my-mh*0.72);
  SC.lineTo(sw*0.86,my-mh*0.72+sh); SC.quadraticCurveTo(0,my-mh*0.72+sh*1.3,-sw*0.86,my-mh*0.72+sh);
  SC.closePath(); SC.fill();
  SC.fillStyle='rgba(120,112,96,.28)';                                                 // 背光側
  SC.beginPath();
  SC.moveTo(0,my-mh*0.72); SC.lineTo(sw,my-mh*0.72);
  SC.lineTo(sw*0.86,my-mh*0.72+sh); SC.quadraticCurveTo(0,my-mh*0.72+sh*1.3,0,my-mh*0.72+sh);
  SC.closePath(); SC.fill();
}
const PROC={
  hull(CW,CH){ procSpace(CW,CH,()=>{
    // 船殼：尖艏、方艉，黑色塗裝配金線
    SC.fillStyle='#241f1a';
    SC.beginPath();
    SC.moveTo(0,-15); SC.quadraticCurveTo(4.6,-8, 5.0,0);
    SC.lineTo(4.2,9); SC.lineTo(-4.2,9); SC.lineTo(-5.0,0);
    SC.quadraticCurveTo(-4.6,-8, 0,-15); SC.closePath(); SC.fill();
    // 甲板
    SC.fillStyle='#8a7350';
    SC.beginPath();
    SC.moveTo(0,-12.4); SC.quadraticCurveTo(3.5,-7, 3.8,0);
    SC.lineTo(3.2,7.4); SC.lineTo(-3.2,7.4); SC.lineTo(-3.8,0);
    SC.quadraticCurveTo(-3.5,-7, 0,-12.4); SC.closePath(); SC.fill();
    // 舷側金線
    SC.strokeStyle='rgba(201,162,39,.55)'; SC.lineWidth=0.5;
    SC.beginPath(); SC.moveTo(-4.4,-1); SC.lineTo(-3.7,8); SC.moveTo(4.4,-1); SC.lineTo(3.7,8); SC.stroke();
    // 舷外浮翼（飛空艇的支撐翼）
    SC.fillStyle='#4a3f33';
    SC.beginPath(); SC.moveTo(-4.6,1); SC.lineTo(-12.5,4.2); SC.lineTo(-11.8,5.8); SC.lineTo(-4.4,4.6); SC.closePath(); SC.fill();
    SC.beginPath(); SC.moveTo(4.6,1); SC.lineTo(12.5,4.2); SC.lineTo(11.8,5.8); SC.lineTo(4.4,4.6); SC.closePath(); SC.fill();
    // 煙囪（主桅與後桅之間）
    SC.fillStyle='#1c1814'; SC.fillRect(-1.05,2.0,2.1,3.4);
    SC.fillStyle='#3a3128'; SC.fillRect(-1.05,2.0,2.1,0.8);
    // 艉燈
    SC.fillStyle='rgba(255,206,120,.9)';
    SC.beginPath(); SC.arc(0,8.2,0.75,0,Math.PI*2); SC.fill();
  }); },
  /* 索具：自各桅頂拉向艏艉的支索。獨立成層才吃得到 delay 0.55 的中段延遲 */
  rigging(CW,CH){ procSpace(CW,CH,()=>{
    SC.strokeStyle='rgba(43,36,25,.55)'; SC.lineWidth=0.28;
    SC.beginPath();
    SC.moveTo(0,-13.6); SC.lineTo(0,-8.4);
    SC.moveTo(0,-8.5);  SC.lineTo(-2.6,-2.2); SC.moveTo(0,-8.5); SC.lineTo(2.6,-2.2);
    SC.moveTo(0,-4.2);  SC.lineTo(-2.4,3.4);  SC.moveTo(0,-4.2); SC.lineTo(2.4,3.4);
    SC.moveTo(0,2.0);   SC.lineTo(-2.0,8.2);  SC.moveTo(0,2.0);  SC.lineTo(2.0,8.2);
    SC.stroke();
  }); },
  sails_fore(CW,CH){ procSpace(CW,CH,()=>procSail(-6.5,6.5,3.4,3.2)); },
  sails_main(CW,CH){ procSpace(CW,CH,()=>procSail( 0.5,9.0,4.6,4.4)); },
  sails_aft (CW,CH){ procSpace(CW,CH,()=>procSail( 6.0,6.0,3.2,3.0)); },
  /* 螺旋槳：四葉黃銅。旋轉已由 drawPropLayer 套好，這裡只畫靜態外形 */
  prop(px,py,R){
    SC.fillStyle='#b08d3c';
    for(let b=0;b<4;b++){
      SC.save();
      SC.translate(px,py); SC.rotate(b*Math.PI/2);
      SC.beginPath(); SC.ellipse(0,-R*0.60,R*0.23,R*0.60,0,0,Math.PI*2); SC.fill();
      SC.restore();
    }
    SC.fillStyle='#3a3128';
    SC.beginPath(); SC.arc(px,py,R*0.24,0,Math.PI*2); SC.fill();
  },
  /* 艉旗：三角旗，沿長度套遞增振幅的正弦（越外擺越大） */
  flag(px,py,CH,wind,now){
    const P=CH*SHIP_VISUAL.artFill/24, len=3.2*P, segs=8;
    const off=t=>Math.sin(now*0.008-t*3.4)*Math.pow(t,1.6)*1.9*P*wind;
    SC.beginPath();
    for(let i=0;i<=segs;i++){ const t=i/segs; SC.lineTo(px+off(t)-0.40*P*(1-t*0.85), py+t*len); }
    for(let i=segs;i>=0;i--){ const t=i/segs; SC.lineTo(px+off(t)+0.40*P*(1-t*0.85), py+t*len); }
    SC.closePath();
    SC.fillStyle='rgba(201,162,39,.82)'; SC.fill();
    SC.strokeStyle='rgba(43,36,25,.5)'; SC.lineWidth=0.16*P; SC.stroke();
  }
};

/* 尾跡：自兩具螺旋槳噴出的凝結尾（SOA 飛空艇那種）。
   ⚠ 出口要跟著螺旋槳走：偏艏時艉部連同螺旋槳會甩向彎道外側，出口不跟著
     移動的話，尾流會從船身中段憑空冒出來，而且轉彎時整束不動＝穿幫。
     所以起點吃 cam.bank 的旋轉（＝螺旋槳的實際去處），
     但尾巴本身留在螢幕空間往下拉 —— 那是航跡，不隨船身轉。
   ⚠ 偏向取 −cam.bank：船艏切進彎道，走過的航跡留在彎道外側（像開車右轉時
     後照鏡裡的路往左後方去）。與 bank 同向會看起來像整艘船在平移。
   位置直接讀 layers 裡兩個螺旋槳層的錨點，換素材時不必再對一次。 */
function drawWake(now,k,spd,S,CW,CH,Z){
  if(spd<=0.02) return;
  const V=SHIP_VISUAL;
  const cb=Math.cos(cam.bank), sb=Math.sin(cam.bank);
  const len=(14+spd*54)*Z, segs=16;
  SC.save(); SC.lineCap='round';
  for(const L of V.layers){
    if(!L.prop) continue;
    const pv=(SHIP_ART&&L.artPivot)?L.artPivot:L.pivot;
    const lx=(pv.x-V.pivot.x)*CW*S, ly=(pv.y-V.pivot.y)*CH*S;   // 槳軸相對旋轉中心
    const x0=lx*cb-ly*sb, y0=lx*sb+ly*cb;                        // 套上偏艏
    const side=L.prop;
    for(let i=0;i<segs;i++){
      const a0=i/segs, a1=(i+1)/segs;
      const wob =Math.sin(now*0.004+i*0.55+side)*1.5*a0*Z;   // 尾端輕微擺動＝亂流
      const wob2=Math.sin(now*0.004+(i+1)*0.55+side)*1.5*a1*Z;
      SC.globalAlpha=(1-a0)*(1-a0)*0.5*spd;
      SC.strokeStyle='#eef2f8';
      SC.lineWidth=(1.9-a0*1.5)*k*0.5*Z;
      SC.beginPath();
      SC.moveTo(x0+side*a0*5*k*Z+wob -cam.bank*22*a0*Z, y0+a0*len);
      SC.lineTo(x0+side*a1*5*k*Z+wob2-cam.bank*22*a1*Z, y0+a1*len);
      SC.stroke();
    }
  }
  SC.restore(); SC.globalAlpha=1;
}

function vignette(S){
  const v=ctx.createRadialGradient(W/2,VIEWH*0.5,VIEWH*0.34,W/2,VIEWH*0.5,VIEWH*1.05);
  v.addColorStop(0,'rgba(0,0,0,0)');
  v.addColorStop(1,`rgba(0,0,0,${lerp(0.44,0.42,S.day)})`);   // 夜裡有銀月，暗角不必再壓
  ctx.fillStyle=v; ctx.fillRect(0,0,W,VIEWH);
}

/* ══ 操作面板 ══
   舵輪（Wheel）裝在基座（Base）上 —— 基座頭部的那個圓孔就是舵軸的軸座，
   所以**輪轂必須落在軸孔上**，基座的腳則踩在操作區底緣。先前是各畫各的
   （輪轂在畫面底緣、基座另外擺在面板中央），看起來像基座被輪臂穿過去、
   浮在半空，那不是「裝上去」，是兩張圖疊在一起。
   ⚠ 兩張圖都已去透明留白後壓成 webp（1.4MB → 70/48KB）：這是飛行開場
     就要載的東西，原尺寸 PNG 會把開場拖長。
   ⚠ BORE / HEAD_R 是從 Base.webp 量出來的比例（軸孔中心、頭盤半徑）。
     webp 是 bbox 裁切後縮放的，**換圖就要重量**，否則輪轂會偏離軸孔。 */
const helmArt={ wheel:null, base:null, pointer:null };
(function loadHelm(){
  const one=(k,src)=>{ const im=new Image(); im.onload=()=>{helmArt[k]=im;}; im.src=src; };
  one('wheel','Wheel.webp'); one('base','Base.webp'); one('pointer','Pointer.webp');
})();
const BORE={x:0.4481,y:0.1581};          // Base.webp 軸孔中心（佔圖寬/圖高的比例）
const HEAD_R=0.2274;                     // 基座頭盤半徑佔基座寬的比例（95.5/420）
const WHEEL_SPIN=0.0052;                 // 舵量 → 舵輪角速度（rad/ms，滿舵約 0.83 轉/秒）
const HELM_FOOT=4;                       // 舵軸離畫面底緣的像素（軸心壓在底緣 → 只看得到上半輪）
const BASE_K=1.05;                       // 基座寬 ÷ 舵輪直徑（>1＝比畫面寬，左右由畫面裁掉）
const GAUGE_K=0.85;                      // 刻度帶半徑 ÷ 頭盤半徑（<1：整條刻度都落在頭盤黃銅面上）
const GAUGE_SPAN=Math.PI*2/3;            // 掛角 120°：10 點（零速）→ 12 點 → 2 點（滿速）
const GAUGE_RED=0.75;                    // 紅漆自滿速的 75% 起
const HOOK_LEN=0.32;                     // 銅針鉤長 ÷ 刻度環半徑（只有扣過盤緣的那截看得到）
const HOOK_W=0.42;                       // 鉤寬 ÷ 鉤長（素材原比例 0.8 太肥，橫向壓窄）
let wheelAng=0;

/* ── 機械式速度表（基座頭盤上的刻度環 + 扣在盤緣的銅針）──────────────
   讀法是**盤不動、銅針走**：刻度環刻在基座頭盤面上，銅針隨速度沿環滑動，
   10 點＝停船、12 點＝半速、2 點＝滿速（掛角 120°）。

   ⚠ 定位：這是**給舵手看的擺設**，不是玩家要盯的儀表 —— 油門實際上大家都
     拉到底，速度沒有判讀價值。所以它刻意做得不顯眼：對比壓低、不寫數字、
     被舵輪遮住不補救。要精確值去看地圖。之前為了「讀得到」把刻度打亮、把
     銅針提到舵前面，是把一個氣氛細節當成功能在做，方向就錯了。

   ⚠ 銅針的裝法：它**裝在盤面的背後**，針臂整根藏在頭盤後面（所以不畫），
     只有越過盤緣的那一小截由上方往下扣到盤面正面，扣住刻度環。畫面上看得到
     的就只有那個鉤。這也是為什麼不能把針畫在舵輪前面 —— 那等於一根尖銅片
     橫在舵輪與掌舵者之間，轉舵時手會掃過針尖。整組一律在舵**之後**。

   ⚠ 為什麼掛角是 120° 而不是整圈：軸心壓在畫面底緣，樞紐以下的角度全在畫面
     外，掛角一旦超過 180° 兩端就沒入畫面外。

   ⚠ 為什麼銅針不綁 cam.angle：那是絕對航向，船一轉整根就甩，既不是航向儀也
     不是速度計。控制區的方位帶已撤（要看航向去開地圖），這根專職速度。

   ⚠ tilt：頭盤是俯視的橢圓（縱向被壓扁），刻度與鉤一起套同一個縱向縮放，
     環才箍在盤上而不是浮在盤上。tilt 由素材比例自己算出來，換圖不用改。 */
function gaugeAngle(v){ return -GAUGE_SPAN*0.5+clamp(v,0,1)*GAUGE_SPAN; }   // 自 12 點順時針
const gaugeCA=a=>a-Math.PI*0.5;                 // 上式的角 → canvas arc 角

function drawSpeedScale(cx,cy,R,tilt){
  const dir=(a,r)=>[Math.sin(a)*r,-Math.cos(a)*r];
  ctx.save(); ctx.translate(cx,cy); ctx.scale(1,tilt);
  ctx.lineCap='butt';

  // 盤面上車出來的一道淺凹槽，刻線刻在裡面
  ctx.strokeStyle='rgba(14,10,5,.5)'; ctx.lineWidth=R*0.18;
  ctx.beginPath(); ctx.arc(0,0,R,gaugeCA(gaugeAngle(0)),gaugeCA(gaugeAngle(1))); ctx.stroke();
  // 凹槽內外緣各一道銅線（車出來的邊）
  ctx.strokeStyle='rgba(206,172,98,.32)'; ctx.lineWidth=Math.max(1,R*0.010);
  for(const k of [0.90,1.10]){
    ctx.beginPath(); ctx.arc(0,0,R*k,gaugeCA(gaugeAngle(0)),gaugeCA(gaugeAngle(1))); ctx.stroke();
  }

  // 刻線：每 0.5 一格，每 2.0 一根長刻。不寫數字。
  const n=Math.round(MAX_SPD*2);
  for(let i=0;i<=n;i++){
    const a=gaugeAngle(i/2/MAX_SPD), major=(i%4===0);
    const p0=dir(a,R*(major?0.905:0.955)), p1=dir(a,R*1.09);
    ctx.strokeStyle=major?'#dcc189':'#ac9260';
    ctx.lineWidth=major?Math.max(1.6,R*0.026):Math.max(1,R*0.013);
    ctx.beginPath(); ctx.moveTo(p0[0],p0[1]); ctx.lineTo(p1[0],p1[1]); ctx.stroke();
  }

  // 極速區段紅漆：自滿速的 GAUGE_RED 起到底，刷在凹槽外緣
  ctx.strokeStyle='#9e3625'; ctx.lineWidth=Math.max(1.4,R*0.030);
  ctx.beginPath();
  ctx.arc(0,0,R*1.135,gaugeCA(gaugeAngle(GAUGE_RED)),gaugeCA(gaugeAngle(1)));
  ctx.stroke();
  ctx.restore(); ctx.lineWidth=1;
}

/* 銅針：只畫「扣過盤緣」的那一截 —— 針臂在盤後，看不到就不畫。
   素材原本尖端朝上，這裡上下翻轉成尖端朝盤心，鉤身往外跨過盤緣，
   看起來就是由上方往下扣住刻度環。 */
function drawSpeedNeedle(cx,cy,R,tilt){
  const P=helmArt.pointer; if(!P) return;
  const len=R*HOOK_LEN, pw=len*HOOK_W;
  ctx.save(); ctx.translate(cx,cy); ctx.scale(1,tilt);
  ctx.rotate(gaugeAngle(clamp(cam.speed/MAX_SPD,0,1)));
  ctx.translate(0,-R*1.15);                     // 移到盤緣：鉤跨在這條線上
  ctx.scale(1,-1);                              // 翻轉 → 尖端朝盤心
  ctx.drawImage(P,-pw*0.5,-len*0.5,pw,len);
  ctx.restore();
}

function drawPanel(S){
  const y0=VIEWH, ph=H-VIEWH;
  const g=ctx.createLinearGradient(0,y0,0,H);
  g.addColorStop(0,'#12101a'); g.addColorStop(1,'#08070d');
  ctx.fillStyle=g; ctx.fillRect(0,y0,W,ph);
  ctx.strokeStyle='rgba(201,162,39,.55)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(0,y0+0.5); ctx.lineTo(W,y0+0.5); ctx.stroke();

  /* 舵輪 + 基座：一整組「裝好的舵」，以**舵為準心**取景。
       · 舵軸壓在畫面底緣（HELM_FOOT）→ 只看得到上半輪，把手切出畫面左右，
         那是站在舵後的視角；整輪縮進面板會變成一張圖示。
       · 半徑 R 由「上半輪頂端剛好突出 3D 視窗 HELM_OUT 像素」反推。
       · 基座軸孔對準舵轂（BORE），尺寸跟著舵走（BASE_K）——比畫面寬、
         腳也遠在畫面外，超出的部分直接讓畫面裁掉，不縮小求全。
     ⚠ 順序：基座 → 速度計 → 舵輪。舵輪最後畫才會遮住基座與銅針的一部分，
       那是「基座立在舵的另一側」該有的層次。 */
  const cx=W/2;
  const wcy=H-HELM_FOOT;                 // 舵軸：畫面底緣
  const R=wcy-(y0-HELM_OUT);             // 半徑：上半輪頂到 3D 視窗內 HELM_OUT

  /* ⚙ helm 素材必須用雙線性取樣。resize() 為了地形的像素感把整個 ctx 的
     imageSmoothingEnabled 關掉，但那對舵輪這種圓形素材是災難：512px 的圖
     縮放到非整數倍時，最近鄰會把圓周踩成階梯——輪框外緣與輪轂的銅環
     看起來就是「不圓」（尤其接近 1:1 的縮放比，邊緣會一格一格週期性進出）。
     這一段畫完再關回去（見函式尾），地形的 blit 不受影響。 */
  ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality='high';

  let gaugeR=R*0.47, tilt=0.86;          // 基座沒載到時的退路
  if(helmArt.base){
    const B=helmArt.base;
    const bw=R*2*BASE_K, bh=bw*B.height/B.width;
    // ⚠ 橫向用 BORE.x 而不是 0.5：軸孔本來就不在圖的正中央，
    //   用圖中心對齊會讓整座基座相對舵軸偏左。
    ctx.drawImage(B, cx-bw*BORE.x, wcy-bh*BORE.y, bw, bh);
    const headR=HEAD_R*bw;               // 頭盤橫向半徑
    gaugeR=headR*GAUGE_K;
    // 頭盤是俯視橢圓：縱向半徑＝軸孔到圖頂的距離，兩者相除即為縱向壓扁比例
    tilt=clamp((BORE.y*bh)/headR,0.5,1);
  }

  drawSpeedScale (cx,wcy,gaugeR,tilt);     // 刻度環：刻在頭盤面上
  drawSpeedNeedle(cx,wcy,gaugeR,tilt);     // 銅針：扣在盤緣上（針臂在盤後，不畫）

  /* 舵輪最後畫 —— 它在最前面，會遮住基座、刻度環與銅針的一部分。
     那是對的層次：基座立在舵的另一側，指針裝在盤背後。任何東西浮在舵之前，
     等於橫在舵輪與掌舵者之間，轉舵時手會掃過去。
     ⚠ 裁掉軸心以下：底緣那 HELM_FOOT 像素不該露出下半輪的一截。 */
  if(helmArt.wheel){
    ctx.save();
    ctx.beginPath(); ctx.rect(0,0,W,wcy); ctx.clip();
    ctx.translate(cx,wcy); ctx.rotate(wheelAng);
    ctx.drawImage(helmArt.wheel, -R, -R, R*2, R*2);
    ctx.restore();
  }
  ctx.imageSmoothingEnabled=false;         // 還給地形 blit（像素感靠它）
  /* ── 橫條羅盤帶：船與控制區之間 ───────────────────────────────
     位置定在 3D 視窗下緣、舵輪突出線之上（y0−HELM_OUT−24）——
     那正好是船的下方、面板的上方，兩者之間唯一的空檔。
     ⚠ 要避開舵輪突出的那一段（HELM_OUT），否則會被輪緣壓住。
     ⚠ 掃的是「方位」不是螢幕位置：先取最近的 15° 整數倍當基準，再算它
       此刻該落在螢幕哪裡。反過來寫（掃固定螢幕位置再問那裡是不是八方位）
       會變成 13 格裡只有三種可能值，得靠航向恰好對齊才命中方位字，
       實測只有約 13% 的航向看得到字，其餘時候整條只剩刻點。
       羅盤卡在轉、指標不動，本來就該這樣算。 */
  const deg=((-cam.angle*180/Math.PI)%360+360)%360;
  /* ⚠ 幾何走 compassRect()：疲勞對話框要與這一條同寬對齊，兩邊各寫一份會走鐘。 */
  const CR=compassRect();
  /* 對話中往下滑出並淡掉。進度由 loop() 推進，這裡只讀現值。 */
  const hid=talkHideEase();
  if(hid>=0.999) return;
  ctx.save();
  ctx.globalAlpha=1-hid;
  ctx.translate(0,talkHideDy()*hid);
  const bw2=CR.w-12, cbx=CR.x+6;                    // ⚠ 不能叫 bx，上面基座已用掉
  const ccy=CR.y+17;
  ctx.fillStyle='rgba(6,7,12,.55)';
  ctx.fillRect(CR.x,CR.y,CR.w,CR.h);
  ctx.save();
  ctx.beginPath(); ctx.rect(cbx,ccy-16,bw2,32); ctx.clip();
  ctx.font='10px "Noto Serif TC",serif'; ctx.textAlign='center';
  const base=Math.round(deg/15)*15;
  for(let k=-7;k<=7;k++){
    const a=base+k*15;                              // 這一格代表的方位
    const px=cbx+bw2/2+(a-deg)/90*(bw2/2);          // 相對航向 → 螢幕位置
    if(px<cbx-4||px>cbx+bw2+4) continue;
    const an=((a%360)+360)%360;
    const major=an%45===0;
    ctx.strokeStyle=major?'rgba(201,162,39,.65)':'rgba(216,205,180,.22)';
    ctx.beginPath(); ctx.moveTo(px,ccy+4); ctx.lineTo(px,ccy+(major?-2:1)); ctx.stroke();
    if(major){
      ctx.fillStyle='rgba(216,205,180,.75)';
      ctx.fillText(['北','東北','東','東南','南','西南','西','西北'][(an/45)%8],px,ccy-6);
    }
  }
  ctx.restore();
  /* ── Sturm 充能：從中間向兩邊發光 ──────────────────────────────
     ⚠ 用 `lighter` 疊加而不是實色覆蓋：方向計的刻度與方位字要透出來，
       蓋掉的話按住的兩秒等於看不到航向。
     ⚠ 漸層以**中線**為中心往兩側衰減，所以視覺上是「從中間長出去」，
       而不是一整條同時變亮 —— Ray 指定的就是這個方向感。 */
  {
    const nowS=performance.now();
    /* ── 冷卻中：一條**細而暗**的進度，同樣從中間往兩邊長 ────────────
       ⚠ 與「正在充能」共用方向感（都從中間長出去），但**亮度與厚度差一個量級**
         —— 兩者要能一眼分開：亮而滿版＝手指按著在充，暗而細＝在等冷卻。 */
    if(sturmReady>nowS){
      const cd=clamp(1-(sturmReady-nowS)/STURM_CD_MS,0,1);
      const cx0=cbx+bw2/2, hf=bw2*0.5*cd;
      const gg=ctx.createLinearGradient(cx0-hf,0,cx0+hf,0);
      gg.addColorStop(0,'rgba(201,162,39,0)');
      gg.addColorStop(0.5,'rgba(201,162,39,.42)');
      gg.addColorStop(1,'rgba(201,162,39,0)');
      ctx.fillStyle=gg;
      ctx.fillRect(cx0-hf, CR.y+CR.h-3, hf*2, 2);
    }
    /* ── 冷卻完成：閃一下（Ray 指定「讓玩家知道 CD 完成」）────────────
       ⚠ 一次性、短：邊緣觸發設的旗標，時間到就自己歸零，不會一直閃。 */
    if(sturmRdyFlash){
      const ft=(nowS-sturmRdyFlash)/RDY_FLASH_MS;
      if(ft>=1) sturmRdyFlash=0;
      else{
        const fa=Math.sin(Math.PI*clamp(ft,0,1));
        ctx.save();
        ctx.globalCompositeOperation='lighter';
        ctx.fillStyle='rgba(255,226,140,'+(0.28*fa).toFixed(3)+')';
        ctx.fillRect(CR.x,CR.y,CR.w,CR.h);
        ctx.restore();
        ctx.strokeStyle='rgba(255,226,140,'+(0.95*fa).toFixed(3)+')';
        ctx.lineWidth=1.5;
        ctx.strokeRect(CR.x+0.75,CR.y+0.75,CR.w-1.5,CR.h-1.5);
      }
    }
    const p = sturmT0 ? clamp((nowS-sturmT0)/STURM_HOLD_MS,0,1) : 0;
    if(p>0.001){
      const cx=cbx+bw2/2, half=bw2*0.5*p;
      const g=ctx.createLinearGradient(cx-half,0,cx+half,0);
      g.addColorStop(0,   'rgba(201,162,39,0)');
      g.addColorStop(0.5, 'rgba(255,226,140,'+(0.30+0.45*p).toFixed(3)+')');
      g.addColorStop(1,   'rgba(201,162,39,0)');
      ctx.save();
      ctx.globalCompositeOperation='lighter';
      ctx.fillStyle=g;
      ctx.fillRect(cx-half, CR.y, half*2, CR.h);
      ctx.restore();
      /* 充滿的那一刻把整條描一圈金邊，給一個明確的「可以放手了」。 */
      if(p>=1){
        ctx.strokeStyle='rgba(255,226,140,.9)'; ctx.lineWidth=1.5;
        ctx.strokeRect(CR.x+0.75,CR.y+0.75,CR.w-1.5,CR.h-1.5);
      }
    }
  }
  ctx.strokeStyle='#c9a227';                        // 中央指標（不動）
  ctx.beginPath(); ctx.moveTo(cbx+bw2/2,ccy-16); ctx.lineTo(cbx+bw2/2,ccy+9); ctx.stroke();
  ctx.restore();          // ⚠ 對應收起動畫那個 save（translate + globalAlpha）
  ctx.textAlign='left';
}

/* ── 主迴圈 ─────────────────────────────────────────────────────── */
let last=performance.now(),acc=0,n=0;
/* ── 畫質調節器 ───────────────────────────────────────────────────
   收集每幀的**工作時間**（不是 rAF 間隔，理由見 QUALITY 的說明），取中位數。
   一幀的預算是 16.7ms，但瀏覽器自己的合成、GC、事件處理也要吃 —— 所以
   守的是 12ms，留 4~5ms 餘裕。
   ⚠ 樣本要夠多才動：單幀的尖峰（GC、載入城的貼圖、切歌）到處都是，
     看一幀就降級的話會在載入途中無緣無故掉到最低畫質再也回不來。
   ⚠ 升級要看更久、門檻更低（7ms），而且升上去之後把計數清掉重新觀察 ——
     升到一半又掉下來會變成每兩秒抖一次，比一直待在低畫質更難看。 */
const QF=[]; let qCool=0;
function qualityTick(workMs){
  if(qLocked) return;
  QF.push(workMs);
  if(QF.length<40) return;
  if(QF.length>90) QF.shift();
  if(qCool>0){ qCool--; return; }
  const a=QF.slice().sort((x,y)=>x-y), med=a[a.length>>1];
  if(med>12 && qLevel<QUALITY.length-1){ qLevel++; onQualityChange(); }
  else if(med<7 && qLevel>0 && QF.length>=90){ qLevel--; onQualityChange(); }
}
function onQualityChange(){
  QF.length=0;
  qCool=90;          // 換檔後靜置約 1.5 秒再評，避免 resize 那一兩幀被算進去
  resize();          // 排程重建（真正的重建在下一幀開頭，見 resize 的說明）
  /* ⚠ 預縮圖的清除已搬進 applyResize —— 要跟 DPR **實際**改變的那一刻同步。
     留在這裡的話，清掉之後到下一幀重建之間若有人重畫立繪，會用舊 DPR
     再生一份並留下來。 */
}

function loop(now){
  const dt=Math.min(40,now-last); last=now;
  /* ⚠⚠ 父頁說停（畫面收起／戰鬥中／整備・設定窗蓋著）＝整幀跳過（ver -481）：
     不更新也不畫 —— 反正看不見。dt 已經吃掉（last=now），恢復那一幀不會補跑。 */
  if(extPaused){ requestAnimationFrame(loop); return; }
  flushResize();     // 重建畫布只在這裡發生 —— 緊接著就是 render，不會露出空畫布
  talkHideStep(now); // ⚠ 方向計收合進度：一定要在這裡推，不能掛在 drawTalk（見該處說明）
  /* ⚠⚠ **對話中＝遊戲暫停**（ver -481，Ray：「對話期間不要生怪…一邊點對話一邊怪
     往我衝過來，對話都點不完」）：世界不推（船、怪、刷新計時、火車、軟邊界），
     只畫（立繪與框在 render 裡）＋ 音樂淡接照走。對白一收，下一幀世界接著動 ——
     出薩梅爾的劇本蜈蚣也是在那一幀立刻刷（scriptedDue 不排隊）。 */
  const talking = !!(sayQueue && !sayEndAt);
  if(talking){ render(now); updateBgm(dt); requestAnimationFrame(loop); return; }
  edgeNag(now);      // 快飛出圖了 → 蕾娜叫你回頭（軟邊界）
  const wt0=performance.now();
  update(dt,now); updateRegion(now); updateTrains(dt/1000); render(now); updateBgm(dt); updateMapMe();
  updateLandBtn();
  qualityTick(performance.now()-wt0);
  acc+=dt;n++;
  /* HUD 加上**地圖座標與航向** —— 截圖時才知道人在哪。
     先前每次回報都得靠地形猜位置，猜錯就修錯地方。座標用地圖像素
     （與 SETTLEMENTS／build_city.py 同一套單位），可以直接拿去對資料。 */
  if(acc>500){
    const mx=Math.round(cam.x/MAP_SCALE), my=Math.round(cam.y/MAP_SCALE);
    const deg=Math.round(((cam.angle*180/Math.PI)%360+360)%360);
    /* ⚠ 版本號一定要在 HUD 上（ver -307）。先前有整整一輪的來回是因為分不清
       「回報的畫面跑的是哪一版」—— 我量到改善、Ray 看到一模一樣，兩邊講的
       其實可能不是同一份程式。截圖裡看得到版本，這一整類誤會就消失了。
       ⚠ 這一頁是獨立的 HTML，讀不到 config.js 的 VERSION（那是 ESM），
         所以在建置時由 tools 同步；沒同步到就會停在舊字串，看到不合的
         版本號先查這裡。 */
    document.getElementById('fps').textContent=
      FLIGHT_VER+'  '+Math.round(1000/(acc/n))+' fps '+BW+'×'+BH+' q'+qLevel+(qLocked?'!':'')
      +'  ('+mx+','+my+') '+deg+'° h'+Math.round(cam.alt);
    acc=0;n=0;
  }
  requestAnimationFrame(loop);
}

/* ══ 載入畫面 ══
   ⚠ 這是**獨立的一份**，不共用主程式的 #assetLoader。樣式照搬（金色進度圈
     ＋監察官立繪＋對話框輪播），但提示內容自成一組 —— 這裡日後要放
     船艦／航行教學，跟戰鬥那側的教學是兩回事，共用的話改一邊就會動到另一邊。
   ⚠ 立繪路徑指向 ../resources/：飛行原型自己不重複放一份立繪。 */
/* 操作說明：輪播在讀取畫面上（Ray 指定放回來）。
   ⚠ 只有這一份會出現字。圈內字樣仍是 SAINT INSTALL，**階段名稱不放回來** ——
     那是給讀程式的人看的，留在呼叫端當註解就好。 */
const BOOT_HINTS=[
  '往後拉＝前進，拉得越遠越快。放開後船靠慣性滑行，不會立刻停。',
  '左右偏移＝轉向。輕推只轉幾度，中央有一段死區，手指的晃動不會讓船偏航。',
  '往前推再左右拉＝原地迴轉。停著不動時船不會自己打轉。',
  '舵輪的轉速跟著你的偏移幅度走；基座頭盤上那根銅針是舵手的速度表，扣到紅漆那段就是全速。',
  '右上角「地圖」可查看大陸全貌與自己的位置，放大可見市鎮街廓。',
  '大陸邊緣之外是雲海。低於雲海高度的地方一律沒入雲中。',
  '長按船身可請安雅感應四周；找到的地點會留在地圖上。連按會累壞她，隔一會兒再試。',
];
/* ══ 讀取頁的說明者（ver -425，Ray：「出航之後換成蕾娜」）══════════════════
   ⚠⚠ 這是 `config.loadingHost` 的**第二份**（這一頁是非 module 的獨立文件，
     import 不到那一份）—— **改一邊要改另一邊**（鐵律 7 的但書）。
   ⚠ 旗標與主遊戲共用同一把鑰匙（`tivot_flags_v1`，§6.10）。 */
const BOOT_HOST = {
  flag:'set_sail',
  before:{ name:'監察官　フレイヤ', img:'../resources/inspector/Freya_SI_01.webp' },
  after: { name:'蕾娜',            img:'../resources/SI/Renna_SI_front.webp' },
};
function bootHost(){
  return flagOn(BOOT_HOST.flag) ? BOOT_HOST.after : BOOT_HOST.before;
}
const bootUI=(()=>{
  const $=id=>document.getElementById(id);
  const RING=301.59;   // r=48 的周長（與主程式 #alRingProg 同規格）
  // 節奏同主程式讀取畫面：洗牌後依序循環（＝隨機且整輪不重複），
  //   淡入 → 停 HOLD(5s) → 淡出 → FADE+50 後換句（HOLD/FADE 值同 config.tuning）
  const HOLD=5000, FADE=400;
  /* 光圈／立繪自己淡進淡出的長度。⚠ 與上面 CSS 的 `#boot #bRing{transition:.26s}`
     同一個量（改一邊要看另一邊）。 */
  const BLANK_MS=260;
  const hints=BOOT_HINTS.slice();
  for(let i=hints.length-1;i>0;i--){ const j=Math.random()*(i+1)|0; [hints[i],hints[j]]=[hints[j],hints[i]]; }
  let hintI=0, timer=0;
  const im=$('bPortrait');
  im.onload=()=>im.classList.add('on');
  const host=bootHost();
  im.src=host.img;
  $('bName').textContent=host.name;
  function cycle(){
    const h=$('bHint');
    h.textContent=hints[hintI++ % hints.length];
    h.classList.add('on');                       // 淡入
    timer=setTimeout(()=>{
      h.classList.remove('on');                  // 淡出
      timer=setTimeout(cycle, FADE+50);
    }, HOLD);
  }
  cycle();
  /* 進場：這一層本來就是全黑的（`#boot` 的底色），先把內容藏起來、隔一幀再亮 ——
     於是玩家看到的是「黑 → 光圈浮出來」，而不是連黑帶光圈一起硬切上來。
     ⚠ 要隔一幀（`requestAnimationFrame` 兩次）才拿得掉，同主程式 showLoader 的理由：
       同一幀加上又拿掉會被合併成一次計算，過場整個跳掉。 */
  {
    const b=$('boot');
    if(b){
      b.classList.add('blank');
      requestAnimationFrame(()=>requestAnimationFrame(()=>b.classList.remove('blank')));
    }
  }
  return {
    /* ⚠ 只推進度，不寫字。階段名稱留在呼叫端當註解 —— 那是給讀程式的人看的，
       不是給玩家看的（Ray 指定讀取畫面只出現 SAINT INSTALL）。 */
    set(p){
      $('bProg').setAttribute('stroke-dashoffset', (RING*(1-clamp(p,0,1))).toFixed(1));
      $('bPct').textContent=Math.round(clamp(p,0,1)*100)+'%';
    },
    /* ⚠ 黑色淡出（ver -433）：先淡，淡完才 `display:none`（見那一段 CSS）。
       ⚠⚠ **兩段**（ver -439）：先把光圈與立繪收掉（`.blank`，剩一片黑），
         再把黑掀開 —— 直接淡整層的話玩家會看到光圈與飛行畫面疊在一起。 */
    done(){ clearTimeout(timer); const b=$('boot'); if(!b) return;
      b.classList.add('blank');
      setTimeout(()=>{
        b.classList.add('fade');
        setTimeout(()=>b.classList.add('hide'), 480);
      }, BLANK_MS); },
  };
})();

/* ⚠⚠ **音效全部 → 圖 → BGM，音效不載完不放行**（ver -430，Ray 指定的全域規則，
   憲法 §6.6）。這一頁以前是**反過來的**：地形與船艦圖先跑完、讀取頁收掉，
   感應心跳／神楽鈴／Sturm 那幾支要等 1.2 秒後才在背景抓 —— 慢網下長按感應時
   心跳根本還沒到手。
   ⚠ 這一頁的音效走 **HTMLAudio**（不是主遊戲的 WebAudio 解碼），所以「載完」＝
     `canplaythrough`。逐支給 8 秒的保底：一支抓不到不能把整頁擋死。
   ⚠ 環境音與 BGM **不在這一段**：它們排在最後（`makeLoop` 自己 `preload='auto'`），
     而且晚到只是晚幾百毫秒起播。 */
function preloadSfx(){
  const list=[senseBeat, senseSE, sturmSE, kerbPopSE].filter(Boolean);
  return Promise.all(list.map(a=>new Promise(res=>{
    if(a.readyState>=4) return res();
    const fin=()=>{ a.removeEventListener('canplaythrough',fin); a.removeEventListener('error',fin); res(); };
    a.addEventListener('canplaythrough',fin); a.addEventListener('error',fin);
    setTimeout(fin, 8000);            // 保底：一支卡住不能擋死整頁
    try{ a.load(); }catch(_){ fin(); }
  })));
}
(async()=>{
  const t0=performance.now();
  try{
    bootUI.set(0.04);   // ① 音效（不設總時限，見 preloadSfx）
    await preloadSfx();
    bootUI.set(0.10);   // 準備雜訊貼圖…
    genCloudTex(); genDetail(); genStrat();
    bootUI.set(0.16);
    await loadWorld();  // ② 圖
    bootUI.set(0.82);   // 載入船艦圖層…
    // 船的素材缺了也照跑（走程序圖層），所以不放進上面的 try 依賴鏈裡擋開場
    await loadShipArt();
    initPuffs();
    initStars();
    bootUI.set(1);
    window.__loadMs=Math.round(performance.now()-t0);
    // 感應的立繪與各角色立繪：開場跑完才在背景抓（圖晚到不會壞，音效已經在上面等過了）
    setTimeout(()=>{ senseArt();
                     for(const k in PORTRAIT) portraitArt(k); }, 1200);
    window.__map=MAPW+'×'+MAPH;
    // 進度圈跑到滿再收，不要瞬間閃掉
    setTimeout(()=>bootUI.done(),260);
    requestAnimationFrame(loop);
  }catch(e){
    document.getElementById('bootMsg').textContent=e.message+'（需以 http 提供，不能直接雙擊開啟）';
  }
})();
</script>
<!-- 道具欄：主遊戲的模組（ES module，與這一頁其餘的一般 <script> 並存）。 -->
<script type="module">
  import { showBag } from '../modules/loot.js';
  const b=document.getElementById('bagBtn');
  if(b) b.addEventListener('click', e=>{ e.preventDefault(); showBag(); });
</script>
