     玩家會誤讀成正在被攻擊。改成綠只比紅低一點點，色相就落在金黃而不是紅。 */
  const lightR=lerp(lerp(0.80,1.0,S.day),1.14,S.dusk);
  const lightG=lerp(lerp(0.86,1.0,S.day),1.02,S.dusk);
  const lightB=lerp(lerp(1.04,1.0,S.day),0.76,S.dusk);

  /* 當幀的光照存起來：城是畫在自己的緩衝上的，拿不到這些區域變數，
     但它必須跟地面吃**同一盞燈**，否則黎明黃昏時城會亮得像另一個時區。 */
  LIT.amb=ambI; LIT.sun=sunI; LIT.r=lightR; LIT.g=lightG; LIT.b=lightB;

  const sinp=Math.sin(cam.angle), cosp=Math.cos(cam.angle);
  const FOGS=ZFAR*FOG_START;
  const fr=SC.hz[0], fg=SC.hz[1], fb=SC.hz[2];
  /* ⚠ 不取整。原本 (now*0.006)|0 每 167ms 才跳一個地圖像素（＝20 世界單位），
     位移是整數台階 → 看起來就是 6fps 的抽動，跟畫面的 60fps 無關。
     速度維持不變，只是改成連續值，再配合下方的雙線性取樣才會順。 */
  const cloudScroll=now*0.006;
  const cloudLit=lerp(0.80,1.0,S.day);   // 銀月照著，夜裡的雲不該是灰的

  let z=1.0, dz=0.75;
  while(z<ZFAR){
    let plx=(-cosp*z-sinp*z)+cam.x, ply=(sinp*z-cosp*z)+cam.y;
    const prx=(cosp*z-sinp*z)+cam.x, pry=(-sinp*z-cosp*z)+cam.y;
    const ddx=(prx-plx)/BW, ddy=(pry-ply)/BW;
    const fog=clamp((z-FOGS)/(ZFAR-FOGS),0,1)*FOG_MAX;
    const invz=1/z;
    /* 林草層的強度隨深度淡出（近景滿、GEO_FAR 之後歸零）。
       每個 z 步進算一次就好 —— 同一步進的整排欄位深度相同。 */
    const vegAmt=GEO_AMP*(z<GEO_FAR?1-(z/GEO_FAR)*(z/GEO_FAR):0);
    const vegOn=vegAmt>0.004;

    for(let i=0;i<BW;i++){
      // 世界座標 → 地圖像素
      const mfx=plx*INV_SCALE, mfy=ply*INV_SCALE;
      const xi=mfx|0, yi=mfy|0;
      let hh,r,g,b,isRiver=0;
      const outside=(xi<0||yi<0||xi>=MAPW||yi>=MAPH);
      const mi=outside?0:yi*MAPW+xi;
      const th=outside?0:HGT[mi];
      if(outside||th<=CLOUD_H){
        /* 雲海：連續位移 + 雙線性取樣。位移與取樣都不再有整數台階，
           流動才會順（原本兩者都是整數，雲每 167ms 才動一格）。
           ⚠ 先加 4096（CT 的倍數）確保為正：負數的 |0 是往零截斷，
             小數部分會變成負的，內插權重就全錯了。 */
        const cfx=mfx+cloudScroll+4096, cfy=mfy+cloudScroll+4096;
        const cx0=cfx|0, cy0=cfy|0, cu=cfx-cx0, cv=cfy-cy0;
        const rw0=(cy0&CTM)*CT, rw1=((cy0+1)&CTM)*CT;
        const cA=cx0&CTM, cB=(cx0+1)&CTM;
        const j00=rw0+cA, j10=rw0+cB, j01=rw1+cA, j11=rw1+cB;
        const w00=(1-cu)*(1-cv), w10=cu*(1-cv), w01=(1-cu)*cv, w11=cu*cv;
        hh=CLOUD_H+(CLOUDH[j00]*w00+CLOUDH[j10]*w10+CLOUDH[j01]*w01+CLOUDH[j11]*w11);
        const q00=CLOUDTEX[j00], q10=CLOUDTEX[j10], q01=CLOUDTEX[j01], q11=CLOUDTEX[j11];
        r=((q00&255)*w00+(q10&255)*w10+(q01&255)*w01+(q11&255)*w11)*cloudLit;
        g=(((q00>>8)&255)*w00+((q10>>8)&255)*w10+((q01>>8)&255)*w01+((q11>>8)&255)*w11)*cloudLit;
        b=(((q00>>16)&255)*w00+((q10>>16)&255)*w10+((q01>>16)&255)*w01+((q11>>16)&255)*w11)*cloudLit;
      }else{
        /* 雙線性取樣高度。⚠ 近景一個地圖像素橫跨約 33 個緩衝像素
           （MAP_SCALE 20 之後更明顯），最近鄰會把地表切成 20 世界單位寬的
           台階，走過去像在爬樓梯。四角內插把台階變成斜面。
           ⚠ 只在「四角都是陸地」時才內插：靠海岸時鄰格是雲海高度 0，
             內插會把大陸邊緣拉成緩坡，斷崖就沒了 —— 那正是浮空大陸的賣點。 */
        const x1=xi<MAPW-1?xi+1:xi, y1=yi<MAPH-1?yi+1:yi;
        const i10=yi*MAPW+x1, i01=y1*MAPW+xi, i11=y1*MAPW+x1;
        const h10=HGT[i10], h01=HGT[i01], h11=HGT[i11];
        let cr,cg,cb;
        if(h10>CLOUD_H && h01>CLOUD_H && h11>CLOUD_H){
          const tx=mfx-xi, ty=mfy-yi;
          const a0=th+(h10-th)*tx, a1=h01+(h11-h01)*tx;
          hh=a0+(a1-a0)*ty;
          /* 顏色也要內插。⚠ 只做高度不做顏色的話，地形是平順的但貼圖仍是
             20 世界單位一格的色塊 —— 那正是「馬賽克太重」的來源，
             而且形狀變平順之後色塊反而更顯眼。 */
          const c00=COL[mi], c10=COL[i10], c01=COL[i01], c11=COL[i11];
          const w00=(1-tx)*(1-ty), w10=tx*(1-ty), w01=(1-tx)*ty, w11=tx*ty;
          cr=(c00&255)*w00+(c10&255)*w10+(c01&255)*w01+(c11&255)*w11;
          cg=((c00>>8)&255)*w00+((c10>>8)&255)*w10+((c01>>8)&255)*w01+((c11>>8)&255)*w11;
          cb=((c00>>16)&255)*w00+((c10>>16)&255)*w10+((c01>>16)&255)*w01+((c11>>16)&255)*w11;
        }else{
          hh=th;
          const c=COL[mi];
          cr=c&255; cg=(c>>8)&255; cb=(c>>16)&255;
        }
        // 高頻細節：在世界座標上取樣，補回被放大糊掉的近景起伏
        const dt=DETH[(((ply|0)&DTM)*DET_TILE)+((plx|0)&DTM)];
        hh+=dt*(DET_AMP/127);
        /* ── 可見性早退 ─────────────────────────────────────────
           這個迴圈每幀跑約 17 萬次（約 744 個深度步進 × 234 欄），但真正寫進
           畫面的只有一小部分 —— 其餘的取樣算完顏色就被更近的地形蓋掉了。
           地貌貼圖那一層進來之後，那段浪費從「有點可惜」變成手機掉幀的主因。
           高度已經算完，投影只要四則運算：先算出這一筆會落在哪一列，
           被蓋住就直接跳過**地貌層＋打光＋分級**整段。
           ⚠ `|` 的優先序低於 `>=`，`a|0 >= b` 會被解析成 `a | (0>=b)`。
             一定要自己加括號。
           ⚠ ybuf/prevH/ybufZ 不用補：它們本來就只在「畫得出來」時才更新。
           ⚠⚠ 但 **plx/ply 一定要補**。這一列的世界座標是靠迴圈尾端
             `plx+=ddx; ply+=ddy;` 一欄一欄累加出來的，直接 continue 會把那一步
             跳掉 —— 之後整排欄位全部取樣到錯的位置，畫面是滿版破圖。
             （這就是 ver -183 一進去就大破圖的原因。） */
        if((((cam.alt-hh)*invz + z*curvK[i])*scaleH+horizon|0) >= ybuf[i]){
          plx+=ddx; ply+=ddy; continue;
        }
        /* ── 林草細節層 ─────────────────────────────────────────
           在世界座標平鋪樹冠圖，乘進底色。乘而不換：底色帶著地貌形狀與
           烘焙好的 hillshade，直接換成貼圖顏色會把山攤平成一張壁紙。
           ⚠ +4096 再取整：世界座標會是負的，而 |0 是往零截斷，負數那半邊
             的相位會整個錯開（雲的取樣也踩過同一個坑）。4096 是 GT 的倍數。
           ⚠ 反重複：每 256 單位一格，依格號選 8 種二面體變換之一。不打散的話
             整片大陸重複一百多次，眼睛一定抓得到那個節奏。 */
        if(vegOn&&geoReady&&BIOME){
          /* ── 地貌細節層 ──────────────────────────────────────
             類別與亮度起伏在載入時就打好表了（見 BIOME），這裡只讀一個 byte。
             ⚠ 先前是每個取樣重跑整條判定（兩次低頻噪聲雙線性、坡度、五層門檻、
               郊區覆蓋率），而那些輸入幾乎都是逐地圖像素的常數 —— 每幀十幾萬次
               重算同一件事，正是手機掉幀的來源。 */
          const bi=BIOME[mi];
          const tex=bi&15;
          /* 人造物與水：底色本身要推過去（細節層是相乘的，只靠它會留在原本的色相上）。 */
          if(tex===G_WD||tex===G_WL){
            const deep=(tex===G_WL);
            const wr=deep?92:66, wg=deep?126:100, wb=deep?146:124;
            cr+=(wr-cr)*0.72; cg+=(wg-cg)*0.72; cb+=(wb-cb)*0.72;
          }else if(tex===G_GL&&ROADW){
            const rw=(ROADW[mi]/255)*0.82;
            cr+=(135-cr)*rw; cg+=(109-cg)*rw; cb+=(72-cb)*rw;
          }else if(tex>=G_RH&&SUBW){
            const rc=ROOF_COL[tex-G_RH], rw2=(SUBW[mi]/255)*0.55+0.30;
            cr+=(rc[0]-cr)*rw2; cg+=(rc[1]-cg)*rw2; cb+=(rc[2]-cb)*rw2;
          }
          /* ⚠ +40960 再取整：世界座標會是負的，而 |0 往零截斷，負數那半邊的
             相位會整個錯開（雲的取樣踩過同一個坑）。40960 是 GT 的倍數。 */
          const wx=(plx+40960)*GEO_INV, wy=(ply+40960)*GEO_INV;
          const q=tex*GEO_STRIDE+((((wy|0)&GTM)*GT+((wx|0)&GTM))*3);
          const k0=GEOK[q]*GEO_K1, k1=GEOK[q+1]*GEO_K1, k2=GEOK[q+2]*GEO_K1;
          /* 低頻亮度起伏：週期與貼圖週期互質得夠遠，兩者的節奏不會對齊，
             重複感就散掉了。量化成 4 bit 存在 BIOME 的高位。 */
          const mot=1+(((bi>>4)/15)-0.5)*2*GEO_MOT*vegAmt;
          cr*=(1+(k0-1)*vegAmt)*mot;
          cg*=(1+(k1-1)*vegAmt)*mot;
          cb*=(1+(k2-1)*vegAmt)*mot;
        }
        isRiver=RIV[mi];
        const nl=clamp(0.62+(SLX[mi]*lx+SLY[mi]*ly)*LIGHT_DIR_K,0,1.5);
        const sh=(ambI+sunI*nl)*GRADE_EXPO;
        r=cr*sh*lightR; g=cg*sh*lightG; b=cb*sh*lightB;
        // VP1 分級：往亮度收斂＝去飽和（在光照之後、霧之前，霧色才不會被連帶洗掉）
        const lum=r*0.299+g*0.587+b*0.114;
        r=lum+(r-lum)*GRADE_SAT; g=lum+(g-lum)*GRADE_SAT; b=lum+(b-lum)*GRADE_SAT;
      }
      // 曲率：等價於把地表下沉 d²/(2R)，展開後只是加一項 z*curvK[i]
      const yf=((cam.alt-hh)*invz + z*curvK[i])*scaleH+horizon;
      let y=yf|0;
      if(y<ybuf[i]){
        // 次像素：這一列有多少「沒被地形蓋到」。收尾時只拿最後的頂端來混。
        topFrac[i]=(y>0)?clamp(yf-y,0,1):0;
        if(y<0) y=0;
        const sr=r, sg=g, sb=b;        // 未套霧的地表色，立面要從這裡推
        if(fog>0.002){ r=lerp(r,fr,fog); g=lerp(g,fg,fog); b=lerp(b,fb,fog); }
        const dth=BAYER[((y&3)<<2)|(i&3)]*DITHER;
        const top=rgb(clamp(r+dth,0,255)|0,clamp(g+dth,0,255)|0,clamp(b+dth,0,255)|0);
        const bot=ybuf[i];
        /* ⚠ 每幀 prevH 初始化為 -9999 代表「還沒有上一筆」。不特判的話
           最近的那一步 drop 會是一萬多，整片畫面下緣被當成巨型崖面畫出來
           —— 那就是會看到的破圖。 */
        const first=prevH[i]<-9000;
        const drop=first?0:hh-prevH[i]; // 相對「上一個（更近的）已畫取樣」的高度落差
        /* ⚠ 遠處與極短的柱子直接填單色：柱高只有幾個像素、或已經被霧洗到
           接近地平線色時，立面的紋理與漸暗一個都看不出來，卻要付整段
           per-pixel 的代價。畫面大部分面積都落在這一類，這道閘門省下的
           時間比任何其他優化都多。 */
        const y0=y;
        if(bot-y0>3 && fog<0.86){
          /* 立面：**所有**垂直線段都走這條路，不再只有大落差才處理。
             原本落差不到門檻就整條填單一地表色，於是每根柱子都是一道
             純色豎條 —— 那正是「垂直立面怪怪的」。
             顏色由該處地表色推導（雪山得到灰白的壁、森林區得到褐綠的壁），
             加上橫向岩層條紋與往下漸暗（環境光被崖壁自身遮蔽）。
             落差越大越混入獨立的岩石反照率：小起伏是土坡，大落差才是岩壁。 */
          const cap=y0+2;
          for(let yy=y0;yy<cap && yy<bot;yy++) bufU32[yy*BW+i]=top;
          const wx=xi, wy=yi;
          const rocky=clamp((drop-16)/(CLIFF_DH*1.5),0,1);
          /* 瀑布判定。⚠ 不能只看落差：`rocky>0.40` 換算成落差要 >61 世界單位，
             而城的水面 87、雲海面約 48，落差只有 39 —— 河流到大陸邊緣會被當成
             一道普通矮坎。但這是**浮空大陸**：水走到邊緣就是往雲海裡掉，
             沒有別的去處。所以「前一筆（更近的）取樣是雲海」本身就是瀑布的
             充分條件，與落差無關。 */
          const overSea = !first && prevH[i]<=CLOUD_H+12;
          /* ⚠ 內陸的河**預設不是瀑布**。ver -190 把河面抬到「比岸低 6」之後，
             河相對周圍地勢變高，沿岸落差輕易超過 rocky>0.40（＝61 世界單位），
             於是整條河的岸邊都被判成瀑布、畫成翻白的水 —— 使用者看到的
             「河道立面藍藍的」就是這個，不是岸壁沒換色（岩褐在 else 分支，
             那條路徑根本沒被走到）。
             真正的瀑布只有兩種：水掉進雲海（overSea），或真的掛在斷崖上
             （rocky>0.85＝落差 >111 單位，那是崖不是岸）。 */
          const fall=isRiver && (overSea || rocky>0.85);
          const wamb=ambI+sunI*0.35;          // 崖面朝側，取中間調
          for(let yy=cap;yy<bot;yy++){
            const d=(yy-cap)/Math.max(1,bot-cap);      // 0＝崖頂 1＝沒入雲海
            let cr,cg,cb;
            if(fall){
              /* 瀑布：河水落下。色相直接取河道自己的地貌色（COL[mi]），只是
                 被打散成白沫而提亮，往下越散越白。
                 ⚠ 先前寫死 222..255 的純白、且完全不吃日照 —— 夜裡整條瀑布
                   還是正午的白，掛在暗掉的崖面上像螢光漆。水的顏色本來就
                   來自它反射的天光，得跟崖面同一盞燈才對得起來。
                 sunI 給到 0.75（崖面只有 0.35）：水面朝天，接光比側向的岩壁多，
                 這樣夜裡是「暗藍的水」而不是「被一起關燈的灰柱」。 */
              const rc=COL[mi];
              const flow=hash(wx*3, (yy*2 - (now*FALL_SPD|0)) & 511);
              const foam=clamp(0.46+flow*0.26-d*0.14+sstep(0.55,1,d)*0.34,0,1);
              const wsh=(ambI+sunI*0.75)*GRADE_EXPO;
              cr=lerp( rc&255,      248,foam)*wsh*lightR;
              cg=lerp((rc>>8)&255,  250,foam)*wsh*lightG;
              cb=lerp((rc>>16)&255, 255,foam)*wsh*lightB;
              // 與河面走同一條分級曲線，兩者才會是同一種水
              const wl=cr*0.299+cg*0.587+cb*0.114;
              cr=wl+(cr-wl)*GRADE_SAT; cg=wl+(cg-wl)*GRADE_SAT; cb=wl+(cb-wl)*GRADE_SAT;
            }else{
              /* 立面色＝地表色 × 岩層條紋 × 往下漸暗。
                 ⚠ 從地表色推導才會有「顏色變化」——各地的壁自然帶著該地
                   的色調；用一種寫死的岩石色會讓整座大陸的側面長得一樣。
                 大落差再往獨立的岩石反照率靠：地表在背光側本來就暗，
                 純用地表色乘下去會變成黑洞，岩石色把它拉回來。 */
              const strat=STRAT[(wx*5+wy*3+(yy>>1))&255];
              const v=(1-d*0.34)*(0.88+strat*0.14);   // 條紋收斂：每根柱子都有立面了，原本的幅度會整片變雜點
              /* ⚠ 河道的立面不能拿地表色去推 —— 地表色現在是水藍，推出來就是
                 一道藍色的壁。水面下的岸壁是**岩**，用岩褐的絕對色（同 rock_brown
                 的均值）。非河道的地方照舊由地表色推導，各地的壁才帶著該地色調。 */
              let bsr=sr, bsg=sg, bsb=sb;
              if(isRiver){
                const rk=(ambI+sunI*0.5)*GRADE_EXPO;
                bsr=109*rk*lightR; bsg=91*rk*lightG; bsb=72*rk*lightB;
              }
              cr=bsr*v; cg=bsg*v; cb=bsb*v;
              if(rocky>0.01){
                cr=lerp(cr,152*v*wamb*lightR,rocky);
                cg=lerp(cg,138*v*wamb*lightG,rocky);
                cb=lerp(cb,126*v*wamb*lightB,rocky);
              }
              if(yy-cap<2){ cr*=1.22; cg*=1.20; cb*=1.18; }   // 崖唇受光提亮
            }
            /* ── 撞擊點的雲霧水花 ──────────────────────────────
               瀑布掉到雲海就整條消失，看起來像被裁掉。真正該有的是**霧**：
               水砸進雲頂翻起一片白，看不見底反而更有深度。
               ⚠ 只能畫在撞擊點**上方**（yy<bot）。bot 以下的像素屬於更近的
                 取樣、早就畫好了，往下寫會破壞深度順序 —— 這也是為什麼
                 「直下雲海深處」那個方案在這個渲染器裡行不通：更近的雲會後畫、
                 把水柱蓋掉。
               ⚠ 霧要吃同一盞燈：白得不吃日照的話，夜裡會變成一條螢光帶。 */
            if(fall){
              const up=(bot-yy);                        // 距撞擊點幾列
              if(up<MIST_H){
                const t2=1-up/MIST_H;
                const puff=hash(wx*7+i, (yy*3 - (now*MIST_SPD|0)) & 511);
                const m=clamp(t2*t2*(0.55+puff*0.75),0,1)*MIST_AMT;
                const msh=(ambI+sunI*0.80)*GRADE_EXPO;
                cr=lerp(cr,252*msh*lightR,m);
                cg=lerp(cg,253*msh*lightG,m);
                cb=lerp(cb,255*msh*lightB,m);
              }
            }
            if(fog>0.002){ cr=lerp(cr,fr,fog); cg=lerp(cg,fg,fog); cb=lerp(cb,fb,fog); }
            const wd=BAYER[((yy&3)<<2)|(i&3)]*DITHER;
            bufU32[yy*BW+i]=rgb(clamp(cr+wd,0,255)|0,clamp(cg+wd,0,255)|0,clamp(cb+wd,0,255)|0);
          }
        }else{
          for(let yy=y0;yy<bot;yy++) bufU32[yy*BW+i]=top;
        }
        ybuf[i]=y; prevH[i]=hh; ybufZ[i]=z;
      }
      plx+=ddx; ply+=ddy;
    }
    // 視距 3600 下若沿用 0.0042 會逼近 1800 步；遠景只占幾個像素又被霧吃掉，
    // 放寬成長率把步數壓回 ~800，畫質看不出差別但省一半以上取樣。
    z+=dz; dz+=0.011;
  }

  /* ══ 抗鋸齒 ①：輪廓的次像素混色 ══
     z 迴圈跑完後，ybuf[i] 就是該欄地形的最高列 —— 那一列才是真正的
     天空／地形交界，也只有它該做覆蓋率混色。
     ⚠ 一開始我在迴圈裡「每畫一次新頂端就混一次」，結果連續斜坡上每隔
       幾列就有一條偏天空色的亮列（因為上方當下還是天空、更遠的地形之後
       才會補進來），逐欄相位又不同 → 整片鹽粒雜訊。
       交界只有一條，混色也只該做一次。
     成本 O(BW)，一幀幾百次，可以忽略。 */
  for(let i=0;i<BW;i++){
    const f=topFrac[i], ty=ybuf[i];
    if(f<0.08 || ty<=0 || ty>=BH) continue;
    const c=bufU32[ty*BW+i], s=SKYROW[ty];
    const cr=c&255, cg=(c>>8)&255, cb=(c>>16)&255;
    bufU32[ty*BW+i]=rgb(
      (cr+((s&255)-cr)*f)|0,
      (cg+(((s>>8)&255)-cg)*f)|0,
      (cb+(((s>>16)&255)-cb)*f)|0);
  }

  bctx.putImageData(buf,0,0);
  ctx.drawImage(bcv,0,0,BW,BH,0,0,W,VIEWH);

  // 疊加物一律裁切在 3D 視窗內，不可溢出到操作面板
  ctx.save();
  ctx.beginPath(); ctx.rect(0,0,W,VIEWH); ctx.clip();
  drawSunMoon(S,horizon,sinp,cosp);
  /* 雲分兩趟畫，中間夾著城（見 drawPuffs 的說明）。 */
  const splitZ=nearestSettleZ(sinp,cosp);
  drawPuffs(S,scaleH,horizon,sinp,cosp,splitZ,Infinity);   // 比城遠的雲
  drawSettlements3D(scaleH,horizon,sinp,cosp);
  drawPuffs(S,scaleH,horizon,sinp,cosp,0,splitZ);          // 比城近的雲：蓋在城上面
  drawPlaces(scaleH,horizon,sinp,cosp);
  drawFlock(scaleH,horizon,sinp,cosp,now);
  drawEnemy3D(scaleH,horizon,sinp,cosp,now);
  drawShip(now);
  vignette(S);
  ctx.restore();

  drawPanel(S);
}

function drawSunMoon(S,horizon,sinp,cosp){
  const syk=VIEWH/BH;
  const body=(az,el,R,core,glow)=>{
    if(el<-0.22) return;
    const camAz=Math.atan2(-sinp,-cosp);
    let da=az-camAz;
    while(da>Math.PI)da-=Math.PI*2;
    while(da<-Math.PI)da+=Math.PI*2;
    if(Math.abs(da)>1.05) return;
    const x=W/2+Math.tan(da)*(W/2);
    const y=(horizon*syk)-el*VIEWH*0.62;
    const g=ctx.createRadialGradient(x,y,0,x,y,R*5.5);
    g.addColorStop(0,glow); g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,R*5.5,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=core; ctx.beginPath(); ctx.arc(x,y,R,0,Math.PI*2); ctx.fill();
  };
  body(S.az,S.el,13, S.dusk>0.35?'#ffd9a0':'#fff6dc', S.dusk>0.35?'rgba(255,168,88,.5)':'rgba(255,238,190,.34)');
  /* 銀月：位置固定、日夜皆在，不繞行也不盈虧。白天光暈收斂（被日光壓過），
     夜裡放到最大 —— 它是這片大陸的名字，該是天上最顯眼的東西。 */
  const mg=lerp(0.52,0.20,S.day);
  body(MOON_AZ,MOON_EL,MOON_R,'#eef1fa',`rgba(198,214,252,${mg.toFixed(2)})`);
}

/* zLo/zHi＝只畫這段深度的雲。城是在雲之後畫的，所以城會壓在**所有**雲上面
   —— 飛在雲上看城時，城的貼圖蓋過本該在它前面的雲團，整座城像浮在雲層之上。
   改成分兩趟：比城遠的雲先畫、比城近的雲在城之後畫。分界取最近那座城的深度
   （城本身橫跨上千單位，單一分界一定有取捨；雲團是軟的大團，取城心最不吃虧）。 */
function drawPuffs(S,scaleH,horizon,sinp,cosp,zLo,zHi){
  const sxk=W/BW, syk=VIEWH/BH;
  const fx=-sinp, fy=-cosp;
  const lo=(zLo===undefined)?0:zLo, hi=(zHi===undefined)?Infinity:zHi;
  const list=[];
  PUFFS.forEach(p=>{
    const dx=p.x-cam.x, dy=p.y-cam.y;
    const z=dx*fx+dy*fy;
    if(z<3||z>ZFAR) return;
    if(z<lo||z>=hi) return;
    const s=(dx*cosp+dy*(-sinp))/z;
    if(s<-2.4||s>2.4) return;
    list.push({p,z,s});
  });
  list.sort((a,b)=>b.z-a.z);
  const lit=lerp(0.72,1.0,S.day), warm=S.dusk;   // 銀月照著，夜裡的雲團不該是灰的
  list.forEach(({p,z,s})=>{
    const x=((s+1)/2*BW)*sxk;
    const y=(((cam.alt-p.h)/z + z*curvAt(s))*scaleH+horizon)*syk;
    const R=p.r/z*scaleH*syk*0.9;
    if(R<1.2) return;
    const a=p.a*clamp((ZFAR-z)/(ZFAR*0.45),0,1)*clamp(z/30,0,1);
    if(a<0.012) return;
    const cr=Math.round(lerp(226,255,warm)*lit),
          cg=Math.round(lerp(232,206,warm)*lit),
          cb=Math.round(lerp(244,186,warm)*lit);
    ctx.save(); ctx.globalAlpha=a;
    for(let k=0;k<5;k++){
      const ang=k/5*Math.PI*2+p.seed*6;
      const ox2=Math.cos(ang)*R*0.42, oy2=Math.sin(ang)*R*0.17;
      const rr=R*(0.52+((k*37)%7)/14);
      const gg=ctx.createRadialGradient(x+ox2,y+oy2,0,x+ox2,y+oy2,rr);
      gg.addColorStop(0,`rgba(${cr},${cg},${cb},.9)`);
      gg.addColorStop(1,`rgba(${cr},${cg},${cb},0)`);
      ctx.fillStyle=gg;
      ctx.beginPath(); ctx.ellipse(x+ox2,y+oy2,rr,rr*0.62,0,0,Math.PI*2); ctx.fill();
    }
    ctx.restore();
  });
}

/* ══ 地標 ══
   遠：只有一枚向下的箭頭浮在地標上方（不透露名稱）
   近：箭頭下方展開名牌 —— 名牌出現＝可點擊進入
   點擊判定用 hotspots（每幀重建），tap 與拖曳靠位移量區分。 */
/* 1800 世界單位＝90 地圖像素。大陸放大一倍後跟著加倍，維持「相對地圖」
   的同一段距離；沿用 900 會變成要飛到幾乎貼著地標才跳出名字。 */
const NAME_DIST = 1800;   // 進入此距離才顯示名稱＝可進入
let hotspots=[];
function drawPlaces(scaleH,horizon,sinp,cosp){
  const sxk=W/BW, syk=VIEWH/BH;
  hotspots=[];
  const list=[];
  PLACES.forEach(P=>{
    const dx=P.wx-cam.x, dy=P.wy-cam.y;
    const z=dx*(-sinp)+dy*(-cosp);
    if(z<10||z>ZFAR*0.92) return;
    const s=(dx*cosp+dy*(-sinp))/z;
    if(s<-1.1||s>1.1) return;
    list.push({P,bx:((s+1)/2*BW)*sxk,
                 by:(((cam.alt-(P.h||0))/z + z*curvAt(s))*scaleH+horizon)*syk,
                 z, near:Math.hypot(dx,dy)<NAME_DIST});
  });
  list.sort((a,b)=>b.z-a.z);
  list.forEach(o=>{
    const fade=clamp((ZFAR*0.92-o.z)/240,0,1);
    ctx.globalAlpha=fade;
    /* ⚠ 只有「遠處的箭頭」浮動。名牌一旦展開就整組定住 ——
       名牌是要讀的字，2.5px 的正弦擺動在 11px 的字上等於一直在晃，
       而且它同時是點擊熱區，會動的按鈕本來就難按。
       座標取整：字落在半個像素上會被反鋸齒糊掉，看起來也像在抖。 */
    const ay=Math.round(clamp(o.by-30,18,VIEWH-40));   // 箭頭底端（指著地標）
    const bx=Math.round(o.bx);
    const bob=o.near?0:Math.sin(performance.now()*0.004+o.bx)*2.5;

    // 向下箭頭
    ctx.fillStyle= o.near ? '#c9a227' : 'rgba(201,162,39,.62)';
    ctx.beginPath();
    ctx.moveTo(bx, ay+bob);
    ctx.lineTo(bx-6.5, ay-10+bob);
    ctx.lineTo(bx+6.5, ay-10+bob);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle='rgba(8,7,12,.55)'; ctx.lineWidth=1; ctx.stroke();

    // 近距離才展開名牌（＝可點擊）
    if(o.near){
      ctx.font='11px "Noto Serif TC",serif'; ctx.textAlign='center';
      const tw=Math.round(ctx.measureText(o.P.name).width);
      const bx0=bx-((tw/2)|0)-9, by0=ay-32, bwid=tw+18, bhei=18;
      ctx.fillStyle='rgba(5,6,12,.8)'; ctx.fillRect(bx0,by0,bwid,bhei);
      ctx.strokeStyle='#c9a227'; ctx.lineWidth=1; ctx.strokeRect(bx0+0.5,by0+0.5,bwid,bhei);
      ctx.fillStyle='#c9a227'; ctx.fillText(o.P.name,bx,by0+13);
      // 點擊熱區放大一圈，手指才好按
      hotspots.push({x:bx0-8,y:by0-8,w:bwid+16,h:bhei+22,P:o.P});
    }
    ctx.globalAlpha=1;
  });
}

/* ══ 飛鳥群 ══════════════════════════════════════════════════════════
   偶爾一群鳥橫過視野。純氣氛，沒有互動。
   ⚠ 不做成「敵人」的一種：牠們不需要狀態機、不需要遭遇判定，
     共用那套只會把敵人的邏輯撐得更複雜。
   ⚠ 編隊用「領頭鳥 + 各自的偏移」而不是每隻獨立飛：獨立飛的話再怎麼調
     都像一把散開的點，看不出是一群。偏移帶各自的緩慢繞行，群才會呼吸。
   ⚠ 拍翅相位每隻錯開：整群同步拍翅非常假，那是複製貼上的讀感。 */
const FLOCK_CFG = {
  gapMin: 22000, gapMax: 46000,   // 兩群之間的間隔（ms）
  n: [7, 16],                     // 每群幾隻
  spawnDist: 900,                 // 生成距離（世界單位）——比怪近得多，要看得清
  speed: 2.6,                     // 世界單位／(ms*0.06)，約玩家極速的 43%
  spread: 120,                    // 編隊散佈半徑（世界單位）
  life: 26000,                    // 活這麼久就散（ms）
};
let flock=null, flockTimer=FLOCK_CFG.gapMin*0.5;

function spawnFlock(){
  const C=FLOCK_CFG;
  // 生在側前方，讓牠橫過視野；高度落在玩家上下，有時從下方掠過
  const a=cam.angle+(Math.random()<0.5?1:-1)*(0.5+Math.random()*0.8);
  const x=cam.x-Math.sin(a)*C.spawnDist, y=cam.y-Math.cos(a)*C.spawnDist;
  // 航向：橫過玩家前方（不朝玩家來，也不背離）
  const h=cam.angle+(Math.random()<0.5?1:-1)*(1.2+Math.random()*0.6);
  const n=C.n[0]+((Math.random()*(C.n[1]-C.n[0]+1))|0);
  const birds=[];
  for(let i=0;i<n;i++){
    birds.push({
      // 編隊偏移：V 字骨架加一點亂數，免得排得太整齊像圖表
      ox:(Math.random()-0.5)*C.spread,
      oy:(Math.random()-0.5)*C.spread,
      oa:(Math.random()-0.5)*70,          // 高度偏移
      orb:Math.random()*6.28,             // 各自緩慢繞行的相位
      wing:Math.random()*6.28,            // 拍翅相位：錯開才不像複製貼上
      hz:0.020+Math.random()*0.010,       // 拍翅頻率也各自不同
    });
  }
  flock={ x, y, alt:cam.alt+(Math.random()-0.45)*160,
          hx:-Math.sin(h), hy:-Math.cos(h), birds, t0:performance.now() };
}

function updateFlock(dt,now){
  const C=FLOCK_CFG;
  if(!flock){
    flockTimer-=dt;
    if(flockTimer<=0) spawnFlock();
    return;
  }
  const mv=C.speed*dt*0.06;
  flock.x+=flock.hx*mv; flock.y+=flock.hy*mv;
  const dx=flock.x-cam.x, dy=flock.y-cam.y;
  if(now-flock.t0>C.life || Math.hypot(dx,dy)>2600){
    flock=null;
    flockTimer=C.gapMin+Math.random()*(C.gapMax-C.gapMin);
  }
}

function drawFlock(scaleH,horizon,sinp,cosp,now){
  if(!flock) return;
  const sxk=W/BW, syk=VIEWH/BH;
  const S=sky();
  const lit=clamp(0.22+S.day*0.78,0.22,1);
  const col='rgba('+Math.round(38*lit+8)+','+Math.round(34*lit+8)+','+Math.round(32*lit+10)+',';
  ctx.save();
  for(const b of flock.birds){
    const orb=now*0.0009+b.orb;
    const wx=flock.x+b.ox+Math.cos(orb)*16, wy=flock.y+b.oy+Math.sin(orb*1.3)*16;
    const dx=wx-cam.x, dy=wy-cam.y;
    let z=dx*(-sinp)+dy*(-cosp);
    if(z<30||z>ZFAR*0.55) continue;                  // 太遠就看不見了，不必畫
    const sv=(dx*cosp+dy*(-sinp))/z;
    if(sv<-1.25||sv>1.25) continue;
    const alt=flock.alt+b.oa+Math.sin(orb*0.8)*10;
    const px=((sv+1)/2*BW)*sxk;
    const py=(((cam.alt-alt)/z + z*curvAt(sv))*scaleH+horizon)*syk;
    const sc=W/(2*z);
    const span=Math.max(1.2, sc*22);                 // 翼展（世界單位 22）
    if(span<1.0) continue;
    /* 一隻鳥就是一個「M」：兩撇翅膀，拍動時改的是**上揚的幅度**。
       這個尺寸下畫身體是浪費，剪影才是辨識點。 */
    const f=Math.sin(now*b.hz+b.wing);
    const up=span*0.34*f;
    ctx.strokeStyle=col+(0.62+0.24*S.day).toFixed(2)+')';
    ctx.lineWidth=Math.max(0.8,span*0.13);
    ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.beginPath();
    ctx.moveTo(px-span*0.5, py-up);
    ctx.lineTo(px,           py+span*0.06);
    ctx.lineTo(px+span*0.5, py-up);
    ctx.stroke();
  }
  ctx.restore();
}

/* ══ 敵人：巨型蜈蚣（FLM_CENTIPI）════════════════════════════════════
   ▍雙軌（同飛空艇）
   有去背素材時走精靈模式（頭／體節／尾／左右翅分層，比照 split_ship.py 的
   作法由腳本自動拆），沒有就走下面的程序繪製。現在是程序版——
   resources/Flight_Enemy/FLM_CENTIPI.png 是六視圖合成稿，**背景不透明**
   （模糊紅金漸層）而翅膀是半透明的，自動去背會把翅膀一起吃掉，得先有去背稿。
   行為與動畫先做完，素材到位只要把 drawBody/drawWings 換成貼圖層即可。

   ▍為什麼身體要分節
   單張圖不可能「扭」。體節各自帶一個相位差，正弦波沿身體由頭往尾 traveling，
   那才是蜈蚣的蛇行。跟飛空艇「前帆先甩、後帆跟上」是同一套延遲鏈。

   ▍為什麼投影逐節算
   每一節都走跟地形/聚落完全同一條投影式 → 透視、朝向、貼地關係全部免費，
   不必另外算旋轉矩陣（同 ver -140 聚落改逐點投影的理由）。

   ▍行為
   50~60 秒自遠方刷新一隻 → 以刷新當下的相對距離 D0 為基準巡航 →
   距離縮至 0.7·D0 轉為主動追擊 → 進船身一定範圍顯示「進入戰鬥」→
   3 秒後與敵人一同消失，重新計時。戰鬥本身尚未實作。 */
const ENEMY_CFG = {
  gapMin: 50000, gapMax: 60000,   // 刷新間隔（ms）
  /* 速度＝玩家極速的倍數。1.20 時牠整個撞上來——比玩家快的追擊者在
     這種正面接近的幾何下沒有周旋餘地，玩家等於只能挨撞。0.60 讓牠
     略慢於玩家，遭遇變成「牠攔在航路上」而不是「牠追上你」。 */
  speedK: 0.60,
  pixelScale: 1.0,                // 繪製解析度（×BW/W）——見 drawEnemy3D 的像素化
  chaseAt: 0.60,                  // 距離縮到 D0 的這個比例 → 轉主動追擊
  spawnDist: 2800,                // 生成距離（世界單位；ZFAR=3600 之內才看得到）
  /* 生成方位（偏離航向的角度範圍）。視野半角是 45°（sv∈[-1,1] ⇔ 橫向=深度），
     所以下限取 52° 就保證生成的瞬間在畫面外；上限 105° 是「還來得及漂進畫面」
     的界線，再往後就繞到側後方、玩家一路上都不會遇到牠。 */
  spawnOffMin: 52*Math.PI/180,
  spawnOffMax: 105*Math.PI/180,
  engage: 210,                    // 進入戰鬥的距離
  holdMs: 3000,                   // 提示停留後一同消失
  segs: 22,                       // 體節數
  /* 體長：120 時整隻讀起來像蜻蜓——翅展跟身體差不多長，蟲的比例就出不來。
     參考圖的俯視是「翅展 ≈ 體長」但體節有二十幾節，是**細長**而非短胖，
     所以要靠節數與體長一起加，不能只放大整體。 */
  bodyLen: 210,                   // 體長（世界單位）
  diveAlt: 70,                    // 追擊時沉到玩家高度以下多少（見下方註解）
  waveAmp: 7.0,                   // 蛇行振幅（世界單位）
  wavePhase: 0.92,                // 每節之間的相位差（rad）＝波長
  waveHz: 0.0042,                 // 蛇行角頻（rad/ms）
  wingHz: 0.055,                  // 振翅角頻（rad/ms）——比蛇行快一個數量級才像蟲
  turnRate: 0.0016,               // 轉向角速度上限（rad/ms ≈ 92°/秒）
  trailStep: 7,                   // 軌跡取樣間距（世界單位）——身體沿這條軌跡排
};
/* ── 怪種 ────────────────────────────────────────────────────────────
   共用的是行為（刷新／巡航／追擊／遭遇）與投影；差異全在這張表。
   vertical：扭動的軸。蜈蚣是貼著地面爬行的節肢，左右擺；羽蛇在空中游動，
   上下起伏才對 —— 這是兩者最容易分辨的動態特徵，不能共用。 */
const ENEMY_KINDS = {
  centipede: {
    name:'巨型蜈蚣', plan:'chain', segs:22, bodyLen:210, vertical:false,
    /* 素材：split_enemy.py 自六視圖拆出來的俯視圖。
       head/body/tail 是「佔圖高的比例」，由該圖的**每列寬度剖面**量出來的
       （翅那段寬 255~268，身體穩定在 72~88，尾端收到 29~34）——不是目測。
       ⚠ 翅不從圖上取：翅要獨立振動，而它在俯視圖裡跟身體重疊，切不開。 */
    sprite:{ dir:'enemy/FLM_CENTIPI/', dorsal:'view_0.webp',
             head:[0.00,0.085], wings:[0.085,0.330], body:[0.330,1.00] },
    waveAmp:7.0, wavePhase:0.92, waveHz:0.0042, wingHz:0.055,
    turnRate:0.0016, speedK:0.60,
  },
  serpent: {
    /* 羽蛇：比蜈蚣更長更細，扭動慢而大 —— 蛇的波長比節肢動物長得多，
       用同一組 wavePhase 會扭成一條抽搐的毛毛蟲。翅是鳥翼，拍得比蟲慢。 */
    name:'羽蛇', plan:'chain', wing:'bird', segs:26, bodyLen:280, vertical:true,
    sprite:{ dir:'enemy/FLM_Serpent/', dorsal:'view_3.webp',
             head:[0.00,0.165], wings:[0.165,0.380], body:[0.380,1.00] },
    /* wingHz 0.019 → 0.008：鳥翼本來就比蟲翅慢得多。
       wingSmooth：拍動曲線改成平滑正弦。原本兩種怪共用 |cos|，那在過零點
       有個尖角 —— 蟲翅該有那個「啪」的頓挫，鳥翼不該，看起來會像在抽搐。 */
    waveAmp:11.0, wavePhase:0.52, waveHz:0.0031, wingHz:0.008, wingSmooth:true,
    turnRate:0.0021, speedK:0.72,
  },
  pirate: {
    /* 空賊：第一隻剛體怪。不變形，只有整體換視角。
       ⚠ 剛體怪不需要「上下」那一維：實測俯角只有 2°~18°（見 diveAlt 那段），
         玩家幾乎是平視，所以方位圖只要繞垂直軸一圈，不必俯視／仰視。
       ⚠ 六視圖各自縮到 512 的話彼此比例會跑掉，轉向換圖時船會忽大忽小 ——
         split_enemy.py 已改成全張共用一個縮放係數。 */
    /* turnRate 0.0011 → 0.00055（63°/秒 → 32°/秒）：一艘三桅飛船不會像
       戰鬥機那樣甩頭。轉得慢，掉轉本身才有重量，也讓每個方位停留得夠久。 */
    name:'空賊', plan:'rigid', speedK:0.85, turnRate:0.00055,
    bodyLen:300,                    // 船長（世界單位）＝側視圖寬所代表的長度
    /* 方位圖:0°(正面)/53.6°/90°(側)/141.6°/180°(背),再鏡射補另一側＝一圈八個。
       ⚠ 53.6/141.6 是**量出來的不是選的**:斜視圖來自另一張補充稿,
         相機方位角本來就不對稱(先前誤以為是 45°／135°)。
         split_enemy.py 以桅高正規化尺度後,用「寬 / 側視寬 = sinθ」反推,
         那支腳本每次跑都會把量到的角度印出來 —— 換素材就照著改這兩個數。
       ⚠ frontQ 的船首朝左(與 sideR 同一側)、rearQ 的船首朝右(與 sideL 同一側),
         所以兩張各自只在一邊是原圖,另一邊要鏡射。 */
    sprite:{ dir:'enemy/FLH_Pirate/',
             front:'view_4.webp', rear:'view_5.webp',
             sideR:'view_0.webp', sideL:'view_1.webp',
             frontQ:'view_6.webp', rearQ:'view_7.webp' },
    qFront:53.6*Math.PI/180, qRear:141.6*Math.PI/180,
  },
};

let enemy=null;                                   // {x,y,alt,hx,hy,d0,state,tEngage,kind}
let enemyFB=null, EC=null;                        // 低解析繪製緩衝（見 drawEnemy3D）
/* 怪的素材：載到才切精靈模式，載不到走程序繪製（同飛空艇的雙軌）。
   ⚠ 背景載，不擋開場：怪最快也要 17 秒後才刷新（gapMin*0.35），
     來得及；擋在 loadWorld 裡只會把開場拖長。 */
const enemyArt={};
(function loadEnemyArt(){
  for(const k of Object.keys(ENEMY_KINDS)){
    const sp=ENEMY_KINDS[k].sprite; if(!sp) continue;
    if(ENEMY_KINDS[k].plan==='rigid'){
      /* 剛體怪：一組方位圖。全部載齊才切精靈模式，
         少一張就會在某個朝向上突然沒東西可畫。 */
      const set={}; let left=0;
      for(const key of ['front','rear','sideR','sideL','frontQ','rearQ']){
        if(!sp[key]) continue;
        left++;
        const im=new Image();
        im.onload=()=>{ set[key]=im; if(--left===0) enemyArt[k]=set; };
        im.src=sp.dir+sp[key];
      }
    }else{
      const im=new Image();
      im.onload=()=>{ enemyArt[k]=im; };
      im.src=sp.dir+sp.dorsal;
    }
  }
})();
let enemyTimer=ENEMY_CFG.gapMin*0.35;             // 開場不要立刻刷

function spawnEnemy(){
  const C=ENEMY_CFG;
  /* 生成方位：一律在**視野之外**。敵人不該在玩家眼前憑空出現 ——
     擺到畫面外再讓牠自己漂進來，出場就有了來處。
     （先前的作法是生成一團雲霧罩住牠，已撤：那是遮蔽而不是解決，
       而且雲團得另外管生命週期，還跟共用的 PUFFS 回收邏輯打架。） */
  const off=C.spawnOffMin+Math.random()*(C.spawnOffMax-C.spawnOffMin);
  const a=cam.angle+(Math.random()<0.5?off:-off);
  const ox=-Math.sin(a), oy=-Math.cos(a);
  const x=cam.x+ox*C.spawnDist, y=cam.y+oy*C.spawnDist;
  /* 巡航朝向：**橫向**切過視野，不是直直朝玩家飛。
     直朝玩家的話，牠一路都是頭對著鏡頭——正俯視下只看得到一顆頭和兩片翅，
     體節、步足、蛇行全部縮在後面看不見，玩家根本認不出那是什麼東西，
     只知道有東西撞上來。轉成側向，牠的側面才展開給玩家看。
     ⚠ 純 90°，**不留內收**：巡航階段牠只是橫越，不朝玩家來。
       這代表距離不會自己縮短（自定點作垂直運動，距離只會變大），
       追擊要靠**玩家自己接近**才會觸發——那正是要的：牠攔在航路上，
       你可以繞開，靠太近牠才轉頭。 */
  let tx=cam.x-x, ty=cam.y-y;
  const L=Math.hypot(tx,ty)||1; tx/=L; ty/=L;
  /* 橫向有兩個方向，要選**朝畫面內**那一側 —— 隨機選的話有一半機率
     牠會往畫面外漂走，玩家一輩子看不到那隻。
     判法：各往前試一小步，取投影橫向位置 |sv| 較小的那個。 */
  const sinp0=Math.sin(cam.angle), cosp0=Math.cos(cam.angle);
  const svOf=(px2,py2)=>{
    const dx2=px2-cam.x, dy2=py2-cam.y;
    const z2=dx2*(-sinp0)+dy2*(-cosp0);
    return Math.abs((dx2*cosp0+dy2*(-sinp0))/(Math.abs(z2)<1?1:z2));
  };
  let hx=0, hy=0, best=Infinity;
  for(const side of [1,-1]){
    const a2=side*(Math.PI/2);
    const cx2=tx*Math.cos(a2)-ty*Math.sin(a2);
    const cy2=tx*Math.sin(a2)+ty*Math.cos(a2);
    const sv2=svOf(x+cx2*260, y+cy2*260);
    if(sv2<best){ best=sv2; hx=cx2; hy=cy2; }
  }
  const keys=Object.keys(ENEMY_KINDS);
  const kind=keys[(Math.random()*keys.length)|0];
  const K=ENEMY_KINDS[kind];
  enemy={ x, y, alt:cam.alt+Math.random()*60-20, hx, hy, kind,
          d0:C.spawnDist, state:'cruise', tEngage:0, phase:Math.random()*6.28,
          t0:performance.now(), trail:[] };
  // 軌跡先填成一條直線，否則剛生成的那幾幀身體還沒長出來
  for(let i=1;i<=Math.ceil(K.bodyLen/C.trailStep)+4;i++)
    enemy.trail.push({x:x-hx*C.trailStep*i, y:y-hy*C.trailStep*i});

}

function updateEnemy(dt,now){
  const C=ENEMY_CFG;
  const K=enemy?ENEMY_KINDS[enemy.kind]:null;
  if(!enemy){
    enemyTimer-=dt;
    if(enemyTimer<=0) spawnEnemy();
    return;
  }
  const dx=cam.x-enemy.x, dy=cam.y-enemy.y;
  const dist=Math.hypot(dx,dy);

  if(enemy.state==='engage'){
    // 提示停留中：敵人停住，時間到就一同消失並重新計時
    if(now-enemy.tEngage>=C.holdMs){
      enemy=null;
      enemyTimer=C.gapMin+Math.random()*(C.gapMax-C.gapMin);
    }
    return;
  }

  /* 追擊判定：距離縮到刷新當下的 chaseAt 倍就轉為主動朝玩家。
     ⚠ 用刷新當下的 d0 當基準而不是固定距離——玩家可能正在遠離，
       那時 d0 本來就大，門檻要跟著放大才符合「相對距離縮短」的語意。 */
  /* 追擊判定：距離縮到刷新當下的 chaseAt 倍才轉主動。
     巡航是純橫向，距離不會自己縮 → 這一步實質上是「玩家自己靠太近」。 */
  if(enemy.state==='cruise' && dist<=enemy.d0*C.chaseAt) enemy.state='chase';
  if(enemy.state==='chase'){
    /* 轉向限角速度：直接把朝向換成「指著玩家」是瞬間直角轉彎，
       一隻二十幾節的長蟲不可能那樣動。這裡只讓朝向每幀朝目標轉一小步，
       身體再靠下面的軌跡跟上 —— 頭先轉、身體循著頭走過的路彎過去，
       那個時間差才是「活的東西在轉身」的讀感來源（同飛空艇帆的延遲鏈）。 */
    const want=Math.atan2(dy,dx), cur=Math.atan2(enemy.hy,enemy.hx);
    let da=want-cur;
    while(da>Math.PI) da-=Math.PI*2;
    while(da<-Math.PI) da+=Math.PI*2;
    const step=clamp(da,-K.turnRate*dt,K.turnRate*dt);
    const na=cur+step;
    enemy.hx=Math.cos(na); enemy.hy=Math.sin(na);
    /* 角速度 → 側傾。船轉彎會外傾，那是「在轉」最直接的視覺線索；
       沒有它，換視角就只是一連串靜態的圖在交替。
       低通濾一下：直接吃瞬時角速度會隨 dt 抖。 */
    const rollWant=clamp(step/Math.max(1,dt)/K.turnRate,-1,1);
    enemy.roll=(enemy.roll||0)+(rollWant-(enemy.roll||0))*(1-Math.exp(-dt/260));
    /* 追擊時沉到玩家高度**之下**：船是固定畫在畫面 76% 高的精靈，
       敵人若與船同高，投影出來會停在地平線附近（畫面 30% 高）——
       兩者永遠碰不到一起，逼近的壓迫感就沒了。
       ⚠ 原本是「以固定最大速率朝定值下沉」：追擊一觸發就瞬間進入最大下降率、
         到位又突然停住，兩端各有一個速度折點 —— 看起來就是高度驟降一階。
         改兩件事：
           · 目標高度隨**接近程度**連續變（越近沉得越深），不是一觸發就跳到底
           · 用指數逼近而非固定速率，起降兩端都自然收斂
         再加一點振翅造成的上下浮動，昆蟲本來就不會飛得像條直線。 */
    const near=clamp(1-dist/Math.max(1,enemy.d0*C.chaseAt),0,1);
    const wantAlt=cam.alt-C.diveAlt*near;
    enemy.alt+=(wantAlt-enemy.alt)*(1-Math.exp(-dt/420));
  }

  const mv=MAX_SPD*K.speedK*dt*0.06;        // 與玩家同一套積分（見 update 的 mv）
  enemy.x+=enemy.hx*mv; enemy.y+=enemy.hy*mv;

  /* 軌跡：每前進 trailStep 就記一點。身體是沿這條軌跡排的，
     所以牠轉彎時身體會循著頭走過的路彎過去，而不是整條剛體一起轉。 */
  const tl=enemy.trail, hd=tl[0];
  if(!hd || Math.hypot(enemy.x-hd.x,enemy.y-hd.y)>=C.trailStep){
    tl.unshift({x:enemy.x,y:enemy.y});
    const maxN=Math.ceil(K.bodyLen/C.trailStep)+6;
    if(tl.length>maxN) tl.length=maxN;
  }

  if(dist<=C.engage){ enemy.state='engage'; enemy.tEngage=now; }
}

/* 加速鈕（開發用）：點一下位移加倍，再點一次回復。
   ⚠ 倍率套在**位移**（mv）而不是 cam.speed：cam.speed 同時驅動速度錶、
     螺旋槳轉速、尾流與船身俯仰，乘上去會讓那些儀表一起說謊。要的只是
     「同樣的操作手感，跑得比較快」，所以只放大每幀走的距離。 */
let SPD_BOOST=1;
document.getElementById('boostBtn').addEventListener('click',e=>{
  SPD_BOOST = SPD_BOOST>1 ? 1 : 2;
  e.currentTarget.textContent='×'+SPD_BOOST;
  e.currentTarget.classList.toggle('on', SPD_BOOST>1);
});

/* 生怪鈕（開發用）：立刻換一隻新的，並把自動刷新的計時歸零重算，
   免得手動生完隔幾秒又被自動刷新蓋掉。 */
document.getElementById('spawnBtn').addEventListener('click',()=>{
  enemy=null;
  spawnEnemy();
  enemyTimer=ENEMY_CFG.gapMin+Math.random()*(ENEMY_CFG.gapMax-ENEMY_CFG.gapMin);
});

/* 程序翅：素材裡的翅跟身體重疊、切不開，而且翅要獨立振動，
   所以無論精靈模式或程序模式，翅一律在這裡畫。
   ⚠ 鳥翼不是蟲翅：蟲翅是薄膜、拍動時整片縮放；鳥翼有羽片，除了展幅還要
     繞肩點掃一個角度 —— 兩者的拍動讀感完全不同，不能共用一組參數。 */
function drawWingsProc(EC,pts,K,flap,shade,segAng){
  if(K.wing==='insect'){
    for(const wi of [1,3]){
      const P=pts[wi]; if(!P) continue;
      const sc=P[3], span=sc*46, chord=sc*11;
      if(span<1.2) continue;
      const ang=segAng(wi);
      for(const sgn of [1,-1]){
        EC.save(); EC.translate(P[0],P[1]);
        EC.rotate(ang+sgn*(Math.PI/2)*(0.34+flap*0.52));
        EC.fillStyle=shade(206,226,246,0.42);
        EC.beginPath(); EC.ellipse(span*0.5,0,span*0.5,chord*(0.42+flap*0.58),0,0,Math.PI*2); EC.fill();
        EC.strokeStyle=shade(226,182,86,0.55); EC.lineWidth=Math.max(0.6,sc*1.1);
        EC.stroke();
        EC.restore();
      }
    }
  }else{
    const P=pts[2]||pts[1]||pts[0];
    const sc=P[3], span=sc*62;
    if(span<1.5) return;
    const ang=segAng(2)||segAng(1);
    for(const sgn of [1,-1]){
      EC.save(); EC.translate(P[0],P[1]);
      EC.rotate(ang+sgn*(Math.PI/2)*(0.26+flap*0.30));
      for(let f=0;f<3;f++){
        const t=f/2;
        const L=span*(1-t*0.30), Cw=sc*(9-t*2.4)*(0.55+flap*0.55);
        EC.fillStyle=f===0?shade(244,248,255,0.72)
                   :f===1?shade(196,214,242,0.66)
                         :shade(140,168,214,0.60);
        EC.save(); EC.rotate(-0.20+t*0.42);
        EC.beginPath(); EC.ellipse(L*0.5,0,L*0.5,Cw,0,0,Math.PI*2); EC.fill();
        EC.restore();
      }
      EC.restore();
    }
  }
}

/* 逐節投影 + 程序繪製。回傳畫過就 true（給提示字用）。 */
/* 進入戰鬥的提示（戰鬥本身尚未實作）。鏈狀與剛體兩條繪製路徑都要用，
   所以抽成函式；文字不進低解析緩衝——那是 UI，跟著糊就成了糊掉的字。 */
function drawEngagePrompt(){
  ctx.save();
  ctx.textAlign='center';
  ctx.font='13px "Noto Serif TC",serif';
  const yy=Math.round(VIEWH*0.30);
  const t='遭遇　'+ENEMY_KINDS[enemy.kind].name;
  const t2='—　進 入 戰 鬥　—';
  ctx.fillStyle='rgba(6,7,12,.62)';
  ctx.fillRect(W/2-92,yy-22,184,46);
  ctx.fillStyle='rgba(216,205,180,.92)'; ctx.fillText(t,W/2,yy-4);
  ctx.fillStyle='#c9a227'; ctx.font='12px "Noto Serif TC",serif';
  ctx.fillText(t2,W/2,yy+16);
  ctx.restore();
  ctx.textAlign='left';
}

function drawEnemy3D(scaleH,horizon,sinp,cosp,now){
  if(!enemy) return;
  const C=ENEMY_CFG;
  const K=ENEMY_KINDS[enemy.kind];   // 兩條繪製路徑都要，提到最前面宣告
  const sxk=W/BW, syk=VIEWH/BH;
  const project=(wx,wy,alt)=>{
    const dx=wx-cam.x, dy=wy-cam.y;
    let z=dx*(-sinp)+dy*(-cosp); if(z<20) z=20;
    const sv=(dx*cosp+dy*(-sinp))/z;
    return [((sv+1)/2*BW)*sxk,
            (((cam.alt-alt)/z + z*curvAt(sv))*scaleH+horizon)*syk,
            z, W/(2*z)];
  };
  // 頭的深度先算一次：整隻在身後或太遠就不畫
  const hp=project(enemy.x,enemy.y,enemy.alt);   // bob 只影響繪製，剔除用本體高度
  const zc=hp[2];
  if(zc>ZFAR*0.95) return;

  const S=sky();
  /* 振翅浮動：疊在繪製端而不是寫回 enemy.alt —— 寫回去會跟上面的指數逼近
     互相拉扯，變成一邊追目標一邊被浮動推開，收斂不了。 */
  const bob=Math.sin(now*0.0031+enemy.phase)*5.5;
  /* 受光：跟船與地形同一盞燈。夜裡壓暗並偏冷（銀月是冷光），
     日夕之交偏暖 —— 常數與 drawShip 的色調同源。 */
  const nightK=clamp(1-S.day*1.2,0,1);
  const lit=clamp(0.26+S.day*0.74,0.26,1);
  const warmR=lerp(1,1.12,S.dusk), warmG=lerp(1,1.00,S.dusk), warmB=lerp(1,0.84,S.dusk);
  const coolR=lerp(1,0.72,nightK), coolG=lerp(1,0.80,nightK), coolB=lerp(1,1.06,nightK);
  const shade=(r,g,b,a)=>'rgba('+Math.round(clamp(r*lit*warmR*coolR,0,255))+','
                               +Math.round(clamp(g*lit*warmG*coolG,0,255))+','
                               +Math.round(clamp(b*lit*warmB*coolB,0,255))+','+a+')';

  /* ── 剛體怪（plan:'rigid'）─────────────────────────────────────
     不變形、不分節，整隻依「朝向 vs 鏡頭」挑一張方位圖貼上去。
     判準是船的朝向與「船→鏡頭」向量的夾角：
       |θ|<40°  → 正面（朝你來）
       |θ|>140° → 背面（背對你）
       其餘      → 側視，左右由外積正負決定
     ⚠ 不做螢幕旋轉：飛船是保持水平的，轉向時換的是**視角**不是傾角。
       鏈狀怪那套 ang−π/2 的旋轉搬過來會把船轉成直立。 */
  if(K.plan==='rigid'){
    const set=enemyArt[enemy.kind];
    const P=project(enemy.x,enemy.y,enemy.alt+bob);
    if(!set || P[2]>ZFAR*0.95) return;
    const tcx=cam.x-enemy.x, tcy=cam.y-enemy.y;
    const tl=Math.hypot(tcx,tcy)||1;
    const dot=(enemy.hx*tcx+enemy.hy*tcy)/tl;
    const crs=(enemy.hx*tcy-enemy.hy*tcx)/tl;
    /* 視角換圖要**交叉淡入**，不能過門檻就硬換。
       船的朝向本身已經有角速度上限（turnRate），會突然變的是「用哪張圖」——
       在門檻兩側各留 BAND 的過渡帶，兩張疊著畫、權重線性交換。
       ⚠ 過渡帶不能太寬：兩張圖差異大，疊太久會出現雙重影。±10°，
         再加 smoothstep 讓權重快速通過 50/50 —— 線性的話中段停留最久，
         而中段正是疊影最明顯的地方。

       ── 方位表 ─────────────────────────────────────────────
       每張圖登記它的**原生方位角** th，門檻取相鄰兩張的中點。
       原本只有四張、門檻在 40°/140°，一跳 90° 的形變全靠 squash 硬撐；
       補上兩張斜視圖後成了一圈八個，最遠只差 ~27°。
       flip：斜視圖各自只在一邊是原圖，另一邊得水平鏡射（見 sprite 的註）。
       ⚠ 鏡射要包在 rotate 裡面：side傾是螢幕空間的，鏡的是圖不是傾角。 */
    const th=Math.abs(Math.atan2(crs,dot));
    const R=(crs>0);
    const HALFPI=Math.PI/2;
    const VIEWS=[
      {img:set.front,           th:0,          flip:false, fixed:true},
      {img:set.frontQ,          th:K.qFront,   flip:!R},
      {img:R?set.sideR:set.sideL, th:HALFPI,   flip:false},
      {img:set.rearQ,           th:K.qRear,    flip:R},
      {img:set.rear,            th:Math.PI,    flip:false, fixed:true},
    ].filter(v=>v.img);
    const BAND=0.17;                                  // ±10°
    let ai=0;
    while(ai<VIEWS.length-1 && th>(VIEWS[ai].th+VIEWS[ai+1].th)/2) ai++;
    let vA=VIEWS[ai], vB=null, mix=0;
    const bLo=ai>0 ? (VIEWS[ai-1].th+vA.th)/2 : -1e9;
    const bHi=ai<VIEWS.length-1 ? (vA.th+VIEWS[ai+1].th)/2 : 1e9;
    if(th<bLo+BAND){      vB=VIEWS[ai-1]; mix=sstep(0,1,(bLo+BAND-th)/(2*BAND)); }
    else if(th>bHi-BAND){ vB=VIEWS[ai+1]; mix=sstep(0,1,(th-(bHi-BAND))/(2*BAND)); }
    const img=vA.img;
    if(!img) return;
    const wpp=K.bodyLen/((set.sideR||img).width);     // 世界單位／來源像素（側視寬＝船長）
    /* 依夾角**橫向收縮**：船轉向鏡頭時，船身的視長 ∝ sinθ。
       每張圖只需補「離它自己的原生角度」那一段：squash = sinθ / sin(原生θ)，
       所以在門檻上兩張算出來的寬度**完全相等** —— 接縫不會有寬度跳動。
       ⚠ 正面／背面圖不套（fixed）：θ=0 時船身視長為零，那張圖的寬度代表的是
         **帆桁的展幅**不是船長，跟著 sinθ 縮會直接壓成一條線。
       ⚠ 桅杆與帆是直立的、理論上不該跟著橫縮。只有四張圖時側視得縮到 0.30，
         那個誤差是看得出來的；補上斜視圖後側視最多只縮到 0.90，已無妨。 */
    /* 收縮有下限:輪廓寬其實是 max(船長·sinθ, 帆桁展幅·cosθ) —— 接近正／背面時
       撐住寬度的是帆桁不是船長,一路照 sinθ 縮會縮到比正面圖還窄。
       實測 150°~154° 就有一個 10% 的凹陷(斜後圖 74px 對背視圖 82px)。
       下限取「端點視圖的寬度」:那張圖畫的正是帆桁展幅,拿它當底最省事。
       (舊碼的 max(0.30,…) 是同一件事的土法版,0.30 是湊的,這裡有依據。) */
    const endW=(set.front&&set.rear)?Math.min(set.front.width,set.rear.width):0;
    const sq=(v)=>{
      if(v.fixed) return 1;
      const q=Math.abs(Math.sin(th))/Math.sin(v.th);
      return endW?Math.max(q,endW/v.img.width):q;
    };
    const squash=sq(vA);
    const w=img.width*wpp*P[3]*squash, h=img.height*wpp*P[3];
    if(w<2) return;
    const imgB=vB?vB.img:null;
    const wB=imgB?imgB.width*wpp*P[3]*sq(vB):0, hB=imgB?imgB.height*wpp*P[3]:0;
    const pad=Math.ceil(Math.max(w,h,wB,hB)*0.6)+6;   // 兩張都要框得下
    const x0=Math.round(P[0]-w/2)-pad, y0=Math.round(P[1]-h/2)-pad;
    const fw=Math.ceil(w)+pad*2, fh=Math.ceil(h)+pad*2;
    const pk=clamp(BW/W*C.pixelScale,0.15,1);
    const bwp=Math.max(2,Math.round(fw*pk)), bhp=Math.max(2,Math.round(fh*pk));
    if(!enemyFB || enemyFB.width!==bwp || enemyFB.height!==bhp){
      enemyFB=document.createElement('canvas'); enemyFB.width=bwp; enemyFB.height=bhp;
      EC=enemyFB.getContext('2d');
    }
    EC.setTransform(1,0,0,1,0,0); EC.clearRect(0,0,bwp,bhp);
    EC.setTransform(bwp/fw,0,0,bhp/fh,-x0*bwp/fw,-y0*bhp/fh);
    /* 側傾：繞船自己的中心轉一個小角度。飛船保持水平飛行，但轉彎會外傾。 */
    const roll=(enemy.roll||0)*0.28;      // 最大約 16°
    EC.save(); EC.translate(P[0],P[1]); EC.rotate(roll);
    const blit=(im,ww,hh,flip,al)=>{
      EC.globalAlpha=al;
      if(flip){ EC.save(); EC.scale(-1,1); EC.drawImage(im,-ww/2,-hh/2,ww,hh); EC.restore(); }
      else EC.drawImage(im,-ww/2,-hh/2,ww,hh);
    };
    /* ⚠ 權重取**平方根**不是直接用 mix:兩張各畫 0.5 疊起來,覆蓋率是
       0.5+0.5-0.25＝0.75 —— 過渡帶正中央的船會有四分之一透明度,天空
       透出來,整艘船發白。等功率(sqrt)權重把最低覆蓋率拉到 0.91,
       兩端仍精確收斂到 1／0,不會在門檻上跳。 */
    blit(img,w,h,vA.flip,imgB?Math.sqrt(1-mix):1);
    if(imgB) blit(imgB,wB,hB,vB.flip,Math.sqrt(mix));
    EC.globalAlpha=1; EC.restore();
    ctx.save(); ctx.imageSmoothingEnabled=false;
    clipByTerrainDepth(P[2],W/BW,VIEWH/BH);   // 山也該擋住船
    ctx.drawImage(enemyFB,0,0,bwp,bhp,x0,y0,fw,fh);
    ctx.restore();
    if(enemy.state==='engage') drawEngagePrompt();
    return;
  }

  /* 體節沿**軌跡**排，不是沿 −heading 拉一條直線。
     直線的話整條蟲是剛體，轉向時會像一根棒子在原地轉。沿軌跡排之後，
     每一節都走頭曾經走過的位置 —— 轉彎自然成為一條弧，身體依序跟上。 */
  const segL=K.bodyLen/K.segs;
  const wob=now*K.waveHz+enemy.phase;
  /* 追擊/遭遇時扭得猙獰：振幅放大，並疊上兩個**不整除**的倍頻，
     相位再隨節次錯開 —— 單一正弦是規律的波浪，怎麼加大都只是「游得快」；
     要讓它讀成「竄」就得破壞週期性，讓相鄰體節的擺向對不上。 */
  const rage=(enemy.state==='chase'||enemy.state==='engage')?1:0;
  const spine=[{x:enemy.x,y:enemy.y}].concat(enemy.trail||[]);
  const posAt=(d)=>{
    let acc=0;
    for(let j=1;j<spine.length;j++){
      const a=spine[j-1], b=spine[j];
      const sd=Math.hypot(b.x-a.x,b.y-a.y);
      if(acc+sd>=d){ const f=sd?(d-acc)/sd:0;
        return {x:a.x+(b.x-a.x)*f, y:a.y+(b.y-a.y)*f}; }
      acc+=sd;
    }
    const e=spine[spine.length-1]||spine[0];       // 軌跡不夠長就沿當下朝向外推
    const rem=d-acc;
    return {x:e.x-enemy.hx*rem, y:e.y-enemy.hy*rem};
  };
  const pts=[];
  for(let i=0;i<K.segs;i++){
    const base=posAt(segL*i), aft=posAt(segL*i+8);
    let ux=base.x-aft.x, uy=base.y-aft.y;
    const ul=Math.hypot(ux,uy)||1; ux/=ul; uy/=ul;   // 該節的局部前進方向
    const w1=Math.sin(wob-i*K.wavePhase);
    const w2=rage*0.60*Math.sin(wob*2.37-i*1.90+Math.sin(i*2.1)*2.0);
    const w3=rage*0.38*Math.sin(wob*3.91+i*0.70);
    const off=(w1+w2+w3)*K.waveAmp*(1+rage*0.85)*(0.35+i/K.segs);   // 尾巴擺幅大
    if(K.vertical) pts.push(project(base.x, base.y, enemy.alt+bob+off));
    else           pts.push(project(base.x-uy*off, base.y+ux*off, enemy.alt+bob));
  }


  /* ── 像素化：先縮小再放大 ─────────────────────────────────────
     牠是用向量畫的，邊緣本來就是平滑的——貼在 234×334 上採樣的地形上，
     整隻像一張高解析貼紙浮在馬賽克世界裡。作法同飛空艇的 shipFB：
     先在 pk 倍的低解析緩衝上畫完，再關掉平滑用 nearest 放大貼回。
     pk = BW/W = 0.6，剛好跟地形緩衝同一個解析度級距。
     ⚠ 緩衝範圍要框住整隻（含翅與步足），不然邊緣會被裁掉。
     ⚠ 提示文字不進緩衝——那是 UI，不該跟著糊。 */
  /* 外框要涵蓋「實際會畫多寬」。
     ⚠ 這個值原本寫死 52（程序翅的翅展 46 加餘裕）。換成素材之後，
       一張俯視圖的全寬是蜈蚣 172／羽蛇 290 世界單位，半寬就已經超出 52 ——
       結果左右被切掉、低解析緩衝被內容塞滿。改成由素材自己算。 */
  const _art=enemyArt[enemy.kind], _sp=K.sprite;
  const marginW=(_art&&_sp)
    ? _art.width*(K.bodyLen/((_sp.body[1]-_sp.body[0])*_art.height))*0.62
    : 52;
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const P of pts){
    const m=Math.max(6,P[3]*marginW);
    if(P[0]-m<x0)x0=P[0]-m; if(P[0]+m>x1)x1=P[0]+m;
    if(P[1]-m<y0)y0=P[1]-m; if(P[1]+m>y1)y1=P[1]+m;
  }
  x0=Math.max(x0,-400); y0=Math.max(y0,-400); x1=Math.min(x1,W+400); y1=Math.min(y1,VIEWH+400);
  const fw=Math.ceil(x1-x0), fh=Math.ceil(y1-y0);
  if(fw<2||fh<2||x1<0||y1<0||x0>W||y0>VIEWH) return;
  const pk=clamp(BW/W*C.pixelScale,0.15,1);
  const bwp=Math.max(2,Math.round(fw*pk)), bhp=Math.max(2,Math.round(fh*pk));
  if(!enemyFB || enemyFB.width!==bwp || enemyFB.height!==bhp){
    enemyFB=document.createElement('canvas'); enemyFB.width=bwp; enemyFB.height=bhp;
    EC=enemyFB.getContext('2d');
  }
  EC.setTransform(1,0,0,1,0,0);
  EC.clearRect(0,0,bwp,bhp);
  // 之後一律用「螢幕座標」思考：緩衝自己吸收縮放與位移
  EC.setTransform(bwp/fw,0,0,bhp/fh,-x0*bwp/fw,-y0*bhp/fh);
  EC.save();
  EC.lineCap='round'; EC.lineJoin='round';

  /* 眼睛（兩種怪共用）：夜裡發亮。
     ⚠ 亮度不吃 shade()：那盞燈是「反射的天光」，而眼睛是**自體發光**，
       天越暗它該越顯眼而不是越暗——照 shade 走就會跟著全身一起沉下去。
     ⚠ 用 lighter 疊加：光點要在暗底上「亮起來」而不是「塗上去」。
     白天也留一點餘光，只是被日光壓過（同銀月的處理）。 */
  const drawEyes=(P,ang,r,col)=>{
    const puls=0.55+0.45*Math.sin(now*0.0125+enemy.phase*3);
    const glow=(0.16+nightK*0.84)*puls;
    const er=r*0.30, ex=r*0.42;
    EC.save(); EC.globalCompositeOperation='lighter';
    for(const sgn of [1,-1]){
      const gx=P[0]+Math.cos(ang)*ex-Math.sin(ang)*sgn*r*0.40;
      const gy=P[1]+Math.sin(ang)*ex+Math.cos(ang)*sgn*r*0.40;
      const R2=Math.max(1.2,er*2.6);
      const gg=EC.createRadialGradient(gx,gy,0,gx,gy,R2);
      gg.addColorStop(0,'rgba('+col[0]+','+Math.round(col[1]*glow)+','+Math.round(col[2]*glow)+','+(0.95*glow).toFixed(3)+')');
      gg.addColorStop(0.35,'rgba('+col[3]+','+col[4]+','+col[5]+','+(0.55*glow).toFixed(3)+')');
      gg.addColorStop(1,'rgba('+col[3]+','+col[4]+','+col[5]+',0)');
      EC.fillStyle=gg;
      EC.beginPath(); EC.arc(gx,gy,R2,0,Math.PI*2); EC.fill();
      EC.fillStyle='rgba(255,'+Math.round(150*glow+40)+','+Math.round(120*glow+30)+','+(0.9*glow+0.1).toFixed(3)+')';
      EC.beginPath(); EC.arc(gx,gy,Math.max(0.6,er),0,Math.PI*2); EC.fill();
    }
    EC.restore();
  };
  const segAng=i=>Math.atan2(pts[i][1]-pts[i-1][1], pts[i][0]-pts[i-1][0]);
  /* 拍翅曲線：蟲翅用 |cos|（過零點的尖角就是那個「啪」），
     鳥翼用平滑正弦（0..1 之間順順地來回，沒有頓挫）。 */
  const flap=K.wingSmooth ? 0.5+0.5*Math.sin(now*K.wingHz)
                          : Math.abs(Math.cos(now*K.wingHz));

  /* ── 精靈模式（plan:'chain'）─────────────────────────────────────
     俯視圖是**筆直**畫的，所以可以沿圖高切成橫條：每個體節取 body 區間裡
     對應的一條，貼在該節的投影位置、轉到該節的方向。彎曲是由「各節位置」
     產生的，不需要別的角度的整條身體。
     ⚠ 精靈朝上（12 點），而 ang 是「由前一節指向本節」＝朝尾。
       要把精靈的 +y（尾向）對到 ang，旋轉量是 ang−π/2。
     ⚠ 翅仍走程序：它要獨立振動，在俯視圖裡又跟身體重疊，切不開。 */
  const art=enemyArt[enemy.kind], SP=K.sprite;
  if(art && SP){
    /* 圖分三段：head / wings / body(含尾)。
       ⚠ body 一定要含尾：羽蛇的長度大半在羽尾上，只把中間那段當身體
         會讓「每來源像素代表幾個世界單位」算大好幾倍，整隻炸開成色塊。
         判準是**每列寬度剖面**量出來的（翅那段明顯寬出來），不是目測。
       ⚠ 翅獨立成一塊剛體貼在肩上：翅要振動，跟身體同一條鏈就只能跟著扭。
         正俯視下振翅＝展幅在縮放，所以橫向縮放即可，不必另外的角度。 */
    const bodyFrac=SP.body[1]-SP.body[0];
    const wpp=K.bodyLen/(bodyFrac*art.height);        // 世界單位／來源像素
    const put=(t0,t1,P,ang,lenPx)=>{
      const sc=P[3], w=art.width*wpp*sc;
      const sy=t0*art.height, sh=Math.max(1,(t1-t0)*art.height);
      EC.save(); EC.translate(P[0],P[1]); EC.rotate(ang-Math.PI/2);
      EC.drawImage(art,0,sy,art.width,sh,-w/2,-lenPx/2,w,lenPx);
      EC.restore();
    };
    const n=pts.length;
    // 身體＋尾：由尾往頭畫，頭才蓋在最上面
    for(let i=n-1;i>=1;i--){
      const t0=SP.body[0]+bodyFrac*((i-1)/(n-1));
      const t1=SP.body[0]+bodyFrac*(i/(n-1));
      const Q=pts[i-1], P=pts[i];
      const gap=Math.hypot(P[0]-Q[0],P[1]-Q[1]);
      const nat=(t1-t0)*art.height*wpp*P[3];
      put(t0,t1,P,segAng(i),Math.max(gap*1.5,nat*1.05));   // 取較大者：既不留縫也不壓扁
    }
    /* 翅：貼在頭後方一節的位置，橫向依 flap 縮放。
       ⚠ 用 scale 而非換圖：正俯視下鳥翼與蟲翅的拍動都是展幅在變，
         這個角度看不出上下揮的差別，換圖只是多載素材。 */
    {
      const P=pts[1]||pts[0];
      const sc=P[3], ang=segAng(1);
      const wt0=SP.wings[0], wt1=SP.wings[1];
      const w=art.width*wpp*sc*(0.45+flap*0.55);
      const h=(wt1-wt0)*art.height*wpp*sc;
      if(w>1.5){
        EC.save(); EC.translate(P[0],P[1]); EC.rotate(ang-Math.PI/2);
        EC.drawImage(art,0,wt0*art.height,art.width,(wt1-wt0)*art.height,-w/2,-h/2,w,h);
        EC.restore();
      }
    }
    // 頭
    {
      const P=pts[0];
      const ang=Math.atan2(pts[0][1]-pts[1][1], pts[0][0]-pts[1][0])+Math.PI;
      const lp=(SP.head[1]-SP.head[0])*art.height*wpp*P[3];
      put(SP.head[0],SP.head[1],P,ang,Math.max(2,lp));
    }
    // 眼：自發光，疊在素材之上
    {
      const P0=pts[0], r0=Math.max(1,P0[3]*art.width*wpp*0.10);
      const a0=Math.atan2(pts[0][1]-pts[1][1], pts[0][0]-pts[1][0]);
      drawEyes(P0,a0,r0, enemy.kind==='serpent'?[255,210,60,238,176,30]:[255,70,40,226,26,18]);
    }

  }else if(enemy.kind==='centipede'){
    /* 步足：分兩段（腿節＋跗節）帶一個關節。單一直線在近處就是一根牙籤，
       有折點才有蟲腳的感覺。 */
    for(let i=1;i<pts.length;i++){
      const P=pts[i], sc=P[3], r=Math.max(0.8,sc*3.4);
      if(r<0.35) continue;
      const ang=segAng(i);
      const nx=Math.cos(ang+Math.PI/2), ny=Math.sin(ang+Math.PI/2);
      const sw=Math.sin(wob*1.6-i*0.7)*0.35;
      for(const sgn of [1,-1]){
        const kx=P[0]+nx*sgn*r*1.5+Math.cos(ang)*sw*r*1.2;   // 關節
        const ky=P[1]+ny*sgn*r*1.5+Math.sin(ang)*sw*r*1.2;
        const tx2=P[0]+nx*sgn*r*2.5+Math.cos(ang)*sw*r*2.6;  // 腳尖
        const ty2=P[1]+ny*sgn*r*2.5+Math.sin(ang)*sw*r*2.6;
        EC.strokeStyle=shade(214,158,32,0.95); EC.lineWidth=Math.max(0.7,r*0.34);
        EC.beginPath(); EC.moveTo(P[0],P[1]); EC.lineTo(kx,ky); EC.stroke();
        EC.strokeStyle=shade(176,120,24,0.95); EC.lineWidth=Math.max(0.5,r*0.22);
        EC.beginPath(); EC.moveTo(kx,ky); EC.lineTo(tx2,ty2); EC.stroke();
      }
    }
    /* 體節：背板 + 紋理。由尾往頭畫，頭才蓋在最上面。
       近距離看太糙的原因是一節只有兩個同心橢圓 —— 這裡補上
       前緣高光、後緣暗邊、背中線與隔節色帶。低解析緩衝會把它糊成馬賽克，
       那正好，遠看是質感、近看是像素。 */
    for(let i=pts.length-1;i>=0;i--){
      const P=pts[i], sc=P[3], r=Math.max(0.9,sc*3.9);
      const ang=i>0?segAng(i):segAng(1);
      const band=(i&1)?1:0;                       // 隔節深淺
      EC.save(); EC.translate(P[0],P[1]); EC.rotate(ang);
      EC.fillStyle=shade(band?52:64,band?36:44,band?32:38,1);
      EC.beginPath(); EC.ellipse(0,0,r*1.05,r*0.82,0,0,Math.PI*2); EC.fill();
      if(r>1.6){
        EC.fillStyle=shade(96,64,50,0.55);        // 前緣高光
        EC.beginPath(); EC.ellipse(-r*0.30,0,r*0.52,r*0.62,0,0,Math.PI*2); EC.fill();
        EC.strokeStyle=shade(24,16,14,0.75); EC.lineWidth=Math.max(0.5,r*0.16);
        EC.beginPath(); EC.arc(r*0.55,0,r*0.62,-1.15,1.15); EC.stroke();   // 後緣暗邊
      }
      EC.fillStyle=shade(150,42,30,0.85);         // 背中線
      EC.beginPath(); EC.ellipse(0,0,r*0.62,r*0.30,0,0,Math.PI*2); EC.fill();
      if(r>2.2){
        EC.fillStyle=shade(206,86,52,0.5);
        EC.beginPath(); EC.ellipse(-r*0.10,0,r*0.26,r*0.13,0,0,Math.PI*2); EC.fill();
      }
      EC.restore();
    }
    // 蟲翅：兩對，附在近頭端。振翅只改展幅——正俯視下拍動就是展幅在縮放
    for(const wi of [1,3]){
      const P=pts[wi]; if(!P) continue;
      const sc=P[3], span=sc*46, chord=sc*11;
      if(span<1.2) continue;
      const ang=segAng(wi);
      for(const sgn of [1,-1]){
        EC.save(); EC.translate(P[0],P[1]);
        EC.rotate(ang+sgn*(Math.PI/2)*(0.34+flap*0.52));
        EC.fillStyle=shade(206,226,246,0.42);
        EC.beginPath(); EC.ellipse(span*0.5,0,span*0.5,chord*(0.42+flap*0.58),0,0,Math.PI*2); EC.fill();
        EC.strokeStyle=shade(226,182,86,0.55); EC.lineWidth=Math.max(0.6,sc*1.1);
        EC.stroke();
        EC.restore();
      }
    }
    // 頭：顎與觸角
    {
      const P=pts[0], sc=P[3], r=Math.max(1,sc*4.2);
      const ang=Math.atan2(pts[0][1]-pts[1][1], pts[0][0]-pts[1][0]);
      EC.fillStyle=shade(70,46,40,1);
      EC.beginPath(); EC.ellipse(P[0],P[1],r*1.15,r*0.9,0,0,Math.PI*2); EC.fill();
      drawEyes(P,ang,r,[255,70,40,226,26,18]);
      EC.strokeStyle=shade(168,34,26,0.95); EC.lineWidth=Math.max(0.7,r*0.22);
      for(const sgn of [1,-1]){                                  // 觸角
        const a2=ang+sgn*0.42;
        EC.beginPath(); EC.moveTo(P[0],P[1]);
        EC.quadraticCurveTo(P[0]+Math.cos(a2)*r*3.2, P[1]+Math.sin(a2)*r*3.2,
                            P[0]+Math.cos(a2+sgn*0.5)*r*5.4, P[1]+Math.sin(a2+sgn*0.5)*r*5.4);
        EC.stroke();
      }
    }

  }else{
    /* ── 羽蛇 ─────────────────────────────────────────────────────
       奶白鱗身、藍白鳥羽。身側每隔幾節有一對羽鰭，尾端是羽扇。 */
    // 羽鰭：畫在身體之下，只露出兩側
    for(let i=3;i<pts.length-1;i+=3){
      const P=pts[i], sc=P[3], r=Math.max(0.8,sc*3.2);
      if(r<0.6) continue;
      const ang=segAng(i);
      const len=r*(3.4-i/pts.length*1.4)*(0.82+flap*0.18);
      for(const sgn of [1,-1]){
        EC.save(); EC.translate(P[0],P[1]); EC.rotate(ang+sgn*1.15);
        EC.fillStyle=shade(150,178,222,0.62);
        EC.beginPath(); EC.ellipse(len*0.5,0,len*0.5,r*0.42,0,0,Math.PI*2); EC.fill();
        EC.fillStyle=shade(236,242,252,0.55);
        EC.beginPath(); EC.ellipse(len*0.42,0,len*0.34,r*0.20,0,0,Math.PI*2); EC.fill();
        EC.restore();
      }
    }
    // 身體：奶白鱗身 + 背側藍灰
    for(let i=pts.length-1;i>=0;i--){
      const P=pts[i], sc=P[3], r=Math.max(0.9,sc*3.3);
      const ang=i>0?segAng(i):segAng(1);
      EC.save(); EC.translate(P[0],P[1]); EC.rotate(ang);
      EC.fillStyle=shade(228,220,196,1);
      EC.beginPath(); EC.ellipse(0,0,r*1.10,r*0.80,0,0,Math.PI*2); EC.fill();
      EC.fillStyle=shade(148,170,206,0.55);                 // 背側偏藍
      EC.beginPath(); EC.ellipse(0,-r*0.26,r*0.92,r*0.36,0,0,Math.PI*2); EC.fill();
      if(r>1.6){                                            // 鱗帶
        EC.strokeStyle=shade(186,174,146,0.75); EC.lineWidth=Math.max(0.5,r*0.15);
        EC.beginPath(); EC.arc(r*0.50,0,r*0.66,-1.2,1.2); EC.stroke();
      }
      EC.restore();
    }
    /* 鳥翼：一對大翼，分三根初級飛羽疊出來。
       ⚠ 鳥翼不是蟲翅：蟲翅是薄膜，拍動時整片縮放；鳥翼有羽片，
         拍動時是**上下揮**（在正俯視下讀成展幅變化＋前後掃掠），
         所以這裡除了展幅還讓整支翼繞肩點掃一個角度。 */
    {
      const P=pts[2]||pts[1]||pts[0];
      const sc=P[3], span=sc*62;
      if(span>1.5){
        const ang=segAng(2)||segAng(1);
        for(const sgn of [1,-1]){
          EC.save(); EC.translate(P[0],P[1]);
          EC.rotate(ang+sgn*(Math.PI/2)*(0.26+flap*0.30));
          for(let f=0;f<3;f++){
            const t=f/2;
            const L=span*(1-t*0.30), Cw=sc*(9-t*2.4)*(0.55+flap*0.55);
            EC.fillStyle=f===0?shade(244,248,255,0.72)
                       :f===1?shade(196,214,242,0.66)
                             :shade(140,168,214,0.60);
            EC.save(); EC.rotate(-0.20+t*0.42);
            EC.beginPath(); EC.ellipse(L*0.5,0,L*0.5,Cw,0,0,Math.PI*2); EC.fill();
            EC.restore();
          }
          EC.restore();
        }
      }
    }
    // 尾羽扇
    {
      const P=pts[pts.length-1], sc=P[3], L=sc*30;
      if(L>1.2){
        const ang=segAng(pts.length-1);
        EC.save(); EC.translate(P[0],P[1]); EC.rotate(ang);
        for(let f=-1;f<=1;f++){
          EC.fillStyle=shade(214,228,248,0.6);
          EC.save(); EC.rotate(f*0.34);
          EC.beginPath(); EC.ellipse(L*0.5,0,L*0.5,sc*3.2,0,0,Math.PI*2); EC.fill();
          EC.restore();
        }
        EC.restore();
      }
    }
    // 頭：楔形、黃眼、紅信
    {
      const P=pts[0], sc=P[3], r=Math.max(1,sc*3.8);
      const ang=Math.atan2(pts[0][1]-pts[1][1], pts[0][0]-pts[1][0]);
      EC.save(); EC.translate(P[0],P[1]); EC.rotate(ang);
      EC.fillStyle=shade(238,232,212,1);
      EC.beginPath(); EC.moveTo(r*1.5,0); EC.lineTo(-r*0.7,-r*0.85);
      EC.lineTo(-r*0.7,r*0.85); EC.closePath(); EC.fill();
      EC.restore();
      // 信子：分岔，隨振翅節奏吐納
      if(r>1.4){
        const tl=r*(1.6+0.9*Math.max(0,Math.sin(now*0.006+enemy.phase)));
        EC.strokeStyle=shade(206,32,36,0.95); EC.lineWidth=Math.max(0.5,r*0.16);
        for(const sgn of [1,-1]){
          EC.beginPath(); EC.moveTo(P[0]+Math.cos(ang)*r*1.3, P[1]+Math.sin(ang)*r*1.3);
          EC.lineTo(P[0]+Math.cos(ang+sgn*0.22)*(r*1.3+tl), P[1]+Math.sin(ang+sgn*0.22)*(r*1.3+tl));
          EC.stroke();
        }
      }
      drawEyes(P,ang,r,[255,210,60,238,176,30]);
    }
  }
  EC.restore();
  // 貼回主畫布：關平滑 → 自然像素化
  ctx.save();
  ctx.imageSmoothingEnabled=false;
  clipByTerrainDepth(zc,W/BW,VIEWH/BH);       // 山也該擋住怪
  ctx.drawImage(enemyFB,0,0,bwp,bhp,Math.round(x0),Math.round(y0),fw,fh);
  ctx.restore();

  if(enemy.state==='engage') drawEngagePrompt();

}

/* ══ 聚落（3D 飛行畫面）══
   聚落在世界裡是有大小的東西，不是地圖上的一枚圖釘 —— 飛過去就該看見城。
   投影與地標同一套（drawPlaces），差別是還要換算「一個世界單位在這個
   深度佔幾個螢幕像素」：橫向視錐在深度 z 的半寬就是 z，對應 BW 個緩衝像素，
   所以 1 世界單位 = W/(2z) 螢幕像素。
   ⚠ 遮擋要同時看「高度」與「深度」。ybuf 是該欄地形的最高列，但那通常是
     **最遠**的山脊（越遠的高地投影越靠地平線＝列數越小），聚落位在它下方
     是正常的，不代表被擋 —— 只比 ybuf 會把每一座城都判成看不見。
     真正被擋的條件是：那一列的來源比聚落**更近**（ybufZ < z），而且它
     壓在聚落的地面之上（ybuf < by）。兩者同時成立才是前面有山。
   ⚠ LOD 交給 settlement.js 依螢幕直徑自己決定，遠處自動退成符號。 */
/* 逐欄深度遮擋：把繪圖區裁成「這個深度看得到的部分」。
   地形是逐欄光柵化的，ybuf[i] 是該欄最上面那一列、ybufZ[i] 是畫那一列時的深度。
   欄內越往下地形越近，所以只要**該欄的稜線比目標更近**（ybufZ<Z），
   目標在這一欄就只能出現在稜線之上；否則整欄都可見。
   ⚠ 這是引擎現有資訊能做到的最好近似：沒有逐像素深度緩衝，只有每欄的
     頂列與其深度。對「山擋住城／船」這件事已經夠用。
   ⚠ 逐欄一個 rect（BW=234 個）就好，不做 run 合併：路徑建構本來就便宜，
     合併的判斷式反而比省下來的多。 */
/* ⚠ c0/c1＝只裁「目標實際畫得到」的那幾欄。整排 BW 欄建一次路徑本身不貴，
     貴的是**裁切路徑越複雜、之後每一次繪製都要跟著付**（手機上非矩形 clip
     會逼出遮罩路徑）。城在畫面上通常只橫跨十幾欄，卻讓整張圖的貼回吃 234 欄的遮罩。 */
function clipByTerrainDepth(Z,sxk,syk,c0,c1){
  const a=(c0===undefined)?0:clamp(c0|0,0,BW-1);
  const b=(c1===undefined)?BW-1:clamp(c1|0,0,BW-1);
  ctx.beginPath();
  for(let i=a;i<=b;i++){
    const lim=(ybufZ[i]<Z)?ybuf[i]:BH;
    if(lim<=0) continue;
    ctx.rect(i*sxk,0,sxk+0.6,lim*syk);
  }
  ctx.clip();
}

/* 最近那座「畫得出來」的城有多深 —— 雲的分趟分界（見 render / drawPuffs）。
   沒有城在畫面裡就回 Infinity：雲全部在城之前那一趟畫完，行為與分趟前相同。 */
function nearestSettleZ(sinp,cosp){
  if(!window.Settlement || !MAPW) return Infinity;
  let best=Infinity;
  for(const s of buildSettlements()){
    const dx=s.mx*MAP_SCALE-cam.x, dy=s.my*MAP_SCALE-cam.y;
    const z=dx*(-sinp)+dy*(-cosp);
    if(z>60 && z<best && z<ZFAR*0.9) best=z;
  }
  return best;
}

function drawSettlements3D(scaleH,horizon,sinp,cosp){
  if(!window.Settlement || !MAPW) return;
  const sxk=W/BW, syk=VIEWH/BH;
  const nightK=clamp(1-sky().day*1.25,0,1);      // 入夜程度：城裡的燈火強度
  /* 「這個聚落局部座標是不是落在水上」。城的輪廓是幾何生成的圓角多邊形，
     不認得海岸線，臨海的城必然有一部分伸出陸塊 —— 那一段不能照常長房子
     （會變成蓋在海面上的樓），改畫成碼頭。 */
  const seaProbe=(s,lx,ly)=>{
    const mx=(s.mx+lx)|0, my=(s.my+ly)|0;
    if(mx<0||my<0||mx>=MAPW||my>=MAPH) return true;
    return HGT[my*MAPW+mx]<=CLOUD_H;
  };
  const list=[];
  for(const s of buildSettlements()){
    const dx=s.mx*MAP_SCALE-cam.x, dy=s.my*MAP_SCALE-cam.y;
    const z=dx*(-sinp)+dy*(-cosp);
    /* 剔除要按「城的角半徑」放寬，不能只看城心那一點。
       ⚠ 這裡原本是：sv 超過 ±1.35 就丟，而且 col 一旦落在 [0,BW) 之外
         就直接 continue —— col 是由 sv 換算的，等於實質剔除線是 sv∈[-1,1]，
         也就是**城心必須進畫面，整座城才會突然出現**。城越大越明顯：
         帝都半徑 440 世界單位，z=500 時本身就橫跨 sv ±0.88，
         城心還在畫面外時早該看到半座城了。
       ⚠ z 也不能用 60 當下限硬丟：飛到城上空時城心的 z 會趨近 0 甚至為負，
         但大半座城還在前方。改成「整座都在身後」才丟。 */
    /* ⚠ 手繪平面圖比城區半徑大（planW 1050 vs 2R 880），剔除半徑要取兩者較大，
       否則又會變成「城心進畫面才整張冒出來」—— 跟先前那個 bug 同一個病。 */
    const Rw=Math.max(SETTLE_R[s.tier]*MAP_SCALE, (s.planW||0)*0.72);
    if(z>ZFAR*0.9 || z<-Rw) continue;
    const zc=Math.max(z,40);                      // 角度換算用的安全深度
    const sv=(dx*cosp+dy*(-sinp))/zc;
    const svR=Rw/zc;                              // 城在畫面上的角半徑
    if(sv+svR<-1.35 || sv-svR>1.35) continue;
    const col=clamp(Math.round(((sv+1)/2)*BW),0,BW-1);
    /* ⚠ 地面高度用整平後的地基（s.gh），不是 HGT[中心格]。原本中心格若在海裡
       會退回 CLOUD_H＝把城擺在雲海表面上，那就是「城飄在雲上」的來源。 */
    const gh=s.gh;
    const by=((cam.alt-gh)/zc + zc*curvAt(sv))*scaleH+horizon;    // 緩衝列
    /* ⚠ 這裡不再做「整座剔除」：先前是拿城心那一欄判斷，城一大就會整座誤剔
       （中心那一欄擋不擋得住，跟整座城看不看得見無關）。改成畫的時候
       逐欄裁切（clipByTerrainDepth），被擋的部分自然消失、沒被擋的照畫。 */
    list.push({s, z, x:((sv+1)/2*BW)*sxk, y:by*syk});
  }
  list.sort((a,b)=>b.z-a.z);                                       // 遠的先畫
  for(const o of list){
    const sc=W/(2*Math.max(o.z,40));                                // 世界單位 → 螢幕像素
    const R=SETTLE_R[o.s.tier]*MAP_SCALE;                          // 半徑（世界單位）
    if(R*2*sc<3) continue;
    ctx.save();
    /* 城要跟同深度的地形吃同一份霧。原本只有一個「靠近 ZFAR 才淡出」的
       距離淡出，中景的城完全不吃霧 —— 周圍地表已經被霧洗掉一半、城還是
       滿對比，看起來就是浮在霧前面的一張圖。這裡直接套用地形那條霧曲線
       （FOG_START/FOG_MAX 同源），城才會跟著地面一起沉進大氣裡。 */
    const fogS=ZFAR*FOG_START;
    const fogK=clamp((o.z-fogS)/(ZFAR-fogS),0,1)*FOG_MAX;
    /* ⚠ 手繪平面圖的城延後裁切：它畫在自己的緩衝上（不吃 ctx 的 clip），
       真正需要裁的只有最後那一次貼回，而那時才知道實際外框是哪幾欄。
       程序生成的城則是逐筆畫在 ctx 上，必須先裁。 */
    const planCity=!!(o.s.plan&&cityPlanArt[o.s.plan]);
    if(!planCity) clipByTerrainDepth(o.z,sxk,syk);   // 前面的山稜要擋住城
    ctx.globalAlpha=clamp((ZFAR*0.9-o.z)/(ZFAR*0.30),0,1)*(1-fogK);
    /* 逐點投影：城的每個點走跟地形完全同一條投影式 → 天生黏在地表上。
       lx/ly 是聚落局部座標（地圖像素），先換成世界座標，再照 render() 那條
       公式算深度與螢幕位置。z 夾一個下限，免得飛到城正上方時分母爆掉。 */
    const gS=o.s.gh;
    const project=(lx,ly,hOff)=>{
      const dx=(o.s.mx+lx)*MAP_SCALE-cam.x, dy=(o.s.my+ly)*MAP_SCALE-cam.y;
      const zRaw=dx*(-sinp)+dy*(-cosp);
      const zz=zRaw<24?24:zRaw;
      const sv=(dx*cosp+dy*(-sinp))/zz;
      return [((sv+1)/2*BW)*sxk,
              (((cam.alt-gS-(hOff||0))/zz + zz*curvAt(sv))*scaleH+horizon)*syk,
              (W/(2*zz))*MAP_SCALE,    // 第三項：該點自己的尺度（螢幕px／地圖px）
              zRaw];                   // 第四項：**未夾的**深度，格子要靠它判斷該不該畫
    };
    /* project 的無配置版本：同一條式子，結果寫進 typed array 的 off..off+3。
       網格投影每幀要算幾千個點，光是回傳陣列的配置就吃掉一截畫格時間。 */
    const projectInto=(A,off,lx,ly,hOff)=>{
      const dx=(o.s.mx+lx)*MAP_SCALE-cam.x, dy=(o.s.my+ly)*MAP_SCALE-cam.y;
      const zRaw=dx*(-sinp)+dy*(-cosp);
      const zz=zRaw<24?24:zRaw;
      const sv=(dx*cosp+dy*(-sinp))/zz;
      A[off]  =((sv+1)/2*BW)*sxk;
      A[off+1]=(((cam.alt-gS-(hOff||0))/zz + zz*curvAt(sv))*scaleH+horizon)*syk;
      A[off+2]=(W/(2*zz))*MAP_SCALE;
      A[off+3]=zRaw;
    };
    /* 舊的仿射近似留著給尺寸用（建築量體大小仍以城中心的深度為準）。 */
    /* 地面壓縮率（tilt）：讓城真的躺在地上。
       橫向：1 世界單位 = sc 螢幕像素。
       縱向：地面列是 ((alt-gh)/z + z*curv)*scaleH，對 z 微分得
              (-(alt-gh)/z² + curv)*scaleH → 再乘 syk 換成螢幕像素。
       兩者相除就是這個深度的真實壓縮率。固定 0.58 是地圖畫面用的斜角常數，
       搬到 3D 裡就成了一張不隨視角變形的貼紙浮在地表上。
       ⚙ 夾上下限：飛得極低時 z² 分母會把值推到失控。 */
    const dydz=(-(cam.alt-o.s.gh)/(o.z*o.z)+curvAt(0))*scaleH*syk;
    const tilt=clamp(Math.abs(dydz)/sc,0.06,1.10);
    /* ── 手繪平面圖：網格投影 ───────────────────────────────────
       把平面圖切成 N×N 格，每格各自投影 —— 用一堆小的仿射變換去逼近
       1/z 的非線性投影。這是用 canvas 2D 貼地面貼圖的標準作法。

       ⚠ 為什麼不能只切橫條（我的第一版）：條是沿圖自己的 v 軸切的，
         但平面圖是轉過角度的（planRot），**等 v 線不是等深度線**。
         實測同一條的兩端深度差到 1658 vs 544，一個仿射矩陣根本吃不下，
         畫出來是滿畫面的斜向拖曳。二維切分才與朝向無關。
       ⚠ 每格取三個角算矩陣（仿射只能表達平行四邊形），第四角的誤差
         在一格之內可以忽略；格子越多誤差越小。
       ⚠ 格距隨深度調（見下方 walk）：遠處的城只有幾十像素，切 40×40 是純浪費。
       ⚠ 由遠而近畫：近的要蓋住遠的。深度對 (jx,jy) 是仿射的，所以這件事
         只是兩個掃描方向，不必排序（見下方的 jx0/jy0）。
       ⚠ 相鄰格的來源矩形多取 0.6px、目的地也多畫一點：不重疊會露出格線。 */
    const planImg=o.s.plan?cityPlanArt[o.s.plan]:null;
    if(planImg){
      const hw=o.s.planW*0.5, hh=hw*planImg.height/planImg.width;
      const ca=Math.cos(o.s.planRot), sa=Math.sin(o.s.planRot);
      /* ── 格距依深度分配（不是均勻切）─────────────────────────
         一格若在螢幕上還有幾十像素，仿射逼近的誤差就會在格邊裂開
         （相鄰格各用自己的三個角算矩陣，第四角對不起來）。
         仿射逼近的誤差看的是「一格橫跨多少深度比例」，所以格子該在**螢幕上**
         等大，而不是在圖上等大。均勻切的話格距要遷就最近的那一排，遠處那半張
         圖就陪著一起切細 —— 實測近距離 1600 格裡真正畫出來的只有 500 格上下，
         其餘不是在畫面外就是在身後，而遠處那些畫出來的格子每格只有一兩像素。

         深度對平面座標 (u,v) 是**仿射**的：
           z(u,v) = zc + A·u + B·v，A＝hw·(−ca·sinp − sa·cosp)、B＝hh·(sa·sinp − ca·cosp)
         而一格投影後的緩衝像素寬 ≈ Δu·hw·(W/2z)·pk。要它等於 T 個像素就是
           Δu = 2T·z /(hw·W·pk)  —— 步長正比於該處的深度，z 大的地方自動跳大格。
         ⚠ 步數要有上限（近處 z→0 時步長跟著→0），作法見下方 walk。 */
      /* 每格目標大小（低解析緩衝的像素）。舊版是「城心那個深度 9 像素」，
         近處的格子實際上遠比 9 大；現在是**每一格都**約這麼大，所以同樣的
         數字會切出更多格。11 是與舊版畫面比對後取的：近景比舊版細、
         中景略粗一點看不出來，格數少一半。 */
      const CELL_PX=11;
      const N_MAX=32;                               // 單軸格數上限（近距離會頂到）
      const pkq=clamp(BW/W,0.15,1);
      const zc=(o.s.mx*MAP_SCALE-cam.x)*(-sinp)+(o.s.my*MAP_SCALE-cam.y)*(-cosp);
      const gradU=hw*(-ca*sinp - sa*cosp), gradV=hh*(sa*sinp - ca*cosp);
      /* 沿一軸走出格線：從 −1 走到 +1，步長 ∝ 當地深度。回傳格數。

         ⚠ 步數必須有上限（貼著城飛時近端 z→0，步長跟著→0，格數無底洞），
           但**上限不能靠「走不完就把剩下的併成一格」**——那一格會橫跨整片深度，
           仿射矩陣被拉成放射狀，畫面上就是「城被吸走」的拖曳。ver -171 犯過這個錯。
           正解是先算出「走完全程要幾步」再回頭定步長：
             步數 M = ∫ du/(K·z_eff(u))，z_eff＝max(z,60)（身後的部分夾住）
           所以 K = I/N_MAX，I 是那個積分。z 對 u 是線性的，積分有解析解，
           但夾制段讓它分段——直接數值積分 64 段更短且不會寫錯，成本可以忽略。 */
      const walk=(out,grad,half)=>{
        const SEG=64;
        let I=0;
        for(let i=0;i<SEG;i++){
          const u=-1+2*(i+0.5)/SEG, z=zc+grad*u;
          I+=(2/SEG)/(z>60?z:60);
        }
        let K=2*CELL_PX/Math.max(1e-6,half*W*pkq);
        const Kfit=I/N_MAX;
        if(K<Kfit) K=Kfit;
        let u=-1, k=0; out[0]=-1;
        const cap=N_MAX+4;                         // 數值積分的餘量，正常走不到
        while(u<1 && k<cap){
          const z=zc+grad*u;
          u+=K*(z>60?z:60); k++;
          out[k]=u<1?u:1;
        }
        if(out[k]<1){ k++; out[k]=1; }
        return k;
      };
      if(!cityU){ cityU=new Float64Array(256); cityV=new Float64Array(256); }
      const NU=walk(cityU,gradU,hw), NV=walk(cityV,gradV,hh);
      /* 兩套投影點：地面（G）與抬升後（P）。
         抬升量取自高度圖，讓大教堂與山坡上的莊園立起來、一般屋舍稍微墊高。
         ⚠ 立面刻意很小：這個尺寸下一格才幾像素，立面畫大了必破圖。
         ⚠ 沒有高度圖就 G === P，等於維持原本的平貼。 */
      /* ⚠ 有量體層（MASS）時地面層就**退回平貼**：HM 留 null → hAt 恆 0 →
         GD 與 PT 同值 → lift 為 0，下面那段立面也自動不畫。
         抬升與立面改由量體層負責，兩邊都做就會疊出雙重牆。 */
      /* ⚠ cityMass 是以 **plan**（色圖）為 key，不是 planH。載入時每張 plan
         只抓一次街廓資料，而十一座市鎮共用同一張 mtown_plan。 */
      const MASS=o.s.plan?cityMass[o.s.plan]:null;
      const HM=(!MASS&&o.s.planH)?cityHeight[o.s.planH]:null;
      const tall=o.s.planTall||0;
      const hAt=(u,v)=>{
        if(!HM||!tall) return 0;
        const px=clamp(Math.round((u*0.5+0.5)*(HM.w-1)),0,HM.w-1);
        const py=clamp(Math.round((v*0.5+0.5)*(HM.h-1)),0,HM.h-1);
        return HM.d[py*HM.w+px]/255*tall;
      };
      /* (N+1)×(N+1) 個投影點，存進預配置的 typed array（PT＝抬升後、GD＝地面）。
         ⚠ 舊版是 P/G 兩層陣列、每點一個新的四元素陣列 —— N=40 時每幀 3362 個
           物件。手機的畫格時間有一大截是花在配置與 GC 上，不是在畫。 */
      const NP=(NU+1)*(NV+1);
      if(!cityPts || cityPts.length<NP*4){ cityPts=new Float64Array(NP*4); cityGnd=new Float64Array(NP*4); }
      const PT=cityPts, GD=cityGnd;
      for(let jy=0,q=0;jy<=NV;jy++){
        const v=cityV[jy];
        for(let jx=0;jx<=NU;jx++,q+=4){
          const u=cityU[jx];
          const x=u*hw, y=v*hh;
          const lx=(x*ca-y*sa)/MAP_SCALE, ly=(x*sa+y*ca)/MAP_SCALE;
          projectInto(GD,q,lx,ly,0);
          projectInto(PT,q,lx,ly,hAt(u,v));
        }
      }
      /* 先畫進低解析緩衝再放大貼回。兩個理由：
         · 填充量降到 36%（0.6²）——網格投影是幾百次 drawImage，實測直接畫
           在主畫布上 render 要 51ms（≈19fps）。
         · 城的顆粒才跟世界一致。地形是 234×334 上採樣的，城若用全解析度
           貼，會比地形銳利得多，本身就是違和點。 */
      let bx0=1e9,by0=1e9,bx1=-1e9,by1=-1e9,zmn=1e9;
      for(let q=0;q<NP*4;q+=4){                  // 抬升後的點最高，框它就夠
        const px=PT[q], py=PT[q+1];
        if(px<bx0)bx0=px; if(px>bx1)bx1=px;
        if(py<by0)by0=py; if(py>by1)by1=py;
        if(PT[q+3]<zmn)zmn=PT[q+3];
      }
      /* ⚠ 有量體層時上緣要再往上讓：上面那個外框是用**地面**格點算的，而稜柱
         是往上長的 —— 不讓的話塔頂會被緩衝的上緣切平（實測帝都近距離整排
         屋頂被削掉）。讓的量＝最高的量體在最近的那個深度投影出來的像素高度。 */
      if(MASS&&tall>0) by0-=tall*scaleH*syk/Math.max(60,zmn);
      /* ⚠ 外框夾在**視窗內**，不是視窗外 600px。飛近時量體的投影會遠遠
         溢出畫面，原本那個 ±600 讓緩衝長到 954×524＝約 50 萬像素 ——
         比整個地形緩衝（234×334＝7.8 萬）還大六倍，而且多出來的部分
         畫完就被貼到畫面外，一個像素都看不到。純浪費。 */
      bx0=Math.max(bx0-2,-8); by0=Math.max(by0-2,-8);
      bx1=Math.min(bx1+2,W+8); by1=Math.min(by1+2,VIEWH+8);
      const fw=Math.ceil(bx1-bx0), fh=Math.ceil(by1-by0);
      if(fw<2||fh<2||bx1<0||by1<0||bx0>W||by0>VIEWH){ ctx.restore(); continue; }
      const pk=clamp(BW/W,0.15,1);
      const bwp=Math.max(2,Math.round(fw*pk)), bhp=Math.max(2,Math.round(fh*pk));
      /* ⚠ 緩衝**一次配到上限，之後永不重配**。外框已經夾在視窗內，
         所以 (W+16)×(VIEWH+16)×pk 就是它可能長到的最大值 —— 直接配那麼大。
         先前的「只長不縮」仍會在飛近的過程中重配十幾次，每次都是一張新的
         GPU 貼圖：配置與 GC 吃畫格時間（fps 爆跌），iOS 的 canvas 記憶體預算
         被撐爆後還會把既有 canvas 丟掉（城變空白／破圖）。
         只讀 (0,0,bwp,bhp) 這塊子區域，所以緩衝比需要的大沒有關係。 */
      const capW=Math.ceil((W+16)*pk), capH=Math.ceil((VIEWH+16)*pk);
      if(!cityFB || cityFB.width!==capW || cityFB.height!==capH){
        cityFB=document.createElement('canvas'); cityFB.width=capW; cityFB.height=capH;
        CFB=cityFB.getContext('2d');
      }
      CFB.setTransform(1,0,0,1,0,0); CFB.clearRect(0,0,bwp,bhp);
      const kx=bwp/fw, ky=bhp/fh;

      /* 來源矩形改逐格算（格線非均勻）：平面座標 −1..1 → 圖上像素。 */
      const sux=planImg.width*0.5, svy=planImg.height*0.5;
      /* ── 由遠而近的順序：兩個掃描方向，不再排序 ────────────────
         格點在世界裡是規則網格，而深度 z＝dx·(−sinp)+dy·(−cosp) 是世界座標的
         線性組合 → **z 對 (jx,jy) 是仿射的**。所以「先畫遠的」不必比較大小，
         只要沿 jx／jy 各自從 z 大的那一頭起步即可（voxel 地形光柵化的標準作法）。
         ⚠ 這與嚴格的深度排序在「同列相隔很遠的兩格」上會有出入，但那種格子
           本來就不重疊 —— 會互相遮的只有相鄰格，逐列由遠而近就夠。
         換掉的是每幀 N² 個 cell 物件（N=40 → 1600 個）＋一次 sort。 */
      const zdx=PT[1*4+3]-PT[3], zdy=PT[(NU+1)*4+3]-PT[3];
      const jx0=zdx>0?NU-1:0, jxs=zdx>0?-1:1;
      const jy0=zdy>0?NV-1:0, jys=zdy>0?-1:1;
      /* 立面的顏色整批只設一次：fillStyle 每次都要重新解析字串，
         而這個迴圈近距離會跑上千次。 */
      /* ⚠ 立面顏色可逐城覆寫：一般城的牆是「屋瓦陰影」，暗色讀成牆在陰影裡；
         聖王廳是白石建築，同一個暗色會讓整座聖座變成一團黑。米白＋較低的
         不透明度讓它讀成「受光的石牆」。
         ⚠ 不上貼圖：一面牆常常只有 3~8px 高，石紋進去只是雜訊。 */
      CFB.fillStyle=o.s.wallCol||'rgba(34,30,26,0.62)';
      const row=NU+1;
      for(let ky2=0;ky2<NV;ky2++){
        const jy=jy0+jys*ky2;
        const sy=(cityV[jy]+1)*svy, shh=(cityV[jy+1]-cityV[jy])*svy;
        for(let kx2=0;kx2<NU;kx2++){
          const jx=jx0+jxs*kx2;
          /* ⚠ 這裡原本逐格判斷「格心落在海上就不畫」。格子大小隨距離變，
             鏡頭一動哪些格被剔除就整塊整塊地跳 —— 海岸線因此鋸齒抖動。
             已改成在 build_city.py 逐像素烘進 alpha：靜態、精確、零成本。 */
          const iA=(jy*row+jx)*4, iB=iA+4, iC=((jy+1)*row+jx)*4, iD=iC+4;
          /* ⚠ 任一角太近或在身後就整格跳過。project 對 z<24 做了夾制，
             夾過的角會被推到一個完全錯的螢幕位置，那一格就會扯成一片
             —— 這就是「城有時會破」。夾制是為了避免除零，不能拿來畫。 */
          if(PT[iA+3]<60||PT[iB+3]<60||PT[iC+3]<60||PT[iD+3]<60) continue;
          /* ⚠ 保險絲：一格內的深度比例失控（近角比遠角近三倍以上）就整格不畫。
             仿射矩陣吃不下這種格子，畫出來是一條放射狀的拖曳——寧可缺一格。
             步長依深度分配之後正常情況不會觸發，這條是防下次再寫錯。 */
          {
            let zmin=PT[iA+3], zmax=zmin;
            const zb=PT[iB+3], zcc=PT[iC+3], zd=PT[iD+3];
            if(zb<zmin)zmin=zb; if(zb>zmax)zmax=zb;
            if(zcc<zmin)zmin=zcc; if(zcc>zmax)zmax=zcc;
            if(zd<zmin)zmin=zd; if(zd>zmax)zmax=zd;
            if(zmax>zmin*3) continue;
          }
          const qax=PT[iA], qay=PT[iA+1], qbx=PT[iB], qby=PT[iB+1],
                qcx=PT[iC], qcy=PT[iC+1], qdx=PT[iD], qdy=PT[iD+1];
          /* 整格落在外框之外就跳過。緩衝夾到視窗之後，這種格子的 drawImage
             畫出來的是零個可見像素 —— 飛到城上空時它們是大宗（近距離量到
             1147 次 drawImage 裡有一半以上在畫面外）。八次 min/max 換掉一次
             帶轉換的 drawImage，很划算。 */
          if(Math.min(qax,qbx,qcx,qdx)>bx1||Math.max(qax,qbx,qcx,qdx)<bx0||
             Math.min(qay,qby,qcy,qdy)>by1||Math.max(qay,qby,qcy,qdy)<by0) continue;
          const sx=(cityU[jx]+1)*sux, sw=(cityU[jx+1]-cityU[jx])*sux;
          const a1=(qbx-qax)/sw, b1=(qby-qay)/sw;
          const c1=(qcx-qax)/shh, d1=(qcy-qay)/shh;
          if(!isFinite(a1)||!isFinite(d1)) continue;
          if(Math.abs(a1*d1-b1*c1)<1e-7) continue;     // 退化成一條線就跳過
          /* 立面：把抬升後的量體與地面連起來，只畫**朝鏡頭那一邊**。
             取深度最小的那條邊即可 —— 其餘三面被自己擋住，畫了也看不到，
             而且會在相鄰格之間互相穿插。
             ⚠ 用平塗暗色而不是貼圖：一格的立面只有幾像素，貼圖進去只會變雜訊；
               暗色反而乾淨地讀成「牆在陰影裡」。
             ⚠ 四條邊照 A→B→D→C 的環序，選深度和最小的那條；
               舊版是每格 new 出一個 4×5 的巢狀陣列來比大小。 */
          const lift=Math.abs(qay-GD[iA+1])+Math.abs(qdy-GD[iD+1]);
          /* ⚠ lift 設上限：近距離時單格的立面可以長到幾十像素，
             一堆長條暗面疊在一起就是整片拖曳。超過就不畫那一面。 */
          if(lift>1.2 && lift<26){
            const eAB=PT[iA+3]+PT[iB+3], eBD=PT[iB+3]+PT[iD+3],
                  eDC=PT[iD+3]+PT[iC+3], eCA=PT[iC+3]+PT[iA+3];
            let t1=iA, t2=iB, m=eAB;
            if(eBD<m){ m=eBD; t1=iB; t2=iD; }
            if(eDC<m){ m=eDC; t1=iD; t2=iC; }
            if(eCA<m){ m=eCA; t1=iC; t2=iA; }
            CFB.setTransform(kx,0,0,ky,-bx0*kx,-by0*ky);
            CFB.beginPath();
            CFB.moveTo(PT[t1],PT[t1+1]); CFB.lineTo(PT[t2],PT[t2+1]);
            CFB.lineTo(GD[t2],GD[t2+1]); CFB.lineTo(GD[t1],GD[t1+1]);
            CFB.closePath();
            CFB.fill();
          }
          // 緩衝的座標系＝(螢幕座標 − 外框原點) × 縮放
          CFB.setTransform(a1*kx, b1*ky, c1*kx, d1*ky,
                           (qax-a1*sx-c1*sy-bx0)*kx, (qay-b1*sx-d1*sy-by0)*ky);
          CFB.drawImage(planImg, sx,sy,sw+1.2,shh+1.2, sx,sy,sw+1.2,shh+1.2);
        }
      }

      /* ── 街廓量體 ─────────────────────────────────────────────
         上面那層已經把平面圖平貼在地上了。這一層在它上面把每個街廓拉伸成
         獨立的稜柱：垂直牆＋平屋頂，塊與塊不共用頂點。

         ⚠ 這是與舊版最關鍵的差別。舊版抬的是共用的網格頂點，等於把紋理整片
           往上剪切，所以高度圖要先糊 5px、planTall 要夾在 26。街廓各自獨立，
           街道自然成為塊與塊之間的谷 —— 高度因此沒有上限。

         ⚠ 頂面不必重新投影：垂直抬升不改變 sv，所以螢幕 x 與地面同值，
           只有 y 差 (h/z)·scaleH·syk。每個頂點省一次 projectInto。
         ⚠ 所有牆累積成**一條路徑、一次 fill**：顏色都一樣，幾百次 fill 換成
           一次，這是這一層最大的一筆節省。 */
      const MS=MASS, MA=cityMassArt[o.s.plan];
      if(MS&&MA&&tall>0&&Math.max(fw,fh)*pk>=36){
        const dyk=scaleH*syk;
        /* 方位桶：由遠而近的順序只取決於 (gradU,gradV) 的方向（見 loadMass）。 */
        let az=Math.atan2(gradV,gradU)/(Math.PI*2); az-=Math.floor(az);
        const ORD=MS.ord[Math.min(MASS_AZ-1,(az*MASS_AZ)|0)];
        const sux2=planImg.width*0.5, svy2=planImg.height*0.5;
        if(!massPts||massPts.length<64) massPts=new Float64Array(64);
        const MP=massPts;
        /* 第一趟：牆。整批累積成一條路徑，最後一次 fill。 */
        CFB.setTransform(kx,0,0,ky,-bx0*kx,-by0*ky);
        CFB.beginPath();
        let anyWall=false;
        const drawn=[];
        for(let t=0;t<MS.n;t++){
          const bi=ORD[t], au=MS.pu[bi], av=MS.pv[bi], np2=au.length;
          const hW=MS.h[bi]*tall;
          if(hW<=0.5) continue;
          /* 多邊形頂點：地面投影 + 立面高度。頂點數 ≤12（build 端簡化過）。 */
          if(MP.length<np2*4){ massPts=new Float64Array(np2*4); }
          const P=massPts;
          let ok=true, S2=0, mnx=1e9,mxx=-1e9,mny=1e9,mxy=-1e9;
          let zlo=1e9, zhi=-1e9;
          for(let k=0;k<np2;k++){
            const x0=au[k]*hw, y0=av[k]*hh;
            projectInto(P,k*4,(x0*ca-y0*sa)/MAP_SCALE,(x0*sa+y0*ca)/MAP_SCALE,0);
            const zk=P[k*4+3];
            if(zk<60){ ok=false; break; }
            if(zk<zlo)zlo=zk; if(zk>zhi)zhi=zk;
          }
          if(!ok) continue;
          /* ⚠ 保險絲：一塊之內的深度比例失控（近端比遠端近三倍以上）就整塊不畫。
             仿射矩陣吃不下這種形狀，畫出來是一道放射狀的拖曳 —— 低空貼近帝都時
             會看到一條白色光柱從城裡射進天空（使用者回報的「飄圖穿過前景」）。
             舊的網格版本有這條，我搬成多邊形時漏了。寧可缺一塊。 */
          if(zhi>zlo*3) continue;
          /* 頂面 y：各頂點用自己的 z（近的牆高、遠的牆矮，稜柱該有的透視）。 */
          for(let k=0;k<np2;k++){
            const L=hW*dyk/P[k*4+3];
            P[k*4+2]=L;                                   // 借第三欄存立面高度
            const ty=P[k*4+1]-L, px=P[k*4];
            if(px<mnx)mnx=px; if(px>mxx)mxx=px;
            if(ty<mny)mny=ty; if(P[k*4+1]>mxy)mxy=P[k*4+1];
          }
          if(mnx>bx1||mxx<bx0||mny>by1||mxy<by0) continue;
          if(mxx-mnx<0.7&&mxy-mny<0.7) continue;          // 螢幕上不到一像素
          // 頂面的螢幕帶號（shoelace）
          for(let k=0;k<np2;k++){
            const k2=(k+1)%np2;
            S2+=P[k*4]*(P[k2*4+1]-P[k2*4+2])-P[k2*4]*(P[k*4+1]-P[k*4+2]);
          }
          /* 牆的帶號 2A=(x_q−x_p)(L_p+L_q)，與頂面**異號**的才是朝鏡頭的下緣。
             同號的兩面被屋頂自己擋住，畫了看不到還會與鄰塊互相穿插。 */
          for(let k=0;k<np2;k++){
            const k2=(k+1)%np2;
            const pxx=P[k*4], pyy=P[k*4+1], Lp=P[k*4+2];
            const qxx=P[k2*4], qyy=P[k2*4+1], Lq=P[k2*4+2];
            if((qxx-pxx)*S2>=0) continue;
            CFB.moveTo(pxx,pyy-Lp); CFB.lineTo(qxx,qyy-Lq);
            CFB.lineTo(qxx,qyy);    CFB.lineTo(pxx,pyy);
            CFB.closePath(); anyWall=true;
          }
          drawn.push(bi);
        }
        if(anyWall) CFB.fill();                           // fillStyle 沿用地面層的暗色
        /* 第二趟：屋頂。每塊一次 drawImage —— atlas 上那一格已經帶著自己的
           alpha，所以不必逐塊 clip（clip 要重新光柵化路徑，幾百塊就吃掉畫格）。 */
        for(let t=0;t<drawn.length;t++){
          const bi=drawn[t], hW=MS.h[bi]*tall;
          const ax2=MS.bb[bi*4], ay2=MS.bb[bi*4+1],
                bw2=MS.bb[bi*4+2], bh2=MS.bb[bi*4+3];
          if(bw2<1||bh2<1) continue;
          /* 三個角定仿射：bbox 在插畫上的 (x,y)/(x+w,y)/(x,y+h)，抬到 hW。 */
          const gx0=MS.bbx[bi*4], gy0=MS.bbx[bi*4+1],
                gx1=MS.bbx[bi*4+2], gy1=MS.bbx[bi*4+3];
          const c3=[[gx0,gy0],[gx1,gy0],[gx0,gy1]], sc3=[];
          let bad=false;
          for(let k=0;k<3;k++){
            const x0=c3[k][0]*hw, y0=c3[k][1]*hh;
            projectInto(MP,0,(x0*ca-y0*sa)/MAP_SCALE,(x0*sa+y0*ca)/MAP_SCALE,hW);
            if(MP[3]<60){ bad=true; break; }
            sc3.push([MP[0],MP[1]]);
          }
          if(bad) continue;
          const a2=(sc3[1][0]-sc3[0][0])/bw2, b2=(sc3[1][1]-sc3[0][1])/bw2,
                c2=(sc3[2][0]-sc3[0][0])/bh2, d2=(sc3[2][1]-sc3[0][1])/bh2;
          if(!isFinite(a2)||!isFinite(d2)||Math.abs(a2*d2-b2*c2)<1e-7) continue;
          CFB.setTransform(a2*kx, b2*ky, c2*kx, d2*ky,
                           (sc3[0][0]-a2*ax2-c2*ay2-bx0)*kx,
                           (sc3[0][1]-b2*ax2-d2*ay2-by0)*ky);
          CFB.drawImage(MA, ax2,ay2,bw2,bh2, ax2,ay2,bw2,bh2);
        }
        CFB.setTransform(1,0,0,1,0,0);
      }
      /* 依光線上色：同 drawShip 那套。素材本身已經把「固定的色調對齊」烘進去
         （build_city.py 的 SAT/VAL），這裡只加隨時間變的部分。
         ⚠ source-atop：只作用在不透明處，透明區不會被塗成方塊。
         ⚠ 這個世界的日夜之後不會即時推移，而是戰後結算時跳一段，
           所以實際只會停在夜／黎明／早／黃昏四個狀態上——這條曲線
           在那四點取值都對得起來，不必為此改成離散表。 */
      /* ── 碼頭 ────────────────────────────────────────────────
         沿濱水面往水裡伸。每一段用一個仿射矩陣把貼圖鋪到「世界上的矩形」投影出來
         的平行四邊形上 —— 與城的網格同一套作法，所以棧橋是躺在水面上而不是
         浮在畫面上的一張圖。
         ⚠ 排在色罩之前：這樣棧橋跟城吃同一份曝光與夜色，不會自己一個亮度。 */
      if(o.s.piersLocal && dockArt.dock_strip && o.z<2200){
        const strip=dockArt.dock_strip, endp=dockArt.dock_end;
        const segMap=PIER_SEG/MAP_SCALE, halfW=(PIER_W*0.5)/MAP_SCALE;
        const nseg=o.s.t.indexOf('city')===0?4:3;
        for(const pr of o.s.piersLocal){
          const ca2=Math.cos(pr.ang), sa2=Math.sin(pr.ang);
          for(let k2=0;k2<nseg;k2++){
            const t0=k2*segMap;
            // 這一段的三個角（局部地圖像素）：近端左、近端右、遠端左
            const ax=pr.dx - sa2*halfW + ca2*t0,        ay=pr.dy + ca2*halfW + sa2*t0;
            const bx=pr.dx + sa2*halfW + ca2*t0,        by=pr.dy - ca2*halfW + sa2*t0;
            const cx4=pr.dx - sa2*halfW + ca2*(t0+segMap), cy4=pr.dy + ca2*halfW + sa2*(t0+segMap);
            const A=project(ax,ay,PIER_HOFF), B=project(bx,by,PIER_HOFF), C=project(cx4,cy4,PIER_HOFF);
            if(A[3]<60||B[3]<60||C[3]<60) continue;
            const sw2=strip.width, sh2=strip.height;
            const a1=(B[0]-A[0])/sw2, b1=(B[1]-A[1])/sw2;
            const c1=(C[0]-A[0])/sh2, d1=(C[1]-A[1])/sh2;
            if(!isFinite(a1)||!isFinite(d1)||Math.abs(a1*d1-b1*c1)<1e-7) continue;
            CFB.setTransform(a1*kx, b1*ky, c1*kx, d1*ky,
                             (A[0]-bx0)*kx, (A[1]-by0)*ky);
            const img2=(k2===nseg-1&&endp)?endp:strip;
            CFB.drawImage(img2, 0,0,img2.width,img2.height, 0,0,sw2,sh2);
          }
        }
        CFB.setTransform(1,0,0,1,0,0);
      }

      CFB.setTransform(1,0,0,1,0,0);
      {
        /* ── 曝光對齊 ──
           地面每一格都吃 (ambI+sunI*nl)*GRADE_EXPO×光色；城原本完全不吃，
           只有一層夜/夕的色罩。實測黃昏時城比腳下的地亮兩倍以上 ——
           使用者看到的「城的反光跟旁邊差太多」就是這個。
           這裡用**平坦法線 0.62**（城是貼在地面上的平面）走同一條式子，
           再除掉素材裡已經烘好的 VAL，免得同一份壓暗算兩次。
           ⚠ 只能用 source-atop 疊黑來做乘法：Canvas 的 multiply 走 source-over，
             會把整張緩衝連透明區一起填成實心色（這個坑 HANDOFF 記過）。
             疊黑 alpha=1-k 的結果正好是 c×k，數學上就是乘法。 */
        const shC=(LIT.amb+LIT.sun*0.62)*GRADE_EXPO;
        const kC=clamp(shC/CITY_BAKED_VAL*CITY_TRIM,0,1);
        if(kC<0.995){
          CFB.globalCompositeOperation='source-atop';
          CFB.fillStyle='rgba(0,0,0,'+(1-kC).toFixed(3)+')';
          CFB.fillRect(0,0,bwp,bhp);
          CFB.globalCompositeOperation='source-over';
        }
        /* 色相：亮度已經由上面那一步對齊，這裡只剩「光是什麼顏色」。
           所以 alpha 比舊版小得多（舊版那層同時在當壓暗用，才會壓成一坨橘）。 */
        const Sk=sky();
        const nA=clamp(1-Sk.day*1.2,0,1), dk=Sk.dusk;
        const tr=Math.round(lerp(52,255,dk)), tg=Math.round(lerp(66,196,dk)), tb=Math.round(lerp(104,120,dk));
        const aa=clamp(nA*0.30+dk*0.16,0,0.34);
        if(aa>0.01){
          CFB.globalCompositeOperation='source-atop';
          CFB.fillStyle='rgba('+tr+','+tg+','+tb+','+aa.toFixed(3)+')';
          CFB.fillRect(0,0,bwp,bhp);
          CFB.globalCompositeOperation='source-over';
        }
      }
      /* 山稜遮擋：只有這一次貼回需要裁，而且只裁城真正佔到的那幾欄
         （外框已經算出來了）。整排 234 欄的裁切路徑要讓這張圖每個像素都付費。 */
      clipByTerrainDepth(o.z,sxk,syk,Math.floor(bx0/sxk)-1,Math.ceil(bx1/sxk)+1);
      ctx.imageSmoothingEnabled=false;
      ctx.drawImage(cityFB,0,0,bwp,bhp,Math.round(bx0),Math.round(by0),fw,fh);
      /* 夜間路燈：城貼回去之後才畫，燈要在城上面。
         ⚠ 距離太遠就整批跳過：那個尺寸下每盞燈不到一個像素，畫了只是把城
           洗成一片亮斑，還要付幾百次 fillRect。 */
      /* ⚠ noLamps：聖王廳是聖座不是市街，不點市井燈火。 */
      if(nightK>0.06 && o.z<1800 && !o.s.noLamps){
        const LM=lampsFor(o.s,planImg);
        const hwL=o.s.planW*0.5, hhL=hwL*planImg.height/planImg.width;
        const caL=Math.cos(o.s.planRot), saL=Math.sin(o.s.planRot);
        const a2=clamp(nightK,0,1)*clamp((1800-o.z)/700,0,1);
