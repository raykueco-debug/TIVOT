     黑煙在暗色屋頂上隱形，只有襯著天空那一截讀得出來；白煙兩邊都清楚。
     外圈灰白、內核稍濃（同火車的兩層作法），照吃日夜的 lit。 */
  const g=Math.round(lerp(200,242,S.day)*lit);
  const gs='rgb('+g+','+g+','+Math.round(g*0.97)+')';
  const c2=Math.round(g*0.78), cs='rgb('+c2+','+c2+','+Math.round(c2*0.99)+')';
  for(const s of buildSettlements()){
    if(!s.smoke) continue;
    const dxs=s.mx*MAP_SCALE-cam.x, dys=s.my*MAP_SCALE-cam.y;
    const zs=dxs*(-sinp)+dys*(-cosp);
    if(zs>CS_FAR || zs<-s.planW*0.7) continue;
    const ch=chimneysOf(s); if(!ch) continue;
    /* 更新（只在看得到的範圍內跑，age 走夾過的 dt）＋收集要畫的雲塊。 */
    const draw=[]; let cx0=1e9,cx1=-1e9,cy0=1e9,cy1=-1e9,zClip=1e9;
    for(const c of ch){
      c.t-=dt;
      if(c.t<=0){ c.t=CS_DT*c.jit*(0.7+Math.random()*0.6);
        c.puffs.push({age:0, j:Math.random()});
        if(c.puffs.length>6) c.puffs.shift(); }
      for(const q of c.puffs){
        q.age+=dt;
        const a0=clamp(1-q.age/CS_LIFE,0,1);
        if(a0<=0.03) continue;
        const drift=q.age/MAP_SCALE;
        const pp=proj(c.mx+CS_WINDX*drift, c.my+CS_WINDY*drift, s.gh+c.h0+q.age*CS_RISE);
        if(!pp) continue;
        const pf=clamp((CS_FAR-pp.z)/CS_FADEB,0,1);
        if(pf<=0.01) continue;
        const born=clamp(q.age/0.2,0,1);                    // 冒出來那 0.2 秒淡入（同火車）
        const r=Math.max(0.9,(5.4+q.age*4.6)*(0.66+q.j*0.68)*pp.k);   // 再大一點（ver -447b，Ray 指定）
        const ox=(q.j-0.5)*r*0.8;
        draw.push({x:pp.x+ox,y:pp.y,r,a0,life:q.age/CS_LIFE,f:pf*born});
        if(pp.x+ox-r<cx0)cx0=pp.x+ox-r; if(pp.x+ox+r>cx1)cx1=pp.x+ox+r;
        if(pp.y-r*1.3<cy0)cy0=pp.y-r*1.3; if(pp.y+r>cy1)cy1=pp.y+r;
        if(pp.z<zClip)zClip=pp.z;
      }
      c.puffs=c.puffs.filter(q=>q.age<CS_LIFE);
    }
    if(!draw.length) continue;
    /* 像素化緩衝＋逐欄遮擋（§6.7 通則；裁切深度取整團最淺的，同火車的理由）。 */
    const fpad=8, fx0=Math.floor(cx0)-fpad, fy0=Math.floor(cy0)-fpad;
    const fbw=Math.ceil(cx1-cx0)+fpad*2, fbh=Math.ceil(cy1-cy0)+fpad*2;
    if(fbw<2||fbh<2) continue;
    const pk=clamp(BW/W,0.15,1);
    const bwp=Math.max(2,Math.round(fbw*pk)), bhp=Math.max(2,Math.round(fbh*pk));
    if(!citySmokeFB){ citySmokeFB=document.createElement('canvas'); CSC=citySmokeFB.getContext('2d'); }
    if(citySmokeFB.width<bwp||citySmokeFB.height<bhp||citySmokeFB.width>bwp*2||citySmokeFB.height>bhp*2){
      citySmokeFB.width=bwp; citySmokeFB.height=bhp; }
    CSC.setTransform(1,0,0,1,0,0); CSC.clearRect(0,0,bwp,bhp);
    CSC.setTransform(bwp/fbw,0,0,bhp/fbh,-fx0*bwp/fbw,-fy0*bhp/fbh);
    for(const q of draw){
      CSC.globalAlpha=q.a0*Math.sqrt(q.a0)*0.52*q.f;
      CSC.fillStyle=gs;
      CSC.beginPath(); CSC.ellipse(q.x,q.y-q.r*0.25,q.r,q.r*0.74,0,0,Math.PI*2); CSC.fill();
      if(q.life<0.4){
        CSC.globalAlpha=(1-q.life/0.4)*0.42*q.f;
        CSC.fillStyle=cs;
        CSC.beginPath(); CSC.ellipse(q.x,q.y-q.r*0.25,q.r*0.55,q.r*0.44,0,0,Math.PI*2); CSC.fill();
      }
    }
    CSC.globalAlpha=1;
    ctx.save();
    clipByTerrainDepth(zClip, sxk, syk, clamp(Math.floor(cx0/sxk)-2,0,BW-1), clamp(Math.ceil(cx1/sxk)+2,0,BW-1));
    ctx.drawImage(citySmokeFB,0,0,bwp,bhp,fx0,fy0,fbw,fbh);
    ctx.restore();
  }
}
function drawTrains(S,scaleH,horizon,sinp,cosp){
  if(!TRAINS.length) return;
  const sxk=W/BW, syk=VIEWH/BH;
  /* 世界座標 → 螢幕。回 null＝在身後或太偏，不必畫。
     far＝這個東西的剔除距離（不給就用火車的預設）。 */
  const proj=(mx,my,h,far)=>{
    const dx=mx*MAP_SCALE-cam.x, dy=my*MAP_SCALE-cam.y;
    const z=dx*(-sinp)+dy*(-cosp);
    if(z<40||z>(far||ZFAR*0.62)) return null;      // 遠處看不出是火車，省下來
    const sv=(dx*cosp+dy*(-sinp))/z;
    if(sv<-1.4||sv>1.4) return null;
    return { x:((sv+1)/2*BW)*sxk,
             y:(((cam.alt-h)/z + z*curvAt(sv))*scaleH+horizon)*syk,
             z, k:(W/(2*z)) };                     // k＝1 世界單位有幾個螢幕像素
  };
  /* ── 隧道洞口：**已移除**（ver -299，Ray 指定）───────────────────────
     曾經有一個站在軌道上、面朝洞外的拱形黑洞。拿掉的理由：它是一個**懸空的
     平面**，貼不到真正的山壁上 —— 地形是逐欄光柵化的高度場，山壁的位置每欄
     都不同，而洞口只有一個深度、一個朝向，兩者對不齊，看起來就是浮在山前面
     的一片黑。要貼準得逐欄去找山壁與軌道的交線，代價遠超過它的價值。
     ⚠ 也不要退回「在地表蓋一塊石材」那一版：那是貼在地上的，從空中看是一小片
       灰色補丁，讀不出「這裡有個洞」。兩條路都試過了。
     現在的行為：隧道段**不鋪地表軌道**（stampPaths），火車逐節沒入山體
     （見下方進隧道那段）—— 軌道走到山腳自然中斷，車就開進去了。
     ⚠ 另一條路「強迫火車繞山走」實測過**不可行**：把 RAIL_TUNNEL 由 6 拉到
       1000，隧道只從 6 段降到 4 段，而幹線長度暴增（1929→2409、9423→12449，
       +25~32%），山區變成蛇行。原因是隧道**不是路徑選出來的**：縱斷面受坡度
       限制，地面高過設計高程 TUNNEL_MIN 就判定在山裡，調成本消不掉它。 */

  /* ── 「開進市區了沒」──────────────────────────────────────────────
     市區的平面圖是一張貼在地上的盤子，車開進去就該被它蓋住。但盤子是後畫的
     （城畫在火車之前還是之後都不對：城是地景、車在地景上跑），所以這裡用
     幾何判定而不是靠繪製順序：離城心比「盤子半徑」近就算進城了。
     ⚠ 半徑取 planW 的一半再收 8%：平面圖的最外圈是郊區與田地，車在那裡還
       看得見才對；收到市街緣才開始沒入。
     ⚠ 每幀建一次（聚落數十個、只做平方比較），不快取 —— buildSettlements
       本來就有快取，這裡只是讀它。 */
  const CITYZ=[];
  if(window.Settlement && MAPW){
    for(const s of buildSettlements()){
      if(!s.plan||!s.planW) continue;
      const r=(s.planW*0.5/MAP_SCALE)*0.92;
      CITYZ.push(s.mx, s.my, r*r);
    }
  }
  const inCity=(mx,my)=>{
    for(let i=0;i<CITYZ.length;i+=3){
      const dx=mx-CITYZ[i], dy=my-CITYZ[i+1];
      if(dx*dx+dy*dy < CITYZ[i+2]) return true;
    }
    return false;
  };
  const hideAt=q => !!(q.tun || inCity(q.x,q.y));

  for(const T of TRAINS){
    /* 停在站裡就不畫。⚠ 車站在市區外緣、城蓋不住它，所以這是**刻意**讓它消失：
       一列停著不動的車跟一段軌道旁的雜物沒兩樣，反而讓「偶爾撞見一列在跑的車」
       這件事變得廉價。要改成停著也畫，就把這一行拿掉即可（煙要一併關掉）。 */
    if(T.wait>0) continue;
    const head=trainAt(T,T.s);
    if(!head) continue;
    const hp=proj(head.x,head.y,head.h);
    if(!hp) continue;
    /* 先看整列車在螢幕上有多長，決定走哪一條路。 */
    const tail=trainAt(T, T.s - T.dir*TRAIN_SPAN);
    if(!tail) continue;
    const tp=proj(tail.x,tail.y,tail.h);
    if(!tp) continue;
    const spanPx=Math.hypot(hp.x-tp.x, hp.y-tp.y);

    /* seats＝要畫的每一節，各自帶頭尾兩點與線寬。
       ⚠ 逐節**各自投影**（而不是「一個點 + 軸對齊的 fillRect」）：車朝著鏡頭
         開走時各節深度差很大，投影出來是一串垂直排開的位置，而每節仍是水平
         橫槓的話，讀起來是一把梯子不是一列車。取頭尾兩點就自動帶上朝向：
         轉彎、斜著開、正對鏡頭都對。 */
    /* ⚠ 太小就**整列不畫**，不要硬撐到最小尺寸。ver -279 曾經在螢幕空間等比撐開
         成一條直線排（放棄彎道），結果遠處的車轉彎時是**整根棍子在轉**——
         Ray 回報「不如在那個距離就不要出現」，對：一個轉得不對的東西比沒有更糟。
       ⚠ 所以淡出改綁在**投影長度**上，不是綁距離：長度掉到 TRAIN_MIN_PX 就淡完，
         剛好接上不畫的門檻，中間沒有跳變。 */
    if(spanPx<TRAIN_MIN_PX) continue;
    /* ── 進隧道：**從車頭逐節消失**（Ray 指定，ver -293）────────────
       ⚠ 這裡原本判的是**車頭**：`if(head.tun) continue`，車頭一進洞整列瞬間
         不見。當時的註解說逐節判「會出現半列車卡在洞口」所以不採用 ——
         那個判斷是錯的：**半列車卡在洞口正是火車進隧道該有的樣子**，
         整列同時消失才是破綻。
       ⚠ 整列都在洞裡時 seats 會是空的，下面的 `if(!seats.length) continue`
         自然接住，不必另外判。
       ⚠ 煙不必跟著擋：噴發端本來就有 `h.tun` 的守衛（在洞裡不留煙），
         所以車進洞之後只會剩下先前留在洞外的那幾團慢慢淡掉 —— 那是對的。 */
    const seats=[];
    for(let c=0;c<TRAIN_CARS;c++){
      const s1=T.s - T.dir*(c*TRAIN_PITCH), s2=s1 - T.dir*TRAIN_CAR;
      let q1=trainAt(T, s1), q2=trainAt(T, s2);
      if(!q1||!q2) continue;
      /* 「這一端該不該藏起來」：在山肚子裡（隧道）**或**已經開進市區。
         ⚠ 進城與進隧道走**同一條路徑**（ver -300，Ray 指定「火車進城要逐節
           消失」）—— 兩者都是「車一節一節沒入某個東西」，寫成兩套只會分岔。
           先前進城是 `if(T.wait>0) continue` 整列瞬間不見，那正是 -293 在隧道
           上修掉的同一個病。 */
      const h1=hideAt(q1), h2=hideAt(q2);
      if(h1 && h2) continue;                         // 整節都藏起來了
      if(h1 || h2){
        /* 跨界的那一節：把已經沒入的那一端收回交界，車就是**滑進去**
           而不是整節憑空不見。
           ⚠ 二分找交界而不是直接丟掉這一節 —— 一節車 30 世界單位，
             整節丟掉在近處是看得出來的一次跳。
           ⚠ 解析度的上限是折線的節距（tun 旗標是逐節點存的，見 trainAt），
             約 20 世界單位，比一節車短，所以收得進去。再細也沒有資料。 */
        let a = h1 ? s2 : s1;                        // 還看得到的那一端
        let b = h1 ? s1 : s2;                        // 已經沒入的那一端
        for(let it=0; it<6; it++){
          const m=(a+b)*0.5, qm=trainAt(T,m);
          if(!qm) break;
          if(hideAt(qm)) b=m; else a=m;
        }
        const qe=trainAt(T,a);
        if(!qe) continue;
        if(h1) q1=qe; else q2=qe;
      }
      const p1=proj(q1.x,q1.y,q1.h), p2=proj(q2.x,q2.y,q2.h);
      if(p1&&p2) seats.push({ax:p1.x,ay:p1.y,bx:p2.x,by:p2.y,
                             w:Math.max(TRAIN_MIN_W, TRAIN_CAR_W*(p1.k+p2.k)*0.5),
                             up:TRAIN_CAR_W*0.5*(p1.k+p2.k)*0.5});
    }
    if(!seats.length) continue;

    /* ── 煙先投影好 ────────────────────────────────────────────
       ⚠ 一定要在**裁切之前**算完，因為裁切的欄位範圍要把煙一起框進去。
         先前只用車身的 x 範圍去框（cx0/cx1 只掃 seats）—— 煙拖得比車身長得多，
         超出去的那一段落在裁切路徑之外，於是整條煙被一刀垂直切斷。
         那就是回報的「煙霧的裁點太明顯」。
       ⚠ 每一團煙有**自己的深度**，所以淡出也要各算各的：拿車頭的 fade 套全部
         的話，拖在最後面那幾團會在越過剔除面時整團憑空消失 —— 又是一個裁點。 */
    const CUT0=ZFAR*0.62, FADEB=ZFAR*0.16;   // 煙團各自的距離淡出仍用這一組
    const puffDraw=[];
    let cx0=1e9, cx1=-1e9, zClip=hp.z;
    for(const q of seats){ cx0=Math.min(cx0,q.ax,q.bx); cx1=Math.max(cx1,q.ax,q.bx); }
    for(let pi=0; pi<T.puffs.length; pi++){
      const q=T.puffs[pi];
      const life=q.age/(SMOKE_N*SMOKE_DT);
      const a0=clamp(1-life,0,1);
      if(a0<=0.03) continue;
      const rise=q.age*22;                         // 煙往上飄（世界單位／秒）
      const pp=proj(q.x,q.y,q.h+rise);
      if(!pp) continue;
      const pf=clamp((CUT0-pp.z)/FADEB,0,1);       // 這一團自己的距離淡出
      if(pf<=0.01) continue;
      const jt=(q.j||0);
      /* 大小差很多才像雲塊（0.62~1.38 倍）；橫向也錯開一點，不要排成一直線。 */
      const r=Math.max(1.1,(9+q.age*19)*(0.62+jt*0.76)*pp.k);
      const ox=(jt-0.5)*r*0.9;
      /* ⚠ 冒出來的那 0.16 秒要有個**淡入**。少了它，每 0.55 秒就有一朵雲憑空
         以全不透明度出現 —— 那是硬邊的「啪」一下，看起來像閃。0.16 秒短到
         不影響「一噴一噴」的節奏，卻足以把那個硬邊磨掉。 */
      const born=clamp(q.age/0.16,0,1);
      puffDraw.push({x:pp.x+ox, y:pp.y, r, a0, life, f:pf*born});
      if(pp.x+ox-r<cx0) cx0=pp.x+ox-r;
      if(pp.x+ox+r>cx1) cx1=pp.x+ox+r;
      if(pp.z<zClip) zClip=pp.z;                   // 裁切取最淺的那一團，見下
    }

    /* ⚠ 裁切的深度取**整團裡最淺的**（車頭與所有煙團之中最小的 z），不是車頭的。
       煙拖在車後，車朝著鏡頭開時煙比車遠、背對鏡頭時煙比車近；拿車頭的深度
       一律去裁，另一半的情況就會把煙誤判成「被前面的地形擋住」而切掉一塊。
       取最淺的是安全邊：寧可讓煙偶爾透出山一點點（它本來就是軟的、又飄在高處），
       也不要一條硬邊。 */
    /* ── 像素化緩衝：把整列車（含煙）畫進去，再一次貼回主畫布 ──────────
       ⚠ 外框要把**煙**一起框進去（煙拖得比車身長很多）—— cx0/cx1 上面已經含了煙，
         這裡再補縱向與一圈餘裕（車廂高度、車頭那盞燈的光暈）。
       ⚠ 透明度照舊在離屏那一層處理（煙每團自己的 alpha、車身的 fade），
         貼回來時 globalAlpha 是 1 —— 行為與原本一模一樣，只有解析度變了。 */
    let cy0=1e9, cy1=-1e9;
    for(const q of seats){
      const hh=Math.max(1.1,q.w*TRAIN_BOX_H)+q.w*0.5+q.up;
      cy0=Math.min(cy0,q.ay-hh,q.by-hh); cy1=Math.max(cy1,q.ay+q.w,q.by+q.w);
    }
    for(const q of puffDraw){ cy0=Math.min(cy0,q.y-q.r*1.35); cy1=Math.max(cy1,q.y+q.r*1.15); }
    const fpad=Math.ceil(Math.max(6, seats[0].w*3.2));
    const fx0=Math.floor(cx0)-fpad, fy0=Math.floor(cy0)-fpad;
    const fbw=Math.ceil(cx1-cx0)+fpad*2, fbh=Math.ceil(cy1-cy0)+fpad*2;
    if(fbw<2||fbh<2) continue;
    const pk=clamp(BW/W,0.15,1);                       // 與地形同一個解析度
    const bwp=Math.max(2,Math.round(fbw*pk)), bhp=Math.max(2,Math.round(fbh*pk));
    if(!trainFB){ trainFB=document.createElement('canvas'); TC=trainFB.getContext('2d'); }
    if(trainFB.width<bwp || trainFB.height<bhp || trainFB.width>bwp*2 || trainFB.height>bhp*2){
      trainFB.width=bwp; trainFB.height=bhp;
    }
    TC.setTransform(1,0,0,1,0,0); TC.clearRect(0,0,bwp,bhp);
    TC.setTransform(bwp/fbw,0,0,bhp/fbh,-fx0*bwp/fbw,-fy0*bhp/fbh);
    TC.lineCap='butt';
    ctx.save();
    clipByTerrainDepth(zClip, sxk, syk, Math.floor(cx0/sxk)-2, Math.ceil(cx1/sxk)+2);
    /* 淡出綁**投影長度**：spanPx 從 1.7 倍門檻掉到門檻的過程中淡完，門檻以下
       本來就不畫，所以消失的那一刻不透明度已經是 0，沒有跳變。
       ⚠ 淡出帶不能太窄。ver -279 用過 ZFAR*0.075 的距離帶，實測在剔除面前一格
         還有 6% 不透明度、113 個像素，下一格直接歸零 —— 那是看得出來的一下消失。
       ⚠ 綁長度而不是綁距離，是因為「看不看得清楚」本來就是長度的事：同樣的
         距離，車頭朝著鏡頭時投影長只有側掠時的幾分之一。 */
    const ft=clamp((spanPx-TRAIN_MIN_PX)/(TRAIN_MIN_PX*0.7),0,1);
    const fade=ft*ft*(3-2*ft);
    const lit=lerp(0.66,1.0,S.day);

    /* ── 煙 ────────────────────────────────────────────────────
       先畫，讓車頭壓在煙上（煙是從車頭噴出來往後散的，車該在最前面）。
       ⚠ 兩層：外圈是散開的灰白蒸汽，內圈是還沒散的濃煙。單層畫出來是一顆
         糊掉的球，兩層才有「一團一團往後拖」的樣子。
       ⚠ puffDraw 是由**舊到新**排的（puffs[0] 最舊）：舊的最大最淡，該在最底下。
         反過來畫的話那些大而淡的團會蓋在整列車上，煙就變成一塊糊掉的白斑
         （第一版就是，後面三節整個被埋掉）。 */
    const g=Math.round(lerp(198,240,S.day)*lit);
    const gs='rgb('+g+','+g+','+Math.round(g*0.97)+')';
    const c2=Math.round(g*0.74), cs='rgb('+c2+','+c2+','+Math.round(c2*0.99)+')';
    for(const q of puffDraw){
      /* 一朵雲塊自己的生命：剛冒出來最濃，脹大的同時淡掉。
         ⚠ 團數少了之後每一朵可以濃一點（0.34→0.46）也不會糊成一片 ——
           糊掉的原因從來不是單團太濃，是團太多疊在一起。 */
      TC.globalAlpha=q.a0*Math.sqrt(q.a0)*0.46*q.f;
      TC.fillStyle=gs;
      TC.beginPath(); TC.ellipse(q.x,q.y-q.r*0.25,q.r,q.r*0.74,0,0,Math.PI*2); TC.fill();
      if(q.life<0.42){                                 // 剛冒出來那幾朵的濃核
        TC.globalAlpha=(1-q.life/0.42)*0.42*q.f;
        TC.fillStyle=cs;
        TC.beginPath(); TC.ellipse(q.x,q.y-q.r*0.25,q.r*0.55,q.r*0.44,0,0,Math.PI*2); TC.fill();
      }
    }

    /* ── 車身 ──────────────────────────────────────────────────
       一節一段粗線，**butt 端點**。⚠ 端點不能用 round：圓端會把每節往兩頭
       各撐出半個線寬，正好把 TRAIN_GAP 那點空隙吃掉 —— 五節於是黏成一條，
       那就是回報的「像條蟲」。
       ⚠ 不畫車窗車輪：這個尺寸下加細節只會變成雜點。讀得出「一串一節一節的
         深色量體沿著軌道在動、前頭冒著煙」就夠了。 */
    TC.globalAlpha=fade;
    const wPx=seats[0].w;
    for(let i=0;i<seats.length;i++){
      const q=seats[i], w=q.w;
      /* 車廂＝**真的方塊**：地面矩形往上擠出一個高度，畫「看得到的側面」＋車頂。
         ⚠ 先前是一段粗線＋一道高光，那讀起來是**一片色帶**（Ray 回報「車廂是
           平面」）。一條線無論怎麼描邊都沒有厚度 —— 要有體積就得真的把頂面與
           側面分開畫、各自給不同的亮度，眼睛靠的是那個明暗差。
         ⚠ 側面只畫**朝鏡頭的那一邊**：兩邊都畫的話遠端那面會從車頂後面露出來，
           變成一節有兩層樓。判法與街廓量體同一套（看螢幕帶號）。 */
      const dx=q.bx-q.ax, dy=q.by-q.ay;
      const L=Math.hypot(dx,dy)||1;
      const nx=-dy/L, ny=dx/L;                 // 螢幕上的車身橫向
      const hw2=w*0.5;
      /* 地面四角（已含 up：車坐在軌道上，不是陷進去） */
      const gAx=q.ax+nx*hw2, gAy=q.ay-q.up+ny*hw2;
      const gBx=q.bx+nx*hw2, gBy=q.by-q.up+ny*hw2;
      const gCx=q.bx-nx*hw2, gCy=q.by-q.up-ny*hw2;
      const gDx=q.ax-nx*hw2, gDy=q.ay-q.up-ny*hw2;
      const hh2=Math.max(1.1, w*TRAIN_BOX_H);  // 車高（螢幕像素）
      /* 側面：畫**下緣在螢幕上比較低**的那一條長邊（＝朝鏡頭那面）。 */
      const sideAB=(gAy+gBy)>(gCy+gDy);
      const s0x=sideAB?gAx:gCx, s0y=sideAB?gAy:gCy;
      const s1x=sideAB?gBx:gDx, s1y=sideAB?gBy:gDy;
      TC.beginPath();
      TC.moveTo(s0x,s0y); TC.lineTo(s1x,s1y);
      TC.lineTo(s1x,s1y-hh2); TC.lineTo(s0x,s0y-hh2); TC.closePath();
      TC.fillStyle = i===0 ? '#141519' : '#2b2620';        // 側面在陰影裡，最暗
      TC.fill();
      /* 車頭端面：只有正對著看的時候才有面積，畫了才不會像被削掉一半。 */
      TC.beginPath();
      TC.moveTo(gAx,gAy); TC.lineTo(gDx,gDy);
      TC.lineTo(gDx,gDy-hh2); TC.lineTo(gAx,gAy-hh2); TC.closePath();
      TC.fillStyle = i===0 ? '#1b1d22' : '#332d26';
      TC.fill();
      /* 車頂：最亮的一面（天光直接照到），與側面的明暗差就是「這是個箱子」。 */
      TC.beginPath();
      TC.moveTo(gAx,gAy-hh2); TC.lineTo(gBx,gBy-hh2);
      TC.lineTo(gCx,gCy-hh2); TC.lineTo(gDx,gDy-hh2); TC.closePath();
      TC.fillStyle = i===0 ? '#3c4048' : '#5b4f42';
      TC.fill();
      /* 描邊：森林與道碴都是雜色的，沒有邊的話車身會溶進背景（遠處尤其）。
         ⚠ 只描車頂那一圈就夠 —— 側面已經是最暗的色塊，再描等於加粗一圈黑。 */
      if(w>=2.6){
        TC.strokeStyle='rgba(10,10,12,.66)'; TC.lineWidth=1;
        TC.stroke();
      }
    }
    /* 機車頭正面的一點暖光（夜裡才看得出來，白天被壓掉）。 */
    if(S.day<0.45 && seats[0]){
      const p0={x:seats[0].ax, y:seats[0].ay-seats[0].up}, r=Math.max(1.5, wPx*1.1);
      const g2=TC.createRadialGradient(p0.x,p0.y-r*0.3,0,p0.x,p0.y-r*0.3,r*2.4);
      g2.addColorStop(0,'rgba(255,206,132,'+(0.55*(1-S.day/0.45)).toFixed(2)+')');
      g2.addColorStop(1,'rgba(255,206,132,0)');
      TC.fillStyle=g2;
      TC.beginPath(); TC.arc(p0.x,p0.y-r*0.3,r*2.4,0,Math.PI*2); TC.fill();
    }
    /* 貼回主畫布：關掉平滑＝最近鄰，1:1 放大成與地形同一種像素塊。
       ⚠ 主畫布的 `imageSmoothingEnabled` 在 resize 時就關掉了（地形靠它），
         drawPanel 會暫時打開再關回去 —— 這裡在 drawPanel 之前，所以是關著的。
         還是明寫一次，免得將來有人在中間插一段開了平滑的繪製。 */
    TC.globalAlpha=1;                                  // 下一列車要從乾淨的狀態開始
    ctx.imageSmoothingEnabled=false;
    ctx.drawImage(trainFB,0,0,bwp,bhp,fx0,fy0,fbw,fbh);
    ctx.restore();
    ctx.globalAlpha=1;
    ctx.lineCap='round';
  }
}

/* ══ 地標 ══
   遠：只有一枚向下的箭頭浮在地標上方（不透露名稱）
   近：箭頭下方展開名牌 —— 名牌出現＝可點擊進入
   點擊判定用 hotspots（每幀重建），tap 與拖曳靠位移量區分。 */
/* 1800 世界單位＝90 地圖像素。大陸放大一倍後跟著加倍，維持「相對地圖」
   的同一段距離；沿用 900 會變成要飛到幾乎貼著地標才跳出名字。 */
const NAME_DIST = 1800;   // 進入此距離才顯示名稱＝可進入
let hotspots=[];
function drawPlaces(scaleH,horizon,sinp,cosp){
  const sxk=W/BW, syk=VIEWH/BH;
  hotspots=[];
  const list=[];
  PLACES.forEach(P=>{
    const dx=P.wx-cam.x, dy=P.wy-cam.y;
    const z=dx*(-sinp)+dy*(-cosp);
    if(z<10||z>ZFAR*0.92) return;
    const s=(dx*cosp+dy*(-sinp))/z;
    if(s<-1.1||s>1.1) return;
    list.push({P,bx:((s+1)/2*BW)*sxk,
                 by:(((cam.alt-(P.h||0))/z + z*curvAt(s))*scaleH+horizon)*syk,
                 z, near:Math.hypot(dx,dy)<NAME_DIST});
  });
  list.sort((a,b)=>b.z-a.z);
  list.forEach(o=>{
    const fade=clamp((ZFAR*0.92-o.z)/240,0,1);
    ctx.globalAlpha=fade;
    /* ⚠ 只有「遠處的箭頭」浮動。名牌一旦展開就整組定住 ——
       名牌是要讀的字，2.5px 的正弦擺動在 11px 的字上等於一直在晃，
       而且它同時是點擊熱區，會動的按鈕本來就難按。
       座標取整：字落在半個像素上會被反鋸齒糊掉，看起來也像在抖。 */
    const ay=Math.round(clamp(o.by-30,18,VIEWH-40));   // 箭頭底端（指著地標）
    const bx=Math.round(o.bx);
    const bob=o.near?0:Math.sin(performance.now()*0.004+o.bx)*2.5;

    // 向下箭頭
    ctx.fillStyle= o.near ? '#c9a227' : 'rgba(201,162,39,.62)';
    ctx.beginPath();
    ctx.moveTo(bx, ay+bob);
    ctx.lineTo(bx-6.5, ay-10+bob);
    ctx.lineTo(bx+6.5, ay-10+bob);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle='rgba(8,7,12,.55)'; ctx.lineWidth=1; ctx.stroke();

    // 近距離才展開名牌（＝可點擊）
    if(o.near){
      ctx.font='11px "Noto Serif TC",serif'; ctx.textAlign='center';
      const tw=Math.round(ctx.measureText(o.P.name).width);
      const bx0=bx-((tw/2)|0)-9, by0=ay-32, bwid=tw+18, bhei=18;
      ctx.fillStyle='rgba(5,6,12,.8)'; ctx.fillRect(bx0,by0,bwid,bhei);
      ctx.strokeStyle='#c9a227'; ctx.lineWidth=1; ctx.strokeRect(bx0+0.5,by0+0.5,bwid,bhei);
      ctx.fillStyle='#c9a227'; ctx.fillText(o.P.name,bx,by0+13);
      // 點擊熱區放大一圈，手指才好按
      hotspots.push({x:bx0-8,y:by0-8,w:bwid+16,h:bhei+22,P:o.P});
    }
    ctx.globalAlpha=1;
  });
}

/* ══ 飛鳥群 ══════════════════════════════════════════════════════════
   偶爾一群鳥橫過視野。純氣氛，沒有互動。
   ⚠ 不做成「敵人」的一種：牠們不需要狀態機、不需要遭遇判定，
     共用那套只會把敵人的邏輯撐得更複雜。
   ⚠ 編隊用「領頭鳥 + 各自的偏移」而不是每隻獨立飛：獨立飛的話再怎麼調
     都像一把散開的點，看不出是一群。偏移帶各自的緩慢繞行，群才會呼吸。
   ⚠ 拍翅相位每隻錯開：整群同步拍翅非常假，那是複製貼上的讀感。 */
const FLOCK_CFG = {
  gapMin: 22000, gapMax: 46000,   // 兩群之間的間隔（ms）
  n: [7, 16],                     // 每群幾隻
  spawnDist: 900,                 // 生成距離（世界單位）——比怪近得多，要看得清
  speed: 2.6,                     // 世界單位／(ms*0.06)，約玩家極速的 43%
  spread: 120,                    // 編隊散佈半徑（世界單位）
  life: 26000,                    // 活這麼久就散（ms）
};
let flock=null, flockTimer=FLOCK_CFG.gapMin*0.5;

function spawnFlock(){
  const C=FLOCK_CFG;
  // 生在側前方，讓牠橫過視野；高度落在玩家上下，有時從下方掠過
  const a=cam.angle+(Math.random()<0.5?1:-1)*(0.5+Math.random()*0.8);
  const x=cam.x-Math.sin(a)*C.spawnDist, y=cam.y-Math.cos(a)*C.spawnDist;
  // 航向：橫過玩家前方（不朝玩家來，也不背離）
  const h=cam.angle+(Math.random()<0.5?1:-1)*(1.2+Math.random()*0.6);
  const n=C.n[0]+((Math.random()*(C.n[1]-C.n[0]+1))|0);
  const birds=[];
  for(let i=0;i<n;i++){
    birds.push({
      // 編隊偏移：V 字骨架加一點亂數，免得排得太整齊像圖表
      ox:(Math.random()-0.5)*C.spread,
      oy:(Math.random()-0.5)*C.spread,
      oa:(Math.random()-0.5)*70,          // 高度偏移
      orb:Math.random()*6.28,             // 各自緩慢繞行的相位
      wing:Math.random()*6.28,            // 拍翅相位：錯開才不像複製貼上
      hz:0.020+Math.random()*0.010,       // 拍翅頻率也各自不同
    });
  }
  flock={ x, y, alt:cam.alt+(Math.random()-0.45)*160,
          hx:-Math.sin(h), hy:-Math.cos(h), birds, t0:performance.now() };
}

function updateFlock(dt,now){
  const C=FLOCK_CFG;
  if(!flock){
    flockTimer-=dt;
    if(flockTimer<=0) spawnFlock();
    return;
  }
  const mv=C.speed*dt*0.06;
  flock.x+=flock.hx*mv; flock.y+=flock.hy*mv;
  const dx=flock.x-cam.x, dy=flock.y-cam.y;
  if(now-flock.t0>C.life || Math.hypot(dx,dy)>2600){
    flock=null;
    flockTimer=C.gapMin+Math.random()*(C.gapMax-C.gapMin);
  }
}

function drawFlock(scaleH,horizon,sinp,cosp,now){
  if(!flock) return;
  const sxk=W/BW, syk=VIEWH/BH;
  const S=sky();
  const lit=clamp(0.22+S.day*0.78,0.22,1);
  const col='rgba('+Math.round(38*lit+8)+','+Math.round(34*lit+8)+','+Math.round(32*lit+10)+',';
  ctx.save();
  for(const b of flock.birds){
    const orb=now*0.0009+b.orb;
    const wx=flock.x+b.ox+Math.cos(orb)*16, wy=flock.y+b.oy+Math.sin(orb*1.3)*16;
    const dx=wx-cam.x, dy=wy-cam.y;
    let z=dx*(-sinp)+dy*(-cosp);
    if(z<30||z>ZFAR*0.55) continue;                  // 太遠就看不見了，不必畫
    const sv=(dx*cosp+dy*(-sinp))/z;
    if(sv<-1.25||sv>1.25) continue;
    const alt=flock.alt+b.oa+Math.sin(orb*0.8)*10;
    const px=((sv+1)/2*BW)*sxk;
    const py=(((cam.alt-alt)/z + z*curvAt(sv))*scaleH+horizon)*syk;
    const sc=W/(2*z);
    const span=Math.max(1.2, sc*22);                 // 翼展（世界單位 22）
    if(span<1.0) continue;
    /* 一隻鳥就是一個「M」：兩撇翅膀，拍動時改的是**上揚的幅度**。
       這個尺寸下畫身體是浪費，剪影才是辨識點。 */
    const f=Math.sin(now*b.hz+b.wing);
    const up=span*0.34*f;
    ctx.strokeStyle=col+(0.62+0.24*S.day).toFixed(2)+')';
    ctx.lineWidth=Math.max(0.8,span*0.13);
    ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.beginPath();
    ctx.moveTo(px-span*0.5, py-up);
    ctx.lineTo(px,           py+span*0.06);
    ctx.lineTo(px+span*0.5, py-up);
    ctx.stroke();
  }
  ctx.restore();
}

/* ══ 敵人：巨型蜈蚣（FLM_CENTIPI）════════════════════════════════════
   ▍雙軌（同飛空艇）

function enemyKindEligible(k, x, y){
  const K=ENEMY_KINDS[k];
  if(K.fromStage && gameStage() < K.fromStage) return false;
  if(K.landOnly){
    const mx=(x/MAP_SCALE)|0, my=(y/MAP_SCALE)|0;
    if(mx<0||my<0||mx>=MAPW||my>=MAPH) return false;
    if(!HGT || HGT[my*MAPW+mx] <= CLOUD_H) return false;   // 雲海之下＝海域 → 全陸域的怪不出
  }
  return true;
}
function pickEnemyKind(x, y){
  const pool=Object.keys(ENEMY_KINDS).filter(k=>enemyKindEligible(k,x,y));
  if(!pool.length) return null;
  let tot=0; for(const k of pool) tot+=ENEMY_RARITY_W[ENEMY_KINDS[k].rarity]||30;
  let r=Math.random()*tot;
  for(const k of pool){ r-=ENEMY_RARITY_W[ENEMY_KINDS[k].rarity]||30; if(r<=0) return k; }
  return pool[pool.length-1];
}
let enemy=null;                                   // {x,y,alt,hx,hy,d0,state,tEngage,kind}

const SCRIPTED_ENCOUNTERS = [

  /* `dist`＝生成距離覆寫（ver -455）：要在視野的清楚段正面現身，不泡在霧裡。 */
  { flag:'set_sail', done:'flight_centipede_met', outOf:1,
    kind:'centipede', speedMul:1.5, dist:1800 },
];

   主遊戲，而主遊戲在演的時候這一頁是停著的；每幀去 parse 一次 localStorage 是白花的。

/* opt（全部選填，劇本遭遇用；不給就是平時那隻隨機刷的）：

     （先前的作法是生成一團雲霧罩住牠，已撤：那是遮蔽而不是解決，
       而且雲團得另外管生命週期，還跟共用的 PUFFS 回收邏輯打架。） */
  /* ⚠ 劇本遭遇是**正前方**：偏移角 0 ＝玩家的航向，所以牠一定在畫面正中，
     而且距離會隨玩家自己前進一起縮短（不像平時那隻是橫著切過去的）。 */
  const off=opt.ahead ? 0
          : C.spawnOffMin+Math.random()*(C.spawnOffMax-C.spawnOffMin);
  const a=cam.angle+(Math.random()<0.5?off:-off);
  const ox=-Math.sin(a), oy=-Math.cos(a);
  /* 生成距離可逐次覆寫（ver -455）：劇本遭遇要生得近一點 —— 2800 幾乎貼著
     ZFAR 的霧，玩家看到的是一顆霧裡的小點；1800 在視野的清楚段，
     「有東西正面撲過來」第一眼就成立。 */
  const sd=opt.spawnDist||C.spawnDist;
  const x=cam.x+ox*sd, y=cam.y+oy*sd;
  /* 巡航朝向：**橫向**切過視野，不是直直朝玩家飛。
     直朝玩家的話，牠一路都是頭對著鏡頭——正俯視下只看得到一顆頭和兩片翅，
     體節、步足、蛇行全部縮在後面看不見，玩家根本認不出那是什麼東西，
     只知道有東西撞上來。轉成側向，牠的側面才展開給玩家看。
     ⚠ 純 90°，**不留內收**：巡航階段牠只是橫越，不朝玩家來。
       這代表距離不會自己縮短（自定點作垂直運動，距離只會變大），
       追擊要靠**玩家自己接近**才會觸發——那正是要的：牠攔在航路上，
       你可以繞開，靠太近牠才轉頭。 */
  let tx=cam.x-x, ty=cam.y-y;
  const L=Math.hypot(tx,ty)||1; tx/=L; ty/=L;
  /* 橫向有兩個方向，要選**朝畫面內**那一側 —— 隨機選的話有一半機率
     牠會往畫面外漂走，玩家一輩子看不到那隻。
     判法：各往前試一小步，取投影橫向位置 |sv| 較小的那個。 */
  const sinp0=Math.sin(cam.angle), cosp0=Math.cos(cam.angle);
  const svOf=(px2,py2)=>{
    const dx2=px2-cam.x, dy2=py2-cam.y;
    const z2=dx2*(-sinp0)+dy2*(-cosp0);
    return Math.abs((dx2*cosp0+dy2*(-sinp0))/(Math.abs(z2)<1?1:z2));
  };
  let hx=0, hy=0;
  if(opt.ahead){
    /* 劇本遭遇：朝向直接指著玩家（狀態也直接進 chase）—— 牠是來攔你的，不是路過。 */
    hx=tx; hy=ty;
  }else{
    let best=Infinity;
    for(const side of [1,-1]){
      const a2=side*(Math.PI/2);
      const cx2=tx*Math.cos(a2)-ty*Math.sin(a2);
      const cy2=tx*Math.sin(a2)+ty*Math.cos(a2);
      const sv2=svOf(x+cx2*260, y+cy2*260);
      if(sv2<best){ best=sv2; hx=cx2; hy=cy2; }
    }
  }
  /* ── 隨機刷怪的抽選（ver -500，Ray 的敵人卡）────────────────────────
     [稀有等級] → 權重：E30／D25／C20／B15／A10／S5，按**合格者**正規化。
     合格條件寫在 kind 上：
       fromStage — stage 幾之後才登場（羽蛇＝2，Ray：「stage2 的劇情之後才會
                   加入隨機敵人」；stage 由主線 setStage 推進）
       landOnly  — [區域：全陸域]：生成點的地形要在雲海之上（雲海＝這個世界的海，
                   同 seaProbe 的判法：HGT ≤ CLOUD_H ＝海）。
     劇本遭遇（opt.kind 指定）不經過抽選，照舊。 */
  const kind=(opt.kind && ENEMY_KINDS[opt.kind]) ? opt.kind : pickEnemyKind(x,y);
  if(!kind) return;                       // 這一格沒有合格的怪（理論上不會：蜈蚣/空賊無條件）
  const K=ENEMY_KINDS[kind];
  /* cruiseHx/cruiseHy、alt0＝「原本的動作」。放棄追擊時要能回到這裡，
     而且是轉回去不是跳回去（同追擊的限角速度）。 */
  const alt0=opt.ahead ? cam.alt : cam.alt+Math.random()*60-20;
  /* ⚠⚠ **只要生成就追**（ver -478，Ray：「怪只要生成就會追到進戰鬥為止」）：
     平時那隻也直接進 chase —— 朝向仍是橫向起步（上面挑好的 hx/hy），
     追擊的限角速度會把牠劃一道弧彎過來，側面照樣先展開給玩家看。
     cruiseHx/cruiseHy 留著給「掉頭離開」（flee）當反向的基準。 */
  enemy={ x, y, alt:alt0, alt0, hx, hy, cruiseHx:hx, cruiseHy:hy, kind,
          d0:sd, state:'chase', tEngage:0, phase:Math.random()*6.28,
          t0:performance.now(), trail:[],
          /* ⚠ 速度**只在這裡算一次**（鐵律 7）：`K.speedK` 是平時的倍率，劇本遭遇再乘
             卡上的 `speedMul`。updateEnemy 的位移一律讀 `enemy.spdK`，那邊不再乘第二次。 */
          spdK:K.speedK*(opt.speedMul||1),
          script:opt.script||null };
  // 軌跡先填成一條直線，否則剛生成的那幾幀身體還沒長出來
  for(let i=1;i<=Math.ceil(K.bodyLen/C.trailStep)+4;i++)
    enemy.trail.push({x:x-hx*C.trailStep*i, y:y-hy*C.trailStep*i});

}

function updateEnemy(dt,now){
  const C=ENEMY_CFG;
  const K=enemy?ENEMY_KINDS[enemy.kind]:null;
  if(!enemy){
    /* 劇本遭遇**優先於自動刷新**：條件到了就立刻生，不等計時器（Ray：「立刻刷怪」）。 */
    const S=scriptedDue();
    if(S){ spawnScripted(S); return; }
    /* ⚠⚠ **第一隻劇本蜈蚣打完之前，一隻雜怪都不刷**（ver -483，Ray：「在第一隻
       蜈蚣出場前不要有其他怪」；-454 只擋「排隊中」——旗標還沒立的試飛時段、
       打輸重生等待再刷的空檔都漏）。判準是**還有劇本遭遇沒打完**（done 旗標）。
       ⚠ 開發時要怪就按「生怪」鈕（它走 spawnEnemy 直達，不經這裡）。
       ⚠ 日後加了更後期的劇本遭遇，這一條會把雜怪一路封到那一場打完 ——
         到時把判準改成「旗標已立而未打完」（加回 flagOn(S.flag)）。 */
    if(SCRIPTED_ENCOUNTERS.some(S=>!flagOn(S.done))) return;
    if(scriptPending) return;
    enemyTimer-=dt;
    if(enemyTimer<=0) spawnEnemy();
    return;
  }
  /* 條件在「場上已經有一隻平時的怪」時才到（玩家繞路繞久了）：
     牠**掉頭離開**（ver -478，Ray：「有劇情怪的話就掉頭」）—— 不是原地消失：
     轉身飛遠、拉開到生成距離就撤場；槽位空了，下一幀上面 `!enemy` 那一支
     自然把劇本怪刷出來。
     ⚠ 已經在交棒（engage）的那一隻不能動 —— 牠正要進戰鬥。 */
  if(!enemy.script && enemy.state!=='engage' && enemy.state!=='flee'){
    if(scriptedDue()) enemy.state='flee';
  }
  const dx=cam.x-enemy.x, dy=cam.y-enemy.y;
  const dist=Math.hypot(dx,dy);

  if(enemy.state==='engage'){
    // 提示停留中：敵人停住，時間到就一同消失並重新計時
    if(now-enemy.tEngage>=C.holdMs){
      enemy=null;
      enemyTimer=C.gapMin+Math.random()*(C.gapMax-C.gapMin);
    }
    return;
  }

  /* ⚠⚠ **不放棄追擊**（ver -478，Ray：「只要生成就會追到進戰鬥為止」）——
     原本的 giveUpAt（拉開到 0.85·d0 回歸巡航）整段撤掉；chaseAt 也不再有事做
     （生成即 chase）。追擊只在三個出口結束：進戰鬥（engage/交棒）、
     劇本怪要上場（flee，見上）、降落進城（doLand 清場）。
     giveUpAt/chaseAt 兩個常數留在 ENEMY_CFG 當紀錄。 */
  /* 掉頭離開（flee，ver -478）：往遠離玩家的方向轉（同追擊的限角速度——
     直接反轉朝向是瞬間直角轉彎），爬回原高度，拉開到生成距離就撤場。 */
  if(enemy.state==='flee'){
    const cur=Math.atan2(enemy.hy,enemy.hx), want=Math.atan2(-dy,-dx);
    let da=want-cur;
    while(da>Math.PI) da-=Math.PI*2;
    while(da<-Math.PI) da+=Math.PI*2;
    const step=clamp(da,-K.turnRate*dt,K.turnRate*dt);
    const na=cur+step;
    enemy.hx=Math.cos(na); enemy.hy=Math.sin(na);
    const rollWant=clamp(step/Math.max(1,dt)/K.turnRate,-1,1);
    enemy.roll=(enemy.roll||0)+(rollWant-(enemy.roll||0))*(1-Math.exp(-dt/260));
    enemy.alt+=((enemy.alt0!==undefined?enemy.alt0:enemy.alt)-enemy.alt)*(1-Math.exp(-dt/420));
    if(dist>Math.max(enemy.d0, C.spawnDist)){ enemy=null; return; }
  }
  if(enemy.state==='cruise'){
    /* 回歸原動作：朝向轉回生成時的橫向巡航方位，高度爬回原高度。
       兩者都用與追擊相同的收斂方式，放棄追擊看起來才像「牠失去興趣、
       慢慢轉回去繼續走」，而不是瞬間切換成另一個東西。 */
    const cur=Math.atan2(enemy.hy,enemy.hx), want=Math.atan2(enemy.cruiseHy,enemy.cruiseHx);
    let da=want-cur;
    while(da>Math.PI) da-=Math.PI*2;
    while(da<-Math.PI) da+=Math.PI*2;
    if(Math.abs(da)>1e-3){
      const step=clamp(da,-K.turnRate*dt,K.turnRate*dt);
      const na=cur+step;
      enemy.hx=Math.cos(na); enemy.hy=Math.sin(na);
      const rollWant=clamp(step/Math.max(1,dt)/K.turnRate,-1,1);
      enemy.roll=(enemy.roll||0)+(rollWant-(enemy.roll||0))*(1-Math.exp(-dt/260));
    }else{
      enemy.roll=(enemy.roll||0)*Math.exp(-dt/260);
    }
    enemy.alt+=((enemy.alt0!==undefined?enemy.alt0:enemy.alt)-enemy.alt)*(1-Math.exp(-dt/420));
  }
  if(enemy.state==='chase'){
    /* 轉向限角速度：直接把朝向換成「指著玩家」是瞬間直角轉彎，
       一隻二十幾節的長蟲不可能那樣動。這裡只讓朝向每幀朝目標轉一小步，
       身體再靠下面的軌跡跟上 —— 頭先轉、身體循著頭走過的路彎過去，
       那個時間差才是「活的東西在轉身」的讀感來源（同飛空艇帆的延遲鏈）。 */
    const want=Math.atan2(dy,dx), cur=Math.atan2(enemy.hy,enemy.hx);
    let da=want-cur;
    while(da>Math.PI) da-=Math.PI*2;
    while(da<-Math.PI) da+=Math.PI*2;
    const step=clamp(da,-K.turnRate*dt,K.turnRate*dt);
    const na=cur+step;
    enemy.hx=Math.cos(na); enemy.hy=Math.sin(na);
    /* 角速度 → 側傾。船轉彎會外傾，那是「在轉」最直接的視覺線索；
       沒有它，換視角就只是一連串靜態的圖在交替。
       低通濾一下：直接吃瞬時角速度會隨 dt 抖。 */
    const rollWant=clamp(step/Math.max(1,dt)/K.turnRate,-1,1);
    enemy.roll=(enemy.roll||0)+(rollWant-(enemy.roll||0))*(1-Math.exp(-dt/260));
    /* 追擊時沉到玩家高度**之下**：船是固定畫在畫面 76% 高的精靈，
       敵人若與船同高，投影出來會停在地平線附近（畫面 30% 高）——
       兩者永遠碰不到一起，逼近的壓迫感就沒了。
       ⚠ 原本是「以固定最大速率朝定值下沉」：追擊一觸發就瞬間進入最大下降率、
         到位又突然停住，兩端各有一個速度折點 —— 看起來就是高度驟降一階。
         改兩件事：
           · 目標高度隨**接近程度**連續變（越近沉得越深），不是一觸發就跳到底
           · 用指數逼近而非固定速率，起降兩端都自然收斂
         再加一點振翅造成的上下浮動，昆蟲本來就不會飛得像條直線。 */
    const near=clamp(1-dist/Math.max(1,enemy.d0*C.chaseAt),0,1);
    const wantAlt=cam.alt-C.diveAlt*near;
    enemy.alt+=(wantAlt-enemy.alt)*(1-Math.exp(-dt/420));
  }

  const mv=MAX_SPD*enemy.spdK*dt*0.06;      // 與玩家同一套積分（見 update 的 mv）
                                          // ⚠ spdK 在 spawnEnemy 算好（含劇本遭遇的倍率），這裡只讀
  enemy.x+=enemy.hx*mv; enemy.y+=enemy.hy*mv;

  /* 軌跡：每前進 trailStep 就記一點。身體是沿這條軌跡排的，
     所以牠轉彎時身體會循著頭走過的路彎過去，而不是整條剛體一起轉。 */
  const tl=enemy.trail, hd=tl[0];
  if(!hd || Math.hypot(enemy.x-hd.x,enemy.y-hd.y)>=C.trailStep){
    tl.unshift({x:enemy.x,y:enemy.y});
    const maxN=Math.ceil(K.bodyLen/C.trailStep)+6;
    if(tl.length>maxN) tl.length=maxN;
  }

  /* ⚠⚠ 劇本遭遇**看得到才進戰鬥**（ver -455，Ray：「確保玩家不會是在沒看到
     蜈蚣的狀況下進入戰鬥」）。牠是正面刷出、直奔而來的 —— 但玩家可能在牠
     逼近的那幾秒裡轉了向，牠就從側後方追上：距離到了、畫面上卻沒有牠。
     沒看到就**先不交棒**，牠繼續追著咬（本來就不放棄）；玩家一回頭看到牠，
     下一幀就進戰鬥。⚠ 只管劇本遭遇：平時的怪照舊「不論前後左右」（Ray 舊規）。 */
  /* ⚠ 掉頭中的那一隻**不交棒**（ver -478）：牠正在讓位給劇本怪，
     玩家追上去貼臉也不該把牠打下來 —— 那一場注定是劇本怪的。 */
  if(dist<=C.engage && enemy.state!=='flee'){
    if(enemy.script){
      /* ⚠ 上面的 dx/dy 是「玩家−敵人」，投影要的是「敵人−鏡頭」＝取負。 */
      const ex=-dx, ey=-dy;
      const zE=ex*(-Math.sin(cam.angle))+ey*(-Math.cos(cam.angle));
      const svE=zE>40 ? Math.abs((ex*Math.cos(cam.angle)+ey*(-Math.sin(cam.angle)))/zE) : 9;
      if(zE<=40 || svE>1.15) return;          // 在身後／畫面外 → 先不進
    }
    enemy.state='engage'; enemy.tEngage=now; toBattle(enemy.kind);
  }
}

/* ══ 遭遇 → 舒爾特盤（ver -382，Ray：「怪碰到船以後進入舒爾特盤」）══
   飛行頁與主遊戲是**兩個頁面**，所以交棒走 localStorage：
     `tivot_battle_req_v1`  這一場要打誰（`config.battles` 的鍵）
     `tivot_flight_ret_v1`  打完回來要站在哪（座標／航向／高度）
   主遊戲那邊由 `main.js` 在讀取頁被點掉之後接手；打贏才跳回來，
   打輸走一般的失敗流程（Game Over → 主選單，ver -376 的規矩）。
   ⚠ 只交棒一次：`engage` 每幀都會進來，沒有這道鎖會連跳好幾次。
   ⚠ 留 1.1 秒讓「遭遇　◯◯」那一格看得到 —— 直接跳頁的話玩家不知道發生什麼事。 */
let battleGoing=false;
let lastBattleScripted=false;   // 剛打的那一場是不是劇本遭遇（見 toBattle 與 __flightResume）
let lastScriptS=null;           // 那一場是哪一條劇本遭遇（打輸重生要重掛，ver -480）
/* ⚠⚠ **父頁說停＝整個模擬凍住**（ver -481，Ray：「飛行畫面一旦關閉就要全部關掉，
   切頁要乾淨」「戰鬥中飛行畫面是暫停的，不會有怪產生」）。
   以前 __flightPause 只收音訊 —— iframe 藏起來之後 rAF 照跑，怪照生、照追、
   照 toBattle：玩家在城鎮跑劇情，背景的飛行頁把棺彈出來（Ray 就撞到這個）。
   extPaused 由 __flightPause／__flightHold 設、__flightResume 清；
   loop() 一開頭就整幀跳過（連畫都不畫 —— 反正看不見）。 */
let extPaused=false;
/* ══ 免戰模式（ver -383，Ray 指定）══
   開著的時候碰到怪**只演「遭遇」那一格**，不跳頁進戰鬥 —— 畫地圖時不會被打斷。
   ⚠ 擋在 `toBattle()` 這**唯一的發動點**（鐵律 8）：日後多一條進戰鬥的路
     （例如空賊主動撞船）也自動吃到，不必再擋一次。
   ⚠ 狀態存 localStorage：畫地圖常常重整，每次重開都要再按一次很煩。
     ⚠ 但也因此**它會一直記著** —— 鈕在開著的時候是綠的，那就是唯一的提醒。
     `progress.newRun()` 不清它：那是工具開關，不是一輪遊戲的進度。 */
const PEACE_KEY='tivot_flight_peace_v1';
let peaceMode=(()=>{ try{ return localStorage.getItem(PEACE_KEY)==='1'; }catch(_){ return false; } })();
{
  const pb=document.getElementById('peaceBtn');
  const sync=()=>{ if(pb) pb.classList.toggle('on', peaceMode); };
  sync();
  if(pb) pb.addEventListener('click',()=>{
    peaceMode=!peaceMode;
    try{ localStorage.setItem(PEACE_KEY, peaceMode?'1':'0'); }catch(_){}
    sync();
  });
}
/* ══ Kerberos 之門（飛行頁這一半，ver -387）══════════════════════════════
   ⚠⚠ 這裡的 `top.ar` / `top.dip` 與主遊戲 `modules/story.js` 的 `KERB_META` **是同一組
     數字**（由 tools/kerberos_cut.py 印出來的）。飛行頁是另一個 HTML、非 module，
     import 不到那一份，所以只能抄一份 —— **改圖重跑腳本之後兩邊都要貼**
     （鐵律 7 的但書：真的必須出現在兩邊時，兩邊註解互指）。
   幾何是**解出來的**：
     · 門寬 `Wd = max(畫面寬, 畫面高 / 高寬比)` —— 推到頂時要蓋得滿整個畫面，
       高度不夠就靠加寬補（同主遊戲 layoutKerberos 的 `Math.max`）。
     · 門頂 `doorTop` 由「**楣的下緣貼齊畫面底**」反推 —— 楣的上緣在門頂之上
       `1 − th + th·dip`（負值），所以 `doorTop = H − 1 − th·dip`。
       平常整扇門沉在畫面之下，露出來的就只有那一條楣。
     · 上推距離就是 `doorTop`（推完門頂貼齊 y=0）。 */
/* ⚠ 這一組常數宣告在檔頭（見 VIEW_F 那一區）—— `resize()` 在指令碼求值期間就會跑，
   宣告留在這裡的話 `layoutFKerb` 會撞上 TDZ（實測：Cannot access 'FKERB' before initialization）。 */
function layoutFKerb(){
  const kb=document.getElementById('fkerb'), dr=document.getElementById('fkerbDoor'),
        tp=document.getElementById('fkerbTop');
  if(!kb || !dr || !tp || !W || !H) return;
  const AR=FKERB.h/FKERB.w;
  const Wd=Math.max(W, H/AR), Hd=Wd*AR, dx=(W-Wd)/2;
  const th=W*FKERB.top.ar;                     // 楣：橫跨整個畫面寬
  const tpTop=1-th+th*FKERB.top.dip;           // 楣的上緣（門座標，負值＝在門頂之上）
  const doorTop=H-1-th*FKERB.top.dip;          // 由「楣的下緣貼齊畫面底」反推
  dr.style.width=Wd+'px'; dr.style.height=Hd+'px';
  dr.style.left=dx+'px'; dr.style.top=doorTop+'px';
  /* 紋章／箭／鉚釘：擺在門座標的比例位置上（同主遊戲 layoutKerberos 的 `put`）。
     ⚠ 箭與鉚釘給的是**中心點**與**未旋轉**的寬高 —— CSS 的 rotate 繞元素中心轉，
       中心擺對了轉幾度都落在該落的地方。 */
  const put=(el,b)=>{ if(!el) return;
    const w=b.w*Wd, h=b.h*Hd;
    el.style.width=w+'px'; el.style.height=h+'px';
    el.style.left=(b.cx*Wd-w/2)+'px'; el.style.top=(b.cy*Hd-h/2)+'px';
    if(b.rot!=null) el.style.setProperty('--fk-rot', b.rot+'deg');
    if(b.fx!=null){ el.style.setProperty('--fk-fx', b.fx); el.style.setProperty('--fk-fy', b.fy); } };
  const pl=dr.querySelector('.fk-plate');
  if(pl){ const P=FKERB.plate;
    pl.style.left=(P.x*Wd)+'px'; pl.style.top=(P.y*Hd)+'px';
    pl.style.width=(P.w*Wd)+'px'; pl.style.height='auto'; }
  for(const k in FKERB.arrows) put(dr.querySelector('.fk-arrow.'+k), FKERB.arrows[k]);
  for(const k in FKERB.rivets) put(dr.querySelector('.fk-rivet.'+k), FKERB.rivets[k]);
  /* 吊墜：解出「與圓盤的圓保持距離」的最大寬度（同 story.js 的 layoutKerberos）。
     ⚠ 它是那一組配件的**基準** —— 齒輪的大小與位置都從它推（見下）。 */
  let pendW=0, pendCx=0, pendTop=0;
  const pd=document.getElementById('fkerbPend');
  if(pd){
    const P=FKERB.plate, pW=P.w*Wd;
    const cx=(P.x+P.w/2)*Wd+dx, cy=(P.y+P.h/2)*Hd, r=pW/2;
    const top=FKERB_PEND.drop*Hd, clear=Math.max(4, W*0.010), pcx=W*FKERB_PEND.bandC;
    const fits=w=>{ const h=w*FKERB_PEND.ar;
      for(const q of FKERB_PEND.prof){
        if(Math.hypot(cx-(pcx+q[1]*w), cy-(top+q[0]*h))<=r+clear) return false; }
      return true; };
    let pw=0;
    const want=Math.min(W*FKERB_PEND.maxW, W*FKERB_PEND.wantW);
    for(let w=Math.round(want); w>=14; w--){ if(fits(w)){ pw=w; break; } }
    pd.style.width=pw+'px'; pd.style.height=(pw*FKERB_PEND.ar)+'px';
    pd.style.display = pw>=14 ? '' : 'none';
    pendW=pw; pendCx=pcx; pendTop=top;
    /* ⚠⚠ **解出來的位置與「掛在哪」是兩件事**（ver -443）：上面那一段仍然要跑 ——
       齒輪的大小與位置是**由吊墜推出來**的（ver -419），拿掉就沒有基準了。
       這裡只決定那個 DOM 掛到哪裡去（見 `placeFkerbPend`）。 */
    fkerbPendDoor={ x:(pcx-pw/2-dx), y:top };
    placeFkerbPend();
    /* 加速鈕（開發用）本來也在面板左上 —— 吊墜掛上去之後讓它往右挪，
       兩個東西不要疊在一起。⚠ 讓路的是**開發鈕**不是吊墜（ver -443）。 */
    { const bb=document.getElementById('boostBtn');
      if(bb) bb.style.left=(fkerbPendOnDoor ? FKERB_PEND_PAD
                                            : FKERB_PEND_PAD+pw+10)+'px'; }
  }
  /* 齒輪（ver -419）：大小與位置**由吊墜推出來**（同 story.js 的 layoutKerberos）。 */
  const gb=document.getElementById('fkerbGear'), gsm=document.getElementById('fkerbGearSm');
  if(gb && pendW>0){
    const P=FKERB.plate, pW=P.w*Wd, er=pW/2;
    const gr=pendW*FKERB_GEAR.rel/2;
    const gcx=(W-pendCx)-dx, gcy=pendTop + FKERB_GEAR.bodyC*pendW*FKERB_PEND.ar;
    gb.style.width=(gr*2)+'px'; gb.style.height=(gr*2)+'px';
    gb.style.left=(gcx-gr)+'px'; gb.style.top=(gcy-gr)+'px'; gb.style.display='';
    if(gsm){
      /* 惰輪：同時咬住團徽與大齒輪（同 story.js 的解法，改一邊要改另一邊）。 */
      const ecx=(P.x+P.w/2)*Wd, ecy=(P.y+P.h/2)*Hd;
      const RV=[]; for(const k in FKERB.rivets){ const b2=FKERB.rivets[k];
        RV.push([b2.cx*Wd, b2.cy*Hd, Math.max(b2.w*Wd,b2.h*Hd)/2]); }
      const M=Math.max(3,W*0.008), rightX=W-dx, topY=1+th*FKERB.top.dip;
      const D=Math.hypot(gcx-ecx,gcy-ecy), sMin=(D-er-gr)/2;
      let sol=null;
      for(let i=0;i<=140 && !sol;i++){
        const sr=sMin+i*Math.max(0.4,W*0.0012), r1=er+sr, r2=sr+gr;
        if(r1+r2<D) continue;
        const a2=(r1*r1-r2*r2+D*D)/(2*D), h2=r1*r1-a2*a2; if(h2<0) continue;
        const h=Math.sqrt(h2), mx=ecx+a2*(gcx-ecx)/D, my=ecy+a2*(gcy-ecy)/D;
        for(const sg of [1,-1]){
          const sx=mx+sg*h*(gcy-ecy)/D, sy=my-sg*h*(gcx-ecx)/D;
          let cl=Math.min(rightX-M-sx-sr, sy-(topY+M)-sr);
          if(!FKERB_GEAR.smAllowRivet)
            for(const q of RV) cl=Math.min(cl, Math.hypot(sx-q[0],sy-q[1])-q[2]-sr-M);
          if(cl>0){ sol={sr,sx,sy}; break; }
        }
      }
      if(sol){ gsm.style.width=(sol.sr*2)+'px'; gsm.style.height=(sol.sr*2)+'px';
        gsm.style.left=(sol.sx-sol.sr)+'px'; gsm.style.top=(sol.sy-sol.sr)+'px'; gsm.style.display=''; }
      else gsm.style.display='none';
    }
  }else if(gb){ gb.style.display='none'; if(gsm) gsm.style.display='none'; }
  tp.style.width=W+'px'; tp.style.height=th+'px';
  tp.style.left=(-dx)+'px'; tp.style.top=tpTop+'px';
  kb.style.setProperty('--fkerb-rise', doorTop+'px');
  /* 底下那一排鈕靠它讓開楣（見 CSS）。⚠ 掛在 :root —— 那些鈕是 position:fixed，
     不是 #fkerb 的子孫，CSS 變數繼承不過去。 */
  document.documentElement.style.setProperty('--fkerb-top-h', th+'px');
  /* ⚠⚠ **發佈出去**（鐵律 7）：主遊戲接手時要用**這一組**數字重建同一扇門，
     否則兩邊各算一次（它的公式是「紋章圓心落在下半面板正中」，實測差 8.6%），
     交棒那一格紋章會忽然變大。 */
  fkerbGeom={ Wd, Hd, top:doorTop };
}
/* 撞擊音：與主遊戲同一支素材（峰值在 1002ms，正好落在門撞頂那一瞬 —— 所以
   上推的長度也是 1000ms，兩邊同值，改一邊要改另一邊）。 */
const kerbPopSE = new Audio('../resources/audio/se/se_Kerberos_pop.m4a'); kerbPopSE.preload='auto';
kerbPopSE.__baseVol = fileVol('se_kerberos_pop');   // 逐支增益（ver -441，見 fileVol）
const FKERB_RISE_MS = 1000;   // 上推時間（＝ story.js 的 KERB_T.rise，兩邊同值）
/* 吊墜被甩一下（ver -412）。⚠ 唯一的一支（同 story.js 的 `kerbPendSwing`）。 */
/* ══ 吊墜掛在哪（ver -443，Ray：「飛行畫面時把吊墜掛在控制面板的左上方，
     飛行畫面時槍棺無吊墜」）══════════════════════════════════════════════
   兩個位置，一支函式（鐵律 8）：
     · **飛行中**：掛在控制面板的**左上角**（`position:fixed`，縱向由 `VIEWH` 推）——
       那是這一頁唯一一塊空的角落，而槍棺在飛行時只露出楣，掛在那裡看不到。
     · **推棺那一刻**：回到門上。⚠⚠ 這一條是 §6.10 的規矩：交棒之後接手的是
       **主遊戲那一半的門**，而它有吊墜 —— 飛行頁這一半不掛的話，交棒那一格
       會憑空多出一個東西。所以「槍棺無吊墜」只到門開始上推為止。
   ⚠ 尺寸兩邊共用**同一個解**（見 layoutFKerb）：換位置不換大小，
     玩家才讀得出「同一個吊墜換了地方掛」。 */
function placeFkerbPend(onDoor){
  if(onDoor!=null) fkerbPendOnDoor=!!onDoor;
  const pd=document.getElementById('fkerbPend'); if(!pd) return;
  const door=document.getElementById('fkerbDoor');
  if(fkerbPendOnDoor){
    /* ⚠⚠ 掛回門上要**真的把節點搬回去**：門是靠 `transform` 推上去的，
       不是它的子孫就不會跟著走（那一秒會看到吊墜留在原地）。 */
    if(door && pd.parentNode!==door) door.appendChild(pd);
    if(!fkerbPendDoor) return;
    pd.style.position='absolute'; pd.style.zIndex='';
    pd.style.left=fkerbPendDoor.x+'px'; pd.style.top=fkerbPendDoor.y+'px';
    return;
  }
  /* 面板左上。⚠⚠ **一定要先把節點搬出門外**：`#fkerbDoor` 有 `transform`，
     而有 transform 的祖先會讓 `position:fixed` 變成相對它定位 —— 留在門裡的話
     這幾個座標會落在完全錯的地方（CSS 的老坑）。
   ⚠ 面板上緣（`VIEWH`）是**算出來的**，CSS 沒有那個數字 —— 同 `#boostBtn` 的作法。
   ⚠ z-index 44：壓過 HUD 那排鈕（40），但**低於**槍棺（45）—— 楣是畫框，
     吊墜掛在面板上不該蓋過它。 */
  if(pd.parentNode!==document.body) document.body.appendChild(pd);
  pd.style.position='fixed'; pd.style.zIndex='44';
  pd.style.left=FKERB_PEND_PAD+'px';
  pd.style.top=VIEWH+'px';
  /* 吊墜＝整備的入口（ver -482，Ray：「吊墜點了沒有整備效果」）——
     與主遊戲槍棺上那顆同一個語意。掛在面板上才可點（門上那個分支維持 none）。 */
  pd.style.pointerEvents='auto';
  pd.style.cursor='pointer';
}
/* 吊墜的點擊 → 開父頁的整備頁（同一頁 gear，鐵律 8）。獨立開發模式沒有父頁＝不作動。
   ⚠ pointerdown 也要攔：不攔的話這一下會同時被當成操舵/感應的起手。 */
(function(){
  const pd=document.getElementById('fkerbPend');
  if(!pd) return;
  pd.addEventListener('pointerdown', e=>{ e.stopPropagation(); });
  pd.addEventListener('click', e=>{
    e.stopPropagation();
    if(fkerbPendOnDoor) return;                    // 門上（不會發生了，保險）
    if(embedded()){ try{ window.parent.__tivotFlight.gear(); }catch(_){} }
  });
})();
function fkerbPendSwing(amp, dur){
  const pd=document.getElementById('fkerbPend'); if(!pd) return;
  const sw=pd.querySelector('.fkp-swing'); if(!sw) return;
  pd.style.setProperty('--fkp-amp', (amp||14)+'deg');
  pd.style.setProperty('--fkp-dur', (dur||2.2)+'s');
  sw.classList.remove('swing'); void sw.offsetWidth; sw.classList.add('swing');
}

/* ══ 內嵌模式（ver -388）══════════════════════════════════════════════════
   主遊戲把這一頁放進 **iframe**，所以進戰鬥**不再跳頁**。
   ⚠⚠ 為什麼要這樣改（Ray：「想辦法克服」）：跳頁＝新的 document，音訊要**那一頁自己的**
     使用者手勢才解得開（iOS 一定要）—— 於是進戰鬥前非得多一顆「點一下」不可，
     否則門的齒輪／開門音與戰鬥 BGM 整段是靜音的。留在同一個 document 裡，
     父頁開機時那一點就一直有效，那顆鈕就不需要存在了。
   ⚠ 順帶解決另外兩件事：打完回來**不必重載這一頁**（沒有第二次讀取頁，`cam` 也還在原處），
     而且 `tivot_flight_ret_v1` 這條回程鑰匙在內嵌模式下用不到。
   ⚠ **獨立開啟仍然要能用**（開發時直接開 `flight/index.html`）：查不到父頁的掛鉤就
     退回原本的 localStorage ＋ 跳頁那一套（那條路徑上「開棺」那一顆還在）。 */
/* ⚠⚠ **每次用的時候才問，不要在載入時就決定**（ver -415）。原本寫成
   `const EMBED = …`（指令碼求值那一刻算一次）—— 只要那一刻父頁的掛鉤還沒掛上去，
   這一頁就會**一輩子**以為自己是獨立開的，遭遇時走跳頁那一套，於是「開棺」又冒出來
   （Ray 回報「船戰又叫我開棺了」）。掛鉤的有無是**執行期的事實**，要現查。 */
function embedded(){ try{ return window.parent!==window && !!window.parent.__tivotFlight; }
                     catch(_){ return false; } }

function toBattle(kind){
  /* ⚠⚠ 劇本遭遇的 done 旗標**打贏才記**（ver -487；-426 曾記在交棒那一刻）——
     憲法 §6.5.2「劇情戰敗北＝回捲到戰前」的正解：與其記了再退（-480/-486 的
     回捲跨兩個文件靠執行期掛鉤，主頁沒重整就版本錯開、整個漏掉——實測就漏了），
     不如**根本不記**：敗北從結構上就等於「這一場還沒發生過」。
     記錄點在 __flightResume({won:true})。 */
  const SC=enemy && enemy.script;
  scriptPending=null;        // 這一頁這一趟不再刷（免戰模式也是；重整就能再測一遍）
  if(peaceMode) return;      // 免戰：遭遇照演，就是不進戰鬥
  if(battleGoing) return;
  lastScriptS = SC || null;  // 這一場是哪一條劇本遭遇（打贏記 done／打輸重掛 pending 用）
  /* 這一場是不是**劇本遭遇**（＝第一場船戰）：打贏回來那一段「小命保住了」
     只掛在它身上（ver -453，Ray：「不要每次船戰都跳…只有第一場船戰結束會跳」）。
     見 `__flightResume`。 */
  lastBattleScripted = !!SC;
  /* ⚠ **一場戰鬥 1 小時**（ver -435，Ray 指定）。記在**真的要打**的這一刻：
     免戰模式與重複觸發都已經在上面 return 掉了，所以不會多算。 */
  clockAdvance(HOUR);
  battleGoing=true;          // 這一刻起船也停住（見 update() 的那一行）
  /* ⚠⚠ **立刻彈棺，不再等一拍**（ver -389，Ray：「在敵撞上玩家空氣壁之前就要彈槍棺」）。
     -387 那裡先停 700ms 是為了讓「遭遇　◯◯」那一格讀得到 —— 那一格已經拿掉了，
     停著只會讓怪停在船前面被看個仔細。現在是「碰到遭遇距離」與「棺開始上推」同一拍。
     ⚠ 敵人與船在這一刻都已經停住（`engage` 提早 return ＋ `battleGoing` 讓 mv=0），
       所以推棺的那一秒不會再有任何位移 —— 撞不到。 */
  layoutFKerb();                                   // 推之前重量一次（轉向過就會變）
  if(!muted) playSfx(kerbPopSE);
  /* ⚠ 不要用 `requestAnimationFrame` 掛這個 class：分頁在背景時 rAF **完全不跑**，
     於是門不推、時間到了直接跳頁（實測就是這樣漏掉的）。門的起始狀態早就在 DOM 裡
     落地了，直接加 class 就會有過場。 */
  const kb=document.getElementById('fkerb');
  if(kb) kb.classList.add('rise');
  /* ⚠⚠ 吊墜**留在面板左上，不掛回門上**（ver -481，Ray：「飛行畫面的吊墜是固定
     吊在操作面版左上方的，所以飛行畫面彈槍棺出來的時候槍棺上不會有吊墜」——
     推翻 -443「推棺那一刻回到門上」）。交棒後主遊戲那一半的門帶著吊墜出現，
     那一格的差異 Ray 知情。棺上推的震動仍讓面板上的吊墜甩一下（慣性）。 */
  fkerbPendSwing(9, 2.0);
  setTimeout(()=>fkerbPendSwing(22, 2.6), FKERB_RISE_MS);
  setTimeout(()=>{
    if(embedded()){
      flightAudio(false);                          // 進戰鬥：這一頁的音樂與環境音收掉
      /* `scripted`＝這一場是不是**劇情戰**（ver -493，Ray：「加上是否為劇情戰的判定，
         之後就讀那一個」）——由發起端（唯一知道的人）宣告，主遊戲照這個分流
         開場白與 talkOnce。隨機遭遇＝false。 */
      window.parent.__tivotFlight.battle({ battle:'flight_'+kind, geom:fkerbGeom, scripted: lastBattleScripted });
      return;
    }
    /* 獨立模式：照舊寫交棒鑰匙再跳頁。`gate:'kerb'` 告訴主遊戲門已經推到頂了。 */
    try{
      localStorage.setItem('tivot_battle_req_v1',
        JSON.stringify({ battle:'flight_'+kind, gate:'kerb', geom:fkerbGeom, scripted: lastBattleScripted }));
      localStorage.setItem('tivot_flight_ret_v1', JSON.stringify(
        { x:cam.x, y:cam.y, angle:cam.angle, alt:cam.alt }));
    }catch(e){}
    /* ⚠⚠ **跳最外層那一頁**（ver -415）：如果其實是在 iframe 裡（只是父頁的掛鉤不見了），
       用 `location.href` 會把主遊戲載進**這個小框裡** —— 畫面上就是「遊戲開在遊戲裡」，
       而且那條路徑上還有「開棺」。跳 `window.top` 才是對的。
       ⚠ 用絕對 URL：`window.top.location.href` 的相對路徑是相對**最外層**那一頁解的。 */
    const url=new URL('../index.html', location.href).href;
    try{ (window.top||window).location.href=url; }catch(_){ location.href=url; }
  }, FKERB_RISE_MS+150);
}

/* 這一頁的音樂與環境音：內嵌時由父頁開關（戰鬥期間要安靜，回來要接回去）。
   ⚠ 不能只靠「iframe 藏起來 rAF 就停」：rAF 停了 `updateBgm` 也不再跑，
     那幾個 <audio> 會**維持當時的音量繼續播**。要明確停。 */
function flightAudio(on){
  const loops=[bgmMain, ambSail, ambIdle, sfxTrain, sfxGull];
  for(const L of loops){ try{ on ? L.start() : L.stop(); }catch(_){} }
}
/* 父頁在戰鬥打完、要把畫面交還這一頁時呼叫（ver -388）。
   ⚠ `battleGoing` 一定要歸零：不歸零的話船永遠停著（見 update 的那一行），
     而且下一次遭遇的交棒鎖也解不開。 */
window.__flightResume=function(opts){
  extPaused=false;   // 父頁把畫面還回來（ver -481：extPaused 是「畫面收起」的凍結）
  battleGoing=false;
  /* ⚠ 時鐘要重讀（ver -435）：這一頁藏著的期間，戰鬥／城鎮那一邊可能推過時間
     （一場戰鬥 1 小時就是在 `toBattle` 記的）—— 不同步的話 HUD 與晝夜還停在出發前。 */
  syncClock();
  const kb=document.getElementById('fkerb'); if(kb) kb.classList.remove('rise');
  /* ⚠⚠ 吊墜掛回**控制面板**（ver -481，Ray：「飛行畫面的吊飾不見了」）——
     交棒時 toBattle 把它掛回門上（placeFkerbPend(true)），打完回來門沉下去了，
     它還是門的子節點＝跟著沉出畫面外。回到飛行＝回到面板左上（ver -443 的家）。 */
  placeFkerbPend(false);
  layoutFKerb();
  flightAudio(true);
  /* ⚠⚠ **打贏才接那一段對白**（ver -432）：ver -430 起打輸也會回到這一頁
     （戰敗頁的「繼續」），而那一段的第一句是「小命保住了」——
     輸了聽到這句是錯的。勝負由父頁告訴我們（`{won:true}`）。
     ⚠ 等門收完再演（`FKERB_MS`）：槍棺還蓋著半個畫面時放人出來，
       立繪會從門後面滑出來。 */
  const wasScripted = lastBattleScripted; lastBattleScripted = false;
  /* ══ 劇本遭遇的勝負記帳（ver -487，唯一的記錄點）══
     · 打贏：**這一刻**才記 done（-426 的「交棒就記」廢除 —— 敗北要等於沒發生過，
       憲法 §6.5.2）。
     · 打輸：pending 重掛（in-page 記憶；done 從來沒記，旗標不必退）——
       人還在國境外的話下一幀就再遭遇。順手退一次 done 是**治舊檔**：
       舊版在交棒時記過的殘留旗標藉此洗掉。
     · 連敗第三場走「送回旅店」不經過這裡 —— 沒關係：done 沒記過，下次出航
       重載本頁時 scriptPending 由旗標重算，自然又掛上。 */
  if(wasScripted && lastScriptS){
    if(opts && opts.won){ if(lastScriptS.done) addFlag(lastScriptS.done); }
    else{
      if(lastScriptS.done) removeFlag(lastScriptS.done);   // 治舊檔（見上）
      scriptPending = lastScriptS;
    }
  }
  if(!(opts && opts.won)) return;
  /* ⚠⚠ **只有第一場船戰（劇本遭遇的蜈蚣）打贏才演**（ver -453，Ray：「不要每次
     船戰都跳…只有第一場船戰結束會跳」）。旗標守門本來就有，但它綁的是
     **這一輪有沒有演過** —— 讀檔／跳章之後旗標歸零，隨便哪一場隨機遭遇打贏
     都會把這段「初次見面」的戲演出來。現在**雙重綁**：這一場必須是劇本遭遇
     （`lastBattleScripted`，`toBattle` 記的）＋ 旗標沒演過 —— 隨機遭遇永遠不演。 */
  if(!wasScripted) return;
  if(flagOn(AFTER_SHIP_FLAG)) return;
  addFlag(AFTER_SHIP_FLAG);
  /* 站位：蕾娜右／諾薇兒左（ver -478，Ray：「要分左右」）——
     與船戰內對白（config.tutorial.cast）同一個安排，玩家的空間記憶才連得起來。 */
  setTimeout(()=>{ if(!sayQueue) say(AFTER_SHIP_TALK, performance.now(), { sides:{ renna:'R' } }); }, 900);
};
window.__flightPause=function(){ extPaused=true; flightAudio(false); };
/* ══ 強制戰打輸的回捲（ver -480 建、-486 抽鉤、-487 起**幾乎不再需要**）══
   -487 起 done 旗標「打贏才記」（見 toBattle／__flightResume）—— 敗北從結構上
   就是「沒發生過」，不必退旗標。這支保留兩個理由：
     ① 治舊檔：舊版在交棒時記過的 done 藉此洗掉
     ② 舊版 main 相容：-486 的 main 會呼叫它，行為與 resume 的敗北分支一致（冪等） */
window.__flightLoseRollback=function(){
  if(lastScriptS){
    if(lastScriptS.done) removeFlag(lastScriptS.done);
    scriptPending = lastScriptS;
  }
};
/* 整備窗／設定窗蓋在飛行畫面上（ver -481，Ray：「開整備窗、設定窗就直接暫停
   飛行畫面一切動作」）：與 __flightPause 同一個開關，只是它有「放開」的一半。
   ⚠ **音樂不凍**（ver -483，Ray：「音樂不要凍結」）：只凍模擬，不動音訊 ——
     loop 整幀跳過會讓 updateBgm 停手，但 HTMLAudio 自己會照放（音量凍在當下）。
     真的要收音的只有 __flightPause（戰鬥／畫面收起 —— 那時換別頁的曲子上場）。 */
window.__flightHold=function(on){ extPaused=!!on; };

/* 打完回來：把船放回離開時的位置（ver -382）。
   ⚠ **讀了就清掉**：不清的話下次正常進飛行頁還會被拉回那個座標。
   ⚠ 這一段要在 `cam` 宣告之後才跑得到，所以掛在這裡（生怪那一區）而不是檔頭。 */
(function restoreFlightPos(){
  try{
    const j=JSON.parse(localStorage.getItem('tivot_flight_ret_v1')||'null');
    localStorage.removeItem('tivot_flight_ret_v1');
    if(j && isFinite(j.x) && isFinite(j.y)){
      cam.x=j.x; cam.y=j.y;
      if(isFinite(j.angle)) cam.angle=j.angle;
      if(isFinite(j.alt))   cam.alt=j.alt;
    }
  }catch(e){}
})();

/* 加速鈕（開發用）：點一下位移加倍，再點一次回復。
   ⚠ 倍率套在**位移**（mv）而不是 cam.speed：cam.speed 同時驅動速度錶、
     螺旋槳轉速、尾流與船身俯仰，乘上去會讓那些儀表一起說謊。要的只是
     「同樣的操作手感，跑得比較快」，所以只放大每幀走的距離。 */
let SPD_BOOST=1;
document.getElementById('boostBtn').addEventListener('click',e=>{
  SPD_BOOST = SPD_BOOST>1 ? 1 : 2;
  e.currentTarget.textContent='×'+SPD_BOOST;
  e.currentTarget.classList.toggle('on', SPD_BOOST>1);
});

/* 生怪鈕（開發用）：立刻換一隻新的，並把自動刷新的計時歸零重算，
   免得手動生完隔幾秒又被自動刷新蓋掉。 */
document.getElementById('spawnBtn').addEventListener('click',()=>{
  enemy=null;
  spawnEnemy();
  enemyTimer=ENEMY_CFG.gapMin+Math.random()*(ENEMY_CFG.gapMax-ENEMY_CFG.gapMin);
});

/* 程序翅（drawWingsProc）已內聯進 drawEnemy3D（蟲翅/鳥翼兩個分支）——
   ver -495 清死碼時把零呼叫的原函式拆掉，畫法的說明見 drawEnemy3D 該兩段。 */

/* 逐節投影 + 程序繪製。回傳畫過就 true（給提示字用）。 */
/* 進入戰鬥的提示（戰鬥本身尚未實作）。鏈狀與剛體兩條繪製路徑都要用，
   所以抽成函式；文字不進低解析緩衝——那是 UI，跟著糊就成了糊掉的字。 */
/* ══ 國界 ══════════════════════════════════════════════════════════
   國界**不畫在畫面上**，只用來定位：飛越國境時左下角淡入淡出顯示當前所在國。

   資料由 build_regions.py 從 Reference/region.png 抽出來（那張是疊在
   silvermoon_sheet.png 上畫的，疊色是線性的所以解得出來；見該檔檔頭）。
   索引圖是半解析度：1 像素 = 2 地圖像素 = 40 世界單位，對「我在哪一國」
   這個用途綽綽有餘，而且整張只有幾 KB。 */
let REGION=null, REGION_W=0, REGION_H=0, REGION_NAME=[];
let regionCur=-1, regionShownAt=0;
const REGION_IN=420, REGION_HOLD=2600, REGION_OUT=900;   // 淡入／停留／淡出（ms）

function loadRegions(){
  return fetch('region_map.json').then(r=>r.ok?r.json():null).then(J=>{
    if(!J) return;
    REGION_NAME=J.regions.map(r=>r.zh);
    return new Promise(res=>{
      const im=new Image();
      im.onload=()=>{
        const c=document.createElement('canvas');
        c.width=J.w; c.height=J.h;
        const g=c.getContext('2d',{willReadFrequently:true});
        g.drawImage(im,0,0);
        const d=g.getImageData(0,0,J.w,J.h).data;
        REGION=new Uint8Array(J.w*J.h);
        for(let i=0,j=0;i<REGION.length;i++,j+=4) REGION[i]=d[j];
        REGION_W=J.w; REGION_H=J.h;
        res();
      };
      im.onerror=()=>res();
      setTimeout(res,4000);
      im.src='region_map.png';
    });
  }).catch(()=>{});
}

function regionAt(mx,my){
  if(!REGION) return 0;
  const x=(mx*REGION_W/MAPW)|0, y=(my*REGION_H/MAPH)|0;
  if(x<0||y<0||x>=REGION_W||y>=REGION_H) return 0;
  return REGION[y*REGION_W+x];
}

/* 每幀檢查所在國；換了就重新計時。
   ⚠ 0（無主之地／雲海）不觸發橫幅 —— 飛出海岸線再飛回來會一直閃。
     但仍要更新 regionCur，否則出海再回同一國不會提示。 */
function updateRegion(now){
  if(!REGION) return;
  const r=regionAt(cam.x/MAP_SCALE, cam.y/MAP_SCALE);
  if(r!==regionCur){
    const was=regionCur;
    regionCur=r;
    if(r!==0 && was!==-1) regionShownAt=now;      // 開場那次不提示
  }
}

function drawRegionBanner(now){
  if(!regionShownAt || !REGION_NAME[regionCur]) return;
  const t=now-regionShownAt, total=REGION_IN+REGION_HOLD+REGION_OUT;
  if(t>total){ regionShownAt=0; return; }
  const a=t<REGION_IN ? t/REGION_IN
        : t<REGION_IN+REGION_HOLD ? 1
        : 1-(t-REGION_IN-REGION_HOLD)/REGION_OUT;
  const name=REGION_NAME[regionCur];
  ctx.save();
  ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  /* ⚠ 高度**跟著方向計走**，不要用 VIEWH 的比例硬寫：羅盤帶的位置是由
     HELM_OUT 反推的，比例值遲早會壓到它身上（0.93 就正好疊在上面）。
     襯底往上 19、往下 9，所以基線退到帶子上緣再留 6px 才不相觸。 */
  const x=Math.round(W*0.045), y=compassRect().y-15;
  /* 淡入時從左邊滑進來一小段：純 alpha 淡入在低解析度畫面上讀起來像閃爍，
     加一點位移才有「進入某地」的方向感。 */
  const slide=(1-Math.min(1,t/REGION_IN))*14;
  ctx.globalAlpha=a;
  ctx.font='15px "Noto Serif TC",serif';
  const wTxt=ctx.measureText(name).width;
  /* 襯底用漸層而不是實色方塊：方塊在這個尺寸下像個 UI 元件，
     漸層才像字浮在畫面上。 */
  const g=ctx.createLinearGradient(x-14-slide,0,x+wTxt+40-slide,0);
  g.addColorStop(0,'rgba(6,7,12,0)');
  g.addColorStop(0.18,'rgba(6,7,12,.55)');
  g.addColorStop(0.72,'rgba(6,7,12,.45)');
  g.addColorStop(1,'rgba(6,7,12,0)');
  ctx.fillStyle=g;
  ctx.fillRect(x-14-slide,y-19,wTxt+54,28);
  ctx.fillStyle='#c9a227';
  ctx.fillRect(x-slide,y-13,2,14);
  ctx.fillStyle='rgba(224,214,190,.95)';
  ctx.fillText(name,x-slide+9,y);
  ctx.restore();
  ctx.globalAlpha=1;
}

function drawEngagePrompt(){
  ctx.save();
  ctx.textAlign='center';
  ctx.font='13px "Noto Serif TC",serif';
  const yy=Math.round(VIEWH*0.30);
  const t='遭遇　'+ENEMY_KINDS[enemy.kind].name;
  /* ⚠ 只剩免戰版（ver -389）：正常遭遇根本不畫這一格（見呼叫端）。 */
  const t2 = '—　免 戰 中　—';
  ctx.fillStyle='rgba(6,7,12,.62)';
  ctx.fillRect(W/2-92,yy-22,184,46);
  ctx.fillStyle='rgba(216,205,180,.92)'; ctx.fillText(t,W/2,yy-4);
  ctx.fillStyle='#c9a227'; ctx.font='12px "Noto Serif TC",serif';
  ctx.fillText(t2,W/2,yy+16);
  ctx.restore();
  ctx.textAlign='left';
}

function drawEnemy3D(scaleH,horizon,sinp,cosp,now){
  if(!enemy) return;
  const C=ENEMY_CFG;
  const K=ENEMY_KINDS[enemy.kind];   // 兩條繪製路徑都要，提到最前面宣告
  const sxk=W/BW, syk=VIEWH/BH;
  const project=(wx,wy,alt)=>{
    const dx=wx-cam.x, dy=wy-cam.y;
    let z=dx*(-sinp)+dy*(-cosp); if(z<20) z=20;
    const sv=(dx*cosp+dy*(-sinp))/z;
    return [((sv+1)/2*BW)*sxk,
            (((cam.alt-alt)/z + z*curvAt(sv))*scaleH+horizon)*syk,
            z, W/(2*z)];
  };
  // 頭的深度先算一次：整隻在身後或太遠就不畫
  const hp=project(enemy.x,enemy.y,enemy.alt);   // bob 只影響繪製，剔除用本體高度
  const zc=hp[2];
  if(zc>ZFAR*0.95) return;
  /* ⚠ 在身後也不畫，而且要用**未夾制**的深度判。project 對 z<20 做了夾制，
     夾過之後 P[3]=W/40，一隻體長 210 的怪會算出近 2000px 的外框，
     enemyFB 跟著配到 1000×1000 —— 一張只會被貼到畫面外的貼圖，純浪費。
     ⚠ 這條 return 只是「不畫」。**進入戰鬥的提示不在這裡** —— 它已經搬到
       畫格主流程，敵人在身後、被山擋住、還沒解碼立繪，都照樣要提示。 */
  if((enemy.x-cam.x)*(-sinp)+(enemy.y-cam.y)*(-cosp) < 40) return;

  const S=sky();
  /* 振翅浮動：疊在繪製端而不是寫回 enemy.alt —— 寫回去會跟上面的指數逼近
     互相拉扯，變成一邊追目標一邊被浮動推開，收斂不了。 */
  const bob=Math.sin(now*0.0031+enemy.phase)*5.5;
  /* 受光：跟船與地形同一盞燈。夜裡壓暗並偏冷（銀月是冷光），
     日夕之交偏暖 —— 常數與 drawShip 的色調同源。 */
  const nightK=clamp(1-S.day*1.2,0,1);
  const lit=clamp(0.26+S.day*0.74,0.26,1);
  const warmR=lerp(1,1.12,S.dusk), warmG=lerp(1,1.00,S.dusk), warmB=lerp(1,0.84,S.dusk);
  const coolR=lerp(1,0.72,nightK), coolG=lerp(1,0.80,nightK), coolB=lerp(1,1.06,nightK);
  const shade=(r,g,b,a)=>'rgba('+Math.round(clamp(r*lit*warmR*coolR,0,255))+','
                               +Math.round(clamp(g*lit*warmG*coolG,0,255))+','
                               +Math.round(clamp(b*lit*warmB*coolB,0,255))+','+a+')';

  /* ── 剛體怪（plan:'rigid'）─────────────────────────────────────
     不變形、不分節，整隻依「朝向 vs 鏡頭」挑一張方位圖貼上去。
     判準是船的朝向與「船→鏡頭」向量的夾角：
       |θ|<40°  → 正面（朝你來）
       |θ|>140° → 背面（背對你）
       其餘      → 側視，左右由外積正負決定
     ⚠ 不做螢幕旋轉：飛船是保持水平的，轉向時換的是**視角**不是傾角。
       鏈狀怪那套 ang−π/2 的旋轉搬過來會把船轉成直立。 */
  if(K.plan==='rigid'){
    const set=enemyArt[enemy.kind];
    const P=project(enemy.x,enemy.y,enemy.alt+bob);
    if(!set || P[2]>ZFAR*0.95) return;
    const tcx=cam.x-enemy.x, tcy=cam.y-enemy.y;
    const tl=Math.hypot(tcx,tcy)||1;
    const dot=(enemy.hx*tcx+enemy.hy*tcy)/tl;
    const crs=(enemy.hx*tcy-enemy.hy*tcx)/tl;
    /* 視角換圖要**交叉淡入**，不能過門檻就硬換。
       船的朝向本身已經有角速度上限（turnRate），會突然變的是「用哪張圖」——
       在門檻兩側各留 BAND 的過渡帶，兩張疊著畫、權重線性交換。
       ⚠ 過渡帶不能太寬：兩張圖差異大，疊太久會出現雙重影。±10°，
         再加 smoothstep 讓權重快速通過 50/50 —— 線性的話中段停留最久，
         而中段正是疊影最明顯的地方。

       ── 方位表 ─────────────────────────────────────────────
       每張圖登記它的**原生方位角** th，門檻取相鄰兩張的中點。
       原本只有四張、門檻在 40°/140°，一跳 90° 的形變全靠 squash 硬撐；
       補上兩張斜視圖後成了一圈八個，最遠只差 ~27°。
       flip：斜視圖各自只在一邊是原圖，另一邊得水平鏡射（見 sprite 的註）。
       ⚠ 鏡射要包在 rotate 裡面：side傾是螢幕空間的，鏡的是圖不是傾角。 */
    const th=Math.abs(Math.atan2(crs,dot));
    const R=(crs>0);
    const HALFPI=Math.PI/2;
    const VIEWS=[
      {img:set.front,           th:0,          flip:false, fixed:true},
      {img:set.frontQ,          th:K.qFront,   flip:!R},
      {img:R?set.sideR:set.sideL, th:HALFPI,   flip:false},
      {img:set.rearQ,           th:K.qRear,    flip:R},
      {img:set.rear,            th:Math.PI,    flip:false, fixed:true},
    ].filter(v=>v.img);
    const BAND=0.17;                                  // ±10°
    let ai=0;
    while(ai<VIEWS.length-1 && th>(VIEWS[ai].th+VIEWS[ai+1].th)/2) ai++;
    let vA=VIEWS[ai], vB=null, mix=0;
    const bLo=ai>0 ? (VIEWS[ai-1].th+vA.th)/2 : -1e9;
    const bHi=ai<VIEWS.length-1 ? (vA.th+VIEWS[ai+1].th)/2 : 1e9;
    if(th<bLo+BAND){      vB=VIEWS[ai-1]; mix=sstep(0,1,(bLo+BAND-th)/(2*BAND)); }
    else if(th>bHi-BAND){ vB=VIEWS[ai+1]; mix=sstep(0,1,(th-(bHi-BAND))/(2*BAND)); }
    const img=vA.img;
    if(!img) return;
    const wpp=K.bodyLen/((set.sideR||img).width);     // 世界單位／來源像素（側視寬＝船長）
    /* 依夾角**橫向收縮**：船轉向鏡頭時，船身的視長 ∝ sinθ。
       每張圖只需補「離它自己的原生角度」那一段：squash = sinθ / sin(原生θ)，
       所以在門檻上兩張算出來的寬度**完全相等** —— 接縫不會有寬度跳動。
       ⚠ 正面／背面圖不套（fixed）：θ=0 時船身視長為零，那張圖的寬度代表的是
         **帆桁的展幅**不是船長，跟著 sinθ 縮會直接壓成一條線。
       ⚠ 桅杆與帆是直立的、理論上不該跟著橫縮。只有四張圖時側視得縮到 0.30，
         那個誤差是看得出來的；補上斜視圖後側視最多只縮到 0.90，已無妨。 */
    /* 收縮有下限:輪廓寬其實是 max(船長·sinθ, 帆桁展幅·cosθ) —— 接近正／背面時
       撐住寬度的是帆桁不是船長,一路照 sinθ 縮會縮到比正面圖還窄。
       實測 150°~154° 就有一個 10% 的凹陷(斜後圖 74px 對背視圖 82px)。
       下限取「端點視圖的寬度」:那張圖畫的正是帆桁展幅,拿它當底最省事。
       (舊碼的 max(0.30,…) 是同一件事的土法版,0.30 是湊的,這裡有依據。) */
    const endW=(set.front&&set.rear)?Math.min(set.front.width,set.rear.width):0;
    const sq=(v)=>{
      if(v.fixed) return 1;
      const q=Math.abs(Math.sin(th))/Math.sin(v.th);
      return endW?Math.max(q,endW/v.img.width):q;
    };
    const squash=sq(vA);
    const w=img.width*wpp*P[3]*squash, h=img.height*wpp*P[3];
    if(w<2) return;
    const imgB=vB?vB.img:null;
    const wB=imgB?imgB.width*wpp*P[3]*sq(vB):0, hB=imgB?imgB.height*wpp*P[3]:0;
    const pad=Math.ceil(Math.max(w,h,wB,hB)*0.6)+6;   // 兩張都要框得下
    const x0=Math.round(P[0]-w/2)-pad, y0=Math.round(P[1]-h/2)-pad;
    const fw=Math.ceil(w)+pad*2, fh=Math.ceil(h)+pad*2;
    const pk=clamp(BW/W*C.pixelScale,0.15,1);
    const bwp=Math.max(2,Math.round(fw*pk)), bhp=Math.max(2,Math.round(fh*pk));
    if(!enemyFB || enemyFB.width!==bwp || enemyFB.height!==bhp){
      enemyFB=document.createElement('canvas'); enemyFB.width=bwp; enemyFB.height=bhp;
      EC=enemyFB.getContext('2d');
    }
    EC.setTransform(1,0,0,1,0,0); EC.clearRect(0,0,bwp,bhp);
    EC.setTransform(bwp/fw,0,0,bhp/fh,-x0*bwp/fw,-y0*bhp/fh);
    /* 側傾：繞船自己的中心轉一個小角度。飛船保持水平飛行，但轉彎會外傾。 */
    const roll=(enemy.roll||0)*0.28;      // 最大約 16°
    EC.save(); EC.translate(P[0],P[1]); EC.rotate(roll);
    const blit=(im,ww,hh,flip,al)=>{
      EC.globalAlpha=al;
      if(flip){ EC.save(); EC.scale(-1,1); EC.drawImage(im,-ww/2,-hh/2,ww,hh); EC.restore(); }
      else EC.drawImage(im,-ww/2,-hh/2,ww,hh);
    };
    /* ⚠ 權重取**平方根**不是直接用 mix:兩張各畫 0.5 疊起來,覆蓋率是
       0.5+0.5-0.25＝0.75 —— 過渡帶正中央的船會有四分之一透明度,天空
       透出來,整艘船發白。等功率(sqrt)權重把最低覆蓋率拉到 0.91,
       兩端仍精確收斂到 1／0,不會在門檻上跳。 */
    blit(img,w,h,vA.flip,imgB?Math.sqrt(1-mix):1);
    if(imgB) blit(imgB,wB,hB,vB.flip,Math.sqrt(mix));
    EC.globalAlpha=1; EC.restore();
    ctx.save(); ctx.imageSmoothingEnabled=false;
    clipByTerrainDepth(P[2],W/BW,VIEWH/BH);   // 山也該擋住船
    ctx.drawImage(enemyFB,0,0,bwp,bhp,x0,y0,fw,fh);
    ctx.restore();
    return;
  }

  /* 體節沿**軌跡**排，不是沿 −heading 拉一條直線。
     直線的話整條蟲是剛體，轉向時會像一根棒子在原地轉。沿軌跡排之後，
     每一節都走頭曾經走過的位置 —— 轉彎自然成為一條弧，身體依序跟上。 */
  const segL=K.bodyLen/K.segs;
  const wob=now*K.waveHz+enemy.phase;
  /* 追擊/遭遇時扭得猙獰：振幅放大，並疊上兩個**不整除**的倍頻，
     相位再隨節次錯開 —— 單一正弦是規律的波浪，怎麼加大都只是「游得快」；
     要讓它讀成「竄」就得破壞週期性，讓相鄰體節的擺向對不上。 */
  const rage=(enemy.state==='chase'||enemy.state==='engage')?1:0;
  const spine=[{x:enemy.x,y:enemy.y}].concat(enemy.trail||[]);
  const posAt=(d)=>{
    let acc=0;
    for(let j=1;j<spine.length;j++){
      const a=spine[j-1], b=spine[j];
      const sd=Math.hypot(b.x-a.x,b.y-a.y);
      if(acc+sd>=d){ const f=sd?(d-acc)/sd:0;
        return {x:a.x+(b.x-a.x)*f, y:a.y+(b.y-a.y)*f}; }
      acc+=sd;
    }
    const e=spine[spine.length-1]||spine[0];       // 軌跡不夠長就沿當下朝向外推
    const rem=d-acc;
    return {x:e.x-enemy.hx*rem, y:e.y-enemy.hy*rem};
  };
  const pts=[];
  for(let i=0;i<K.segs;i++){
    const base=posAt(segL*i), aft=posAt(segL*i+8);
    let ux=base.x-aft.x, uy=base.y-aft.y;
    const ul=Math.hypot(ux,uy)||1; ux/=ul; uy/=ul;   // 該節的局部前進方向
    const w1=Math.sin(wob-i*K.wavePhase);
    const w2=rage*0.60*Math.sin(wob*2.37-i*1.90+Math.sin(i*2.1)*2.0);
    const w3=rage*0.38*Math.sin(wob*3.91+i*0.70);
    const off=(w1+w2+w3)*K.waveAmp*(1+rage*0.85)*(0.35+i/K.segs);   // 尾巴擺幅大
    if(K.vertical) pts.push(project(base.x, base.y, enemy.alt+bob+off));
    else           pts.push(project(base.x-uy*off, base.y+ux*off, enemy.alt+bob));
  }


  /* ── 像素化：先縮小再放大 ─────────────────────────────────────
     牠是用向量畫的，邊緣本來就是平滑的——貼在 234×334 上採樣的地形上，
     整隻像一張高解析貼紙浮在馬賽克世界裡。作法同飛空艇的 shipFB：
     先在 pk 倍的低解析緩衝上畫完，再關掉平滑用 nearest 放大貼回。
     pk = BW/W = 0.6，剛好跟地形緩衝同一個解析度級距。
     ⚠ 緩衝範圍要框住整隻（含翅與步足），不然邊緣會被裁掉。
     ⚠ 提示文字不進緩衝——那是 UI，不該跟著糊。 */
  /* 外框要涵蓋「實際會畫多寬」。
     ⚠ 這個值原本寫死 52（程序翅的翅展 46 加餘裕）。換成素材之後，
       一張俯視圖的全寬是蜈蚣 172／羽蛇 290 世界單位，半寬就已經超出 52 ——
       結果左右被切掉、低解析緩衝被內容塞滿。改成由素材自己算。 */
  const _art=enemyArt[enemy.kind], _sp=K.sprite;
  const marginW=(_art&&_sp)
    ? _art.width*(K.bodyLen/((_sp.body[1]-_sp.body[0])*_art.height))*0.62
    : 52;
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const P of pts){
    const m=Math.max(6,P[3]*marginW);
    if(P[0]-m<x0)x0=P[0]-m; if(P[0]+m>x1)x1=P[0]+m;
    if(P[1]-m<y0)y0=P[1]-m; if(P[1]+m>y1)y1=P[1]+m;
  }
  x0=Math.max(x0,-400); y0=Math.max(y0,-400); x1=Math.min(x1,W+400); y1=Math.min(y1,VIEWH+400);
  const fw=Math.ceil(x1-x0), fh=Math.ceil(y1-y0);
  if(fw<2||fh<2||x1<0||y1<0||x0>W||y0>VIEWH) return;
  const pk=clamp(BW/W*C.pixelScale,0.15,1);
  const bwp=Math.max(2,Math.round(fw*pk)), bhp=Math.max(2,Math.round(fh*pk));
  if(!enemyFB || enemyFB.width!==bwp || enemyFB.height!==bhp){
    enemyFB=document.createElement('canvas'); enemyFB.width=bwp; enemyFB.height=bhp;
    EC=enemyFB.getContext('2d');
  }
  EC.setTransform(1,0,0,1,0,0);
  EC.clearRect(0,0,bwp,bhp);
  // 之後一律用「螢幕座標」思考：緩衝自己吸收縮放與位移
  EC.setTransform(bwp/fw,0,0,bhp/fh,-x0*bwp/fw,-y0*bhp/fh);
  EC.save();
  EC.lineCap='round'; EC.lineJoin='round';

  /* 眼睛（兩種怪共用）：夜裡發亮。
     ⚠ 亮度不吃 shade()：那盞燈是「反射的天光」，而眼睛是**自體發光**，
       天越暗它該越顯眼而不是越暗——照 shade 走就會跟著全身一起沉下去。
     ⚠ 用 lighter 疊加：光點要在暗底上「亮起來」而不是「塗上去」。
     白天也留一點餘光，只是被日光壓過（同銀月的處理）。 */
  const drawEyes=(P,ang,r,col)=>{
    const puls=0.55+0.45*Math.sin(now*0.0125+enemy.phase*3);
    const glow=(0.16+nightK*0.84)*puls;
    const er=r*0.30, ex=r*0.42;
    EC.save(); EC.globalCompositeOperation='lighter';
    for(const sgn of [1,-1]){
      const gx=P[0]+Math.cos(ang)*ex-Math.sin(ang)*sgn*r*0.40;
      const gy=P[1]+Math.sin(ang)*ex+Math.cos(ang)*sgn*r*0.40;
      const R2=Math.max(1.2,er*2.6);
      const gg=EC.createRadialGradient(gx,gy,0,gx,gy,R2);
      gg.addColorStop(0,'rgba('+col[0]+','+Math.round(col[1]*glow)+','+Math.round(col[2]*glow)+','+(0.95*glow).toFixed(3)+')');
      gg.addColorStop(0.35,'rgba('+col[3]+','+col[4]+','+col[5]+','+(0.55*glow).toFixed(3)+')');
      gg.addColorStop(1,'rgba('+col[3]+','+col[4]+','+col[5]+',0)');
      EC.fillStyle=gg;
      EC.beginPath(); EC.arc(gx,gy,R2,0,Math.PI*2); EC.fill();
      EC.fillStyle='rgba(255,'+Math.round(150*glow+40)+','+Math.round(120*glow+30)+','+(0.9*glow+0.1).toFixed(3)+')';
      EC.beginPath(); EC.arc(gx,gy,Math.max(0.6,er),0,Math.PI*2); EC.fill();
    }
    EC.restore();
  };
  const segAng=i=>Math.atan2(pts[i][1]-pts[i-1][1], pts[i][0]-pts[i-1][0]);
  /* 拍翅曲線：蟲翅用 |cos|（過零點的尖角就是那個「啪」），
     鳥翼用平滑正弦（0..1 之間順順地來回，沒有頓挫）。 */
  const flap=K.wingSmooth ? 0.5+0.5*Math.sin(now*K.wingHz)
                          : Math.abs(Math.cos(now*K.wingHz));

  /* ── 精靈模式（plan:'chain'）─────────────────────────────────────
     俯視圖是**筆直**畫的，所以可以沿圖高切成橫條：每個體節取 body 區間裡
     對應的一條，貼在該節的投影位置、轉到該節的方向。彎曲是由「各節位置」
     產生的，不需要別的角度的整條身體。
     ⚠ 精靈朝上（12 點），而 ang 是「由前一節指向本節」＝朝尾。
       要把精靈的 +y（尾向）對到 ang，旋轉量是 ang−π/2。
     ⚠ 翅仍走程序：它要獨立振動，在俯視圖裡又跟身體重疊，切不開。 */
  const art=enemyArt[enemy.kind], SP=K.sprite;
  if(art && SP){
    /* 圖分三段：head / wings / body(含尾)。
       ⚠ body 一定要含尾：羽蛇的長度大半在羽尾上，只把中間那段當身體
         會讓「每來源像素代表幾個世界單位」算大好幾倍，整隻炸開成色塊。
         判準是**每列寬度剖面**量出來的（翅那段明顯寬出來），不是目測。
       ⚠ 翅獨立成一塊剛體貼在肩上：翅要振動，跟身體同一條鏈就只能跟著扭。
         正俯視下振翅＝展幅在縮放，所以橫向縮放即可，不必另外的角度。 */
    const bodyFrac=SP.body[1]-SP.body[0];
    const wpp=K.bodyLen/(bodyFrac*art.height);        // 世界單位／來源像素
    const put=(t0,t1,P,ang,lenPx)=>{
      const sc=P[3], w=art.width*wpp*sc;
      const sy=t0*art.height, sh=Math.max(1,(t1-t0)*art.height);
      EC.save(); EC.translate(P[0],P[1]); EC.rotate(ang-Math.PI/2);
      EC.drawImage(art,0,sy,art.width,sh,-w/2,-lenPx/2,w,lenPx);
      EC.restore();
    };
    const n=pts.length;
    // 身體＋尾：由尾往頭畫，頭才蓋在最上面
    for(let i=n-1;i>=1;i--){
      const t0=SP.body[0]+bodyFrac*((i-1)/(n-1));
      const t1=SP.body[0]+bodyFrac*(i/(n-1));
      const Q=pts[i-1], P=pts[i];
      const gap=Math.hypot(P[0]-Q[0],P[1]-Q[1]);
      const nat=(t1-t0)*art.height*wpp*P[3];
      put(t0,t1,P,segAng(i),Math.max(gap*1.5,nat*1.05));   // 取較大者：既不留縫也不壓扁
    }
    /* 翅：貼在頭後方一節的位置，橫向依 flap 縮放。
       ⚠ 用 scale 而非換圖：正俯視下鳥翼與蟲翅的拍動都是展幅在變，
         這個角度看不出上下揮的差別，換圖只是多載素材。 */
    {
      const P=pts[1]||pts[0];
      const sc=P[3], ang=segAng(1);
      const wt0=SP.wings[0], wt1=SP.wings[1];
      const w=art.width*wpp*sc*(0.45+flap*0.55);
      const h=(wt1-wt0)*art.height*wpp*sc;
      if(w>1.5){
        EC.save(); EC.translate(P[0],P[1]); EC.rotate(ang-Math.PI/2);
        EC.drawImage(art,0,wt0*art.height,art.width,(wt1-wt0)*art.height,-w/2,-h/2,w,h);
        EC.restore();
      }
    }
    // 頭
    {
      const P=pts[0];
      const ang=Math.atan2(pts[0][1]-pts[1][1], pts[0][0]-pts[1][0])+Math.PI;
      const lp=(SP.head[1]-SP.head[0])*art.height*wpp*P[3];
      put(SP.head[0],SP.head[1],P,ang,Math.max(2,lp));
    }
    // 眼：自發光，疊在素材之上
    {
      const P0=pts[0], r0=Math.max(1,P0[3]*art.width*wpp*0.10);
      const a0=Math.atan2(pts[0][1]-pts[1][1], pts[0][0]-pts[1][0]);
      drawEyes(P0,a0,r0, enemy.kind==='serpent'?[255,210,60,238,176,30]:[255,70,40,226,26,18]);
    }

  }else if(enemy.kind==='centipede'){
    /* 步足：分兩段（腿節＋跗節）帶一個關節。單一直線在近處就是一根牙籤，
       有折點才有蟲腳的感覺。 */
    for(let i=1;i<pts.length;i++){
      const P=pts[i], sc=P[3], r=Math.max(0.8,sc*3.4);
      if(r<0.35) continue;
      const ang=segAng(i);
      const nx=Math.cos(ang+Math.PI/2), ny=Math.sin(ang+Math.PI/2);
      const sw=Math.sin(wob*1.6-i*0.7)*0.35;
      for(const sgn of [1,-1]){
        const kx=P[0]+nx*sgn*r*1.5+Math.cos(ang)*sw*r*1.2;   // 關節
        const ky=P[1]+ny*sgn*r*1.5+Math.sin(ang)*sw*r*1.2;
        const tx2=P[0]+nx*sgn*r*2.5+Math.cos(ang)*sw*r*2.6;  // 腳尖
        const ty2=P[1]+ny*sgn*r*2.5+Math.sin(ang)*sw*r*2.6;
        EC.strokeStyle=shade(214,158,32,0.95); EC.lineWidth=Math.max(0.7,r*0.34);
        EC.beginPath(); EC.moveTo(P[0],P[1]); EC.lineTo(kx,ky); EC.stroke();
        EC.strokeStyle=shade(176,120,24,0.95); EC.lineWidth=Math.max(0.5,r*0.22);
        EC.beginPath(); EC.moveTo(kx,ky); EC.lineTo(tx2,ty2); EC.stroke();
      }
    }
    /* 體節：背板 + 紋理。由尾往頭畫，頭才蓋在最上面。
       近距離看太糙的原因是一節只有兩個同心橢圓 —— 這裡補上
       前緣高光、後緣暗邊、背中線與隔節色帶。低解析緩衝會把它糊成馬賽克，
       那正好，遠看是質感、近看是像素。 */
    for(let i=pts.length-1;i>=0;i--){
      const P=pts[i], sc=P[3], r=Math.max(0.9,sc*3.9);
      const ang=i>0?segAng(i):segAng(1);
      const band=(i&1)?1:0;                       // 隔節深淺
      EC.save(); EC.translate(P[0],P[1]); EC.rotate(ang);
      EC.fillStyle=shade(band?52:64,band?36:44,band?32:38,1);
      EC.beginPath(); EC.ellipse(0,0,r*1.05,r*0.82,0,0,Math.PI*2); EC.fill();
      if(r>1.6){
        EC.fillStyle=shade(96,64,50,0.55);        // 前緣高光
        EC.beginPath(); EC.ellipse(-r*0.30,0,r*0.52,r*0.62,0,0,Math.PI*2); EC.fill();
        EC.strokeStyle=shade(24,16,14,0.75); EC.lineWidth=Math.max(0.5,r*0.16);
        EC.beginPath(); EC.arc(r*0.55,0,r*0.62,-1.15,1.15); EC.stroke();   // 後緣暗邊
      }
      EC.fillStyle=shade(150,42,30,0.85);         // 背中線
      EC.beginPath(); EC.ellipse(0,0,r*0.62,r*0.30,0,0,Math.PI*2); EC.fill();
      if(r>2.2){
        EC.fillStyle=shade(206,86,52,0.5);
        EC.beginPath(); EC.ellipse(-r*0.10,0,r*0.26,r*0.13,0,0,Math.PI*2); EC.fill();
      }
      EC.restore();
    }
    // 蟲翅：兩對，附在近頭端。振翅只改展幅——正俯視下拍動就是展幅在縮放
    for(const wi of [1,3]){
      const P=pts[wi]; if(!P) continue;
      const sc=P[3], span=sc*46, chord=sc*11;
      if(span<1.2) continue;
      const ang=segAng(wi);
      for(const sgn of [1,-1]){
        EC.save(); EC.translate(P[0],P[1]);
        EC.rotate(ang+sgn*(Math.PI/2)*(0.34+flap*0.52));
        EC.fillStyle=shade(206,226,246,0.42);
        EC.beginPath(); EC.ellipse(span*0.5,0,span*0.5,chord*(0.42+flap*0.58),0,0,Math.PI*2); EC.fill();
        EC.strokeStyle=shade(226,182,86,0.55); EC.lineWidth=Math.max(0.6,sc*1.1);
        EC.stroke();
        EC.restore();
      }
    }
    // 頭：顎與觸角
    {
      const P=pts[0], sc=P[3], r=Math.max(1,sc*4.2);
      const ang=Math.atan2(pts[0][1]-pts[1][1], pts[0][0]-pts[1][0]);
      EC.fillStyle=shade(70,46,40,1);
      EC.beginPath(); EC.ellipse(P[0],P[1],r*1.15,r*0.9,0,0,Math.PI*2); EC.fill();
      drawEyes(P,ang,r,[255,70,40,226,26,18]);
      EC.strokeStyle=shade(168,34,26,0.95); EC.lineWidth=Math.max(0.7,r*0.22);
      for(const sgn of [1,-1]){                                  // 觸角
        const a2=ang+sgn*0.42;
        EC.beginPath(); EC.moveTo(P[0],P[1]);
        EC.quadraticCurveTo(P[0]+Math.cos(a2)*r*3.2, P[1]+Math.sin(a2)*r*3.2,
                            P[0]+Math.cos(a2+sgn*0.5)*r*5.4, P[1]+Math.sin(a2+sgn*0.5)*r*5.4);
        EC.stroke();
      }
    }

  }else{
    /* ── 羽蛇 ─────────────────────────────────────────────────────
       奶白鱗身、藍白鳥羽。身側每隔幾節有一對羽鰭，尾端是羽扇。 */
    // 羽鰭：畫在身體之下，只露出兩側
    for(let i=3;i<pts.length-1;i+=3){
      const P=pts[i], sc=P[3], r=Math.max(0.8,sc*3.2);
      if(r<0.6) continue;
      const ang=segAng(i);
      const len=r*(3.4-i/pts.length*1.4)*(0.82+flap*0.18);
      for(const sgn of [1,-1]){
        EC.save(); EC.translate(P[0],P[1]); EC.rotate(ang+sgn*1.15);
        EC.fillStyle=shade(150,178,222,0.62);
        EC.beginPath(); EC.ellipse(len*0.5,0,len*0.5,r*0.42,0,0,Math.PI*2); EC.fill();
        EC.fillStyle=shade(236,242,252,0.55);
        EC.beginPath(); EC.ellipse(len*0.42,0,len*0.34,r*0.20,0,0,Math.PI*2); EC.fill();
        EC.restore();
      }
    }
    // 身體：奶白鱗身 + 背側藍灰
    for(let i=pts.length-1;i>=0;i--){
      const P=pts[i], sc=P[3], r=Math.max(0.9,sc*3.3);
      const ang=i>0?segAng(i):segAng(1);
      EC.save(); EC.translate(P[0],P[1]); EC.rotate(ang);
      EC.fillStyle=shade(228,220,196,1);
      EC.beginPath(); EC.ellipse(0,0,r*1.10,r*0.80,0,0,Math.PI*2); EC.fill();
      EC.fillStyle=shade(148,170,206,0.55);                 // 背側偏藍
      EC.beginPath(); EC.ellipse(0,-r*0.26,r*0.92,r*0.36,0,0,Math.PI*2); EC.fill();
      if(r>1.6){                                            // 鱗帶
        EC.strokeStyle=shade(186,174,146,0.75); EC.lineWidth=Math.max(0.5,r*0.15);
        EC.beginPath(); EC.arc(r*0.50,0,r*0.66,-1.2,1.2); EC.stroke();
      }
      EC.restore();
    }
    /* 鳥翼：一對大翼，分三根初級飛羽疊出來。
       ⚠ 鳥翼不是蟲翅：蟲翅是薄膜，拍動時整片縮放；鳥翼有羽片，
         拍動時是**上下揮**（在正俯視下讀成展幅變化＋前後掃掠），
         所以這裡除了展幅還讓整支翼繞肩點掃一個角度。 */
    {
      const P=pts[2]||pts[1]||pts[0];
      const sc=P[3], span=sc*62;
      if(span>1.5){
        const ang=segAng(2)||segAng(1);
        for(const sgn of [1,-1]){
          EC.save(); EC.translate(P[0],P[1]);
          EC.rotate(ang+sgn*(Math.PI/2)*(0.26+flap*0.30));
          for(let f=0;f<3;f++){
            const t=f/2;
            const L=span*(1-t*0.30), Cw=sc*(9-t*2.4)*(0.55+flap*0.55);
            EC.fillStyle=f===0?shade(244,248,255,0.72)
                       :f===1?shade(196,214,242,0.66)
                             :shade(140,168,214,0.60);
            EC.save(); EC.rotate(-0.20+t*0.42);
            EC.beginPath(); EC.ellipse(L*0.5,0,L*0.5,Cw,0,0,Math.PI*2); EC.fill();
            EC.restore();
          }
          EC.restore();
        }
      }
    }
    // 尾羽扇
    {
      const P=pts[pts.length-1], sc=P[3], L=sc*30;
      if(L>1.2){
        const ang=segAng(pts.length-1);
        EC.save(); EC.translate(P[0],P[1]); EC.rotate(ang);
        for(let f=-1;f<=1;f++){
          EC.fillStyle=shade(214,228,248,0.6);
          EC.save(); EC.rotate(f*0.34);
          EC.beginPath(); EC.ellipse(L*0.5,0,L*0.5,sc*3.2,0,0,Math.PI*2); EC.fill();
          EC.restore();
        }
        EC.restore();
      }
    }
    // 頭：楔形、黃眼、紅信
    {
      const P=pts[0], sc=P[3], r=Math.max(1,sc*3.8);
      const ang=Math.atan2(pts[0][1]-pts[1][1], pts[0][0]-pts[1][0]);
      EC.save(); EC.translate(P[0],P[1]); EC.rotate(ang);
      EC.fillStyle=shade(238,232,212,1);
      EC.beginPath(); EC.moveTo(r*1.5,0); EC.lineTo(-r*0.7,-r*0.85);
      EC.lineTo(-r*0.7,r*0.85); EC.closePath(); EC.fill();
      EC.restore();
      // 信子：分岔，隨振翅節奏吐納
      if(r>1.4){
        const tl=r*(1.6+0.9*Math.max(0,Math.sin(now*0.006+enemy.phase)));
        EC.strokeStyle=shade(206,32,36,0.95); EC.lineWidth=Math.max(0.5,r*0.16);
        for(const sgn of [1,-1]){
          EC.beginPath(); EC.moveTo(P[0]+Math.cos(ang)*r*1.3, P[1]+Math.sin(ang)*r*1.3);
          EC.lineTo(P[0]+Math.cos(ang+sgn*0.22)*(r*1.3+tl), P[1]+Math.sin(ang+sgn*0.22)*(r*1.3+tl));
          EC.stroke();
        }
      }
      drawEyes(P,ang,r,[255,210,60,238,176,30]);
    }
  }
  EC.restore();
  // 貼回主畫布：關平滑 → 自然像素化
  ctx.save();
  ctx.imageSmoothingEnabled=false;
  clipByTerrainDepth(zc,W/BW,VIEWH/BH);       // 山也該擋住怪
  ctx.drawImage(enemyFB,0,0,bwp,bhp,Math.round(x0),Math.round(y0),fw,fh);
  ctx.restore();
}

/* ══ 聚落（3D 飛行畫面）══
   聚落在世界裡是有大小的東西，不是地圖上的一枚圖釘 —— 飛過去就該看見城。
   投影與地標同一套（drawPlaces），差別是還要換算「一個世界單位在這個
   深度佔幾個螢幕像素」：橫向視錐在深度 z 的半寬就是 z，對應 BW 個緩衝像素，
   所以 1 世界單位 = W/(2z) 螢幕像素。
   ⚠ 遮擋要同時看「高度」與「深度」，而且不能只看每欄的**頂列**。
     頂列幾乎永遠是**最遠**那道山脊（越遠的高地投影越靠地平線＝列數越小），
     拿它的深度去判會得到「稜線比我遠 → 整欄都看得見」，於是欄位下半段的
     **近景**山坡明明擋在前面，城還是照畫上去 —— 那就是「城鎮浮在前景之前」。
     改查 ZTOP 深度階梯（見其定義）：取「比我近的地形」在該欄佔到的最高列，
     那一列以下全部該遮。
   ⚠ LOD 交給 settlement.js 依螢幕直徑自己決定，遠處自動退成符號。 */
/* 逐欄深度遮擋：把繪圖區裁成「這個深度看得到的部分」。
   ZTOP[b][i] 是「比 ZS_BOUND[b] 更近的地形」在第 i 欄佔到的最高列。
   取 bound ≤ Z 的那一層：它以下的像素全是比目標近的地形（該遮），
   以上則是天空或比目標遠的地形（該畫）。
   ⚠ 這不是逐像素深度緩衝，是把深度量化成 ZSLICES 層。誤差上限是一個
     切片寬（近景幾十世界單位，遠景幾百——但那邊早被霧洗掉了）。
   ⚠ 它只解決「地形 vs 物件」，不解決物件之間的前後，排序仍然要。
   ⚠ 逐欄一個 rect（BW=234 個）就好，不做 run 合併：路徑建構本來就便宜，
     合併的判斷式反而比省下來的多。 */
/* ⚠ c0/c1＝只裁「目標實際畫得到」的那幾欄。整排 BW 欄建一次路徑本身不貴，
     貴的是**裁切路徑越複雜、之後每一次繪製都要跟著付**（手機上非矩形 clip
     會逼出遮罩路徑）。城在畫面上通常只橫跨十幾欄，卻讓整張圖的貼回吃 234 欄的遮罩。 */
function clipByTerrainDepth(Z,sxk,syk,c0,c1){
  const a=(c0===undefined)?0:clamp(c0|0,0,BW-1);
  const b=(c1===undefined)?BW-1:clamp(c1|0,0,BW-1);
  const base=zSliceOf(Z)*BW;
  ctx.beginPath();
  for(let i=a;i<=b;i++){
    const lim=ZTOP[base+i];
    if(lim<=0) continue;
    ctx.rect(i*sxk,0,sxk+0.6,lim*syk);
  }
  ctx.clip();
}

/* 城的版本：城是**貼在地面上的一大張盤子**，不是一個點 —— 拿城心深度去裁，
   會把城自己的近半邊當成「被前面的地形擋住」而切掉（實測飛近帝都時下半座城
   整片消失）；拿整座的最近點去裁又太寬鬆，前面明明有山也擋不住。
   逐欄取「這一欄裡城最近的那一點」（CZMIN，由網格投影順手算出）才兩邊都對：
   比它更近的地形，在這一欄就是真的擋在城前面。 */
function clipByCityDepth(sxk,syk,c0,c1){
  ctx.beginPath();
  for(let i=c0;i<=c1;i++){
    const z=CZMIN[i];
    // 城沒佔到的欄位不裁：緩衝在那裡本來就是透明的
    const lim=(z===Infinity)?BH:ZTOP[zSliceOf(z)*BW+i];
    if(lim<=0) continue;
    ctx.rect(i*sxk,0,sxk+0.6,lim*syk);
  }
  ctx.clip();
}

/* nearestSettleZ：**已退役**（ver -448）。它原是「最近那座畫得出來的城有多深」——
   雲與城分兩趟畫時的分界。A 案之後地面歸地形管、雲永遠高過屋頂，
   雲整批畫在城之後即可（見 render），函式本體已刪。 */

function drawSettlements3D(scaleH,horizon,sinp,cosp){
  if(!window.Settlement || !MAPW) return;
  const sxk=W/BW, syk=VIEWH/BH;
  const nightK=clamp(1-sky().day*1.25,0,1);      // 入夜程度：城裡的燈火強度
  /* 「這個聚落局部座標是不是落在水上」。城的輪廓是幾何生成的圓角多邊形，
     不認得海岸線，臨海的城必然有一部分伸出陸塊 —— 那一段不能照常長房子
     （會變成蓋在海面上的樓），改畫成碼頭。 */
  const seaProbe=(s,lx,ly)=>{
    const mx=(s.mx+lx)|0, my=(s.my+ly)|0;
    if(mx<0||my<0||mx>=MAPW||my>=MAPH) return true;
    return HGT[my*MAPW+mx]<=CLOUD_H;
  };
  const list=[];
  for(const s of buildSettlements()){
    const dx=s.mx*MAP_SCALE-cam.x, dy=s.my*MAP_SCALE-cam.y;
    const z=dx*(-sinp)+dy*(-cosp);
    /* 剔除要按「城的角半徑」放寬，不能只看城心那一點。
       ⚠ 這裡原本是：sv 超過 ±1.35 就丟，而且 col 一旦落在 [0,BW) 之外
         就直接 continue —— col 是由 sv 換算的，等於實質剔除線是 sv∈[-1,1]，
         也就是**城心必須進畫面，整座城才會突然出現**。城越大越明顯：
         帝都半徑 440 世界單位，z=500 時本身就橫跨 sv ±0.88，
         城心還在畫面外時早該看到半座城了。
       ⚠ z 也不能用 60 當下限硬丟：飛到城上空時城心的 z 會趨近 0 甚至為負，
         但大半座城還在前方。改成「整座都在身後」才丟。 */
    /* ⚠ 手繪平面圖比城區半徑大（planW 1050 vs 2R 880），剔除半徑要取兩者較大，
       否則又會變成「城心進畫面才整張冒出來」—— 跟先前那個 bug 同一個病。 */
    const Rw=Math.max(SETTLE_R[s.tier]*MAP_SCALE, (s.planW||0)*0.72);
    if(z>ZFAR*0.9 || z<-Rw) continue;
    const zc=Math.max(z,40);                      // 角度換算用的安全深度
    const sv=(dx*cosp+dy*(-sinp))/zc;
    const svR=Rw/zc;                              // 城在畫面上的角半徑
    if(sv+svR<-1.35 || sv-svR>1.35) continue;
    const col=clamp(Math.round(((sv+1)/2)*BW),0,BW-1);
    /* ⚠ 地面高度用整平後的地基（s.gh），不是 HGT[中心格]。原本中心格若在海裡
       會退回 CLOUD_H＝把城擺在雲海表面上，那就是「城飄在雲上」的來源。 */
    const gh=s.gh;
    const by=((cam.alt-gh)/zc + zc*curvAt(sv))*scaleH+horizon;    // 緩衝列
    /* ⚠ 這裡不再做「整座剔除」：先前是拿城心那一欄判斷，城一大就會整座誤剔
       （中心那一欄擋不擋得住，跟整座城看不看得見無關）。改成畫的時候
       逐欄裁切（clipByTerrainDepth），被擋的部分自然消失、沒被擋的照畫。 */
    list.push({s, z, x:((sv+1)/2*BW)*sxk, y:by*syk});
  }
  list.sort((a,b)=>b.z-a.z);                                       // 遠的先畫
  for(const o of list){
    const sc=W/(2*Math.max(o.z,40));                                // 世界單位 → 螢幕像素
    const R=SETTLE_R[o.s.tier]*MAP_SCALE;                          // 半徑（世界單位）
    if(R*2*sc<3) continue;
    ctx.save();
    /* 城要跟同深度的地形吃同一份霧。原本只有一個「靠近 ZFAR 才淡出」的
       距離淡出，中景的城完全不吃霧 —— 周圍地表已經被霧洗掉一半、城還是
       滿對比，看起來就是浮在霧前面的一張圖。這裡直接套用地形那條霧曲線
       （FOG_START/FOG_MAX 同源），城才會跟著地面一起沉進大氣裡。 */
    const fogS=ZFAR*FOG_START;
    const fogK=clamp((o.z-fogS)/(ZFAR-fogS),0,1)*FOG_MAX;
    /* ⚠ 手繪平面圖的城延後裁切：它畫在自己的緩衝上（不吃 ctx 的 clip），
       真正需要裁的只有最後那一次貼回，而那時才知道實際外框是哪幾欄。
       程序生成的城則是逐筆畫在 ctx 上，必須先裁。 */
    /* ⚠ ver -445：底圖改在地形取樣迴圈裡畫之後，「這座城有手繪圖」的判定要把
       **取樣金字塔**也算進去 —— 縮圖開機就建好了，地面從第一幀就是插畫；
       只認全解析（飛近才載）的話，載到之前程序生成的白色小房子會疊在插畫上。 */
    const planCity=!!(o.s.plan&&(cityPlanArt[o.s.plan]||(CITYMASK&&CITY_PYR[o.s.plan])));
    // 同理，用**近端**深度而不是城心：R 是聚落半徑（世界單位）
    if(!planCity) clipByTerrainDepth(Math.max(o.z-R,1),sxk,syk);   // 前面的山稜要擋住城
    ctx.globalAlpha=clamp((ZFAR*0.9-o.z)/(ZFAR*0.30),0,1)*(1-fogK);
    /* 逐點投影：城的每個點走跟地形完全同一條投影式 → 天生黏在地表上。
       lx/ly 是聚落局部座標（地圖像素），先換成世界座標，再照 render() 那條
       公式算深度與螢幕位置。z 夾一個下限，免得飛到城正上方時分母爆掉。 */
    const gS=o.s.gh;
    const project=(lx,ly,hOff)=>{
      const dx=(o.s.mx+lx)*MAP_SCALE-cam.x, dy=(o.s.my+ly)*MAP_SCALE-cam.y;
      const zRaw=dx*(-sinp)+dy*(-cosp);
      const zz=zRaw<CITY_ZCLAMP?CITY_ZCLAMP:zRaw;
      const sv=(dx*cosp+dy*(-sinp))/zz;
      return [((sv+1)/2*BW)*sxk,
              (((cam.alt-gS-(hOff||0))/zz + zz*curvAt(sv))*scaleH+horizon)*syk,
              (W/(2*zz))*MAP_SCALE,    // 第三項：該點自己的尺度（螢幕px／地圖px）
              zRaw];                   // 第四項：**未夾的**深度，格子要靠它判斷該不該畫
    };
    /* project 的無配置版本：同一條式子，結果寫進 typed array 的 off..off+3。
       網格投影每幀要算幾千個點，光是回傳陣列的配置就吃掉一截畫格時間。 */
    const projectInto=(A,off,lx,ly,hOff)=>{
      const dx=(o.s.mx+lx)*MAP_SCALE-cam.x, dy=(o.s.my+ly)*MAP_SCALE-cam.y;
      const zRaw=dx*(-sinp)+dy*(-cosp);
      const zz=zRaw<CITY_ZCLAMP?CITY_ZCLAMP:zRaw;
      const sv=(dx*cosp+dy*(-sinp))/zz;
      A[off]  =((sv+1)/2*BW)*sxk;
      A[off+1]=(((cam.alt-gS-(hOff||0))/zz + zz*curvAt(sv))*scaleH+horizon)*syk;
      A[off+2]=(W/(2*zz))*MAP_SCALE;
      A[off+3]=zRaw;
    };
    /* 舊的仿射近似留著給尺寸用（建築量體大小仍以城中心的深度為準）。 */
    /* 地面壓縮率（tilt）：讓城真的躺在地上。
       橫向：1 世界單位 = sc 螢幕像素。
       縱向：地面列是 ((alt-gh)/z + z*curv)*scaleH，對 z 微分得
              (-(alt-gh)/z² + curv)*scaleH → 再乘 syk 換成螢幕像素。
       兩者相除就是這個深度的真實壓縮率。固定 0.58 是地圖畫面用的斜角常數，
       搬到 3D 裡就成了一張不隨視角變形的貼紙浮在地表上。
       ⚙ 夾上下限：飛得極低時 z² 分母會把值推到失控。 */
