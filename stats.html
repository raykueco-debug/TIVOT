<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<script src="orientation.js"></script>
<title>TIVOT · 後臺統計</title>
<style>
  :root{ --gold:#d9c68a; --gold-dim:rgba(217,198,138,.45); --ink:#cfc6b8; --bg:#07050c; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ background:var(--bg); color:var(--ink); font-family:"Noto Serif TC","Songti TC",serif;
    padding:24px 14px calc(24px + env(safe-area-inset-bottom)); max-width:560px; margin:0 auto; }
  h1{ font-size:17px; letter-spacing:6px; color:var(--gold); text-align:center; margin-bottom:4px; }
  .sub{ font-size:11px; letter-spacing:1px; color:var(--gold-dim); text-align:center; margin-bottom:18px; }
  .grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px; }
  .tile{ background:#0f0c16; border:1px solid var(--gold-dim); border-radius:10px; padding:12px; text-align:center; }
  .tile .v{ font-size:22px; color:var(--gold); letter-spacing:1px; font-variant-numeric:tabular-nums; }
  .tile .k{ font-size:11px; letter-spacing:2px; color:var(--gold-dim); margin-top:4px; }
  .panel{ background:#0f0c16; border:1px solid var(--gold-dim); border-radius:10px; padding:12px 14px; margin-bottom:14px; }
  .panel h2{ font-size:13px; letter-spacing:3px; color:var(--gold); margin-bottom:8px; }
  .panel p{ font-size:12px; line-height:1.9; }
  .panel a{ color:var(--gold); }
  table{ width:100%; border-collapse:collapse; font-size:12px; font-variant-numeric:tabular-nums; }
  td,th{ padding:5px 4px; border-bottom:1px solid rgba(217,198,138,.15); text-align:right; letter-spacing:.5px; }
  td:first-child,th:first-child{ text-align:left; }
  th{ color:var(--gold-dim); font-weight:normal; font-size:11px; letter-spacing:1px; }
  #msg{ text-align:center; font-size:12px; letter-spacing:1px; color:var(--gold-dim); padding:30px 10px; line-height:2; }
  .toolbar{ display:flex; justify-content:center; gap:12px; margin-bottom:18px; flex-wrap:wrap; }
  .btn{ display:block; padding:8px 22px; background:transparent;
    border:1px solid var(--gold-dim); color:var(--gold); border-radius:8px; font-family:inherit;
    font-size:12px; letter-spacing:3px; cursor:pointer; text-decoration:none; }
  .btn:active{ transform:scale(.96); }
  a.btn{ color:var(--ink); }
  #login{ display:none; flex-direction:column; align-items:center; gap:12px; padding:20px 0 30px; }
  #login input[type=password]{ width:min(280px,100%); padding:10px 12px; border-radius:8px; border:1px solid var(--gold-dim);
    background:#0f0c16; color:var(--ink); font-family:inherit; font-size:15px; letter-spacing:2px; text-align:center; }
  #login label{ font-size:12px; color:var(--gold-dim); letter-spacing:1px; }
</style>
</head>
<body>
  <h1>後 臺 統 計</h1>
  <div class="sub" id="verLine">聖約第四騎士團 · TIVOT</div>
  <div class="toolbar">
    <a class="btn" href="./">返回主頁</a>
    <button class="btn" id="refresh">重新整理</button>
    <button class="btn" id="logout">登出</button>
  </div>
  <form id="login">
    <input type="password" id="pass" placeholder="密碼" autocomplete="current-password">
    <label><input type="checkbox" id="remember" checked> 這台裝置記住密碼</label>
    <button class="btn" type="submit">進入</button>
  </form>
  <div id="msg">載入中……</div>
  <div id="content" style="display:none">
    <div class="grid">
      <div class="tile"><div class="v" id="tVisitors">–</div><div class="k">來訪人數</div></div>
      <div class="tile"><div class="v" id="tVisits">–</div><div class="k">來訪次數</div></div>
      <div class="tile"><div class="v" id="tPlayers">–</div><div class="k">玩家人數</div></div>
      <div class="tile"><div class="v" id="tPlays">–</div><div class="k">開始／繼續</div></div>
      <div class="tile"><div class="v" id="tPlayH">–</div><div class="k">總遊玩時間</div></div>
      <div class="tile"><div class="v" id="tPlayAvg">–</div><div class="k">每位玩家平均</div></div>
      <div class="tile"><div class="v" id="tClears">–</div><div class="k">打完試玩（人）</div></div>
      <div class="tile"><div class="v" id="tClearMed">–</div><div class="k">通關時間（中位數）</div></div>
      <div class="tile"><div class="v" id="tDl">–</div><div class="k">網頁離線下載完成</div></div>
      <div class="tile"><div class="v" id="tDlFail">–</div><div class="k">下載開始／失敗</div></div>
    </div>
    <div class="panel"><h2>每日（台北時間）</h2><table id="dailyTable"></table></div>
    <div class="panel"><h2>平台</h2><table id="platTable"></table></div>
    <div class="panel"><h2>最近打完試玩</h2><table id="clearTable"></table></div>
    <div class="panel"><h2>版本（近 14 天的玩家）</h2><table id="verTable"></table></div>
    <div class="panel"><h2>APK 下載（itch.io）</h2>
      <p>APK 的下載數在 itch.io 後台（只有你的帳號看得到）：
        <a href="https://itch.io/dashboard" target="_blank" rel="noopener">itch.io 儀表板</a> → saint-install → Analytics。</p></div>
    <div class="panel"><h2>其他</h2><table id="miscTable"></table></div>
  </div>

<script type="module">
import { TELEMETRY, VERSION } from './config.js';
/* ══ 密碼鎖的統計頁（ver -3091，Ray：「只有我能看」）══
   資料表 events 不准匿名讀；這一頁只呼叫資料庫函式 stats_summary(密碼)，密碼對了才回傳彙總。
   設定在 docs/STATS_SETUP.sql（Supabase SQL Editor 跑一次）。密碼只存在這台裝置（勾「記住」時）。 */
const $ = id => document.getElementById(id);
const KEY = 'tivot_stats_pass_v1';
$('verLine').textContent = '聖約第四騎士團 · ' + VERSION;

const hrs = ms => { const h = (ms||0)/3600000; return h >= 10 ? Math.round(h) + ' 小時' : h.toFixed(1) + ' 小時'; };
const mins = ms => ms==null ? '—' : (ms >= 3600000 ? (ms/3600000).toFixed(1) + ' 小時' : Math.round(ms/60000) + ' 分');
const PLAT = { web:'網頁', pwa:'加到主畫面', apk:'APK', '—':'（舊版沒記）' };
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function savedPass(){ try{ return localStorage.getItem(KEY) || sessionStorage.getItem(KEY); }catch(_){ return null; } }
function keepPass(p, remember){ try{ (remember ? localStorage : sessionStorage).setItem(KEY, p); }catch(_){} }
function forget(){ try{ localStorage.removeItem(KEY); sessionStorage.removeItem(KEY); }catch(_){} }

function showLogin(note){
  $('content').style.display='none'; $('login').style.display='flex';
  $('msg').textContent = note || '輸入密碼';
  setTimeout(()=>$('pass').focus(), 50);
}

async function load(pass){
  const r = await fetch(TELEMETRY.url.replace(/\/+$/,'') + '/rest/v1/rpc/stats_summary', {
    method:'POST',
    headers:{ 'Content-Type':'application/json', apikey:TELEMETRY.anonKey, Authorization:'Bearer '+TELEMETRY.anonKey },
    body: JSON.stringify({ pass, days:14 }),
  });
  if(r.ok) return r.json();
  const t = await r.text();
  if(/denied/.test(t)) { const e = new Error('denied'); e.denied = true; throw e; }
  if(r.status === 404 || /stats_summary/.test(t)) throw new Error('資料庫還沒設定 —— 到 Supabase SQL Editor 跑 docs/STATS_SETUP.sql');
  throw new Error('HTTP ' + r.status);
}

function table(el, head, rows){
  el.innerHTML = '<tr>' + head.map(h=>`<th>${h}</th>`).join('') + '</tr>'
    + (rows.length ? rows.map(r=>'<tr>' + r.map(c=>`<td>${esc(c)}</td>`).join('') + '</tr>').join('')
                   : `<tr><td colspan="${head.length}">尚無資料</td></tr>`);
}

function render(d){
  const T = d.total || {};
  $('tVisitors').textContent = T.visitors ?? 0;
  $('tVisits').textContent   = T.visits ?? 0;
  $('tPlayers').textContent  = T.players ?? 0;
  $('tPlays').textContent    = (T.play_new ?? 0) + '／' + (T.play_continue ?? 0);
  $('tPlayH').textContent    = hrs(T.play_ms);
  $('tPlayAvg').textContent  = T.players ? mins(T.play_ms / T.players) : '—';
  $('tClears').textContent   = T.clears ?? 0;
  $('tClearMed').textContent = mins(T.clear_med_ms);
  $('tDl').textContent       = T.dl_done ?? 0;
  $('tDlFail').textContent   = (T.dl_start ?? 0) + '／' + (T.dl_fail ?? 0);
  table($('dailyTable'), ['日期','來訪人','玩家','遊玩','下載','打完'],
    (d.daily||[]).map(x=>[x.day, x.visitors, x.players, hrs(x.play_ms), x.dl_done, x.clears]));
  table($('platTable'), ['平台','來訪人','玩家','遊玩','打完'],
    (d.platform||[]).map(x=>[PLAT[x.platform]||x.platform, x.visitors, x.players, hrs(x.play_ms), x.clears]));
  table($('clearTable'), ['時間','平台','累計遊玩'],
    (d.recent_clears||[]).map(x=>[x.ts, PLAT[x.platform]||x.platform||'—', mins(x.time_ms)]));
  table($('verTable'), ['版本','玩家'], (d.versions||[]).map(x=>[x.ver, x.players]));
  table($('miscTable'), ['項目','數量'], [
    ['通關時間：平均', mins(T.clear_avg_ms)], ['通關時間：最快', mins(T.clear_min_ms)],
    ['離線下載完成的裝置', T.dl_devices ?? 0], ['挑戰模式出陣', T.challenge_runs ?? 0], ['原作連結點擊', T.original_clicks ?? 0]]);
  $('login').style.display='none'; $('content').style.display='';
  $('msg').textContent = '更新於 ' + new Date().toLocaleString('zh-TW', { hour12:false });
}

async function go(pass){
  if(!TELEMETRY.url || !TELEMETRY.anonKey){ $('msg').textContent = '後端尚未設定（config.js 的 TELEMETRY）'; return; }
  if(!pass){ showLogin(); return; }
  $('msg').textContent = '載入中……';
  try{ render(await load(pass)); return true; }
  catch(e){
    if(e.denied){ forget(); showLogin('密碼不對'); }
    else{ $('msg').textContent = '讀取失敗：' + e.message; }
    return false;
  }
}

$('login').addEventListener('submit', async ev=>{
  ev.preventDefault();
  const p = $('pass').value; if(!p) return;
  if(await go(p)){ keepPass(p, $('remember').checked); $('pass').value=''; }
});
$('refresh').addEventListener('click', ()=>go(savedPass()));
$('logout').addEventListener('click', ()=>{ forget(); showLogin('已登出'); });
go(savedPass());
</script>
</body>
</html>
